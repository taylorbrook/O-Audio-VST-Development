# GitHub Actions Workflow for Cross-Platform Plugin Builds
# Template: Copy to .github/workflows/build-and-release.yml
#
# Triggers on tags matching: *-v* (e.g., OuariconTremolo-v1.4.0)
# Builds: macOS (Universal), Windows, Linux
# Creates: GitHub Release with all artifacts

name: Build and Release

on:
  push:
    tags:
      - '*-v*'  # Matches: PluginName-vX.Y.Z

env:
  JUCE_VERSION: '8.0.4'
  BUILD_TYPE: Release

jobs:
  # ============================================
  # Parse tag to extract plugin name and version
  # ============================================
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      plugin_name: ${{ steps.parse.outputs.plugin_name }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract plugin name (everything before -v)
          PLUGIN_NAME="${TAG%-v*}"
          # Extract version (everything after -v)
          VERSION="${TAG##*-v}"
          echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Parsed: Plugin=$PLUGIN_NAME, Version=$VERSION"

  # ============================================
  # macOS Build (Universal Binary: Intel + ARM)
  # ============================================
  build-macos:
    needs: parse-tag
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JUCE
        run: |
          # Download and extract JUCE
          curl -L "https://github.com/juce-framework/JUCE/releases/download/${{ env.JUCE_VERSION }}/juce-${{ env.JUCE_VERSION }}-osx.zip" -o juce.zip
          unzip -q juce.zip
          echo "JUCE_DIR=$PWD/JUCE" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DJUCE_DIR=${{ env.JUCE_DIR }}

      - name: Build Plugin
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          cmake --build build --target ${PLUGIN}_VST3 ${PLUGIN}_AU --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      - name: Package Artifacts
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          VERSION="${{ needs.parse-tag.outputs.version }}"
          ARTEFACTS="build/plugins/${PLUGIN}/${PLUGIN}_artefacts/${{ env.BUILD_TYPE }}"

          # Find product name from CMakeLists.txt
          PRODUCT_NAME=$(grep -E "PRODUCT_NAME" "plugins/${PLUGIN}/CMakeLists.txt" | head -1 | sed 's/.*PRODUCT_NAME "\([^"]*\)".*/\1/')

          mkdir -p dist

          # Copy VST3 and AU
          if [ -d "${ARTEFACTS}/VST3" ]; then
            cp -R "${ARTEFACTS}/VST3/"*.vst3 dist/
          fi
          if [ -d "${ARTEFACTS}/AU" ]; then
            cp -R "${ARTEFACTS}/AU/"*.component dist/
          fi

          # Create tarball
          cd dist
          tar -czf "../${PLUGIN}-${VERSION}-macos.tar.gz" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ needs.parse-tag.outputs.plugin_name }}-${{ needs.parse-tag.outputs.version }}-macos.tar.gz

  # ============================================
  # Windows Build
  # ============================================
  build-windows:
    needs: parse-tag
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JUCE
        run: |
          # Download and extract JUCE
          Invoke-WebRequest -Uri "https://github.com/juce-framework/JUCE/releases/download/${{ env.JUCE_VERSION }}/juce-${{ env.JUCE_VERSION }}-windows.zip" -OutFile juce.zip
          Expand-Archive -Path juce.zip -DestinationPath .
          echo "JUCE_DIR=$PWD\JUCE" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DJUCE_DIR=${{ env.JUCE_DIR }}

      - name: Build Plugin
        run: |
          $PLUGIN = "${{ needs.parse-tag.outputs.plugin_name }}"
          cmake --build build --target "${PLUGIN}_VST3" --config ${{ env.BUILD_TYPE }}

      - name: Package Artifacts
        run: |
          $PLUGIN = "${{ needs.parse-tag.outputs.plugin_name }}"
          $VERSION = "${{ needs.parse-tag.outputs.version }}"
          $ARTEFACTS = "build\plugins\$PLUGIN\${PLUGIN}_artefacts\${{ env.BUILD_TYPE }}"

          New-Item -ItemType Directory -Force -Path dist

          # Copy VST3
          if (Test-Path "$ARTEFACTS\VST3") {
            Copy-Item -Recurse "$ARTEFACTS\VST3\*" dist\
          }

          # Create ZIP
          Compress-Archive -Path dist\* -DestinationPath "$PLUGIN-$VERSION-windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ needs.parse-tag.outputs.plugin_name }}-${{ needs.parse-tag.outputs.version }}-windows.zip

  # ============================================
  # Linux Build
  # ============================================
  build-linux:
    needs: parse-tag
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.0-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Setup JUCE
        run: |
          # Download and extract JUCE
          curl -L "https://github.com/juce-framework/JUCE/releases/download/${{ env.JUCE_VERSION }}/juce-${{ env.JUCE_VERSION }}-linux.zip" -o juce.zip
          unzip -q juce.zip
          echo "JUCE_DIR=$PWD/JUCE" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DJUCE_DIR=${{ env.JUCE_DIR }}

      - name: Build Plugin
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          cmake --build build --target ${PLUGIN}_VST3 --config ${{ env.BUILD_TYPE }} -j$(nproc)

      - name: Package Artifacts
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          VERSION="${{ needs.parse-tag.outputs.version }}"
          ARTEFACTS="build/plugins/${PLUGIN}/${PLUGIN}_artefacts/${{ env.BUILD_TYPE }}"

          mkdir -p dist

          # Copy VST3
          if [ -d "${ARTEFACTS}/VST3" ]; then
            cp -R "${ARTEFACTS}/VST3/"*.vst3 dist/
          fi

          # Create tarball
          cd dist
          tar -czf "../${PLUGIN}-${VERSION}-linux.tar.gz" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ needs.parse-tag.outputs.plugin_name }}-${{ needs.parse-tag.outputs.version }}-linux.tar.gz

  # ============================================
  # Create GitHub Release
  # ============================================
  create-release:
    needs: [parse-tag, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract Release Notes
        id: release_notes
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          VERSION="${{ needs.parse-tag.outputs.version }}"
          CHANGELOG="plugins/${PLUGIN}/CHANGELOG.md"

          if [ -f "$CHANGELOG" ]; then
            # Extract section for this version
            # Looks for ## [VERSION] and captures until next ## [
            NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" "$CHANGELOG")

            if [ -z "$NOTES" ]; then
              NOTES="Release ${PLUGIN} v${VERSION}"
            fi
          else
            NOTES="Release ${PLUGIN} v${VERSION}"
          fi

          # Write to file for multiline support
          echo "$NOTES" > release_notes.md

      - name: Get Product Name
        id: product_name
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          PRODUCT_NAME=$(grep -E "PRODUCT_NAME" "plugins/${PLUGIN}/CMakeLists.txt" | head -1 | sed 's/.*PRODUCT_NAME "\([^"]*\)".*/\1/' || echo "$PLUGIN")
          echo "name=$PRODUCT_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.product_name.outputs.name }} v${{ needs.parse-tag.outputs.version }}"
          body_path: release_notes.md
          files: |
            artifacts/macos-build/*
            artifacts/windows-build/*
            artifacts/linux-build/*
          draft: false
          prerelease: false

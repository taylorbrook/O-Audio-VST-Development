# When to use this pattern
use_when:
  - Building tremolo, vibrato, chorus, flanger, phaser effects
  - Adding modulation to any parameter (filter cutoff, etc.)
  - Implementing auto-pan or stereo width effects
  - Creating rhythmic effects that sync to tempo


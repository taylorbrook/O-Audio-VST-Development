  key_insight: |
    OuariconAnalogEQ uses 4 ProcessorDuplicator<IIR::Filter> for LF,
    LMF, HMF, HF bands. Each band has frequency, gain, Q, and bypass.
    Coefficients are updated via a lambda listener on parameter changes.

# Code Snippet Template: Synth/Instrument Plugin CMake Setup
# CMakeLists.txt configuration for a synthesizer/instrument plugin

name: Synth/Instrument CMake Setup
category: cmake
stage: 1
version: 1.0.0
tags:
  - cmake
  - synth
  - instrument
  - midi
  - vst3
  - au
  - juce8

description: |
  CMakeLists.txt configuration for a MIDI instrument/synthesizer plugin.
  Key difference from effects: IS_SYNTH TRUE and NEEDS_MIDI_INPUT TRUE.

variables:
  plugin_name:
    description: Plugin target name (no spaces)
    example: OuariconMarimba

  product_name:
    description: Display name (can have spaces)
    example: "Ouaricon Marimba"

  plugin_code:
    description: 4-character plugin code
    example: OuMa

  manufacturer_code:
    description: 4-character manufacturer code
    example: OuAu

  company_name:
    description: Company name
    example: "Ouaricon Audio"

code:
  plugin_declaration: |
    juce_add_plugin(${plugin_name}
        COMPANY_NAME "${company_name}"
        PLUGIN_MANUFACTURER_CODE ${manufacturer_code}
        PLUGIN_CODE ${plugin_code}
        FORMATS VST3 AU Standalone
        PRODUCT_NAME "${product_name}"
        IS_SYNTH TRUE               # REQUIRED for instruments
        NEEDS_MIDI_INPUT TRUE       # Explicit MIDI requirement
        NEEDS_WEB_BROWSER TRUE      # If using WebView UI
    )

  buses_properties: |
    // In PluginProcessor constructor - OUTPUT ONLY for synths
    AudioProcessor(BusesProperties()
        .withOutput("Output", juce::AudioChannelSet::stereo(), true))
    // Note: NO withInput() for synthesizers!

  full_cmake: |
    # ${plugin_name} - Synthesizer/Instrument Plugin

    juce_add_plugin(${plugin_name}
        COMPANY_NAME "${company_name}"
        PLUGIN_MANUFACTURER_CODE ${manufacturer_code}
        PLUGIN_CODE ${plugin_code}
        FORMATS VST3 AU Standalone
        PRODUCT_NAME "${product_name}"
        IS_SYNTH TRUE
        NEEDS_MIDI_INPUT TRUE
        NEEDS_WEB_BROWSER TRUE
    )

    target_sources(${plugin_name}
        PRIVATE
            Source/PluginProcessor.cpp
            Source/PluginEditor.cpp
    )

    target_include_directories(${plugin_name}
        PRIVATE
            Source
    )

    target_link_libraries(${plugin_name}
        PRIVATE
            juce::juce_audio_processors
            juce::juce_audio_utils
            juce::juce_gui_extra
            juce::juce_dsp
        PUBLIC
            juce::juce_recommended_config_flags
            juce::juce_recommended_lto_flags
            juce::juce_recommended_warning_flags
    )

    juce_generate_juce_header(${plugin_name})

    target_compile_definitions(${plugin_name}
        PUBLIC
            JUCE_WEB_BROWSER=1
            JUCE_USE_CURL=0
            JUCE_VST3_CAN_REPLACE_VST2=0
    )

anti_patterns:
  - pattern: "IS_SYNTH.*missing|false"
    description: Missing IS_SYNTH flag for instrument
    fix: Add IS_SYNTH TRUE to juce_add_plugin - without it, DAW won't route MIDI

  - pattern: ".withInput.*synth"
    description: Adding input bus to synthesizer
    fix: Synths should only have output bus - remove withInput()

  - pattern: "NEEDS_MIDI_INPUT.*missing"
    description: Missing explicit MIDI input flag
    fix: Add NEEDS_MIDI_INPUT TRUE for clarity

provenance:
  plugins:
    - OuariconMarimba
  pattern_id: "stage-1-patterns.md #3, #5"

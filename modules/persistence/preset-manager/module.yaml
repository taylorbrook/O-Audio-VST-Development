# preset-manager module
# JSON-based preset persistence for Ouaricon plugins

name: preset-manager
version: 1.0.6
description: |
  JSON-based preset persistence with factory/user preset separation.
  Supports APVTS parameter serialization, navigation (next/previous),
  and DAW session save/restore via XML.

category: persistence
author: Ouaricon Audio

# What this module provides
provides:
  cpp-class: OuariconPresetManager
  js-module: preset-manager.js
  native-functions:
    - savePreset
    - loadPreset
    - loadPresetFromFile
    - getPresetList
    - getCurrentPreset
    - selectNextPreset
    - selectPreviousPreset
    - deletePreset
    - isFactoryPreset

# Configuration schema
config:
  plugin_name:
    type: string
    required: true
    description: |
      Plugin name used for directory creation.
      Presets stored in: ~/Library/Application Support/{plugin_name}/Presets/

  preset_extension:
    type: string
    default: ".json"
    description: File extension for preset files

  include_custom_state:
    type: boolean
    default: false
    description: |
      If true, module calls customSaveState() and customLoadState() callbacks
      for additional state like tuning data.

# Dependencies
dependencies: []

# JUCE requirements
requirements:
  juce_modules:
    - juce_core
    - juce_audio_processors
    - juce_data_structures
  cpp_standard: 20

# Source files
sources:
  cpp:
    - OuariconPresetManager.h
  js:
    - preset-manager.js

# Tracking
used_by:
  - plugin: OuariconMarimba
    version: 1.0.0

changelog:
  - version: 1.0.6
    date: 2026-08-16
    changes:
      - "O-Tapestop v1.1.0: optional setMigrationCallback(MigrationCallback) hook — applyPresetJson() invokes it with the preset's parameters DynamicObject and saved version string BEFORE the WR-01 reset/apply passes, so a plugin can remap stale normalized encodings (e.g. an AudioParameterChoice that gained an entry re-decodes the stored 0..1 fraction against the new choice count). Never called when unset — existing consumers unaffected"
  - version: 1.0.5
    date: 2026-07-16
    changes:
      - "CR-03 (O-simplePhysicalModelSynth review): applyPresetJson() applies meta parameters (isMetaParameter()) FIRST in both the reset-to-defaults and apply passes — a macro param applied after the params its listener derives would re-derive and stomp explicitly saved values (user presets / any preset co-authoring macro + derived params). No-op for plugins without meta params"
  - version: 1.0.4
    date: 2026-07-10
    changes:
      - "IN-17 (O-Wind review): initializeFactoryPresets() sanitizes preset.name before building the filename, matching load/save/delete — a factory name containing a path separator no longer writes outside factoryDir or silently drops the file"
  - version: 1.0.3
    date: 2026-07-07
    changes:
      - "WR-01 (O-SimpleReverb review): applyPresetJson() resets every parameter to its default before applying preset values, so presets missing a key (older saves, hand-authored factory defs) no longer inherit stale live state"
      - "WR-04 (O-SimpleReverb review): initializeFactoryPresets() guarded by a version-stamped '.factory-version' sentinel — factory .json files only rewritten when the plugin version changes, not on every processor construction (auval scans, each new instance); also removes the concurrent-construction file race"
  - version: 1.0.2
    date: 2026-07-01
    changes:
      - "(retroactive entry — shipped in-header via dd8117a without a yaml bump)"
      - "WR-04 (O-DigiDelay review): sanitizePresetName() strips path separators everywhere a name becomes a filename"
      - "IN-02: preset JSON records JucePlugin_VersionString instead of hard-coded '1.0.0'"
      - "IN-03: prev/next resume from last in-list index after an out-of-list file load"
      - "IN-01: docstring corrected to the real preset path (~/Library/{plugin}/Presets/)"
  - version: 1.0.1
    date: 2026-06-30
    changes:
      - "IN-04: _waitForNative() now bounds its poll (100 x 50ms) and logs an error instead of hanging initialize() forever when the JUCE backend never appears"
      - "IN-05: promptDelete() prefers an options.onConfirmDelete hook (reliable native/in-DOM dialog) and guards the window.confirm() fallback, since confirm() is a silent no-op/throw in some JUCE WebView backends; fail-safe aborts on no confirmation mechanism"
      - "Non-breaking: existing callers keep the guarded confirm() fallback; new onConfirmDelete option is optional"
  - version: 1.0.0
    date: 2026-01-12
    changes:
      - Initial extraction from OuariconMarimba
      - Genericized for multi-plugin use
      - Added callback interface for custom state

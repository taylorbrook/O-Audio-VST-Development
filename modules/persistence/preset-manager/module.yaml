# preset-manager module
# JSON-based preset persistence for Ouaricon plugins

name: preset-manager
version: 1.0.0
description: |
  JSON-based preset persistence with factory/user preset separation.
  Supports APVTS parameter serialization, navigation (next/previous),
  and DAW session save/restore via XML.

category: persistence
author: Ouaricon Audio

# What this module provides
provides:
  cpp-class: OuariconPresetManager
  js-module: preset-manager.js
  native-functions:
    - savePreset
    - loadPreset
    - loadPresetFromFile
    - getPresetList
    - getCurrentPreset
    - selectNextPreset
    - selectPreviousPreset
    - deletePreset
    - isFactoryPreset

# Configuration schema
config:
  plugin_name:
    type: string
    required: true
    description: |
      Plugin name used for directory creation.
      Presets stored in: ~/Library/Application Support/{plugin_name}/Presets/

  preset_extension:
    type: string
    default: ".json"
    description: File extension for preset files

  include_custom_state:
    type: boolean
    default: false
    description: |
      If true, module calls customSaveState() and customLoadState() callbacks
      for additional state like tuning data.

# Dependencies
dependencies: []

# JUCE requirements
requirements:
  juce_modules:
    - juce_core
    - juce_audio_processors
    - juce_data_structures
  cpp_standard: 20

# Source files
sources:
  cpp:
    - OuariconPresetManager.h
  js:
    - preset-manager.js

# Tracking
used_by:
  - plugin: OuariconMarimba
    version: 1.0.0

changelog:
  - version: 1.0.0
    date: 2026-01-12
    changes:
      - Initial extraction from OuariconMarimba
      - Genericized for multi-plugin use
      - Added callback interface for custom state

# Ouaricon Module Registry
# Master index of all reusable components for JUCE plugin development
#
# Modules are larger-scale than templates - they contain working, tested code
# that can be imported into plugins via CMake integration.
#
# Relationship to Templates:
# - Templates: Documentation/patterns (copy-paste with adaptation)
# - Modules: Working code (CMake import with configuration)

version: 1.0.0
last_updated: 2026-01-14
schema_version: 1.0.0

# Module categories
categories:
  - name: core
    description: Foundation modules required by most plugins (relay management, resource serving)

  - name: persistence
    description: State management (presets, session save/restore)

  - name: metering
    description: Audio level visualization (VU meters, peak indicators)

  - name: tuning
    description: Pitch and tuning systems (Scala, MTS-ESP)

  - name: modulation
    description: Modulation sources (LFO, envelope followers)

  - name: synthesis
    description: Sound generation (oscillators, modal resonators)

  - name: effects
    description: DSP effect modules (EQ, compression, delay, reverb)

  - name: ui
    description: UI components (keyboards, visualizations, controls)

# Module entries
modules:
  # ============================================================================
  # CORE MODULES
  # ============================================================================

  - name: licensing
    path: core/licensing
    version: 1.0.0
    description: |
      License activation, offline JWT token validation, and native overlay UI
      for Ouaricon plugin distribution. Integrates with Supabase licensing backend.
      Compile-flag gated via OUARICON_LICENSING_ENABLED.
    category: core
    provides:
      - cpp-class: OuariconLicense
      - cpp-class: OuariconLicenseOverlay
    config:
      supabase_url:
        type: string
        required: true
      supabase_anon_key:
        type: string
        required: true
      product_id:
        type: string
        required: true
    dependencies: []
    tags: [licensing, activation, jwt, offline]
    reuse_score: 10
    used_by: []

  - name: webview-relay-manager
    path: core/webview-relay-manager
    version: 1.0.0
    description: |
      Manages WebSliderRelay and WebToggleButtonRelay lifecycle with correct
      destruction order. Prevents 90% of release build crashes caused by
      attachments calling evaluateJavascript() on destroyed WebView.
    category: core
    provides:
      - cpp-header: WebViewRelayManager.h
    tags: [webview, relay, attachment, juce8, crash-prevention]
    reuse_score: 10
    used_by: []

  - name: resource-provider
    path: core/resource-provider
    version: 1.0.0
    description: |
      Generic resource provider for WebView binary data serving. Maps flattened
      BinaryData names back to URL paths with correct MIME types.
    category: core
    provides:
      - cpp-header: ResourceProvider.h
    tags: [webview, resources, binarydata, mime]
    reuse_score: 9
    used_by: []

  # ============================================================================
  # PERSISTENCE MODULES
  # ============================================================================

  - name: preset-manager
    path: persistence/preset-manager
    version: 1.0.0
    description: |
      JSON-based preset persistence with factory/user preset separation.
      Supports APVTS parameter serialization, navigation (next/previous),
      and DAW session save/restore via XML.
    category: persistence
    provides:
      - cpp-class: OuariconPresetManager
      - js-module: preset-manager.js
      - native-functions:
        - savePreset
        - loadPreset
        - getPresetList
        - deletePreset
        - selectNextPreset
        - selectPreviousPreset
    config:
      plugin_name:
        type: string
        required: true
        description: Plugin name for directory creation (e.g., "Ouaricon Marimba")
      preset_extension:
        type: string
        default: ".json"
        description: File extension for preset files
      include_custom_state:
        type: boolean
        default: false
        description: Whether to call custom save/load hooks
    dependencies: []
    tags: [presets, persistence, json, factory, user]
    reuse_score: 9
    used_by:
      - plugin: OuariconMarimba
        version: 1.0.0
      - plugin: OuariconTremolo
        version: 1.3.0
      - plugin: OFreqPulse
        version: 1.6.0

  # ============================================================================
  # METERING MODULES
  # ============================================================================

  - name: vu-meter
    path: metering/vu-meter
    version: 1.0.0
    description: |
      Thread-safe VU metering with atomic float polling (C++) and smooth
      animated display (JavaScript). Configurable attack/release ballistics,
      dB range mapping, and optional peak hold.
    category: metering
    provides:
      - cpp-header: VUMeterBridge.h
      - js-module: vu-meter.js
    config:
      poll_rate_hz:
        type: integer
        default: 30
        description: Timer polling rate in Hz
      attack_speed:
        type: float
        default: 0.4
        description: Attack interpolation speed (0-1)
      release_speed:
        type: float
        default: 0.15
        description: Release interpolation speed (0-1)
      min_db:
        type: float
        default: -60.0
        description: Minimum dB level
      max_db:
        type: float
        default: 3.0
        description: Maximum dB level
    dependencies: []
    tags: [vu, meter, levels, animation, atomic]
    reuse_score: 9
    used_by:
      - plugin: OuariconComp
        version: 1.0.0
      - plugin: OuariconAnalogEQ
        version: 1.0.0

  # ============================================================================
  # TUNING MODULES
  # ============================================================================

  - name: scala-tuning-engine
    path: tuning/scala-tuning-engine
    version: 2.0.0
    description: |
      Complete microtonal tuning system extracted from O-Lyrica with:
      - 12-TET, custom scales (Scala .scl/.kbm), MTS-ESP support
      - 5 visualization modes (Circle, Polar, Matrix, TrueKeys, Rotation)
      - Scale generator (EDO, Harmonic Series, Rank-2 temperaments)
      - 24+ factory presets (Historical, Just, EDO, Non-Octave, World)
      - Editable intervals table with tonic/modal rotation
      - HTML export with SVG pitch circle
      - Octave stretch for physical modeling
    category: tuning
    provides:
      - cpp-class: TuningEngine
      - cpp-class: ScaleGenerator
      - cpp-class: TuningExporter
      - cpp-class: EmbeddedTunings
      - js-module: tuning-panel.js
      - native-functions:
        - getTuningIntervals
        - setTuningIntervals
        - setSingleInterval
        - setTonicNote
        - getTonicNote
        - loadScalaFile
        - saveScalaFile
        - loadKBMFile
        - saveKBMFile
        - setOctaveStretch
        - getOctaveStretch
        - generateEDO
        - generateHarmonicSeries
        - generateRank2
        - applyGeneratedScale
        - getEmbeddedTuningList
        - loadEmbeddedTuning
        - exportTuningHTML
    config:
      param_prefix:
        type: string
        default: "tuning_"
        description: Prefix for APVTS parameter IDs
      default_mode:
        type: string
        default: "12tet"
        description: Default tuning mode on startup
      reference_pitch_default:
        type: float
        default: 440.0
        description: Default A4 reference pitch (Hz)
    dependencies: []
    tags: [tuning, scala, microtuning, mts-esp, frequency, pitch, visualization, generator, library]
    reuse_score: 10
    used_by: []

  - name: note-expression
    path: tuning/note-expression
    version: 1.1.0
    description: |
      VST3 Note Expression (kTuningTypeID) support for Dorico microtonal playback.
      Header-only C++ module under Ouaricon::NoteExpression — provides the NEC,
      the VST3Extensions subclass that owns the 128-slot pending-tuning table,
      a drain+correlate helper, and a voice-side applyPendingTuning helper.
      Requires a local JUCE patch (scripts/juce-patches/note-expression-juce-8.0.4.patch).
    category: tuning
    provides:
      - cpp-class: Ouaricon::NoteExpression::Controller
      - cpp-class: Ouaricon::NoteExpression::VST3Extensions
      - cpp-type: Ouaricon::NoteExpression::PendingTuningTable
      - cpp-free-function: Ouaricon::NoteExpression::applyPendingTuning
      - cpp-free-function: Ouaricon::NoteExpression::updatePendingFromEvents
    dependencies: []
    tags: [vst3, note-expression, dorico, microtuning, per-note-pitch, header-only]
    reuse_score: 10
    used_by:
      - plugin: OLyrica
        version: 2.3.0
      - plugin: O-Bells
        version: 4.1.0
      - plugin: O-Prism
        version: 1.17.0
      - plugin: O-Wind
        version: 1.16.0
      - plugin: O-IntonationPad
        version: 2.8.0
      - plugin: O-Reed
        version: 1.1.0
      - plugin: O-Bowed
        version: 1.3.0
      - plugin: O-Formant
        version: 1.25.0

  # ============================================================================
  # SYNTHESIS MODULES
  # ============================================================================

  - name: bow-friction
    path: synthesis/bow-friction
    version: 1.0.0
    description: |
      Memoryless hyperbolic friction model (HyperbolicFriction) and
      bow-envelope state (BowModel) for digital-waveguide bowed-string
      physical models. Extracted from O-Bowed Phase 2.1b. Treble-string
      defaults (mu_s=0.8, mu_d=0.3) preserved verbatim; bass consumers
      (O-Contrabass) inject mu_s=0.85, mu_d=0.25 via setter API in
      prepareToPlay.
    category: synthesis
    provides:
      - cpp-class: HyperbolicFriction
      - cpp-class: BowModel
    dependencies: []
    tags: [synthesis, physical-modelling, friction, waveguide, bowed-string]
    reuse_score: 8
    used_by:
      - plugin: O-Bowed
        version: 1.3.0
      - plugin: O-Contrabass
        version: 1.0.0

  # ============================================================================
  # EFFECTS MODULES
  # ============================================================================

  - name: analog-eq-unit
    path: effects/analog-eq-unit
    version: 1.2.0
    description: |
      4-band analog-style parametric EQ module with low/high shelves and two
      mid bells. Includes optional analog saturation for warmth. Designed as
      an embeddable unit for effects tabs in VST instruments. Same DSP as
      Ouaricon Analog Equalizer. Features signature dual-ring knobs where
      outer ring controls frequency and inner dial controls gain.
    category: effects
    provides:
      - cpp-class: AnalogEQUnit
      - js-module: analog-eq-unit.js
      - parameters:
        - lf_freq
        - lf_gain
        - lf_on
        - lmf_freq
        - lmf_gain
        - lmf_q
        - lmf_on
        - hmf_freq
        - hmf_gain
        - hmf_q
        - hmf_on
        - hf_freq
        - hf_gain
        - hf_on
        - output_gain
        - analog
    config:
      param_prefix:
        type: string
        default: "eq_"
        description: Prefix for parameter IDs to avoid conflicts
      compact_ui:
        type: boolean
        default: true
        description: Use compact UI layout (fits in effects tab)
      show_output_meter:
        type: boolean
        default: false
        description: Show VU meter (adds width to UI)
    dependencies: []
    tags: [dsp, eq, filter, effects, parametric, analog, saturation, webview]
    reuse_score: 9
    used_by:
      - plugin: OuariconMarimba
        version: 1.9.2

  - name: compressor-unit
    path: effects/compressor-unit
    version: 1.2.1
    description: |
      Compact dynamics compressor module for embedding in VST instruments.
      Same DSP as Ouaricon Compressor with simplified controls: Threshold,
      Ratio, Attack, Release. Fixed 6dB soft knee for musical response.
      Features clickable title for bypass toggle, canonical 10-segment seed
      knobs in Ouaricon naturalist aesthetic, and vertical GR LED strip.
    category: effects
    provides:
      - cpp-class: CompressorUnit
      - js-module: compressor-unit.js
      - parameters:
        - comp_enabled
        - comp_threshold
        - comp_ratio
        - comp_attack
        - comp_release
    config:
      param_prefix:
        type: string
        default: "comp_"
        description: Prefix for parameter IDs to avoid conflicts
      fixed_knee_db:
        type: float
        default: 6.0
        description: Fixed knee width in dB (not exposed in UI)
      show_gr_meter:
        type: boolean
        default: true
        description: Show gain reduction LED meter
    dependencies: []
    tags: [dsp, dynamics, compressor, effects, webview]
    reuse_score: 9
    used_by:
      - plugin: OuariconMarimba
        version: 1.9.3

  # ============================================================================
  # UI MODULES
  # ============================================================================

  - name: playable-keyboard
    path: ui/playable-keyboard
    version: 1.0.0
    description: |
      Interactive piano keyboard for WebView-based plugins. Supports mouse
      and touch input, sends MIDI notes via native function, highlights
      active keys, and integrates with pitch circle visualization.
    category: ui
    provides:
      - js-module: playable-keyboard.js
      - native-functions:
        - sendMidiNote
    config:
      octaves:
        type: integer
        default: 1
        description: Number of octaves to display (1-5)
      start_note:
        type: integer
        default: 60
        description: MIDI note number for first key (60 = C4)
      velocity:
        type: float
        default: 0.8
        description: Default velocity for mouse/touch input
    dependencies: []
    tags: [keyboard, midi, piano, touch, interactive]
    reuse_score: 8
    used_by:
      - plugin: OuariconMarimba
        version: 1.0.0

# ============================================================================
# HOW TO USE THIS REGISTRY
# ============================================================================
#
# 1. Find modules by category:
#    yq '.modules[] | select(.category == "persistence")' registry.yaml
#
# 2. Find modules by tag:
#    yq '.modules[] | select(.tags | contains(["webview"]))' registry.yaml
#
# 3. Check module version:
#    yq '.modules[] | select(.name == "preset-manager") | .version' registry.yaml
#
# 4. Add module to plugin:
#    See modules/cmake/OuariconModules.cmake for CMake integration
#
# 5. Check which plugins use a module:
#    yq '.modules[] | select(.name == "vu-meter") | .used_by' registry.yaml

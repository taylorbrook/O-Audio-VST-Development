# scala-tuning-engine module v3.3.0
# Complete microtonal tuning system extracted from O-Lyrica

name: scala-tuning-engine
version: 3.3.0
description: |
  Complete microtonal tuning system with:
  - 12-TET, custom scales (Scala .scl/.kbm), and MTS-ESP support
  - Thread-safe atomic frequency table for real-time audio
  - 5 visualization modes (Circle, Polar, Matrix, TrueKeys, Rotation)
  - Scale generator (EDO, Harmonic Series, Rank-2 temperaments)
  - 24+ embedded factory presets (Historical, Just, EDO, Non-Octave, World)
  - Editable intervals table with tonic/modal rotation
  - HTML documentation export with SVG pitch circle
  - Octave stretch for physical modeling

  **Integration:** This module uses the standalone ES6 class approach (recommended
  for complex modules). Copy-paste snippets are provided for C++ boilerplate.
  See snippets/INTEGRATION-CHECKLIST.md for step-by-step guide.

category: tuning
author: Ouaricon Audio

# BREAKING CHANGES from v1.0.0:
# - Complete rewrite with new API
# - New parameter naming (configurable prefix)
# - New JavaScript module API (ES6 class-based)
# - Added 4 new C++ classes (was just TuningEngine)

# What this module provides
provides:
  cpp-classes:
    - TuningEngine       # Core tuning engine
    - ScaleGenerator     # EDO, Harmonic, Rank-2 generation
    - TuningExporter     # HTML export with SVG
    - EmbeddedTunings    # 24+ factory presets
  js-modules:
    - tuning-panel.js    # Complete UI component
  native-functions:
    # Tuning data
    - getTuningIntervals
    - setTuningIntervals
    - getTuningName
    - setSingleInterval
    - setSingleIntervalEncoded
    # Tonic/rotation
    - setTonicNote
    - getTonicNote
    # File I/O
    - loadScalaFile
    - saveScalaFile
    - loadKBMFile
    - saveKBMFile
    # Presets
    - setTemperamentPreset
    - getTemperamentPreset
    # Octave stretch
    - getOctaveStretch
    - setOctaveStretch
    # Scale generation
    - generateEDO
    - generateHarmonicSeries
    - generateRank2
    - applyGeneratedScale
    # Embedded library
    - getEmbeddedTuningList
    - loadEmbeddedTuning
    - getEmbeddedTuningCategories
    # Export
    - exportTuningHTML

# Configuration schema
config:
  param_prefix:
    type: string
    default: "tuning_"
    description: Prefix for APVTS parameter IDs to avoid conflicts

  default_mode:
    type: string
    default: "12tet"
    enum: ["12tet", "scala", "mtsesp"]
    description: Default tuning mode on startup

  reference_pitch_min:
    type: float
    default: 400.0
    description: Minimum A4 reference pitch (Hz)

  reference_pitch_max:
    type: float
    default: 480.0
    description: Maximum A4 reference pitch (Hz)

  reference_pitch_default:
    type: float
    default: 440.0
    description: Default A4 reference pitch (Hz)

  show_visualizations:
    type: boolean
    default: true
    description: Show all 5 visualization modes

  show_scale_generator:
    type: boolean
    default: true
    description: Show scale generator section

  show_tuning_library:
    type: boolean
    default: true
    description: Show embedded tuning library

  allow_interval_editing:
    type: boolean
    default: true
    description: Allow direct editing of interval values

# Dependencies
dependencies: []

# JUCE requirements
requirements:
  juce_modules:
    - juce_core
  cpp_standard: 20

# Source files
sources:
  cpp:
    - cpp/TuningEngine.h
    - cpp/TuningEngine.cpp
    - cpp/ScaleGenerator.h
    - cpp/ScaleGenerator.cpp
    - cpp/TuningExporter.h
    - cpp/TuningExporter.cpp
    - cpp/EmbeddedTunings.h
    - cpp/EmbeddedTunings.cpp
  js:
    - js/tuning-panel.js
  css:
    - snippets/tuning-panel.css

# Copy-paste snippets for easier integration
snippets:
  INTEGRATION-CHECKLIST.md: Step-by-step integration guide with checkboxes
  parameters.cpp: APVTS parameter definitions for tuning controls
  processor-header.h: PluginProcessor.h additions (includes, members)
  native-functions.cpp: All 20+ WebView native function registrations
  persistence.cpp: State save/restore code for DAW sessions
  tuning-panel.css: Complete CSS styles for tuning panel UI

# APVTS parameters (with default prefix "tuning_")
parameters:
  - id: masterTune
    type: float
    range: [400.0, 480.0]
    default: 440.0
    description: A4 reference frequency in Hz

  - id: pitchBendRange
    type: float
    range: [1.0, 48.0]
    default: 2.0
    description: Pitch bend range in semitones

  - id: tuningMode
    type: choice
    choices: ["12-TET", "Custom", "MTS-ESP"]
    default: 0
    description: Active tuning mode

  - id: octaveStretch
    type: float
    range: [0.95, 1.25]
    default: 1.0
    description: Octave stretch factor for physical modeling

  - id: temperamentPreset
    type: choice
    choices:
      - "Equal 12-TET"
      - "Pythagorean"
      - "Zarlino"
      - "Meantone (1/4)"
      - "Werckmeister III"
      - "Kirnberger III"
      - "Vallotti"
      - "Well Tempered"
      - "Just Intonation"
      - "Bohlen-Pierce"
      - "Custom"
    default: 0
    description: Built-in temperament preset

# Embedded tuning categories
embedded_tuning_categories:
  - Historical
  - Just Intonation
  - Equal Divisions
  - Non-Octave
  - World

# Tracking
used_by: []

changelog:
  - version: 3.3.0
    date: 2026-11-02
    changes:
      - "Upstreamed review fixes from the O-Formant, O-Prism/O-Strata and O-Bells forks (FORK-REVIEW step 1). Gated by the new tests/: unit checks per finding, parity_gate.py against each fork and against 3.2.0"
      - "BEHAVIOUR, reaches every path-embedding consumer on its next rebuild (O-Bassoon, O-Bowed, O-Contrabass, O-MicrotonalSampler, O-Reed, O-Wind). No .kbm/.scl in play: frequency tables identical to 3.2.0"
      - "CR-07: loadKBMFile() no longer calls setMasterTune(). The file's reference note plays at the file's frequency (clamped 1-20000 Hz) and A4 is untouched, so 60 @ 261.63 plays middle C at 261.63, not 400. Master tune stops moving mapped notes unless the file has no positive frequency. A file's A4 also no longer retunes 12-TET mode. generateKBMFileContent() writes the mapping's own reference. Callers of setKbmReferenceFrequency() are unaffected: it still overrides, and must still be called after the load"
      - "CR-08/WR-12: .kbm map size outside 0-128 rejects the file (it drove an unbounded allocation). Octave degree clamps to 0-4096"
      - "IN-11: the .kbm formal octave degree sets the pitch jump per pattern, instead of always the period. Keys whose result leaves 1 Hz-100 kHz fall back to 12-TET (new here, so an absurd degree cannot reach a voice as inf or ~0 Hz)"
      - "IN-09: a mapped degree at or past the scale size wraps into the next period, instead of clamping to the period entry"
      - "WR-08/WR-11/IN-08: .scl parser. First token only, negative cents legal, blank description legal, malformed pitch or a count mismatch rejects the file, count must be 1-4096, non-finite pitches rejected. loadScalaFile() now returns false on files it used to half-load"
      - "WR-14: setSingleInterval() no longer wipes a 12-entry (11-degree) scale"
      - "CR-05: rebuildFrequencyTable() locks once around the 128-note loop"
      - "CR-09: generateRank2 clamps the period first and handles non-finite input; reduceAndSort uses fmod (the subtract loop could hang)"
      - "IN-17: Partch 43 has its 43 degrees (11/10 and 20/11 were missing)"
      - "Export: WR-15 sub-octave period exports as itself; IN-11 closing period draws no duplicate node; IN-07 no divide-by-zero on a degenerate scale; WR-20 .scl description is HTML-escaped"
      - "Forks NOT followed, on purpose: map size > 128 rejects (Formant clamps); degree past scale size wraps (Bells clamps to scaleSize-1, which is off-pitch per the Scala spec); octave-degree cap 4096 (Formant 128, which breaks large EDOs)"
      - "Still fork-only, not in the FORK-REVIEW list: Formant WR-06 (loadKBMFromString/getKBMState), WR-07 (silent x and out-of-range keys, needs 0 Hz handling in every voice), WR-20 linear-map .kbm export, IN-20 name locks; Prism IN-07 (Bohlen-Pierce 13th degree), WR-17 (writeStateTo/restoreStateFrom), atomic pitchBendRange, IN-09 isNoteMapped lock"
  - version: 3.2.0
    date: 2026-09-24
    changes:
      - "ADDITIVE: setKbmReferenceFrequency(hz) is an unclamped reference-note frequency for KBM-mapped notes. When it is > 0, it replaces the master tune in the KBM branch of calculateCustomFrequency"
      - "Added getKbmReferenceNote() / getKbmReferenceFrequency(). The second returns the file's value unclamped (loadKBMFile still clamps it to 400-480 through setMasterTune)"
      - "loadKBMFile() and resetKeyboardMapping() reset the override to 0, which is the legacy behaviour. Consumers that never call the setter produce unchanged output"
      - "Why: the master tune means A4 for 12-TET and unmapped notes, but it means the REFERENCE-NOTE frequency for mapped notes, clamped to 400-480. A standard '60 @ 261.63' .kbm played middle C at 400 Hz. First consumer: O-Bowed v1.9.4"
  - version: 3.1.0
    date: 2026-09-06
    changes:
      - "js/tuning-panel.js LOCALIZED: 37 data-i18n keys on every caption the panel renders"
      - "The two counted captions (label.intervalsCount, label.noteCount) carry their number in data-i18n-vars, so no inflection logic lives in a translated string"
      - "Added refreshPanelI18n() calling window.__reapplyI18n after each of the six innerHTML injections — the panel mounts LAZILY, long after initI18n() has swept the page"
      - "Static interval-list header now carries the keyed caption; its nested <span id=\"interval-count\"> is dropped (applyLabel writes textContent and would have destroyed it)"
      - "A CONSUMER MUST CARRY ALL 37 ROWS in every language it declares — a missing key renders the key name"
      - "Shipped with the 37 rows in all five path-embedding consumers: O-Bassoon (en/fr/zh-Hans), O-Bowed, O-Contrabass, O-Reed, O-Wind (en/fr)"
      - "NOT keyed, deliberately: note names, the true-keys A->B readout, numeric matrix/rotation cells and headers, tuning names, the Hz/stretch value readouts, the c unit, the arrow glyphs"
      - "This file was stale at 2.1.0 while registry.yaml carried 3.0.1; brought forward, the rest of the file left as found"

  - version: 2.1.0

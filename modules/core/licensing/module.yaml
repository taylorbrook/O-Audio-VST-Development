name: licensing
version: 1.0.0
description: |
  License activation, validation, and offline token management for
  Ouaricon plugin distribution. Integrates with the Supabase licensing
  backend (activate-license, validate-license, deactivate-license).

  Features:
  - Online activation with license key (OUA-XXXX-XXXX-XXXX)
  - Offline JWT token validation (30-day window)
  - Cross-platform machine ID (macOS, Windows, Linux)
  - Native JUCE overlay UI for license entry
  - Periodic background re-validation
  - Compile-flag gated (OUARICON_LICENSING_ENABLED)

category: core
author: Ouaricon Audio

provides:
  cpp-classes:
    - OuariconLicense
    - OuariconLicenseOverlay
  parameters: []

config:
  supabase_url:
    type: string
    required: true
    description: Supabase project URL (set via CMake define)

  supabase_anon_key:
    type: string
    required: true
    description: Supabase anonymous key (set via CMake define)

  product_id:
    type: string
    required: true
    description: Product identifier matching the backend (e.g., "ouaricon-tremolo")

dependencies: []

requirements:
  juce_modules:
    - juce_core
    - juce_gui_basics
  cpp_standard: 20

sources:
  cpp:
    - cpp/OuariconLicense.h
    - cpp/OuariconLicense.cpp
    - cpp/OuariconLicenseUI.h

tags:
  - licensing
  - activation
  - jwt
  - offline
  - drm

reuse_score: 10

used_by: []

changelog:
  - version: 1.0.0
    date: 2026-02-05
    changes:
      - Initial scaffold
      - Online activation and deactivation
      - Offline JWT token validation
      - Cross-platform machine ID (macOS, Windows, Linux)
      - Native JUCE overlay UI
      - Compile-flag gated via OUARICON_LICENSING_ENABLED

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terrain 3D prototype</title>
<style>
  html,body{margin:0;background:#1b1a17;color:#d8cfbf;font:12px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}
  #wrap{position:relative;width:640px;height:400px;margin:16px}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:absolute;left:8px;top:8px;pointer-events:none;white-space:pre;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="hud"></div>
</div>
<script>
(() => {
'use strict';
// ───────────────────────── configuration ─────────────────────────
const N = 64;                // heightmap side
const HUD = document.getElementById('hud');
const canvas = document.getElementById('gl');
const wrap = document.getElementById('wrap');

// ───────────────────────── state (pushed from native) ─────────────
const state = { frame: 0, phase: 0, cx: 0.5, cy: 0.5, radius: 0.3, table: null, dirty: true };
const stats = { frames: 0, sumMs: 0, maxMs: 0, lastMs: 0, mode: 'none', lastPushTs: 0 };

// Fake terrain: sum of sines, animated by "frame" (0..1 morph)
function makeTable(morph) {
  const t = new Float32Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = i / (N - 1) * 2 - 1, y = j / (N - 1) * 2 - 1;
    t[j * N + i] = 0.5 * Math.sin(3 * x + morph * 6.28) * Math.cos(2 * y) + 0.3 * Math.sin(7 * x * y + morph * 3);
  }
  return t;
}

// Native-push emulation. Real plugin: backend.addEventListener('terrainState', ...)
window.__pushState = (s) => {
  if (s.table) { state.table = s.table; state.dirty = true; }
  if (s.frame !== undefined) state.frame = s.frame;
  if (s.phase !== undefined) state.phase = s.phase;
  if (s.cx !== undefined) state.cx = s.cx;
  if (s.cy !== undefined) state.cy = s.cy;
  if (s.radius !== undefined) state.radius = s.radius;
  stats.lastPushTs = performance.now();
  needsDraw = true;
};

// ───────────────────────── tiny mat4 ─────────────────────────
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}
function lookAt(eye, c, up) {
  let zx = eye[0] - c[0], zy = eye[1] - c[1], zz = eye[2] - c[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
  let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
    -(xx * eye[0] + xy * eye[1] + xz * eye[2]), -(yx * eye[0] + yy * eye[1] + yz * eye[2]), -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1]);
}
function mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }
function xform(m, v) { const x = v[0], y = v[1], z = v[2]; const w = m[3] * x + m[7] * y + m[11] * z + m[15]; return [(m[0] * x + m[4] * y + m[8] * z + m[12]) / w, (m[1] * x + m[5] * y + m[9] * z + m[13]) / w, (m[2] * x + m[6] * y + m[10] * z + m[14]) / w]; }

const camera = { yaw: -0.6, pitch: 0.55, dist: 2.6 };
function viewProj(aspect) {
  const eye = [camera.dist * Math.cos(camera.pitch) * Math.sin(camera.yaw), camera.dist * Math.sin(camera.pitch), camera.dist * Math.cos(camera.pitch) * Math.cos(camera.yaw)];
  return mul(perspective(0.9, aspect, 0.1, 20), lookAt(eye, [0, 0, 0], [0, 1, 0]));
}

// ───────────────────────── WebGL2 path ─────────────────────────
let gl = null, prog = null, uVP, uColor, uZ;
let heightTex, gridVbo, gridIbo, gridCount, orbitVbo, ORBIT_N = 128;
let needsDraw = true;

const VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aXY;
uniform mat4 uVP; uniform sampler2D uH; uniform float uZ;
void main(){ float h = texture(uH, aXY).r; vec3 p = vec3(aXY.x*2.0-1.0, h*uZ, aXY.y*2.0-1.0); gl_Position = uVP*vec4(p,1.0); }`;
const FS = `#version 300 es
precision mediump float; uniform vec4 uColor; out vec4 o; void main(){ o = uColor; }`;
const VS_LINE = `#version 300 es
precision highp float; layout(location=0) in vec3 aP; uniform mat4 uVP; void main(){ gl_Position = uVP*vec4(aP,1.0); gl_PointSize = 9.0; }`;
let progLine, uVPL, uColorL;

function compile(g, vs, fs) {
  const mk = (t, s) => { const sh = g.createShader(t); g.shaderSource(sh, s); g.compileShader(sh); if (!g.getShaderParameter(sh, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(sh)); return sh; };
  const p = g.createProgram(); g.attachShader(p, mk(g.VERTEX_SHADER, vs)); g.attachShader(p, mk(g.FRAGMENT_SHADER, fs)); g.linkProgram(p);
  if (!g.getProgramParameter(p, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(p)); return p;
}

function initGL() {
  gl = canvas.getContext('webgl2', { antialias: true, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 'low-power' });
  if (!gl) return false;
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); stats.mode = 'lost'; }, false);
  canvas.addEventListener('webglcontextrestored', () => { setupGLResources(); stats.mode = 'webgl2'; state.dirty = true; needsDraw = true; }, false);
  setupGLResources();
  stats.mode = 'webgl2';
  return true;
}
function setupGLResources() {
  prog = compile(gl, VS, FS); uVP = gl.getUniformLocation(prog, 'uVP'); uColor = gl.getUniformLocation(prog, 'uColor'); uZ = gl.getUniformLocation(prog, 'uZ');
  progLine = compile(gl, VS_LINE, FS); uVPL = gl.getUniformLocation(progLine, 'uVP'); uColorL = gl.getUniformLocation(progLine, 'uColor');
  // Grid XY in [0,1]^2; height sampled from a R32F texture -> table update = 1 texSubImage2D, no geometry rebuild
  const xy = new Float32Array(N * N * 2); for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { xy[(j * N + i) * 2] = i / (N - 1); xy[(j * N + i) * 2 + 1] = j / (N - 1); }
  const idx = []; for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { if (i + 1 < N) idx.push(j * N + i, j * N + i + 1); if (j + 1 < N) idx.push(j * N + i, (j + 1) * N + i); }
  gridCount = idx.length;
  gridVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, gridVbo); gl.bufferData(gl.ARRAY_BUFFER, xy, gl.STATIC_DRAW);
  gridIbo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gridIbo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  heightTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, heightTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, N, N, 0, gl.RED, gl.FLOAT, null);
  orbitVbo = gl.createBuffer();
  state.dirty = true;
}

function orbitPoints(out) { // ellipse-ish orbit on the surface, height sampled from table (CPU, 128 pts — cheap)
  const t = state.table; for (let k = 0; k < ORBIT_N; k++) { const a = k / (ORBIT_N - 1) * Math.PI * 2; const u = state.cx + state.radius * Math.cos(a), v = state.cy + state.radius * Math.sin(a); out[k * 3] = u * 2 - 1; out[k * 3 + 1] = sampleH(t, u, v) * 0.6 + 0.01; out[k * 3 + 2] = v * 2 - 1; } return out; }
function sampleH(t, u, v) { if (!t) return 0; const x = Math.min(N - 1, Math.max(0, u * (N - 1))), y = Math.min(N - 1, Math.max(0, v * (N - 1))); const i = x | 0, j = y | 0, i1 = Math.min(N - 1, i + 1), j1 = Math.min(N - 1, j + 1), fx = x - i, fy = y - j; return (t[j * N + i] * (1 - fx) + t[j * N + i1] * fx) * (1 - fy) + (t[j1 * N + i] * (1 - fx) + t[j1 * N + i1] * fx) * fy; }
const orbitBuf = new Float32Array(ORBIT_N * 3);

function resizeBacking() {
  const dpr = window.devicePixelRatio || 1; const w = Math.round(wrap.clientWidth * dpr), h = Math.round(wrap.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; needsDraw = true; }
}

function drawGL() {
  resizeBacking();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0); gl.enable(gl.DEPTH_TEST); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const vp = viewProj(canvas.width / canvas.height);
  if (state.dirty && state.table) { gl.bindTexture(gl.TEXTURE_2D, heightTex); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, N, gl.RED, gl.FLOAT, state.table); state.dirty = false; }
  gl.useProgram(prog); gl.uniformMatrix4fv(uVP, false, vp); gl.uniform1f(uZ, 0.6); gl.uniform4f(uColor, 0.85, 0.72, 0.5, 0.55);
  gl.bindTexture(gl.TEXTURE_2D, heightTex);
  gl.bindBuffer(gl.ARRAY_BUFFER, gridVbo); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gridIbo); gl.drawElements(gl.LINES, gridCount, gl.UNSIGNED_SHORT, 0);
  // orbit line + scan point
  orbitPoints(orbitBuf);
  gl.useProgram(progLine); gl.uniformMatrix4fv(uVPL, false, vp); gl.uniform4f(uColorL, 0.42, 0.56, 0.31, 1);
  gl.bindBuffer(gl.ARRAY_BUFFER, orbitVbo); gl.bufferData(gl.ARRAY_BUFFER, orbitBuf, gl.DYNAMIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.disable(gl.DEPTH_TEST); gl.drawArrays(gl.LINE_STRIP, 0, ORBIT_N);
  const k = Math.round(state.phase * (ORBIT_N - 1)); gl.uniform4f(uColorL, 0.63, 0.32, 0.18, 1); gl.drawArrays(gl.POINTS, k, 1);
}

// ───────────────────────── Canvas 2D fallback ─────────────────────────
let ctx2d = null;
function initCanvas2D() { ctx2d = canvas.getContext('2d'); stats.mode = 'canvas2d'; return !!ctx2d; }
function draw2D() {
  resizeBacking(); const dpr = window.devicePixelRatio || 1; const w = wrap.clientWidth, h = wrap.clientHeight; const c = ctx2d;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  const vp = viewProj(w / h); const P = (x, y, z) => { const p = xform(vp, [x, y, z]); return [(p[0] * 0.5 + 0.5) * w, (0.5 - p[1] * 0.5) * h]; };
  const t = state.table; if (!t) return;
  c.strokeStyle = 'rgba(217,184,128,0.55)'; c.lineWidth = 1; c.beginPath();
  for (let j = 0; j < N; j += 2) { for (let i = 0; i < N; i++) { const p = P(i / (N - 1) * 2 - 1, t[j * N + i] * 0.6, j / (N - 1) * 2 - 1); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); } }
  for (let i = 0; i < N; i += 2) { for (let j = 0; j < N; j++) { const p = P(i / (N - 1) * 2 - 1, t[j * N + i] * 0.6, j / (N - 1) * 2 - 1); j ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); } }
  c.stroke();
  orbitPoints(orbitBuf); c.strokeStyle = '#6B8E4E'; c.lineWidth = 2; c.beginPath();
  for (let k = 0; k < ORBIT_N; k++) { const p = P(orbitBuf[k * 3], orbitBuf[k * 3 + 1], orbitBuf[k * 3 + 2]); k ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); } c.stroke();
  const k = Math.round(state.phase * (ORBIT_N - 1)); const p = P(orbitBuf[k * 3], orbitBuf[k * 3 + 1], orbitBuf[k * 3 + 2]);
  c.fillStyle = '#A0522D'; c.beginPath(); c.arc(p[0], p[1], 4.5, 0, 6.283); c.fill();
}

// ───────────────────────── interaction ─────────────────────────
// Drag on surface -> orbit centre (unproject onto y=0 plane). Wheel -> radius. Alt-drag -> orbit camera.
// In the plugin these would call Juce.getSliderState('orbitX').setNormalisedValue(...) between sliderDragStarted/Ended.
window.__paramOut = []; // records what would be sent to APVTS
function planeHit(px, py) {
  const w = wrap.clientWidth, h = wrap.clientHeight; const vp = viewProj(w / h);
  // brute-force: invert by sampling — good enough for a prototype; real impl inverts the matrix
  let best = null, bd = 1e9; for (let v = 0; v <= 1; v += 1 / 48) for (let u = 0; u <= 1; u += 1 / 48) { const p = xform(vp, [u * 2 - 1, 0, v * 2 - 1]); const sx = (p[0] * 0.5 + 0.5) * w, sy = (0.5 - p[1] * 0.5) * h; const d = (sx - px) ** 2 + (sy - py) ** 2; if (d < bd) { bd = d; best = [u, v]; } } return best;
}
let drag = null;
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); drag = e.altKey ? { cam: true, x: e.clientX, y: e.clientY } : { cam: false }; window.__paramOut.push(['sliderDragStarted', 'orbitX/orbitY']); onDrag(e); });
canvas.addEventListener('pointermove', onDrag);
canvas.addEventListener('pointerup', () => { drag = null; window.__paramOut.push(['sliderDragEnded', 'orbitX/orbitY']); });
function onDrag(e) { if (!drag) return; if (drag.cam) { camera.yaw += (e.clientX - drag.x) * 0.01; camera.pitch = Math.min(1.4, Math.max(0.1, camera.pitch + (e.clientY - drag.y) * 0.01)); drag.x = e.clientX; drag.y = e.clientY; needsDraw = true; return; } const r = canvas.getBoundingClientRect(); const hit = planeHit(e.clientX - r.left, e.clientY - r.top); if (hit) { state.cx = hit[0]; state.cy = hit[1]; window.__paramOut.push(['setNormalisedValue', 'orbitX', hit[0]], ['setNormalisedValue', 'orbitY', hit[1]]); needsDraw = true; } }
canvas.addEventListener('wheel', (e) => { e.preventDefault(); state.radius = Math.min(0.5, Math.max(0.02, state.radius - e.deltaY * 0.0015)); window.__paramOut.push(['setNormalisedValue', 'orbitRadius', state.radius * 2]); needsDraw = true; }, { passive: false });

// ───────────────────────── render loop (rAF, only when dirty) ─────────────────────────
function frame() {
  if (needsDraw && stats.mode !== 'lost') {
    needsDraw = false; const t0 = performance.now();
    if (gl) drawGL(); else if (ctx2d) draw2D();
    if (gl) gl.finish();
    const ms = performance.now() - t0; stats.frames++; stats.sumMs += ms; stats.maxMs = Math.max(stats.maxMs, ms); stats.lastMs = ms;
  }
  if (stats.frames % 10 === 0) HUD.textContent = `mode ${stats.mode}  dpr ${window.devicePixelRatio}  ${canvas.width}x${canvas.height}\nlast ${stats.lastMs.toFixed(2)} ms  avg ${(stats.sumMs / Math.max(1, stats.frames)).toFixed(2)} ms  max ${stats.maxMs.toFixed(2)} ms  n=${stats.frames}\nframe ${state.frame.toFixed(2)} phase ${state.phase.toFixed(2)} c=(${state.cx.toFixed(2)},${state.cy.toFixed(2)}) r=${state.radius.toFixed(2)}\ndrag=orbit centre  wheel=radius  alt-drag=camera`;
  requestAnimationFrame(frame);
}
window.__stats = stats; window.__state = state;
window.__resetStats = () => { stats.frames = 0; stats.sumMs = 0; stats.maxMs = 0; };

const forced = new URLSearchParams(location.search).get('mode');
if (forced === '2d' || !initGL()) initCanvas2D();
window.addEventListener('resize', () => { needsDraw = true; });
window.__pushState({ table: makeTable(0), frame: 0, phase: 0 });
requestAnimationFrame(frame);

// 30 Hz fake native push: phase advances every tick; a new table (morph) every 10th tick (~3 Hz),
// matching "frame morph is slow, playhead is fast".
let tick = 0;
window.__startFakePush = (tableEveryN = 10) => { window.__stopFakePush(); window.__pushTimer = setInterval(() => { tick++; const s = { phase: (tick % 90) / 90, frame: ((tick / 10) % 30) / 30 }; if (tick % tableEveryN === 0) s.table = makeTable(s.frame); window.__pushState(s); }, 1000 / 30); };
window.__stopFakePush = () => { if (window.__pushTimer) clearInterval(window.__pushTimer); window.__pushTimer = null; };
window.__startFakePush();
})();
</script>
</body>
</html>

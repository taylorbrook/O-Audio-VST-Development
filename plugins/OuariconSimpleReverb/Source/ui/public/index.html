<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouaricon Simple Reverb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2a2a2a;
            font-family: 'Garamond', 'Times New Roman', serif;
        }

        .plugin-container {
            width: 500px;
            height: 350px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 3px solid #5C4033;
            overflow: hidden;
        }

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .botanical-overlay {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            height: 75%;
            opacity: 0.3;
            pointer-events: none;
        }

        .content {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            color: #3C2F2F;
            letter-spacing: 2px;
            font-weight: normal;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        /* Type Selector */
        .type-row {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .type-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .type-label {
            font-size: 14px;
            color: #3C2F2F;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #TYPE {
            background: rgba(139, 168, 112, 0.3);
            border: 2px solid #5C4033;
            border-radius: 4px;
            padding: 6px 12px;
            font-family: 'Garamond', serif;
            font-size: 14px;
            color: #3C2F2F;
            cursor: pointer;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.15);
            min-width: 120px;
        }

        #TYPE:hover {
            background: rgba(139, 168, 112, 0.4);
        }

        #TYPE:focus {
            outline: 2px solid #8BA870;
            outline-offset: 2px;
        }

        /* Knobs Grid */
        .knobs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 10px 30px;
            flex: 1;
            align-items: center;
        }

        .knob-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .knob-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .knob {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(139, 168, 112, 0.5), rgba(92, 64, 51, 0.7));
            border: 3px solid #5C4033;
            box-shadow:
                inset 1px 1px 3px rgba(0,0,0,0.3),
                2px 2px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            position: relative;
        }

        .knob::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #3C2F2F;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .knob:hover {
            filter: brightness(1.1);
        }

        .knob-label {
            font-size: 12px;
            color: #3C2F2F;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .knob-value {
            font-size: 11px;
            color: #5C4033;
            font-variant-numeric: tabular-nums;
        }

        /* Hidden input for knob interaction */
        input[type="range"] {
            display: none;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 10px;
        }

        .version {
            font-size: 10px;
            color: #5C4033;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="plugin-container">
        <img src="img/paper.jpg" alt="Background" class="background">
        <img src="img/flora.png" alt="Botanical" class="botanical-overlay">

        <div class="content">
            <div class="header">
                <h1 class="title">Ouaricon Simple Reverb</h1>
            </div>

            <!-- Type Dropdown -->
            <div class="type-row">
                <div class="type-control">
                    <label class="type-label" for="TYPE">Type</label>
                    <select id="TYPE">
                        <option value="0">Booth</option>
                        <option value="1" selected>Room</option>
                        <option value="2">Hall</option>
                        <option value="3">Spring</option>
                        <option value="4">Plate</option>
                        <option value="5">Ambient</option>
                    </select>
                </div>
            </div>

            <!-- Knobs Grid (5 knobs: Character, Wet, Dry, Decay, Size) -->
            <div class="knobs-container">
                <!-- Row 1: Character (bipolar), Wet, Dry -->
                <div class="knob-control">
                    <div class="knob-wrapper">
                        <div class="knob" id="CHARACTER-knob"></div>
                    </div>
                    <span class="knob-label">Character</span>
                    <span class="knob-value" id="CHARACTER-value">0%</span>
                    <input type="range" id="CHARACTER" min="-100" max="100" step="0.1" value="0">
                </div>

                <div class="knob-control">
                    <div class="knob-wrapper">
                        <div class="knob" id="WET-knob"></div>
                    </div>
                    <span class="knob-label">Wet</span>
                    <span class="knob-value" id="WET-value">25%</span>
                    <input type="range" id="WET" min="0" max="100" step="0.1" value="25">
                </div>

                <div class="knob-control">
                    <div class="knob-wrapper">
                        <div class="knob" id="DRY-knob"></div>
                    </div>
                    <span class="knob-label">Dry</span>
                    <span class="knob-value" id="DRY-value">100%</span>
                    <input type="range" id="DRY" min="0" max="100" step="0.1" value="100">
                </div>

                <!-- Row 2: Decay, Size -->
                <div class="knob-control" style="grid-column: 1">
                    <div class="knob-wrapper">
                        <div class="knob" id="DECAY-knob"></div>
                    </div>
                    <span class="knob-label">Decay</span>
                    <span class="knob-value" id="DECAY-value">1.5s</span>
                    <input type="range" id="DECAY" min="0.1" max="10" step="0.01" value="1.5">
                </div>

                <div class="knob-control" style="grid-column: 3">
                    <div class="knob-wrapper">
                        <div class="knob" id="SIZE-knob"></div>
                    </div>
                    <span class="knob-label">Size</span>
                    <span class="knob-value" id="SIZE-value">50%</span>
                    <input type="range" id="SIZE" min="0" max="100" step="0.1" value="50">
                </div>
            </div>

            <div class="footer">
                <p class="version">Ouaricon Audio | v1.0.1</p>
            </div>
        </div>
    </div>

    <script type="module">
        // ====================================================================
        // JUCE FRONTEND LIBRARY IMPORT
        // ====================================================================
        import { getSliderState, getComboBoxState } from './js/juce/index.js';

        // Verify JUCE backend is connected
        if (!window.__JUCE__) {
            console.error("JUCE backend not available");
            throw new Error("JUCE backend not connected");
        }
        console.log("JUCE backend connected");

        // ====================================================================
        // HELPER FUNCTIONS
        // ====================================================================

        function updateKnobVisual(knobElement, normValue) {
            const angle = -135 + (normValue * 270);
            knobElement.style.transform = `rotate(${angle}deg)`;
        }

        // ====================================================================
        // TYPE PARAMETER (ComboBox)
        // ====================================================================

        const typeState = getComboBoxState("TYPE");
        const typeElement = document.getElementById("TYPE");

        // Initialize from current state
        typeElement.selectedIndex = typeState.getChoiceIndex();

        // Update JUCE when dropdown changes
        typeElement.addEventListener('change', (e) => {
            const index = parseInt(e.target.value);
            typeState.setChoiceIndex(index);
        });

        // Update dropdown when JUCE changes (automation, preset load)
        typeState.valueChangedEvent.addListener(() => {
            typeElement.selectedIndex = typeState.getChoiceIndex();
        });

        console.log("Bound ComboBox: TYPE");

        // ====================================================================
        // CHARACTER PARAMETER (-100% to +100%)
        // ====================================================================

        const characterState = getSliderState("CHARACTER");
        const characterKnob = document.getElementById("CHARACTER-knob");
        const characterValue = document.getElementById("CHARACTER-value");

        let isDraggingCharacter = false;
        let lastY_character = 0;

        function updateCharacterDisplay() {
            const norm = characterState.getNormalisedValue();
            const actual = -100 + norm * 200;  // -100 to +100
            characterValue.textContent = `${actual >= 0 ? '+' : ''}${actual.toFixed(0)}%`;
            updateKnobVisual(characterKnob, norm);
        }

        characterKnob.addEventListener("mousedown", (e) => {
            isDraggingCharacter = true;
            lastY_character = e.clientY;
            e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDraggingCharacter) return;
            const deltaY = lastY_character - e.clientY;
            let currentValue = characterState.getNormalisedValue();
            let newValue = currentValue + (deltaY * 0.005);
            newValue = Math.max(0, Math.min(1, newValue));
            characterState.setNormalisedValue(newValue);
            updateCharacterDisplay();
            lastY_character = e.clientY;
        });

        document.addEventListener("mouseup", () => { isDraggingCharacter = false; });

        characterState.valueChangedEvent.addListener(updateCharacterDisplay);
        updateCharacterDisplay();

        // ====================================================================
        // WET PARAMETER (0% to 100%)
        // ====================================================================

        const wetState = getSliderState("WET");
        const wetKnob = document.getElementById("WET-knob");
        const wetValue = document.getElementById("WET-value");

        let isDraggingWet = false;
        let lastY_wet = 0;

        function updateWetDisplay() {
            const norm = wetState.getNormalisedValue();
            const actual = norm * 100;
            wetValue.textContent = `${actual.toFixed(0)}%`;
            updateKnobVisual(wetKnob, norm);
        }

        wetKnob.addEventListener("mousedown", (e) => {
            isDraggingWet = true;
            lastY_wet = e.clientY;
            e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDraggingWet) return;
            const deltaY = lastY_wet - e.clientY;
            let currentValue = wetState.getNormalisedValue();
            let newValue = currentValue + (deltaY * 0.005);
            newValue = Math.max(0, Math.min(1, newValue));
            wetState.setNormalisedValue(newValue);
            updateWetDisplay();
            lastY_wet = e.clientY;
        });

        document.addEventListener("mouseup", () => { isDraggingWet = false; });

        wetState.valueChangedEvent.addListener(updateWetDisplay);
        updateWetDisplay();

        // ====================================================================
        // DRY PARAMETER (0% to 100%)
        // ====================================================================

        const dryState = getSliderState("DRY");
        const dryKnob = document.getElementById("DRY-knob");
        const dryValue = document.getElementById("DRY-value");

        let isDraggingDry = false;
        let lastY_dry = 0;

        function updateDryDisplay() {
            const norm = dryState.getNormalisedValue();
            const actual = norm * 100;
            dryValue.textContent = `${actual.toFixed(0)}%`;
            updateKnobVisual(dryKnob, norm);
        }

        dryKnob.addEventListener("mousedown", (e) => {
            isDraggingDry = true;
            lastY_dry = e.clientY;
            e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDraggingDry) return;
            const deltaY = lastY_dry - e.clientY;
            let currentValue = dryState.getNormalisedValue();
            let newValue = currentValue + (deltaY * 0.005);
            newValue = Math.max(0, Math.min(1, newValue));
            dryState.setNormalisedValue(newValue);
            updateDryDisplay();
            lastY_dry = e.clientY;
        });

        document.addEventListener("mouseup", () => { isDraggingDry = false; });

        dryState.valueChangedEvent.addListener(updateDryDisplay);
        updateDryDisplay();

        // ====================================================================
        // DECAY PARAMETER (0.1s to 10s with skew)
        // ====================================================================

        const decayState = getSliderState("DECAY");
        const decayKnob = document.getElementById("DECAY-knob");
        const decayValue = document.getElementById("DECAY-value");

        let isDraggingDecay = false;
        let lastY_decay = 0;

        function updateDecayDisplay() {
            const norm = decayState.getNormalisedValue();
            // Decay has skew 0.5, range 0.1-10.0
            const actual = 0.1 + Math.pow(norm, 1/0.5) * (10.0 - 0.1);
            decayValue.textContent = `${actual.toFixed(1)}s`;
            updateKnobVisual(decayKnob, norm);
        }

        decayKnob.addEventListener("mousedown", (e) => {
            isDraggingDecay = true;
            lastY_decay = e.clientY;
            e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDraggingDecay) return;
            const deltaY = lastY_decay - e.clientY;
            let currentValue = decayState.getNormalisedValue();
            let newValue = currentValue + (deltaY * 0.005);
            newValue = Math.max(0, Math.min(1, newValue));
            decayState.setNormalisedValue(newValue);
            updateDecayDisplay();
            lastY_decay = e.clientY;
        });

        document.addEventListener("mouseup", () => { isDraggingDecay = false; });

        decayState.valueChangedEvent.addListener(updateDecayDisplay);
        updateDecayDisplay();

        // ====================================================================
        // SIZE PARAMETER (0% to 100%)
        // ====================================================================

        const sizeState = getSliderState("SIZE");
        const sizeKnob = document.getElementById("SIZE-knob");
        const sizeValue = document.getElementById("SIZE-value");

        let isDraggingSize = false;
        let lastY_size = 0;

        function updateSizeDisplay() {
            const norm = sizeState.getNormalisedValue();
            const actual = norm * 100;
            sizeValue.textContent = `${actual.toFixed(0)}%`;
            updateKnobVisual(sizeKnob, norm);
        }

        sizeKnob.addEventListener("mousedown", (e) => {
            isDraggingSize = true;
            lastY_size = e.clientY;
            e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDraggingSize) return;
            const deltaY = lastY_size - e.clientY;
            let currentValue = sizeState.getNormalisedValue();
            let newValue = currentValue + (deltaY * 0.005);
            newValue = Math.max(0, Math.min(1, newValue));
            sizeState.setNormalisedValue(newValue);
            updateSizeDisplay();
            lastY_size = e.clientY;
        });

        document.addEventListener("mouseup", () => { isDraggingSize = false; });

        sizeState.valueChangedEvent.addListener(updateSizeDisplay);
        updateSizeDisplay();

        // ====================================================================
        // INITIALIZATION COMPLETE
        // ====================================================================
        console.log("Ouaricon Simple Reverb UI initialized");
    </script>
</body>
</html>

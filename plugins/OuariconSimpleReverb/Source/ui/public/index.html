<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouaricon Simple Reverb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2a2a2a;
            font-family: 'Garamond', 'Times New Roman', serif;
        }

        .plugin-container {
            width: 500px;
            height: 350px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 3px solid #5C4033;
            overflow: hidden;
        }

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .botanical-overlay {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            height: 75%;
            opacity: 0.3;
            pointer-events: none;
        }

        .content {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            color: #3C2F2F;
            letter-spacing: 2px;
            font-weight: normal;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        /* Type Selector */
        .type-row {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .type-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .type-label {
            font-size: 14px;
            color: #3C2F2F;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #TYPE {
            background: rgba(139, 168, 112, 0.3);
            border: 2px solid #5C4033;
            border-radius: 4px;
            padding: 6px 12px;
            font-family: 'Garamond', serif;
            font-size: 14px;
            color: #3C2F2F;
            cursor: pointer;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.15);
            min-width: 120px;
        }

        #TYPE:hover {
            background: rgba(139, 168, 112, 0.4);
        }

        #TYPE:focus {
            outline: 2px solid #8BA870;
            outline-offset: 2px;
        }

        /* Knobs Grid */
        .knobs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 10px 30px;
            flex: 1;
            align-items: center;
        }

        .knob-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .knob-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .knob {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(139, 168, 112, 0.5), rgba(92, 64, 51, 0.7));
            border: 3px solid #5C4033;
            box-shadow:
                inset 1px 1px 3px rgba(0,0,0,0.3),
                2px 2px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            position: relative;
        }

        .knob::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #3C2F2F;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .knob:hover {
            filter: brightness(1.1);
        }

        .knob-label {
            font-size: 12px;
            color: #3C2F2F;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .knob-value {
            font-size: 11px;
            color: #5C4033;
            font-variant-numeric: tabular-nums;
        }

        /* Hidden input for knob interaction */
        input[type="range"] {
            display: none;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 10px;
        }

        .version {
            font-size: 10px;
            color: #5C4033;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="plugin-container">
        <img src="img/paper.jpg" alt="Background" class="background">
        <img src="img/flora.png" alt="Botanical" class="botanical-overlay">

        <div class="content">
            <div class="header">
                <h1 class="title">Simple Reverb</h1>
            </div>

            <!-- Type Dropdown -->
            <div class="type-row">
                <div class="type-control">
                    <label class="type-label" for="TYPE">Type</label>
                    <select id="TYPE">
                        <option value="0">Booth</option>
                        <option value="1" selected>Room</option>
                        <option value="2">Hall</option>
                        <option value="3">Spring</option>
                        <option value="4">Plate</option>
                        <option value="5">Ambient</option>
                    </select>
                </div>
            </div>

            <!-- Knobs Grid (5 knobs: Character, Wet, Dry, Decay, Size) -->
            <div class="knobs-container">
                <!-- Row 1: Character (bipolar), Wet, Dry -->
                <div class="knob-control">
                    <div class="knob-wrapper">
                        <div class="knob" id="CHARACTER-knob"></div>
                    </div>
                    <span class="knob-label">Character</span>
                    <span class="knob-value" id="CHARACTER-value">0%</span>
                    <input type="range" id="CHARACTER" min="-100" max="100" step="0.1" value="0">
                </div>

                <div class="knob-control">
                    <div class="knob-wrapper">
                        <div class="knob" id="WET-knob"></div>
                    </div>
                    <span class="knob-label">Wet</span>
                    <span class="knob-value" id="WET-value">25%</span>
                    <input type="range" id="WET" min="0" max="100" step="0.1" value="25">
                </div>

                <div class="knob-control">
                    <div class="knob-wrapper">
                        <div class="knob" id="DRY-knob"></div>
                    </div>
                    <span class="knob-label">Dry</span>
                    <span class="knob-value" id="DRY-value">100%</span>
                    <input type="range" id="DRY" min="0" max="100" step="0.1" value="100">
                </div>

                <!-- Row 2: Decay, Size -->
                <div class="knob-control" style="grid-column: 1">
                    <div class="knob-wrapper">
                        <div class="knob" id="DECAY-knob"></div>
                    </div>
                    <span class="knob-label">Decay</span>
                    <span class="knob-value" id="DECAY-value">1.5s</span>
                    <input type="range" id="DECAY" min="0.1" max="10" step="0.01" value="1.5">
                </div>

                <div class="knob-control" style="grid-column: 3">
                    <div class="knob-wrapper">
                        <div class="knob" id="SIZE-knob"></div>
                    </div>
                    <span class="knob-label">Size</span>
                    <span class="knob-value" id="SIZE-value">50%</span>
                    <input type="range" id="SIZE" min="0" max="100" step="0.1" value="50">
                </div>
            </div>

            <div class="footer">
                <p class="version">Ouaricon Audio | v1.0.0</p>
            </div>
        </div>
    </div>

    <script type="module">
        import * as Juce from './js/juce/index.js';

        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Simple Reverb UI loaded');

            // Bind TYPE choice parameter (ComboBox)
            bindComboBox('TYPE');

            // Bind float parameters (Sliders)
            bindKnob('CHARACTER', -100, 100, v => `${v >= 0 ? '+' : ''}${v.toFixed(0)}%`);
            bindKnob('WET', 0, 100, v => `${v.toFixed(0)}%`);
            bindKnob('DRY', 0, 100, v => `${v.toFixed(0)}%`);
            bindKnob('DECAY', 0.1, 10, v => `${v.toFixed(1)}s`);
            bindKnob('SIZE', 0, 100, v => `${v.toFixed(0)}%`);
        });

        // Bind choice parameter (dropdown)
        function bindComboBox(paramId) {
            const element = document.getElementById(paramId);
            if (!element) {
                console.error(`Element not found: ${paramId}`);
                return;
            }

            try {
                const state = Juce.getComboBoxState(paramId);

                // Initialize element with current value
                element.selectedIndex = state.selectedId;

                // Update JUCE when element changes
                element.addEventListener('change', (e) => {
                    state.selectedId = parseInt(e.target.value);
                });

                // Update element when JUCE changes (automation, preset load)
                state.valueChangedEvent.addListener((newId) => {
                    element.selectedIndex = newId;
                });

                console.log(`Bound ComboBox: ${paramId}`);
            } catch (error) {
                console.error(`Error binding ComboBox ${paramId}:`, error);
            }
        }

        // Bind float parameter (knob)
        function bindKnob(paramId, minValue, maxValue, formatFn) {
            const input = document.getElementById(paramId);
            const knobElement = document.getElementById(`${paramId}-knob`);
            const valueDisplay = document.getElementById(`${paramId}-value`);

            if (!input || !knobElement || !valueDisplay) {
                console.error(`Elements not found for knob: ${paramId}`);
                return;
            }

            try {
                const state = Juce.getSliderState(paramId);

                // Initialize display
                const updateVisuals = (normValue) => {
                    // Denormalize value (0-1 → minValue-maxValue)
                    const actualValue = minValue + normValue * (maxValue - minValue);

                    // Update value display
                    valueDisplay.textContent = formatFn(actualValue);

                    // Update knob rotation (270 degrees range, -135 to +135)
                    const angle = -135 + (normValue * 270);
                    knobElement.style.transform = `rotate(${angle}deg)`;

                    // Update hidden input for tracking
                    input.value = actualValue;
                };

                // Initialize with current value
                updateVisuals(state.normalisedValue);

                // Knob mouse interaction
                let isDragging = false;
                let startY = 0;
                let startValue = 0;

                knobElement.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    startY = e.clientY;
                    startValue = state.normalisedValue;
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;

                    const deltaY = startY - e.clientY;
                    const sensitivity = 0.005;
                    let newValue = startValue + (deltaY * sensitivity);
                    newValue = Math.max(0, Math.min(1, newValue));

                    state.normalisedValue = newValue;
                    updateVisuals(newValue);
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                // Update visuals when JUCE changes (automation, preset load)
                state.valueChangedEvent.addListener((newValue) => {
                    updateVisuals(newValue);
                });

                // Hidden input change (for debugging)
                input.addEventListener('input', (e) => {
                    const actualValue = parseFloat(e.target.value);
                    const normValue = (actualValue - minValue) / (maxValue - minValue);
                    state.normalisedValue = normValue;
                    updateVisuals(normValue);
                });

                console.log(`Bound Knob: ${paramId}`);
            } catch (error) {
                console.error(`Error binding knob ${paramId}:`, error);
            }
        }
    </script>
</body>
</html>

# v7 UI Design Specification
# Generated: 2026-01-12
# Plugin: Ouaricon Digital Delay
# Aesthetic: Ouaricon Audio Naturalist (natural-size butterfly, paper texture, LED output meter)
# Layout: Ultra-compact rack mount style - labels above/values below
# CHANGES FROM v6:
#   1. TIGHTER KNOB SPACING - ~75-80px between centers (was ~95px), no overlap with meter
#   2. OuariconComp-STYLE LED METER - 14 vertical LED segments (low/mid/high colors)
#   3. BUTTERFLY AT NATURAL SIZE - 800×1280px, centered on body (not scaled)

window:
  width: 700
  height: 196
  resizable: false

colors:
  background: "#F5E6D3"  # Aged paper fallback
  text: "#3C2F2F"  # Dark brown
  border: "#8B7355"  # Walnut brown
  accent_green: "#6B8E4E"  # Toggle active state
  accent_green_hover: "#8BAF70"  # Hover state
  meter_low: "#8BA870"  # LED low segments
  meter_mid: "#6B8E4E"  # LED mid segments
  meter_high: "#C9A27B"  # LED high segments
  meter_inactive: "#8B7355"  # LED inactive segments
  meter_background: "rgba(139, 115, 85, 0.1)"  # Meter container background
  knob_segment_light: "#F5DEB3"  # Cream
  knob_segment_dark: "#E8D5B7"  # Slightly darker cream
  knob_border: "#8B7355"  # Brown border

typography:
  family: "Garamond, 'Times New Roman', serif"
  title_size: "16px"
  title_spacing: "2.5px"
  label_size: "9px"
  label_spacing: "0.8px"
  value_size: "11px"

layout:
  type: horizontal
  description: "Ultra-compact rack mount - tighter knob spacing, LED meter on right edge"
  sections:
    - id: header
      description: "Plugin title area (minimal for ultra-compact style)"
      region: { x: 0, y: 0, width: 700, height: 32 }

    - id: controls_row
      description: "All controls in single horizontal row with tighter spacing"
      region: { x: 20, y: 50, width: 615, height: 130 }

    - id: led_meter_section
      description: "Vertical LED output meter on far right edge (OuariconComp style)"
      region: { x: 665, y: 40, width: 18, height: 140 }

controls:
  # SYNC TOGGLE (First control - left side, aligned with knob labels)
  - id: sync
    type: toggle
    label: "SYNC"
    parameter: "sync"
    default: false
    position: { x: 30, y: 70 }
    size: { width: 50, height: 24 }
    style: botanical_toggle
    description: "Enable/disable tempo sync"

  # DIVISION DROPDOWN (Second control - same position as v6)
  - id: division
    type: combo
    label: "DIVISION"
    parameter: "division"
    parameter_type: choice
    choices: ["1/4", "1/8", "1/16", "1/4D", "1/8D", "1/16D", "1/4T", "1/8T", "1/16T", "1/4(5)", "1/8(5)", "1/16(5)"]
    default: 1  # 1/8
    position: { x: 15, y: 118 }
    size: { width: 80, height: 24 }
    style: botanical_dropdown
    description: "Note subdivision when synced to tempo"

  # TIME KNOB (Third control - TIGHTER SPACING)
  - id: time
    type: knob
    label: "TIME"
    parameter: "time"
    range: [1.0, 2000.0]
    unit: "ms"
    default: 500.0
    decimals: 0
    position: { x: 115, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Primary delay time control in free mode"

  # FEEDBACK KNOB (TIGHTER - 80px from TIME)
  - id: feedback
    type: knob
    label: "FEEDBACK"
    parameter: "feedback"
    range: [0.0, 100.0]
    unit: "%"
    default: 30.0
    decimals: 0
    position: { x: 195, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Amount of repeats"

  # SPREAD KNOB (TIGHTER - 80px from FEEDBACK)
  - id: spread
    type: knob
    label: "SPREAD"
    parameter: "spread"
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0
    decimals: 0
    position: { x: 275, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Stereo width (0=preserve input, 100=wide)"

  # MOD KNOB (TIGHTER - 80px from SPREAD)
  - id: mod
    type: knob
    label: "MOD"
    parameter: "mod"
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0
    decimals: 0
    position: { x: 355, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Delay time modulation amount"

  # WET KNOB (TIGHTER - 80px from MOD)
  - id: wet
    type: knob
    label: "WET"
    parameter: "wet"
    range: [0.0, 100.0]
    unit: "%"
    default: 30.0
    decimals: 0
    position: { x: 435, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Wet signal level"

  # DRY KNOB (TIGHTER - 80px from WET, ensures 15px gap from meter)
  - id: dry
    type: knob
    label: "DRY"
    parameter: "dry"
    range: [0.0, 100.0]
    unit: "%"
    default: 100.0
    decimals: 0
    position: { x: 515, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Dry signal level"

# Value displays (below each knob) - NO BOXES (transparent, no border)
value_displays:
  - id: time_value
    for: time
    position: { x: 115, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value} ms"
    style: value_display_clean

  - id: feedback_value
    for: feedback
    position: { x: 195, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display_clean

  - id: spread_value
    for: spread
    position: { x: 275, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display_clean

  - id: mod_value
    for: mod
    position: { x: 355, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display_clean

  - id: wet_value
    for: wet
    position: { x: 435, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display_clean

  - id: dry_value
    for: dry
    position: { x: 515, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display_clean

# Labels (above each knob and controls)
labels:
  - id: sync_label
    for: sync
    text: "SYNC"
    position: { x: 30, y: 54 }
    size: { width: 50, height: 12 }
    style: knob_label

  - id: division_label
    for: division
    text: "DIVISION"
    position: { x: 15, y: 102 }
    size: { width: 80, height: 12 }
    style: dropdown_label

  - id: time_label
    for: time
    text: "TIME"
    position: { x: 115, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: feedback_label
    for: feedback
    text: "FEEDBACK"
    position: { x: 195, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: spread_label
    for: spread
    text: "SPREAD"
    position: { x: 275, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: mod_label
    for: mod
    text: "MOD"
    position: { x: 355, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: wet_label
    for: wet
    text: "WET"
    position: { x: 435, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: dry_label
    for: dry
    text: "DRY"
    position: { x: 515, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: led_meter_label
    for: led_meter
    text: "OUT"
    position: { x: 665, y: 25 }
    size: { width: 18, height: 12 }
    style: meter_label

special_elements:
  # PLUGIN TITLE
  - id: title
    type: text
    text: "OUARICON DIGITAL DELAY"
    position: { x: 0, y: 12 }
    size: { width: 700, height: 22 }
    align: center
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "16px"
    letter_spacing: "2.5px"
    color: "#3C2F2F"
    layer: decorative

  # BACKGROUND TEXTURE (Bottom layer)
  - id: paper_background
    type: image
    src: "img/paper1.jpg"
    position: { x: 0, y: 0 }
    size: { width: 700, height: 196 }
    opacity: 1.0
    layer: background
    description: "Aged paper texture background"

  # BUTTERFLY AT NATURAL SIZE (800×1280px - centered on body)
  - id: butterfly_overlay
    type: image
    src: "img/butterfly2_Black and white.png"
    position: { x: -50, y: -450 }  # Center horizontally, show body area
    size: { width: 800, height: 1280 }  # NATURAL SIZE - no scaling
    opacity: 0.30
    layer: decorative
    z_index: 1
    description: "Butterfly at natural size (800×1280px), centered to show body/head, wings overflow"

  # LED METER (OuariconComp style - 14 vertical LED segments)
  - id: led_meter
    type: led_meter
    position: { x: 665, y: 40 }
    size: { width: 18, height: 140 }
    style: ouariconcomp_led_meter
    segments: 14
    layer: decorative
    description: "14-segment LED meter (OuariconComp style) - visual display only"

control_styles:
  botanical_seed:
    description: "10-segment seed cross-section design"
    knob_type: conic_gradient
    segments: 10
    segment_colors: ["#F5DEB3", "#E8D5B7"]  # Alternating cream tones
    border_width: 2
    border_color: "#8B7355"
    shadow: "inset 0 1px 2px rgba(0,0,0,0.15)"
    indicator_type: line
    indicator_color: "#3C2F2F"
    indicator_width: 2
    rotation_range: [-135, 135]  # 270 degrees total

  botanical_toggle:
    description: "Green tint when active"
    background_inactive: "rgba(139, 168, 112, 0.3)"
    background_active: "rgba(107, 142, 35, 0.6)"
    border_width: 2
    border_color: "#3C5C1A"
    border_radius: 4
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "9px"
    letter_spacing: "0.8px"

  botanical_dropdown:
    description: "Matches toggle style with aged paper background"
    background: "#F5E6D3"
    border_width: 2
    border_color: "#8B7355"
    border_radius: 4
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "9px"
    accent_color: "#6B8E4E"  # Green on hover/focus

  value_display_clean:
    description: "NO BOXES - transparent background, no border, plain text only"
    background: "transparent"
    border_width: 0
    border_color: "transparent"
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "11px"
    text_align: center
    padding: 0

  knob_label:
    description: "Small uppercase labels above knobs"
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "9px"
    letter_spacing: "0.8px"
    text_transform: uppercase
    text_align: center

  dropdown_label:
    description: "Label centered above dropdown"
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "9px"
    letter_spacing: "0.8px"
    text_transform: uppercase
    text_align: center

  meter_label:
    description: "Small label for LED meter"
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "9px"
    letter_spacing: "0.8px"
    text_transform: uppercase
    text_align: center

  ouariconcomp_led_meter:
    description: "14-segment LED meter (OuariconComp style)"
    background: "rgba(139, 115, 85, 0.1)"
    border_width: 1
    border_color: "#8B7355"
    border_radius: 2
    padding: 4
    segment_height: 10
    segment_gap: 2
    segment_colors:
      low: "#8BA870"  # Segments 1-5 (green botanical)
      mid: "#6B8E4E"  # Segments 6-10 (darker green)
      high: "#C9A27B"  # Segments 11-14 (warm tan/gold)
    segment_inactive: "#8B7355"  # Inactive segment color
    segment_glow: "0 0 4px"  # Glow shadow when active
    orientation: vertical
    direction: bottom_to_top

spacing:
  edge_margin: 20  # Minimum from window edges
  control_gap_horizontal: 20  # TIGHTER - 80px between knob centers (60px dial + 20px gap)
  control_gap_vertical: 14  # Vertical spacing between SYNC and DIVISION
  label_gap: 4  # Gap between label and knob
  value_gap: 4  # Gap between knob and value display
  meter_gap: 15  # Gap between DRY knob and LED meter

notes:
  - "All positions in pixels from top-left (0,0)"
  - "Ultra-compact rack mount: 700×196px"
  - "CHANGE 1 (v7): TIGHTER KNOB SPACING - 80px between centers (was 95px in v6)"
  - "  - TIME: x=115"
  - "  - FEEDBACK: x=195 (was x=210)"
  - "  - SPREAD: x=275 (was x=305)"
  - "  - MOD: x=355 (was x=400)"
  - "  - WET: x=435 (was x=495)"
  - "  - DRY: x=515 (was x=590)"
  - "  - DRY right edge: x=575 (515+60)"
  - "  - LED meter left edge: x=665"
  - "  - Gap between DRY and meter: 90px (exceeds 15px minimum)"
  - "CHANGE 2 (v7): OuariconComp-STYLE LED METER"
  - "  - 14 vertical LED segments stacked bottom-to-top"
  - "  - Segment height: ~10px, gap: 2px"
  - "  - Container: rgba(139, 115, 85, 0.1) background, 1px #8B7355 border, 4px padding"
  - "  - Colors: low (1-5) = #8BA870, mid (6-10) = #6B8E4E, high (11-14) = #C9A27B"
  - "  - Inactive segments: #8B7355"
  - "  - Active glow: box-shadow 0 0 4px [color]"
  - "  - Size: 18px wide × 140px tall"
  - "CHANGE 3 (v7): BUTTERFLY AT NATURAL SIZE"
  - "  - Image dimensions: 800×1280px (NO SCALING)"
  - "  - Position: x=-50, y=-450 (centered horizontally, body visible)"
  - "  - background-size: 800px 1280px (explicit natural size)"
  - "  - Wings extend far beyond window edges (overflow: hidden)"
  - "  - Creates elegant cropped botanical texture effect"
  - "Butterfly opacity: 30% - semi-transparent dramatic watermark"
  - "Layer order: paper background (z-index 0) → butterfly (z-index 1) → controls (z-index 2+)"
  - "Controls remain clearly visible and interactive above butterfly"
  - "Parameter IDs must match C++ exactly (lowercase, snake_case)"
  - "DIVISION label and dropdown remain at v6 position (moved down 10px from v5)"

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700, height=125">
  <title>Ouaricon Chorus</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 700px;
      height: 125px;
      position: relative;
      background: #F5E6D3;
      font-family: Garamond, 'Times New Roman', serif;
      overflow: hidden;
    }

    /* Paper texture background */
    .paper-background {
      position: absolute;
      top: 0; left: 0;
      width: 700px; height: 125px;
      background-image: url('img/paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* Insects illustration overlay */
    .insects-background {
      position: absolute;
      top: 0; left: 0;
      width: 700px; height: 125px;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.3;
    }

    .insects-background img {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      height: 700px;
      width: auto;
    }

    /* Header */
    .header {
      position: absolute;
      top: 8px; left: 16px; right: 16px;
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .title {
      font-size: 16px;
      letter-spacing: 2.5px;
      color: #3C2F2F;
      font-weight: normal;
      text-transform: uppercase;
    }

    /* Preset bar */
    .preset-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .preset-nav {
      background: none;
      border: none;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 14px;
      color: #3C2F2F;
      cursor: pointer;
      padding: 0 3px;
      opacity: 0.95;
      transition: opacity 0.15s;
    }

    .preset-nav:hover {
      opacity: 1;
      color: #3a5c4a;
    }

    .preset-name {
      font-size: 10px;
      letter-spacing: 1px;
      color: #3C2F2F;
      text-transform: uppercase;
      cursor: pointer;
      min-width: 60px;
      text-align: center;
      opacity: 1;
      transition: opacity 0.15s;
    }

    .preset-name:hover {
      opacity: 1;
      color: #3a5c4a;
    }

    /* WIDTH IS PINNED (v1.3.0), and this pin is LOAD-BEARING rather than
       decorative — its negative control fires. .preset-bar is a shrink-to-fit
       flex row flush against the header's right edge, so an unpinned button
       that grows in French drags the WHOLE row left and takes #preset-prev,
       #preset-display and #preset-next with it. None of those three is a
       [data-i18n] element, so check-ui-labels assertion 7 reports four moved
       rectangles. Removing this line alone reproduces exactly that.

       62 px, border-box, holds both captions in both languages:
           Load 39.00 -> CHARGER 58.52   3.48 px spare
           Save 36.34 -> ENREG.  47.25  14.75 px spare   (Stage N: was SAUVER 51.02)
       A pinned width makes the row's geometry language-invariant BY
       CONSTRUCTION, which is the same move the settings popover below makes
       for the same reason.

       It does move ENGLISH: the two buttons widen by 23 and 25.66 px, so the
       preset cluster starts 48.66 px further left in a header that has ~290 px
       of empty middle. Pinning to the English box instead would clip: the
       shortest defensible French for "Load" needs 48.77 px against Load's
       39.00, so there is no value that holds French and leaves English alone. */
    .preset-action {
      background: none;
      border: 1px solid rgba(74, 59, 42, 0.4);
      border-radius: 2px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      letter-spacing: 0.5px;
      color: #3C2F2F;
      cursor: pointer;
      padding: 1px 5px;
      width: 62px;
      opacity: 0.95;
      text-transform: uppercase;
      transition: opacity 0.15s, border-color 0.15s;
    }

    .preset-action:hover {
      opacity: 1;
      border-color: rgba(58, 92, 74, 0.5);
      color: #3a5c4a;
    }

    .preset-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: rgba(245, 230, 211, 0.97);
      border: 1px solid rgba(139, 115, 85, 0.4);
      border-radius: 3px;
      box-shadow: 1px 2px 8px rgba(0,0,0,0.15);
      max-height: 160px;
      overflow-y: auto;
      z-index: 9999;
      min-width: 100px;
    }

    .preset-dropdown.show { display: block; }

    .header:has(.preset-dropdown.show) { z-index: 9999; }

    .preset-dropdown-item {
      padding: 4px 10px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: #3C2F2F;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .preset-dropdown-item:hover { background: rgba(90, 122, 106, 0.15); }
    .preset-dropdown-item.active { background: rgba(90, 122, 106, 0.25); font-weight: bold; }

    /* Controls layout */
    .controls {
      position: absolute;
      top: 28px; left: 0; right: 0;
      height: 97px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
      z-index: 2;
    }

    .group {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 0 6px;
    }

    .group-label {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      letter-spacing: 1.2px;
      color: #5C4A32;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0.9;
    }

    .left-group, .right-group {
      position: relative;
    }

    /* LFO Ring container */
    .lfo-ring-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 10px;
      margin-top: -2px;
      padding-top: 0;
    }

    .lfo-ring-label {
      font-size: 8px;
      letter-spacing: 1.2px;
      color: #5C4A32;
      text-transform: uppercase;
      margin-bottom: 2px;
      opacity: 0.9;
    }

    .lfo-ring {
      width: 65px;
      height: 65px;
      position: relative;
    }

    .lfo-ring svg {
      width: 100%;
      height: 100%;
    }

    /* Knob containers */
    .knob-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 62px;
    }

    .knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .knob-visual {
      width: 48px;
      height: 48px;
      position: relative;
    }

    .knob-visual svg {
      width: 100%;
      height: 100%;
      transform: rotate(-135deg);
    }

    .knob-track {
      fill: none;
      stroke: rgba(139, 115, 85, 0.3);
      stroke-width: 2;
    }

    .knob-vine {
      fill: none;
      stroke: #5a7a6a;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .knob-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #4A3B2A;
      text-transform: uppercase;
      margin-top: 2px;
      text-align: center;
    }

    .knob-value {
      font-size: 10px;
      color: #5C4A32;
      margin-top: 0;
      text-align: center;
      min-width: 50px;
      height: 13px;
    }

    /* ===== SETTINGS POPOVER (v1.3.0) =====
       Styled in THIS page's vocabulary rather than pasted in from another
       plugin: the cream #F5E6D3 fill, the rgba(139,115,85,0.4) hairline the
       preset dropdown already uses, the #3a5c4a green hover the preset bar
       already uses, Garamond, uppercase, letter-spacing.

       PLACEMENT IS THE BOTTOM-LEFT CORNER, and it is chosen so that NOT ONE
       existing element moves to make room for it. The header is a two-child
       space-between flex row; a third child there would reflow it. .controls
       is centred, and its left group starts at x = 29.5, so the strip
       x 0..29.5 by y 28..125 is empty paper in both languages. A 20 px gear at
       left: 5px is 5..25 — clear by 4.5 px, measured rather than eyeballed. */
    .settings-cluster {
      position: absolute;
      left: 5px;
      bottom: 5px;
      z-index: 60;
    }

    .gear-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      background: none;
      border: 1px solid rgba(74, 59, 42, 0.4);
      border-radius: 50%;
      color: #3C2F2F;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.95;
      transition: opacity 0.15s, border-color 0.15s, color 0.15s;
    }

    .gear-btn:hover {
      opacity: 1;
      border-color: rgba(58, 92, 74, 0.5);
      color: #3a5c4a;
    }

    .gear-btn[aria-expanded="true"] {
      border-color: rgba(58, 92, 74, 0.6);
      color: #3a5c4a;
    }

    .gear-btn:focus-visible {
      outline: 1px solid #3a5c4a;
      outline-offset: 2px;
    }

    /* Opens UPWARDS. The gear sits 5 px from the BOTTOM of a 125 px frame, so
       a panel below it would leave the frame entirely; upward it occupies
       y 59..99, well inside.

       WIDTH IS PINNED, not min-width, and this pin is load-bearing too:
       .settings-popover is not a [data-i18n] element, so assertion 7 measures
       its box in both languages, and French SHRINKS the caption here
       (LANGUAGE 55.31 -> LANGUE 41.08). An auto-width panel would therefore
       contract in French and be reported as moved — the shrink half of the
       problem that a clip check cannot see at all. A hard width makes the
       panel's rectangle language-invariant by construction. 170 px holds the
       English row and the French one with room to spare, measured as rendered
       rather than from a font probe: text-transform and letter-spacing are not
       in getComputedStyle().font. */
    .settings-popover {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      z-index: 61;
      width: 170px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(245, 230, 211, 0.97);
      border: 1px solid rgba(139, 115, 85, 0.4);
      border-radius: 3px;
      box-shadow: 1px 2px 8px rgba(0, 0, 0, 0.15);
    }

    .settings-popover[hidden] {
      display: none;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* nowrap because the row is space-between: a caption that wrapped would
       grow the row's height and move the control beside it. */
    .settings-label {
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    .settings-select {
      flex: 0 0 auto;
      padding: 1px 3px;
      background: none;
      border: 1px solid rgba(74, 59, 42, 0.4);
      border-radius: 2px;
      color: #3C2F2F;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      line-height: 1.2;
      cursor: pointer;
    }

    .settings-select:focus-visible {
      outline: 1px solid #3a5c4a;
      outline-offset: 1px;
    }

    /* ===== HOVER-HELP (v1.4.0) =====
       The surface the delegated renderer paints into. Styled in THIS page's
       vocabulary rather than pasted in from the reference implementation: the
       same rgba(245,230,211,0.97) plate, rgba(139,115,85,0.4) hairline,
       3 px radius and 1px/2px/8px shadow the settings popover and the preset
       dropdown already use, Garamond throughout, and the #5C4A32 uppercase of
       .group-label / .lfo-ring-label for the title line. O-simpleFM's tooltip
       is a dark #2a2118 chip, which is that plugin's system and would read as a
       foreign object over this paper ground.

       ── THE FRAME IS 700 x 125, THE SHORTEST IN THE REPO ────────────────────

       125 px minus the renderer's 8 px margin top and bottom leaves 109 px for
       the WHOLE surface, and the arithmetic below is why this tip is wide and
       short rather than narrow and tall:

           padding      5 + 5   = 10.00
           border       1 + 1   =  2.00
           title      9 x 1.3   = 11.70   + 2.00 margin-bottom
           ------------------------------
           chrome               = 25.70 px
           body budget  109 - 25.70 = 83.30 px
           body line   10 x 1.3 = 13.00 px  ->  SIX lines, and no more

       A seventh body line is 91.00 + 25.70 = 116.70 px of surface in a 109 px
       well: there is no x or y at which the clamp could place it. Every figure
       above is measured, not derived — the line box really is 13.00 px
       (90.7 -> 77.7 -> 64.7 across three, four and five body lines) and the
       chrome really is 25.70 px (90.7 − 5 x 13.00).

       384 px IS BOUGHT MARGIN, NOT A NECESSITY, and saying otherwise was the
       first draft of this comment. It claimed these ten bodies "would run 10-12
       lines at O-Bass's 208 px cap and none could be shown". Measured, at
       208 px they run four to five lines and the tallest is 90.7 px, which
       fits the 109 px well perfectly well — with 18.3 px, under a line and a
       half, of margin. At 384 px the tallest is 64.7 px with 44.3 px of
       headroom, which is the room a native-speaker review needs when it
       replaces a machine-drafted French sentence with a longer human one.
       384 is a little over half the 700 px frame and leaves 692 − 384 = 308 px
       of horizontal travel for the clamp: the horizontal axis is the one this
       page has room on, so that is the axis the copy is allowed to spend.

       EVERY DECLARATION BELOW IS LOAD-BEARING:

         position: fixed    — the clamp measures against the VIEWPORT. It also
                              keeps the node out of flow, so adding it moves
                              nothing (check-ui-labels moved=0 before and after).
         visibility+opacity — hidden at rest. What CATCHES an un-hidden surface
                              is check-i18n assertion 10 and boot-all-uis' text
                              count, NOT check-ui-labels, which stayed
                              byte-identically green over exactly this mistake
                              on O-Bass: a fixed box at 0,0 has the same rect in
                              both languages, so it neither moves nor changes
                              the visible element SET. visibility rather than
                              display:none is deliberate — the box keeps layout,
                              so position() can measure getBoundingClientRect()
                              BEFORE the tip is shown.
         pointer-events     — none, or the surface steals the hover that is
                              keeping it open and the tip flickers.
         max-width          — a hard cap is what forces French to WRAP rather
                              than run off the right edge, and the wrap is what
                              the 6-line ceiling above is counted in.        */
    .tooltip {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 200;
      max-width: 384px;
      padding: 5px 8px;
      background: rgba(245, 230, 211, 0.97);
      border: 1px solid rgba(139, 115, 85, 0.4);
      border-radius: 3px;
      box-shadow: 1px 2px 8px rgba(0, 0, 0, 0.15);
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 10px;
      line-height: 1.3;
      color: #3C2F2F;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.12s ease;
      pointer-events: none;
    }

    .tooltip.show {
      opacity: 1;
      visibility: visible;
    }

    .tooltip .tip-title {
      display: block;
      font-size: 9px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #5C4A32;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="paper-background"></div>
    <div class="insects-background"><img src="img/insects.png" alt=""></div>

    <div class="header">
      <!-- NOT a [data-i18n] element: a product name is never translated.
           Declared in I18N_EXEMPT with that reason, so a genuinely missed
           label cannot hide here as a deliberate one. -->
      <div class="title">Ouaricon Chorus</div>
      <!-- v1.3.0: the four native title= attributes this bar carried are
           DELETED, not localized (contract §4 — a native title renders a
           second, untranslated OS tooltip). Their EXISTING English text moved
           verbatim into data-i18n-aria; no new prose was authored. -->
      <div class="preset-bar">
        <button class="preset-nav" id="preset-prev"
                data-i18n-aria="aria.prevPreset" aria-label="Previous preset">&#x25C0;</button>
        <!-- The preset NAME, written here at runtime by the vendored
             modules/preset-manager.js. Exempt under D-02: the name IS the JSON
             filename on disk. -->
        <span class="preset-name" id="preset-display">Default</span>
        <button class="preset-nav" id="preset-next"
                data-i18n-aria="aria.nextPreset" aria-label="Next preset">&#x25B6;</button>
        <!-- data-label so a state updater that writes textContent reads the
             authored caption back instead of erasing it
             (pattern_js_state_updater_overwrites_html_labels). -->
        <button class="preset-action" id="preset-load"
                data-i18n="label.load" data-label="Load"
                data-i18n-aria="aria.loadPreset" aria-label="Load preset from file">Load</button>
        <button class="preset-action" id="preset-save"
                data-i18n="label.save" data-label="Save"
                data-i18n-aria="aria.savePreset" aria-label="Save preset">Save</button>
        <div class="preset-dropdown" id="preset-dropdown"></div>
      </div>
    </div>

    <div class="controls">
      <!-- Left group: Modulation -->
      <div class="group left-group">
        <div class="knob-container">
          <div class="knob" data-param="rate">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-rate" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label" data-i18n="label.rate" data-label="Rate">Rate</span>
            <span class="knob-value" data-value="rate">1.00 Hz</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="depth">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-depth" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label" data-i18n="label.depth" data-label="Depth">Depth</span>
            <span class="knob-value" data-value="depth">50%</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="voices">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-voices" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label" data-i18n="label.voices" data-label="Voices">Voices</span>
            <span class="knob-value" data-value="voices">4</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="spread">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-spread" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label" data-i18n="label.spread" data-label="Spread">Spread</span>
            <span class="knob-value" data-value="spread">0%</span>
          </div>
        </div>
      </div>

      <!-- Center: LFO Ring -->
      <div class="lfo-ring-container">
        <div class="lfo-ring-label" data-i18n="label.lfo" data-label="LFO">LFO</div>
        <div class="lfo-ring">
          <svg viewBox="0 0 90 90">
            <circle cx="45" cy="45" r="36" fill="none" stroke="#5a7a6a" stroke-width="2.5"/>
            <circle id="lfo-dot" cx="45" cy="9" r="5" fill="#5a7a6a" opacity="0.9"/>
          </svg>
        </div>
      </div>

      <!-- Right group: Character -->
      <div class="group right-group">
        <div class="knob-container">
          <div class="knob" data-param="width">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-width" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label" data-i18n="label.width" data-label="Width">Width</span>
            <span class="knob-value" data-value="width">70%</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="tone">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-tone" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label" data-i18n="label.tone" data-label="Tone">Tone</span>
            <span class="knob-value" data-value="tone">0%</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="mix">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-mix" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label" data-i18n="label.mix" data-label="Mix">Mix</span>
            <span class="knob-value" data-value="mix">50%</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="drive">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-drive" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label" data-i18n="label.drive" data-label="Drive">Drive</span>
            <span class="knob-value" data-value="drive">30%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- v1.3.0: the settings cluster. ONE row, because this plugin has no
         hover-help to toggle — authoring that copy is Stage M's job and this
         commit does not invent it. Positioned absolutely in the empty
         bottom-left margin so that no existing element moves to make room. -->
    <div class="settings-cluster">
      <button type="button" class="gear-btn" id="gear-btn"
              aria-haspopup="dialog" aria-expanded="false"
              data-i18n-aria="aria.settings" aria-label="Settings">&#9881;</button>

      <div class="settings-popover" id="settings-popover"
           role="dialog" data-i18n-aria="aria.settings" aria-label="Settings" hidden>
        <label class="settings-row" for="lang-select">
          <span class="settings-label" data-i18n="label.language" data-label="Language">Language</span>
          <!-- ENDONYMS. Never localized: a French speaker looking for their
               language looks for "Fran&ccedil;ais". -->
          <select class="settings-select" id="lang-select"
                  data-i18n-aria="aria.langSelect" aria-label="Interface language">
            <option value="en">English</option>
            <option value="fr">Fran&ccedil;ais</option>
          </select>
        </label>
      </div>
    </div>

    <!-- v1.4.0: the hover-help surface. EMPTY at rest and hidden at rest, so
         it enters neither check-i18n assertion 10's uncovered-text sweep nor
         boot-all-uis' text count. The renderer fills it with createElement +
         textContent on every hover; nothing on this page ever writes markup
         into it. -->
    <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>
  </div>

  <script type="module" src="./js/juce/index.js"></script>
  <script type="module">
    import { getSliderState, getNativeFunction } from './js/juce/index.js';
    // The JUCE 8 frontend NAMESPACE, imported alongside the two named bindings
    // this page already used. Juce.getNativeFunction is the only correct way to
    // reach a withNativeFunction registration — window.__JUCE__ is the raw
    // postMessage transport and does not carry the promise contract
    // (critical_juce_webview_namespace_vs_postmessage). Two import statements
    // from one specifier is legal ES and leaves the existing call sites below
    // untouched.
    import * as Juce from './js/juce/index.js';
    import { PresetManager } from './modules/preset-manager.js';

    // v1.3.0: the label table. The canonical import line, re-rooted from
    // './i18n.js' to './js/i18n.js' because this plugin's controller is an
    // inline <script type="module"> at the UI root rather than a js/app.js.
    // check-i18n assertion 6 accepts exactly that one substitution and nothing
    // else. I18N and TIP_BINDINGS are both EMPTY here (this page has no
    // hover-help) and are imported anyway so the canon block below stays
    // byte-identical to the other forty-two copies.
    import { LANGUAGES, I18N, LABELS, TIP_BINDINGS, tr } from './js/i18n.js';

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // ════════════════════════════════════════════════════════════════
    // SVG Vine-Arc Knob system — 270-degree arc
    // ════════════════════════════════════════════════════════════════

    // Arc geometry: r=22, circumference = 2*PI*22 = 138.23, 270° arc = 103.67
    const ARC_LENGTH = 103.67;
    const SENSITIVITY = 0.005;
    const FINE_SENSITIVITY = 0.001;

    // Parameter configs
    const params = [
      { id: 'rate',   fmt: (n) => { const v = rateFromNorm(n); return v < 1 ? v.toFixed(2) + ' Hz' : v.toFixed(1) + ' Hz'; }, def: rateToNorm(1.0) },
      { id: 'depth',  fmt: (n) => Math.round(n * 100) + '%', def: 0.5 },
      { id: 'voices', fmt: (n) => String(Math.round(1 + n * 7)), def: 3/7, isVoices: true },
      { id: 'spread', fmt: (n) => Math.round(n * 100) + '%', def: 0.0 },
      { id: 'width',  fmt: (n) => Math.round(n * 100) + '%', def: 0.7 },
      { id: 'tone',   fmt: (n) => { const v = Math.round((n * 2 - 1) * 100); return (v > 0 ? '+' : '') + v + '%'; }, def: 0.5 },
      { id: 'mix',    fmt: (n) => Math.round(n * 100) + '%', def: 0.5 },
      { id: 'drive',  fmt: (n) => Math.round(n * 100) + '%', def: 0.3 }
    ];

    // Rate parameter uses logarithmic skew (0.35)
    function rateFromNorm(norm) {
      const min = 0.05, max = 5.0, skew = 0.35;
      return min + (max - min) * Math.pow(norm, 1.0 / skew);
    }

    function rateToNorm(hz) {
      const min = 0.05, max = 5.0, skew = 0.35;
      return Math.pow((hz - min) / (max - min), skew);
    }

    // Voices knob: snap to 8 discrete positions (1-8)
    function snapVoicesNorm(norm) {
      const step = Math.round(norm * 7);
      return step / 7;
    }

    // Global drag state
    const drag = { active: false, state: null, startY: 0, startNorm: 0, isVoices: false };

    // Wheel gesture tracking
    const wheelTimers = new Map();

    document.addEventListener('mousemove', (e) => {
      if (!drag.active || !drag.state) return;
      const sens = e.shiftKey ? FINE_SENSITIVITY : SENSITIVITY;
      const deltaY = drag.startY - e.clientY;
      let newNorm = Math.max(0, Math.min(1, drag.startNorm + deltaY * sens));

      if (drag.isVoices) newNorm = snapVoicesNorm(newNorm);

      drag.state.setNormalisedValue(newNorm);
    });

    document.addEventListener('mouseup', () => {
      if (!drag.active) return;
      if (drag.state && drag.state.sliderDragEnded) drag.state.sliderDragEnded();
      drag.active = false;
      drag.state = null;
    });

    // ════════════════════════════════════════════════════════════════
    // LFO Ring animation
    // ════════════════════════════════════════════════════════════════

    const lfoDot = document.getElementById('lfo-dot');
    let lfoPhase = 0;
    let rateState = null;
    let lastTimestamp = 0;

    function lfoLoop(timestamp) {
      const rateNorm = rateState ? rateState.getNormalisedValue() : 0.5;

      const rateHz = rateFromNorm(rateNorm);

      const deltaTime = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      if (deltaTime > 0 && deltaTime < 0.1) {
        lfoPhase += rateHz * 2 * Math.PI * deltaTime;
      }
      if (lfoPhase > 2 * Math.PI) lfoPhase -= 2 * Math.PI;

      const cx = 45 + 36 * Math.sin(lfoPhase);
      const cy = 45 - 36 * Math.cos(lfoPhase);
      lfoDot.setAttribute('cx', cx);
      lfoDot.setAttribute('cy', cy);

      requestAnimationFrame(lfoLoop);
    }

    // ════════════════════════════════════════════════════════════════
    // Setup
    // ════════════════════════════════════════════════════════════════

    document.addEventListener('DOMContentLoaded', () => {
      params.forEach((p) => {
        const state = getSliderState(p.id);
        if (!state) return;

        // Cache rate for LFO animation
        if (p.id === 'rate') rateState = state;

        const knobEl = document.querySelector(`.knob[data-param="${p.id}"]`);
        const vine = document.getElementById(`vine-${p.id}`);
        const valueEl = document.querySelector(`[data-value="${p.id}"]`);
        if (!knobEl || !vine) return;

        function updateDisplay(norm) {
          const offset = ARC_LENGTH - (norm * ARC_LENGTH);
          vine.style.strokeDashoffset = offset;
          if (valueEl && p.fmt) valueEl.textContent = p.fmt(norm);
        }

        // Sync from JUCE
        state.valueChangedEvent.addListener(() => {
          updateDisplay(state.getNormalisedValue());
        });

        // Initial display
        updateDisplay(state.getNormalisedValue());

        // Drag on knob-visual
        const knobVisual = knobEl.querySelector('.knob-visual');
        knobVisual.addEventListener('mousedown', (e) => {
          e.preventDefault();
          drag.active = true;
          drag.state = state;
          drag.startY = e.clientY;
          drag.startNorm = state.getNormalisedValue();
          drag.isVoices = !!p.isVoices;
          if (state.sliderDragStarted) state.sliderDragStarted();
        });

        // Mouse wheel with debounced gesture brackets
        knobVisual.addEventListener('wheel', (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.02 : -0.02;
          let newNorm = Math.max(0, Math.min(1, state.getNormalisedValue() + delta));
          if (p.isVoices) newNorm = snapVoicesNorm(newNorm);

          if (!wheelTimers.has(p.id)) {
            state.sliderDragStarted();
          } else {
            clearTimeout(wheelTimers.get(p.id));
          }

          state.setNormalisedValue(newNorm);

          wheelTimers.set(p.id, setTimeout(() => {
            state.sliderDragEnded();
            wheelTimers.delete(p.id);
          }, 200));
        }, { passive: false });

        // Double-click reset
        knobVisual.addEventListener('dblclick', (e) => {
          e.preventDefault();
          state.sliderDragStarted();
          let def = p.def;
          if (p.isVoices) def = snapVoicesNorm(def);
          state.setNormalisedValue(def);
          state.sliderDragEnded();
        });
      });

      // Start LFO animation
      requestAnimationFrame(lfoLoop);

      // ════════════════════════════════════════════════════════════════
      // Preset Manager
      // ════════════════════════════════════════════════════════════════

      const presetDisplay = document.getElementById('preset-display');
      const presetDropdown = document.getElementById('preset-dropdown');

      const presetMgr = new PresetManager({
        displayElement: presetDisplay,
        prevButton: document.getElementById('preset-prev'),
        nextButton: document.getElementById('preset-next'),
        saveButton: document.getElementById('preset-save'),
        loadButton: document.getElementById('preset-load'),
        getNativeFunction: getNativeFunction,
        onPresetListUpdated: (list) => {
          presetDropdown.innerHTML = '';
          list.forEach((name) => {
            const item = document.createElement('div');
            item.className = 'preset-dropdown-item';
            if (name === presetMgr.getCurrentPreset()) item.classList.add('active');
            item.textContent = name;
            item.addEventListener('click', () => {
              presetMgr.loadPreset(name);
              presetDropdown.classList.remove('show');
            });
            presetDropdown.appendChild(item);
          });
        },
        onPresetChanged: () => {
          presetDropdown.querySelectorAll('.preset-dropdown-item').forEach((el) => {
            el.classList.toggle('active', el.textContent === presetMgr.getCurrentPreset());
          });
        }
      });

      presetMgr.initialize();

      // Toggle dropdown on preset name click
      presetDisplay.addEventListener('click', () => {
        presetDropdown.classList.toggle('show');
      });

      // Close dropdown on outside click
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.preset-bar')) {
          presetDropdown.classList.remove('show');
        }
      });
    });

    // ════════════════════════════════════════════════════════════════════════
    // i18n — the canon v2 block, VERBATIM from scripts/i18n-canon.js
    // ════════════════════════════════════════════════════════════════════════
    //
    // Byte-compared by check-i18n assertion 6 after comment stripping and
    // whitespace normalisation. Do not edit it here; edit the canon and every
    // copy together, which is the whole point of holding it as data.
    //
    // It sits at the END of the module, below every existing initializer, and
    // is REACHED only through the guarded initI18n() call further down. A
    // top-level statement up here that touched a lower `let` would be a TDZ
    // throw taking every later initializer with it, and on this plugin
    // "every later initializer" is the entire UI — the controller is one
    // inline module, not a file that can fail in isolation
    // (pattern_module_toplevel_init_tdz).

    let uiLanguage = 'en';
    let getUiLanguageNative = null;
    let setUiLanguageNative = null;

    // LABELS first, I18N as the fallback: a control whose tooltip title already IS
    // its label carries one key, not two copies of the same string.
    function trLabel(key, lang, vars) {
        const entry = (typeof LABELS === 'object' && LABELS && LABELS[key]) || I18N[key];
        if (!entry) { console.warn(`i18n: missing label key ${key}`); return key; }
        const s = entry[lang] || entry.en;
        const resolve = (v) => {
            const nested = (typeof LABELS === 'object' && LABELS && LABELS[v]) || I18N[v];
            return nested ? String((nested[lang] || nested.en).t) : String(v);
        };
        return vars
            ? String(s.t).replace(/\{(\w+)\}/g, (m, n) => (n in vars ? resolve(vars[n]) : m))
            : String(s.t);
    }

    function applyLabel(el) {
        const key = el.dataset.i18n;
        if (!key) return;
        let vars = null;
        try { vars = el.dataset.i18nVars ? JSON.parse(el.dataset.i18nVars) : null; }
        catch (e) { console.warn(`i18n: bad vars on ${key}`); }
        const s = trLabel(key, uiLanguage, vars);
        el.dataset.label = s;
        el.textContent   = s;
    }

    function applyI18nAttributes(el) {
        const pairs = [['i18nAria', 'aria-label'], ['i18nPlaceholder', 'placeholder'], ['i18nAlt', 'alt']];
        for (const [prop, attr] of pairs) {
            const key = el.dataset[prop];
            if (key) el.setAttribute(attr, trLabel(key, uiLanguage, null));
        }
    }

    function setLabel(el, key, vars) {
        if (!el) return;
        el.dataset.i18n = key;
        if (vars) el.dataset.i18nVars = JSON.stringify(vars); else delete el.dataset.i18nVars;
        applyLabel(el);
    }

    function applyI18n(lang) {
        uiLanguage = LANGUAGES.includes(lang) ? lang : 'en';
        // <html lang> follows the selector: screen readers pick the French voice,
        // and CSS hyphens:auto / quotes resolve in the page's actual language.
        document.documentElement.lang = uiLanguage;
        for (const [selector, key, wrapper, vars] of TIP_BINDINGS) {
            const el = document.querySelector(selector);
            if (!el) { console.warn(`i18n: tip target not found: ${selector}`); continue; }
            const target = wrapper ? (el.closest(wrapper) || el) : el;
            const s = tr(key, uiLanguage, vars);
            target.setAttribute('data-tip-title', s.t);
            target.setAttribute('data-tip', s.b);
        }
        for (const el of document.querySelectorAll('[data-i18n]')) applyLabel(el);
        for (const el of document.querySelectorAll('[data-i18n-aria],[data-i18n-placeholder],[data-i18n-alt]'))
            applyI18nAttributes(el);
        const sel = document.getElementById('lang-select');
        if (sel && sel.value !== uiLanguage) sel.value = uiLanguage;
    }

    // Exposed so a clamp gate can drive the language without teaching the ui-stub a
    // promise contract: page.evaluate((l) => window.__setLanguage(l), 'fr').
    window.__setLanguage = applyI18n;
    // Exposed for the same reason, and so a sibling module can write a localized
    // label without app.js having to export anything — O-Bitrot's controller is an
    // inline <script type="module">, where an export declaration has nowhere to go.
    window.__setLabel = setLabel;
    window.__reapplyI18n = () => applyI18n(uiLanguage);

    function initI18n() {
        try {
            getUiLanguageNative = Juce.getNativeFunction('getUiLanguage');
            setUiLanguageNative = Juce.getNativeFunction('setUiLanguage');
        } catch (e) {
            console.warn('Language preference not available, session-only:', e);
        }

        // Paint the default SYNCHRONOUSLY first. Never blank, never a flash.
        try { applyI18n('en'); } catch (e) { console.error('i18n init failed:', e); }

        if (getUiLanguageNative) {
            getUiLanguageNative()
                .then((code) => applyI18n(code === 'fr' ? 'fr' : 'en'))
                .catch((e) => console.warn('Could not read language preference:', e));
        }

        const sel = document.getElementById('lang-select');
        if (sel) sel.addEventListener('change', (e) => {
            applyI18n(e.target.value);
            if (setUiLanguageNative) setUiLanguageNative(uiLanguage).catch(() => {});
        });
    }

    // ════════════════════════════════════════════════════════════════════════
    // The settings popover (v1.3.0)
    // ════════════════════════════════════════════════════════════════════════
    //
    // ONE row. This plugin has no hover-help to switch on or off — v1.2.3
    // carried no data-tip anywhere — and authoring that copy is Stage M's job,
    // so the popover holds the language selector alone. The panel opens
    // UPWARDS: the gear is 5 px from the BOTTOM of a 125 px frame.

    let settingsPopoverEl = null;
    let gearBtnEl = null;

    function setSettingsPopoverOpen(open) {
        if (!settingsPopoverEl || !gearBtnEl) return;
        settingsPopoverEl.hidden = !open;
        gearBtnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function initializeSettingsPopover() {
        gearBtnEl = document.getElementById('gear-btn');
        settingsPopoverEl = document.getElementById('settings-popover');

        if (!gearBtnEl || !settingsPopoverEl) {
            console.warn('settings popover missing - language selector unavailable');
            return;
        }

        gearBtnEl.addEventListener('click', (e) => {
            e.stopPropagation();
            setSettingsPopoverOpen(settingsPopoverEl.hidden);
        });

        // Dismiss on a press anywhere else, and on Escape. mousedown rather
        // than click, so the panel is gone before a drag on a knob underneath
        // it begins — this page starts a knob drag on mousedown.
        document.addEventListener('mousedown', (e) => {
            if (settingsPopoverEl.hidden) return;
            if (settingsPopoverEl.contains(e.target) || gearBtnEl.contains(e.target)) return;
            setSettingsPopoverOpen(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !settingsPopoverEl.hidden) {
                setSettingsPopoverOpen(false);
                gearBtnEl.focus();
            }
        });
    }

    // ════════════════════════════════════════════════════════════════════════
    // HOVER-HELP (v1.4.0)
    // ════════════════════════════════════════════════════════════════════════
    //
    // Ported from O-simpleFM's setupTooltips (js/app.js:384-462). It looks up NO
    // copy: applyI18n() has already written data-tip-title and data-tip onto
    // each anchor in the current language, and rewrites both on every language
    // change. This function only positions and shows what the anchor is already
    // carrying, which is why a language switch needs no hook here at all.
    //
    // Every property below is load-bearing:
    //
    //  1  DELEGATED ON document, never querySelectorAll('[data-tip]') at setup.
    //     No anchor carries data-tip until applyI18n() has run, so a setup-time
    //     query binds NOTHING and fails silently.
    //  2  pointerover / pointerout / focusin / focusout, because they BUBBLE.
    //     pointerenter and focus do not, and delegation needs the bubble phase.
    //  3  pointerout IGNORES a move between two descendants of the SAME anchor.
    //     Each .knob-container holds a visual, a caption and a readout, so
    //     without this the tip flickers off and on at every child boundary.
    //  4  createElement + textContent, NEVER innerHTML. Localized copy must not
    //     reach a markup path (the runtime half of check-i18n assertion 9,
    //     which forbids an angle bracket in an i18n.js string literal).
    //  5  CLAMPED ON ALL FOUR EDGES with an 8 px margin, flipping to the
    //     opposite side of the cursor on overflow AND clamping the flipped
    //     result again. In a 125 px frame the vertical flip is not an edge
    //     case: every knob cell spans y 28..103, so the naive y + 16 puts the
    //     tip's top below the frame's own bottom at almost every anchor.
    //  6  Escape hides it, and so does pointerdown: this page starts a knob
    //     drag on mousedown, and a tip left standing over a knob being dragged
    //     is a tip covering the readout the user is watching.
    //  7  drag.active suppresses a SHOW outright. That is the one deliberate
    //     addition to the reference family, and it is specific to this page: a
    //     drag long enough to cross into the neighbouring .knob-container would
    //     otherwise open that neighbour's tip mid-gesture, over the readout the
    //     user is dragging to reach. pointerdown alone cannot cover it, because
    //     the pointerover comes AFTER it.
    function setupTooltips() {
        const tip = document.getElementById('tooltip');
        if (!tip) { console.warn('tooltip surface missing - hover-help unavailable'); return; }

        let active = null;

        const show = (el, x, y) => {
            const title = el.getAttribute('data-tip-title');
            const body  = el.getAttribute('data-tip');
            if (!title && !body) return;

            tip.textContent = '';
            if (title) {
                const t = document.createElement('span');
                t.className = 'tip-title';
                t.textContent = title;
                tip.appendChild(t);
            }
            if (body) tip.appendChild(document.createTextNode(body));

            tip.classList.add('show');
            tip.setAttribute('aria-hidden', 'false');
            position(x, y);
        };

        // Measured AFTER the content is in place and AFTER .show, so the rect is
        // the real one. visibility:hidden keeps layout, so the box is measurable
        // even on the frame before it becomes visible.
        const position = (x, y) => {
            const M = 8;
            const r = tip.getBoundingClientRect();
            let nx = x + 14;
            let ny = y + 16;

            // Flip to the other side of the cursor rather than sliding, so the
            // tip never sits UNDER the pointer that opened it.
            if (nx + r.width  > window.innerWidth  - M) nx = x - r.width  - 14;
            if (ny + r.height > window.innerHeight - M) ny = y - r.height - 12;

            // ...and clamp the flipped result too. ONE FLIP IS NOT ENOUGH IN
            // THIS FRAME. A 60 px tip opened on a knob whose centre is at
            // y = 65 wants y = 81 below the cursor (81 + 60 = 141, past 117)
            // and y = -7 above it — outside on BOTH sides of the flip. Every
            // vertical placement on this page lands on the line below, not on
            // the flip above it.
            if (nx + r.width  > window.innerWidth  - M) nx = window.innerWidth  - M - r.width;
            if (ny + r.height > window.innerHeight - M) ny = window.innerHeight - M - r.height;

            tip.style.left = `${Math.max(M, nx)}px`;
            tip.style.top  = `${Math.max(M, ny)}px`;
        };

        const hide = () => {
            tip.classList.remove('show');
            tip.setAttribute('aria-hidden', 'true');
            active = null;
        };

        const anchorOf = (t) => (t && t.closest ? t.closest('[data-tip]') : null);

        document.addEventListener('pointerover', (e) => {
            if (drag.active) return;
            const el = anchorOf(e.target);
            if (!el || el === active) return;
            active = el;
            show(el, e.clientX, e.clientY);
        });

        document.addEventListener('pointermove', (e) => {
            if (active && anchorOf(e.target) === active) position(e.clientX, e.clientY);
        });

        document.addEventListener('pointerout', (e) => {
            if (!active) return;
            if (anchorOf(e.relatedTarget) === active) return;
            hide();
        });

        // THE FOCUS ARM IS LATCHED TO THE KEYBOARD, and the reason is measured.
        //
        // A mouse click on a <button> focuses it, so an unconditional focusin
        // rule re-opens the tip that pointerdown just hid — with the pointer
        // still on the anchor and no further pointerover to come. Measured on
        // the two pilots that shipped without the latch: clicking #gear-btn
        // left a tip covering the settings popover it had just opened by
        // 146 x 35 px (O-Bass) and 161 x 29 px (O-AnalogSaturation). Both gates
        // stayed green throughout; check-ui-labels counts the surface as
        // pointer-events:none DECORATION and never as a label.
        //
        // :focus-visible is deliberately NOT the discriminator. Chromium reports
        // it false for a programmatic .focus() following a click, so a gate
        // driving focus directly would measure "no tip" and record that as
        // correct. An explicit last-input-device latch is the same rule and is
        // drivable from a test with real events: any keydown clears it.
        let lastInputWasPointer = false;

        document.addEventListener('pointerdown', () => { lastInputWasPointer = true; hide(); });

        document.addEventListener('focusin', (e) => {
            if (lastInputWasPointer) return;
            const el = anchorOf(e.target);
            if (!el) return;
            active = el;
            const r = el.getBoundingClientRect();
            show(el, r.left + r.width / 2, r.bottom);
        });

        document.addEventListener('focusout', hide);

        // One keydown listener, two jobs: any key at all means the keyboard is
        // driving again, which releases the latch above; Escape additionally
        // hides. Registered AFTER initializeSettingsPopover's own keydown, so
        // that handler's Escape -> gearBtnEl.focus() is still seen with the
        // latch as the PREVIOUS input left it: a pointer user who clicked the
        // gear and then pressed Escape gets no tip, a keyboard user does.
        document.addEventListener('keydown', (e) => {
            lastInputWasPointer = false;
            if (e.key === 'Escape') hide();
        });
    }

    // Guarded, and LAST. Every parameter binding above has already been
    // registered, so an i18n failure leaves an English plugin that still works
    // rather than a dead page.
    //
    // setupTooltips() runs AFTER initI18n() and inside the SAME try/catch.
    // After, because the anchors carry no data-tip until applyI18n has run —
    // delegation would survive the other order, but the focusin path reads the
    // attribute at bind time on nothing. Same try/catch, because if initI18n
    // threw there are no tip attributes to render anyway, and a top-level call
    // reaching a lower let/const is the TDZ throw that would take this whole
    // inline module with it (pattern_module_toplevel_init_tdz).
    initializeSettingsPopover();
    try { initI18n(); setupTooltips(); } catch (e) { console.error('i18n init failed:', e); }
  </script>
</body>
</html>

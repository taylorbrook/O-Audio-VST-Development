<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700, height=125">
  <title>Ouaricon Chorus</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 700px;
      height: 125px;
      position: relative;
      background: #F5E6D3;
      font-family: Garamond, 'Times New Roman', serif;
      overflow: hidden;
    }

    /* Paper texture background */
    .paper-background {
      position: absolute;
      top: 0; left: 0;
      width: 700px; height: 125px;
      background-image: url('img/paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* Insects illustration overlay */
    .insects-background {
      position: absolute;
      top: 0; left: 0;
      width: 700px; height: 125px;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.3;
    }

    .insects-background img {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      height: 700px;
      width: auto;
    }

    /* Header */
    .header {
      position: absolute;
      top: 8px; left: 16px; right: 16px;
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .title {
      font-size: 16px;
      letter-spacing: 2.5px;
      color: #3C2F2F;
      font-weight: normal;
      text-transform: uppercase;
    }

    /* Preset bar */
    .preset-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .preset-nav {
      background: none;
      border: none;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 14px;
      color: #3C2F2F;
      cursor: pointer;
      padding: 0 3px;
      opacity: 0.95;
      transition: opacity 0.15s;
    }

    .preset-nav:hover {
      opacity: 1;
      color: #3a5c4a;
    }

    .preset-name {
      font-size: 10px;
      letter-spacing: 1px;
      color: #3C2F2F;
      text-transform: uppercase;
      cursor: pointer;
      min-width: 60px;
      text-align: center;
      opacity: 1;
      transition: opacity 0.15s;
    }

    .preset-name:hover {
      opacity: 1;
      color: #3a5c4a;
    }

    .preset-action {
      background: none;
      border: 1px solid rgba(74, 59, 42, 0.4);
      border-radius: 2px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      letter-spacing: 0.5px;
      color: #3C2F2F;
      cursor: pointer;
      padding: 1px 5px;
      opacity: 0.95;
      text-transform: uppercase;
      transition: opacity 0.15s, border-color 0.15s;
    }

    .preset-action:hover {
      opacity: 1;
      border-color: rgba(58, 92, 74, 0.5);
      color: #3a5c4a;
    }

    .preset-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: rgba(245, 230, 211, 0.97);
      border: 1px solid rgba(139, 115, 85, 0.4);
      border-radius: 3px;
      box-shadow: 1px 2px 8px rgba(0,0,0,0.15);
      max-height: 160px;
      overflow-y: auto;
      z-index: 9999;
      min-width: 100px;
    }

    .preset-dropdown.show { display: block; }

    .header:has(.preset-dropdown.show) { z-index: 9999; }

    .preset-dropdown-item {
      padding: 4px 10px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: #3C2F2F;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .preset-dropdown-item:hover { background: rgba(90, 122, 106, 0.15); }
    .preset-dropdown-item.active { background: rgba(90, 122, 106, 0.25); font-weight: bold; }

    /* Controls layout */
    .controls {
      position: absolute;
      top: 28px; left: 0; right: 0;
      height: 97px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
      z-index: 2;
    }

    .group {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 0 6px;
    }

    .group-label {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      letter-spacing: 1.2px;
      color: #5C4A32;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0.9;
    }

    .left-group, .right-group {
      position: relative;
    }

    /* LFO Ring container */
    .lfo-ring-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 10px;
      margin-top: -2px;
      padding-top: 0;
    }

    .lfo-ring-label {
      font-size: 8px;
      letter-spacing: 1.2px;
      color: #5C4A32;
      text-transform: uppercase;
      margin-bottom: 2px;
      opacity: 0.9;
    }

    .lfo-ring {
      width: 65px;
      height: 65px;
      position: relative;
    }

    .lfo-ring svg {
      width: 100%;
      height: 100%;
    }

    /* Knob containers */
    .knob-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 62px;
    }

    .knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .knob-visual {
      width: 48px;
      height: 48px;
      position: relative;
    }

    .knob-visual svg {
      width: 100%;
      height: 100%;
      transform: rotate(-135deg);
    }

    .knob-track {
      fill: none;
      stroke: rgba(139, 115, 85, 0.3);
      stroke-width: 2;
    }

    .knob-vine {
      fill: none;
      stroke: #5a7a6a;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .knob-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #4A3B2A;
      text-transform: uppercase;
      margin-top: 2px;
      text-align: center;
    }

    .knob-value {
      font-size: 10px;
      color: #5C4A32;
      margin-top: 0;
      text-align: center;
      min-width: 50px;
      height: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="paper-background"></div>
    <div class="insects-background"><img src="img/insects.png" alt=""></div>

    <div class="header">
      <div class="title">Ouaricon Chorus</div>
      <div class="preset-bar">
        <button class="preset-nav" id="preset-prev" title="Previous preset">&#x25C0;</button>
        <span class="preset-name" id="preset-display">Default</span>
        <button class="preset-nav" id="preset-next" title="Next preset">&#x25B6;</button>
        <button class="preset-action" id="preset-load" title="Load preset from file">Load</button>
        <button class="preset-action" id="preset-save" title="Save preset">Save</button>
        <div class="preset-dropdown" id="preset-dropdown"></div>
      </div>
    </div>

    <div class="controls">
      <!-- Left group: Modulation -->
      <div class="group left-group">
        <div class="knob-container">
          <div class="knob" data-param="rate">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-rate" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label">Rate</span>
            <span class="knob-value" data-value="rate">1.00 Hz</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="depth">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-depth" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label">Depth</span>
            <span class="knob-value" data-value="depth">50%</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="voices">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-voices" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label">Voices</span>
            <span class="knob-value" data-value="voices">4</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="spread">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-spread" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label">Spread</span>
            <span class="knob-value" data-value="spread">0%</span>
          </div>
        </div>
      </div>

      <!-- Center: LFO Ring -->
      <div class="lfo-ring-container">
        <div class="lfo-ring-label">LFO</div>
        <div class="lfo-ring">
          <svg viewBox="0 0 90 90">
            <circle cx="45" cy="45" r="36" fill="none" stroke="#5a7a6a" stroke-width="2.5"/>
            <circle id="lfo-dot" cx="45" cy="9" r="5" fill="#5a7a6a" opacity="0.9"/>
          </svg>
        </div>
      </div>

      <!-- Right group: Character -->
      <div class="group right-group">
        <div class="knob-container">
          <div class="knob" data-param="width">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-width" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label">Width</span>
            <span class="knob-value" data-value="width">70%</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="tone">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-tone" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label">Tone</span>
            <span class="knob-value" data-value="tone">0%</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="mix">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-mix" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label">Mix</span>
            <span class="knob-value" data-value="mix">50%</span>
          </div>
        </div>
        <div class="knob-container">
          <div class="knob" data-param="drive">
            <div class="knob-visual">
              <svg viewBox="0 0 52 52">
                <circle class="knob-track" cx="26" cy="26" r="22"/>
                <circle class="knob-vine" id="vine-drive" cx="26" cy="26" r="22"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
              </svg>
            </div>
            <span class="knob-label">Drive</span>
            <span class="knob-value" data-value="drive">30%</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/juce/index.js"></script>
  <script type="module">
    import { getSliderState, getNativeFunction } from './js/juce/index.js';
    import { PresetManager } from './modules/preset-manager.js';

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // ════════════════════════════════════════════════════════════════
    // SVG Vine-Arc Knob system — 270-degree arc
    // ════════════════════════════════════════════════════════════════

    // Arc geometry: r=22, circumference = 2*PI*22 = 138.23, 270° arc = 103.67
    const ARC_LENGTH = 103.67;
    const SENSITIVITY = 0.005;
    const FINE_SENSITIVITY = 0.001;

    // Parameter configs
    const params = [
      { id: 'rate',   fmt: (n) => { const v = rateFromNorm(n); return v < 1 ? v.toFixed(2) + ' Hz' : v.toFixed(1) + ' Hz'; }, def: rateToNorm(1.0) },
      { id: 'depth',  fmt: (n) => Math.round(n * 100) + '%', def: 0.5 },
      { id: 'voices', fmt: (n) => String(Math.round(1 + n * 7)), def: 3/7, isVoices: true },
      { id: 'spread', fmt: (n) => Math.round(n * 100) + '%', def: 0.0 },
      { id: 'width',  fmt: (n) => Math.round(n * 100) + '%', def: 0.7 },
      { id: 'tone',   fmt: (n) => { const v = Math.round((n * 2 - 1) * 100); return (v > 0 ? '+' : '') + v + '%'; }, def: 0.5 },
      { id: 'mix',    fmt: (n) => Math.round(n * 100) + '%', def: 0.5 },
      { id: 'drive',  fmt: (n) => Math.round(n * 100) + '%', def: 0.3 }
    ];

    // Rate parameter uses logarithmic skew (0.35)
    function rateFromNorm(norm) {
      const min = 0.05, max = 5.0, skew = 0.35;
      return min + (max - min) * Math.pow(norm, 1.0 / skew);
    }

    function rateToNorm(hz) {
      const min = 0.05, max = 5.0, skew = 0.35;
      return Math.pow((hz - min) / (max - min), skew);
    }

    // Voices knob: snap to 8 discrete positions (1-8)
    function snapVoicesNorm(norm) {
      const step = Math.round(norm * 7);
      return step / 7;
    }

    // Global drag state
    const drag = { active: false, state: null, startY: 0, startNorm: 0, isVoices: false };

    // Wheel gesture tracking
    const wheelTimers = new Map();

    document.addEventListener('mousemove', (e) => {
      if (!drag.active || !drag.state) return;
      const sens = e.shiftKey ? FINE_SENSITIVITY : SENSITIVITY;
      const deltaY = drag.startY - e.clientY;
      let newNorm = Math.max(0, Math.min(1, drag.startNorm + deltaY * sens));

      if (drag.isVoices) newNorm = snapVoicesNorm(newNorm);

      drag.state.setNormalisedValue(newNorm);
    });

    document.addEventListener('mouseup', () => {
      if (!drag.active) return;
      if (drag.state && drag.state.sliderDragEnded) drag.state.sliderDragEnded();
      drag.active = false;
      drag.state = null;
    });

    // ════════════════════════════════════════════════════════════════
    // LFO Ring animation
    // ════════════════════════════════════════════════════════════════

    const lfoDot = document.getElementById('lfo-dot');
    let lfoPhase = 0;
    let rateState = null;
    let lastTimestamp = 0;

    function lfoLoop(timestamp) {
      const rateNorm = rateState ? rateState.getNormalisedValue() : 0.5;

      const rateHz = rateFromNorm(rateNorm);

      const deltaTime = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      if (deltaTime > 0 && deltaTime < 0.1) {
        lfoPhase += rateHz * 2 * Math.PI * deltaTime;
      }
      if (lfoPhase > 2 * Math.PI) lfoPhase -= 2 * Math.PI;

      const cx = 45 + 36 * Math.sin(lfoPhase);
      const cy = 45 - 36 * Math.cos(lfoPhase);
      lfoDot.setAttribute('cx', cx);
      lfoDot.setAttribute('cy', cy);

      requestAnimationFrame(lfoLoop);
    }

    // ════════════════════════════════════════════════════════════════
    // Setup
    // ════════════════════════════════════════════════════════════════

    document.addEventListener('DOMContentLoaded', () => {
      params.forEach((p) => {
        const state = getSliderState(p.id);
        if (!state) return;

        // Cache rate for LFO animation
        if (p.id === 'rate') rateState = state;

        const knobEl = document.querySelector(`.knob[data-param="${p.id}"]`);
        const vine = document.getElementById(`vine-${p.id}`);
        const valueEl = document.querySelector(`[data-value="${p.id}"]`);
        if (!knobEl || !vine) return;

        function updateDisplay(norm) {
          const offset = ARC_LENGTH - (norm * ARC_LENGTH);
          vine.style.strokeDashoffset = offset;
          if (valueEl && p.fmt) valueEl.textContent = p.fmt(norm);
        }

        // Sync from JUCE
        state.valueChangedEvent.addListener(() => {
          updateDisplay(state.getNormalisedValue());
        });

        // Initial display
        updateDisplay(state.getNormalisedValue());

        // Drag on knob-visual
        const knobVisual = knobEl.querySelector('.knob-visual');
        knobVisual.addEventListener('mousedown', (e) => {
          e.preventDefault();
          drag.active = true;
          drag.state = state;
          drag.startY = e.clientY;
          drag.startNorm = state.getNormalisedValue();
          drag.isVoices = !!p.isVoices;
          if (state.sliderDragStarted) state.sliderDragStarted();
        });

        // Mouse wheel with debounced gesture brackets
        knobVisual.addEventListener('wheel', (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.02 : -0.02;
          let newNorm = Math.max(0, Math.min(1, state.getNormalisedValue() + delta));
          if (p.isVoices) newNorm = snapVoicesNorm(newNorm);

          if (!wheelTimers.has(p.id)) {
            state.sliderDragStarted();
          } else {
            clearTimeout(wheelTimers.get(p.id));
          }

          state.setNormalisedValue(newNorm);

          wheelTimers.set(p.id, setTimeout(() => {
            state.sliderDragEnded();
            wheelTimers.delete(p.id);
          }, 200));
        }, { passive: false });

        // Double-click reset
        knobVisual.addEventListener('dblclick', (e) => {
          e.preventDefault();
          state.sliderDragStarted();
          let def = p.def;
          if (p.isVoices) def = snapVoicesNorm(def);
          state.setNormalisedValue(def);
          state.sliderDragEnded();
        });
      });

      // Start LFO animation
      requestAnimationFrame(lfoLoop);

      // ════════════════════════════════════════════════════════════════
      // Preset Manager
      // ════════════════════════════════════════════════════════════════

      const presetDisplay = document.getElementById('preset-display');
      const presetDropdown = document.getElementById('preset-dropdown');

      const presetMgr = new PresetManager({
        displayElement: presetDisplay,
        prevButton: document.getElementById('preset-prev'),
        nextButton: document.getElementById('preset-next'),
        saveButton: document.getElementById('preset-save'),
        loadButton: document.getElementById('preset-load'),
        getNativeFunction: getNativeFunction,
        onPresetListUpdated: (list) => {
          presetDropdown.innerHTML = '';
          list.forEach((name) => {
            const item = document.createElement('div');
            item.className = 'preset-dropdown-item';
            if (name === presetMgr.getCurrentPreset()) item.classList.add('active');
            item.textContent = name;
            item.addEventListener('click', () => {
              presetMgr.loadPreset(name);
              presetDropdown.classList.remove('show');
            });
            presetDropdown.appendChild(item);
          });
        },
        onPresetChanged: () => {
          presetDropdown.querySelectorAll('.preset-dropdown-item').forEach((el) => {
            el.classList.toggle('active', el.textContent === presetMgr.getCurrentPreset());
          });
        }
      });

      presetMgr.initialize();

      // Toggle dropdown on preset name click
      presetDisplay.addEventListener('click', () => {
        presetDropdown.classList.toggle('show');
      });

      // Close dropdown on outside click
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.preset-bar')) {
          presetDropdown.classList.remove('show');
        }
      });
    });
  </script>
</body>
</html>

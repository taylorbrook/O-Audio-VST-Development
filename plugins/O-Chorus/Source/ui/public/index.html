<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700, height=250">
  <title>Ouaricon Chorus</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 700px;
      height: 250px;
      position: relative;
      background: #F5E6D3;
      font-family: Garamond, 'Times New Roman', serif;
      overflow: hidden;
    }

    /* Paper texture background */
    .paper-background {
      position: absolute;
      top: 0; left: 0;
      width: 700px; height: 250px;
      background-image: url('img/paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* Header */
    .header {
      position: absolute;
      top: 8px; left: 16px; right: 16px;
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .title {
      font-size: 15px;
      letter-spacing: 2.5px;
      color: #3C2F2F;
      font-weight: normal;
      text-transform: uppercase;
    }

    .preset-placeholder {
      font-size: 9px;
      letter-spacing: 1px;
      color: #8B7355;
      opacity: 0.6;
      text-transform: uppercase;
    }

    /* Controls layout */
    .controls {
      position: absolute;
      top: 40px; left: 0; right: 0;
      height: 200px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
      z-index: 2;
    }

    .group {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 0 6px;
    }

    .group-label {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 7px;
      letter-spacing: 1.2px;
      color: #8B7355;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0.7;
    }

    .left-group, .right-group {
      position: relative;
    }

    /* LFO Ring container */
    .lfo-ring-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 10px;
      padding-top: 8px;
    }

    .lfo-ring-label {
      font-size: 7px;
      letter-spacing: 1.2px;
      color: #8B7355;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.7;
    }

    .lfo-ring {
      width: 90px;
      height: 90px;
      position: relative;
    }

    .lfo-ring svg {
      width: 100%;
      height: 100%;
    }

    /* Knob containers */
    .knob-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 62px;
    }

    .knob-label {
      font-size: 8px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
    }

    .knob {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid #8B7355;
      position: relative;
      cursor: pointer;
      background:
        radial-gradient(circle, transparent 86%, #C9A27B 86%, #C9A27B 90%, #8B7355 90%, #8B7355 92%, transparent 92%),
        conic-gradient(from 0deg,
          #F5DEB3 0deg, #F5DEB3 36deg, #8B7355 36deg, #8B7355 37deg,
          #E8D5B7 37deg, #E8D5B7 72deg, #8B7355 72deg, #8B7355 73deg,
          #F5DEB3 73deg, #F5DEB3 108deg, #8B7355 108deg, #8B7355 109deg,
          #E8D5B7 109deg, #E8D5B7 144deg, #8B7355 144deg, #8B7355 145deg,
          #F5DEB3 145deg, #F5DEB3 180deg, #8B7355 180deg, #8B7355 181deg,
          #E8D5B7 181deg, #E8D5B7 216deg, #8B7355 216deg, #8B7355 217deg,
          #F5DEB3 217deg, #F5DEB3 252deg, #8B7355 252deg, #8B7355 253deg,
          #E8D5B7 253deg, #E8D5B7 288deg, #8B7355 288deg, #8B7355 289deg,
          #F5DEB3 289deg, #F5DEB3 324deg, #8B7355 324deg, #8B7355 325deg,
          #E8D5B7 325deg, #E8D5B7 360deg
        ),
        radial-gradient(circle, #FFF8DC 0%, #FFF8DC 20%, transparent 20%);
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.3),
                  inset -1px -1px 2px rgba(255,248,220,0.5),
                  2px 2px 6px rgba(0,0,0,0.2);
    }

    .knob-indicator {
      position: absolute;
      top: 3px;
      left: 50%;
      width: 2px;
      height: 16px;
      background: #3C2F2F;
      border-radius: 1px;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: center 23px;
      pointer-events: none;
    }

    .knob-value {
      font-size: 9px;
      color: #5C4033;
      margin-top: 3px;
      text-align: center;
      min-width: 50px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="paper-background"></div>

    <div class="header">
      <div class="title">Ouaricon Chorus</div>
      <div class="preset-placeholder">Ouaricon</div>
    </div>

    <div class="controls">
      <!-- Left group: Modulation -->
      <div class="group left-group">
        <div class="knob-container">
          <div class="knob-label">Rate</div>
          <div class="knob" data-param="rate">
            <div class="knob-indicator"></div>
          </div>
          <div class="knob-value" data-value="rate">1.00 Hz</div>
        </div>
        <div class="knob-container">
          <div class="knob-label">Depth</div>
          <div class="knob" data-param="depth">
            <div class="knob-indicator"></div>
          </div>
          <div class="knob-value" data-value="depth">50%</div>
        </div>
        <div class="knob-container">
          <div class="knob-label">Voices</div>
          <div class="knob" data-param="voices">
            <div class="knob-indicator"></div>
          </div>
          <div class="knob-value" data-value="voices">4</div>
        </div>
        <div class="knob-container">
          <div class="knob-label">Spread</div>
          <div class="knob" data-param="spread">
            <div class="knob-indicator"></div>
          </div>
          <div class="knob-value" data-value="spread">0%</div>
        </div>
      </div>

      <!-- Center: LFO Ring -->
      <div class="lfo-ring-container">
        <div class="lfo-ring-label">LFO</div>
        <div class="lfo-ring">
          <svg viewBox="0 0 90 90">
            <circle cx="45" cy="45" r="36" fill="none" stroke="rgba(139,115,85,0.2)" stroke-width="2"/>
            <circle cx="45" cy="45" r="36" fill="none" stroke="#5a7a6a" stroke-width="2.5"
              stroke-dasharray="226.19" stroke-dashoffset="226.19" id="lfo-arc"/>
            <circle id="lfo-dot" cx="45" cy="9" r="5" fill="#5a7a6a" opacity="0.9"/>
          </svg>
        </div>
      </div>

      <!-- Right group: Character -->
      <div class="group right-group">
        <div class="knob-container">
          <div class="knob-label">Width</div>
          <div class="knob" data-param="width">
            <div class="knob-indicator"></div>
          </div>
          <div class="knob-value" data-value="width">70%</div>
        </div>
        <div class="knob-container">
          <div class="knob-label">Tone</div>
          <div class="knob" data-param="tone">
            <div class="knob-indicator"></div>
          </div>
          <div class="knob-value" data-value="tone">0%</div>
        </div>
        <div class="knob-container">
          <div class="knob-label">Mix</div>
          <div class="knob" data-param="mix">
            <div class="knob-indicator"></div>
          </div>
          <div class="knob-value" data-value="mix">50%</div>
        </div>
        <div class="knob-container">
          <div class="knob-label">Drive</div>
          <div class="knob" data-param="drive">
            <div class="knob-indicator"></div>
          </div>
          <div class="knob-value" data-value="drive">30%</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/juce/index.js"></script>
  <script type="module">
    import { getSliderState } from './js/juce/index.js';

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // ════════════════════════════════════════════════════════════════
    // Knob system — 270-degree arc (-135 to +135)
    // ════════════════════════════════════════════════════════════════

    const ANGLE_MIN = -135;
    const ANGLE_MAX = 135;
    const ANGLE_RANGE = ANGLE_MAX - ANGLE_MIN;
    const SENSITIVITY = 0.005;
    const FINE_SENSITIVITY = 0.001;

    // Parameter configs: { id, formatter, defaultNorm, isVoices }
    const params = [
      { id: 'rate',   fmt: (n) => { const v = rateFromNorm(n); return v < 1 ? v.toFixed(2) + ' Hz' : v.toFixed(1) + ' Hz'; }, def: rateToNorm(1.0) },
      { id: 'depth',  fmt: (n) => Math.round(n * 100) + '%', def: 0.5 },
      { id: 'voices', fmt: (n) => String(Math.round(1 + n * 7)), def: 3/7, isVoices: true },
      { id: 'spread', fmt: (n) => Math.round(n * 100) + '%', def: 0.0 },
      { id: 'width',  fmt: (n) => Math.round(n * 100) + '%', def: 0.7 },
      { id: 'tone',   fmt: (n) => { const v = Math.round((n * 2 - 1) * 100); return (v > 0 ? '+' : '') + v + '%'; }, def: 0.5 },
      { id: 'mix',    fmt: (n) => Math.round(n * 100) + '%', def: 0.5 },
      { id: 'drive',  fmt: (n) => Math.round(n * 100) + '%', def: 0.3 }
    ];

    // Rate parameter uses logarithmic skew (0.35) — convert between norm and Hz
    // NormalisableRange: 0.05-5.0, skew=0.35
    function rateFromNorm(norm) {
      const min = 0.05, max = 5.0, skew = 0.35;
      return min + (max - min) * Math.pow(norm, 1.0 / skew);
    }

    function rateToNorm(hz) {
      const min = 0.05, max = 5.0, skew = 0.35;
      return Math.pow((hz - min) / (max - min), skew);
    }

    // Voices knob: snap to 8 discrete positions (1-8)
    function snapVoicesNorm(norm) {
      const step = Math.round(norm * 7);
      return step / 7;
    }

    // Global drag state
    const drag = { active: false, state: null, startY: 0, startNorm: 0, isVoices: false };

    // Wheel gesture tracking: debounced start/end for DAW undo entries
    const wheelTimers = new Map();

    document.addEventListener('mousemove', (e) => {
      if (!drag.active || !drag.state) return;
      const sens = e.shiftKey ? FINE_SENSITIVITY : SENSITIVITY;
      const deltaY = drag.startY - e.clientY;
      let newNorm = Math.max(0, Math.min(1, drag.startNorm + deltaY * sens));

      if (drag.isVoices) newNorm = snapVoicesNorm(newNorm);

      drag.state.setNormalisedValue(newNorm);
    });

    document.addEventListener('mouseup', () => {
      if (!drag.active) return;
      if (drag.state && drag.state.sliderDragEnded) drag.state.sliderDragEnded();
      drag.active = false;
      drag.state = null;
    });

    // ════════════════════════════════════════════════════════════════
    // LFO Ring animation
    // ════════════════════════════════════════════════════════════════

    const lfoDot = document.getElementById('lfo-dot');
    const lfoArc = document.getElementById('lfo-arc');
    let lfoPhase = 0;
    let rateState = null;
    let depthState = null;
    let lastTimestamp = 0;

    function lfoLoop(timestamp) {
      const rateNorm = rateState ? rateState.getNormalisedValue() : 0.5;
      const depthNorm = depthState ? depthState.getNormalisedValue() : 0.5;

      // Convert rate norm to Hz using log skew
      const rateHz = rateFromNorm(rateNorm);

      // Frame-rate-independent phase advance using timestamp delta
      const deltaTime = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      if (deltaTime > 0 && deltaTime < 0.1) {
        lfoPhase += rateHz * 2 * Math.PI * deltaTime;
      }
      if (lfoPhase > 2 * Math.PI) lfoPhase -= 2 * Math.PI;

      // Dot position on circle (r=36, center=45,45)
      const cx = 45 + 36 * Math.sin(lfoPhase);
      const cy = 45 - 36 * Math.cos(lfoPhase);
      lfoDot.setAttribute('cx', cx);
      lfoDot.setAttribute('cy', cy);

      // Dot size pulses with depth
      const pulse = 3 + depthNorm * 4 + Math.sin(lfoPhase) * depthNorm * 2;
      lfoDot.setAttribute('r', pulse);

      // Arc shows how much of the circle is "active" based on depth
      const arcLen = 226.19; // 2*PI*36
      const activeArc = depthNorm * arcLen;
      lfoArc.style.strokeDashoffset = arcLen - activeArc;

      requestAnimationFrame(lfoLoop);
    }

    // ════════════════════════════════════════════════════════════════
    // Setup
    // ════════════════════════════════════════════════════════════════

    document.addEventListener('DOMContentLoaded', () => {
      params.forEach((p) => {
        const state = getSliderState(p.id);
        if (!state) return;

        // Cache rate/depth for LFO animation
        if (p.id === 'rate') rateState = state;
        if (p.id === 'depth') depthState = state;

        const knobEl = document.querySelector(`.knob[data-param="${p.id}"]`);
        const indicator = knobEl ? knobEl.querySelector('.knob-indicator') : null;
        const valueEl = document.querySelector(`[data-value="${p.id}"]`);
        if (!knobEl || !indicator) return;

        function updateDisplay(norm) {
          const angle = ANGLE_MIN + norm * ANGLE_RANGE;
          indicator.style.transform = `translateX(-50%) rotate(${angle}deg)`;
          if (valueEl && p.fmt) valueEl.textContent = p.fmt(norm);
        }

        // Sync from JUCE
        state.valueChangedEvent.addListener(() => {
          updateDisplay(state.getNormalisedValue());
        });

        // Initial display
        updateDisplay(state.getNormalisedValue());

        // Drag
        knobEl.addEventListener('mousedown', (e) => {
          e.preventDefault();
          drag.active = true;
          drag.state = state;
          drag.startY = e.clientY;
          drag.startNorm = state.getNormalisedValue();
          drag.isVoices = !!p.isVoices;
          if (state.sliderDragStarted) state.sliderDragStarted();
        });

        // Mouse wheel with debounced gesture brackets
        knobEl.addEventListener('wheel', (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.02 : -0.02;
          let newNorm = Math.max(0, Math.min(1, state.getNormalisedValue() + delta));
          if (p.isVoices) newNorm = snapVoicesNorm(newNorm);

          // Start gesture on first wheel event
          if (!wheelTimers.has(p.id)) {
            state.sliderDragStarted();
          } else {
            clearTimeout(wheelTimers.get(p.id));
          }

          state.setNormalisedValue(newNorm);

          // End gesture after 200ms of no scrolling
          wheelTimers.set(p.id, setTimeout(() => {
            state.sliderDragEnded();
            wheelTimers.delete(p.id);
          }, 200));
        }, { passive: false });

        // Double-click reset
        knobEl.addEventListener('dblclick', (e) => {
          e.preventDefault();
          state.sliderDragStarted();
          let def = p.def;
          if (p.isVoices) def = snapVoicesNorm(def);
          state.setNormalisedValue(def);
          state.sliderDragEnded();
        });
      });

      // Start LFO animation
      requestAnimationFrame(lfoLoop);
    });
  </script>
</body>
</html>

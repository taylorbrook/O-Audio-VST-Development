window:
  width: 620
  height: 360
  resizable: false

controls:
  # Top Row - 7 controls in horizontal layout (height: 90px section)
  - id: threshold
    type: slider
    position: { x: 30, y: 25 }
    size: { width: 50, height: 50 }
    range: [-60.0, 0.0]
    default: -20.0
    label: "Threshold"
    label_position: { x: 30, y: 8 }

  - id: ratio
    type: slider
    position: { x: 110, y: 25 }
    size: { width: 50, height: 50 }
    range: [1.0, 20.0]
    default: 4.0
    label: "Ratio"
    label_position: { x: 110, y: 8 }

  - id: attack_time
    type: slider
    position: { x: 190, y: 25 }
    size: { width: 50, height: 50 }
    range: [0.1, 100.0]
    default: 10.0
    label: "Attack"
    label_position: { x: 190, y: 8 }

  - id: release_time
    type: slider
    position: { x: 270, y: 25 }
    size: { width: 50, height: 50 }
    range: [10.0, 1000.0]
    default: 100.0
    label: "Release"
    label_position: { x: 270, y: 8 }

  - id: knee
    type: slider
    position: { x: 350, y: 25 }
    size: { width: 50, height: 50 }
    range: [0.0, 20.0]
    default: 6.0
    label: "Knee"
    label_position: { x: 350, y: 8 }

  - id: output_gain
    type: slider
    position: { x: 430, y: 25 }
    size: { width: 50, height: 50 }
    range: [-12.0, 24.0]
    default: 0.0
    label: "Output"
    label_position: { x: 430, y: 8 }

  - id: auto_gain
    type: toggle
    position: { x: 520, y: 30 }
    size: { width: 70, height: 40 }
    default: false
    label: "Auto-Gain"
    label_position: { x: 520, y: 8 }

styling:
  colors:
    background: "#F5E6D3"
    foreground: "#3C2F2F"
    accent: "#6B8E4E"
    border: "#8B7355"
  fonts:
    primary: "'Garamond', 'Times New Roman', serif"

botanical_overlay:
  image: "shell_edinburghjournal01macg_0561.png"
  source_path: "/Users/taylorbrook/Dev/Ouaricon Audio Images/ocean/shell_edinburghjournal01macg_0561.png"
  position: "right"
  opacity: 0.35
  size_height_percent: 65

layout:
  type: "two_row_with_visualizations"
  top_row_height: 90
  bottom_row_height: 270
  visualization_panels:
    - name: "Transfer Curve"
      position: { x: 30, y: 105 }
      size: { width: 230, height: 240 }
      description: "Input vs output dB graph showing threshold, ratio, knee curve"
    - name: "Dual Envelope Display"
      position: { x: 275, y: 105 }
      size: { width: 320, height: 240 }
      description: "Top lane: input waveform, Bottom lane: output waveform with GR indicator"

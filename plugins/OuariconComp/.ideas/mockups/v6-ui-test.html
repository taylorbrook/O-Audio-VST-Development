<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OuariconComp UI Mockup v6</title>

  <style>
    /* CRITICAL: WebView constraints */
    html, body {
      height: 100%;  /* REQUIRED - replaces viewport units */
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* Browser background (outside plugin) */
    body {
      /* Native application feel */
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;

      /* Black background around plugin frame */
      background: #000;

      /* Center plugin frame in viewport */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }

    /* FIXED-SIZE PLUGIN FRAME (620x360px) - CRITICAL FIX */
    .plugin-frame {
      width: 620px;   /* FIXED - from YAML spec */
      height: 360px;  /* FIXED - from YAML spec */
      position: relative;
      overflow: hidden;

      /* Visible border to show plugin boundaries */
      border: 2px solid #444;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);

      /* Ouaricon Naturalist styling */
      background-image: url('paper-bg.jpg');
      background-size: cover;
      background-position: center;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
    }

    /* Container fills plugin frame (not browser window) */
    .container {
      width: 100%;   /* 100% of 620px frame */
      height: 100%;  /* 100% of 360px frame */
      position: relative;
    }

    /* Title - CENTERED */
    .title {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #3C2F2F;
      text-align: center;
    }

    /* Parameter labels */
    .param-label {
      position: absolute;
      font-size: 11px;
      color: #3C2F2F;
      text-align: center;
      width: 70px;
      letter-spacing: 0.5px;
    }

    /* Value displays */
    .value-display {
      position: absolute;
      font-size: 9px;
      color: #5C4033;
      text-align: center;
      width: 70px;
      font-weight: normal;
    }

    /* Seed knob container */
    .knob-container {
      position: absolute;
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    /* Seed knob - botanical aesthetic */
    .seed-knob {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #C9A27B, #8B7355);
      border: 2px solid #6B5847;
      position: relative;
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 0.3),
        inset 0 -2px 4px rgba(0, 0, 0, 0.3),
        0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* Seed center dot */
    .seed-knob::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: #4A3728;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* Seed radial lines */
    .seed-knob::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90%;
      height: 90%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 15deg,
          rgba(107, 88, 71, 0.1) 15deg,
          rgba(107, 88, 71, 0.1) 18deg
        );
    }

    /* Knob indicator line */
    .knob-indicator {
      position: absolute;
      top: 8%;
      left: 50%;
      width: 2px;
      height: 40%;
      background: #3C2F2F;
      transform-origin: bottom center;
      transform: translateX(-50%);
      border-radius: 1px;
    }

    /* Auto-Gain toggle button */
    .toggle-button {
      position: absolute;
      width: 70px;
      height: 40px;
      border: 2px solid #8B7355;
      border-radius: 4px;
      background: linear-gradient(to bottom, #E8D5BF, #D4C4B0);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #3C2F2F;
      transition: all 0.15s ease;
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .toggle-button.active {
      background: linear-gradient(to bottom, #8BA870, #6B8E4E);
      border-color: #6B8E4E;
      color: #FFFFFF;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* LED meter */
    .led-meter {
      position: absolute;
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      background: rgba(139, 115, 85, 0.1);
      border: 1px solid #8B7355;
      padding: 4px;
      border-radius: 2px;
    }

    .led-segment {
      width: 100%;
      height: 14px;
      background: #8B7355;
      border-radius: 1px;
      transition: background 0.1s ease;
    }

    .led-segment.active-low {
      background: #8BA870;
      box-shadow: 0 0 4px #8BA870;
    }

    .led-segment.active-mid {
      background: #6B8E4E;
      box-shadow: 0 0 4px #6B8E4E;
    }

    .led-segment.active-high {
      background: #C9A27B;
      box-shadow: 0 0 4px #C9A27B;
    }

    /* Visualization panels */
    .viz-panel {
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid #8B7355;
      border-radius: 4px;
      overflow: hidden;
    }

    .viz-label {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: #3C2F2F;
      background: rgba(245, 230, 211, 0.8);
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.5px;
    }

    /* Transfer curve canvas */
    #transferCurveCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Shell background in transfer curve */
    .shell-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('shell.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.5;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* Envelope display canvas */
    #envelopeCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <!-- FIXED-SIZE PLUGIN FRAME (620x360px) -->
  <div class="plugin-frame">
    <div class="container">
      <!-- Title - CENTERED -->
      <div class="title">OUARICONCOMP</div>

      <!-- Top Row Controls -->
      <!-- Threshold -->
      <div class="param-label" style="left: 5px; top: 22px;">Threshold</div>
      <div class="knob-container" id="threshold-knob" style="left: 30px; top: 37px;">
        <div class="seed-knob">
          <div class="knob-indicator" id="threshold-indicator"></div>
        </div>
      </div>
      <div class="value-display" id="threshold-value" style="left: 5px; top: 82px;">-20.0 dB</div>

      <!-- Ratio -->
      <div class="param-label" style="left: 85px; top: 22px;">Ratio</div>
      <div class="knob-container" id="ratio-knob" style="left: 110px; top: 37px;">
        <div class="seed-knob">
          <div class="knob-indicator" id="ratio-indicator"></div>
        </div>
      </div>
      <div class="value-display" id="ratio-value" style="left: 85px; top: 82px;">4.0:1</div>

      <!-- Attack -->
      <div class="param-label" style="left: 165px; top: 22px;">Attack</div>
      <div class="knob-container" id="attack-knob" style="left: 190px; top: 37px;">
        <div class="seed-knob">
          <div class="knob-indicator" id="attack-indicator"></div>
        </div>
      </div>
      <div class="value-display" id="attack-value" style="left: 165px; top: 82px;">10.0 ms</div>

      <!-- Release -->
      <div class="param-label" style="left: 245px; top: 22px;">Release</div>
      <div class="knob-container" id="release-knob" style="left: 270px; top: 37px;">
        <div class="seed-knob">
          <div class="knob-indicator" id="release-indicator"></div>
        </div>
      </div>
      <div class="value-display" id="release-value" style="left: 245px; top: 82px;">100 ms</div>

      <!-- Knee -->
      <div class="param-label" style="left: 325px; top: 22px;">Knee</div>
      <div class="knob-container" id="knee-knob" style="left: 350px; top: 37px;">
        <div class="seed-knob">
          <div class="knob-indicator" id="knee-indicator"></div>
        </div>
      </div>
      <div class="value-display" id="knee-value" style="left: 325px; top: 82px;">6.0 dB</div>

      <!-- Output -->
      <div class="param-label" style="left: 405px; top: 22px;">Output</div>
      <div class="knob-container" id="output-knob" style="left: 430px; top: 37px;">
        <div class="seed-knob">
          <div class="knob-indicator" id="output-indicator"></div>
        </div>
      </div>
      <div class="value-display" id="output-value" style="left: 405px; top: 82px;">0.0 dB</div>

      <!-- Auto-Gain Toggle -->
      <div class="param-label" style="left: 495px; top: 22px;">Auto-Gain</div>
      <div class="toggle-button" id="auto-gain-toggle" style="left: 520px; top: 37px;">OFF</div>

      <!-- Bottom Row - Meters and Visualizations -->
      <!-- Input Meter (Left) -->
      <div class="led-meter" id="input-meter" style="left: 18px; top: 105px; width: 18px; height: 240px;">
        <!-- 14 LED segments -->
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
      </div>

      <!-- Transfer Curve Panel -->
      <div class="viz-panel" style="left: 46px; top: 105px; width: 210px; height: 240px;">
        <!-- Shell background -->
        <div class="shell-background"></div>
        <canvas id="transferCurveCanvas" width="210" height="240"></canvas>
        <div class="viz-label">Transfer Curve</div>
      </div>

      <!-- Envelope Display Panel -->
      <div class="viz-panel" style="left: 266px; top: 105px; width: 308px; height: 240px;">
        <canvas id="envelopeCanvas" width="308" height="240"></canvas>
        <div class="viz-label">Envelope and Gain Reduction</div>
      </div>

      <!-- Output Meter (Right) -->
      <div class="led-meter" id="output-meter" style="left: 584px; top: 105px; width: 18px; height: 240px;">
        <!-- 14 LED segments -->
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
      </div>
    </div>
  </div>

  <script>
    // Mock JUCE backend for browser testing
    window.Juce = {
      getSliderState: (id) => ({
        normalisedValue: 0.5,
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      }),
      getToggleState: (id) => ({
        value: false,
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      })
    };

    // Disable context menu (REQUIRED)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // Parameter state
    const params = {
      threshold: { value: -20.0, min: -60.0, max: 0.0, default: -20.0 },
      ratio: { value: 4.0, min: 1.0, max: 20.0, default: 4.0 },
      attack_time: { value: 10.0, min: 0.1, max: 100.0, default: 10.0 },
      release_time: { value: 100.0, min: 10.0, max: 1000.0, default: 100.0 },
      knee: { value: 6.0, min: 0.0, max: 20.0, default: 6.0 },
      output_gain: { value: 0.0, min: -12.0, max: 24.0, default: 0.0 },
      auto_gain: { value: false }
    };

    // Format value for display
    function formatValue(paramId, value) {
      switch(paramId) {
        case 'threshold':
          return value.toFixed(1) + ' dB';
        case 'ratio':
          return value.toFixed(1) + ':1';
        case 'attack_time':
          return value.toFixed(1) + ' ms';
        case 'release_time':
          return value.toFixed(0) + ' ms';
        case 'knee':
          return value.toFixed(1) + ' dB';
        case 'output_gain':
          return (value >= 0 ? '+' : '') + value.toFixed(1) + ' dB';
        default:
          return value.toString();
      }
    }

    // Update knob rotation and value display
    function updateKnob(paramId) {
      const param = params[paramId];
      const normalized = (param.value - param.min) / (param.max - param.min);
      const rotation = (normalized * 270) - 135; // -135deg to +135deg range

      const indicator = document.getElementById(`${paramId.replace('_', '-')}-indicator`);
      if (indicator) {
        indicator.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
      }

      // Update value display
      const valueDisplay = document.getElementById(`${paramId.replace('_', '-')}-value`);
      if (valueDisplay) {
        valueDisplay.textContent = formatValue(paramId, param.value);
      }
    }

    // Knob drag handler
    function setupKnobDrag(knobId, paramId) {
      const knob = document.getElementById(knobId);
      let isDragging = false;
      let startY = 0;
      let startValue = 0;

      knob.addEventListener('mousedown', (e) => {
        isDragging = true;
        startY = e.clientY;
        startValue = params[paramId].value;
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const deltaY = startY - e.clientY;
        const range = params[paramId].max - params[paramId].min;
        const sensitivity = range / 200; // 200px for full range

        let newValue = startValue + (deltaY * sensitivity);
        newValue = Math.max(params[paramId].min, Math.min(params[paramId].max, newValue));

        params[paramId].value = newValue;
        updateKnob(paramId);
        updateTransferCurve();

        console.log(`${paramId}: ${formatValue(paramId, newValue)}`);
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // Double-click to reset
      knob.addEventListener('dblclick', () => {
        params[paramId].value = params[paramId].default;
        updateKnob(paramId);
        updateTransferCurve();
        console.log(`${paramId} reset to default`);
      });
    }

    // Auto-Gain toggle
    const autoGainToggle = document.getElementById('auto-gain-toggle');
    autoGainToggle.addEventListener('click', () => {
      params.auto_gain.value = !params.auto_gain.value;
      autoGainToggle.classList.toggle('active');
      autoGainToggle.textContent = params.auto_gain.value ? 'ON' : 'OFF';
      console.log(`Auto-Gain: ${params.auto_gain.value ? 'ON' : 'OFF'}`);
    });

    // LED meter animation
    function animateMeter(meterId) {
      const meter = document.getElementById(meterId);
      const segments = meter.querySelectorAll('.led-segment');

      setInterval(() => {
        const level = Math.random();
        segments.forEach((segment, index) => {
          const segmentThreshold = index / segments.length;
          segment.classList.remove('active-low', 'active-mid', 'active-high');

          if (level > segmentThreshold) {
            if (index < segments.length * 0.5) {
              segment.classList.add('active-low');
            } else if (index < segments.length * 0.85) {
              segment.classList.add('active-mid');
            } else {
              segment.classList.add('active-high');
            }
          }
        });
      }, 50);
    }

    // Transfer curve visualization
    function updateTransferCurve() {
      const canvas = document.getElementById('transferCurveCanvas');
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = 'rgba(139, 115, 85, 0.2)';
      ctx.lineWidth = 1;

      for (let i = 0; i <= 4; i++) {
        const x = (canvas.width / 4) * i;
        const y = (canvas.height / 4) * i;

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Transfer curve with compression
      const threshold = params.threshold.value;
      const ratio = params.ratio.value;
      const knee = params.knee.value;

      ctx.strokeStyle = '#6B8E4E';
      ctx.lineWidth = 3.5;
      ctx.beginPath();

      for (let x = 0; x < canvas.width; x++) {
        const inputDb = (x / canvas.width) * 60 - 60; // -60 to 0 dB
        let outputDb;

        if (inputDb < threshold - knee / 2) {
          // Below knee - no compression
          outputDb = inputDb;
        } else if (inputDb > threshold + knee / 2) {
          // Above knee - full compression
          outputDb = threshold + (inputDb - threshold) / ratio;
        } else {
          // Within knee - soft transition
          const kneeInput = inputDb - (threshold - knee / 2);
          const kneeRange = knee;
          const kneePos = kneeInput / kneeRange;
          outputDb = inputDb + (kneePos * kneePos) * ((inputDb - threshold) / ratio - (inputDb - threshold));
        }

        const y = canvas.height - ((outputDb + 60) / 60) * canvas.height;

        if (x === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();
    }

    // Envelope display visualization
    function drawEnvelopeDisplay() {
      const canvas = document.getElementById('envelopeCanvas');
      const ctx = canvas.getContext('2d');

      // Mock waveform display
      setInterval(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Top lane - input waveform
        ctx.strokeStyle = 'rgba(107, 142, 78, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();

        for (let x = 0; x < canvas.width; x++) {
          const y = canvas.height / 4 + Math.sin(x / 10 + Date.now() / 100) * 20;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Bottom lane - output waveform
        ctx.strokeStyle = 'rgba(107, 142, 78, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();

        for (let x = 0; x < canvas.width; x++) {
          const y = (canvas.height * 3) / 4 + Math.sin(x / 10 + Date.now() / 100) * 15;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Gain reduction indicator
        const grAmount = Math.abs(Math.sin(Date.now() / 500)) * 30;
        ctx.fillStyle = 'rgba(201, 162, 123, 0.4)';
        ctx.fillRect(10, canvas.height / 2 + 30, grAmount * 5, 20);

        ctx.fillStyle = '#3C2F2F';
        ctx.font = '9px Garamond, serif';
        ctx.fillText(`GR: -${grAmount.toFixed(1)} dB`, 15, canvas.height / 2 + 55);
      }, 50);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Setup knob interactions
      setupKnobDrag('threshold-knob', 'threshold');
      setupKnobDrag('ratio-knob', 'ratio');
      setupKnobDrag('attack-knob', 'attack_time');
      setupKnobDrag('release-knob', 'release_time');
      setupKnobDrag('knee-knob', 'knee');
      setupKnobDrag('output-knob', 'output_gain');

      // Initialize knob positions and value displays
      updateKnob('threshold');
      updateKnob('ratio');
      updateKnob('attack_time');
      updateKnob('release_time');
      updateKnob('knee');
      updateKnob('output_gain');

      // Start visualizations
      updateTransferCurve();
      drawEnvelopeDisplay();
      animateMeter('input-meter');
      animateMeter('output-meter');

      console.log('OuariconComp v6 UI loaded - FIXED 620x360px sizing');
      console.log('Drag knobs to adjust, double-click to reset');
    });
  </script>
</body>
</html>

                const k = sel ? 1.5 : 1, g = cx.createLinearGradient(0, M.t, 0, M.t + plotH);
                g.addColorStop(0, rgba(c, 0.27 * k)); g.addColorStop(0.5, rgba(c, 0.07 * k)); g.addColorStop(1, rgba(c, 0.27 * k));
                if (tracePath(cx, xs, ys, y0)) { cx.fillStyle = g; cx.fill(); }
            }
            tracePath(cx, xs, ys);
            cx.strokeStyle = rgba(c, byp ? 0.7 : sel ? 0.95 : 0.72); cx.lineWidth = sel ? 1.4 : 1;
            if (byp) cx.setLineDash([4, 3]);
            cx.stroke(); cx.setLineDash([]);
        }

        // Summed response: ink, with a soft bleed under the line. Flat and
        // dashed while the plugin is bypassed.
        const audible = globalBypass ? [] : bands.filter((b) => !bandBool(b, 'bypass'));
        const sum = composeSum(audible, responses, n, sumView());
        const ys = new Array(n);
        for (let i = 0; i < n; i++) ys[i] = lim(gy(sum[i]));
        cx.lineJoin = 'round'; cx.lineCap = 'round';
        tracePath(cx, xs, ys); cx.strokeStyle = 'rgba(60,47,47,0.13)'; cx.lineWidth = 5; cx.stroke();
        tracePath(cx, xs, ys); cx.strokeStyle = '#3C2F2F'; cx.lineWidth = 1.9;
        if (globalBypass) cx.setLineDash([6, 4]);
        cx.stroke(); cx.setLineDash([]);
    }
    cx.restore();

    const order = bands.slice().sort((a, b) => (a === ui.selected) - (b === ui.selected));
    for (const b of order) drawNode(cx, b, t);
    const ro = ui.drag ? ui.drag.b : ui.hover;
    if (ro && bandOn(ro)) drawReadout(cx, ro);
}

// The listen halo is the page's only animation. It runs only while a band is
// listening, and not at all under prefers-reduced-motion (the halo is then
// drawn static and dotted, so the state stays visible).
function listenPulse() {
    const want = ui.listen > 0 && !reducedMotion;
    if (want && !pulseRaf) {
        const tick = () => {
            pulseRaf = 0;
            if (!(ui.listen > 0) || reducedMotion) return;
            try { draw(); } catch (e) { console.error('draw failed:', e); }
            pulseRaf = requestAnimationFrame(tick);
        };
        pulseRaf = requestAnimationFrame(tick);
    }
}

// ── Response display: interaction ───────────────────────────────────────────
function initDisplay() {
    curveEl = $('curve');
    if (!curveEl) { console.error('Missing curve canvas'); return; }
    curveCtx = curveEl.getContext('2d');

    const local = (e) => { const r = curveEl.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const M = PLOT_MARGIN;

    const onMove = (e) => {
        const d = ui.drag;
        if (!d) return;
        const [x, y] = local(e);
        const fSt = sliderState[bid(d.b, 'freq')], gSt = sliderState[bid(d.b, 'gain')];
        if (!d.moved) {
            if (Math.abs(x - d.sx) + Math.abs(y - d.sy) < DRAG_THRESHOLD_PX) return;
            d.moved = true;
            wheelEnd(fSt); wheelEnd(gSt);
            fSt.sliderDragStarted(); gSt.sliderDragStarted();    // gesture begin on both
        }
        const scale = gainScale();
        setScaled(fSt, xf(x - d.ox));
        if (TYPE_HAS_GAIN[bandChoice(d.b, 'type')] && scale > 0.01)
            setScaled(gSt, yg(y - d.oy) / scale);                // clamped by the live range
        requestRender();
    };

    // Idempotent: pointerup, pointercancel and lostpointercapture can all fire.
    const onUp = (e) => {
        const d = ui.drag;
        if (!d) return;
        ui.drag = null;
        if (d.moved) {
            sliderState[bid(d.b, 'freq')].sliderDragEnded();
            sliderState[bid(d.b, 'gain')].sliderDragEnded();     // gesture end on both
        }
        curveEl.removeEventListener('pointerup', onUp);
        curveEl.removeEventListener('pointercancel', onUp);
        curveEl.removeEventListener('lostpointercapture', onUp);
        if (e && e.pointerId !== undefined) {
            try { curveEl.releasePointerCapture(e.pointerId); } catch (_) { /* already released */ }
        }
        curveEl.style.cursor = ui.hover ? 'grab' : 'crosshair';
        requestRender();
    };

    curveEl.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || ui.drag) return;
        const [x, y] = local(e);
        curveEl.focus({ preventScroll: true });
        let b = hitNode(x, y), ox = 0, oy = 0;
        if (b) {
            const [nx, ny] = nodePos(b);
            ox = x - nx; oy = y - ny;
            selectBand(b);
        } else {
            // Click on the empty plot: the next free band, as a bell, there.
            if (x < M.l || x > M.l + plotW || y < M.t || y > M.t + plotH) return;
            const scale = gainScale();
            b = createBand(0, xf(x), scale > 0.01 ? Math.round(yg(y) / scale * 10) / 10 : 0);
            if (!b) return;
        }
        ui.drag = { b, ox, oy, moved: false, sx: x, sy: y };
        try { curveEl.setPointerCapture(e.pointerId); } catch (_) { /* older backends */ }
        curveEl.addEventListener('pointerup', onUp);
        curveEl.addEventListener('pointercancel', onUp);
        curveEl.addEventListener('lostpointercapture', onUp);
        curveEl.style.cursor = 'grabbing';
        requestRender();
    });

    curveEl.addEventListener('pointermove', (e) => {
        if (ui.drag) { onMove(e); return; }
        const [x, y] = local(e), h = hitNode(x, y);
        if (h !== ui.hover) {
            ui.hover = h;
            curveEl.style.cursor = h ? 'grab' : 'crosshair';
            requestRender();
        }
    });
    curveEl.addEventListener('pointerleave', () => {
        if (!ui.drag && ui.hover) { ui.hover = 0; requestRender(); }
    });

    // Double-click a node: reset its gain (not the click that just created it).
    curveEl.addEventListener('dblclick', (e) => {
        const [x, y] = local(e), b = hitNode(x, y);
        if (!b || performance.now() - ui.createdAt < CREATE_DBLCLICK_MS) return;
        const def = defaultOf(bid(b, 'gain'));
        if (def !== null) writeScaled(sliderState[bid(b, 'gain')], def);
    });

    // Scroll on a node: Q, in the log domain (Shift = fine). One burst = one gesture.
    curveEl.addEventListener('wheel', (e) => {
        const [x, y] = local(e), b = hitNode(x, y);
        if (!b) return;
        if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;   // not ours; no preventDefault
        e.preventDefault();
        const st = sliderState[bid(b, 'q')], p = st.properties;
        const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
        wheelTouch(st);
        setScaled(st, clamp(st.getScaledValue() * Math.exp(-dy * (e.shiftKey ? 0.0006 : 0.0025)), p.start, p.end));
        selectBand(b);
    }, { passive: false });

    // The layout reflows: redraw whenever the display box changes size.
    if (typeof ResizeObserver === 'function') new ResizeObserver(requestRender).observe(curveEl);
    window.addEventListener('resize', requestRender);

    // Canvas text keeps the fallback face unless the font is loaded before it
    // paints: load both faces, then repaint.
    if (document.fonts && document.fonts.load) {
        Promise.all([document.fonts.load('11px "EB Garamond"'), document.fonts.load('italic 11px "EB Garamond"')])
            .catch(() => {})
            .then(requestRender);
    }

    if (window.matchMedia) {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        reducedMotion = mq.matches;
        const onChange = (e) => { reducedMotion = e.matches; requestRender(); };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
    }
}

// ── C++ -> page events: section parameters and analyzer frames ──────────────
// eqSections payload (see PluginEditor timerCallback):
//   { sampleRate, bands: [{ band (1-based), type, placement, active,
//                           sections: [[g, k, mL, mB, mH] ...],
//                           onePoles: [[G, cL, cH] ...] } ...] }
function onEqSections(payload) {
    const data = typeof payload === 'string' ? JSON.parse(payload) : payload;
    if (!data) return;
    if (Number(data.sampleRate) > 0) displaySampleRate = Number(data.sampleRate);
    const list = Array.isArray(data.bands) ? data.bands : [];
    for (const pk of list) {
        const b = Number(pk && pk.band);
        if (b >= 1 && b <= NB) bandPackets[b] = pk;
    }
    requestRender();
}

function initBridge(juce) {
    const backend = window.__JUCE__ && window.__JUCE__.backend;
    if (backend && typeof backend.addEventListener === 'function') {
        backend.addEventListener('eqSections', onEqSections);
        backend.addEventListener('analyzerPre',  (a) => { analyzerPre  = Array.isArray(a) ? a : null; if (ui.analyzer) requestRender(); });
        backend.addEventListener('analyzerPost', (a) => { analyzerPost = Array.isArray(a) ? a : null; if (ui.analyzer) requestRender(); });
        // 'outputLevel' belongs to the vu-meter mount (Stage 3).
    } else {
        console.warn('JUCE backend events unavailable: no response curve, no analyzer');
    }

    // Session UI state: PULL once at init (a one-shot push would go stale).
    try {
        setUiStateNative = juce.getNativeFunction('setUiState');
        setListenNative  = juce.getNativeFunction('setListenBand');
        resizeNative     = juce.getNativeFunction('resizeEditor');
        juce.getNativeFunction('getUiState')()
            .then((raw) => {
                const s = typeof raw === 'string' ? JSON.parse(raw) : raw;
                if (!s) return;
                if ([0, 1, 2, 3].includes(Number(s.analyzerMode))) ui.analyzer = Number(s.analyzerMode);
                if ([6, 12, 30].includes(Number(s.displayRange))) ui.range = Number(s.displayRange);
                const sel = Number(s.selectedBand);
                if (sel >= 1 && sel <= NB && bandOn(sel)) ui.selected = sel;
                requestRender();
            })
            .catch((e) => console.warn('Could not read UI state:', e));
        // Ask for every band's section parameters (pull, not a one-shot push).
        juce.getNativeFunction('requestEqSections')().catch(() => {});
    } catch (e) {
        console.warn('UI state bridge not available, session-only:', e);
    }

    // No stored selection: start on the first band that exists.
    if (!selectedBand()) {
        const first = activeBands()[0];
        if (first) ui.selected = first;
    }
}

// ── Preset bar: preset-manager 1.1.1 mount ──────────────────────────────────
// Dynamic import, so a missing module cannot take the page down with it.
async function initPresetBar(juce) {
    try {
        const mod = await import('./modules/preset-manager.js');
        presetManager = new mod.PresetManager({
            displayElement: $('preset-name'),
            prevButton: $('preset-prev'),
            nextButton: $('preset-next'),
            saveButton: $('preset-save'),
            getNativeFunction: juce.getNativeFunction,
            onPresetChanged: () => {
                // A preset replaces every band: re-pull the section parameters.
                juce.getNativeFunction('requestEqSections')().catch(() => {});
                requestRender();
            },
        });
        await presetManager.initialize();
    } catch (e) {
        console.error('preset manager init failed:', e);
    }
}

// ── Corner grip ─────────────────────────────────────────────────────────────
// The WebView covers the editor, so the page asks C++ for a size. C++ clamps
// to the same limits.
function initGrip() {
    const grip = $('grip');
    if (!grip) return;
    let d = null, pending = null, raf = 0;

    const flush = () => {
        raf = 0;
        if (pending && resizeNative) resizeNative(pending[0], pending[1]).catch(() => {});
        pending = null;
    };
    const onMove = (e) => {
        if (!d) return;
        pending = [Math.round(clamp(d.w + (e.clientX - d.x), WIN_MIN_W, WIN_MAX_W)),
                   Math.round(clamp(d.h + (e.clientY - d.y), WIN_MIN_H, WIN_MAX_H))];
        if (!raf) raf = requestAnimationFrame(flush);
    };
    const onUp = (e) => {
        if (!d) return;
        d = null;
        grip.removeEventListener('pointermove', onMove);
        grip.removeEventListener('pointerup', onUp);
        grip.removeEventListener('pointercancel', onUp);
        grip.removeEventListener('lostpointercapture', onUp);
        if (e && e.pointerId !== undefined) {
            try { grip.releasePointerCapture(e.pointerId); } catch (_) { /* already released */ }
        }
    };
    grip.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        d = { x: e.clientX, y: e.clientY, w: window.innerWidth, h: window.innerHeight };
        try { grip.setPointerCapture(e.pointerId); } catch (_) { /* older backends */ }
        grip.addEventListener('pointermove', onMove);
        grip.addEventListener('pointerup', onUp);
        grip.addEventListener('pointercancel', onUp);
        grip.addEventListener('lostpointercapture', onUp);
    });
}

// ── Settings popover ────────────────────────────────────────────────────────
function initSettingsPopover() {
    const gearBtn = document.getElementById('gear-btn');
    const popover = document.getElementById('settings-popover');
    if (gearBtn === null || popover === null) {
        console.warn('settings popover missing: language selector unavailable');
        return;
    }

    const setOpen = (open) => {
        popover.hidden = !open;
        gearBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };

    gearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setOpen(popover.hidden);
    });

    // Dismiss on a press anywhere else, and on Escape. Capture-phase
    // pointerdown, NOT document mousedown: the knobs and fields preventDefault
    // their pointerdown, which suppresses the compatibility mousedown.
    document.addEventListener('pointerdown', (e) => {
        if (popover.hidden) return;
        if (popover.contains(e.target) || gearBtn.contains(e.target)) return;
        setOpen(false);
    }, true);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !popover.hidden) {
            setOpen(false);
            gearBtn.focus();
        }
    });
}

// ── Tooltips (the O-ReverseDelay renderer) ──────────────────────────────────
// Reads data-tip-title / data-tip off the anchor; applyI18n() writes both from
// TIP_BINDINGS. textContent only.
function handleTooltipOver(e) {
    const target = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!target || target === tooltipTarget) return;

    tooltipTarget = target;
    clearTimeout(tooltipTimer);

    if (tooltipSuppressed) return;
    tooltipTimer = setTimeout(() => showTooltip(target), TOOLTIP_DELAY_MS);
}

function handleTooltipOut(e) {
    const target = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!target) return;

    // Moving between children of the same control is not a real exit.
    if (e.relatedTarget && target.contains(e.relatedTarget)) return;

    hideTooltip();
}

function showTooltip(target) {
    // The pointer may have moved on, or gone down, during the delay.
    if (!tooltipEl || tooltipSuppressed || target !== tooltipTarget) return;

    // The hover-help switch is a SHOW gate. data-tip-always survives it.
    if (!tipsEnabled && !target.hasAttribute('data-tip-always')) return;

    const title = target.getAttribute('data-tip-title');
    const body  = target.getAttribute('data-tip');

    tooltipEl.textContent = '';

    if (title) {
        const titleEl = document.createElement('div');
        titleEl.className = 'tooltip-title';
        titleEl.textContent = title;
        tooltipEl.appendChild(titleEl);
    }

    const bodyEl = document.createElement('div');
    bodyEl.className = 'tooltip-body';
    bodyEl.textContent = body;
    tooltipEl.appendChild(bodyEl);

    const anchor = target.getBoundingClientRect();

    // MEASURE, THEN PIN, THEN CLAMP. A fixed box with `left` set and width auto
    // shrinks to fit the space to its right, so measuring at the previous
    // offset under-reports the width and a near-edge `left` re-wraps the tip
    // into a ribbon. Release the width, measure from the left edge, pin the
    // result in px, and only then place.
    tooltipEl.style.width = '';
    tooltipEl.style.left  = '0px';
    tooltipEl.style.top   = '0px';

    const width = tooltipEl.getBoundingClientRect().width;
    tooltipEl.style.width = `${width}px`;

    // Height is only stable once the width is definite.
    const height = tooltipEl.getBoundingClientRect().height;

    // Prefer above; flip below only when there is no room at the top. Then
    // clamp inside the window on both axes (the window is resizable, so the
    // limits are read now, not cached).
    let top = anchor.top - height - TOOLTIP_MARGIN;
    let placement = 'above';

    if (top < TOOLTIP_MARGIN) {
        top = anchor.bottom + TOOLTIP_MARGIN;
        placement = 'below';
    }
    top = Math.max(TOOLTIP_MARGIN, Math.min(window.innerHeight - height - TOOLTIP_MARGIN, top));

    const anchorCentreX = anchor.left + anchor.width / 2;
    const maxLeft = window.innerWidth - width - TOOLTIP_MARGIN;
    const left = Math.max(TOOLTIP_MARGIN, Math.min(maxLeft, anchorCentreX - width / 2));

    tooltipEl.style.left = `${left}px`;
    tooltipEl.style.top  = `${top}px`;
    tooltipEl.dataset.placement = placement;

    // The tip is clamped, but the arrow still points at the control.
    const arrowX = Math.max(10, Math.min(width - 10, anchorCentreX - left));
    tooltipEl.style.setProperty('--arrow-x', `${arrowX}px`);

    tooltipEl.classList.add('visible');
    tooltipEl.setAttribute('aria-hidden', 'false');
}

function hideTooltip() {
    clearTimeout(tooltipTimer);
    tooltipTarget = null;

    if (!tooltipEl) return;
    tooltipEl.classList.remove('visible');
    tooltipEl.setAttribute('aria-hidden', 'true');
}

function applyTipsEnabled(on) {
    tipsEnabled = !!on;
    if (!tipsEnabled) hideTooltip();
    const btn = document.getElementById('tips-toggle');
    if (!btn) return;
    btn.setAttribute('aria-pressed', tipsEnabled ? 'true' : 'false');
    // Two calls in two branches, never one call with a ternary.
    if (tipsEnabled) setLabel(btn, 'ui.on');
    else             setLabel(btn, 'ui.off');
}

function initTipsToggle() {
    const btn = document.getElementById('tips-toggle');
    if (!btn) { console.error('Missing tips-toggle element'); return; }
    let stored = null;
    try { stored = localStorage.getItem(TIPS_STORAGE_KEY); } catch (e) { stored = null; }
    applyTipsEnabled(stored !== 'false');          // first run and private mode: ON
    btn.addEventListener('click', () => {
        applyTipsEnabled(!tipsEnabled);
        try { localStorage.setItem(TIPS_STORAGE_KEY, String(tipsEnabled)); }
        catch (e) { /* private mode: the switch still works, it just forgets */ }
    });
}

function initTooltips() {
    tooltipEl = document.getElementById('tooltip');
    if (!tooltipEl) { console.warn('Tooltip element not found: tooltips disabled'); return; }

    document.addEventListener('mouseover', handleTooltipOver);
    document.addEventListener('mouseout', handleTooltipOut);

    // Any press begins a click or a drag: get the tip out of the way and keep
    // it away until release. Capture phase, because the knobs and fields
    // preventDefault their own pointerdown.
    document.addEventListener('pointerdown', () => {
        tooltipSuppressed = true;
        hideTooltip();
    }, true);

    document.addEventListener('pointerup', () => { tooltipSuppressed = false; }, true);
    document.addEventListener('pointercancel', () => { tooltipSuppressed = false; }, true);
}

// ════════════════════════════════════════════════════════════════════════════
// THE CANON — pasted verbatim from scripts/i18n-canon.js (check-i18n [6]
// byte-compares it). Never retyped, never edited.
// ════════════════════════════════════════════════════════════════════════════
let uiLanguage = 'en';
let getUiLanguageNative = null;
let setUiLanguageNative = null;

// LABELS first, I18N as the fallback: a control whose tooltip title already IS
// its label carries one key, not two copies of the same string.
function trLabel(key, lang, vars) {
    const entry = (typeof LABELS === 'object' && LABELS && LABELS[key]) || I18N[key];
    if (!entry) { console.warn(`i18n: missing label key ${key}`); return key; }
    const s = entry[lang] || entry.en;
    const resolve = (v) => {
        const nested = (typeof LABELS === 'object' && LABELS && LABELS[v]) || I18N[v];
        return nested ? String((nested[lang] || nested.en).t) : String(v);
    };
    return vars
        ? String(s.t).replace(/\{(\w+)\}/g, (m, n) => (n in vars ? resolve(vars[n]) : m))
        : String(s.t);
}

function applyLabel(el) {
    const key = el.dataset.i18n;
    if (!key) return;
    let vars = null;
    try { vars = el.dataset.i18nVars ? JSON.parse(el.dataset.i18nVars) : null; }
    catch (e) { console.warn(`i18n: bad vars on ${key}`); }
    const s = trLabel(key, uiLanguage, vars);
    el.dataset.label = s;
    el.textContent   = s;
}

function applyI18nAttributes(el) {
    const pairs = [['i18nAria', 'aria-label'], ['i18nPlaceholder', 'placeholder'], ['i18nAlt', 'alt']];
    for (const [prop, attr] of pairs) {
        const key = el.dataset[prop];
        if (key) el.setAttribute(attr, trLabel(key, uiLanguage, null));
    }
}

function setLabel(el, key, vars) {
    if (!el) return;
    el.dataset.i18n = key;
    if (vars) el.dataset.i18nVars = JSON.stringify(vars); else delete el.dataset.i18nVars;
    applyLabel(el);
}

function applyI18n(lang) {
    uiLanguage = LANGUAGES.includes(lang) ? lang : 'en';
    // <html lang> follows the selector: screen readers pick the French voice,
    // and CSS hyphens:auto / quotes resolve in the page's actual language.
    document.documentElement.lang = uiLanguage;
    for (const [selector, key, wrapper, vars] of TIP_BINDINGS) {
        const el = document.querySelector(selector);
        if (!el) { console.warn(`i18n: tip target not found: ${selector}`); continue; }
        const target = wrapper ? (el.closest(wrapper) || el) : el;
        const s = tr(key, uiLanguage, vars);
        target.setAttribute('data-tip-title', s.t);
        target.setAttribute('data-tip', s.b);
    }
    for (const el of document.querySelectorAll('[data-i18n]')) applyLabel(el);
    for (const el of document.querySelectorAll('[data-i18n-aria],[data-i18n-placeholder],[data-i18n-alt]'))
        applyI18nAttributes(el);
    const sel = document.getElementById('lang-select');
    if (sel && sel.value !== uiLanguage) sel.value = uiLanguage;
}

// Exposed so a clamp gate can drive the language without teaching the ui-stub a
// promise contract: page.evaluate((l) => window.__setLanguage(l), 'fr').
window.__setLanguage = applyI18n;
// Exposed for the same reason, and so a sibling module can write a localized
// label without app.js having to export anything — O-Bitrot's controller is an
// inline <script type="module">, where an export declaration has nowhere to go.
window.__setLabel = setLabel;
// Re-runs the sweep at the CURRENT language, for a subtree built AFTER the last
// one. It cannot be window.__setLanguage, which needs a language argument the
// caller does not have: uiLanguage lives in this module's scope and nothing
// outside can read it, so guessing 'en' would silently reset a French page every
// time a panel remounted.
//
// This is in the canon because three plugins wrote it independently, OUTSIDE the
// byte-compared region, each with a comment explaining that the region "may not
// gain a line" — O-Bells (index.html:1992), O-Marimba and O-IntonationPad
// (js/app.js). Three authors hitting the same wall and working around it the
// same way is the canon's job, not theirs. Declaring it here changes no
// behaviour on a page that never calls it; it only means a page that needs it no
// longer has to reach around the gate to get it.
window.__reapplyI18n = () => applyI18n(uiLanguage);

function initI18n() {
    try {
        getUiLanguageNative = Juce.getNativeFunction('getUiLanguage');
        setUiLanguageNative = Juce.getNativeFunction('setUiLanguage');
    } catch (e) {
        console.warn('Language preference not available, session-only:', e);
    }

    // Paint the default SYNCHRONOUSLY first. Never blank, never a flash.
    try { applyI18n('en'); } catch (e) { console.error('i18n init failed:', e); }

    if (getUiLanguageNative) {
        getUiLanguageNative()
            .then((code) => applyI18n(code))
            .catch((e) => console.warn('Could not read language preference:', e));
    }

    const sel = document.getElementById('lang-select');
    if (sel) sel.addEventListener('change', (e) => {
        applyI18n(e.target.value);
        if (setUiLanguageNative) setUiLanguageNative(uiLanguage).catch(() => {});
    });
}

// ── Entry point ─────────────────────────────────────────────────────────────
function init() {
    // Required: no browser context menu.
    document.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });

    // 196 parameter states: 2 knobs + 2 toggles here, 192 band states below.
    try { KNOB_IDS.forEach((id) => bindKnob(Juce, id)); } catch (e) { console.error('knob binding failed:', e); }
    try { bindToggle(Juce, 'bypass'); bindToggle(Juce, 'auto_gain'); } catch (e) { console.error('toggle binding failed:', e); }
    try { bindBandStates(Juce); } catch (e) { console.error('band binding failed:', e); }

    try { initStrip(); }       catch (e) { console.error('strip init failed:', e); }
    try { initDisplay(); }     catch (e) { console.error('display init failed:', e); }
    try { initBridge(Juce); }  catch (e) { console.error('bridge init failed:', e); }
    try { initGrip(); }        catch (e) { console.error('grip init failed:', e); }

    loadParameterDefaults(Juce);   // async; double-click reset and new-band Q depend on it
    initPresetBar(Juce);           // async; catches its own errors

    // Order is load-bearing: applyI18n() (inside initI18n) is what writes
    // data-tip onto the anchors the tooltip renderer resolves.
    try { initSettingsPopover(); } catch (e) { console.error('settings popover init failed:', e); }
    try { initI18n(); }            catch (e) { console.error('i18n init failed:', e); }
    try { initTooltips(); }        catch (e) { console.error('tooltip init failed:', e); }
    try { initTipsToggle(); }      catch (e) { console.error('tips toggle init failed:', e); }

    requestRender();
}

// ════ ONE call, at the very BOTTOM of the module ════
init();
</script>

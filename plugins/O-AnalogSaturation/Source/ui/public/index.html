<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouaricon Saturation Modeling</title>

  <style>
    /* ===== CRITICAL WEBVIEW CONSTRAINTS ===== */
    html, body {
      height: 100%;  /* REQUIRED - replaces viewport units */
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* Native application feel */
    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
      font-family: 'Garamond', 'Times New Roman', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* ===== PLUGIN CONTAINER ===== */
    .container {
      width: 100%;
      height: 100%;
      position: relative;

      /* Paper texture background */
      background-image: url('img/paper1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ===== DECORATIVE BORDERS ===== */
    .border {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid #8B7355;
      pointer-events: none;
      z-index: 100;
    }

    .divider {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 1px;
      background: rgba(139, 115, 85, 0.4);
      pointer-events: none;
      z-index: 10;
    }

    .divider.top { top: 47px; }
    .divider.middle { top: 115px; }
    .divider.bottom { top: 360px; }

    /* ===== TITLE ===== */
    .title {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: normal;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 3px;
      z-index: 20;
    }

    /* ===== MODEL BUTTONS (centered row) ===== */
    .model-buttons {
      position: absolute;
      top: 70px;
      left: 70px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .model-button {
      width: 110px;
      height: 30px;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 5px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .model-button:last-child {
      width: 100px;
    }

    .model-button:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .model-button.active {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
      font-weight: bold;
    }

    /* ===== INTENSITY KNOB (Enhanced 3D texture, positioned LEFT) ===== */
    .knob-container {
      position: absolute;
      left: 175px;
      top: 180px;
      width: 90px;
      height: 90px;
      z-index: 40;
    }

    .knob {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      cursor: ns-resize;

      /* ENHANCED 3D TEXTURE */
      background: radial-gradient(circle at 35% 35%, #F5DEB3, #E8D5B7 50%, #D8C5A7 100%);
      border: 2px solid #8B7355;

      /* Multiple layered inset shadows for depth */
      box-shadow:
        inset 0 -3px 6px rgba(0,0,0,0.3),
        inset 0 3px 6px rgba(255,255,255,0.2),
        inset -2px -2px 4px rgba(0,0,0,0.2),
        inset 2px 2px 4px rgba(255,255,255,0.15),
        /* Pronounced drop shadow for lift */
        0 4px 8px rgba(0,0,0,0.4);

      transform-origin: center center;
      transition: transform 0.05s ease-out;
    }

    /* Cross-hatch texture overlay */
    .knob::before {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background:
        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px),
        repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
      opacity: 0.15;
      pointer-events: none;
    }

    /* Bevel highlight */
    .knob::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      right: 40%;
      bottom: 40%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent 60%);
      pointer-events: none;
    }

    /* Knob segments (10 radial sections) */
    .knob-segments {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        conic-gradient(
          #F5DEB3 0deg 36deg,
          #8B7355 36deg 38deg,
          #E8D5B7 38deg 72deg,
          #8B7355 72deg 74deg,
          #F5DEB3 74deg 108deg,
          #8B7355 108deg 110deg,
          #E8D5B7 110deg 144deg,
          #8B7355 144deg 146deg,
          #F5DEB3 146deg 180deg,
          #8B7355 180deg 182deg,
          #E8D5B7 182deg 216deg,
          #8B7355 216deg 218deg,
          #F5DEB3 218deg 252deg,
          #8B7355 252deg 254deg,
          #E8D5B7 254deg 288deg,
          #8B7355 288deg 290deg,
          #F5DEB3 290deg 324deg,
          #8B7355 324deg 326deg,
          #E8D5B7 326deg 360deg
        );
      pointer-events: none;
    }

    /* V4 REFINEMENT: Indicator dot at EDGE (~92% radius) */
    .knob-indicator {
      position: absolute;
      top: 4px;  /* V4: Moved from 12px to 4px (closer to edge) */
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #3C2F2F;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    /* INTENSITY LABEL CENTERED BENEATH KNOB */
    .knob-label {
      position: absolute;
      left: 175px;
      top: 280px;
      width: 90px;
      font-size: 11px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }

    /* ===== VU METERS (TOP-ORIENTED scales) ===== */
    /* V4 REFINEMENT: GREEN COLOR SCHEME */
    .vu-meter {
      position: absolute;
      width: 90px;
      height: 90px;
      z-index: 30;
    }

    .vu-meter.input { left: 55px; top: 193px; }
    .vu-meter.output { left: 455px; top: 193px; }

    .vu-face {
      width: 100%;
      height: 100%;
      background: rgba(139, 168, 112, 0.3);  /* V4: Light green */
      border: 2px solid #3C5C1A;  /* V4: Dark green border */
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }

    /* Scale labels along TOP arc */
    .vu-scale {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 20px;
      display: flex;
      justify-content: space-between;
      padding: 0 8px;
      font-size: 7px;
      color: #3C2F2F;
      font-family: 'Garamond', serif;
      pointer-events: none;
    }

    .vu-scale span {
      display: inline-block;
      text-align: center;
    }

    /* V4: Needle sweeps upward from bottom (GREEN color) */
    .vu-needle {
      position: absolute;
      bottom: 15px;
      left: 50%;
      width: 2px;
      height: 40px;
      background: linear-gradient(180deg, #d4a574 0%, #c49564 100%);
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-45deg);
      transition: transform 0.1s ease-out;
      pointer-events: none;
      z-index: 5;
    }

    .vu-needle::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      background: #3C5C1A;  /* V4: Dark green pivot */
      border-radius: 50%;
    }

    .vu-label {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      color: #3C2F2F;
      font-weight: bold;
      pointer-events: none;
    }

    /* V4 REFINEMENT: SNAKE MOVED LEFT (x: 285px, center at ~375px) */
    .snake-overlay {
      position: absolute;
      left: 267px;  /* V4: Adjusted for 120% size */
      top: 145px;   /* V4: Moved down 10px */
      width: 216px;  /* V4: Enlarged 120% (180 * 1.2) */
      height: 216px;
      opacity: 0.2;
      mix-blend-mode: multiply;
      filter: sepia(0.2);
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.3s ease;
      object-fit: contain;
    }

    /* ===== QUALITY SECTION ===== */
    .quality-label {
      position: absolute;
      left: 162px;
      top: 375px;
      font-size: 9px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 20;
    }

    .quality-buttons {
      position: absolute;
      left: 50px;
      top: 395px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .quality-button {
      width: 75px;
      height: 28px;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 4px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quality-button:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .quality-button.active {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
      font-weight: bold;
    }

    /* ===== AUTOGAIN TOGGLE ===== */
    .autogain-toggle {
      position: absolute;
      left: 450px;
      top: 395px;
      width: 100px;
      height: 28px;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 4px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 30;
    }

    .autogain-toggle:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .autogain-toggle.active {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
      font-weight: bold;
    }

    .autogain-toggle::after {
      content: '❦';
      font-size: 12px;
      opacity: 0.7;
    }

    /* ===== SETTINGS POPOVER (v1.2.0) =====
       Styled in THIS page's vocabulary, not pasted in from another plugin: the
       olive fill rgba(139,168,112,0.3) over a #3C5C1A border, the #2C3E10
       active state, Garamond, uppercase, letter-spacing — the same four rules
       every other control on this page already uses.

       The cluster sits top-right ABOVE the first divider (y = 47) and clear of
       the centred .title, which spans roughly x 167-433 at 20 px / 3 px
       tracking. z-index 60 puts it over the snake (5) and the button rows (30)
       but under .border (100), which is pointer-events: none and therefore
       cannot swallow the click. */
    .settings-cluster {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 60;
    }

    .gear-btn {
      width: 22px;
      height: 22px;
      padding: 0;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 50%;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .gear-btn:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .gear-btn[aria-expanded="true"] {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
    }

    .gear-btn:focus-visible {
      outline: 2px solid #3C5C1A;
      outline-offset: 2px;
    }

    /* Opens DOWNWARDS and to the left. The gear is 12 px from the top of a
       450 px frame, so a panel above it would leave the frame entirely.

       WIDTH IS PINNED, not min-width. .settings-popover is not a [data-i18n]
       element, so check-ui-labels assertion 7 measures its box in BOTH
       languages and any language-driven resize is a reported failure. A hard
       width makes the panel's rect language-invariant by construction. 186 px
       holds the English row (LANGUAGE + English) and the French one (LANGUE +
       Fran&ccedil;ais) with room to spare, measured as rendered rather than
       from a font probe: text-transform and letter-spacing are not in
       getComputedStyle().font. */
    .settings-popover {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 61;
      width: 186px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      background: rgba(245, 235, 215, 0.97);
      border: 2px solid #3C5C1A;
      border-radius: 5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .settings-popover[hidden] {
      display: none;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* nowrap because the row is space-between: a caption that wrapped would
       grow the row's height and move the control beside it. */
    .settings-label {
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 10px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    .settings-select {
      flex: 0 0 auto;
      padding: 2px 4px;
      background: rgba(139, 168, 112, 0.3);
      border: 1px solid #3C5C1A;
      border-radius: 3px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 10px;
      line-height: 1.2;
      cursor: pointer;
    }

    .settings-select:focus-visible {
      outline: 2px solid #3C5C1A;
      outline-offset: 1px;
    }

    /* ===== HOVER-HELP TOOLTIP (v1.3.0) =====
       This page had NO tooltip surface, no tooltip CSS and no hover handler
       before v1.3.0. applyI18n() writes data-tip-title and data-tip onto the
       anchors in TIP_BINDINGS and stops there; everything that paints them is
       here and in setupTooltips() below.

       Styled in THIS page's vocabulary rather than pasted in from O-simpleFM,
       whose tip is dark-on-cream. This page's only other floating surface is
       .settings-popover, so the tip wears the same three rules: the aged-paper
       fill rgba(245,235,215,~1) over a 2 px #3C5C1A border at radius 5, and
       Garamond in #3C2F2F. The title takes the popover's uppercase treatment in
       the darker #2C3E10 the active buttons use.

       FOUR PROPERTIES ARE LOAD-BEARING, not styling:

         position: fixed   — the renderer positions in viewport coordinates.
                             .container has no transform, so nothing here
                             establishes a containing block that would shift it.
         visibility:hidden — check-ui-labels skips display:none / visibility:
         + opacity: 0        hidden / opacity:0 nodes (check-ui-labels.js:204),
                             so an idle tip enters neither the label sweep nor
                             the English-vs-French geometry diff. A tip that was
                             merely empty and visible WOULD enter both.
         pointer-events:   — without it the surface steals the hover that is
             none            keeping it open, and the tip flickers under its own
                             cursor.
         z-index: 200      — over .border (100), which is the highest thing on
                             the page. .border is pointer-events: none, so it
                             cannot swallow a hover either way.

       max-width 260 px in a 600 px frame: with the renderer's 8 px margins the
       widest possible tip is 276 px of a 600 px frame, so the horizontal clamp
       can always place it. Height is the axis that can fail, and the vertical
       flip plus clamp is what tests/ui_tip_render_check.js §4 measures. */
    .tooltip {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 200;
      max-width: 260px;
      padding: 7px 10px;
      background: rgba(245, 235, 215, 0.98);
      border: 2px solid #3C5C1A;
      border-radius: 5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.12s ease;
      pointer-events: none;
    }

    .tooltip.show {
      opacity: 1;
      visibility: visible;
    }

    .tooltip .tip-title {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #2C3E10;
      margin-bottom: 3px;
    }

    /* ===== VERSION LABEL ===== */
    .version-label {
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 8px;
      color: rgba(60, 47, 47, 0.4);
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Decorative elements -->
    <div class="border"></div>
    <div class="divider top"></div>
    <div class="divider middle"></div>
    <div class="divider bottom"></div>

    <!-- Title. NOT a [data-i18n] element: a product name is never translated.
         Declared in I18N_EXEMPT with that reason, so a genuinely missed label
         cannot hide here as a deliberate one. -->
    <div class="title">OUARICON SATURATION</div>

    <!-- The settings cluster. STILL ONE ROW at v1.3.0, which now has hover-help
         but no switch for it: adding one would mean a persisted preference
         through C++ and a data-tip-always bypass so the switch's own tip
         survives being switched off. Two plugins in the suite have that toggle
         and nineteen do not; making the suite uniform is its own pass, not a
         side effect of this one. The gear's tip says so in as many words. -->
    <div class="settings-cluster">
      <button type="button" class="gear-btn" id="gear-btn"
              aria-haspopup="dialog" aria-expanded="false"
              data-i18n-aria="aria.settings" aria-label="Settings">&#9881;</button>

      <div class="settings-popover" id="settings-popover"
           role="dialog" data-i18n-aria="aria.settings" aria-label="Settings" hidden>
        <label class="settings-row" for="lang-select">
          <!-- data-label so a state updater that writes textContent reads the
               authored caption back instead of erasing it
               (pattern_js_state_updater_overwrites_html_labels). -->
          <span class="settings-label" data-i18n="label.language" data-label="Language">Language</span>
          <!-- ENDONYMS. Never localized: a French speaker looking for their
               language looks for "Fran&ccedil;ais". -->
          <select class="settings-select" id="lang-select"
                  data-i18n-aria="aria.langSelect" aria-label="Interface language">
            <option value="en">English</option>
            <option value="fr">Fran&ccedil;ais</option>
          </select>
        </label>
      </div>
    </div>

    <!-- Model selection buttons. The four captions are the MODEL
         AudioParameterChoice option strings VERBATIM, so they are EXEMPT under
         D-01 arm 1 and carry no key: the page and the host automation lane have
         to agree about the same setting. -->
    <div class="model-buttons">
      <button class="model-button active" data-model="0">MAGNETIC</button>
      <button class="model-button" data-model="1">TUBE</button>
      <button class="model-button" data-model="2">TRANSFORMER</button>
      <button class="model-button" data-model="3">DIODE</button>
    </div>

    <!-- Input VU Meter (V4: GREEN color scheme) -->
    <div class="vu-meter input">
      <div class="vu-face">
        <div class="vu-scale">
          <span>-20</span>
          <span>-10</span>
          <span>-7</span>
          <span>-5</span>
          <span>-3</span>
          <span>0</span>
          <span>+3</span>
        </div>
        <div class="vu-needle" id="inputNeedle"></div>
        <div class="vu-label" data-i18n="label.in" data-label="IN">IN</div>
      </div>
    </div>

    <!-- Intensity knob (V4: Indicator at EDGE) -->
    <div class="knob-container">
      <div class="knob" id="intensityKnob">
        <div class="knob-segments"></div>
        <div class="knob-indicator"></div>
      </div>
    </div>

    <!-- INTENSITY LABEL CENTERED -->
    <div class="knob-label" data-i18n="label.intensity" data-label="INTENSITY">INTENSITY</div>

    <!-- V4: SNAKE MOVED LEFT (x:285, center at ~375px) -->
    <img
      src="img/snake_mobot31753000317195_0068.png"
      class="snake-overlay"
      id="snakeImage"
      data-i18n-alt="alt.snake"
      alt="Snake illustration"
    />

    <!-- Output VU Meter (V4: GREEN color scheme) -->
    <div class="vu-meter output">
      <div class="vu-face">
        <div class="vu-scale">
          <span>-20</span>
          <span>-10</span>
          <span>-7</span>
          <span>-5</span>
          <span>-3</span>
          <span>0</span>
          <span>+3</span>
        </div>
        <div class="vu-needle" id="outputNeedle"></div>
        <div class="vu-label" data-i18n="label.out" data-label="OUT">OUT</div>
      </div>
    </div>

    <!-- Quality section -->
    <div class="quality-label" data-i18n="label.quality" data-label="QUALITY">QUALITY</div>
    <!-- The three captions are the QUALITY AudioParameterChoice option
         strings VERBATIM — EXEMPT under D-01 arm 1, as the model row above.
         The HEADING localizes; "Quality" is the parameter's DISPLAY NAME,
         not one of its options. -->
    <div class="quality-buttons">
      <button class="quality-button" data-quality="0">LOW</button>
      <button class="quality-button active" data-quality="1">MID</button>
      <button class="quality-button" data-quality="2">HIGH</button>
    </div>

    <!-- Autogain toggle -->
    <button class="autogain-toggle" id="autogainToggle"
            data-i18n="label.autogain" data-label="AUTOGAIN">AUTOGAIN</button>

    <!-- Version -->
    <div class="version-label">v1.3.0</div>
  </div>

  <!-- The floating hover-help surface (v1.3.0). EMPTY in the markup and never
       given copy here: setupTooltips() builds its children with createElement +
       textContent from the data-tip-title / data-tip attributes applyI18n()
       wrote, so localized copy never touches a markup path. A literal
       data-tip-title here would also fail check-i18n assertion 3, which counts
       those attributes in index.html and requires zero. -->
  <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <script type="module">
    import { getSliderState, getToggleState } from './js/juce/index.js';
    // The JUCE 8 frontend NAMESPACE, imported alongside the two named bindings
    // this page already used. Juce.getNativeFunction is the only correct way to
    // reach a withNativeFunction registration — window.__JUCE__ is the raw
    // postMessage transport and does not carry the promise contract
    // (critical_juce_webview_namespace_vs_postmessage). Two import statements
    // from one specifier is legal ES and leaves the existing two call sites
    // below untouched.
    import * as Juce from './js/juce/index.js';

    // v1.2.0: the label table. The canonical import line, re-rooted from
    // './i18n.js' to './js/i18n.js' because this plugin's controller is an
    // inline <script type="module"> at the UI root rather than a js/app.js.
    // check-i18n assertion 6 accepts exactly that one substitution and nothing
    // else. I18N and TIP_BINDINGS are both EMPTY here (this page has no
    // hover-help) and are imported anyway so the canon block below stays
    // byte-identical to the other forty-two copies.
    import { LANGUAGES, I18N, LABELS, TIP_BINDINGS, tr } from './js/i18n.js';

    // Disable context menu
    document.addEventListener("contextmenu", (e) => { e.preventDefault(); return false; });

    // Parameter states
    const intensityState = getSliderState("INTENSITY");
    const modelState = getSliderState("MODEL");
    const qualityState = getSliderState("QUALITY");
    const autogainState = getToggleState("AUTOGAIN");

    // DOM elements
    const intensityKnob = document.getElementById('intensityKnob');
    const snakeImage = document.getElementById('snakeImage');
    const modelButtons = document.querySelectorAll('.model-button');
    const qualityButtons = document.querySelectorAll('.quality-button');
    const autogainToggle = document.getElementById('autogainToggle');
    const inputNeedle = document.getElementById('inputNeedle');
    const outputNeedle = document.getElementById('outputNeedle');

    const snakeImages = [
      'img/snake_mobot31753000317195_0068.png',
      'img/snake_mobot31753000317195_0070.png',
      'img/snake_NA_0145.png',
      'img/snake_snakesaustralia00kref_0145.png'
    ];

    // Helper: Setup button group with parameter binding
    function setupButtonGroup(buttons, state, maxIndex) {
      const updateVisual = (index) => {
        buttons.forEach((btn, idx) => btn.classList.toggle('active', idx === index));
      };

      buttons.forEach((btn, idx) => {
        btn.addEventListener('click', () => {
          state.setNormalisedValue(idx / maxIndex);
          updateVisual(idx);
        });
      });

      state.valueChangedEvent.addListener(() => {
        updateVisual(Math.round(state.getNormalisedValue() * maxIndex));
      });

      return updateVisual;
    }

    // Intensity knob (drag interaction)
    let isDragging = false;
    let lastY = 0;

    function updateKnobVisual(value) {
      intensityKnob.style.transform = `rotate(${-135 + value * 270}deg)`;
      snakeImage.style.opacity = 0.2 + value * 0.8;
    }

    intensityKnob.addEventListener('mousedown', (e) => { isDragging = true; lastY = e.clientY; e.preventDefault(); });
    document.addEventListener('mouseup', () => { isDragging = false; });
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const delta = (lastY - e.clientY) * 0.005;
      const newValue = Math.max(0, Math.min(1, intensityState.getNormalisedValue() + delta));
      intensityState.setNormalisedValue(newValue);
      // Visual update handled by valueChangedEvent listener for single source of truth
      lastY = e.clientY;
    });

    intensityState.valueChangedEvent.addListener(() => updateKnobVisual(intensityState.getNormalisedValue()));
    updateKnobVisual(intensityState.getNormalisedValue());

    // Model buttons (also updates snake image)
    const updateModelButtons = setupButtonGroup(modelButtons, modelState, 3);
    modelState.valueChangedEvent.addListener(() => {
      const idx = Math.round(modelState.getNormalisedValue() * 3);
      snakeImage.src = snakeImages[idx];
    });
    updateModelButtons(Math.round(modelState.getNormalisedValue() * 3));
    snakeImage.src = snakeImages[Math.round(modelState.getNormalisedValue() * 3)];

    // Quality buttons
    setupButtonGroup(qualityButtons, qualityState, 2)(Math.round(qualityState.getNormalisedValue() * 2));

    // Autogain toggle
    function updateAutogainVisual(enabled) { autogainToggle.classList.toggle('active', enabled); }
    autogainToggle.addEventListener('click', () => {
      const newValue = !autogainState.getValue();
      autogainState.setValue(newValue);
      updateAutogainVisual(newValue);
    });
    autogainState.valueChangedEvent.addListener(() => updateAutogainVisual(autogainState.getValue()));
    updateAutogainVisual(autogainState.getValue());

    // VU Meters
    let currentInputAngle = -45, targetInputAngle = -45;
    let currentOutputAngle = -45, targetOutputAngle = -45;
    const ATTACK_SPEED = 0.4, DECAY_SPEED = 0.15;

    function mapDBToAngle(db) {
      const normalized = Math.max(0, Math.min(1, (Math.max(-20, Math.min(3, db)) + 20) / 23));
      return -45 + normalized * 90;
    }

    function updateNeedleColor(needle, angle) {
      const t = (angle + 45) / 90;
      const r = Math.round(34 + t * 221);
      const g = Math.round(139 - t * 89);
      const b = Math.round(34 + t * 16);
      needle.style.background = `linear-gradient(180deg, rgb(${r},${g},${b}) 0%, rgb(${r*0.8|0},${g*0.8|0},${b*0.8|0}) 100%)`;
    }

    if (window.__JUCE__?.backend) {
      window.__JUCE__.backend.addEventListener("inputLevel", (db) => { targetInputAngle = mapDBToAngle(db); });
      window.__JUCE__.backend.addEventListener("outputLevel", (db) => { targetOutputAngle = mapDBToAngle(db); });
    }

    function animateVUMeters() {
      currentInputAngle += (targetInputAngle - currentInputAngle) * (currentInputAngle < targetInputAngle ? ATTACK_SPEED : DECAY_SPEED);
      currentOutputAngle += (targetOutputAngle - currentOutputAngle) * (currentOutputAngle < targetOutputAngle ? ATTACK_SPEED : DECAY_SPEED);

      inputNeedle.style.transform = `translateX(-50%) rotate(${currentInputAngle}deg)`;
      outputNeedle.style.transform = `translateX(-50%) rotate(${currentOutputAngle}deg)`;

      updateNeedleColor(inputNeedle, currentInputAngle);
      updateNeedleColor(outputNeedle, currentOutputAngle);

      requestAnimationFrame(animateVUMeters);
    }

    animateVUMeters();

    // ═══════════════════════════════════════════════════════════════════════
    // i18n — the canon v2 block, VERBATIM from scripts/i18n-canon.js
    // ═══════════════════════════════════════════════════════════════════════
    //
    // Byte-compared by check-i18n assertion 6 after comment stripping and
    // whitespace normalisation. Do not edit it here; edit the canon and every
    // copy together, which is the whole point of holding it as data.
    //
    // It sits at the END of the module, below every existing initializer, and
    // is REACHED only through the guarded initI18n() call further down. A
    // top-level statement up here that touched a lower `let` would be a TDZ
    // throw taking every later initializer with it, and on this plugin
    // "every later initializer" is the entire UI — the controller is one inline
    // module, not a file that can fail in isolation
    // (pattern_module_toplevel_init_tdz).

    let uiLanguage = 'en';
    let getUiLanguageNative = null;
    let setUiLanguageNative = null;

    // LABELS first, I18N as the fallback: a control whose tooltip title already IS
    // its label carries one key, not two copies of the same string.
    function trLabel(key, lang, vars) {
        const entry = (typeof LABELS === 'object' && LABELS && LABELS[key]) || I18N[key];
        if (!entry) { console.warn(`i18n: missing label key ${key}`); return key; }
        const s = entry[lang] || entry.en;
        const resolve = (v) => {
            const nested = (typeof LABELS === 'object' && LABELS && LABELS[v]) || I18N[v];
            return nested ? String((nested[lang] || nested.en).t) : String(v);
        };
        return vars
            ? String(s.t).replace(/\{(\w+)\}/g, (m, n) => (n in vars ? resolve(vars[n]) : m))
            : String(s.t);
    }

    function applyLabel(el) {
        const key = el.dataset.i18n;
        if (!key) return;
        let vars = null;
        try { vars = el.dataset.i18nVars ? JSON.parse(el.dataset.i18nVars) : null; }
        catch (e) { console.warn(`i18n: bad vars on ${key}`); }
        const s = trLabel(key, uiLanguage, vars);
        el.dataset.label = s;
        el.textContent   = s;
    }

    function applyI18nAttributes(el) {
        const pairs = [['i18nAria', 'aria-label'], ['i18nPlaceholder', 'placeholder'], ['i18nAlt', 'alt']];
        for (const [prop, attr] of pairs) {
            const key = el.dataset[prop];
            if (key) el.setAttribute(attr, trLabel(key, uiLanguage, null));
        }
    }

    function setLabel(el, key, vars) {
        if (!el) return;
        el.dataset.i18n = key;
        if (vars) el.dataset.i18nVars = JSON.stringify(vars); else delete el.dataset.i18nVars;
        applyLabel(el);
    }

    function applyI18n(lang) {
        uiLanguage = LANGUAGES.includes(lang) ? lang : 'en';
        for (const [selector, key, wrapper, vars] of TIP_BINDINGS) {
            const el = document.querySelector(selector);
            if (!el) { console.warn(`i18n: tip target not found: ${selector}`); continue; }
            const target = wrapper ? (el.closest(wrapper) || el) : el;
            const s = tr(key, uiLanguage, vars);
            target.setAttribute('data-tip-title', s.t);
            target.setAttribute('data-tip', s.b);
        }
        for (const el of document.querySelectorAll('[data-i18n]')) applyLabel(el);
        for (const el of document.querySelectorAll('[data-i18n-aria],[data-i18n-placeholder],[data-i18n-alt]'))
            applyI18nAttributes(el);
        const sel = document.getElementById('lang-select');
        if (sel && sel.value !== uiLanguage) sel.value = uiLanguage;
    }

    // Exposed so a clamp gate can drive the language without teaching the ui-stub a
    // promise contract: page.evaluate((l) => window.__setLanguage(l), 'fr').
    window.__setLanguage = applyI18n;
    // Exposed for the same reason, and so a sibling module can write a localized
    // label without app.js having to export anything — O-Bitrot's controller is an
    // inline <script type="module">, where an export declaration has nowhere to go.
    window.__setLabel = setLabel;

    function initI18n() {
        try {
            getUiLanguageNative = Juce.getNativeFunction('getUiLanguage');
            setUiLanguageNative = Juce.getNativeFunction('setUiLanguage');
        } catch (e) {
            console.warn('Language preference not available, session-only:', e);
        }

        // Paint the default SYNCHRONOUSLY first. Never blank, never a flash.
        try { applyI18n('en'); } catch (e) { console.error('i18n init failed:', e); }

        if (getUiLanguageNative) {
            getUiLanguageNative()
                .then((code) => applyI18n(code === 'fr' ? 'fr' : 'en'))
                .catch((e) => console.warn('Could not read language preference:', e));
        }

        const sel = document.getElementById('lang-select');
        if (sel) sel.addEventListener('change', (e) => {
            applyI18n(e.target.value);
            if (setUiLanguageNative) setUiLanguageNative(uiLanguage).catch(() => {});
        });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Hover-help (v1.3.0) — the renderer the canon does NOT provide
    // ═══════════════════════════════════════════════════════════════════════
    //
    // BELOW the canon region on purpose. check-i18n assertion 6 byte-compares
    // everything from `let uiLanguage` to the closing brace of initI18n()
    // against scripts/i18n-canon.js; this function sits after that brace and is
    // this plugin's own code.
    //
    // WHAT THE CANON DOES AND WHERE IT STOPS. applyI18n() walks TIP_BINDINGS and
    // writes data-tip-title + data-tip onto each anchor, in the current
    // language, rewriting both on every language change. That is ALL it does.
    // Nothing in the canon reads those attributes. Before v1.3.0 nothing on this
    // page did either, so authoring the copy alone would have shipped six
    // invisible strings past three green gates — check-i18n counts bindings,
    // check-ui-labels has no tooltip awareness at all, and boot-all-uis counts
    // aria-label and title and never data-tip.
    //
    // Ported from O-simpleFM's setupTooltips (js/app.js:384-462) rather than
    // from O-Tapestop's measure-then-pin engine: this is ~80 lines against
    // ~180, it is delegated rather than per-element, and it needs no help-toggle
    // state. Each property below is load-bearing and carries a scar:
    //
    //  1. DELEGATED ON document, not querySelectorAll('[data-tip]') at setup.
    //     No anchor carries data-tip until applyI18n() has run. A setup-time
    //     query would bind nothing at all, and would fail silently.
    //  2. pointerover / pointerout / focusin / focusout, because they BUBBLE.
    //     pointerenter / pointerleave and focus / blur do not.
    //  3. pointerout IGNORES a move between two descendants of the same anchor.
    //     .model-buttons holds four buttons and .quality-buttons three; without
    //     this the tip flickers off and on at every child boundary.
    //  4. createElement + textContent, NEVER innerHTML. Localized copy must not
    //     reach a markup path. check-i18n assertion 9 already forbids an angle
    //     bracket in an i18n.js string literal; this is the other half of it.
    //  5. Clamped on ALL FOUR edges at 8 px, with a flip to the opposite side of
    //     the cursor first. This is STRONGER than the O-simpleFM original, which
    //     flips and then clamps only the top and left. In a 600x450 frame the
    //     bottom edge is the one that bites: #autogainToggle and
    //     .quality-buttons both sit at y=395, so every tip they open is placed
    //     by the flip, and French bodies run 15-20% longer and wrap taller.
    //  6. pointer-events: none on the surface (in the CSS above), or the tip
    //     steals the hover that is keeping it open.
    //  7. position: fixed and visibility: hidden until shown, so an idle tip
    //     enters neither check-ui-labels' text sweep nor its geometry diff.
    //  8. Escape hides it; pointerdown hides it. pointerdown matters here
    //     because #intensityKnob starts a drag on mousedown and the tip must be
    //     out of the way before the drag begins.
    //  9. CALLED AFTER initI18n(), from the same guarded deferred init at the
    //     foot of this module. A top-level call up here touching a lower
    //     let/const would be a TDZ throw taking every later initializer with it
    //     (pattern_module_toplevel_init_tdz), and on this page that is the whole
    //     UI — the controller is one inline module.
    //
    // NO KEYBOARD ANCHOR IS INVENTED. #gear-btn, #lang-select, #autogainToggle
    // and the buttons inside .model-buttons / .quality-buttons are all natively
    // focusable, so focusin reaches five of the six anchors through closest().
    // .knob-container is NOT given a tabindex, unlike O-simpleFM's routingPanel:
    // the knob is mouse-drag only and has never been keyboard-operable, so a tab
    // stop there would add tab-order noise for a control it still could not
    // operate, and would pop the tip open in the middle of a click-drag.

    function setupTooltips() {
        const tip = document.getElementById('tooltip');
        if (!tip) { console.warn('hover-help: no #tooltip surface — tips will not render'); return; }

        let active = null;

        const show = (el, x, y) => {
            const title = el.getAttribute('data-tip-title');
            const body  = el.getAttribute('data-tip');
            if (!title && !body) return;

            tip.textContent = '';
            if (title) {
                const t = document.createElement('span');
                t.className = 'tip-title';
                t.textContent = title;
                tip.appendChild(t);
            }
            if (body) tip.appendChild(document.createTextNode(body));

            tip.classList.add('show');
            tip.setAttribute('aria-hidden', 'false');
            position(x, y);
        };

        // Flip first, then clamp. The flip keeps the tip off the cursor's own
        // side; the clamp is what guarantees the rect is inside the frame, and
        // it is asserted directly by tests/ui_tip_render_check.js §4 in both
        // languages. When a body is long enough that the tip is TALLER than the
        // frame, Math.max wins over Math.min and the tip overflows the bottom —
        // that is honest, it is what the gate's negative control plants, and it
        // is why max-width is 260 px and a body is three sentences at most.
        const position = (x, y) => {
            const r = tip.getBoundingClientRect();
            let nx = x + 14;
            let ny = y + 16;
            if (nx + r.width  > window.innerWidth  - 8) nx = x - r.width  - 14;
            if (ny + r.height > window.innerHeight - 8) ny = y - r.height - 12;
            tip.style.left = `${Math.max(8, Math.min(nx, window.innerWidth  - 8 - r.width))}px`;
            tip.style.top  = `${Math.max(8, Math.min(ny, window.innerHeight - 8 - r.height))}px`;
        };

        const hide = () => {
            tip.classList.remove('show');
            tip.setAttribute('aria-hidden', 'true');
            active = null;
        };

        const anchorOf = (t) => (t && t.closest ? t.closest('[data-tip]') : null);

        document.addEventListener('pointerover', (e) => {
            const el = anchorOf(e.target);
            if (!el || el === active) return;
            active = el;
            show(el, e.clientX, e.clientY);
        });

        document.addEventListener('pointermove', (e) => {
            if (active && anchorOf(e.target) === active) position(e.clientX, e.clientY);
        });

        document.addEventListener('pointerout', (e) => {
            if (!active) return;
            if (anchorOf(e.relatedTarget) === active) return;
            hide();
        });

        document.addEventListener('pointerdown', hide);

        document.addEventListener('focusin', (e) => {
            const el = anchorOf(e.target);
            if (!el) return;
            active = el;
            const r = el.getBoundingClientRect();
            show(el, r.left + r.width / 2, r.bottom);
        });

        document.addEventListener('focusout', hide);

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // The settings popover (v1.2.0)
    // ═══════════════════════════════════════════════════════════════════════
    //
    // ONE row. This plugin has no hover-help to switch on or off — v1.1.6
    // carried no data-tip and no native title= anywhere — and authoring that
    // copy is Stage M's job, so the popover holds the language selector alone.
    // The panel opens DOWNWARDS: the gear is 12 px from the top of a 450 px
    // frame, so a panel above it would leave the frame.

    let settingsPopoverEl = null;
    let gearBtnEl = null;

    function setSettingsPopoverOpen(open) {
        if (!settingsPopoverEl || !gearBtnEl) return;
        settingsPopoverEl.hidden = !open;
        gearBtnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function initializeSettingsPopover() {
        gearBtnEl = document.getElementById('gear-btn');
        settingsPopoverEl = document.getElementById('settings-popover');

        if (!gearBtnEl || !settingsPopoverEl) {
            console.warn('settings popover missing - language selector unavailable');
            return;
        }

        gearBtnEl.addEventListener('click', (e) => {
            e.stopPropagation();
            setSettingsPopoverOpen(settingsPopoverEl.hidden);
        });

        // Dismiss on a press anywhere else, and on Escape. mousedown rather
        // than click, so the panel is gone before a drag on the intensity knob
        // underneath it begins — this page starts a knob drag on mousedown.
        document.addEventListener('mousedown', (e) => {
            if (settingsPopoverEl.hidden) return;
            if (settingsPopoverEl.contains(e.target) || gearBtnEl.contains(e.target)) return;
            setSettingsPopoverOpen(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !settingsPopoverEl.hidden) {
                setSettingsPopoverOpen(false);
                gearBtnEl.focus();
            }
        });
    }

    // Guarded, and LAST. Every parameter binding above has already run, so an
    // i18n failure leaves an English plugin that still works rather than a dead
    // page.
    initializeSettingsPopover();
    // setupTooltips() runs AFTER initI18n() and inside the same guarded deferred
    // init: the anchors carry no data-tip until applyI18n() has written them,
    // and a renderer wired before that would attach to a page with nothing on it.
    try { initI18n(); setupTooltips(); } catch (e) { console.error('i18n init failed:', e); }
  </script>
</body>
</html>

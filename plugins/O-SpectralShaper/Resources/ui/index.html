<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=700, initial-scale=1.0">
    <title>O-SpectralShaper</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <div class="header">
            <h1>O-SpectralShaper</h1>
            <div class="preset-bar">
                <button class="preset-nav-btn" id="preset-prev" title="Previous preset">&lsaquo;</button>
                <span class="preset-name" id="preset-name">Default</span>
                <button class="preset-nav-btn" id="preset-next" title="Next preset">&rsaquo;</button>
                <button class="preset-action-btn" id="preset-save" title="Save preset">Save</button>
                <button class="preset-action-btn" id="preset-load" title="Load preset from file">Load</button>
            </div>
            <div class="version">v1.4.0</div>
        </div>

        <!-- SPECTROGRAM (Main display area) -->
        <div class="spectrogram-container">
            <canvas id="spectrogram-canvas" class="spectrogram-canvas"></canvas>
            <div class="spectrogram-label">Spectrogram</div>
        </div>

        <!-- ATTACK CURVE EDITOR -->
        <div class="curve-container attack-curve-container">
            <canvas id="attack-curve-canvas" class="curve-canvas"></canvas>
            <div class="curve-label">Attack Curve</div>
            <div class="curve-controls">
                <button id="attack-spectrum-btn" class="curve-spectrum-btn" title="Show/hide input spectrum">Spectrum</button>
                <button id="attack-undo-btn" class="curve-undo-btn" title="Undo (Ctrl+Z)" disabled>&#x21A9;</button>
                <button id="attack-redo-btn" class="curve-redo-btn" title="Redo (Ctrl+Shift+Z)" disabled>&#x21AA;</button>
                <button id="attack-reset-btn" class="curve-reset-btn" title="Reset curve to flat">Reset</button>
                <button id="attack-mode-toggle" class="curve-mode-toggle">Freehand</button>
            </div>
        </div>

        <!-- SUSTAIN CURVE EDITOR -->
        <div class="curve-container sustain-curve-container">
            <canvas id="sustain-curve-canvas" class="curve-canvas"></canvas>
            <div class="curve-label">Sustain Curve</div>
            <div class="curve-controls">
                <button id="sustain-spectrum-btn" class="curve-spectrum-btn" title="Show/hide input spectrum">Spectrum</button>
                <button id="sustain-undo-btn" class="curve-undo-btn" title="Undo (Ctrl+Z)" disabled>&#x21A9;</button>
                <button id="sustain-redo-btn" class="curve-redo-btn" title="Redo (Ctrl+Shift+Z)" disabled>&#x21AA;</button>
                <button id="sustain-reset-btn" class="curve-reset-btn" title="Reset curve to flat">Reset</button>
                <button id="sustain-mode-toggle" class="curve-mode-toggle">Freehand</button>
            </div>
        </div>

        <!-- KNOB SIDEBAR -->
        <div class="knob-sidebar">
            <!-- Mix Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="mix-knob-container">
                    <div class="knob" id="mix-knob"></div>
                </div>
                <div class="knob-label">Mix</div>
                <div class="knob-value" id="mix-value">100%</div>
            </div>

            <!-- Attack Time Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="attack-time-knob-container">
                    <div class="knob" id="attack-time-knob"></div>
                </div>
                <div class="knob-label">Attack</div>
                <div class="knob-value" id="attack-time-value">10ms</div>
            </div>

            <!-- Sustain Time Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="sustain-time-knob-container">
                    <div class="knob" id="sustain-time-knob"></div>
                </div>
                <div class="knob-label">Sustain</div>
                <div class="knob-value" id="sustain-time-value">100ms</div>
            </div>

            <!-- Sensitivity Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="sensitivity-knob-container">
                    <div class="knob" id="sensitivity-knob"></div>
                </div>
                <div class="knob-label">Sensitivity</div>
                <div class="knob-value" id="sensitivity-value">50%</div>
            </div>

            <!-- Output Gain Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="output-gain-knob-container">
                    <div class="knob" id="output-gain-knob"></div>
                </div>
                <div class="knob-label">Output</div>
                <div class="knob-value" id="output-gain-value">0.0dB</div>
            </div>

            <!-- Lookahead Time Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="lookahead-time-knob-container">
                    <div class="knob" id="lookahead-time-knob"></div>
                </div>
                <div class="knob-label">LA Time</div>
                <div class="knob-value" id="lookahead-time-value">2.0ms</div>
            </div>

            <!-- Lookahead Enabled Toggle (spans both columns, sits under LA Time) -->
            <div class="toggle-container">
                <div class="toggle-switch" id="lookahead-toggle"></div>
                <div class="toggle-label">Lookahead</div>
            </div>
        </div>
    </div>

    <!-- JUCE JavaScript Bridge -->
    <script type="module" src="/js/juce/index.js"></script>

    <!-- Main Application Logic -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>

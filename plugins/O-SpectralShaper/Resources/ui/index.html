<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=700, initial-scale=1.0">
    <title>O-SpectralShaper</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <div class="header">
            <h1>O-SpectralShaper</h1>
            <div class="preset-bar">
                <button class="preset-nav-btn" id="preset-prev">&lsaquo;</button>
                <span class="preset-name" id="preset-name" role="button" aria-haspopup="listbox" aria-expanded="false">Default</span>
                <button class="preset-nav-btn" id="preset-next">&rsaquo;</button>
                <button class="preset-action-btn" id="preset-save" data-i18n="label.save" data-label="Save">Save</button>
                <button class="preset-action-btn" id="preset-load" data-i18n="label.load" data-label="Load">Load</button>
                <div class="preset-menu" id="preset-menu" role="listbox" data-i18n-aria="aria.presets" aria-label="Presets"></div>
            </div>
            <div class="header-right">
                <!-- v1.7.0: the settings popover. It replaces the wax-seal "?"
                     that sat in this exact header slot and occupies its exact
                     18x18 footprint, so the new control adds no geometry delta.
                     Two rows: the language selector and the hover-help switch
                     that used to BE the "?". -->
                <div class="settings-cluster">
                    <button type="button" class="gear-btn" id="gear-btn"
                            aria-haspopup="dialog" aria-expanded="false"
                            data-i18n-aria="settings" aria-label="Settings" data-tip-always>&#9881;</button>

                    <div class="settings-popover" id="settings-popover"
                         role="dialog" data-i18n-aria="settings" aria-label="Settings" hidden>
                        <label class="settings-row" for="lang-select">
                            <!-- data-label so a shared state updater that writes
                                 textContent reads the authored caption back
                                 instead of erasing it. -->
                            <span class="settings-label" data-i18n="label.language" data-label="Language">Language</span>
                            <!-- Endonyms. Never localized, never written by a
                                 state updater: a French speaker looking for
                                 their language looks for "Fran&ccedil;ais". -->
                            <select id="lang-select" data-i18n-aria="aria.langSelect" aria-label="Interface language">
                                <option value="en">English</option>
                                <option value="fr">Fran&ccedil;ais</option>
                            </select>
                        </label>

                        <!-- A div, not a <label for="tips-toggle">: a button is
                             a labelable element, so a label wrapping it can
                             re-dispatch the click and toggle twice. The button
                             names itself with aria-label instead. -->
                        <div class="settings-row">
                            <span class="settings-label" data-i18n="label.hoverHelp" data-label="Hover help">Hover help</span>
                            <button type="button" class="settings-toggle" id="tips-toggle"
                                    aria-pressed="false" data-i18n-aria="aria.helpToggle"
                                    aria-label="Toggle hover help"
                                    data-i18n="ui.off" data-tip-always>Off</button>
                        </div>
                    </div>
                </div>
                <div class="version">v1.7.0</div>
            </div>
        </div>

        <!-- SPECTROGRAM (Main display area) -->
        <div class="spectrogram-container">
            <canvas id="spectrogram-canvas" class="spectrogram-canvas"></canvas>
            <div class="spectrogram-label" data-i18n="label.spectrogram" data-label="Spectrogram">Spectrogram</div>
        </div>

        <!-- ATTACK CURVE EDITOR -->
        <div class="curve-container attack-curve-container">
            <canvas id="attack-curve-canvas" class="curve-canvas"></canvas>
            <div class="curve-label" data-i18n="label.attackCurve" data-label="Attack Curve">Attack Curve</div>
            <div class="curve-controls">
                <button id="attack-spectrum-btn" class="curve-spectrum-btn" data-i18n="label.spectrum" data-label="Spectrum">Spectrum</button>
                <button id="attack-undo-btn" class="curve-undo-btn" disabled>&#x21A9;</button>
                <button id="attack-redo-btn" class="curve-redo-btn" disabled>&#x21AA;</button>
                <button id="attack-reset-btn" class="curve-reset-btn" data-i18n="label.reset" data-label="Reset">Reset</button>
                <button id="attack-mode-toggle" class="curve-mode-toggle" data-i18n="ui.freehand" data-label="Freehand">Freehand</button>
            </div>
        </div>

        <!-- SUSTAIN CURVE EDITOR -->
        <div class="curve-container sustain-curve-container">
            <canvas id="sustain-curve-canvas" class="curve-canvas"></canvas>
            <div class="curve-label" data-i18n="label.sustainCurve" data-label="Sustain Curve">Sustain Curve</div>
            <div class="curve-controls">
                <button id="sustain-spectrum-btn" class="curve-spectrum-btn" data-i18n="label.spectrum" data-label="Spectrum">Spectrum</button>
                <button id="sustain-undo-btn" class="curve-undo-btn" disabled>&#x21A9;</button>
                <button id="sustain-redo-btn" class="curve-redo-btn" disabled>&#x21AA;</button>
                <button id="sustain-reset-btn" class="curve-reset-btn" data-i18n="label.reset" data-label="Reset">Reset</button>
                <button id="sustain-mode-toggle" class="curve-mode-toggle" data-i18n="ui.freehand" data-label="Freehand">Freehand</button>
            </div>
        </div>

        <!-- KNOB SIDEBAR -->
        <div class="knob-sidebar">
            <!-- Mix Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="mix-knob-container">
                    <div class="knob" id="mix-knob"></div>
                </div>
                <div class="knob-label" data-i18n="label.mix" data-label="Mix">Mix</div>
                <div class="knob-value" id="mix-value">100%</div>
            </div>

            <!-- Attack Time Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="attack-time-knob-container">
                    <div class="knob" id="attack-time-knob"></div>
                </div>
                <div class="knob-label" data-i18n="label.attack" data-label="Attack">Attack</div>
                <div class="knob-value" id="attack-time-value">10ms</div>
            </div>

            <!-- Sustain Time Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="sustain-time-knob-container">
                    <div class="knob" id="sustain-time-knob"></div>
                </div>
                <div class="knob-label" data-i18n="label.sustain" data-label="Sustain">Sustain</div>
                <div class="knob-value" id="sustain-time-value">100ms</div>
            </div>

            <!-- Sensitivity Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="sensitivity-knob-container">
                    <div class="knob" id="sensitivity-knob"></div>
                </div>
                <div class="knob-label" data-i18n="label.sensitivity" data-label="Sensitivity">Sensitivity</div>
                <div class="knob-value" id="sensitivity-value">50%</div>
            </div>

            <!-- Output Gain Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="output-gain-knob-container">
                    <div class="knob" id="output-gain-knob"></div>
                </div>
                <div class="knob-label" data-i18n="label.output" data-label="Output">Output</div>
                <div class="knob-value" id="output-gain-value">0.0dB</div>
            </div>

            <!-- Lookahead Time Knob -->
            <div class="knob-wrapper">
                <div class="knob-container" id="lookahead-time-knob-container">
                    <div class="knob" id="lookahead-time-knob"></div>
                </div>
                <div class="knob-label" data-i18n="label.laTime" data-label="LA Time">LA Time</div>
                <div class="knob-value" id="lookahead-time-value">2.0ms</div>
            </div>

            <!-- Lookahead Enabled Toggle (spans both columns, sits under LA Time) -->
            <div class="toggle-container">
                <div class="toggle-switch" id="lookahead-toggle"></div>
                <div class="toggle-label" data-i18n="label.lookahead" data-label="Lookahead">Lookahead</div>
            </div>
        </div>

        <!-- Tooltip surface (single reused element). v1.7.0: positioned against
             the VIEWPORT, not #app — the ported measure-then-pin renderer
             places it with `position: fixed` and window-relative arithmetic. -->
        <div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>
    </div>

    <!-- JUCE JavaScript Bridge -->
    <script type="module" src="/js/juce/index.js"></script>

    <!-- Main Application Logic -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>

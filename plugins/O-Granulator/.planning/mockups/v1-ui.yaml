# O-Granulator - UI Design Specification v1
# Generated: 2026-11-04 by ui-design-agent (positions measured from v1-ui-test.html, headless Chrome)
# Aesthetic: Ouaricon Naturalist (ouaricon-naturalist-001), DARK variant

window:
  width: 1200
  height: 800
  resizable: false

aesthetic:
  base: ouaricon-naturalist-001
  variant: dark
  illustration: "Engraved dandelion clock (Taraxacum pappus in dispersal), inline SVG; bleeds off bottom-right, strokes #32291F on ground (decoration only). Title glyph: small seed-head in ochre; stream glyph: engraved pollen grain in stream colour."
  frame: "Engraved double plate rule (inset 6/9 px) with corner rivets"
  knob: "Dark seed cross-section: 20-segment conic body #2F261D/#261F17, #54453A dividers, bone core + indicator; 270deg value arc (stream colour or bone); outer ochre bipolar mod ring + live dot"

colors:
  ground: "#14100C"
  plate: "#1A1510"
  panel: "#1E1913"
  raised: "#262019"
  rule: "#33291F"
  rule_strong: "#4A3D30"
  ink: "#ECE1CC"        # 14.6:1 on ground
  ink_secondary: "#C9BBA2"  # 10.0:1
  ink_tertiary: "#A8977D"   # 6.7:1 on ground, 5.5:1 on raised
  value_arc: "#D9CBB0"
  accent: "#E2B064"     # ochre - reserved for modulation, freeze, write head, active tab
  on_accent: "#1A130B"  # 9.3:1 on accent
  streams:
    s1: "#A9C178"  # moss    9.5:1
    s2: "#E39177"  # madder  7.7:1
    s3: "#92A9E6"  # woad    8.2:1
    s4: "#CB9AD0"  # thistle 8.2:1

typography:
  family: "'EB Garamond', 'Garamond', 'Times New Roman', serif"   # modules/ui/eb-garamond (embed css + woff2)
  features: "lnum, tnum; all-small-caps for section titles/tabs/stream names"
  title: "25px"
  section_title: "13px small caps, 2px tracking"
  group_heading: "12.5px italic + fading hairline"
  knob_label: "11px Title Case (localisation headroom: label box 72px for a ~45px EN label)"
  knob_value: "11.5px, scaled value + unit, thin space"
  floor: "10.5px"
  notes:
    - "Glyphs NOT in the subset: infinity, sharp/flat, small triangles - use '-inf dB', '#', SVG chevrons"
    - "Canvas text waits for document.fonts.load() before first paint"

layout:
  type: custom
  regions:
    - { id: header, y: 16, height: 70, contents: [title, preset_bar, freeze, sync_mode, input_gain, mix, output_gain, output_meter, page_tabs, mod_source_dock] }
    - { id: buffer_strip, x: 18, y: 96, width: 1164, height: 140, contents: [buffer_view, buffer_length, scale_root, grain_limit, grain_count] }
    - { id: page, y: 248, height: 537, pages: [streams, fx, mod] }
  pages:
    streams: "4 columns (x 18/312/606/900, 282 wide, 12 gutter). Per column: header (numeral, M, S, enable) / Position + Pitch / onset trigger + scale / Size + Rate / Window (fig + 3 knobs) / Scatter + Mixer"
    fx: "4 columns: Grain filter (type segmented + fig + cutoff/random/res) / Drive (fig + drive) + Crush / Ring modulator (fig + 3). Bottom band: Feedback network flow (5 knobs + loop gain readout) | Output reverb (3 knobs + decay fig)"
    mod: "LFO 1-4 cards (chip, live wave, shape segmented, rate/phase) / Env, Pitch (note readout, clarity, follow I-IV), Onset cards / Macros 1-4 + routing legend | Modulation matrix 16 rows (source, destination, bipolar depth, value)"
  grid:
    knob_cell: { width: 62, height: 85 }
    knob_cell_large: { width: 80, height: 97 }
    header_knob: { width: 108, height: 58 }
    column_slots_x: [0, 72, 148, 220]

modulation_ux:
  sources: ["LFO 1", "LFO 2", "LFO 3", "LFO 4", "Env", "Pitch", "Onset", "Macro 1", "Macro 2", "Macro 3", "Macro 4"]
  handles: "Header dock (always visible, all pages) + chips on each MOD-page source card; background tint tracks the live source value"
  drop: "Drag a chip onto any knob with a destination index -> first empty slot gets source/dest/depth +40 %; ring + slot row flash. Duplicate source->dest flashes the existing slot. Non-destination knobs dim while dragging."
  ring: "Ochre arc at r+7 around the knob from base to base+depth (bipolar sources show a faint +/- reach); live dot = modulated value"
  edit: "Alt-drag knob = depth of latest route on it; matrix row depth bar (drag, dbl-click = 0); click slot number = clear"
  tempo_alias: "In Tempo mode sN_size_sync / sN_density_sync / lfoN_rate_sync knobs drop onto the sN_size / sN_density / lfoN_rate destinations (offset -> multiplier)"
  destination_table_size: 113


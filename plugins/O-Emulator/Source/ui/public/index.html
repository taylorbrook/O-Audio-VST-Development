<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>O-Emulator</title>
<style>
  /* ============ WebView constraints ============ */
  html, body { height: 100%; margin: 0; padding: 0; }
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg-paper: #F5E6D3;
    --bg-paper-light: #FAF0E6;
    --panel: rgba(250, 240, 230, 0.66);
    --brown-border: #8B7355;
    --brown-frame: #5C4033;
    --brown-text: #3C2F2F;
    --green-light: #8BA870;
    --green-mid: #6B8E4E;
    --green-dark: #3C5C1A;
    --green-darkest: #2C3E10;
    --knob-ring: #C9A27B;
    --seg-a: #F5DEB3;
    --seg-b: #E8D5B7;
    --knob-core: #FFF8DC;
    --serif: 'EB Garamond', 'Garamond', 'Adobe Garamond Pro', 'Times New Roman', serif;
  }

  /* ============ per-console accent system ============
     One accent hue shifts per console (RESEARCH §2 — console brand colors
     pulled down to naturalist ink saturation). Swapped by the SAME
     getComboBoxState listener that renders the segments, so host automation
     and preset load re-theme too. --accent-fill is the accent at 0.5 alpha
     over the paper tone (active segment); --accent-dark is the accent
     darkened ~15% (active border/text, knob stems, info readout). */
  body[data-console="0"] { --accent: #7B6480; --accent-dark: #68556D; --accent-fill: rgba(123,100,128,0.5); }  /* SNES — muted plum */
  body[data-console="1"] { --accent: #5F7386; --accent-dark: #516272; --accent-fill: rgba(95,115,134,0.5);  }  /* PS1 — slate */
  body[data-console="2"] { --accent: #9B5A48; --accent-dark: #844D3D; --accent-fill: rgba(155,90,72,0.5);   }  /* NES — brick oxide */
  body[data-console="3"] { --accent: #6F7D3F; --accent-dark: #5E6A36; --accent-fill: rgba(111,125,63,0.5);  }  /* Game Boy — DMG olive */
  body[data-console="4"] { --accent: #4E7A70; --accent-dark: #42685F; --accent-fill: rgba(78,122,112,0.5);  }  /* Genesis — deep teal */

  body {
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    overflow: hidden;
    font-family: var(--serif);
    color: var(--brown-text);
    background: var(--bg-paper);
  }

  /* ====== plugin frame — WebView is exactly 620 × 430 ====== */
  .plugin {
    position: relative;
    width: 100%;
    height: 100%;
    border: 3px solid var(--brown-frame);
    background:
      linear-gradient(rgba(245,230,211,0.42), rgba(240,222,200,0.5)),
      url("img/paper.jpg") center / cover no-repeat, var(--bg-paper);
    overflow: hidden;
  }

  /* ghosted specimen — Marsh, The Dinocerata (1886), Dinoceras mirabile.
     Extinct species for discontinued consoles. Landscape plate (1.96:1) that
     underlaps the knob row: z above paper, below controls, never clickable. */
  .specimen {
    position: absolute;
    right: -140px;
    top: 55%;
    transform: translateY(-50%);
    height: 60%;
    opacity: 0.35;
    pointer-events: none;
    z-index: 1;
    filter: sepia(0.25) saturate(0.85);
  }

  .corner-fleuron {
    position: absolute;
    font-size: 13px;
    color: rgba(60,47,47,0.28);
    z-index: 3;
    pointer-events: none;
  }
  .corner-fleuron.bl { left: 8px; bottom: 4px; }
  .corner-fleuron.tr { right: 8px; top: 4px; transform: scaleX(-1); }

  .inner {
    position: absolute;
    inset: 0;
    padding: 16px 22px 20px;
    display: flex;
    flex-direction: column;
    z-index: 2;
  }

  /* ============ header ============ */
  .hdr {
    height: 48px;
    flex: 0 0 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--brown-border);
    position: relative;
    margin-bottom: 10px;
  }
  .hdr::after {  /* second rule of the double hairline */
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 1px;
    background: rgba(139,115,85,0.4);
  }
  .wordmark {
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 3px;
    color: var(--brown-text);
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
  }
  .wordmark .fleuron { font-size: 15px; color: rgba(60,47,47,0.55); margin-right: 8px; vertical-align: 3px; }
  /* Reserved preset-bar slot (Stage 4 — preset-manager v1.0.6 lands with the
     factory presets). Empty in v1.0 but holds its width+height so the header
     geometry never shifts when the band arrives. */
  .preset-band {
    align-self: flex-end;
    min-width: 200px;
    min-height: 26px;
  }
  .hdr-right { text-align: right; line-height: 1.45; padding-bottom: 1px; }
  .hdr-right .brand {
    font-variant: small-caps;
    letter-spacing: 2.5px;
    font-size: 11px;
    color: var(--brown-frame);
  }
  .hdr-right .plate {
    font-style: italic;
    font-size: 9.5px;
    letter-spacing: 1px;
    color: rgba(92,64,51,0.8);
  }

  /* ============ console selector (5-segment) ============
     O-Bitrot .seg language extended to five buttons, full width. Divider is
     NEUTRAL BROWN, not the template green — resolved design call: the green
     hairline clashed against the plum/brick/slate accent fills, the brown
     reads cleanly under all five. Active segment is accent-tinted (the accent
     IS the theming mechanism and the selector is its home); hover keeps the
     template light-green tint so the toggle language survives. */
  .console-row {
    flex: 0 0 auto;
    margin-top: 14px;
    display: flex;
    justify-content: center;
  }
  .seg {
    display: inline-flex;
    width: 100%;
    border: 1.5px solid var(--green-dark);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.15);
  }
  .seg button {
    flex: 1 1 0;
    font-family: var(--serif);
    font-size: 13px;
    font-variant: small-caps;
    letter-spacing: 1.5px;
    color: var(--green-darkest);
    background: rgba(139,168,112,0.15);
    border: none;
    padding: 6px 10px 7px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .seg button + button { border-left: 1px solid rgba(92,64,51,0.4); }
  .seg button.sel {
    background: var(--accent-fill);
    color: var(--accent-dark);
    font-weight: 600;
  }
  .seg button:hover:not(.sel) { background: rgba(139,168,112,0.3); }

  /* ============ info readout ============ */
  .console-info {
    flex: 0 0 auto;
    margin-top: 9px;
    text-align: center;
    font-style: italic;
    font-size: 12.5px;
    letter-spacing: 1px;
    color: var(--accent-dark);
    transition: color 0.2s;
  }

  /* ============ knob row ============ */
  .knob-row {
    flex: 1 1 auto;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    padding: 6px 20px 2px;
  }
  .ctl {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
  }
  .ctl-label {
    font-variant: small-caps;
    letter-spacing: 2px;
    font-size: 13px;
    color: var(--brown-frame);
  }
  .knob {
    position: relative;
    border-radius: 50%;
    border: 2px solid var(--brown-border);
    cursor: ns-resize;
    touch-action: none;
    background:
      radial-gradient(circle, var(--knob-core) 0 20%, transparent 20.5%),
      radial-gradient(circle, transparent 57%, var(--knob-ring) 57.5% 67%, rgba(139,115,85,0.85) 67% 70%, transparent 70.5%),
      repeating-conic-gradient(from -90deg,
        var(--seg-a) 0 34deg, var(--brown-border) 34deg 36deg,
        var(--seg-b) 36deg 70deg, var(--brown-border) 70deg 72deg);
    box-shadow:
      inset 1px 1px 3px rgba(0,0,0,0.3),
      inset -1px -1px 2px rgba(255,248,220,0.5),
      2px 2px 6px rgba(0,0,0,0.25);
    transition: transform 0.1s ease-out;
  }
  .knob:hover { transform: scale(1.05); }
  .knob:active { transform: scale(0.98); }
  .k60 { width: 60px; height: 60px; }

  /* indicator stem — tinted by the active console accent */
  .stem { position: absolute; inset: 0; transform: rotate(0deg); pointer-events: none; }
  .stem::before {
    content: '';
    position: absolute;
    left: 50%; top: 7%;
    width: 2.5px; height: 30%;
    margin-left: -1.25px;
    background: var(--accent-dark);
    border-radius: 2px;
    box-shadow: 0 0 1px rgba(255,248,220,0.6);
  }

  .ro {
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--brown-text);
    min-height: 15px;
  }

  /* Double-click value entry (O-Prism pattern). Overlaid ON the readout span,
     which keeps its own text (rendered transparent) so the box never changes
     size. Background transparent, ink copied from the readout's computed
     colour by attachValueEntry() — currentColor carries it to the underline. */
  .knob-value-input {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 0;
    margin: 0;
    border: none;
    border-bottom: 1px solid currentColor;
    border-radius: 0;
    background: transparent;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-align: center;
    outline: none;
  }
</style>
</head>
<body data-console="0">
  <div class="plugin">
    <img class="specimen" src="img/specimen.webp" alt="" draggable="false" />
    <span class="corner-fleuron tr">❦</span>
    <span class="corner-fleuron bl">❦</span>

    <div class="inner">
      <!-- ================= header ================= -->
      <div class="hdr">
        <div class="wordmark"><span class="fleuron">❦</span>O-EMULATOR</div>
        <div class="preset-band" aria-hidden="true"></div>
        <div class="hdr-right">
          <div class="brand">Ouaricon Audio</div>
          <div class="plate">A Survey of Extinct Consoles · Plate CDLXXXVII</div>
        </div>
      </div>

      <!-- ================= console selector ================= -->
      <div class="console-row">
        <div class="seg" data-param="console" role="group" aria-label="Console">
          <button type="button" data-value="0">SNES</button>
          <button type="button" data-value="1">PS1</button>
          <button type="button" data-value="2">NES</button>
          <button type="button" data-value="3">GB</button>
          <button type="button" data-value="4">Genesis</button>
        </div>
      </div>

      <!-- static per-console spec line — written only by the console listener -->
      <div class="console-info" id="consoleInfo">&nbsp;</div>

      <!-- ================= macro knobs ================= -->
      <div class="knob-row">
        <div class="ctl">
          <div class="ctl-label">Crush</div>
          <div class="knob k60" data-param="crush" data-default="50" data-unit="%" data-dec="0"><div class="stem"></div></div>
          <div class="ro">&nbsp;</div>
        </div>
        <div class="ctl">
          <div class="ctl-label">Age</div>
          <div class="knob k60" data-param="age" data-default="20" data-unit="%" data-dec="0"><div class="stem"></div></div>
          <div class="ro">&nbsp;</div>
        </div>
        <div class="ctl">
          <div class="ctl-label">Reverb</div>
          <div class="knob k60" data-param="reverb" data-default="0" data-unit="%" data-dec="0"><div class="stem"></div></div>
          <div class="ro">&nbsp;</div>
        </div>
        <div class="ctl">
          <div class="ctl-label">Mix</div>
          <div class="knob k60" data-param="mix" data-default="100" data-unit="%" data-dec="0"><div class="stem"></div></div>
          <div class="ro">&nbsp;</div>
        </div>
      </div>
    </div>
  </div>

<script type="module">
  // JUCE 8 frontend library — always bind parameters through the Juce
  // ES-module namespace, never through the raw injected backend global
  // (repo pattern critical_juce_webview_namespace_vs_postmessage).
  import * as Juce from "./js/juce/index.js";

  // Native application feel
  document.addEventListener("contextmenu", (e) => { e.preventDefault(); return false; });
  document.addEventListener("dragstart", (e) => e.preventDefault());

  const clamp01 = (v) => Math.min(1, Math.max(0, v));

  // Invert C++ NormalisableRange using the state's own properties (start/end/
  // skew arrive from the backend). All four floats are linear 0–100 in v1.0,
  // but the skew-aware form is kept anyway — zero cost, future-proof.
  const scaledToNormalised = (state, scaled) => {
    const p = state.properties;
    if (!p || p.end === p.start) return 0;
    const skew = p.skew > 0 ? p.skew : 1;
    return clamp01(Math.pow(clamp01((scaled - p.start) / (p.end - p.start)), skew));
  };

  // Readout formatting only — the VALUE always comes from getScaledValue().
  const fmtValue = (el, v) => {
    const dec = +(el.dataset.dec || 0);
    const unit = el.dataset.unit || "";
    const s = v.toFixed(dec);
    return unit ? s + " " + unit : s;
  };

  // ============ double-click value entry (O-Prism pattern) ============
  // Opens an inline editor on a value-readout span. opts.format() renders the
  // live value; opts.parse(text) returns a SCALED value or null to reject.
  // Enter/blur commits, Esc cancels; unparseable or UNTOUCHED input is
  // discarded without ever writing the parameter (the readout is rounded for
  // display — writing it back would quantise the parameter to the rounding).
  function attachValueEntry(valueEl, state, opts) {
    if (!valueEl || !state) return;
    if (valueEl.dataset.editing === "1") return;   // already open

    const currentText = valueEl.textContent;
    const prevPosition = valueEl.style.position;
    const prevColor = valueEl.style.color;
    // Read the readout's ink BEFORE hiding it — the span's own colour is about
    // to become transparent, so `inherit` on the input would resolve invisible.
    const inkColor = getComputedStyle(valueEl).color;

    const input = document.createElement("input");
    input.type = "text";
    input.className = "knob-value-input";
    input.value = currentText;
    input.spellcheck = false;
    input.autocomplete = "off";
    input.style.color = inkColor;

    // The span keeps its own text (rendered transparent) so its box stays
    // exactly the size it was — the input is overlaid on top of it.
    valueEl.dataset.editing = "1";
    valueEl.style.position = "relative";
    valueEl.style.color = "transparent";
    valueEl.appendChild(input);
    input.focus();
    input.select();

    let closed = false;

    const close = () => {
      if (closed) return;
      closed = true;
      delete valueEl.dataset.editing;
      input.remove();
      valueEl.style.position = prevPosition;
      valueEl.style.color = prevColor;
      // Re-render from live state: the parameter may have moved (host
      // automation, preset load) while readout updates were suppressed.
      valueEl.textContent = opts.format();
    };

    const commit = () => {
      if (closed) return;
      if (input.value === currentText) { close(); return; }   // untouched guard
      const scaled = opts.parse(input.value);
      if (scaled !== null && isFinite(scaled)) {
        state.sliderDragStarted();
        state.setNormalisedValue(scaledToNormalised(state, scaled));
        state.sliderDragEnded();
      }
      close();
    };

    input.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      else if (e.key === "Escape") { e.preventDefault(); close(); }
    });
    input.addEventListener("blur", commit);
    // The readout sits under the knob's drag column — without these, clicking
    // into the field would leak into knob handlers.
    input.addEventListener("pointerdown", (e) => e.stopPropagation());
    input.addEventListener("mousedown", (e) => e.stopPropagation());
    input.addEventListener("dblclick", (e) => e.stopPropagation());
    input.addEventListener("wheel", (e) => e.stopPropagation());
  }

  // ============ knobs (4 floats: crush / age / reverb / mix) ============
  const setupKnob = (el) => {
    const state = Juce.getSliderState(el.dataset.param);
    const stem = el.querySelector(".stem");
    const ro = el.closest(".ctl")?.querySelector(".ro");

    const render = () => {
      stem.style.transform = `rotate(${-135 + state.getNormalisedValue() * 270}deg)`;
      // Suppressed while an entry field is open — textContent would wipe out
      // the <input> that lives inside this span.
      if (ro && ro.dataset.editing !== "1")
        ro.textContent = fmtValue(el, state.getScaledValue());
    };
    state.valueChangedEvent.addListener(render);
    state.propertiesChangedEvent.addListener(render);
    render();

    // Alt/Option-click resets to default. CAPTURE phase so it preempts the
    // drag handler below — on the bubble phase the knob would reset and then
    // immediately start dragging.
    el.addEventListener("pointerdown", (e) => {
      if (!e.altKey) return;
      e.preventDefault();
      e.stopPropagation();
      state.sliderDragStarted();
      state.setNormalisedValue(scaledToNormalised(state, +el.dataset.default));
      state.sliderDragEnded();
    }, true);

    let dragY = null, dragNorm = 0;
    el.addEventListener("pointerdown", (e) => {
      dragY = e.clientY;
      dragNorm = state.getNormalisedValue();
      state.sliderDragStarted();
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", (e) => {
      if (dragY === null) return;
      const fine = e.shiftKey ? 0.001 : 0.005;
      state.setNormalisedValue(clamp01(dragNorm + (dragY - e.clientY) * fine));
    });
    const endDrag = (e) => {
      if (dragY === null) return;
      dragY = null;
      state.sliderDragEnded();
      el.releasePointerCapture(e.pointerId);
    };
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);

    // Double-click opens inline value entry (Alt/Option-click resets instead).
    el.addEventListener("dblclick", (e) => {
      if (e.altKey) return;
      attachValueEntry(ro, state, {
        format: () => fmtValue(el, state.getScaledValue()),
        parse: (text) => {
          const v = parseFloat(text.replace(",", ".").replace("%", "").trim());
          if (!isFinite(v)) return null;
          return Math.min(100, Math.max(0, v));
        },
      });
    });

    el.addEventListener("wheel", (e) => {
      e.preventDefault();
      state.sliderDragStarted();
      state.setNormalisedValue(clamp01(state.getNormalisedValue() + (e.deltaY < 0 ? 0.02 : -0.02)));
      state.sliderDragEnded();
    }, { passive: false });
  };
  document.querySelectorAll(".knob[data-param]").forEach(setupKnob);

  // ============ console selector + accent + info readout ============
  // Static per-console spec table — names/rates/codecs locked to
  // ARCHITECTURE.md. Written ONLY from the listener below; segment button
  // labels are HTML-authored and never touched by script
  // (pattern_js_state_updater_overwrites_html_labels).
  const CONSOLE_SPECS = [
    { name: "SNES",     spec: "BRR 4-bit · 32 kHz · Gaussian" },
    { name: "PS1",      spec: "SPU-ADPCM · 22.05 kHz · Gaussian" },
    { name: "NES",      spec: "DPCM · 33.144 kHz · ZOH" },
    { name: "Game Boy", spec: "4-bit wave · 16.384 kHz · ZOH" },
    { name: "Genesis",  spec: "8-bit DAC · 26.32 kHz · ZOH" },
  ];
  const infoEl = document.getElementById("consoleInfo");

  document.querySelectorAll(".seg[data-param]").forEach((seg) => {
    const state = Juce.getComboBoxState(seg.dataset.param);
    const buttons = seg.querySelectorAll("button");
    const render = () => {
      const idx = state.getChoiceIndex();
      buttons.forEach((b) => b.classList.toggle("sel", +b.dataset.value === idx));
      // One write point for the whole theme: segments, accent vars (via the
      // body attribute the CSS keys on), and the spec readout. Relay events
      // fire on host automation and preset load alike, so everything stays
      // fresh with no revision counter.
      const c = CONSOLE_SPECS[idx];
      if (c) {
        document.body.dataset.console = String(idx);
        infoEl.textContent = c.name + " — " + c.spec;
      }
    };
    state.valueChangedEvent.addListener(render);
    render();
    buttons.forEach((b) =>
      b.addEventListener("click", () => state.setChoiceIndex(+b.dataset.value)));
  });
</script>
</body>
</html>

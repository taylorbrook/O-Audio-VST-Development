<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600, height=400">
    <title>Ouaricon Marimba</title>
    <style>
        /* ====================================================================
           CRITICAL CSS CONSTRAINTS
           ==================================================================== */

        /* Use 100%, NOT 100vh - JUCE WebView requires percentage-based sizing */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ====================================================================
           NATIVE APPLICATION FEEL
           ==================================================================== */

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100%;
            background: #2a2a2a;
            font-family: 'Garamond', 'Times New Roman', serif;

            /* Native feel CSS */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        .plugin-container {
            width: 600px;
            height: 400px;
            position: relative;
            background: #F5E6D3;
            border: 3px solid #5C4033;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid rgba(139, 115, 85, 0.5);
            z-index: 10;
            background: rgba(245, 230, 211, 0.9);
        }

        .title {
            font-size: 18px;
            font-weight: normal;
            color: #3C2F2F;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        /* Preset Browser */
        .preset-browser {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(235, 217, 199, 0.9);
            border: 1px solid #8B7355;
            border-radius: 4px;
            padding: 4px 10px;
            height: 28px;
        }

        .preset-arrow {
            width: 20px;
            height: 20px;
            background: rgba(139, 168, 112, 0.3);
            border: 1px solid #3C5C1A;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #3C2F2F;
            font-size: 10px;
        }

        .preset-arrow:hover {
            background: rgba(107, 142, 35, 0.4);
        }

        .preset-name {
            font-size: 10px;
            color: #3C2F2F;
            min-width: 120px;
            text-align: center;
        }

        .preset-save {
            font-size: 9px;
            color: #3C2F2F;
            background: rgba(139, 168, 112, 0.3);
            border: 1px solid #3C5C1A;
            border-radius: 3px;
            padding: 2px 8px;
            cursor: pointer;
        }

        /* Tab Bar */
        .tab-bar {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: 29px;
            display: flex;
            padding: 0 20px;
            gap: 0;
            border-bottom: 1px solid rgba(139, 115, 85, 0.5);
            z-index: 10;
            background: rgba(245, 230, 211, 0.85);
        }

        .tab {
            padding: 6px 20px;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #3C2F2F;
            cursor: pointer;
            border: 1px solid #8B7355;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            background: rgba(212, 196, 176, 0.5);
            margin-right: -1px;
        }

        .tab.active {
            background: #F5E6D3;
            border-bottom: 1px solid #F5E6D3;
            margin-bottom: -1px;
        }

        .tab:hover:not(.active) {
            background: rgba(212, 196, 176, 0.8);
        }

        /* Tab Content */
        .tab-content {
            position: absolute;
            top: 74px;
            left: 0;
            width: 100%;
            height: 326px;
            display: none;
            z-index: 5;
        }

        .tab-content.active {
            display: block;
        }

        /* Knob Styles */
        .knob-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .knob {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #8B7355;
            position: relative;
            cursor: pointer;
            background:
                radial-gradient(circle, transparent 88%, #C9A27B 88%, #C9A27B 92%, #8B7355 92%, #8B7355 94%, transparent 94%),
                conic-gradient(from 0deg,
                    #F5DEB3 0deg, #F5DEB3 17deg, #8B7355 17deg, #8B7355 19deg,
                    #E8D5B7 19deg, #E8D5B7 35deg, #8B7355 35deg, #8B7355 37deg,
                    #F5DEB3 37deg, #F5DEB3 53deg, #8B7355 53deg, #8B7355 55deg,
                    #E8D5B7 55deg, #E8D5B7 71deg, #8B7355 71deg, #8B7355 73deg,
                    #F5DEB3 73deg, #F5DEB3 89deg, #8B7355 89deg, #8B7355 91deg,
                    #E8D5B7 91deg, #E8D5B7 107deg, #8B7355 107deg, #8B7355 109deg,
                    #F5DEB3 109deg, #F5DEB3 125deg, #8B7355 125deg, #8B7355 127deg,
                    #E8D5B7 127deg, #E8D5B7 143deg, #8B7355 143deg, #8B7355 145deg,
                    #F5DEB3 145deg, #F5DEB3 161deg, #8B7355 161deg, #8B7355 163deg,
                    #E8D5B7 163deg, #E8D5B7 179deg, #8B7355 179deg, #8B7355 181deg,
                    #F5DEB3 181deg, #F5DEB3 197deg, #8B7355 197deg, #8B7355 199deg,
                    #E8D5B7 199deg, #E8D5B7 215deg, #8B7355 215deg, #8B7355 217deg,
                    #F5DEB3 217deg, #F5DEB3 233deg, #8B7355 233deg, #8B7355 235deg,
                    #E8D5B7 235deg, #E8D5B7 251deg, #8B7355 251deg, #8B7355 253deg,
                    #F5DEB3 253deg, #F5DEB3 269deg, #8B7355 269deg, #8B7355 271deg,
                    #E8D5B7 271deg, #E8D5B7 287deg, #8B7355 287deg, #8B7355 289deg,
                    #F5DEB3 289deg, #F5DEB3 305deg, #8B7355 305deg, #8B7355 307deg,
                    #E8D5B7 307deg, #E8D5B7 323deg, #8B7355 323deg, #8B7355 325deg,
                    #F5DEB3 325deg, #F5DEB3 341deg, #8B7355 341deg, #8B7355 343deg,
                    #E8D5B7 343deg, #E8D5B7 359deg, #8B7355 359deg, #8B7355 360deg
                ),
                radial-gradient(circle, #FFF8DC 0%, #FFF8DC 20%, transparent 20%);
            box-shadow:
                inset 1px 1px 3px rgba(0,0,0,0.3),
                inset -1px -1px 2px rgba(255,248,220,0.5),
                2px 2px 6px rgba(0,0,0,0.25);
        }

        .knob.small {
            width: 55px;
            height: 55px;
        }

        .knob-indicator {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #3C2F2F;
            border-radius: 50%;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
        }

        .knob:hover {
            transform: scale(1.02);
        }

        .knob-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #3C2F2F;
            text-align: center;
        }

        .knob-sublabel {
            font-size: 8px;
            color: #5C4033;
            margin-top: -4px;
        }

        /* Buttons */
        .btn {
            background: rgba(139, 168, 112, 0.3);
            border: 2px solid #3C5C1A;
            border-radius: 4px;
            padding: 6px 14px;
            font-family: 'Garamond', serif;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #3C2F2F;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(107, 142, 35, 0.4);
            transform: translateY(-1px);
        }

        .btn.active {
            background: rgba(107, 142, 35, 0.6);
            border-color: #2C3E10;
        }

        /* Waveform Display */
        .waveform-display {
            position: absolute;
            right: 25px;
            top: 20px;
            width: 260px;
            height: 120px;
            background: rgba(139, 168, 112, 0.15);
            border: 1px solid #8B7355;
            border-radius: 4px;
            overflow: hidden;
        }

        .waveform-display svg {
            width: 100%;
            height: 100%;
        }

        /* Velocity Curve Display */
        .velocity-curve-display {
            position: absolute;
            left: 100px;
            bottom: 25px;
            width: 140px;
            height: 100px;
            background: rgba(139, 168, 112, 0.12);
            border: 1px solid #8B7355;
            border-radius: 4px;
            overflow: hidden;
        }

        .velocity-curve-display .axis-label {
            position: absolute;
            font-size: 6px;
            color: #5C4033;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .velocity-curve-display .axis-label.x {
            bottom: 2px;
            right: 6px;
        }

        .velocity-curve-display .axis-label.y {
            top: 2px;
            left: 6px;
        }

        .velocity-curve-display .title-label {
            position: absolute;
            top: 2px;
            right: 6px;
            font-size: 7px;
            color: #3C2F2F;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* VU Meter */
        .vu-meter {
            width: 80px;
            height: 80px;
            background: rgba(139, 168, 112, 0.2);
            border: 2px solid #3C5C1A;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .vu-meter-scale {
            position: absolute;
            width: 100%;
            height: 50%;
            top: 5%;
        }

        .vu-meter-needle {
            position: absolute;
            width: 2px;
            height: 32px;
            background: #3C5C1A;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-30deg);
            border-radius: 1px;
            transition: transform 0.15s ease-out;
        }

        .vu-meter-pivot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #3C2F2F;
            border-radius: 50%;
            bottom: calc(50% - 5px);
            left: calc(50% - 5px);
        }

        .vu-meter-label {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 7px;
            color: #3C2F2F;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Output Section */
        .output-section {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 290px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* Velocity Section */
        .velocity-section {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 290px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        /* Tuning Controls Panel */
        .tuning-controls-panel {
            position: absolute;
            right: 25px;
            top: 15px;
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tuning-mode-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .tuning-mode-buttons {
            display: flex;
            gap: 10px;
        }

        .tuning-ref-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .scale-name-display {
            width: 180px;
            height: 24px;
            background: rgba(235, 217, 199, 0.7);
            border: 1px solid #8B7355;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #3C2F2F;
        }
    </style>
</head>
<body>
    <div class="plugin-container">
        <!-- Header -->
        <div class="header">
            <div class="title">Ouaricon Marimba</div>
            <div class="preset-browser">
                <div class="preset-arrow">◀</div>
                <div class="preset-name">Default Marimba</div>
                <div class="preset-arrow">▶</div>
                <div class="preset-save">SAVE</div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <div class="tab active" id="tab-sound">SOUND</div>
            <div class="tab" id="tab-tuning">TUNING</div>
        </div>

        <!-- SOUND Tab Content -->
        <div id="main-tab" class="tab-content active">
            <!-- TOP LEFT: Sound Shaping Knobs -->
            <div class="knob-container" style="left: 40px; top: 30px;">
                <div class="knob" id="mallet-knob">
                    <div class="knob-indicator" id="mallet-indicator"></div>
                </div>
                <div class="knob-label">MALLET</div>
                <div class="knob-sublabel" id="mallet-value">50%</div>
            </div>

            <div class="knob-container" style="left: 120px; top: 30px;">
                <div class="knob" id="material-knob">
                    <div class="knob-indicator" id="material-indicator"></div>
                </div>
                <div class="knob-label">MATERIAL</div>
                <div class="knob-sublabel" id="material-value">50%</div>
            </div>

            <div class="knob-container" style="left: 200px; top: 30px;">
                <div class="knob" id="resonance-knob">
                    <div class="knob-indicator" id="resonance-indicator"></div>
                </div>
                <div class="knob-label">RESONANCE</div>
                <div class="knob-sublabel" id="resonance-value">60%</div>
            </div>

            <!-- TOP RIGHT: Waveform Display -->
            <div class="waveform-display">
                <svg viewBox="0 0 260 120" preserveAspectRatio="none">
                    <path id="waveform-path" d="M0,60 L260,60"
                          fill="none" stroke="#6B8E4E" stroke-width="2"/>
                    <path id="waveform-fill" d="M0,60 L260,60 L260,120 L0,120 Z"
                          fill="rgba(107, 142, 35, 0.25)"/>
                </svg>
            </div>

            <!-- BOTTOM LEFT: Velocity Section -->
            <div class="velocity-section">
                <div class="knob-container" style="position: relative;">
                    <div class="knob" id="velocity-knob">
                        <div class="knob-indicator" id="velocity-indicator"></div>
                    </div>
                    <div class="knob-label">VELOCITY</div>
                    <div class="knob-sublabel" id="velocity-value">50%</div>
                </div>

                <div class="velocity-curve-display" style="position: relative; left: 0; bottom: 0;">
                    <span class="title-label">RESPONSE</span>
                    <span class="axis-label y">Out</span>
                    <span class="axis-label x">In</span>
                    <svg width="140" height="100" viewBox="0 0 140 100" id="curve-svg">
                        <line x1="15" y1="85" x2="125" y2="85" stroke="#8B7355" stroke-width="0.5" opacity="0.5"/>
                        <line x1="15" y1="15" x2="15" y2="85" stroke="#8B7355" stroke-width="0.5" opacity="0.5"/>
                        <path id="velocity-curve" d="M15,85 Q70,50 125,15"
                              fill="none" stroke="#6B8E4E" stroke-width="2"/>
                        <path id="velocity-fill" d="M15,85 Q70,50 125,15 L125,85 Z"
                              fill="rgba(107, 142, 35, 0.2)"/>
                    </svg>
                </div>
            </div>

            <!-- BOTTOM RIGHT: Output Section -->
            <div class="output-section">
                <div class="knob-container" style="position: relative;">
                    <div class="knob" id="output-knob">
                        <div class="knob-indicator" id="output-indicator"></div>
                    </div>
                    <div class="knob-label">OUTPUT</div>
                    <div class="knob-sublabel" id="output-value">0.0 dB</div>
                </div>

                <div class="vu-meter">
                    <svg class="vu-meter-scale" viewBox="0 0 70 35">
                        <path d="M 10 30 A 25 25 0 0 1 60 30" fill="none" stroke="#8B7355" stroke-width="1"/>
                        <text x="8" y="28" font-size="5" fill="#3C2F2F">-20</text>
                        <text x="18" y="18" font-size="5" fill="#3C2F2F">-10</text>
                        <text x="32" y="12" font-size="5" fill="#3C2F2F">0</text>
                        <text x="48" y="18" font-size="5" fill="#3C2F2F">+3</text>
                    </svg>
                    <div class="vu-meter-needle" id="vu-needle"></div>
                    <div class="vu-meter-pivot"></div>
                    <div class="vu-meter-label">Level</div>
                </div>
            </div>
        </div>

        <!-- TUNING Tab Content -->
        <div id="tuning-tab" class="tab-content">
            <!-- RIGHT SIDE: Tuning Controls -->
            <div class="tuning-controls-panel">
                <!-- Mode Selection -->
                <div class="tuning-mode-section">
                    <div class="tuning-mode-buttons">
                        <button class="btn active" id="btn-12tet">12-TET</button>
                        <button class="btn" id="btn-scala">SCALA</button>
                        <button class="btn" id="btn-mts">MTS-ESP</button>
                    </div>
                </div>

                <!-- Reference Pitch -->
                <div class="tuning-ref-section">
                    <div class="knob-container" style="position: relative; left: auto; top: auto;">
                        <div class="knob small" id="ref-pitch-knob">
                            <div class="knob-indicator" id="ref-pitch-indicator"></div>
                        </div>
                        <div class="knob-label">A4 REF</div>
                        <div class="knob-sublabel" id="ref-pitch-value">440.0 Hz</div>
                    </div>
                </div>

                <!-- Scale Name Display -->
                <div class="scale-name-display" id="scale-name">12-TET Standard</div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as Juce from "./js/juce/index.js";

        // Disable right-click context menu
        document.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            return false;
        });

        // Verify JUCE backend
        if (!window.__JUCE__) {
            console.error("JUCE backend not available");
            throw new Error("JUCE backend not connected");
        }

        console.log("JUCE backend connected:", window.__JUCE__.backend);

        // Tab switching
        let currentTab = 'main';
        document.getElementById('tab-sound').addEventListener('click', () => {
            currentTab = 'main';
            document.getElementById('main-tab').classList.add('active');
            document.getElementById('tuning-tab').classList.remove('active');
            document.getElementById('tab-sound').classList.add('active');
            document.getElementById('tab-tuning').classList.remove('active');
        });

        document.getElementById('tab-tuning').addEventListener('click', () => {
            currentTab = 'tuning';
            document.getElementById('tuning-tab').classList.add('active');
            document.getElementById('main-tab').classList.remove('active');
            document.getElementById('tab-tuning').classList.add('active');
            document.getElementById('tab-sound').classList.remove('active');
        });

        // ====================================================================
        // PARAMETER BINDINGS
        // ====================================================================

        // Helper function: Update knob indicator rotation
        function updateKnobIndicator(indicator, normalizedValue) {
            const angle = -135 + (normalizedValue * 270);
            indicator.style.transform = `translateX(-50%) rotate(${angle}deg)`;
            indicator.style.transformOrigin = 'center 22px';
        }

        // MALLET_HARDNESS
        const malletState = Juce.getSliderState("MALLET_HARDNESS");
        const malletKnob = document.getElementById("mallet-knob");
        const malletIndicator = document.getElementById("mallet-indicator");
        const malletValue = document.getElementById("mallet-value");

        let malletDragging = false;
        malletKnob.addEventListener('mousedown', () => malletDragging = true);
        document.addEventListener('mouseup', () => malletDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (malletDragging) {
                const currentValue = malletState.getNormalisedValue();
                const newValue = Math.max(0, Math.min(1, currentValue - e.movementY * 0.005));
                malletState.setNormalisedValue(newValue);
            }
        });

        malletState.valueChangedEvent.addListener((newValue) => {
            updateKnobIndicator(malletIndicator, newValue);
            malletValue.textContent = Math.round(newValue * 100) + "%";
        });

        updateKnobIndicator(malletIndicator, malletState.getNormalisedValue());
        malletValue.textContent = Math.round(malletState.getNormalisedValue() * 100) + "%";

        // BAR_MATERIAL
        const materialState = Juce.getSliderState("BAR_MATERIAL");
        const materialKnob = document.getElementById("material-knob");
        const materialIndicator = document.getElementById("material-indicator");
        const materialValue = document.getElementById("material-value");

        let materialDragging = false;
        materialKnob.addEventListener('mousedown', () => materialDragging = true);
        document.addEventListener('mouseup', () => materialDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (materialDragging) {
                const currentValue = materialState.getNormalisedValue();
                const newValue = Math.max(0, Math.min(1, currentValue - e.movementY * 0.005));
                materialState.setNormalisedValue(newValue);
            }
        });

        materialState.valueChangedEvent.addListener((newValue) => {
            updateKnobIndicator(materialIndicator, newValue);
            materialValue.textContent = Math.round(newValue * 100) + "%";
        });

        updateKnobIndicator(materialIndicator, materialState.getNormalisedValue());
        materialValue.textContent = Math.round(materialState.getNormalisedValue() * 100) + "%";

        // RESONANCE
        const resonanceState = Juce.getSliderState("RESONANCE");
        const resonanceKnob = document.getElementById("resonance-knob");
        const resonanceIndicator = document.getElementById("resonance-indicator");
        const resonanceValue = document.getElementById("resonance-value");

        let resonanceDragging = false;
        resonanceKnob.addEventListener('mousedown', () => resonanceDragging = true);
        document.addEventListener('mouseup', () => resonanceDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (resonanceDragging) {
                const currentValue = resonanceState.getNormalisedValue();
                const newValue = Math.max(0, Math.min(1, currentValue - e.movementY * 0.005));
                resonanceState.setNormalisedValue(newValue);
            }
        });

        resonanceState.valueChangedEvent.addListener((newValue) => {
            updateKnobIndicator(resonanceIndicator, newValue);
            resonanceValue.textContent = Math.round(newValue * 100) + "%";
        });

        updateKnobIndicator(resonanceIndicator, resonanceState.getNormalisedValue());
        resonanceValue.textContent = Math.round(resonanceState.getNormalisedValue() * 100) + "%";

        // VEL_CURVE
        const velCurveState = Juce.getSliderState("VEL_CURVE");
        const velocityKnob = document.getElementById("velocity-knob");
        const velocityIndicator = document.getElementById("velocity-indicator");
        const velocityValue = document.getElementById("velocity-value");
        const velocityCurve = document.getElementById("velocity-curve");
        const velocityFill = document.getElementById("velocity-fill");

        function updateVelocityCurve(value) {
            const cpX = 70;
            const cpY = 85 - (70 * (1 - value * 0.8));
            const pathD = `M15,85 Q${cpX},${cpY} 125,15`;
            const fillD = `M15,85 Q${cpX},${cpY} 125,15 L125,85 Z`;
            velocityCurve.setAttribute('d', pathD);
            velocityFill.setAttribute('d', fillD);
        }

        let velocityDragging = false;
        velocityKnob.addEventListener('mousedown', () => velocityDragging = true);
        document.addEventListener('mouseup', () => velocityDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (velocityDragging) {
                const currentValue = velCurveState.getNormalisedValue();
                const newValue = Math.max(0, Math.min(1, currentValue - e.movementY * 0.005));
                velCurveState.setNormalisedValue(newValue);
            }
        });

        velCurveState.valueChangedEvent.addListener((newValue) => {
            updateKnobIndicator(velocityIndicator, newValue);
            velocityValue.textContent = Math.round(newValue * 100) + "%";
            updateVelocityCurve(newValue);
        });

        updateKnobIndicator(velocityIndicator, velCurveState.getNormalisedValue());
        velocityValue.textContent = Math.round(velCurveState.getNormalisedValue() * 100) + "%";
        updateVelocityCurve(velCurveState.getNormalisedValue());

        // OUTPUT_GAIN
        const outputGainState = Juce.getSliderState("OUTPUT_GAIN");
        const outputKnob = document.getElementById("output-knob");
        const outputIndicator = document.getElementById("output-indicator");
        const outputValue = document.getElementById("output-value");

        let outputDragging = false;
        outputKnob.addEventListener('mousedown', () => outputDragging = true);
        document.addEventListener('mouseup', () => outputDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (outputDragging) {
                const currentValue = outputGainState.getNormalisedValue();
                const newValue = Math.max(0, Math.min(1, currentValue - e.movementY * 0.005));
                outputGainState.setNormalisedValue(newValue);
            }
        });

        outputGainState.valueChangedEvent.addListener((newValue) => {
            updateKnobIndicator(outputIndicator, newValue);
            const dbValue = -24.0 + (newValue * 36.0);
            outputValue.textContent = dbValue.toFixed(1) + " dB";
        });

        updateKnobIndicator(outputIndicator, outputGainState.getNormalisedValue());
        const dbValue = -24.0 + (outputGainState.getNormalisedValue() * 36.0);
        outputValue.textContent = dbValue.toFixed(1) + " dB";

        // TUNING_MODE (Choice parameter - button group)
        const tuningModeState = Juce.getComboBoxState("TUNING_MODE");
        const btn12tet = document.getElementById("btn-12tet");
        const btnScala = document.getElementById("btn-scala");
        const btnMts = document.getElementById("btn-mts");
        const scaleName = document.getElementById("scale-name");

        function updateTuningModeUI(normalizedValue) {
            const index = Math.round(normalizedValue * 2);
            btn12tet.classList.toggle('active', index === 0);
            btnScala.classList.toggle('active', index === 1);
            btnMts.classList.toggle('active', index === 2);

            if (index === 0) scaleName.textContent = "12-TET Standard";
            else if (index === 1) scaleName.textContent = "No scale loaded";
            else if (index === 2) scaleName.textContent = "Waiting for MTS-ESP...";
        }

        btn12tet.addEventListener('click', () => tuningModeState.setNormalisedValue(0.0));
        btnScala.addEventListener('click', () => tuningModeState.setNormalisedValue(0.5));
        btnMts.addEventListener('click', () => tuningModeState.setNormalisedValue(1.0));

        tuningModeState.valueChangedEvent.addListener(updateTuningModeUI);
        updateTuningModeUI(tuningModeState.getNormalisedValue());

        // REFERENCE_PITCH
        const refPitchState = Juce.getSliderState("REFERENCE_PITCH");
        const refPitchKnob = document.getElementById("ref-pitch-knob");
        const refPitchIndicator = document.getElementById("ref-pitch-indicator");
        const refPitchValue = document.getElementById("ref-pitch-value");

        let refPitchDragging = false;
        refPitchKnob.addEventListener('mousedown', () => refPitchDragging = true);
        document.addEventListener('mouseup', () => refPitchDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (refPitchDragging) {
                const currentValue = refPitchState.getNormalisedValue();
                const newValue = Math.max(0, Math.min(1, currentValue - e.movementY * 0.005));
                refPitchState.setNormalisedValue(newValue);
            }
        });

        refPitchState.valueChangedEvent.addListener((newValue) => {
            updateKnobIndicator(refPitchIndicator, newValue);
            const hzValue = 400.0 + (newValue * 80.0);
            refPitchValue.textContent = hzValue.toFixed(1) + " Hz";
        });

        updateKnobIndicator(refPitchIndicator, refPitchState.getNormalisedValue());
        const hzValue = 400.0 + (refPitchState.getNormalisedValue() * 80.0);
        refPitchValue.textContent = hzValue.toFixed(1) + " Hz";

        console.log("Ouaricon Marimba UI initialized");
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O-Detune</title>
    <script type="module" src="/js/juce/index.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2a2a2a;
            font-family: 'Garamond', 'Times New Roman', serif;
        }

        /* Ouaricon Naturalist Color System */
        :root {
            --bg-paper: #F5E6D3;
            --bg-paper-mid: #EBD9C7;
            --bg-accent: #D4C4B0;
            --brown-border: #8B7355;
            --brown-frame: #5C4033;
            --brown-text: #3C2F2F;
            --brown-medium: #5C4033;
            --green-light: #8BA870;
            --green-mid: #6B8E4E;
            --green-dark: #3C5C1A;
            --green-darkest: #2C3E10;
            --knob-ring: #C9A27B;
            --knob-segment-1: #F5DEB3;
            --knob-segment-2: #E8D5B7;
            --knob-core: #FFF8DC;
        }

        .plugin-container {
            width: 600px;
            height: 400px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 3px solid var(--brown-frame);
            overflow: hidden;
        }

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .botanical-overlay {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            height: 85%;
            opacity: 0.35;
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        /* Title Row */
        .title-row {
            text-align: center;
            margin-bottom: 10px;
        }

        .title {
            font-size: 24px;
            color: var(--brown-text);
            letter-spacing: 4px;
            font-weight: normal;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        /* Section Layout */
        .main-section {
            display: flex;
            gap: 15px;
            flex: 1;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .right-panel {
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Engine Panels */
        .engine-row {
            display: flex;
            gap: 12px;
        }

        .engine-panel {
            flex: 1;
            background: rgba(245, 230, 211, 0.6);
            border: 2px solid var(--brown-border);
            border-radius: 6px;
            padding: 10px;
        }

        .panel-label {
            font-size: 11px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--brown-medium);
            margin-bottom: 8px;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.5);
        }

        .engine-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Blend Section */
        .blend-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            min-width: 80px;
        }

        .blend-label {
            font-size: 9px;
            color: var(--brown-medium);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        /* Botanical Seed Knob */
        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .knob {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            position: relative;
            cursor: grab;
            border: 2px solid var(--brown-border);
            background:
                radial-gradient(circle, transparent 85%, var(--knob-ring) 85%, var(--knob-ring) 92%, var(--brown-border) 92%, var(--brown-border) 94%, transparent 94%),
                conic-gradient(from 0deg,
                    var(--knob-segment-1) 0deg, var(--knob-segment-1) 17deg,
                    var(--brown-border) 17deg, var(--brown-border) 18deg,
                    var(--knob-segment-2) 18deg, var(--knob-segment-2) 35deg,
                    var(--brown-border) 35deg, var(--brown-border) 36deg,
                    var(--knob-segment-1) 36deg, var(--knob-segment-1) 53deg,
                    var(--brown-border) 53deg, var(--brown-border) 54deg,
                    var(--knob-segment-2) 54deg, var(--knob-segment-2) 71deg,
                    var(--brown-border) 71deg, var(--brown-border) 72deg,
                    var(--knob-segment-1) 72deg, var(--knob-segment-1) 89deg,
                    var(--brown-border) 89deg, var(--brown-border) 90deg,
                    var(--knob-segment-2) 90deg, var(--knob-segment-2) 107deg,
                    var(--brown-border) 107deg, var(--brown-border) 108deg,
                    var(--knob-segment-1) 108deg, var(--knob-segment-1) 125deg,
                    var(--brown-border) 125deg, var(--brown-border) 126deg,
                    var(--knob-segment-2) 126deg, var(--knob-segment-2) 143deg,
                    var(--brown-border) 143deg, var(--brown-border) 144deg,
                    var(--knob-segment-1) 144deg, var(--knob-segment-1) 161deg,
                    var(--brown-border) 161deg, var(--brown-border) 162deg,
                    var(--knob-segment-2) 162deg, var(--knob-segment-2) 179deg,
                    var(--brown-border) 179deg, var(--brown-border) 180deg,
                    var(--knob-segment-1) 180deg, var(--knob-segment-1) 197deg,
                    var(--brown-border) 197deg, var(--brown-border) 198deg,
                    var(--knob-segment-2) 198deg, var(--knob-segment-2) 215deg,
                    var(--brown-border) 215deg, var(--brown-border) 216deg,
                    var(--knob-segment-1) 216deg, var(--knob-segment-1) 233deg,
                    var(--brown-border) 233deg, var(--brown-border) 234deg,
                    var(--knob-segment-2) 234deg, var(--knob-segment-2) 251deg,
                    var(--brown-border) 251deg, var(--brown-border) 252deg,
                    var(--knob-segment-1) 252deg, var(--knob-segment-1) 269deg,
                    var(--brown-border) 269deg, var(--brown-border) 270deg,
                    var(--knob-segment-2) 270deg, var(--knob-segment-2) 287deg,
                    var(--brown-border) 287deg, var(--brown-border) 288deg,
                    var(--knob-segment-1) 288deg, var(--knob-segment-1) 305deg,
                    var(--brown-border) 305deg, var(--brown-border) 306deg,
                    var(--knob-segment-2) 306deg, var(--knob-segment-2) 323deg,
                    var(--brown-border) 323deg, var(--brown-border) 324deg,
                    var(--knob-segment-1) 324deg, var(--knob-segment-1) 341deg,
                    var(--brown-border) 341deg, var(--brown-border) 342deg,
                    var(--knob-segment-2) 342deg, var(--knob-segment-2) 359deg,
                    var(--brown-border) 359deg, var(--brown-border) 360deg
                ),
                radial-gradient(circle, var(--knob-core) 0%, var(--knob-core) 18%, transparent 18%);
            box-shadow:
                inset 1px 1px 3px rgba(0,0,0,0.25),
                inset -1px -1px 2px rgba(255,248,220,0.4),
                2px 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .knob.large {
            width: 60px;
            height: 60px;
        }

        .knob:hover {
            transform: scale(1.05);
        }

        .knob:active {
            cursor: grabbing;
            transform: scale(0.98);
        }

        .knob-indicator {
            position: absolute;
            width: 3px;
            height: 14px;
            background: var(--green-mid);
            border-radius: 1.5px;
            left: 50%;
            top: 5px;
            transform-origin: center 19px;
            transform: translateX(-50%) rotate(0deg);
            box-shadow: 0 0 2px rgba(0,0,0,0.3);
        }

        .knob.large .knob-indicator {
            height: 18px;
            transform-origin: center 25px;
            top: 6px;
        }

        .knob-label {
            font-size: 9px;
            color: var(--brown-medium);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .knob-value {
            font-size: 10px;
            color: var(--brown-text);
            font-weight: normal;
        }

        /* Dropdown */
        .dropdown-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .dropdown-label {
            font-size: 9px;
            color: var(--brown-medium);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dropdown {
            background: rgba(255, 248, 220, 0.7);
            border: 2px solid var(--brown-border);
            border-radius: 4px;
            padding: 5px 8px;
            color: var(--brown-text);
            font-size: 11px;
            font-family: 'Garamond', serif;
            cursor: pointer;
            outline: none;
        }

        .dropdown:hover {
            border-color: var(--green-mid);
        }

        /* Character Panel */
        .character-panel {
            background: rgba(245, 230, 211, 0.6);
            border: 2px solid var(--brown-border);
            border-radius: 6px;
            padding: 10px;
        }

        .character-row {
            display: flex;
            justify-content: space-around;
        }

        /* Output Panel */
        .output-panel {
            background: rgba(245, 230, 211, 0.6);
            border: 2px solid var(--brown-border);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .output-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Toggle Button (Botanical Style) */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle {
            width: 36px;
            height: 18px;
            background: rgba(139, 168, 112, 0.3);
            border: 2px solid var(--green-dark);
            border-radius: 9px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle.active {
            background: rgba(107, 142, 35, 0.6);
        }

        .toggle-knob {
            width: 12px;
            height: 12px;
            background: var(--knob-core);
            border: 1px solid var(--brown-border);
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: left 0.2s;
        }

        .toggle.active .toggle-knob {
            left: 19px;
        }

        .toggle-label {
            font-size: 9px;
            color: var(--brown-medium);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Mix Section */
        .mix-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background: rgba(245, 230, 211, 0.6);
            border: 2px solid var(--brown-border);
            border-radius: 6px;
        }

        /* Advanced Panel */
        .advanced-panel {
            background: rgba(245, 230, 211, 0.5);
            border: 2px solid var(--brown-border);
            border-radius: 6px;
            padding: 8px 10px;
        }

        .advanced-header {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 2px 0;
        }

        .advanced-header:hover .panel-label {
            color: var(--green-mid);
        }

        .advanced-arrow {
            font-size: 10px;
            color: var(--brown-medium);
            transition: transform 0.2s;
        }

        .advanced-arrow.open {
            transform: rotate(90deg);
        }

        .advanced-content {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--brown-border);
        }

        .advanced-content.open {
            display: flex;
            gap: 12px;
            justify-content: space-around;
        }

        /* Slider */
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .slider-label {
            font-size: 9px;
            color: var(--brown-medium);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(212, 196, 176, 0.8);
            border: 1px solid var(--brown-border);
            border-radius: 3px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--knob-segment-1);
            border: 2px solid var(--brown-border);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        /* Fleuron decoration */
        .fleuron {
            position: absolute;
            font-size: 12px;
            color: rgba(60, 47, 47, 0.2);
            pointer-events: none;
        }

        .fleuron.top-left {
            top: 8px;
            left: 12px;
        }

        .fleuron.top-right {
            top: 8px;
            right: 12px;
        }
    </style>
</head>
<body>
    <div class="plugin-container">
        <img src="/img/paper_background.jpg" class="background" alt="">
        <img src="/img/slug.png" class="botanical-overlay" alt="">

        <span class="fleuron top-left">❦</span>
        <span class="fleuron top-right">❦</span>

        <div class="content">
            <!-- Title -->
            <div class="title-row">
                <div class="title">O-Detune</div>
            </div>

            <!-- Main Section -->
            <div class="main-section">
                <!-- Left Panel -->
                <div class="left-panel">
                    <!-- Engine Row -->
                    <div class="engine-row">
                        <!-- Wobble Engine -->
                        <div class="engine-panel">
                            <div class="panel-label">Wobble</div>
                            <div class="engine-controls">
                                <div class="dropdown-container">
                                    <span class="dropdown-label">Era</span>
                                    <select class="dropdown" id="wobble_era">
                                        <option value="0">60s</option>
                                        <option value="1" selected>70s</option>
                                        <option value="2">80s</option>
                                    </select>
                                </div>
                                <div class="dropdown-container">
                                    <span class="dropdown-label">Shape</span>
                                    <select class="dropdown" id="wobble_shape">
                                        <option value="0" selected>Sine</option>
                                        <option value="1">Triangle</option>
                                        <option value="2">Random</option>
                                    </select>
                                </div>
                                <div class="knob-container">
                                    <div class="knob" id="wobble_rate">
                                        <div class="knob-indicator"></div>
                                    </div>
                                    <span class="knob-label">Rate</span>
                                    <span class="knob-value" id="wobble_rate_value">2.0 Hz</span>
                                </div>
                                <div class="knob-container">
                                    <div class="knob" id="wobble_depth">
                                        <div class="knob-indicator"></div>
                                    </div>
                                    <span class="knob-label">Depth</span>
                                    <span class="knob-value" id="wobble_depth_value">25 ct</span>
                                </div>
                            </div>
                        </div>

                        <!-- Blend -->
                        <div class="blend-section">
                            <span class="blend-label">Blend</span>
                            <div class="knob-container">
                                <div class="knob large" id="blend">
                                    <div class="knob-indicator"></div>
                                </div>
                                <span class="knob-value" id="blend_value">50%</span>
                            </div>
                        </div>

                        <!-- Unison Engine -->
                        <div class="engine-panel">
                            <div class="panel-label">Unison</div>
                            <div class="engine-controls">
                                <div class="dropdown-container">
                                    <span class="dropdown-label">Voices</span>
                                    <select class="dropdown" id="unison_voices">
                                        <option value="0">2</option>
                                        <option value="1" selected>3</option>
                                        <option value="2">4</option>
                                        <option value="3">5</option>
                                        <option value="4">7</option>
                                    </select>
                                </div>
                                <div class="dropdown-container">
                                    <span class="dropdown-label">Dist</span>
                                    <select class="dropdown" id="unison_dist">
                                        <option value="0" selected>Linear</option>
                                        <option value="1">Exp</option>
                                        <option value="2">Random</option>
                                    </select>
                                </div>
                                <div class="knob-container">
                                    <div class="knob" id="unison_detune">
                                        <div class="knob-indicator"></div>
                                    </div>
                                    <span class="knob-label">Detune</span>
                                    <span class="knob-value" id="unison_detune_value">15 ct</span>
                                </div>
                                <div class="knob-container">
                                    <div class="knob" id="unison_spread">
                                        <div class="knob-indicator"></div>
                                    </div>
                                    <span class="knob-label">Spread</span>
                                    <span class="knob-value" id="unison_spread_value">75%</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Character Panel -->
                    <div class="character-panel">
                        <div class="panel-label">Character</div>
                        <div class="character-row">
                            <div class="knob-container">
                                <div class="knob" id="drive">
                                    <div class="knob-indicator"></div>
                                </div>
                                <span class="knob-label">Drive</span>
                                <span class="knob-value" id="drive_value">20%</span>
                            </div>
                            <div class="knob-container">
                                <div class="knob" id="color">
                                    <div class="knob-indicator"></div>
                                </div>
                                <span class="knob-label">Color</span>
                                <span class="knob-value" id="color_value">0</span>
                            </div>
                            <div class="knob-container">
                                <div class="knob" id="age">
                                    <div class="knob-indicator"></div>
                                </div>
                                <span class="knob-label">Age</span>
                                <span class="knob-value" id="age_value">0%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Output Panel -->
                    <div class="output-panel">
                        <div class="output-row">
                            <div class="slider-container">
                                <span class="slider-label">Width: <span id="width_value">100%</span></span>
                                <input type="range" class="slider" id="width" min="0" max="200" value="100">
                            </div>
                            <div class="toggle-container">
                                <div class="toggle active" id="mono_safe">
                                    <div class="toggle-knob"></div>
                                </div>
                                <span class="toggle-label">Mono-Safe</span>
                            </div>
                        </div>
                    </div>

                    <!-- Advanced Panel -->
                    <div class="advanced-panel">
                        <div class="advanced-header" onclick="toggleAdvanced()">
                            <span class="advanced-arrow" id="advancedArrow">▶</span>
                            <span class="panel-label" style="margin: 0;">Advanced</span>
                        </div>
                        <div class="advanced-content" id="advancedContent">
                            <div class="knob-container">
                                <div class="knob" id="delay">
                                    <div class="knob-indicator"></div>
                                </div>
                                <span class="knob-label">Pre-Delay</span>
                                <span class="knob-value" id="delay_value">0 ms</span>
                            </div>
                            <div class="knob-container">
                                <div class="knob" id="feedback">
                                    <div class="knob-indicator"></div>
                                </div>
                                <span class="knob-label">Feedback</span>
                                <span class="knob-value" id="feedback_value">0%</span>
                            </div>
                            <div class="knob-container">
                                <div class="knob" id="random_amt">
                                    <div class="knob-indicator"></div>
                                </div>
                                <span class="knob-label">Random</span>
                                <span class="knob-value" id="random_amt_value">15%</span>
                            </div>
                            <div class="toggle-container" style="flex-direction: column; align-items: center;">
                                <div class="toggle" id="wobble_sync">
                                    <div class="toggle-knob"></div>
                                </div>
                                <span class="toggle-label">Sync</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Panel (Mix) -->
                <div class="right-panel">
                    <div class="mix-section" style="flex: 1;">
                        <span class="panel-label">Output</span>
                        <div class="knob-container" style="margin-top: auto; margin-bottom: auto;">
                            <div class="knob large" id="mix">
                                <div class="knob-indicator"></div>
                            </div>
                            <span class="knob-label">Mix</span>
                            <span class="knob-value" id="mix_value">50%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as Juce from '/js/juce/index.js';

        // Wait for JUCE native integration
        await Juce.__juce__.initialise();

        // Get slider states from JUCE
        const sliderStates = {
            blend: Juce.getSliderState('blend'),
            wobble_rate: Juce.getSliderState('wobble_rate'),
            wobble_depth: Juce.getSliderState('wobble_depth'),
            unison_detune: Juce.getSliderState('unison_detune'),
            unison_spread: Juce.getSliderState('unison_spread'),
            drive: Juce.getSliderState('drive'),
            color: Juce.getSliderState('color'),
            age: Juce.getSliderState('age'),
            width: Juce.getSliderState('width'),
            mix: Juce.getSliderState('mix'),
            focus_low: Juce.getSliderState('focus_low'),
            focus_high: Juce.getSliderState('focus_high'),
            delay: Juce.getSliderState('delay'),
            feedback: Juce.getSliderState('feedback'),
            random_amt: Juce.getSliderState('random_amt')
        };

        // Get combobox states
        const comboStates = {
            wobble_era: Juce.getComboBoxState('wobble_era'),
            wobble_shape: Juce.getComboBoxState('wobble_shape'),
            unison_voices: Juce.getComboBoxState('unison_voices'),
            unison_dist: Juce.getComboBoxState('unison_dist')
        };

        // Get toggle states
        const toggleStates = {
            wobble_sync: Juce.getToggleState('wobble_sync'),
            mono_safe: Juce.getToggleState('mono_safe')
        };

        // Value formatters
        const formatters = {
            blend: v => Math.round(v * 100) + '%',
            wobble_rate: v => v.toFixed(1) + ' Hz',
            wobble_depth: v => Math.round(v) + ' ct',
            unison_detune: v => Math.round(v) + ' ct',
            unison_spread: v => Math.round(v) + '%',
            drive: v => Math.round(v) + '%',
            color: v => Math.round(v),
            age: v => Math.round(v) + '%',
            width: v => Math.round(v) + '%',
            mix: v => Math.round(v) + '%',
            focus_low: v => Math.round(v) + ' Hz',
            focus_high: v => (v / 1000).toFixed(1) + ' kHz',
            delay: v => Math.round(v) + ' ms',
            feedback: v => Math.round(v) + '%',
            random_amt: v => Math.round(v) + '%'
        };

        // Setup knobs with robust event handling for WebView
        // Track active drag globally to handle WebView event capture issues
        let activeKnob = null;
        let dragStartY = 0;
        let dragStartValue = 0;

        // Global mouse handlers at window level with capture phase
        window.addEventListener('mousemove', e => {
            if (!activeKnob) return;
            const state = sliderStates[activeKnob.id];
            if (!state) return;
            const delta = (dragStartY - e.clientY) / 200;
            const newValue = Math.max(0, Math.min(1, dragStartValue + delta));
            state.setNormalisedValue(newValue);
            e.preventDefault();
        }, { capture: true });

        window.addEventListener('mouseup', e => {
            if (activeKnob) {
                const state = sliderStates[activeKnob.id];
                if (state) state.sliderDragEnded();
                activeKnob = null;
            }
        }, { capture: true });

        document.querySelectorAll('.knob').forEach(knob => {
            const id = knob.id;
            const state = sliderStates[id];
            if (!state) return;

            const updateVisual = (normalizedValue) => {
                const rotation = -135 + normalizedValue * 270;
                knob.querySelector('.knob-indicator').style.transform =
                    `translateX(-50%) rotate(${rotation}deg)`;

                const valueEl = document.getElementById(id + '_value');
                if (valueEl && formatters[id]) {
                    const props = state.properties;
                    const actualValue = props.start + normalizedValue * (props.end - props.start);
                    valueEl.textContent = formatters[id](actualValue);
                }
            };

            // Listen for value changes from JUCE
            state.valueChangedEvent.addListener(() => {
                updateVisual(state.getNormalisedValue());
            });
            updateVisual(state.getNormalisedValue());

            // Drag interaction - use pointerdown for better WebView compatibility
            knob.addEventListener('pointerdown', e => {
                activeKnob = knob;
                dragStartY = e.clientY;
                dragStartValue = state.getNormalisedValue();
                knob.setPointerCapture(e.pointerId);
                e.preventDefault();
                e.stopPropagation();
            }, { capture: true });

            knob.addEventListener('pointermove', e => {
                if (activeKnob !== knob) return;
                const delta = (dragStartY - e.clientY) / 200;
                const newValue = Math.max(0, Math.min(1, dragStartValue + delta));
                state.setNormalisedValue(newValue);
                e.preventDefault();
            }, { capture: true });

            knob.addEventListener('pointerup', e => {
                if (activeKnob === knob) {
                    state.sliderDragEnded();
                    activeKnob = null;
                }
            }, { capture: true });

            knob.addEventListener('pointercancel', e => {
                if (activeKnob === knob) {
                    state.sliderDragEnded();
                    activeKnob = null;
                }
            }, { capture: true });
        });

        // Setup width slider
        const widthSlider = document.getElementById('width');
        const widthState = sliderStates.width;
        if (widthSlider && widthState) {
            widthState.valueChangedEvent.addListener(() => {
                const props = widthState.properties;
                const value = props.start + widthState.getNormalisedValue() * (props.end - props.start);
                widthSlider.value = value;
                document.getElementById('width_value').textContent = Math.round(value) + '%';
            });

            widthSlider.addEventListener('input', e => {
                const props = widthState.properties;
                const norm = (parseFloat(e.target.value) - props.start) / (props.end - props.start);
                widthState.setNormalisedValue(norm);
            });

            // Initial value
            const props = widthState.properties;
            const value = props.start + widthState.getNormalisedValue() * (props.end - props.start);
            widthSlider.value = value;
            document.getElementById('width_value').textContent = Math.round(value) + '%';
        }

        // Setup dropdowns
        Object.entries(comboStates).forEach(([id, state]) => {
            const select = document.getElementById(id);
            if (!select || !state) return;

            state.valueChangedEvent.addListener(() => {
                select.value = state.getChoiceIndex();
            });
            select.value = state.getChoiceIndex();

            select.addEventListener('change', e => {
                state.setChoiceIndex(parseInt(e.target.value));
            });
        });

        // Setup toggles with pointer events for WebView compatibility
        Object.entries(toggleStates).forEach(([id, state]) => {
            const toggle = document.getElementById(id);
            if (!toggle || !state) return;

            const updateToggle = () => {
                if (state.getValue()) {
                    toggle.classList.add('active');
                } else {
                    toggle.classList.remove('active');
                }
            };

            state.valueChangedEvent.addListener(updateToggle);
            updateToggle();

            // Use pointerup for more reliable WebView interaction
            toggle.addEventListener('pointerup', e => {
                state.setValue(!state.getValue());
                e.preventDefault();
                e.stopPropagation();
            }, { capture: true });
        });

        // Advanced panel toggle
        window.toggleAdvanced = () => {
            const content = document.getElementById('advancedContent');
            const arrow = document.getElementById('advancedArrow');
            content.classList.toggle('open');
            arrow.classList.toggle('open');
        };
    </script>
</body>
</html>

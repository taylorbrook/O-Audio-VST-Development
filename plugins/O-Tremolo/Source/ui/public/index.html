            // Re-render once the backend pushes the real range/skew (WR-02) so getScaledValue()
            // and the indicator angle are correct even on the initial paint.
            state.propertiesChangedEvent.addListener(() => {
                updateVisual();
            });

            // Speed knob only: repaint when the synced division changes. That value lives on
            // SYNC_DIVISION_PARAM (automation / preset recall / this knob's own drag), not on the
            // Speed slider's own state, so the slider's valueChangedEvent would never fire for it.
            if (isSpeed && syncDivisionState) {
                syncDivisionState.valueChangedEvent.addListener(() => updateVisual());
                syncDivisionState.propertiesChangedEvent.addListener(() => updateVisual());
            }

            // UI → JUCE: Mouse drag (Pattern #16: RELATIVE drag)
            knob.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastY = e.clientY;
                dragAccum = 0;
                state.sliderDragStarted();
                e.preventDefault();
            });

            const PX_PER_DIVISION = 14;  // vertical travel to advance one synced division

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                // Relative drag: frame-delta, not absolute
                const deltaY = lastY - e.clientY;
                lastY = e.clientY;

                if (speedSyncActive() && syncDivisionState) {
                    // Synced (v1.6.0): step through divisions one detent at a time in slow→fast
                    // display order, writing the discrete SYNC_DIVISION_PARAM directly — no Hz math.
                    dragAccum += deltaY;
                    const stepsToMove = Math.trunc(dragAccum / PX_PER_DIVISION);
                    if (stepsToMove !== 0) {
                        dragAccum -= stepsToMove * PX_PER_DIVISION;
                        const n = syncDivisionOrder.length;
                        const curPos = syncDivisionPosByChoice[syncDivisionState.getChoiceIndex()] ?? 0;
                        const pos = Math.max(0, Math.min(n - 1, curPos + stepsToMove));
                        syncDivisionState.setChoiceIndex(syncDivisionOrder[pos].choiceIndex);
                    }
                    return;
                }

                // Continuous drag
                const currentNorm = state.getNormalisedValue();
                const sensitivity = 0.005;
                const newNorm = Math.max(0, Math.min(1, currentNorm + (deltaY * sensitivity)));
                state.setNormalisedValue(newNorm);
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    state.sliderDragEnded();
                    isDragging = false;
                }
            });

            // Initial update
            updateVisual();
        }

        // Toggle button setup with JUCE binding (Pattern #19: Use getToggleState)
        function setupToggle(buttonId, state) {
            if (!state) {
                console.error(`Failed to get toggle state for ${buttonId}`);
                return;
            }

            const button = document.getElementById(buttonId);

            // Update visual from state
            function updateVisual() {
                const isActive = state.getValue();
                if (isActive) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }

                // If this is the Tempo Sync button, re-snap the Speed knob (indicator + readout)
                // via its own updater — single source of truth — so it flips between the discrete
                // division stepper (synced) and continuous Hz (free) the instant sync toggles.
                if (buttonId === 'tempoButton' && updateSpeedVisual) {
                    updateSpeedVisual();
                }
            }

            // JUCE → UI: Listen for parameter changes
            state.valueChangedEvent.addListener(() => {
                updateVisual();
            });

            // UI → JUCE: Click handler
            button.addEventListener('click', () => {
                const currentValue = state.getValue();
                state.setValue(!currentValue);
            });

            // Initial update
            updateVisual();
        }

        // Waveform selector setup
        function setupWaveformSelector() {
            if (!waveformState) {
                console.error('Failed to get waveform state');
                return;
            }

            const selector = document.getElementById('waveformSelect');

            // IN-05: divisor derived from the option count, not a hardcoded 5, so the
            // normalized↔index mapping stays correct if a waveform is ever added/removed.
            const maxIndex = WAVEFORM_NAMES.length - 1;

            // Update visual from state
            function updateVisual() {
                const normValue = waveformState.getNormalisedValue();
                const index = Math.round(normValue * maxIndex);
                selector.value = index.toString();
                drawWaveform();
            }

            // JUCE → UI
            waveformState.valueChangedEvent.addListener(() => {
                updateVisual();
            });

            // UI → JUCE
            selector.addEventListener('change', () => {
                const index = parseInt(selector.value);
                const normValue = maxIndex > 0 ? index / maxIndex : 0;
                waveformState.setNormalisedValue(normValue);
            });

            // Initial update
            updateVisual();
        }

        // Smoothing slider setup
        function setupSmoothingSlider() {
            if (!smoothingState) {
                console.error('Failed to get smoothing state');
                return;
            }

            const slider = document.getElementById('smoothingSlider');

            // Update visual from state
            function updateVisual() {
                const normValue = smoothingState.getNormalisedValue();
                const realValue = normValue * 100; // 0-100%
                slider.value = realValue;
                drawWaveform();
            }

            // JUCE → UI
            smoothingState.valueChangedEvent.addListener(() => {
                updateVisual();
            });

            // UI → JUCE
            slider.addEventListener('input', () => {
                const realValue = parseFloat(slider.value);
                const normValue = realValue / 100;
                smoothingState.setNormalisedValue(normValue);
            });

            // Initial update
            updateVisual();
        }

        // Canvas initialization
        let canvas, ctx;
        function initCanvas() {
            canvas = document.getElementById('waveformCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            ctx.scale(2, 2);
            drawWaveform();
        }

        // Waveform visualization

        function drawWaveform() {
            if (!canvas || !ctx || !waveformState || !smoothingState || !depthState) return;

            // IN-03: reset the visualizer smoothing state per redraw so the first sample
            // doesn't smooth against the previous draw's trailing value.
            let smoothedY = 0;

            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            const centerY = height / 2;

            // Scale amplitude by depth (0-100% depth → 0-1 multiplier)
            const depthMultiplier = depthState.getNormalisedValue();
            const amplitude = (height / 2) * 0.8 * depthMultiplier;

            // IN-05: derive index from the shared waveform list length, not a hardcoded 5.
            const waveformIndex = Math.round(waveformState.getNormalisedValue() * (WAVEFORM_NAMES.length - 1));
            const smoothing = smoothingState.getNormalisedValue();

            ctx.clearRect(0, 0, width, height);

            // Grid lines
            ctx.strokeStyle = 'rgba(92, 64, 51, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, (height / 4) * i);
                ctx.lineTo(width, (height / 4) * i);
                ctx.stroke();
            }

            // Waveform
            ctx.strokeStyle = '#5C4033';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const waveform = WAVEFORM_NAMES[waveformIndex] || 'sine';

            // Helper function for smooth transitions (matches C++ smoothTransition)
            function smoothTransition(t) {
                return t * t * (3.0 - 2.0 * t);
            }

            // Sample-and-hold noise storage
            let noiseValues = [];
            if (waveform === 'noise') {
                // Generate 4 random values for the 4 quarters
                for (let i = 0; i < 4; i++) {
                    noiseValues.push(Math.random() * 2 - 1);
                }
            }

            for (let x = 0; x < width; x++) {
                const t = x / width;
                let y;

                switch(waveform) {
                    case 'sine':
                        y = Math.sin(t * Math.PI * 4);
                        break;

                    case 'triangle':
                        y = Math.abs((t * 4) % 2 - 1) * 2 - 1;
                        break;

                    case 'phasor': {
                        // Sawtooth with smooth reset
                        const phase = (t * 4) % 1;
                        const transitionWidth = 0.02;
                        if (phase < transitionWidth) {
                            const tt = phase / transitionWidth;
                            const smoothed = smoothTransition(tt);
                            y = -1.0 + smoothed * (phase * 2.0 + 1.0);
                        } else {
                            y = phase * 2 - 1;
                        }
                        break;
                    }

                    case 'noise': {
                        // Sample-and-hold: 4 samples per cycle
                        const quarter = Math.floor(t * 4) % 4;
                        y = noiseValues[quarter];
                        break;
                    }

                    case 'square': {
                        const phase = (t * 4) % 1;
                        const transitionWidth = 0.02;
                        if (phase < 0.5) {
                            if (phase < transitionWidth) {
                                const tt = phase / transitionWidth;
                                y = -1 + smoothTransition(tt) * 2;
                            } else {
                                y = 1;
                            }
                        } else {
                            if (phase < 0.5 + transitionWidth) {
                                const tt = (phase - 0.5) / transitionWidth;
                                y = 1 - smoothTransition(tt) * 2;
                            } else {
                                y = -1;
                            }
                        }
                        break;
                    }

                    case 'pulse': {
                        const phase = (t * 4) % 1;
                        const dutyCycle = 0.2;
                        const transitionWidth = 0.02;
                        if (phase < dutyCycle) {
                            if (phase < transitionWidth) {
                                const tt = phase / transitionWidth;
                                y = -1 + smoothTransition(tt) * 2;
                            } else {
                                y = 1;
                            }
                        } else {
                            if (phase < dutyCycle + transitionWidth) {
                                const tt = (phase - dutyCycle) / transitionWidth;
                                y = 1 - smoothTransition(tt) * 2;
                            } else {
                                y = -1;
                            }
                        }
                        break;
                    }
                }

                if (smoothing > 0 && x > 0) {
                    y = smoothedY + (y - smoothedY) * (1 - smoothing * 0.9);
                }
                smoothedY = y;

                const plotY = centerY - (y * amplitude);
                x === 0 ? ctx.moveTo(x, plotY) : ctx.lineTo(x, plotY);
            }

            ctx.stroke();
        }
    </script>
</body>
</html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ouaricon Digital Delay</title>

  <style>
    /* ============================================
       WEBVIEW CONSTRAINTS (CRITICAL)
       ============================================ */
    html, body {
      height: 100%;  /* REQUIRED - replaces viewport units */
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* ============================================
       NATIVE APPLICATION FEEL
       ============================================ */
    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============================================
       CONTAINER
       ============================================ */
    .container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #F5E6D3;
      font-family: Garamond, 'Times New Roman', serif;
      overflow: hidden;
    }

    /* ============================================
       BACKGROUND LAYER (Paper texture)
       ============================================ */
    .paper-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 700px;
      height: 196px;
      background-image: url('img/paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* ============================================
       BUTTERFLY OVERLAY (NATURAL SIZE - 800×1280px)
       ============================================ */
    .butterfly-overlay {
      position: absolute;
      left: calc(50% - 400px);
      top: -520px;
      width: 800px;
      height: 1280px;
      background-image: url('img/butterfly2_bw.png');
      background-size: 800px 1280px;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.30;
      z-index: 1;
      pointer-events: none;
    }

    /* ============================================
       BUTTERFLY FEEDBACK ECHOES
       ============================================ */
    .butterfly-echo {
      position: absolute;
      left: calc(50% - 400px);
      width: 800px;
      height: 1280px;
      background-image: url('img/butterfly2_bw.png');
      background-size: 800px 1280px;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ============================================
       HEADER ROW (Title + Preset Bar)
       ============================================ */
    .header {
      position: absolute;
      top: 8px;
      left: 16px;
      right: 66px; /* 50px extra margin to avoid output meter label */
      height: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .title {
      font-size: 16px;
      letter-spacing: 2.5px;
      color: #3C2F2F;
      font-weight: normal;
      white-space: nowrap;
    }

    /* ============================================
       PRESET BAR
       ============================================ */
    .preset-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 168, 112, 0.25);
      border: 2px solid #5C4033;
      border-radius: 4px;
      padding: 3px 6px;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.15);
      position: relative;
    }

    .preset-nav-btn {
      width: 20px;
      height: 20px;
      background: rgba(107, 142, 35, 0.4);
      border: 1px solid #3C5C1A;
      border-radius: 3px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 12px;
      font-weight: bold;
      color: #2C3E10;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .preset-nav-btn:hover {
      background: rgba(107, 142, 35, 0.6);
      transform: scale(1.05);
    }

    .preset-name {
      min-width: 80px;
      max-width: 120px;
      text-align: center;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 11px;
      color: #3C2F2F;
      padding: 2px 6px;
      background: rgba(255, 248, 220, 0.5);
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preset-name:hover {
      background: rgba(255, 248, 220, 0.8);
    }

    /* WIDTH IS PINNED (v1.3.0), and this pin is LOAD-BEARING rather than
       decorative — its negative control fires. .preset-bar is a shrink-to-fit
       flex row inside a space-between header, flush against the header's right
       edge, so an unpinned button that grows in French drags the WHOLE row left
       and takes #prevPreset, #presetName and #nextPreset with it. None of those
       three is a [data-i18n] element, so check-ui-labels assertion 7 reports
       them as moved rectangles. Removing this line alone reproduces exactly
       that, at dx = -34.20 for the pair.

       62 px, border-box — 2 px border and 12 px padding leave a 48 px content
       box, which holds both captions in both languages:
           Load 27.00 -> CHARGER 46.52   1.48 px spare
           Save 24.34 -> SAUVER  39.02   8.98 px spare
       A pinned width makes the row's geometry language-invariant BY
       CONSTRUCTION, which is the same move the settings popover below makes for
       the same reason. 62 is also O-Chorus's number, so the suite's preset bar
       is one shape rather than two.

       It does move ENGLISH: the two buttons widen by 21.00 and 23.66 px, so the
       preset cluster starts 44.66 px further left in a header that has 115.47 px
       of empty middle between the title and the bar. Pinning to the English box
       instead would clip — the shortest defensible French for "Load" needs a
       51.52 px box against Load's 41.00 — so there is no value that holds French
       and leaves English alone. */
    .preset-action-btn {
      padding: 2px 6px;
      width: 62px;
      background: rgba(107, 142, 35, 0.3);
      border: 1px solid #3C5C1A;
      border-radius: 3px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #2C3E10;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-action-btn:hover {
      background: rgba(107, 142, 35, 0.5);
    }

    /* Preset Dropdown Menu */
    .preset-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: rgba(255, 248, 220, 0.98);
      border: 2px solid #5C4033;
      border-radius: 4px;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.4);
      max-height: 180px;
      overflow-y: auto;
      z-index: 9999; /* Must be above all controls */
    }

    .preset-dropdown.show {
      display: block;
    }

    /* Elevate entire header when dropdown is open (escapes stacking context) */
    .header:has(.preset-dropdown.show) {
      z-index: 9999;
    }

    .preset-dropdown-header {
      padding: 3px 6px;
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8B7355;
      background: rgba(139, 115, 85, 0.1);
      border-bottom: 1px solid rgba(92, 64, 51, 0.2);
    }

    .preset-dropdown-item {
      padding: 4px 8px;
      font-size: 10px;
      color: #3C2F2F;
      cursor: pointer;
      border-bottom: 1px solid rgba(92, 64, 51, 0.1);
      transition: background 0.15s;
    }

    .preset-dropdown-item:hover {
      background: rgba(139, 168, 112, 0.3);
    }

    .preset-dropdown-item.active {
      background: rgba(107, 142, 35, 0.3);
      font-weight: bold;
    }

    .preset-dropdown-item.factory {
      font-style: italic;
    }

    /* ============================================
       CONTROLS CONTAINER
       ============================================ */
    .controls-row {
      position: absolute;
      top: 50px;
      left: 20px;
      width: 615px;
      height: 130px;
      z-index: 2;
    }

    /* ============================================
       KNOB STYLES (SVG Vine-Arc)
       ============================================ */
    .knob-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .knob-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
      width: 60px;
    }

    .knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .knob-visual {
      width: 60px;
      height: 60px;
      position: relative;
    }

    .knob-visual svg {
      width: 100%;
      height: 100%;
      transform: rotate(-135deg);
    }

    .knob-track {
      fill: none;
      stroke: rgba(139, 115, 85, 0.3);
      stroke-width: 2;
    }

    .knob-vine {
      fill: none;
      stroke: #5a7a6a;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .knob-value {
      font-size: 11px;
      color: #3C2F2F;
      margin-top: 4px;
      min-width: 60px;
      text-align: center;
    }

    /* ============================================
       TOGGLE BUTTON (SYNC)
       ============================================ */
    .toggle-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toggle-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
    }

    .toggle {
      width: 50px;
      height: 24px;
      border: 2px solid #3C5C1A;
      border-radius: 4px;
      background: rgba(139, 168, 112, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      cursor: pointer;
      transition: background 100ms;
    }

    .toggle.active {
      background: rgba(107, 142, 35, 0.6);
    }

    /* ============================================
       LED METER (OuariconComp style)
       ============================================ */
    /* WIDENED 18 -> 38 px, AND SHIFTED LEFT 645 -> 635 (v1.3.0). This is the
       page's one LAYOUT CHANGE, and French is not the reason for it.

       .led-meter-label below was `width: 18px`, matching the meter under it,
       and the ENGLISH word "OUT" renders 20.91 px — 2.91 px outside its own
       content box in every build since v1.0.0. Keying the node is what made
       that visible: check-ui-labels assertion 4 measures a leaf label's text
       against its content box and fails at 20.91 > 18 in ENGLISH, before any
       French exists. No French string could have avoided it either: SORTIE
       35.77, SORT. 28.05 and even SOR 19.92 are all wider than 18 px.

       The container is widened by 20 and moved left by 10, so the 18 px
       .led-meter — which is centred in it by align-items: center — stays on the
       identical absolute x = 645 it has always had. The METER DOES NOT MOVE;
       only the caption's own box does, and it does so identically in both
       languages. 38 px holds SORTIE with 2.23 px spare and repairs the English
       overhang in the same edit. */
    .led-meter-container {
      position: absolute;
      top: 25px;
      left: 635px;
      width: 38px;
      height: 155px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .led-meter-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
      width: 38px;   /* was 18px — see the container note above */
    }

    .led-meter {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      background: rgba(139, 115, 85, 0.1);
      border: 1px solid #8B7355;
      padding: 4px;
      border-radius: 2px;
      width: 18px;
      height: 140px;
    }

    .led-segment {
      width: 100%;
      height: 10px;
      background: #8B7355;
      border-radius: 1px;
      transition: background 100ms, box-shadow 100ms;
    }

    .led-segment.active-low {
      background: #8BA870;
      box-shadow: 0 0 4px #8BA870;
    }

    .led-segment.active-mid {
      background: #6B8E4E;
      box-shadow: 0 0 4px #6B8E4E;
    }

    .led-segment.active-high {
      background: #C9A27B;
      box-shadow: 0 0 4px #C9A27B;
    }

    /* ============================================
       CONTROL POSITIONING
       ============================================ */
    #sync-container {
      top: 4px;
      left: 10px;
    }

    #time-container {
      top: 4px;
      left: 95px;
    }

    #feedback-container {
      top: 4px;
      left: 175px;
    }

    #spread-container {
      top: 4px;
      left: 255px;
    }

    #mod-container {
      top: 4px;
      left: 335px;
    }

    #wet-container {
      top: 4px;
      left: 415px;
    }

    #dry-container {
      top: 4px;
      left: 495px;
    }

    .footer-brand {
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(60, 47, 47, 0.4);
      pointer-events: none;
      z-index: 2;
    }

    .footer-brand .version {
      margin-left: 4px;
      font-size: 8px;
      letter-spacing: 1px;
    }

    /* ============================================
       SETTINGS POPOVER (v1.3.0)
       ============================================
       Styled in THIS page's vocabulary rather than pasted in from another
       plugin: the cream #F5E6D3 fill and the #5C4033 hairline the preset bar
       already uses, the rgba(107,142,35,..) olive the buttons already use,
       Garamond, uppercase, letter-spacing.

       PLACEMENT IS THE BOTTOM-LEFT CORNER, chosen so that NOT ONE existing
       element moves to make room for it — the cluster is position: absolute and
       out of flow. Measured rather than eyeballed: the strip x 0..20 is outside
       .controls-row (left: 20px) entirely, and the only boxes crossing
       x 4..24, y 168..188 are the full-page paper and butterfly layers, both
       pointer-events: none, and .footer-brand, also pointer-events: none and
       whose text is centred 244 px away. */
    .settings-cluster {
      position: absolute;
      left: 6px;
      bottom: 6px;
      z-index: 60;
    }

    .gear-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      background: rgba(107, 142, 35, 0.3);
      border: 1px solid #3C5C1A;
      border-radius: 50%;
      color: #2C3E10;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .gear-btn:hover {
      background: rgba(107, 142, 35, 0.5);
    }

    .gear-btn[aria-expanded="true"] {
      background: rgba(107, 142, 35, 0.6);
    }

    .gear-btn:focus-visible {
      outline: 1px solid #3C5C1A;
      outline-offset: 2px;
    }

    /* Opens UPWARDS. The gear sits 6 px from the BOTTOM of a 196 px frame, so a
       panel below it would leave the frame entirely; upward it occupies
       y 132..166, inside.

       WIDTH IS PINNED, not min-width, and this pin is load-bearing too:
       .settings-popover is not a [data-i18n] element, so assertion 7 measures
       its box in both languages, and French SHRINKS the caption inside it
       (LANGUAGE 55.31 -> LANGUE 41.08). An auto-width panel would therefore
       CONTRACT in French and be reported as moved — the shrink half of the
       problem, which a clip check cannot see at all. A hard width makes the
       panel's rectangle language-invariant by construction. */
    .settings-popover {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      z-index: 61;
      width: 170px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(245, 230, 211, 0.97);
      border: 2px solid #5C4033;
      border-radius: 4px;
      box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.3);
    }

    .settings-popover[hidden] {
      display: none;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* nowrap because the row is space-between: a caption that wrapped would
       grow the row's height and move the control beside it. */
    .settings-label {
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .settings-select {
      flex: 0 0 auto;
      padding: 1px 3px;
      background: rgba(255, 248, 220, 0.5);
      border: 1px solid #3C5C1A;
      border-radius: 2px;
      color: #3C2F2F;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      line-height: 1.2;
      cursor: pointer;
    }

    .settings-select:focus-visible {
      outline: 1px solid #3C5C1A;
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LAYER 0: Paper background -->
    <div class="paper-background"></div>

    <!-- LAYER 1: Butterfly overlay -->
    <div class="butterfly-overlay"></div>

    <!-- LAYER 1b: Butterfly feedback echoes -->
    <div id="butterfly-echoes"></div>

    <!-- LAYER 2+: UI Elements -->
    <div class="header">
      <!-- NOT a [data-i18n] element: a product name is never translated.
           Declared in I18N_EXEMPT with that reason, so a genuinely missed label
           cannot hide here as a deliberate one. -->
      <div class="title">OUARICON DIGITAL DELAY</div>
      <!-- v1.3.0: the five native title= attributes this bar carried are
           DELETED, not localized (contract §4 — a native title renders a second,
           untranslated OS tooltip). Their EXISTING English text moved verbatim
           into data-i18n-aria; no new prose was authored. -->
      <div class="preset-bar">
        <button class="preset-nav-btn" id="prevPreset"
                data-i18n-aria="aria.prevPreset" aria-label="Previous preset">&lt;</button>
        <!-- The preset NAME, written here at runtime by the vendored
             modules/preset-manager.js. Exempt under D-02: the name IS the JSON
             filename on disk. -->
        <span class="preset-name" id="presetName"
              data-i18n-aria="aria.presetList" aria-label="Click to see all presets">Default</span>
        <button class="preset-nav-btn" id="nextPreset"
                data-i18n-aria="aria.nextPreset" aria-label="Next preset">&gt;</button>
        <!-- data-label so a state updater that writes textContent reads the
             authored caption back instead of erasing it
             (pattern_js_state_updater_overwrites_html_labels). -->
        <button class="preset-action-btn" id="loadPreset"
                data-i18n="label.load" data-label="Load"
                data-i18n-aria="aria.loadPreset" aria-label="Load preset from file">Load</button>
        <button class="preset-action-btn" id="savePreset"
                data-i18n="label.save" data-label="Save"
                data-i18n-aria="aria.savePreset" aria-label="Save current settings">Save</button>
        <div class="preset-dropdown" id="presetDropdown"></div>
      </div>
    </div>

    <div class="controls-row">
      <!-- SYNC TOGGLE -->
      <div id="sync-container" class="toggle-container">
        <div class="toggle-label" data-i18n="label.sync" data-label="SYNC">SYNC</div>
        <!-- The face is REWRITTEN by setupToggle() through setLabel(), which
             makes this a [data-i18n] element owned by the language sweep. The
             authored key here is the OFF face, matching the authored text, so
             the first synchronous paint is already correct. -->
        <div id="sync" class="toggle" data-i18n="label.off" data-label="OFF">OFF</div>
      </div>

      <!-- TIME KNOB -->
      <div id="time-container" class="knob-container">
        <div class="knob-label" data-i18n="label.time" data-label="TIME">TIME</div>
        <div class="knob" id="time-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="time-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="time-value">500 ms</span>
      </div>

      <!-- FEEDBACK KNOB -->
      <div id="feedback-container" class="knob-container">
        <div class="knob-label" data-i18n="label.feedback" data-label="FEEDBACK">FEEDBACK</div>
        <div class="knob" id="feedback-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="feedback-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="feedback-value">30%</span>
      </div>

      <!-- SPREAD KNOB -->
      <div id="spread-container" class="knob-container">
        <div class="knob-label" data-i18n="label.spread" data-label="SPREAD">SPREAD</div>
        <div class="knob" id="spread-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="spread-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="spread-value">0%</span>
      </div>

      <!-- MOD KNOB -->
      <div id="mod-container" class="knob-container">
        <div class="knob-label" data-i18n="label.mod" data-label="MOD">MOD</div>
        <div class="knob" id="mod-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="mod-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="mod-value">0%</span>
      </div>

      <!-- WET KNOB -->
      <div id="wet-container" class="knob-container">
        <div class="knob-label" data-i18n="label.wet" data-label="WET">WET</div>
        <div class="knob" id="wet-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="wet-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="wet-value">30%</span>
      </div>

      <!-- DRY KNOB -->
      <div id="dry-container" class="knob-container">
        <div class="knob-label" data-i18n="label.dry" data-label="DRY">DRY</div>
        <div class="knob" id="dry-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="dry-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="dry-value">100%</span>
      </div>
    </div>

    <!-- LED METER -->
    <div class="led-meter-container">
      <div class="led-meter-label" data-i18n="label.out" data-label="OUT">OUT</div>
      <div class="led-meter" id="led-meter">
        <!-- 14 segments, populated by JavaScript -->
      </div>
    </div>

    <!-- FOOTER BRANDING -->
    <div class="footer-brand">
      <span>Ouaricon Audio</span>
      <span class="version" id="versionLabel"></span>
    </div>

    <!-- v1.3.0: the settings cluster. ONE row, because this plugin has no
         hover-help to toggle — authoring that copy is Stage M's job and this
         commit does not invent it. Positioned absolutely in the empty
         bottom-left margin so that no existing element moves to make room. -->
    <div class="settings-cluster">
      <button type="button" class="gear-btn" id="gear-btn"
              aria-haspopup="dialog" aria-expanded="false"
              data-i18n-aria="aria.settings" aria-label="Settings">&#9881;</button>

      <div class="settings-popover" id="settings-popover"
           role="dialog" data-i18n-aria="aria.settings" aria-label="Settings" hidden>
        <label class="settings-row" for="lang-select">
          <span class="settings-label" data-i18n="label.language" data-label="Language">Language</span>
          <!-- ENDONYMS. Never localized: a French speaker looking for their
               language looks for "Fran&ccedil;ais". -->
          <select class="settings-select" id="lang-select"
                  data-i18n-aria="aria.langSelect" aria-label="Interface language">
            <option value="en">English</option>
            <option value="fr">Fran&ccedil;ais</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <script type="module" src="js/juce/index.js"></script>
  <script type="module">
    import { getSliderState, getToggleState, getComboBoxState, getNativeFunction } from './js/juce/index.js';
    // The JUCE 8 frontend NAMESPACE, imported alongside the four named bindings
    // this page already used. Juce.getNativeFunction is the only correct way to
    // reach a withNativeFunction registration — window.__JUCE__ is the raw
    // postMessage transport and does not carry the promise contract
    // (critical_juce_webview_namespace_vs_postmessage). Two import statements
    // from one specifier is legal ES and leaves the existing call sites below
    // untouched.
    import * as Juce from './js/juce/index.js';
    import { PresetManager } from './modules/preset-manager.js';

    // v1.3.0: the label table. The canonical import line, re-rooted from
    // './i18n.js' to './js/i18n.js' because this plugin's controller is an
    // inline <script type="module"> at the UI root rather than a js/app.js.
    // check-i18n assertion 6 accepts exactly that one substitution and nothing
    // else. I18N and TIP_BINDINGS are both EMPTY here (this page has no
    // hover-help) and are imported anyway so the canon block below stays
    // byte-identical to the other forty-two copies.
    import { LANGUAGES, I18N, LABELS, TIP_BINDINGS, tr } from './js/i18n.js';

    // ============================================
    // MUSICAL DIVISIONS TABLE (matches C++ subdivisionFactors)
    // ============================================
    const musicalDivisions = [
      { name: "1/4",    factor: 1.0 },
      { name: "1/8",    factor: 0.5 },
      { name: "1/16",   factor: 0.25 },
      { name: "1/4D",   factor: 1.5 },    // Dotted
      { name: "1/8D",   factor: 0.75 },
      { name: "1/16D",  factor: 0.375 },
      { name: "1/4T",   factor: 0.667 },  // Triplet
      { name: "1/8T",   factor: 0.333 },
      { name: "1/16T",  factor: 0.167 },
      { name: "1/4(5)", factor: 0.8 },    // Quintuplet
      { name: "1/8(5)", factor: 0.4 },
      { name: "1/16(5)", factor: 0.2 }
    ];

    document.addEventListener("contextmenu", (e) => { e.preventDefault(); });

    // ============================================
    // SVG VINE-ARC KNOB SYSTEM
    // ============================================
    // Arc geometry: viewBox 60x60, r=25
    // circumference = 2 * PI * 25 = 157.08
    // arcLength (270 deg) = 0.75 * 157.08 = 117.81
    const ARC_LENGTH = 117.81;

    // Knob configurations
    const knobConfigs = {
      time:     { vineId: 'time-vine',     valueId: 'time-value' },
      feedback: { vineId: 'feedback-vine', valueId: 'feedback-value' },
      spread:   { vineId: 'spread-vine',   valueId: 'spread-value' },
      mod:      { vineId: 'mod-vine',      valueId: 'mod-value' },
      wet:      { vineId: 'wet-vine',      valueId: 'wet-value' },
      dry:      { vineId: 'dry-vine',      valueId: 'dry-value' }
    };

    // Smooth animation state
    const animState = {
      targets: {},
      frameId: null,
      isRunning: false,
      smoothing: 0.15
    };

    const animLoop = () => {
      let needsUpdate = false;
      Object.values(animState.targets).forEach(s => {
        const delta = s.target - s.current;
        if (Math.abs(delta) > 0.0001) {
          s.current += delta * animState.smoothing;
          needsUpdate = true;
          s.vine.style.strokeDashoffset = ARC_LENGTH - (s.current * ARC_LENGTH);
        }
      });
      if (needsUpdate) {
        animState.frameId = requestAnimationFrame(animLoop);
      } else {
        animState.isRunning = false;
        animState.frameId = null;
      }
    };

    const startAnim = () => {
      if (!animState.isRunning) {
        animState.isRunning = true;
        animState.frameId = requestAnimationFrame(animLoop);
      }
    };

    // Safe combo box index accessor (shared by time knob + butterfly echoes)
    function getChoiceIndexSafe(comboState) {
      try { return comboState?.getChoiceIndex() ?? 0; }
      catch { return 0; }
    }

    // Global drag state
    const dragState = { isDragging: false, target: null, startY: 0, startValue: 0 };

    document.addEventListener('mousemove', (e) => {
      if (!dragState.isDragging || !dragState.target) return;
      const info = dragState.targetInfo;

      if (info.syncDrag) {
        // Time knob in sync mode — drag through divisions
        const deltaY = dragState.startY - e.clientY;
        info.syncNorm = Math.max(0, Math.min(1, dragState.startValue + deltaY * 0.005));
        const newDiv = Math.round(info.syncNorm * 11);
        if (newDiv !== info.getDivisionIndex()) {
          try { info.divisionState.setChoiceIndex(newDiv); } catch {}
        }
      } else {
        // Normal knob drag
        const deltaY = dragState.startY - e.clientY;
        const newNorm = Math.max(0, Math.min(1, dragState.startValue + deltaY * 0.005));
        info.sliderState.setNormalisedValue(newNorm);
      }
    });

    document.addEventListener('mouseup', () => {
      if (!dragState.isDragging) return;
      const info = dragState.targetInfo;
      if (info && info.sliderState && info.sliderState.sliderDragEnded) {
        info.sliderState.sliderDragEnded();
      }
      dragState.isDragging = false;
      dragState.target = null;
      dragState.targetInfo = null;
    });

    // LED meter segments (cached after setup)
    let ledSegments = null;

    function setupLEDMeter() {
      const meterContainer = document.getElementById('led-meter');

      for (let i = 0; i < 14; i++) {
        const segment = document.createElement('div');
        segment.className = 'led-segment';
        segment.dataset.index = i;
        meterContainer.appendChild(segment);
      }
      ledSegments = meterContainer.querySelectorAll('.led-segment');
    }

    window.updateLEDMeter = function(rmsLevel) {
      if (!ledSegments) return;
      const boostedLevel = rmsLevel * 6.0;
      const logLevel = boostedLevel > 0 ? Math.log10(1 + boostedLevel * 9) : 0;
      const activeCount = Math.floor(Math.min(1.0, Math.max(0.0, logLevel)) * 14);

      ledSegments.forEach((segment, index) => {
        segment.classList.remove('active-low', 'active-mid', 'active-high');
        if (index < activeCount) {
          segment.classList.add(index < 5 ? 'active-low' : index < 10 ? 'active-mid' : 'active-high');
        }
      });
    };

    let syncState = null;
    let updateTimeDisplay = null;

    function setupToggle() {
      const toggle = document.getElementById('sync');
      syncState = getToggleState('sync');
      if (!syncState) return;

      const updateVisual = (value) => {
        toggle.classList.toggle('active', value);
        // The two faces are KEYS through setLabel(), not literals. A literal
        // here would be stranded in the previous language the instant the
        // selector fires; setLabel makes the node a [data-i18n] element that
        // the language sweep owns.
        //
        // Written as two calls rather than one conditional key on purpose:
        // check-i18n assertion 13 rejects a ternary anywhere inside a setLabel
        // argument list, because that is where a plural suffix creeps back in
        // (contract §6).
        if (value) setLabel(toggle, 'label.on');
        else       setLabel(toggle, 'label.off');
        if (updateTimeDisplay) updateTimeDisplay();
      };

      syncState.valueChangedEvent.addListener(() => updateVisual(syncState.getValue()));
      updateVisual(syncState.getValue());
      toggle.addEventListener('click', () => syncState.setValue(!syncState.getValue()));
    }

    function setupStandardKnob(paramId, min, max, formatFn) {
      const sliderState = getSliderState(paramId);
      const config = knobConfigs[paramId];
      if (!sliderState || !config) return;

      const vine = document.getElementById(config.vineId);
      const valueDisplay = document.getElementById(config.valueId);
      const knobEl = document.getElementById(`${paramId}-knob`);
      if (!vine || !valueDisplay || !knobEl) return;

      const initialNorm = sliderState.getNormalisedValue();
      animState.targets[paramId] = {
        current: initialNorm,
        target: initialNorm,
        vine: vine
      };
      vine.style.strokeDashoffset = ARC_LENGTH - (initialNorm * ARC_LENGTH);

      if (formatFn) {
        valueDisplay.textContent = formatFn(min + (initialNorm * (max - min)));
      }

      sliderState.valueChangedEvent.addListener(() => {
        const norm = sliderState.getNormalisedValue();
        animState.targets[paramId].target = norm;
        if (formatFn) {
          valueDisplay.textContent = formatFn(min + (norm * (max - min)));
        }
        startAnim();
      });

      // Drag
      const knobVisual = knobEl.querySelector('.knob-visual');
      knobVisual.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dragState.isDragging = true;
        dragState.target = paramId;
        dragState.startY = e.clientY;
        dragState.startValue = sliderState.getNormalisedValue();
        dragState.targetInfo = { sliderState, syncDrag: false };
        if (sliderState.sliderDragStarted) sliderState.sliderDragStarted();
      });

      // Mouse wheel
      knobEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.02 : -0.02;
        const newNorm = Math.max(0, Math.min(1, sliderState.getNormalisedValue() + delta));
        sliderState.setNormalisedValue(newNorm);
      }, { passive: false });
    }

    function setupTimeKnob() {
      const timeState = getSliderState('time');
      const divisionState = getComboBoxState('division');
      const config = knobConfigs.time;
      if (!timeState || !config) return;

      const vine = document.getElementById(config.vineId);
      const valueDisplay = document.getElementById(config.valueId);
      const knobEl = document.getElementById('time-knob');
      if (!vine || !valueDisplay || !knobEl) return;

      const initialNorm = timeState.getNormalisedValue();
      animState.targets.time = {
        current: initialNorm,
        target: initialNorm,
        vine: vine
      };
      vine.style.strokeDashoffset = ARC_LENGTH - (initialNorm * ARC_LENGTH);

      let syncNormalized = 0;

      const getDivisionIndex = () => getChoiceIndexSafe(divisionState);

      const updateVisual = () => {
        if (syncState?.getValue() && divisionState) {
          const divIndex = Math.max(0, Math.min(11, getDivisionIndex()));
          valueDisplay.textContent = musicalDivisions[divIndex].name;
          syncNormalized = divIndex / 11;
          animState.targets.time.target = syncNormalized;
        } else {
          const normalized = timeState.getNormalisedValue();
          animState.targets.time.target = normalized;
          valueDisplay.textContent = `${Math.round(1.0 + normalized * 1999.0)} ms`;
        }
        startAnim();
      };

      updateTimeDisplay = updateVisual;
      timeState.valueChangedEvent.addListener(updateVisual);
      divisionState?.valueChangedEvent.addListener(updateVisual);
      updateVisual();

      // Drag
      const knobVisual = knobEl.querySelector('.knob-visual');
      knobVisual.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const isSyncMode = syncState?.getValue() && divisionState;
        dragState.isDragging = true;
        dragState.target = 'time';

        if (isSyncMode) {
          syncNormalized = getDivisionIndex() / 11;
          dragState.startY = e.clientY;
          dragState.startValue = syncNormalized;
          dragState.targetInfo = {
            sliderState: timeState,
            syncDrag: true,
            syncNorm: syncNormalized,
            divisionState,
            getDivisionIndex
          };
        } else {
          dragState.startY = e.clientY;
          dragState.startValue = timeState.getNormalisedValue();
          dragState.targetInfo = { sliderState: timeState, syncDrag: false };
        }
        if (timeState.sliderDragStarted) timeState.sliderDragStarted();
      });

      // Mouse wheel
      knobEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (syncState?.getValue() && divisionState) {
          const currentDiv = getDivisionIndex();
          const newDiv = e.deltaY < 0
            ? Math.min(11, currentDiv + 1)
            : Math.max(0, currentDiv - 1);
          if (newDiv !== currentDiv) {
            try { divisionState.setChoiceIndex(newDiv); } catch {}
          }
        } else {
          const delta = e.deltaY < 0 ? 0.02 : -0.02;
          const newNorm = Math.max(0, Math.min(1, timeState.getNormalisedValue() + delta));
          timeState.setNormalisedValue(newNorm);
        }
      }, { passive: false });
    }

    // ============================================
    // BUTTERFLY FEEDBACK ECHO EFFECT
    // ============================================
    const ECHO_COUNT = 20;
    const ECHO_SHIFT_MIN = 5;       // min px shift per copy (short delay time)
    const ECHO_SHIFT_MAX = 30;      // max px shift per copy (long delay time)
    const ECHO_OPACITY = 0.02;      // each copy ~2% — accumulation creates density
    const BUTTERFLY_BASE_TOP = -520; // original butterfly top position

    function setupButterflyEchoes() {
      const feedbackState = getSliderState('feedback');
      const timeState = getSliderState('time');
      const wetState = getSliderState('wet');
      const divisionState = getComboBoxState('division');
      if (!feedbackState) return;

      const container = document.getElementById('butterfly-echoes');
      const echoes = [];
      let currentShift = ECHO_SHIFT_MIN;
      let currentOpacity = ECHO_OPACITY;

      for (let i = 0; i < ECHO_COUNT; i++) {
        const echo = document.createElement('div');
        echo.className = 'butterfly-echo';
        container.appendChild(echo);
        echoes.push(echo);
      }

      const repositionEchoes = () => {
        for (let i = 0; i < ECHO_COUNT; i++) {
          echoes[i].style.top = `${BUTTERFLY_BASE_TOP + (i + 1) * currentShift}px`;
        }
      };

      const updateEchoes = () => {
        const norm = feedbackState.getNormalisedValue(); // 0–1
        const numCopies = norm * ECHO_COUNT;             // 0–20 (continuous)
        const fullCopies = Math.floor(numCopies);
        const fractional = numCopies - fullCopies;

        for (let i = 0; i < ECHO_COUNT; i++) {
          if (i < fullCopies) {
            echoes[i].style.opacity = currentOpacity;
          } else if (i === fullCopies) {
            echoes[i].style.opacity = fractional * currentOpacity;
          } else {
            echoes[i].style.opacity = 0;
          }
        }
      };

      const updateShift = () => {
        let timeNorm;
        if (syncState?.getValue() && divisionState) {
          // Sync mode: use division factor to derive spacing
          const divIndex = Math.max(0, Math.min(11, getChoiceIndexSafe(divisionState)));
          timeNorm = musicalDivisions[divIndex].factor; // 0.167–1.5, clamped below
          timeNorm = Math.min(1, timeNorm); // clamp dotted values to 1
        } else {
          timeNorm = timeState ? timeState.getNormalisedValue() : 0;
        }
        currentShift = ECHO_SHIFT_MIN + timeNorm * (ECHO_SHIFT_MAX - ECHO_SHIFT_MIN);
        repositionEchoes();
      };

      const updateOpacity = () => {
        const wetNorm = wetState ? wetState.getNormalisedValue() : 0;
        currentOpacity = ECHO_OPACITY + wetNorm * (1.0 - ECHO_OPACITY); // 0.02 → 1.0
        updateEchoes();
      };

      feedbackState.valueChangedEvent.addListener(updateEchoes);
      if (wetState) wetState.valueChangedEvent.addListener(updateOpacity);
      if (timeState) timeState.valueChangedEvent.addListener(updateShift);
      if (divisionState) divisionState.valueChangedEvent.addListener(updateShift);
      if (syncState) syncState.valueChangedEvent.addListener(updateShift);
      updateShift();    // set initial positions
      updateOpacity();  // set initial opacity + visibility
    }

    document.addEventListener("DOMContentLoaded", () => {
      setupLEDMeter();

      setupToggle();
      setupTimeKnob();
      setupStandardKnob('feedback', 0.0, 100.0, v => `${Math.round(v)}%`);
      setupButterflyEchoes();
      setupStandardKnob('spread', 0.0, 100.0, v => `${Math.round(v)}%`);
      setupStandardKnob('mod', 0.0, 100.0, v => `${Math.round(v)}%`);
      setupStandardKnob('wet', 0.0, 100.0, v => `${Math.round(v)}%`);
      setupStandardKnob('dry', 0.0, 100.0, v => `${Math.round(v)}%`);

      const presetNameDisplay = document.getElementById('presetName');
      const presetDropdown = document.getElementById('presetDropdown');

      // Fetch plugin version from C++ and display in footer
      const getPluginVersion = getNativeFunction('getPluginVersion');
      getPluginVersion().then(version => {
          const versionLabel = document.getElementById('versionLabel');
          if (versionLabel && version) {
              versionLabel.textContent = 'v' + version;
          }
      });

      const presetManager = new PresetManager({
        displayElement: presetNameDisplay,
        prevButton: document.getElementById('prevPreset'),
        nextButton: document.getElementById('nextPreset'),
        saveButton: document.getElementById('savePreset'),
        loadButton: document.getElementById('loadPreset'),
        getNativeFunction: getNativeFunction,
        onPresetChanged: () => { hidePresetDropdown(); },
        onPresetListUpdated: () => {}
      });
      presetManager.initialize();

      function showPresetDropdown() {
        const presets = presetManager.getPresetList();
        presetDropdown.innerHTML = '';

        if (presets.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'preset-dropdown-item';
          // Authored around the inflection rather than through it (contract §6):
          // a categorical "no presets" statement is correct at exactly zero and
          // needs no plural rule, where a count would need one that treats zero
          // as singular in French and plural in English.
          setLabel(empty, 'label.noPresets');
          empty.style.fontStyle = 'italic';
          empty.style.color = '#888';
          presetDropdown.appendChild(empty);
        } else {
          const header = document.createElement('div');
          header.className = 'preset-dropdown-header';
          setLabel(header, 'label.presets');
          presetDropdown.appendChild(header);

          presets.forEach(presetName => {
            const item = document.createElement('div');
            item.className = 'preset-dropdown-item';
            if (presetName === presetManager.getCurrentPreset()) {
              item.classList.add('active');
            }
            item.textContent = presetName;
            item.addEventListener('click', (e) => {
              e.stopPropagation();
              presetManager.loadPreset(presetName);
            });
            presetDropdown.appendChild(item);
          });
        }

        presetDropdown.classList.add('show');
      }

      function hidePresetDropdown() {
        presetDropdown.classList.remove('show');
      }

      presetNameDisplay.addEventListener('click', (e) => {
        e.stopPropagation();
        presetDropdown.classList.contains('show') ? hidePresetDropdown() : showPresetDropdown();
      });

      document.addEventListener('click', (e) => {
        if (!presetDropdown.contains(e.target) && e.target !== presetNameDisplay) {
          hidePresetDropdown();
        }
      });
    });

    // ════════════════════════════════════════════════════════════════════════
    // i18n — the canon v2 block, VERBATIM from scripts/i18n-canon.js
    // ════════════════════════════════════════════════════════════════════════
    //
    // Byte-compared by check-i18n assertion 6 after comment stripping and
    // whitespace normalisation. Do not edit it here; edit the canon and every
    // copy together, which is the whole point of holding it as data.
    //
    // It sits at the END of the module, below every existing initializer, and
    // is REACHED only through the guarded initI18n() call further down. A
    // top-level statement up here that touched a lower `let` would be a TDZ
    // throw taking every later initializer with it, and on this plugin "every
    // later initializer" is the entire UI — the controller is one inline
    // module, not a file that can fail in isolation
    // (pattern_module_toplevel_init_tdz).
    //
    // setLabel() is CALLED from setupToggle() and showPresetDropdown() above,
    // both of which run inside DOMContentLoaded. A module script is deferred,
    // so the whole module body — including the `let uiLanguage` below — has
    // already been evaluated by the time that event fires. Nothing above
    // reaches into this block before it exists.

    let uiLanguage = 'en';
    let getUiLanguageNative = null;
    let setUiLanguageNative = null;

    // LABELS first, I18N as the fallback: a control whose tooltip title already IS
    // its label carries one key, not two copies of the same string.
    function trLabel(key, lang, vars) {
        const entry = (typeof LABELS === 'object' && LABELS && LABELS[key]) || I18N[key];
        if (!entry) { console.warn(`i18n: missing label key ${key}`); return key; }
        const s = entry[lang] || entry.en;
        const resolve = (v) => {
            const nested = (typeof LABELS === 'object' && LABELS && LABELS[v]) || I18N[v];
            return nested ? String((nested[lang] || nested.en).t) : String(v);
        };
        return vars
            ? String(s.t).replace(/\{(\w+)\}/g, (m, n) => (n in vars ? resolve(vars[n]) : m))
            : String(s.t);
    }

    function applyLabel(el) {
        const key = el.dataset.i18n;
        if (!key) return;
        let vars = null;
        try { vars = el.dataset.i18nVars ? JSON.parse(el.dataset.i18nVars) : null; }
        catch (e) { console.warn(`i18n: bad vars on ${key}`); }
        const s = trLabel(key, uiLanguage, vars);
        el.dataset.label = s;
        el.textContent   = s;
    }

    function applyI18nAttributes(el) {
        const pairs = [['i18nAria', 'aria-label'], ['i18nPlaceholder', 'placeholder'], ['i18nAlt', 'alt']];
        for (const [prop, attr] of pairs) {
            const key = el.dataset[prop];
            if (key) el.setAttribute(attr, trLabel(key, uiLanguage, null));
        }
    }

    function setLabel(el, key, vars) {
        if (!el) return;
        el.dataset.i18n = key;
        if (vars) el.dataset.i18nVars = JSON.stringify(vars); else delete el.dataset.i18nVars;
        applyLabel(el);
    }

    function applyI18n(lang) {
        uiLanguage = LANGUAGES.includes(lang) ? lang : 'en';
        for (const [selector, key, wrapper, vars] of TIP_BINDINGS) {
            const el = document.querySelector(selector);
            if (!el) { console.warn(`i18n: tip target not found: ${selector}`); continue; }
            const target = wrapper ? (el.closest(wrapper) || el) : el;
            const s = tr(key, uiLanguage, vars);
            target.setAttribute('data-tip-title', s.t);
            target.setAttribute('data-tip', s.b);
        }
        for (const el of document.querySelectorAll('[data-i18n]')) applyLabel(el);
        for (const el of document.querySelectorAll('[data-i18n-aria],[data-i18n-placeholder],[data-i18n-alt]'))
            applyI18nAttributes(el);
        const sel = document.getElementById('lang-select');
        if (sel && sel.value !== uiLanguage) sel.value = uiLanguage;
    }

    // Exposed so a clamp gate can drive the language without teaching the ui-stub a
    // promise contract: page.evaluate((l) => window.__setLanguage(l), 'fr').
    window.__setLanguage = applyI18n;
    // Exposed for the same reason, and so a sibling module can write a localized
    // label without app.js having to export anything — O-Bitrot's controller is an
    // inline <script type="module">, where an export declaration has nowhere to go.
    window.__setLabel = setLabel;

    function initI18n() {
        try {
            getUiLanguageNative = Juce.getNativeFunction('getUiLanguage');
            setUiLanguageNative = Juce.getNativeFunction('setUiLanguage');
        } catch (e) {
            console.warn('Language preference not available, session-only:', e);
        }

        // Paint the default SYNCHRONOUSLY first. Never blank, never a flash.
        try { applyI18n('en'); } catch (e) { console.error('i18n init failed:', e); }

        if (getUiLanguageNative) {
            getUiLanguageNative()
                .then((code) => applyI18n(code === 'fr' ? 'fr' : 'en'))
                .catch((e) => console.warn('Could not read language preference:', e));
        }

        const sel = document.getElementById('lang-select');
        if (sel) sel.addEventListener('change', (e) => {
            applyI18n(e.target.value);
            if (setUiLanguageNative) setUiLanguageNative(uiLanguage).catch(() => {});
        });
    }

    // ════════════════════════════════════════════════════════════════════════
    // The settings popover (v1.3.0)
    // ════════════════════════════════════════════════════════════════════════
    //
    // ONE row. This plugin has no hover-help to switch on or off — v1.2.12
    // carried no data-tip anywhere — and authoring that copy is Stage M's job,
    // so the popover holds the language selector alone. The panel opens
    // UPWARDS: the gear is 6 px from the BOTTOM of a 196 px frame.

    let settingsPopoverEl = null;
    let gearBtnEl = null;

    function setSettingsPopoverOpen(open) {
        if (!settingsPopoverEl || !gearBtnEl) return;
        settingsPopoverEl.hidden = !open;
        gearBtnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function initializeSettingsPopover() {
        gearBtnEl = document.getElementById('gear-btn');
        settingsPopoverEl = document.getElementById('settings-popover');

        if (!gearBtnEl || !settingsPopoverEl) {
            console.warn('settings popover missing - language selector unavailable');
            return;
        }

        gearBtnEl.addEventListener('click', (e) => {
            e.stopPropagation();
            setSettingsPopoverOpen(settingsPopoverEl.hidden);
        });

        // Dismiss on a press anywhere else, and on Escape. mousedown rather
        // than click, so the panel is gone before a drag on a knob underneath
        // it begins — this page starts a knob drag on mousedown.
        document.addEventListener('mousedown', (e) => {
            if (settingsPopoverEl.hidden) return;
            if (settingsPopoverEl.contains(e.target) || gearBtnEl.contains(e.target)) return;
            setSettingsPopoverOpen(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !settingsPopoverEl.hidden) {
                setSettingsPopoverOpen(false);
                gearBtnEl.focus();
            }
        });
    }

    // Guarded, and LAST. Every parameter binding above has already been
    // registered, so an i18n failure leaves an English plugin that still works
    // rather than a dead page.
    initializeSettingsPopover();
    try { initI18n(); } catch (e) { console.error('i18n init failed:', e); }
  </script>
</body>
</html>

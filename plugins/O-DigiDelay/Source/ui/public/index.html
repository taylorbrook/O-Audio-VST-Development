<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ouaricon Digital Delay</title>

  <style>
    /* ============================================
       WEBVIEW CONSTRAINTS (CRITICAL)
       ============================================ */
    html, body {
      height: 100%;  /* REQUIRED - replaces viewport units */
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* ============================================
       NATIVE APPLICATION FEEL
       ============================================ */
    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============================================
       CONTAINER
       ============================================ */
    .container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #F5E6D3;
      font-family: Garamond, 'Times New Roman', serif;
      overflow: hidden;
    }

    /* ============================================
       BACKGROUND LAYER (Paper texture)
       ============================================ */
    .paper-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 700px;
      height: 196px;
      background-image: url('img/paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* ============================================
       BUTTERFLY OVERLAY (NATURAL SIZE - 800×1280px)
       ============================================ */
    .butterfly-overlay {
      position: absolute;
      left: calc(50% - 400px);
      top: -520px;
      width: 800px;
      height: 1280px;
      background-image: url('img/butterfly2_Black and white.png');
      background-size: 800px 1280px;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.30;
      z-index: 1;
      pointer-events: none;
    }

    /* ============================================
       BUTTERFLY FEEDBACK ECHOES
       ============================================ */
    .butterfly-echo {
      position: absolute;
      left: calc(50% - 400px);
      width: 800px;
      height: 1280px;
      background-image: url('img/butterfly2_Black and white.png');
      background-size: 800px 1280px;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ============================================
       HEADER ROW (Title + Preset Bar)
       ============================================ */
    .header {
      position: absolute;
      top: 8px;
      left: 16px;
      right: 66px; /* 50px extra margin to avoid output meter label */
      height: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .title {
      font-size: 16px;
      letter-spacing: 2.5px;
      color: #3C2F2F;
      font-weight: normal;
      white-space: nowrap;
    }

    /* ============================================
       PRESET BAR
       ============================================ */
    .preset-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 168, 112, 0.25);
      border: 2px solid #5C4033;
      border-radius: 4px;
      padding: 3px 6px;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.15);
      position: relative;
    }

    .preset-nav-btn {
      width: 20px;
      height: 20px;
      background: rgba(107, 142, 35, 0.4);
      border: 1px solid #3C5C1A;
      border-radius: 3px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 12px;
      font-weight: bold;
      color: #2C3E10;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .preset-nav-btn:hover {
      background: rgba(107, 142, 35, 0.6);
      transform: scale(1.05);
    }

    .preset-name {
      min-width: 80px;
      max-width: 120px;
      text-align: center;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 11px;
      color: #3C2F2F;
      padding: 2px 6px;
      background: rgba(255, 248, 220, 0.5);
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preset-name:hover {
      background: rgba(255, 248, 220, 0.8);
    }

    .preset-action-btn {
      padding: 2px 6px;
      background: rgba(107, 142, 35, 0.3);
      border: 1px solid #3C5C1A;
      border-radius: 3px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #2C3E10;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-action-btn:hover {
      background: rgba(107, 142, 35, 0.5);
    }

    /* Preset Dropdown Menu */
    .preset-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: rgba(255, 248, 220, 0.98);
      border: 2px solid #5C4033;
      border-radius: 4px;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.4);
      max-height: 180px;
      overflow-y: auto;
      z-index: 9999; /* Must be above all controls */
    }

    .preset-dropdown.show {
      display: block;
    }

    /* Elevate entire header when dropdown is open (escapes stacking context) */
    .header:has(.preset-dropdown.show) {
      z-index: 9999;
    }

    .preset-dropdown-header {
      padding: 3px 6px;
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8B7355;
      background: rgba(139, 115, 85, 0.1);
      border-bottom: 1px solid rgba(92, 64, 51, 0.2);
    }

    .preset-dropdown-item {
      padding: 4px 8px;
      font-size: 10px;
      color: #3C2F2F;
      cursor: pointer;
      border-bottom: 1px solid rgba(92, 64, 51, 0.1);
      transition: background 0.15s;
    }

    .preset-dropdown-item:hover {
      background: rgba(139, 168, 112, 0.3);
    }

    .preset-dropdown-item.active {
      background: rgba(107, 142, 35, 0.3);
      font-weight: bold;
    }

    .preset-dropdown-item.factory {
      font-style: italic;
    }

    /* ============================================
       CONTROLS CONTAINER
       ============================================ */
    .controls-row {
      position: absolute;
      top: 50px;
      left: 20px;
      width: 615px;
      height: 130px;
      z-index: 2;
    }

    /* ============================================
       KNOB STYLES (SVG Vine-Arc)
       ============================================ */
    .knob-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .knob-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
      width: 60px;
    }

    .knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .knob-visual {
      width: 60px;
      height: 60px;
      position: relative;
    }

    .knob-visual svg {
      width: 100%;
      height: 100%;
      transform: rotate(-135deg);
    }

    .knob-track {
      fill: none;
      stroke: rgba(139, 115, 85, 0.3);
      stroke-width: 2;
    }

    .knob-vine {
      fill: none;
      stroke: #5a7a6a;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .knob-value {
      font-size: 11px;
      color: #3C2F2F;
      margin-top: 4px;
      min-width: 60px;
      text-align: center;
    }

    /* ============================================
       TOGGLE BUTTON (SYNC)
       ============================================ */
    .toggle-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toggle-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
    }

    .toggle {
      width: 50px;
      height: 24px;
      border: 2px solid #3C5C1A;
      border-radius: 4px;
      background: rgba(139, 168, 112, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      cursor: pointer;
      transition: background 100ms;
    }

    .toggle.active {
      background: rgba(107, 142, 35, 0.6);
    }

    /* ============================================
       LED METER (OuariconComp style)
       ============================================ */
    .led-meter-container {
      position: absolute;
      top: 25px;
      left: 645px;
      width: 18px;
      height: 155px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .led-meter-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
      width: 18px;
    }

    .led-meter {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      background: rgba(139, 115, 85, 0.1);
      border: 1px solid #8B7355;
      padding: 4px;
      border-radius: 2px;
      width: 18px;
      height: 140px;
    }

    .led-segment {
      width: 100%;
      height: 10px;
      background: #8B7355;
      border-radius: 1px;
      transition: background 100ms, box-shadow 100ms;
    }

    .led-segment.active-low {
      background: #8BA870;
      box-shadow: 0 0 4px #8BA870;
    }

    .led-segment.active-mid {
      background: #6B8E4E;
      box-shadow: 0 0 4px #6B8E4E;
    }

    .led-segment.active-high {
      background: #C9A27B;
      box-shadow: 0 0 4px #C9A27B;
    }

    /* ============================================
       CONTROL POSITIONING
       ============================================ */
    #sync-container {
      top: 4px;
      left: 10px;
    }

    #time-container {
      top: 4px;
      left: 95px;
    }

    #feedback-container {
      top: 4px;
      left: 175px;
    }

    #spread-container {
      top: 4px;
      left: 255px;
    }

    #mod-container {
      top: 4px;
      left: 335px;
    }

    #wet-container {
      top: 4px;
      left: 415px;
    }

    #dry-container {
      top: 4px;
      left: 495px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LAYER 0: Paper background -->
    <div class="paper-background"></div>

    <!-- LAYER 1: Butterfly overlay -->
    <div class="butterfly-overlay"></div>

    <!-- LAYER 1b: Butterfly feedback echoes -->
    <div id="butterfly-echoes"></div>

    <!-- LAYER 2+: UI Elements -->
    <div class="header">
      <div class="title">OUARICON DIGITAL DELAY</div>
      <div class="preset-bar">
        <button class="preset-nav-btn" id="prevPreset" title="Previous preset">&lt;</button>
        <span class="preset-name" id="presetName" title="Click to see all presets">Default</span>
        <button class="preset-nav-btn" id="nextPreset" title="Next preset">&gt;</button>
        <button class="preset-action-btn" id="loadPreset" title="Load preset from file">Load</button>
        <button class="preset-action-btn" id="savePreset" title="Save current settings">Save</button>
        <div class="preset-dropdown" id="presetDropdown"></div>
      </div>
    </div>

    <div class="controls-row">
      <!-- SYNC TOGGLE -->
      <div id="sync-container" class="toggle-container">
        <div class="toggle-label">SYNC</div>
        <div id="sync" class="toggle">OFF</div>
      </div>

      <!-- TIME KNOB -->
      <div id="time-container" class="knob-container">
        <div class="knob-label">TIME</div>
        <div class="knob" id="time-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="time-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="time-value">500 ms</span>
      </div>

      <!-- FEEDBACK KNOB -->
      <div id="feedback-container" class="knob-container">
        <div class="knob-label">FEEDBACK</div>
        <div class="knob" id="feedback-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="feedback-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="feedback-value">30%</span>
      </div>

      <!-- SPREAD KNOB -->
      <div id="spread-container" class="knob-container">
        <div class="knob-label">SPREAD</div>
        <div class="knob" id="spread-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="spread-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="spread-value">0%</span>
      </div>

      <!-- MOD KNOB -->
      <div id="mod-container" class="knob-container">
        <div class="knob-label">MOD</div>
        <div class="knob" id="mod-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="mod-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="mod-value">0%</span>
      </div>

      <!-- WET KNOB -->
      <div id="wet-container" class="knob-container">
        <div class="knob-label">WET</div>
        <div class="knob" id="wet-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="wet-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="wet-value">30%</span>
      </div>

      <!-- DRY KNOB -->
      <div id="dry-container" class="knob-container">
        <div class="knob-label">DRY</div>
        <div class="knob" id="dry-knob">
          <div class="knob-visual">
            <svg viewBox="0 0 60 60">
              <circle class="knob-track" cx="30" cy="30" r="25"/>
              <circle class="knob-vine" id="dry-vine" cx="30" cy="30" r="25"
                stroke-dasharray="157.08" stroke-dashoffset="157.08"/>
            </svg>
          </div>
        </div>
        <span class="knob-value" id="dry-value">100%</span>
      </div>
    </div>

    <!-- LED METER -->
    <div class="led-meter-container">
      <div class="led-meter-label">OUT</div>
      <div class="led-meter" id="led-meter">
        <!-- 14 segments, populated by JavaScript -->
      </div>
    </div>
  </div>

  <script type="module" src="js/juce/index.js"></script>
  <script type="module">
    import { getSliderState, getToggleState, getComboBoxState, getNativeFunction } from './js/juce/index.js';
    import { PresetManager } from './modules/preset-manager.js';

    // ============================================
    // MUSICAL DIVISIONS TABLE (matches C++ subdivisionFactors)
    // ============================================
    const musicalDivisions = [
      { name: "1/4",    factor: 1.0 },
      { name: "1/8",    factor: 0.5 },
      { name: "1/16",   factor: 0.25 },
      { name: "1/4D",   factor: 1.5 },    // Dotted
      { name: "1/8D",   factor: 0.75 },
      { name: "1/16D",  factor: 0.375 },
      { name: "1/4T",   factor: 0.667 },  // Triplet
      { name: "1/8T",   factor: 0.333 },
      { name: "1/16T",  factor: 0.167 },
      { name: "1/4(5)", factor: 0.8 },    // Quintuplet
      { name: "1/8(5)", factor: 0.4 },
      { name: "1/16(5)", factor: 0.2 }
    ];

    document.addEventListener("contextmenu", (e) => { e.preventDefault(); });

    // ============================================
    // SVG VINE-ARC KNOB SYSTEM
    // ============================================
    // Arc geometry: viewBox 60x60, r=25
    // circumference = 2 * PI * 25 = 157.08
    // arcLength (270 deg) = 0.75 * 157.08 = 117.81
    const ARC_LENGTH = 117.81;

    // Knob configurations
    const knobConfigs = {
      time:     { vineId: 'time-vine',     valueId: 'time-value' },
      feedback: { vineId: 'feedback-vine', valueId: 'feedback-value' },
      spread:   { vineId: 'spread-vine',   valueId: 'spread-value' },
      mod:      { vineId: 'mod-vine',      valueId: 'mod-value' },
      wet:      { vineId: 'wet-vine',      valueId: 'wet-value' },
      dry:      { vineId: 'dry-vine',      valueId: 'dry-value' }
    };

    // Smooth animation state
    const animState = {
      targets: {},
      frameId: null,
      isRunning: false,
      smoothing: 0.15
    };

    const animLoop = () => {
      let needsUpdate = false;
      Object.values(animState.targets).forEach(s => {
        const delta = s.target - s.current;
        if (Math.abs(delta) > 0.0001) {
          s.current += delta * animState.smoothing;
          needsUpdate = true;
          s.vine.style.strokeDashoffset = ARC_LENGTH - (s.current * ARC_LENGTH);
        }
      });
      if (needsUpdate) {
        animState.frameId = requestAnimationFrame(animLoop);
      } else {
        animState.isRunning = false;
        animState.frameId = null;
      }
    };

    const startAnim = () => {
      if (!animState.isRunning) {
        animState.isRunning = true;
        animState.frameId = requestAnimationFrame(animLoop);
      }
    };

    // Safe combo box index accessor (shared by time knob + butterfly echoes)
    function getChoiceIndexSafe(comboState) {
      try { return comboState?.getChoiceIndex() ?? 0; }
      catch { return 0; }
    }

    // Global drag state
    const dragState = { isDragging: false, target: null, startY: 0, startValue: 0 };

    document.addEventListener('mousemove', (e) => {
      if (!dragState.isDragging || !dragState.target) return;
      const info = dragState.targetInfo;

      if (info.syncDrag) {
        // Time knob in sync mode — drag through divisions
        const deltaY = dragState.startY - e.clientY;
        info.syncNorm = Math.max(0, Math.min(1, dragState.startValue + deltaY * 0.005));
        const newDiv = Math.round(info.syncNorm * 11);
        if (newDiv !== info.getDivisionIndex()) {
          try { info.divisionState.setChoiceIndex(newDiv); } catch {}
        }
      } else {
        // Normal knob drag
        const deltaY = dragState.startY - e.clientY;
        const newNorm = Math.max(0, Math.min(1, dragState.startValue + deltaY * 0.005));
        info.sliderState.setNormalisedValue(newNorm);
      }
    });

    document.addEventListener('mouseup', () => {
      if (!dragState.isDragging) return;
      const info = dragState.targetInfo;
      if (info && info.sliderState && info.sliderState.sliderDragEnded) {
        info.sliderState.sliderDragEnded();
      }
      dragState.isDragging = false;
      dragState.target = null;
      dragState.targetInfo = null;
    });

    // LED meter segments (cached after setup)
    let ledSegments = null;

    function setupLEDMeter() {
      const meterContainer = document.getElementById('led-meter');

      for (let i = 0; i < 14; i++) {
        const segment = document.createElement('div');
        segment.className = 'led-segment';
        segment.dataset.index = i;
        meterContainer.appendChild(segment);
      }
      ledSegments = meterContainer.querySelectorAll('.led-segment');
    }

    window.updateLEDMeter = function(rmsLevel) {
      if (!ledSegments) return;
      const boostedLevel = rmsLevel * 6.0;
      const logLevel = boostedLevel > 0 ? Math.log10(1 + boostedLevel * 9) : 0;
      const activeCount = Math.floor(Math.min(1.0, Math.max(0.0, logLevel)) * 14);

      ledSegments.forEach((segment, index) => {
        segment.classList.remove('active-low', 'active-mid', 'active-high');
        if (index < activeCount) {
          segment.classList.add(index < 5 ? 'active-low' : index < 10 ? 'active-mid' : 'active-high');
        }
      });
    };

    let syncState = null;
    let updateTimeDisplay = null;

    function setupToggle() {
      const toggle = document.getElementById('sync');
      syncState = getToggleState('sync');
      if (!syncState) return;

      const updateVisual = (value) => {
        toggle.classList.toggle('active', value);
        toggle.textContent = value ? 'ON' : 'OFF';
        if (updateTimeDisplay) updateTimeDisplay();
      };

      syncState.valueChangedEvent.addListener(() => updateVisual(syncState.getValue()));
      updateVisual(syncState.getValue());
      toggle.addEventListener('click', () => syncState.setValue(!syncState.getValue()));
    }

    function setupStandardKnob(paramId, min, max, formatFn) {
      const sliderState = getSliderState(paramId);
      const config = knobConfigs[paramId];
      if (!sliderState || !config) return;

      const vine = document.getElementById(config.vineId);
      const valueDisplay = document.getElementById(config.valueId);
      const knobEl = document.getElementById(`${paramId}-knob`);
      if (!vine || !valueDisplay || !knobEl) return;

      const initialNorm = sliderState.getNormalisedValue();
      animState.targets[paramId] = {
        current: initialNorm,
        target: initialNorm,
        vine: vine
      };
      vine.style.strokeDashoffset = ARC_LENGTH - (initialNorm * ARC_LENGTH);

      if (formatFn) {
        valueDisplay.textContent = formatFn(min + (initialNorm * (max - min)));
      }

      sliderState.valueChangedEvent.addListener(() => {
        const norm = sliderState.getNormalisedValue();
        animState.targets[paramId].target = norm;
        if (formatFn) {
          valueDisplay.textContent = formatFn(min + (norm * (max - min)));
        }
        startAnim();
      });

      // Drag
      const knobVisual = knobEl.querySelector('.knob-visual');
      knobVisual.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dragState.isDragging = true;
        dragState.target = paramId;
        dragState.startY = e.clientY;
        dragState.startValue = sliderState.getNormalisedValue();
        dragState.targetInfo = { sliderState, syncDrag: false };
        if (sliderState.sliderDragStarted) sliderState.sliderDragStarted();
      });

      // Mouse wheel
      knobEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.02 : -0.02;
        const newNorm = Math.max(0, Math.min(1, sliderState.getNormalisedValue() + delta));
        sliderState.setNormalisedValue(newNorm);
      }, { passive: false });
    }

    function setupTimeKnob() {
      const timeState = getSliderState('time');
      const divisionState = getComboBoxState('division');
      const config = knobConfigs.time;
      if (!timeState || !config) return;

      const vine = document.getElementById(config.vineId);
      const valueDisplay = document.getElementById(config.valueId);
      const knobEl = document.getElementById('time-knob');
      if (!vine || !valueDisplay || !knobEl) return;

      const initialNorm = timeState.getNormalisedValue();
      animState.targets.time = {
        current: initialNorm,
        target: initialNorm,
        vine: vine
      };
      vine.style.strokeDashoffset = ARC_LENGTH - (initialNorm * ARC_LENGTH);

      let syncNormalized = 0;

      const getDivisionIndex = () => getChoiceIndexSafe(divisionState);

      const updateVisual = () => {
        if (syncState?.getValue() && divisionState) {
          const divIndex = Math.max(0, Math.min(11, getDivisionIndex()));
          valueDisplay.textContent = musicalDivisions[divIndex].name;
          syncNormalized = divIndex / 11;
          animState.targets.time.target = syncNormalized;
        } else {
          const normalized = timeState.getNormalisedValue();
          animState.targets.time.target = normalized;
          valueDisplay.textContent = `${Math.round(1.0 + normalized * 1999.0)} ms`;
        }
        startAnim();
      };

      updateTimeDisplay = updateVisual;
      timeState.valueChangedEvent.addListener(updateVisual);
      divisionState?.valueChangedEvent.addListener(updateVisual);
      updateVisual();

      // Drag
      const knobVisual = knobEl.querySelector('.knob-visual');
      knobVisual.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const isSyncMode = syncState?.getValue() && divisionState;
        dragState.isDragging = true;
        dragState.target = 'time';

        if (isSyncMode) {
          syncNormalized = getDivisionIndex() / 11;
          dragState.startY = e.clientY;
          dragState.startValue = syncNormalized;
          dragState.targetInfo = {
            sliderState: timeState,
            syncDrag: true,
            syncNorm: syncNormalized,
            divisionState,
            getDivisionIndex
          };
        } else {
          dragState.startY = e.clientY;
          dragState.startValue = timeState.getNormalisedValue();
          dragState.targetInfo = { sliderState: timeState, syncDrag: false };
        }
        if (timeState.sliderDragStarted) timeState.sliderDragStarted();
      });

      // Mouse wheel
      knobEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (syncState?.getValue() && divisionState) {
          const currentDiv = getDivisionIndex();
          const newDiv = e.deltaY < 0
            ? Math.min(11, currentDiv + 1)
            : Math.max(0, currentDiv - 1);
          if (newDiv !== currentDiv) {
            try { divisionState.setChoiceIndex(newDiv); } catch {}
          }
        } else {
          const delta = e.deltaY < 0 ? 0.02 : -0.02;
          const newNorm = Math.max(0, Math.min(1, timeState.getNormalisedValue() + delta));
          timeState.setNormalisedValue(newNorm);
        }
      }, { passive: false });
    }

    // ============================================
    // BUTTERFLY FEEDBACK ECHO EFFECT
    // ============================================
    const ECHO_COUNT = 20;
    const ECHO_SHIFT_MIN = 5;       // min px shift per copy (short delay time)
    const ECHO_SHIFT_MAX = 30;      // max px shift per copy (long delay time)
    const ECHO_OPACITY = 0.02;      // each copy ~2% — accumulation creates density
    const BUTTERFLY_BASE_TOP = -520; // original butterfly top position

    function setupButterflyEchoes() {
      const feedbackState = getSliderState('feedback');
      const timeState = getSliderState('time');
      const wetState = getSliderState('wet');
      const divisionState = getComboBoxState('division');
      if (!feedbackState) return;

      const container = document.getElementById('butterfly-echoes');
      const echoes = [];
      let currentShift = ECHO_SHIFT_MIN;
      let currentOpacity = ECHO_OPACITY;

      for (let i = 0; i < ECHO_COUNT; i++) {
        const echo = document.createElement('div');
        echo.className = 'butterfly-echo';
        container.appendChild(echo);
        echoes.push(echo);
      }

      const repositionEchoes = () => {
        for (let i = 0; i < ECHO_COUNT; i++) {
          echoes[i].style.top = `${BUTTERFLY_BASE_TOP + (i + 1) * currentShift}px`;
        }
      };

      const updateEchoes = () => {
        const norm = feedbackState.getNormalisedValue(); // 0–1
        const numCopies = norm * ECHO_COUNT;             // 0–20 (continuous)
        const fullCopies = Math.floor(numCopies);
        const fractional = numCopies - fullCopies;

        for (let i = 0; i < ECHO_COUNT; i++) {
          if (i < fullCopies) {
            echoes[i].style.opacity = currentOpacity;
          } else if (i === fullCopies) {
            echoes[i].style.opacity = fractional * currentOpacity;
          } else {
            echoes[i].style.opacity = 0;
          }
        }
      };

      const updateShift = () => {
        let timeNorm;
        if (syncState?.getValue() && divisionState) {
          // Sync mode: use division factor to derive spacing
          const divIndex = Math.max(0, Math.min(11, getChoiceIndexSafe(divisionState)));
          timeNorm = musicalDivisions[divIndex].factor; // 0.167–1.5, clamped below
          timeNorm = Math.min(1, timeNorm); // clamp dotted values to 1
        } else {
          timeNorm = timeState ? timeState.getNormalisedValue() : 0;
        }
        currentShift = ECHO_SHIFT_MIN + timeNorm * (ECHO_SHIFT_MAX - ECHO_SHIFT_MIN);
        repositionEchoes();
      };

      const updateOpacity = () => {
        const wetNorm = wetState ? wetState.getNormalisedValue() : 0;
        currentOpacity = ECHO_OPACITY + wetNorm * (1.0 - ECHO_OPACITY); // 0.02 → 1.0
        updateEchoes();
      };

      feedbackState.valueChangedEvent.addListener(updateEchoes);
      if (wetState) wetState.valueChangedEvent.addListener(updateOpacity);
      if (timeState) timeState.valueChangedEvent.addListener(updateShift);
      if (divisionState) divisionState.valueChangedEvent.addListener(updateShift);
      if (syncState) syncState.valueChangedEvent.addListener(updateShift);
      updateShift();    // set initial positions
      updateOpacity();  // set initial opacity + visibility
    }

    document.addEventListener("DOMContentLoaded", () => {
      setupLEDMeter();

      setupToggle();
      setupTimeKnob();
      setupStandardKnob('feedback', 0.0, 100.0, v => `${Math.round(v)}%`);
      setupButterflyEchoes();
      setupStandardKnob('spread', 0.0, 100.0, v => `${Math.round(v)}%`);
      setupStandardKnob('mod', 0.0, 100.0, v => `${Math.round(v)}%`);
      setupStandardKnob('wet', 0.0, 100.0, v => `${Math.round(v)}%`);
      setupStandardKnob('dry', 0.0, 100.0, v => `${Math.round(v)}%`);

      const presetNameDisplay = document.getElementById('presetName');
      const presetDropdown = document.getElementById('presetDropdown');

      const presetManager = new PresetManager({
        displayElement: presetNameDisplay,
        prevButton: document.getElementById('prevPreset'),
        nextButton: document.getElementById('nextPreset'),
        saveButton: document.getElementById('savePreset'),
        loadButton: document.getElementById('loadPreset'),
        getNativeFunction: getNativeFunction,
        onPresetChanged: () => { hidePresetDropdown(); },
        onPresetListUpdated: () => {}
      });
      presetManager.initialize();

      function showPresetDropdown() {
        const presets = presetManager.getPresetList();
        presetDropdown.innerHTML = '';

        if (presets.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'preset-dropdown-item';
          empty.textContent = 'No presets available';
          empty.style.fontStyle = 'italic';
          empty.style.color = '#888';
          presetDropdown.appendChild(empty);
        } else {
          const header = document.createElement('div');
          header.className = 'preset-dropdown-header';
          header.textContent = 'Presets';
          presetDropdown.appendChild(header);

          presets.forEach(presetName => {
            const item = document.createElement('div');
            item.className = 'preset-dropdown-item';
            if (presetName === presetManager.getCurrentPreset()) {
              item.classList.add('active');
            }
            item.textContent = presetName;
            item.addEventListener('click', (e) => {
              e.stopPropagation();
              presetManager.loadPreset(presetName);
            });
            presetDropdown.appendChild(item);
          });
        }

        presetDropdown.classList.add('show');
      }

      function hidePresetDropdown() {
        presetDropdown.classList.remove('show');
      }

      presetNameDisplay.addEventListener('click', (e) => {
        e.stopPropagation();
        presetDropdown.classList.contains('show') ? hidePresetDropdown() : showPresetDropdown();
      });

      document.addEventListener('click', (e) => {
        if (!presetDropdown.contains(e.target) && e.target !== presetNameDisplay) {
          hidePresetDropdown();
        }
      });
    });
  </script>
</body>
</html>

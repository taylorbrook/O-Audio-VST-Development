<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>O-DigiDelay</title>

  <style>
    /* ============================================
       WEBVIEW CONSTRAINTS (CRITICAL)
       ============================================ */
    html, body {
      height: 100%;  /* REQUIRED - replaces viewport units */
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* ============================================
       NATIVE APPLICATION FEEL
       ============================================ */
    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============================================
       CONTAINER
       ============================================ */
    .container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #F5E6D3;
      font-family: Garamond, 'Times New Roman', serif;
      overflow: hidden;
    }

    /* ============================================
       BACKGROUND LAYER (Paper texture)
       ============================================ */
    .paper-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 700px;
      height: 196px;
      background-image: url('img/paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* ============================================
       BUTTERFLY OVERLAY (NATURAL SIZE - 800×1280px)
       ============================================ */
    .butterfly-overlay {
      position: absolute;
      left: calc(50% - 400px);
      top: -520px;
      width: 800px;
      height: 1280px;
      background-image: url('img/butterfly2_Black and white.png');
      background-size: 800px 1280px;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.30;
      z-index: 1;
      pointer-events: none;
    }

    /* ============================================
       HEADER ROW (Title + Preset Bar)
       ============================================ */
    .header {
      position: absolute;
      top: 8px;
      left: 16px;
      right: 66px; /* 50px extra margin to avoid output meter label */
      height: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .title {
      font-size: 16px;
      letter-spacing: 2.5px;
      color: #3C2F2F;
      font-weight: normal;
      white-space: nowrap;
    }

    /* ============================================
       PRESET BAR
       ============================================ */
    .preset-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 168, 112, 0.25);
      border: 2px solid #5C4033;
      border-radius: 4px;
      padding: 3px 6px;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.15);
      position: relative;
    }

    .preset-nav-btn {
      width: 20px;
      height: 20px;
      background: rgba(107, 142, 35, 0.4);
      border: 1px solid #3C5C1A;
      border-radius: 3px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 12px;
      font-weight: bold;
      color: #2C3E10;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .preset-nav-btn:hover {
      background: rgba(107, 142, 35, 0.6);
      transform: scale(1.05);
    }

    .preset-name {
      min-width: 80px;
      max-width: 120px;
      text-align: center;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 11px;
      color: #3C2F2F;
      padding: 2px 6px;
      background: rgba(255, 248, 220, 0.5);
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preset-name:hover {
      background: rgba(255, 248, 220, 0.8);
    }

    .preset-action-btn {
      padding: 2px 6px;
      background: rgba(107, 142, 35, 0.3);
      border: 1px solid #3C5C1A;
      border-radius: 3px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #2C3E10;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-action-btn:hover {
      background: rgba(107, 142, 35, 0.5);
    }

    /* Preset Dropdown Menu */
    .preset-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: rgba(255, 248, 220, 0.98);
      border: 2px solid #5C4033;
      border-radius: 4px;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.4);
      max-height: 180px;
      overflow-y: auto;
      z-index: 9999; /* Must be above all controls */
    }

    .preset-dropdown.show {
      display: block;
    }

    /* Elevate entire header when dropdown is open (escapes stacking context) */
    .header:has(.preset-dropdown.show) {
      z-index: 9999;
    }

    .preset-dropdown-header {
      padding: 3px 6px;
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8B7355;
      background: rgba(139, 115, 85, 0.1);
      border-bottom: 1px solid rgba(92, 64, 51, 0.2);
    }

    .preset-dropdown-item {
      padding: 4px 8px;
      font-size: 10px;
      color: #3C2F2F;
      cursor: pointer;
      border-bottom: 1px solid rgba(92, 64, 51, 0.1);
      transition: background 0.15s;
    }

    .preset-dropdown-item:hover {
      background: rgba(139, 168, 112, 0.3);
    }

    .preset-dropdown-item.active {
      background: rgba(107, 142, 35, 0.3);
      font-weight: bold;
    }

    .preset-dropdown-item.factory {
      font-style: italic;
    }

    /* ============================================
       CONTROLS CONTAINER
       ============================================ */
    .controls-row {
      position: absolute;
      top: 50px;
      left: 20px;
      width: 615px;
      height: 130px;
      z-index: 2;
    }

    /* ============================================
       KNOB STYLES (10-segment botanical seed)
       ============================================ */
    .knob-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .knob-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
      width: 60px;
    }

    .knob {
      width: 60px;
      height: 60px;
      position: relative;
      cursor: pointer;
      transform-origin: center center;
    }

    .knob-body {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #8B7355;
      background: conic-gradient(
        from 0deg,
        #F5DEB3 0deg 36deg,
        #E8D5B7 36deg 72deg,
        #F5DEB3 72deg 108deg,
        #E8D5B7 108deg 144deg,
        #F5DEB3 144deg 180deg,
        #E8D5B7 180deg 216deg,
        #F5DEB3 216deg 252deg,
        #E8D5B7 252deg 288deg,
        #F5DEB3 288deg 324deg,
        #E8D5B7 324deg 360deg
      );
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);
      position: relative;
    }

    .knob-indicator {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 2px;
      height: 16px;
      background: #3C2F2F;
      transform: translateX(-50%);
    }

    .value-display {
      margin-top: 4px;
      width: 60px;
      height: 18px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #3C2F2F;
      padding: 0;
    }

    /* ============================================
       TOGGLE BUTTON (SYNC)
       ============================================ */
    .toggle-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toggle-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
    }

    .toggle {
      width: 50px;
      height: 24px;
      border: 2px solid #3C5C1A;
      border-radius: 4px;
      background: rgba(139, 168, 112, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      cursor: pointer;
      transition: background 100ms;
    }

    .toggle.active {
      background: rgba(107, 142, 35, 0.6);
    }

    /* ============================================
       LED METER (OuariconComp style)
       ============================================ */
    .led-meter-container {
      position: absolute;
      top: 25px;
      left: 645px;
      width: 18px;
      height: 155px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .led-meter-label {
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #3C2F2F;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: center;
      width: 18px;
    }

    .led-meter {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      background: rgba(139, 115, 85, 0.1);
      border: 1px solid #8B7355;
      padding: 4px;
      border-radius: 2px;
      width: 18px;
      height: 140px;
    }

    .led-segment {
      width: 100%;
      height: 10px;
      background: #8B7355;
      border-radius: 1px;
      transition: background 100ms, box-shadow 100ms;
    }

    .led-segment.active-low {
      background: #8BA870;
      box-shadow: 0 0 4px #8BA870;
    }

    .led-segment.active-mid {
      background: #6B8E4E;
      box-shadow: 0 0 4px #6B8E4E;
    }

    .led-segment.active-high {
      background: #C9A27B;
      box-shadow: 0 0 4px #C9A27B;
    }

    /* ============================================
       CONTROL POSITIONING
       ============================================ */
    #sync-container {
      top: 4px;
      left: 10px;
    }

    #time-container {
      top: 4px;
      left: 95px;
    }

    #feedback-container {
      top: 4px;
      left: 175px;
    }

    #spread-container {
      top: 4px;
      left: 255px;
    }

    #mod-container {
      top: 4px;
      left: 335px;
    }

    #wet-container {
      top: 4px;
      left: 415px;
    }

    #dry-container {
      top: 4px;
      left: 495px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LAYER 0: Paper background -->
    <div class="paper-background"></div>

    <!-- LAYER 1: Butterfly overlay -->
    <div class="butterfly-overlay"></div>

    <!-- LAYER 2+: UI Elements -->
    <div class="header">
      <div class="title">O-DIGIDELAY</div>
      <div class="preset-bar">
        <button class="preset-nav-btn" id="prevPreset" title="Previous preset">&lt;</button>
        <span class="preset-name" id="presetName" title="Click to see all presets">Default</span>
        <button class="preset-nav-btn" id="nextPreset" title="Next preset">&gt;</button>
        <button class="preset-action-btn" id="loadPreset" title="Load preset from file">Load</button>
        <button class="preset-action-btn" id="savePreset" title="Save current settings">Save</button>
        <div class="preset-dropdown" id="presetDropdown"></div>
      </div>
    </div>

    <div class="controls-row">
      <!-- SYNC TOGGLE -->
      <div id="sync-container" class="toggle-container">
        <div class="toggle-label">SYNC</div>
        <div id="sync" class="toggle">OFF</div>
      </div>

      <!-- TIME KNOB -->
      <div id="time-container" class="knob-container">
        <div class="knob-label">TIME</div>
        <div class="knob" id="time-knob">
          <div class="knob-body">
            <div class="knob-indicator"></div>
          </div>
        </div>
        <div class="value-display" id="time-value">500 ms</div>
      </div>

      <!-- FEEDBACK KNOB -->
      <div id="feedback-container" class="knob-container">
        <div class="knob-label">FEEDBACK</div>
        <div class="knob" id="feedback-knob">
          <div class="knob-body">
            <div class="knob-indicator"></div>
          </div>
        </div>
        <div class="value-display" id="feedback-value">30%</div>
      </div>

      <!-- SPREAD KNOB -->
      <div id="spread-container" class="knob-container">
        <div class="knob-label">SPREAD</div>
        <div class="knob" id="spread-knob">
          <div class="knob-body">
            <div class="knob-indicator"></div>
          </div>
        </div>
        <div class="value-display" id="spread-value">0%</div>
      </div>

      <!-- MOD KNOB -->
      <div id="mod-container" class="knob-container">
        <div class="knob-label">MOD</div>
        <div class="knob" id="mod-knob">
          <div class="knob-body">
            <div class="knob-indicator"></div>
          </div>
        </div>
        <div class="value-display" id="mod-value">0%</div>
      </div>

      <!-- WET KNOB -->
      <div id="wet-container" class="knob-container">
        <div class="knob-label">WET</div>
        <div class="knob" id="wet-knob">
          <div class="knob-body">
            <div class="knob-indicator"></div>
          </div>
        </div>
        <div class="value-display" id="wet-value">30%</div>
      </div>

      <!-- DRY KNOB -->
      <div id="dry-container" class="knob-container">
        <div class="knob-label">DRY</div>
        <div class="knob" id="dry-knob">
          <div class="knob-body">
            <div class="knob-indicator"></div>
          </div>
        </div>
        <div class="value-display" id="dry-value">100%</div>
      </div>
    </div>

    <!-- LED METER -->
    <div class="led-meter-container">
      <div class="led-meter-label">OUT</div>
      <div class="led-meter" id="led-meter">
        <!-- 14 segments, populated by JavaScript -->
      </div>
    </div>
  </div>

  <script type="module" src="js/juce/index.js"></script>
  <script type="module">
    import { getSliderState, getToggleState, getComboBoxState, getNativeFunction } from './js/juce/index.js';
    import { PresetManager } from './modules/preset-manager.js';

    // ============================================
    // MUSICAL DIVISIONS TABLE (matches C++ subdivisionFactors)
    // ============================================
    const musicalDivisions = [
      { name: "1/4",    factor: 1.0 },
      { name: "1/8",    factor: 0.5 },
      { name: "1/16",   factor: 0.25 },
      { name: "1/4D",   factor: 1.5 },    // Dotted
      { name: "1/8D",   factor: 0.75 },
      { name: "1/16D",  factor: 0.375 },
      { name: "1/4T",   factor: 0.667 },  // Triplet
      { name: "1/8T",   factor: 0.333 },
      { name: "1/16T",  factor: 0.167 },
      { name: "1/4(5)", factor: 0.8 },    // Quintuplet
      { name: "1/8(5)", factor: 0.4 },
      { name: "1/16(5)", factor: 0.2 }
    ];

    // ============================================
    // DISABLE CONTEXT MENU
    // ============================================
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // ============================================
    // LED METER SETUP
    // ============================================
    function setupLEDMeter() {
      const meterContainer = document.getElementById('led-meter');

      for (let i = 0; i < 14; i++) {
        const segment = document.createElement('div');
        segment.className = 'led-segment';
        segment.dataset.index = i;
        meterContainer.appendChild(segment);
      }
    }

    // ============================================
    // UPDATE LED METER FROM RMS DATA (exposed globally for C++ calls)
    // ============================================
    window.updateLEDMeter = function(rmsLevel) {
      const segments = document.getElementById('led-meter').querySelectorAll('.led-segment');

      // Apply gain boost and logarithmic curve for better visual response
      const boostedLevel = rmsLevel * 6.0;
      const logLevel = boostedLevel > 0 ? Math.log10(1 + boostedLevel * 9) : 0;
      const activeCount = Math.floor(Math.min(1.0, Math.max(0.0, logLevel)) * 14);

      segments.forEach((segment, index) => {
        segment.classList.remove('active-low', 'active-mid', 'active-high');
        if (index < activeCount) {
          const levelClass = index < 5 ? 'active-low' : index < 10 ? 'active-mid' : 'active-high';
          segment.classList.add(levelClass);
        }
      });
    };

    // ============================================
    // KNOB INTERACTION (Relative drag)
    // ============================================
    function setupKnob(paramId, min, max, defaultValue, formatFn) {
      const knob = document.getElementById(`${paramId}-knob`);
      const valueDisplay = document.getElementById(`${paramId}-value`);
      const sliderState = getSliderState(paramId);

      if (!sliderState) {
        console.error(`Failed to get slider state for ${paramId}`);
        return;
      }

      let rotation = -135;
      let lastY = 0;
      let isDragging = false;

      // Update visual from normalized value
      function updateVisual(normalized) {
        rotation = -135 + (normalized * 270);
        knob.querySelector('.knob-body').style.transform = `rotate(${rotation}deg)`;

        const value = min + (normalized * (max - min));
        valueDisplay.textContent = formatFn(value);
      }

      // Initialize from current state
      sliderState.valueChangedEvent.addListener(() => {
        updateVisual(sliderState.getNormalisedValue());
      });
      updateVisual(sliderState.getNormalisedValue());

      // Mouse interaction (relative drag)
      knob.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastY = e.clientY;
        knob.style.cursor = 'grabbing';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const deltaY = lastY - e.clientY;
        const rotationDelta = deltaY * 0.5;
        rotation = Math.max(-135, Math.min(135, rotation + rotationDelta));

        const normalized = (rotation + 135) / 270;
        sliderState.setNormalisedValue(normalized);

        lastY = e.clientY;
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          knob.style.cursor = 'pointer';
        }
      });
    }

    // ============================================
    // TOGGLE INTERACTION (SYNC)
    // ============================================
    let syncState = null;
    let updateTimeDisplay = null;

    function setupToggle() {
      const toggle = document.getElementById('sync');
      syncState = getToggleState('sync');

      if (!syncState) {
        console.error('Failed to get toggle state for sync');
        return;
      }

      const updateVisual = (value) => {
        toggle.classList.toggle('active', value);
        toggle.textContent = value ? 'ON' : 'OFF';
        if (updateTimeDisplay) updateTimeDisplay();
      };

      syncState.valueChangedEvent.addListener(() => updateVisual(syncState.getValue()));
      updateVisual(syncState.getValue());
      toggle.addEventListener('click', () => syncState.setValue(!syncState.getValue()));
    }

    // ============================================
    // TIME KNOB SETUP
    // Sync OFF: controls time in ms (continuous)
    // Sync ON: controls division selection (snaps to 12 discrete values)
    // ============================================
    function setupTimeKnob() {
      const knob = document.getElementById('time-knob');
      const knobBody = knob.querySelector('.knob-body');
      const valueDisplay = document.getElementById('time-value');
      const timeState = getSliderState('time');
      const divisionState = getComboBoxState('division');

      if (!timeState) {
        console.error('Failed to get slider state for time');
        return;
      }

      let rotation = -135;
      let lastY = 0;
      let isDragging = false;
      let syncNormalized = 0;

      const getDivisionIndex = () => {
        try { return divisionState?.getChoiceIndex() ?? 0; }
        catch { return 0; }
      };

      const setRotation = (normalized) => {
        rotation = -135 + (normalized * 270);
        knobBody.style.transform = `rotate(${rotation}deg)`;
      };

      const updateVisual = () => {
        const isSync = syncState?.getValue();

        if (isSync && divisionState) {
          const divIndex = Math.max(0, Math.min(11, getDivisionIndex()));
          valueDisplay.textContent = musicalDivisions[divIndex].name;
          syncNormalized = divIndex / 11;
          setRotation(syncNormalized);
        } else {
          const normalized = timeState.getNormalisedValue();
          setRotation(normalized);
          valueDisplay.textContent = `${Math.round(1.0 + normalized * 1999.0)} ms`;
        }
      };

      updateTimeDisplay = updateVisual;

      timeState.valueChangedEvent.addListener(updateVisual);
      divisionState?.valueChangedEvent.addListener(updateVisual);
      updateVisual();

      knob.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastY = e.clientY;
        knob.style.cursor = 'grabbing';
        if (syncState?.getValue() && divisionState) {
          syncNormalized = getDivisionIndex() / 11;
        }
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const deltaY = lastY - e.clientY;
        const isSync = syncState?.getValue();

        if (isSync && divisionState) {
          syncNormalized = Math.max(0, Math.min(1, syncNormalized + deltaY * 0.005));
          const newDiv = Math.round(syncNormalized * 11);
          if (newDiv !== getDivisionIndex()) {
            try { divisionState.setChoiceIndex(newDiv); } catch {}
          }
        } else {
          rotation = Math.max(-135, Math.min(135, rotation + deltaY * 0.5));
          timeState.setNormalisedValue((rotation + 135) / 270);
        }

        lastY = e.clientY;
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          knob.style.cursor = 'pointer';
        }
      });
    }

    // ============================================
    // INITIALIZE ALL CONTROLS
    // ============================================
    document.addEventListener("DOMContentLoaded", () => {
      setupLEDMeter();

      // Setup sync toggle first (needed by time knob)
      setupToggle();

      // Setup time knob with tempo sync support
      setupTimeKnob();

      // Setup other knobs
      setupKnob('feedback', 0.0, 100.0, 30.0, v => `${Math.round(v)}%`);
      setupKnob('spread', 0.0, 100.0, 0.0, v => `${Math.round(v)}%`);
      setupKnob('mod', 0.0, 100.0, 0.0, v => `${Math.round(v)}%`);
      setupKnob('wet', 0.0, 100.0, 30.0, v => `${Math.round(v)}%`);
      setupKnob('dry', 0.0, 100.0, 100.0, v => `${Math.round(v)}%`);

      // ============================================
      // PRESET MANAGER INITIALIZATION
      // ============================================
      const presetNameDisplay = document.getElementById('presetName');
      const presetDropdown = document.getElementById('presetDropdown');

      const presetManager = new PresetManager({
        displayElement: presetNameDisplay,
        prevButton: document.getElementById('prevPreset'),
        nextButton: document.getElementById('nextPreset'),
        saveButton: document.getElementById('savePreset'),
        loadButton: document.getElementById('loadPreset'),
        getNativeFunction: getNativeFunction,
        onPresetChanged: (name) => {
          console.log('Preset loaded:', name);
          hidePresetDropdown();
        },
        onPresetListUpdated: (list) => {
          console.log('Preset list updated:', list.length, 'presets');
        }
      });
      presetManager.initialize();

      // Preset dropdown functionality
      function showPresetDropdown() {
        const presets = presetManager.getPresetList();
        presetDropdown.innerHTML = '';

        if (presets.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'preset-dropdown-item';
          empty.textContent = 'No presets available';
          empty.style.fontStyle = 'italic';
          empty.style.color = '#888';
          presetDropdown.appendChild(empty);
        } else {
          // Add Factory section header
          const factoryHeader = document.createElement('div');
          factoryHeader.className = 'preset-dropdown-header';
          factoryHeader.textContent = 'Presets';
          presetDropdown.appendChild(factoryHeader);

          // Add each preset
          presets.forEach(presetName => {
            const item = document.createElement('div');
            item.className = 'preset-dropdown-item';
            if (presetName === presetManager.getCurrentPreset()) {
              item.classList.add('active');
            }
            item.textContent = presetName;
            item.addEventListener('click', (e) => {
              e.stopPropagation();
              presetManager.loadPreset(presetName);
            });
            presetDropdown.appendChild(item);
          });
        }

        presetDropdown.classList.add('show');
      }

      function hidePresetDropdown() {
        presetDropdown.classList.remove('show');
      }

      // Click on preset name to show dropdown
      presetNameDisplay.addEventListener('click', (e) => {
        e.stopPropagation();
        if (presetDropdown.classList.contains('show')) {
          hidePresetDropdown();
        } else {
          showPresetDropdown();
        }
      });

      // Click outside to close dropdown
      document.addEventListener('click', (e) => {
        if (!presetDropdown.contains(e.target) && e.target !== presetNameDisplay) {
          hidePresetDropdown();
        }
      });
    });
  </script>
</body>
</html>

# v3 UI Design Specification
# Generated: 2026-01-12
# Plugin: Ouaricon Digital Delay
# Aesthetic: Ouaricon Audio Naturalist (botanical overlay, paper texture)
# Layout: Ultra-compact rack mount style - reduced vertical dimension, labels above/values below

window:
  width: 700
  height: 196
  resizable: false

colors:
  background: "#F5E6D3"  # Aged paper fallback
  text: "#3C2F2F"  # Dark brown
  border: "#8B7355"  # Walnut brown
  accent_green: "#6B8E4E"  # Toggle active state
  accent_green_hover: "#8BAF70"  # Hover state
  knob_segment_light: "#F5DEB3"  # Cream
  knob_segment_dark: "#E8D5B7"  # Slightly darker cream
  knob_border: "#8B7355"  # Brown border
  value_display_bg: "#FFFFFF"  # White background for displays
  value_display_border: "#C4B5A0"  # Light brown border

typography:
  family: "Garamond, 'Times New Roman', serif"
  title_size: "16px"
  title_spacing: "2.5px"
  label_size: "9px"
  label_spacing: "0.8px"
  value_size: "11px"

layout:
  type: horizontal
  description: "Ultra-compact rack mount - labels above, values below, reduced height"
  sections:
    - id: header
      description: "Plugin title area (minimal for ultra-compact style)"
      region: { x: 0, y: 0, width: 700, height: 32 }

    - id: controls_row
      description: "All controls in single horizontal row with compact vertical spacing"
      region: { x: 20, y: 50, width: 660, height: 130 }

controls:
  # SYNC TOGGLE (First control - left side)
  - id: sync
    type: toggle
    label: "SYNC"
    parameter: "sync"
    default: false
    position: { x: 30, y: 80 }
    size: { width: 50, height: 24 }
    style: botanical_toggle
    description: "Enable/disable tempo sync"

  # DIVISION DROPDOWN (Second control - below SYNC)
  - id: division
    type: combo
    label: "DIVISION"
    parameter: "division"
    parameter_type: choice
    choices: ["1/4", "1/8", "1/16", "1/4D", "1/8D", "1/16D", "1/4T", "1/8T", "1/16T", "1/4(5)", "1/8(5)", "1/16(5)"]
    default: 1  # 1/8
    position: { x: 20, y: 118 }
    size: { width: 70, height: 22 }
    style: botanical_dropdown
    description: "Note subdivision when synced to tempo"

  # TIME KNOB (Third control)
  - id: time
    type: knob
    label: "TIME"
    parameter: "time"
    range: [1.0, 2000.0]
    unit: "ms"
    default: 500.0
    decimals: 0
    position: { x: 115, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Primary delay time control in free mode"

  # FEEDBACK KNOB
  - id: feedback
    type: knob
    label: "FEEDBACK"
    parameter: "feedback"
    range: [0.0, 100.0]
    unit: "%"
    default: 30.0
    decimals: 0
    position: { x: 210, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Amount of repeats"

  # SPREAD KNOB
  - id: spread
    type: knob
    label: "SPREAD"
    parameter: "spread"
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0
    decimals: 0
    position: { x: 305, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Stereo width (0=preserve input, 100=wide)"

  # MOD KNOB
  - id: mod
    type: knob
    label: "MOD"
    parameter: "mod"
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0
    decimals: 0
    position: { x: 400, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Delay time modulation amount"

  # WET KNOB (NEW - replaces single MIX)
  - id: wet
    type: knob
    label: "WET"
    parameter: "wet"
    range: [0.0, 100.0]
    unit: "%"
    default: 30.0
    decimals: 0
    position: { x: 495, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Wet signal level"

  # DRY KNOB (NEW - replaces single MIX)
  - id: dry
    type: knob
    label: "DRY"
    parameter: "dry"
    range: [0.0, 100.0]
    unit: "%"
    default: 100.0
    decimals: 0
    position: { x: 590, y: 70 }
    size: { diameter: 60 }
    style: botanical_seed
    description: "Dry signal level"

# Value displays (below each knob)
value_displays:
  - id: time_value
    for: time
    position: { x: 115, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value} ms"
    style: value_display

  - id: feedback_value
    for: feedback
    position: { x: 210, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display

  - id: spread_value
    for: spread
    position: { x: 305, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display

  - id: mod_value
    for: mod
    position: { x: 400, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display

  - id: wet_value
    for: wet
    position: { x: 495, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display

  - id: dry_value
    for: dry
    position: { x: 590, y: 152 }
    size: { width: 60, height: 18 }
    format: "{value}%"
    style: value_display

# Labels (above each knob)
labels:
  - id: time_label
    for: time
    text: "TIME"
    position: { x: 115, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: feedback_label
    for: feedback
    text: "FEEDBACK"
    position: { x: 210, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: spread_label
    for: spread
    text: "SPREAD"
    position: { x: 305, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: mod_label
    for: mod
    text: "MOD"
    position: { x: 400, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: wet_label
    for: wet
    text: "WET"
    position: { x: 495, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

  - id: dry_label
    for: dry
    text: "DRY"
    position: { x: 590, y: 54 }
    size: { width: 60, height: 12 }
    style: knob_label

special_elements:
  # PLUGIN TITLE
  - id: title
    type: text
    text: "OUARICON DIGITAL DELAY"
    position: { x: 0, y: 12 }
    size: { width: 700, height: 22 }
    align: center
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "16px"
    letter_spacing: "2.5px"
    color: "#3C2F2F"
    layer: decorative

  # BACKGROUND TEXTURE
  - id: paper_background
    type: image
    src: "img/paper1.jpg"
    position: { x: 0, y: 0 }
    size: { width: 700, height: 196 }
    opacity: 1.0
    layer: background
    description: "Aged paper texture background"

  # BOTANICAL OVERLAY (Right side, smaller and more subtle)
  - id: butterfly_overlay
    type: image
    src: "img/butterfly2_Black and white.png"
    position: { x: 605, y: 50 }
    size: { width: 80, height: 105 }
    opacity: 0.18
    layer: decorative
    description: "Botanical butterfly illustration (right side, very subtle)"

control_styles:
  botanical_seed:
    description: "10-segment seed cross-section design"
    knob_type: conic_gradient
    segments: 10
    segment_colors: ["#F5DEB3", "#E8D5B7"]  # Alternating cream tones
    border_width: 2
    border_color: "#8B7355"
    shadow: "inset 0 1px 2px rgba(0,0,0,0.15)"
    indicator_type: line
    indicator_color: "#3C2F2F"
    indicator_width: 2
    rotation_range: [-135, 135]  # 270 degrees total

  botanical_toggle:
    description: "Green tint when active"
    background_inactive: "rgba(139, 168, 112, 0.3)"
    background_active: "rgba(107, 142, 35, 0.6)"
    border_width: 2
    border_color: "#3C5C1A"
    border_radius: 4
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "9px"
    letter_spacing: "0.8px"

  botanical_dropdown:
    description: "Matches toggle style with aged paper background"
    background: "#F5E6D3"
    border_width: 2
    border_color: "#8B7355"
    border_radius: 4
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "9px"
    accent_color: "#6B8E4E"  # Green on hover/focus

  value_display:
    description: "White background, light brown border, centered text"
    background: "#FFFFFF"
    border_width: 1
    border_color: "#C4B5A0"
    border_radius: 3
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "11px"
    text_align: center
    padding: 2

  knob_label:
    description: "Small uppercase labels above knobs"
    text_color: "#3C2F2F"
    font_family: "Garamond, 'Times New Roman', serif"
    font_size: "9px"
    letter_spacing: "0.8px"
    text_transform: uppercase
    text_align: center

spacing:
  edge_margin: 20  # Minimum from window edges
  control_gap_horizontal: 35  # Tighter spacing for 6 knobs
  control_gap_vertical: 14  # Vertical spacing between SYNC and DIVISION
  label_gap: 4  # Gap between label and knob
  value_gap: 4  # Gap between knob and value display

notes:
  - "All positions in pixels from top-left (0,0)"
  - "Ultra-compact rack mount: 700×196px (70% of v2 height)"
  - "Layout: SYNC/DIVISION (stacked left) → TIME → FEEDBACK → SPREAD → MOD → WET → DRY (6 knobs)"
  - "SYNC at x=30, DIVISION below at x=20 (stacked, left side)"
  - "Knobs: TIME x=115, FEEDBACK x=210, SPREAD x=305, MOD x=400, WET x=495, DRY x=590 (95px spacing)"
  - "Labels ABOVE each knob (y=54), value displays BELOW each knob (y=152)"
  - "MIX parameter split into separate WET and DRY controls"
  - "Botanical overlay even smaller (80×105px) and more subtle (18% opacity)"
  - "Title reduced to 16px for compact header"
  - "Value displays: white background, light brown border, centered text, 60×18px"
  - "Parameter IDs must match C++ exactly (lowercase, snake_case)"

# v3 UI Design Specification
# Generated: 2026-01-14
# Plugin: OuariconPolyRepeater
# Version: v3 (refinements: remove Mix/Swing, always-visible pattern sequencer, per-lane freeze)

window:
  width: 1000
  height: 750
  resizable: false

colors:
  background: paper  # img/paper-background.jpg
  primary: "#8B7355"  # Brown
  secondary: "#6B8E4E"  # Green
  text: "#3C2F2F"  # Dark brown
  accent: "#8BA870"  # Light green
  progress_fill: "#6B8E4E"  # Green
  step_active: "rgba(107, 142, 78, 0.6)"
  step_inactive: "rgba(245, 230, 211, 0.5)"

typography:
  title_font: "'Garamond', 'Times New Roman', serif"
  label_font: "'Garamond', 'Times New Roman', serif"
  title_size: "24px"
  label_size: "10px"
  value_size: "9px"
  letter_spacing: "2px"  # Title
  label_letter_spacing: "0.8px"  # Labels (uppercase)

layout:
  type: custom
  sections:
    - id: header
      height: 80
      controls: [title, botanical_overlay]
    - id: lanes
      height: 340
      controls: [lane1, lane2, lane3, lane4]
    - id: pattern_sequencer
      height: 130
      collapsed: false  # ALWAYS VISIBLE
      controls: [pattern_grid]
    - id: tape_section
      height: 120
      controls: [sat, wow, flutter, hiss, rolloff, dropout]
    - id: footer
      height: 80
      controls: [env_toggle, sc_toggle, midi_toggle, trig_toggle]

controls:
  # Lane 1 Controls (3x3 grid)
  - id: lane1_enabled
    type: toggle
    label: "LANE 1"
    parameter: "lane1_enabled"
    default: true
    position: { x: 20, y: 95 }
    size: { width: 60, height: 24 }

  - id: lane1_progress
    type: progress_bar
    data_source: "lane1_playback_position"
    position: { x: 20, y: 125 }
    size: { width: 220, height: 8 }

  # Row 1
  - id: lane1_subdivision
    type: combo
    label: "SUBDIV"
    parameter: "lane1_subdivision"
    choices: ["1/4", "1/8", "1/16", "1/32", "1/8T", "1/16T"]
    default: 2  # 1/16
    position: { x: 35, y: 158 }
    size: { width: 50, height: 50, diameter: 50 }

  - id: lane1_repeats
    type: knob
    label: "REPS"
    parameter: "lane1_repeats"
    range: [1, 16]
    default: 4
    decimals: 0
    position: { x: 105, y: 158 }
    size: { width: 50, height: 50, diameter: 50 }

  - id: lane1_decay
    type: knob
    label: "DECAY"
    parameter: "lane1_decay"
    range: [0, 100]
    default: 90
    decimals: 0
    unit: "%"
    position: { x: 175, y: 158 }
    size: { width: 50, height: 50, diameter: 50 }

  # Row 2
  - id: lane1_pitch
    type: knob
    label: "PITCH"
    parameter: "lane1_pitch"
    range: [-12, 12]
    default: 0
    decimals: 0
    unit: "st"
    position: { x: 35, y: 238 }
    size: { width: 50, height: 50, diameter: 50 }

  - id: lane1_filter
    type: knob
    label: "FILTR"
    parameter: "lane1_filter"
    range: [-100, 100]
    default: 0
    decimals: 0
    position: { x: 105, y: 238 }
    size: { width: 50, height: 50, diameter: 50 }

  - id: lane1_probability
    type: knob
    label: "PROB"
    parameter: "lane1_probability"
    range: [0, 100]
    default: 100
    decimals: 0
    unit: "%"
    position: { x: 175, y: 238 }
    size: { width: 50, height: 50, diameter: 50 }

  # Row 3
  - id: lane1_volume
    type: knob
    label: "VOL"
    parameter: "lane1_volume"
    range: [0, 100]
    default: 100
    decimals: 0
    unit: "%"
    position: { x: 35, y: 318 }
    size: { width: 50, height: 50, diameter: 50 }

  - id: lane1_pan
    type: knob
    label: "PAN"
    parameter: "lane1_pan"
    range: [-100, 100]
    default: 0
    decimals: 0
    position: { x: 105, y: 318 }
    size: { width: 50, height: 50, diameter: 50 }

  - id: lane1_swing
    type: knob
    label: "SWING"
    parameter: "lane1_swing"
    range: [0, 100]
    default: 0
    decimals: 0
    unit: "%"

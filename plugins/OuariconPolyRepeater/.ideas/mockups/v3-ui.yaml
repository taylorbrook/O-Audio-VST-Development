    size: { width: 180, height: 450 }
    opacity: 0.32
    layer: decorative

notes:
  - All positions in pixels from top-left (0,0)
  - Each lane has 3x3 grid of knobs (9 knobs total)
  - Each lane has 4 toggle buttons (PING, REV, MAN, FRZ)
  - Progress bar per lane shows playback position
  - Labels ABOVE knobs, values BELOW knobs
  - Background uses img/paper-background.jpg
  - Botanical overlay uses img/botanical-bug.png (right side)
  - Pattern sequencer ALWAYS VISIBLE (16×4 grid)
  - Tape degradation section below pattern sequencer
  - Footer simplified to just trigger mode toggles (ENV, SC, MIDI, TRIG)
  - No global Mix, Swing, Freeze, or Mode dropdown

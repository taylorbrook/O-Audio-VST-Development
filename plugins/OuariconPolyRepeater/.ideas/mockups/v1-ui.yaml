notes:
  - Botanical insect overlay (butterfly/geometric) at right side, 60% height, 0.35 opacity
  - Lane sections have subtle brown borders (#8B7355) separating them
  - Pattern sequencer expands to show 16x4 step grid when toggled
  - All knobs use 10-segment seed cross-section design
  - Tape degradation section has warm brown border suggesting analog warmth
  - Labels are UPPERCASE with 0.8px letter-spacing
  - Toggle active states use green shades from palette

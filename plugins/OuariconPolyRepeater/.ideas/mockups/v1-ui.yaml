# v1 UI Design Specification
# Generated: 2026-01-14
# Plugin: OuariconPolyRepeater
# Aesthetic: Ouaricon Naturalist 001

version: 1
plugin_name: OuariconPolyRepeater
aesthetic: ouaricon-naturalist-001

dimensions:
  width: 1000
  height: 700
  resizable: false

colors:
  aged_paper: "#EBD9C7"
  background: "#F5E6D3"
  brown_border: "#8B7355"
  brown_frame: "#5C4033"
  brown_text: "#3C2F2F"
  green_active: "#8BA870"
  green_hover: "#6B8E4E"
  green_border: "#3C5C1A"
  green_darker: "#2C3E10"
  knob_cream_1: "#F5DEB3"
  knob_cream_2: "#E8D5B7"
  knob_core: "#FFF8DC"
  toggle_default_bg: "rgba(139, 168, 112, 0.3)"
  toggle_active_bg: "rgba(107, 142, 35, 0.6)"

typography:
  title_font: "'Garamond', 'Times New Roman', serif"
  label_font: "'Garamond', 'Times New Roman', serif"
  title_size: "24px"
  title_spacing: "3px"
  label_size: "10px"
  label_spacing: "0.8px"

layout:
  type: custom
  sections:
    - id: header
      position: {x: 0, y: 0}
      size: {width: 1000, height: 60}
      controls: [title, subtitle]

    - id: lane_strips
      position: {x: 20, y: 80}
      size: {width: 960, height: 280}
      controls: [lane1_section, lane2_section, lane3_section, lane4_section]

    - id: pattern_sequencer
      position: {x: 20, y: 380}
      size: {width: 960, height: 160}
      controls: [sequencer_toggle, pattern_grid]

    - id: tape_degradation
      position: {x: 20, y: 555}
      size: {width: 960, height: 80}
      controls: [tape_section]

    - id: global_controls
      position: {x: 20, y: 650}
      size: {width: 960, height: 40}
      controls: [global_section]

# Lane Controls (4 identical lanes)
controls:
  # Header
  - id: title
    type: label
    text: "POLY REPEATER"
    position: {x: 350, y: 15}
    size: {width: 300, height: 30}
    font_size: 24
    text_align: center

  - id: subtitle
    type: label
    text: "Polyrhythmic Beat Repeater"
    position: {x: 380, y: 40}
    size: {width: 240, height: 15}
    font_size: 11
    text_align: center

  # Lane 1 Controls
  - id: lane1_enable
    type: toggle
    label: "LANE 1"
    parameter: "lane1_enable"
    default: true
    position: {x: 35, y: 95}
    size: {width: 50, height: 20}

  - id: lane1_subdivision
    type: combo
    label: "Division"
    parameter: "lane1_subdivision"
    choices: ["1/4", "1/8", "1/16", "1/32", "1/8T", "1/16T"]
    default: 1
    position: {x: 30, y: 125}
    size: {width: 60, height: 24}

  - id: lane1_manual_toggle
    type: toggle
    label: "Manual"
    parameter: "lane1_manual_toggle"
    default: false
    position: {x: 30, y: 160}
    size: {width: 60, height: 20}

  - id: lane1_manual_time
    type: knob
    label: "Time"
    parameter: "lane1_manual_time"
    range: [10.0, 2000.0]
    unit: "ms"
    default: 500.0
    position: {x: 35, y: 190}
    size: {diameter: 50}

  - id: lane1_repeats
    type: knob
    label: "Repeats"
    parameter: "lane1_repeats"
    range: [1, 16]
    default: 4
    position: {x: 105, y: 125}
    size: {diameter: 50}

  - id: lane1_decay
    type: knob
    label: "Decay"
    parameter: "lane1_decay"
    range: [0.0, 1.0]
    default: 0.7
    position: {x: 165, y: 125}
    size: {diameter: 50}

  - id: lane1_pitch
    type: knob
    label: "Pitch"
    parameter: "lane1_pitch"
    range: [-12.0, 12.0]
    unit: "st"
    default: 0.0
    position: {x: 225, y: 125}
    size: {diameter: 50}

  - id: lane1_filter
    type: knob
    label: "Filter"
    parameter: "lane1_filter"
    range: [20.0, 20000.0]
    unit: "Hz"
    default: 10000.0
    skew: 0.3

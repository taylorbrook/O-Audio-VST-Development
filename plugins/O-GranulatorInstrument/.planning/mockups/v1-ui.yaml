test_html:
  file: v1-ui-test.html
  self_contained: "single file; EB Garamond woff2 embedded; mock JUCE backend (getSliderState / getToggleState / getComboBoxState / getNativeFunction), every call logged"
  animation: "scripted MIDI: 3-note chords every 4.2 s (A2 E3 C#4, F#2 C#3 A3, ...), amp release 2.4 s -> ~3 held + 3 fading voices; per-voice scan, grains, playheads, feedback heads, mod sources, voice strip"
  hash_flags:
    "#empty": "all four slots empty"
    "#relink": "slot 2 file missing (relink badge)"
    "#trimmed": "slot 3 is a 48.2 s file trimmed to 30 s; 21.4 MB, too large to embed"
    "#nosc": "no sidechain bus"
    "#nosignal": "sidechain bus present, silent"
    "#armed": "Record-in armed on Threshold (0 dB), target slot IV - waiting for level"
    "#recording": "Record-in Manual into slot IV, 8 s, loops every capture"
    "#heavy": "grain_limit 256 (heavy hint)"
    "#dragover": "lane IV in drag-over state"
    "#clamp": "adds C8 to every other chord: voice cells show '+48 st · clamp', grain cores turn warning-tone"
    "#mpe": "mpe_enable on (expression card reads MPE)"
    "#freeze": "Freeze on (feedback heads dashed + stopped, strip glow)"
    "#tempo": "sync_mode Tempo (sync knobs swap in)"
    "#page=<streams|fx|mod|voice>": "open a page"
    "#list<N> / #pop<N>": "open the scale list / custom-scale editor from stream N"
    "#measure": "headless measurement -> <script id=measure-out>"
    "#selftest": "drag Env 2 -> Output (mono badge), LFO 2 -> S1 loop-end handle, LFO 2 per-voice -> reverb (mono), heavy hint on/off, trimmed load, record-in Manual cycle -> rec slot with embed on"

design_sync_applied:
  S1: "grain_limit select: 4 choices 32/64/128/256 grains, default 3 (256); 'heavy on CPU' hint (grain_limit_heavy_hint, 1082,144) visible when > 128; tooltip explains the cost. Lane strip globals column."
  S2: "pitch_bend_range label 'Bend Range', tooltip 'Bend range (MPE: master channel; member notes use RPN 0, default 48)'; long form in bend_range_note (VOICE, 1030,312)."
  S3: "feedback tooltip: write amount per record-head lap, w = 0.95 × Amount, convex blend not a loop gain; FX readout write_amount ('Write amount  27 % per lap', note 'A convex blend into the copy, never a gain: it cannot exceed the source peak.') replaces the parent's loop-gain readout; lanes show the 1x feedback record head and a pale crest where the copy has been rewritten."
  S4: "Freeze latch tooltip: record heads stop, nothing written, chains warm, returns discarded; lane feedback heads turn dashed + still; write_amount reads 'Held · frozen · no writes'."
  S5: "sN_position tooltip: start point inside the loop region AND the live read centre (modulatable); lane scan-start marker sits inside the region."
  S6: "±48 st clamp: pitch / pitch_rand / key_track tooltips; VOICE pitch_clamp_note (18,762); voice cells read '+48 st · clamp' in warning tone; clamped grains get a warning-tone core in the lanes (#clamp demo)."
  S7: "MOD matrix 'mono' badge (ochre pill + ochre arrow) on rows routing a per-voice source (incl. per-voice LFOs) to a global destination (1, 114-125); tooltip states the newest-voice rule; per-voice pip on all source chips; legend item 4; demo slot 6 Env 1 -> Feedback."
  S8: "rec_length capped at 30 s; rec_length_sync value reads 'cap 30 s' when the bars exceed the slot maximum; progress line shows 'capped 30 s'; 'trimmed' lane badge for files beyond 30 s / 2,880,000 frames."
  S9: "lane source scheme visible: factory (badge), file (path tooltip), rec (badge + save…); state keys embed / fileSize / contentHash / trimmed listed under state.slots; embed tooltip shows the 16 MB FLAC-24 cap and the slot's encoded size."
  S10: "factory slots show the 'factory' tag (tooltip: built into the binary, BinaryData FLAC ≤ 8 MB) and their Embed tool is disabled."
  S11: "per-slot Embed toggle in the lane tools (native setSlotEmbed -> state), default on for recordings; Reset / Clear / Load / Reset all are native actions, not parameters."


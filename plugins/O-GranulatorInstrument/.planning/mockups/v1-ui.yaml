scale_ui:   # inherited from O-Granulator v2-ui.yaml scale_ui - collections, dropdown, chips, custom-scale editor, i18n
  inherited: "verbatim: 32-entry sN_scale list (Off first, Custom last), grouped Naturalist dropdown, per-stream degree chips (1 row <= 24 degrees, 2 rows above), All/None/Invert, ONE shared custom scale + pitch-circle editor, Scala load/save"
  changes:
    - "Scale trigger (108 wide) + edit pencil move into the STREAMS column header (x+30 / x+142, y 288); chips + tools stay full width under the header rule (y 321)."
    - "No Pitch Follow and no Scale Root in the instrument: the scale quantises the Pitch Random spread only, counted from unison; the played key is never quantised. Chip labels are always semitone numbers for 12-tone collections; the trigger tooltip says so."
  overlays_measured: [{"id": "scale_list", "from": 4, "rect": {"x": 565, "y": 316, "width": 620, "height": 274}}, {"id": "custom_scale_editor", "from": 4, "rect": {"x": 809, "y": 349, "width": 376, "height": 321}, "above": false}, {"id": "scale_list", "from": 1, "rect": {"x": 48, "y": 316, "width": 620, "height": 274}}, {"id": "custom_scale_editor", "from": 1, "rect": {"x": 18, "y": 349, "width": 376, "height": 321}, "above": false}]
  demo_state: "Lichen Choir: s2_scale = 19-EDO (19) with mask 0 3 6 8 11 14 17; s3_scale = Custom (31) = 'Partch 43' with 14 degrees off; s1/s4 Off."

state:   # plugin STATE (ValueTree), NOT parameters - parameter_count stays 261
  inherited: "customScale.*, degreeMasks[4][32] (16-hex strings), seed (int64), stateVersion, uiLanguage - as O-Granulator v2 state section"
  modDestTableVersion: 1
  slots:   # Design Sync S9 / S10 / S11 - <Slots> child, one <Slot n> each
    source: "scheme 'factory:<id>' | 'file:<abs>' (+ relative-to-session path) | 'rec:<n>'"
    name: "display name"
    embed: "bool, opt-in; default ON for recordings, OFF for files; ignored for factory (always resolvable). UI: lane Embed tool."
    embedded: "base64 FLAC-24 blob when embed is on, capped at 16 MB encoded per slot (tool shows 'too large to embed' above the cap)"
    fileSize: "bytes, for relink matching"
    contentHash: "for relink matching"
    trimmed: "bool - file longer than the slot max (30 s / 2,880,000 frames); UI badge 'trimmed'"
    not_saved: "working-copy contents (reload restarts from the pristine file)"
  native_functions: ["chooseFileForSlot({slot})", "loadSlot({slot, file})", "relinkSlot({slot})", "clearSlot({slot})", "resetSlot({slot})", "resetBuffers()", "setSlotEmbed({slot, embed})", "saveRecording({slot})", "getSlotState() -> [{scheme, name, seconds, trimmed, missing, embed, encodedBytes}] (push after preset load)", "setDegreeMask / setCustomScale / loadScala / saveScala (inherited)"]
  telemetry_ui_reads: "per lane: overview peaks of the working copy + dirty mask, feedback record-head position, record-in head; per voice: note, gate/release, amp level, scan centre per stream, pitch-clamped flag; grains {voice, stream, normPos, gain, reversed, clamped}; record-in run state + sidechain peak; 17 source values (newest voice for per-voice)"


# O-GranulatorInstrument - UI Design Specification v1
# Generated: 2026-11-07 by ui-design-agent (positions measured from v1-ui-test.html#measure, headless Chrome 1200x800)
# Base: O-Granulator v2-ui.yaml / v2-ui-test.html (finalized 2026-11-04), inherited verbatim where unchanged:
#   aesthetic, colour tokens, EB Garamond, knob / seed cross-section, plate frame, engraved dandelion, drag-to-modulate,
#   scale band + degree chips + shared custom scale, FX columns, matrix UX.
# Instrument changes: 4 stacked waveform lanes (replaces the 140 px buffer strip), inline Record-in, VOICE page (4th tab),
#   instrument mod sources (18-entry list), per-voice markers + mono badges, header voice indicator, input_gain/mix removed.
# Aesthetic: Ouaricon Naturalist (ouaricon-naturalist-001), DARK variant

window:
  width: 1200
  height: 800
  resizable: false

aesthetic:
  base: ouaricon-naturalist-001
  variant: dark
  inherited_from: "plugins/O-Granulator/.planning/mockups/v2-ui.yaml (aesthetic, colors, typography sections apply verbatim)"
  illustration: "Engraved dandelion clock (Taraxacum pappus in dispersal), inline SVG; bleeds off bottom-right, strokes #32291F on ground (decoration only). Title glyph: small seed-head in ochre; stream glyph: engraved pollen grain in stream colour."
  frame: "Engraved double plate rule (inset 6/9 px) with corner rivets; engraved rules at y 91.5 (under header) and 282.5 (under the lane strip)"
  knob: "Dark seed cross-section: 20-segment conic body #2F261D/#261F17, #54453A dividers, bone core + indicator; 270deg value arc (stream colour or bone); outer ochre bipolar mod ring + live dot"
  title: "O·Granulator + stacked italic 'Instrument' (12 px ink-2) over 'Ouaricon' (11 px ink-3) - the sibling keeps the parent's word-mark and reads as its instrument edition"

colors:
  ground: "#14100C"
  plate: "#1A1510"
  panel: "#1E1913"
  raised: "#262019"
  rule: "#33291F"
  rule_strong: "#4A3D30"
  ink: "#ECE1CC"        # 14.6:1 on ground
  ink_secondary: "#C9BBA2"  # 10.0:1
  ink_tertiary: "#A8977D"   # 6.7:1 on ground, 5.5:1 on raised
  value_arc: "#D9CBB0"
  accent: "#E2B064"     # ochre - reserved for modulation, freeze, write/record heads, active tab (unchanged rule)
  on_accent: "#1A130B"  # 9.3:1 on accent
  warning: "#EDA48F"    # parent's scale-editor error tone; here also: relink badge, pitch-clamp readout, clamped grain cores
  streams:
    s1: "#A9C178"  # moss    9.5:1
    s2: "#E39177"  # madder  7.7:1
    s3: "#92A9E6"  # woad    8.2:1
    s4: "#CB9AD0"  # thistle 8.2:1
  ochre_uses_in_v1: ["modulation (rings, chips, matrix, mono badge, newest-voice tick)", "Freeze latch", "feedback record heads (lane, bottom tick)", "Record-in head + armed/recording states", "active tab"]

typography:
  family: "'EB Garamond', 'Garamond', 'Times New Roman', serif"   # modules/ui/eb-garamond (embed css + woff2)
  features: "lnum, tnum; all-small-caps for section titles/tabs/badges"
  title: "25px"
  section_title: "13px small caps, 2px tracking"
  group_heading: "12.5px italic + fading hairline"
  knob_label: "11px Title Case"
  knob_value: "11.5px, scaled value + unit, thin space"
  lane_name: "11.5px italic ink (user text, ellipsis)"
  badge: "10.5px all-small-caps, 1px tracking, 1px rule border (factory / rec / save… / trimmed / relink)"
  floor: "10.5px (audit: 0 text nodes below the floor on all 4 pages, overlays and lane/record states)"
  notes:
    - "Glyphs NOT in the subset: infinity, sharp/flat, small triangles, lambda, record dot - use '-inf dB', '#', SVG chevrons/icons; 'w' for the write amount"
    - "Canvas text waits for document.fonts.load() before first paint"

layout:
  type: custom
  regions:
    - { id: header, y: 16, height: 70, contents: [title, preset_bar, freeze, sync_mode, voice_activity_mini, output_gain, output_meter, page_tabs, mod_source_dock] }
    - { id: lane_strip, x: 18, y: 96, width: 1164, height: 180, contents: [4 waveform lanes, lane tools, rec_target pips, record_in cluster, grain_limit, grain_count, reset_all] }
    - { id: page, y: 288, height: 493, pages: [streams, fx, mod, voice] }
  header_v1: "input_gain and mix removed (no dry path). Row 1: title 18-270 | preset 280-560 | Freeze 572-662 | Sync 674-794 | Voices indicator 812-1024 | Output 1040 + meter 1162. Row 2: tabs 18-414 (104/128/76/88) | dock 426-1030 (17 chips, 2 px gaps, 5 px group spacers: LFO | Env Vel Key Rand | Wheel Press Slide Bend | M1-M4)."
  lane_strip_geometry: "strip 18,96 1164x180. Lane n: x 22, y 100 + 44(n-1), 682x40 = tab 24 (numeral, stream colour) + waveform canvas 656x40 at x 48. Tools at x 710 / 736 (22x18, rows y+1 / y+21): Load, Embed / Reset, Clear. rec_target pip x 766, y+11. Divider x 798. Record-in 810-1064. Divider 1072. Globals 1082-1182 (grain limit 116, heavy hint 144, grains 168, Reset all 242)."
  pages:
    streams: "4 columns (x 18/312/606/900, 282 wide, 12 gutter), parent v2 grid. The column HEADER is now the scale band (key-signature reading): numeral | scale trigger 108 + edit 22 | M S enable. Degree chips + All/None/Invert sit directly under the header rule. Rows: Position + Pitch / Size + Rate / Window (fig + 3) / Scatter + Mixer. Onset-trigger pill removed with sN_onset_trigger."
    streams_v1_rhythm: "y: header row 288 (24) | rule 316 | chips 321 (20) | Position/Pitch headings 349, knobs 365 | Size/Rate headings 458, knobs 474 | Window heading 569, knobs 585 | Scatter/Mixer heading 680, knobs 696 (bottom 781, 19 px edge = parent). The lane strip took 40 px; it is paid entirely by folding the parent band row (24) and its gaps into the column header, so from Size/Rate down every y equals parent v2. No control resized. Gaps: chips->heading 8, knob row->heading 8/10/10."
    instrument_params_placement: "sN_root_note/root_fine/key_track/scan_rate/scan_mode live on VOICE > Playback (4 columns aligned to the STREAMS columns), sN_loop_start/end are the lane handles. Why: STREAMS already holds the parent's full 16-slot grid in 493 px with the parent's rhythm; a 5th knob row (101 px) does not fit and shrinking cells is ruled out. Root/key-track/scan are per-note playback setup (how a key plays the file), which is what the VOICE page is about; Position stays on STREAMS and is mirrored live in the lanes (scan-start marker)."
    fx: "Parent v2 grid; filter-type segmented joins its 'Grain filter' heading row (y 324, 196 wide at x+86), knobs 354 | Drive/Crush heading 449, knobs 465 | Ring heading 560, knobs 576 (= parent) | Feedback network title 677, knobs 697 (= parent) + write_amount readout (was loop gain) | Output reverb unchanged."
    mod: "LFO 1-4 cards (x 18/207/396/585, 175x218 at y 288): chip + Global/Voice mode segmented (lfoN_mode), live wave (per-voice: one dot per sounding voice, newest ochre), shape, rate/phase. Source cards y 516 / 572 (50 tall): Mod Env 1 + 2 (mini envelope), Velocity, Key (mini keyboard) / Note random, Mod wheel, Expression (Pressure, Slide, Bend). Macros 634 (chips 654, large knobs 680). Routing legend 432-760. Matrix x 776, 406 wide: title 288, labels 312, 16 rows from 330 at 28 px (26 tall): # | source 68 | arrow | destination 122 | mono badge | depth 100 | value 42."
    voice: "Amp envelope (fig 212 + attack/decay/sustain/release/velocity) | Voice · MIDI (polyphony, glide, bend range; Mode segmented; MPE pill; bend-range note) at 288-395. Voices strip 410 (16 cells 67x54 at 73 px). Mod envelopes 502 (2 cards 572x92: chip + live figure + 4 knobs). Playback 628 (per stream: Root field + fine field, Key Track, Scan Rate, Scan choice-knob at 668). Clamp note 762."
  grid:
    knob_cell: { width: 62, height: 85 }
    knob_cell_large: { width: 80, height: 97 }
    header_knob: { width: 108, height: 58 }
    column_slots_x: [0, 72, 148, 220]
    lane: { height: 40, pitch: 44, canvas_width: 656 }

lanes:   # per-stream waveform lanes, visible on every page
  canvas: "656x40 per lane; mirrored peak envelope of the WORKING COPY in stream colour (alpha 0.62, 0.28 when stream is inaudible); outside the loop region the envelope is bone 14 % with a 42 % ground wash; columns already rewritten by feedback carry a pale bone crest (copy differs from the file)"
  name: "top-left 11.5px italic ink, ellipsised (user text); tooltip = source scheme + path"
  info: "top-right 11px italic ink-2: '<len> s · <n> grains' | 'stream off' | 'recording · <t> s of <L>' | 'missing · click relink'"
  badges:   # S9 / S10
    factory: "'factory' - source scheme factory:<id>; built into the binary (BinaryData FLAC, ≤ 8 MB); embed toggle disabled ('nothing to embed')"
    file: "no badge; scheme file: shown in the name tooltip (absolute + relative path)"
    rec: "'rec' + 'save…' link (Save recording to WAV, native)"
    trimmed: "'trimmed' when the file exceeded the slot maximum: tooltip 'This file is 48.2 s. A slot holds at most 30 s (2,880,000 frames; 15 s at 192 kHz), so only the first 30.0 s is loaded.' (S8 / D2)"
    relink: "'relink' (warning tone, clickable) when the file is missing; name struck through in ink-3, flat dashed centre line, grains silent"
  empty: "dashed 1 px rule-2 frame; centred italic 'Drop a file · or Record' - both words are links (file chooser / sets rec_target to this lane and arms)"
  drag_over: "1.5 px dashed stream-colour frame, 14 % stream tint, 'Release to load into stream <N>'; tab tint rises (flag #dragover)"
  loop_handles: "sN_loop_start / sN_loop_end: 9x40 hit zone, 1.5 px stream-colour rule + 6 px flag (start points right, end points left); drag horizontally, double-click resets; they are mod drop targets (ochre while a source is dragged); a routed edge shows an ochre tick at its live modulated position"
  scan_start: "sN_position marker: stream-colour triangle on the bottom edge + dotted line, inside the loop region"
  playheads: "one 1 px bone line per sounding voice at that voice's scan centre (alpha 0.22 + 0.7 x amp env), cap dot at the top (larger while held)"
  grains: "dots in stream colour (lighter blend, radial glow), y = stereo position, size ~ grain length, alpha ~ window; a grain whose pitch hit the ±48 st clamp has a warning-tone core (S6)"
  feedback_head: "ochre 1x record head per slot (D7): bottom tick + small triangle moving at real-time speed through the loop region while Amount > 0; frozen = dashed outline, stopped (S4)"
  record_head: "Record-in into this slot: full-height 1.6 px ochre line + top triangle, ochre wash behind it, lane outline ochre-dim; the waveform builds left to right"
  tools:
    load: "folder icon - file chooser (native chooseFileForSlot/loadSlot); dropping a file on the lane does the same"
    embed: "S11 embed toggle (state, not a parameter): lit in stream colour when on; default on for recordings, off for files; disabled for factory; tooltip states the 16 MB FLAC-24 cap and the slot's encoded size; outlined in warning tone when the slot is too large to embed"
    reset: "per-slot Reset (native resetSlot); a stream-colour dot marks a dirty working copy"
    clear: "Clear slot (native clearSlot)"
  rec_target_pips: "rec_target radio: one record pip per lane right of the tools; target pip filled bone; filled ochre while armed / recording"

record_in:   # inline at the right end of the lane strip (x 810-1064)
  title: "section title 'Record-in' (810,100) + status at right (930-1064): lamp + italic text, tooltip explains"
  states:
    no_sidechain: "flag #nosc. Status 'No sidechain' (ink-3); cluster at 42 % opacity and inert (disabled-control exemption); input meter crossed out. Tooltip: host has not connected the side-chain input; Logic: pick a source in the plugin header's Side Chain menu; some AU hosts never route a key bus to an instrument - use the VST3 or load a file."
    no_signal: "flag #nosignal. Bus present but silent: 'No signal' (ink-3). Tooltip: an unrouted AU key bus delivers silence, not an error. A silent capture is discarded and the slot stays as it was (toast)."
    ready: "'Ready', lamp bone"
    armed: "flag #armed. Arm latch outlined ochre with blinking lamp; status 'Waiting for level' (Threshold, with an ochre threshold tick on the input meter) or 'Waiting for a note' (Next note). Manual starts immediately."
    recording: "flag #recording. Arm latch filled ochre; status 'Recording into IV'; progress '2.3 / 8.0 s' + ochre bar; target lane shows the ochre record head; target pip ochre."
    done: "'Captured into IV'; the slot becomes rec: 'Recording N' with Embed on; disarm + arm to retake"
  controls: "rec_trigger segmented (810,122 254x22) | rec_length / rec_length_sync knob (810,150, Free/Tempo alternates) | rec_threshold (882; dimmed unless Threshold) | rec_gain (954) | sidechain meter 1030,164 20x52 | rec_arm latch (810,242 92x26) | progress (912,242 152x26: length + 'into slot IV' / 'capped 30 s')"
  run_state: "Armed -> Recording -> Done is ENGINE state shown by the UI; rec_arm stays a plain Bool parameter (no parameter writes another)."

voice_page:
  amp_envelope: "fig. amp envelope (212 wide, sqrt time axis so short and long stages both read, bone fill) with one live dot per sounding voice (held = bright, releasing = dim); value line 'A 180 ms · D 600 ms · S 80 % · R 2.40 s'"
  voice_midi: "polyphony, glide, pitch_bend_range knobs; voice_mode segmented; mpe_enable pill; bend_range_note (S2 long form)"
  voices_strip: "16 cells (67x54): voice number, state (held / release / stolen / off above Polyphony, hatched), note name 16 px, transposition on the first enabled stream ('+4 st'; '+48 st · clamp' in warning tone when |st| > 48 - S6), amp bar; newest voice has an ochre top rule (it drives mono routes)"
  mod_envelopes: "2 cards: draggable chip (Env 1 / Env 2, per-voice pip), live figure (one ochre dot per voice, newest brighter), 4 knobs, 'newest 0.34' readout, one-line note"
  playback: "per stream (columns x 18/312/606/900): header numeral + '<file> · plays as A3'; Root = note field (62x26, 16 px, drag/scroll/dbl-click) over fine field (62x20); 'MIDI 57' caption; Key Track, Scan Rate, Scan (choice knob: Free-run / Retrigger / Ping-pong)"
  clamp_note: "y 762: 'Grain pitch = key track × (note − root) + pitch + random + bend, clamped to ±48 st. A voice past the clamp shows it in its cell above.'"
  header_indicator: "voice_activity_mini (812,16 212x32): 'Voices' + '3 held · 2 fading · max 8'; 16 dots (8 px, 13 px pitch): filled bone = held (opacity ~ amp), ring = releasing, dash = above polyphony, ochre underline = newest; click opens VOICE"

modulation_ux:
  sources: ["LFO 1", "LFO 2", "LFO 3", "LFO 4", "Mod Env 1", "Mod Env 2", "Velocity", "Key", "Note Random", "Mod Wheel", "Pressure", "Slide", "Bend", "Macro 1", "Macro 2", "Macro 3", "Macro 4"]
  per_voice_sources: ["LFO n when lfoN_mode = Per-voice", "Mod Env 1", "Mod Env 2", "Velocity", "Key", "Note Random", "Pressure", "Slide", "Bend"]
  global_sources: ["LFO n when lfoN_mode = Global", "Mod Wheel", "Macro 1-4"]
  per_voice_marker: "6 px bone pip on the chip rim (top-right) in the header dock and on every card chip; LFO chips gain/lose it live with lfoN_mode; chip tooltip says per voice / global"
  handles: "Header dock (17 chips, all pages) + chips on MOD source cards, LFO cards, VOICE mod-envelope cards and macros; background tint tracks the live value (newest voice for per-voice sources)"
  drop: "Drag a chip onto any knob with a destination index OR a lane loop handle -> first empty slot gets source/dest/depth +40 %; ring/handle + row flash; toast notes 'mono (newest voice)' when it applies. Duplicate source->dest flashes the existing slot."
  mono_badge: "Design Sync S7: matrix rows routing a per-voice source to a GLOBAL destination (output_gain = 1, feedback..lfo4_rate = 114-125) show an ochre 'mono' pill and an ochre arrow; tooltip: 'Mono route: a per-voice source on a global destination follows the NEWEST voice (Stage 0 D4).'"
  ring: "Ochre arc at r+7 around the knob from base to base+depth (bipolar sources show a faint +/- reach); live dot = modulated value (newest voice for per-voice sources)"
  edit: "Alt-drag knob = depth of latest route on it; matrix row depth bar (drag, dbl-click = 0); click slot number = clear"
  tempo_alias: "In Tempo mode sN_size_sync / sN_density_sync / lfoN_rate_sync knobs drop onto the sN_size / sN_density / lfoN_rate destinations"
  bipolar_sources: ["LFO 1-4", "Key", "Note Random", "Bend"]
  destination_table_size: 126

controls:
  - id: polyphony
    type: knob
    relay: WebSliderRelay
    label: "Polyphony"
    name: "Polyphony"
    page: voice
    position: { x: 612, y: 310 }
    size: { width: 62, height: 85 }
    range: [1, 16]
    default: 8
    skew: 1
    interval: 1
    unit: "voices"
    tooltip: "Most notes at once. A new note past the limit steals the oldest voice with a fade."
  - id: voice_mode
    type: combo
    relay: WebComboBoxRelay
    label: "Mode"
    page: voice
    position: { x: 836, y: 326 }
    size: { width: 180, height: 24 }
    presentation: "segmented: Poly | Mono | Legato"
    choices: ["Poly", "Mono", "Legato"]
    default: 0   # Poly
  - id: glide
    type: knob
    relay: WebSliderRelay
    label: "Glide"
    name: "Glide"
    page: voice
    position: { x: 684, y: 310 }
    size: { width: 62, height: 85 }
    range: [0, 2000]
    default: 0
    skew: 0.3
    unit: "ms"
    tooltip: "Portamento. Mono and Legato always glide; poly voices glide when this is above zero."
  - id: pitch_bend_range
    type: knob
    relay: WebSliderRelay
    label: "Bend Range"
    name: "Pitch Bend Range"
    page: voice
    position: { x: 756, y: 310 }
    size: { width: 62, height: 85 }
    range: [0, 48]
    default: 2
    skew: 1
    interval: 1
    unit: "st"
    tooltip: "Bend range (MPE: master channel; member notes use RPN 0, default 48).\nWith MPE off it applies to every note."
    note: "Design Sync S2: label \"Bend Range\"; tooltip \"Bend range (MPE: master channel; member notes use RPN 0, default 48)\". Long form in display bend_range_note."
  - id: mpe_enable
    type: toggle
    relay: WebToggleButtonRelay
    label: "MPE"
    page: voice
    position: { x: 836, y: 362 }
    size: { width: 180, height: 24 }
    presentation: "pill toggle \"MPE · lower zone\""
    default: false
  - id: grain_limit
    type: combo
    relay: WebComboBoxRelay
    label: "Grain Limit"
    page: shared
    position: { x: 1082, y: 116 }
    size: { width: 100, height: 24 }
    presentation: "select, options read \"<n> grains\""
    choices: ["32", "64", "128", "256"]
    default: 3   # 256
    note: "Design Sync S1: 4 entries 32/64/128/256 (draft had 5 incl. 512), default 3 (256). Display grain_limit_heavy_hint (\"heavy on CPU\", italic ink-2 + CPU glyph) is visible when value > 128."
  - id: freeze
    type: toggle
    relay: WebToggleButtonRelay
    label: "Freeze"
    page: shared
    position: { x: 572, y: 16 }
    size: { width: 90, height: 32 }
    presentation: "latch button (ochre when on)"
    default: false
    note: "Design Sync S4: tooltip \"the record heads stop, so nothing is written into the working copies ... the feedback chains stay warm and their returns are discarded\". Lane feedback heads turn dashed and stop."
  - id: sync_mode
    type: combo
    relay: WebComboBoxRelay
    label: "Sync"
    page: shared
    position: { x: 674, y: 16 }
    size: { width: 120, height: 32 }
    presentation: "segmented"
    choices: ["Free", "Tempo"]
    default: 0   # Free
  - id: output_gain
    type: knob
    relay: WebSliderRelay
    label: "Output"
    name: "Output Gain"
    page: shared
    position: { x: 1040, y: 16 }
    size: { width: 108, height: 58 }
    range: [-24, 12]
    default: 0
    skew: 1
    unit: "dB"
    mod_destination: 1
  - id: amp_attack
    type: knob
    relay: WebSliderRelay
    label: "Attack"
    name: "Amp Attack"
    page: voice
    position: { x: 244, y: 310 }

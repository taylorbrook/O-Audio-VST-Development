# ============================================================================
# O-Contrabass — UI Mockup Specification v1
# Ouaricon Naturalist Series — "Slightly Aged Parchment" (darkened O-Bowed set)
# ============================================================================
# Design-iteration Phase A artifact. Companion browser mockup: v1-ui-test.html
# Parameter IDs are AUTHORITATIVE — they match the shipped APVTS IDs
# (parameter-spec.md, 31 params after Phase 2.6a additions).
# ============================================================================

plugin: O-Contrabass
mockup_version: 1
description: >
  4-string contrabass physical model (waveguide + nonlinear bow friction).
  Sustained orchestral arco and ambient drone. E1-G3, monophonic.
  Single-view sectioned grid — all 7 sections visible at once, no tabs.

window:
  width: 1000
  height: 650
  resizable: false

# ----------------------------------------------------------------------------
# Palette — Ouaricon house style, shifted ~10% darker/warmer than O-Bowed
# so the plugin reads "lower register" while staying in-family.
# O-Bowed reference values in trailing comments.
# ----------------------------------------------------------------------------
styling:
  fonts:
    primary: "'Garamond', 'Georgia', 'Times New Roman', serif"
  tokens:
    bg-paper: "#EDD9BE"          # O-Bowed #F5E6D3
    bg-paper-dark: "#DFC6A6"     # O-Bowed #E8D5BE
    bg-paper-darker: "#C6B294"   # O-Bowed #D4C4AD
    brown-text: "#332625"        # O-Bowed #3C2F2F
    brown-text-light: "#5E4D40"  # O-Bowed #6B5B4F
    brown-text-lighter: "#7D6C5E" # O-Bowed #8B7B6F
    green-light: "#7E9A62"       # O-Bowed #8BA870
    green-mid: "#5F8143"         # O-Bowed #6B8E4E
    green-dark: "#3F5D2C"        # O-Bowed #4A6B35
    green-accent: "#96B57A"      # O-Bowed #A3C288
    brown-border: "#7C6547"      # O-Bowed #8B7355
    brown-frame: "#4A3226"       # O-Bowed #5C4033 (deeper header/footer frame)
    brown-frame-light: "#684C39" # O-Bowed #7A5C47
    knob-size: 55px              # house standard
    knob-track: "#C6B294"
    knob-fill: "#5F8143"
    shadow-soft: "rgba(51, 38, 37, 0.15)"
    shadow-hard: "rgba(51, 38, 37, 0.3)"
  drone_panel:
    # Drone section is visually distinct — deeper umber tone panel; params
    # default to 0 and "wake up" the drone territory. Panel gains a subtle
    # green glow border when either drone param is raised above 0.
    background: "linear-gradient(rgba(58,38,26,0.16), rgba(58,38,26,0.10))"
    border: "#684C39"
    label_color: "#B08F5E"

# ----------------------------------------------------------------------------
# Branding
# ----------------------------------------------------------------------------
branding:
  header: "O-CONTRABASS"
  brand_label: "OUARICON · NATURALIST SERIES"
  illustration:
    subject: "vintage cetacean (sperm whale) scientific engraving"
    treatment: "low-opacity sepia overlay behind lower-center sections, ~0.13 opacity, hatched-line engraving style"
    placement: { x: 300, y: 340, width: 430, height: 200 }
    header_mark: "small whale glyph beside brand label, paper-tone stroke"
    asset_status: "TODO — final engraving artwork is a production asset; mockup ships an inline SVG placeholder in engraving style"
  section_label_style: "roman-numeral plate labels (I · BOW … VII · MICROTONAL), small caps, letterspaced, bottom rule"
  preset_bar: "header strip — prev/next, preset name dropdown affordance, Save (visual placeholder only in mockup)"

# ----------------------------------------------------------------------------
# Section grid map (all coordinates absolute, px, within 1000x650)
# Header 0-42 | Row1 52-304 | Row2 314-566 | Footer strip 576-640
# ----------------------------------------------------------------------------
sections:
  - id: header       # preset bar
    position: { x: 0, y: 0 }
    size: { width: 1000, height: 42 }
  - id: bow
    label: "I · BOW"
    position: { x: 10, y: 52 }
    size: { width: 260, height: 252 }
  - id: schelleng    # visualization panel, adjacent to Bow knobs (LOCKED)
    label: "SCHELLENG DIAGRAM"
    position: { x: 280, y: 52 }
    size: { width: 336, height: 252 }
  - id: body
    label: "II · BODY"
    position: { x: 626, y: 52 }
    size: { width: 364, height: 252 }
  - id: strings
    label: "III · STRINGS"
    position: { x: 10, y: 314 }
    size: { width: 300, height: 252 }
  - id: expression
    label: "IV · EXPRESSION"
    position: { x: 320, y: 314 }
    size: { width: 330, height: 252 }
  - id: drone
    label: "V · DRONE"
    position: { x: 660, y: 314 }
    size: { width: 140, height: 252 }
    distinct: true   # deeper umber panel treatment
  - id: output
    label: "VI · OUTPUT"
    position: { x: 810, y: 314 }
    size: { width: 180, height: 252 }
  - id: microtonal
    label: "VII · MICROTONAL"
    position: { x: 10, y: 576 }
    size: { width: 980, height: 64 }

# ----------------------------------------------------------------------------
# Controls — all 31 parameters (IDs authoritative)
# type: slider → WebSliderRelay | toggle → WebToggleButtonRelay
#       combo  → WebComboBoxRelay
# ----------------------------------------------------------------------------
controls:
  # ---- Bow (5) ----
  - id: BOW_SPEED
    label: "Bow Speed"
    type: slider
    ui: knob
    section: bow
    position: { x: 25, y: 84 }
    size: { width: 62, height: 86 }
    range: [0.02, 1.5]
    default: 0.15
    unit: "m/s"
    curve: log
  - id: BOW_PRESSURE
    label: "Bow Pressure"
    type: slider
    ui: knob
    section: bow
    position: { x: 98, y: 84 }
    size: { width: 62, height: 86 }
    range: [0.05, 8.0]
    default: 1.0
    unit: "N"
    curve: log
  - id: BOW_POSITION
    label: "Bow Position (β)"
    type: slider
    ui: knob
    section: bow
    position: { x: 171, y: 84 }
    size: { width: 62, height: 86 }
    range: [0.02, 0.25]
    default: 0.10
    unit: ""
    curve: linear
  - id: ROSIN
    label: "Rosin"
    type: slider
    ui: knob
    section: bow
    position: { x: 60, y: 180 }
    size: { width: 62, height: 86 }
    range: [0.0, 1.0]
    default: 0.65
    curve: linear
  - id: BOW_NOISE
    label: "Bow Noise"
    type: slider
    ui: knob
    section: bow
    position: { x: 133, y: 180 }
    size: { width: 62, height: 86 }
    range: [0.0, 1.0]
    default: 0.35
    curve: linear

  # ---- Body (4) ----
  - id: BODY_SIZE
    label: "Body Size"
    type: slider
    ui: knob
    section: body
    position: { x: 644, y: 84 }
    size: { width: 62, height: 86 }
    range: [0.0, 1.0]
    default: 0.75
    curve: linear
  - id: BODY_DAMPING
    label: "Body Damping"
    type: slider
    ui: knob
    section: body
    position: { x: 716, y: 84 }
    size: { width: 62, height: 86 }
    range: [0.0, 1.0]
    default: 0.40
    curve: linear
  - id: BODY_MIX
    label: "Body Mix"
    type: slider
    ui: knob
    section: body
    position: { x: 788, y: 84 }
    size: { width: 62, height: 86 }
    range: [0.0, 1.0]
    default: 0.80
    curve: linear
  - id: BRIGHTNESS
    label: "Brightness"
    type: slider
    ui: knob
    section: body   # bridge filter — lives sensibly in Body section
    position: { x: 860, y: 84 }
    size: { width: 62, height: 86 }
    range: [80, 12000]
    default: 4500
    unit: "Hz"
    curve: log

  # ---- Strings (7) ----
  - id: STRING_TENSION
    label: "String Tension"
    type: slider
    ui: knob
    section: strings
    position: { x: 25, y: 346 }
    size: { width: 62, height: 86 }
    range: [0.0, 1.0]
    default: 0.50
    curve: linear
  - id: STRING_STIFFNESS
    label: "String Stiffness"
    type: slider
    ui: knob
    section: strings
    position: { x: 98, y: 346 }
    size: { width: 62, height: 86 }
    range: [0.0, 1.0]
    default: 0.30
    curve: linear
  - id: ACTIVE_STRINGS
    label: "Active Strings"
    type: slider          # Int 1-4, WebSliderRelay with stepped UI
    ui: segmented-stepper # 4 plate-style segment buttons: 1 2 3 4
    section: strings
    position: { x: 176, y: 372 }
    size: { width: 110, height: 26 }
    range: [1, 4]
    default: 4

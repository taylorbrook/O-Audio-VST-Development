affordances:
  # Visual-only in mockup — wired to file chooser in Stage 3 implementation
  - id: scl_load_button
    label: "Load .scl / .tun"
    section: microtonal
    position: { x: 490, y: 594 }
    size: { width: 110, height: 28 }
    note: "opens Scala/TUN file picker; enabled when TUNING_SYSTEM = Scala/TUN"

# ----------------------------------------------------------------------------
# Visualizations — ALL THREE ship in v1.0 (LOCKED; defer escape hatch not taken)
# Update budget: rAF-driven, throttled ≤60fps; C++ pushes state via
# emitEventIfBrowserIsVisible at ≤30Hz (meter 16Hz acceptable).
# ----------------------------------------------------------------------------
visualizations:
  - id: schelleng_wedge
    title: "Schelleng diagram — centerpiece differentiator"
    section: schelleng
    canvas: { x: 292, y: 86, width: 312, height: 196 }
    spec: |
      Real-time bow operating point. X = bow speed (0.02-1.5 m/s, LOG axis),
      Y = bow pressure (0.05-8 N, LOG axis). Playable Helmholtz wedge shaded
      between p_max(v, β) and p_min(v, β); "RAUCOUS" region above, "SURFACE /
      SLIPPING" below. Wedge geometry shifts with BOW_POSITION (β): p_max ∝
      v/β, p_min ∝ v/β². Operating dot eased toward (BOW_SPEED, BOW_PRESSURE);
      dot jitter amplitude ∝ BOW_NOISE; dot green inside wedge, rust outside.
      MUST sit visually adjacent to Bow section knobs (Speed/Pressure/Position).
    update: "60fps rAF while easing/jittering; idle-skips when settled"
  - id: body_spectrum
    title: "Body resonance spectrum"
    section: body
    canvas: { x: 640, y: 182, width: 336, height: 112 }
    spec: |
      8 body-resonator mode peaks (Lorentzian sum) over 40-1200 Hz log axis.
      BODY_SIZE scales mode frequencies down as size grows; BODY_DAMPING
      widens/flattens peaks (Q); BODY_MIX scales resonant level vs direct;
      BRIGHTNESS tilts high-mode weighting. Redrawn on parameter change
      (dirty-flag rAF), ≤60fps.
    modes_base_hz: [58, 74, 98, 132, 178, 238, 320, 430]
  - id: output_vu
    title: "Vintage VU output meter"
    section: output
    canvas: { x: 825, y: 528, width: 150, height: 36 }
    spec: |
      Cream-face needle VU (RMS), -20..+3 dB scale with red sector above 0.
      Functionally meaningful: plugin output chain is saturator + limiter.
      Needle ballistics smoothed; test HTML simulates level from OUTPUT_GAIN /
      MASTER_SAT_AMOUNT / INFINITE_SUSTAIN, capped at LIMITER_CEILING_DB.
    update: "30fps throttled; C++ meter push 16Hz sufficient"

# ----------------------------------------------------------------------------
# WebView constraints honored (ui-design-rules.md)
# ----------------------------------------------------------------------------
constraints:
  - "no viewport units (100vh/100vw/100dvh/100svh) anywhere"
  - "html, body { height: 100%; } foundation"
  - "user-select: none; cursor: default; overflow: hidden (native feel)"
  - "context menu + dragstart disabled via JS"
  - "fixed 1000x650 — setSize(1000, 650); setResizable(false, false)"
  - "knob interaction: relative vertical drag, shift = fine, dblclick = default"
  - "all viz updates rAF-throttled ≤60fps"


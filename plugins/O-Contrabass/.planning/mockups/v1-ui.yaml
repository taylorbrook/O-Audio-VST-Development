    curve: linear
  # Per-string detune — 4 vertical sliders styled as tailpiece fine-tuners,
  # cents readouts, center-detent at 0 (soft snap ±20 cents), dblclick reset.
  - id: DETUNE_E
    label: "E String Detune"
    type: slider
    ui: vslider-finetuner
    section: strings
    position: { x: 52, y: 442 }
    size: { width: 36, height: 112 }
    range: [-1200, 1200]
    default: 0
    unit: "¢"
    detent: 0
    curve: linear
  - id: DETUNE_A
    label: "A String Detune"
    type: slider
    ui: vslider-finetuner
    section: strings
    position: { x: 114, y: 442 }
    size: { width: 36, height: 112 }
    range: [-1200, 1200]
    default: 0
    unit: "¢"
    detent: 0
    curve: linear
  - id: DETUNE_D
    label: "D String Detune"
    type: slider
    ui: vslider-finetuner
    section: strings
    position: { x: 176, y: 442 }
    size: { width: 36, height: 112 }
    range: [-1200, 1200]
    default: 0
    unit: "¢"
    detent: 0
    curve: linear
  - id: DETUNE_G
    label: "G String Detune"
    type: slider
    ui: vslider-finetuner
    section: strings
    position: { x: 238, y: 442 }
    size: { width: 36, height: 112 }
    range: [-1200, 1200]

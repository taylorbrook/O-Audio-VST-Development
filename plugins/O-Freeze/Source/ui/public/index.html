<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=450, initial-scale=1.0">
    <title>O-Freeze - Ouaricon Granular Freeze</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 450px;
            height: 450px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #1a1410;
        }

        #app {
            width: 450px;
            height: 450px;
            position: relative;
            background-image: url('assets/paper1.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Anatomical overlay */
        #anatomy-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/muscles.png');
            background-size: cover;
            background-position: center;
            opacity: 0.28;
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        /* Header bar */
        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(42, 35, 28, 0.85);
            border-bottom: 1px solid rgba(139, 115, 85, 0.3);
            z-index: 10;
        }

        #header h1 {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1.5px;
            color: #d4c5b0;
            text-transform: uppercase;
        }

        /* Central freeze button */
        #freeze-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        #freeze-button {
            width: 140px;
            height: 140px;
            cursor: pointer;
            position: relative;
        }

        #freeze-button svg {
            width: 100%;
            height: 100%;
        }

        #freeze-shape {
            fill: #3a5a4a;
            stroke: #2a4a3a;
            stroke-width: 2;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }

        #freeze-button:hover #freeze-shape {
            fill: #4a6a5a;
        }

        #freeze-button.active #freeze-shape {
            fill: #5a8a6a;
            stroke: #4a7a5a;
        }

        #freeze-button.active #freeze-shape {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #freeze-button.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #freeze-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #d4c5b0;
            text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        /* Grain activity visualization */
        #grain-particles {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 160px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #grain-particles.active {
            opacity: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #7a9a8a;
            border-radius: 50%;
            opacity: 0;
            animation: particle-float 3s ease-in-out infinite;
        }

        @keyframes particle-float {
            0%, 100% { opacity: 0; transform: translate(0, 0); }
            50% { opacity: 0.6; }
        }

        /* Mode toggle */
        #mode-toggle-container {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        #mode-toggle {
            display: flex;
            border: 1px solid rgba(139, 115, 85, 0.4);
            border-radius: 3px;
            overflow: hidden;
            background: rgba(42, 35, 28, 0.5);
        }

        .mode-option {
            padding: 8px 20px;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: #8b7355;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
            text-transform: uppercase;
        }

        .mode-option:hover {
            background: rgba(139, 115, 85, 0.2);
        }

        .mode-option.active {
            background: rgba(90, 122, 106, 0.6);
            color: #d4c5b0;
        }

        .mode-option:not(:last-child) {
            border-right: 1px solid rgba(139, 115, 85, 0.3);
        }

        /* Knobs container */
        #knobs-container {
            position: absolute;
            top: 330px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            display: flex;
            justify-content: space-around;
            z-index: 5;
        }

        .knob {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .knob.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .knob-visual {
            width: 60px;
            height: 60px;
            position: relative;
        }

        .knob-visual svg {
            width: 100%;
            height: 100%;
            transform: rotate(-135deg);
        }

        .knob-track {
            fill: none;
            stroke: rgba(139, 115, 85, 0.3);
            stroke-width: 2;
        }

        .knob-vine {
            fill: none;
            stroke: #5a7a6a;
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s ease;
        }

        .knob-label {
            margin-top: 8px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #8b7355;
            text-transform: uppercase;
        }

        .knob-value {
            margin-top: 2px;
            font-size: 11px;
            color: #a08870;
            cursor: pointer;
            min-width: 60px;
            text-align: center;
        }

        .knob-value:hover {
            color: #d4c5b0;
        }

        .knob-input {
            width: 60px;
            margin-top: 2px;
            font-size: 11px;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #d4c5b0;
            background: rgba(42, 35, 28, 0.9);
            border: 1px solid rgba(139, 115, 85, 0.5);
            border-radius: 3px;
            padding: 2px 4px;
            text-align: center;
            outline: none;
        }

        .knob-input:focus {
            border-color: #5a7a6a;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="anatomy-overlay"></div>

        <!-- Header -->
        <div id="header">
            <h1>Ouaricon Granular Freeze</h1>
        </div>

        <!-- Grain particles -->
        <div id="grain-particles">
            <div class="particle" style="left: 30%; top: 20%; animation-delay: 0s;"></div>
            <div class="particle" style="left: 70%; top: 30%; animation-delay: 0.5s;"></div>
            <div class="particle" style="left: 50%; top: 70%; animation-delay: 1s;"></div>
            <div class="particle" style="left: 20%; top: 60%; animation-delay: 1.5s;"></div>
            <div class="particle" style="left: 80%; top: 50%; animation-delay: 2s;"></div>
            <div class="particle" style="left: 40%; top: 80%; animation-delay: 2.5s;"></div>
        </div>

        <!-- Central freeze button -->
        <div id="freeze-container">
            <div id="freeze-button">
                <svg viewBox="0 0 140 140">
                    <!-- Organic irregular shape -->
                    <path id="freeze-shape" d="
                        M 70,10
                        C 90,10 100,15 110,25
                        C 120,35 130,50 130,70
                        C 130,90 125,105 115,115
                        C 105,125 90,130 70,130
                        C 50,130 35,125 25,115
                        C 15,105 10,90 10,70
                        C 10,50 15,35 25,25
                        C 35,15 50,10 70,10
                        Z
                    "/>
                </svg>
                <div id="freeze-label">Freeze</div>
            </div>
        </div>

        <!-- Mode toggle -->
        <div id="mode-toggle-container">
            <div id="mode-toggle">
                <div class="mode-option active" data-mode="0">Manual</div>
                <div class="mode-option" data-mode="1">Threshold</div>
            </div>
        </div>

        <!-- Knobs -->
        <div id="knobs-container">
            <!-- Threshold knob -->
            <div class="knob disabled" id="threshold-knob">
                <div class="knob-visual">
                    <svg viewBox="0 0 60 60">
                        <circle class="knob-track" cx="30" cy="30" r="25"/>
                        <circle class="knob-vine" cx="30" cy="30" r="25"
                            stroke-dasharray="157" stroke-dashoffset="39.25"/>
                    </svg>
                </div>
                <div class="knob-label">Threshold</div>
                <div class="knob-value">-40.0 dB</div>
            </div>

            <!-- Drift knob -->
            <div class="knob" id="drift-knob">
                <div class="knob-visual">
                    <svg viewBox="0 0 60 60">
                        <circle class="knob-track" cx="30" cy="30" r="25"/>
                        <circle class="knob-vine" cx="30" cy="30" r="25"
                            stroke-dasharray="157" stroke-dashoffset="157"/>
                    </svg>
                </div>
                <div class="knob-label">Drift</div>
                <div class="knob-value">0%</div>
            </div>

            <!-- Mix knob -->
            <div class="knob" id="mix-knob">
                <div class="knob-visual">
                    <svg viewBox="0 0 60 60">
                        <circle class="knob-track" cx="30" cy="30" r="25"/>
                        <circle class="knob-vine" cx="30" cy="30" r="25"
                            stroke-dasharray="157" stroke-dashoffset="0"/>
                    </svg>
                </div>
                <div class="knob-label">Mix</div>
                <div class="knob-value">100%</div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as Juce from './js/juce/index.js';

        // Parameter states
        let freezeState, thresholdState, modeState, driftState, mixState;

        // Global drag state (fixes the scope issue with knob dragging)
        const dragState = {
            isDragging: false,
            target: null,
            startY: 0,
            startValue: 0
        };

        // Knob configurations for lookup
        const knobConfigs = {};

        // Wait for JUCE backend
        function initializeJUCE() {
            if (typeof window.__JUCE__ === 'undefined') {
                console.warn('JUCE backend not available');
                return;
            }

            // Get parameter states
            freezeState = Juce.getToggleState('FREEZE');
            thresholdState = Juce.getSliderState('THRESHOLD');
            modeState = Juce.getToggleState('MODE');
            driftState = Juce.getSliderState('DRIFT');
            mixState = Juce.getSliderState('MIX');

            // Initialize UI from parameter values
            updateFreezeUI();
            updateThresholdUI();
            updateModeUI();
            updateDriftUI();
            updateMixUI();

            // Set up parameter listeners
            freezeState.valueChangedEvent.addListener(() => {
                updateFreezeUI();
            });

            thresholdState.valueChangedEvent.addListener(() => {
                updateThresholdUI();
            });

            modeState.valueChangedEvent.addListener(() => {
                updateModeUI();
            });

            driftState.valueChangedEvent.addListener(() => {
                updateDriftUI();
            });

            mixState.valueChangedEvent.addListener(() => {
                updateMixUI();
            });

            // Set up UI event handlers
            setupFreezeButton();
            setupModeToggle();
            setupKnobs();
            setupGlobalDragHandlers();
        }

        // Freeze button
        function setupFreezeButton() {
            const freezeBtn = document.getElementById('freeze-button');
            freezeBtn.addEventListener('click', () => {
                const currentMode = modeState.getValue();
                if (currentMode) return; // Disabled in Threshold mode

                const newValue = !freezeState.getValue();
                freezeState.setValue(newValue);
            });
        }

        function updateFreezeUI() {
            const freezeBtn = document.getElementById('freeze-button');
            const particles = document.getElementById('grain-particles');
            const isActive = freezeState.getValue();
            const isManualMode = !modeState.getValue();

            if (isActive) {
                freezeBtn.classList.add('active');
                particles.classList.add('active');
            } else {
                freezeBtn.classList.remove('active');
                particles.classList.remove('active');
            }

            if (!isManualMode) {
                freezeBtn.classList.add('disabled');
            } else {
                freezeBtn.classList.remove('disabled');
            }
        }

        // Mode toggle
        function setupModeToggle() {
            const modeOptions = document.querySelectorAll('.mode-option');
            modeOptions.forEach(option => {
                option.addEventListener('click', () => {
                    const modeIndex = parseInt(option.dataset.mode);
                    modeState.setValue(modeIndex === 1);
                });
            });
        }

        function updateModeUI() {
            const modeOptions = document.querySelectorAll('.mode-option');
            const isThresholdMode = modeState.getValue();
            const modeIndex = isThresholdMode ? 1 : 0;

            modeOptions.forEach((option, index) => {
                if (index === modeIndex) {
                    option.classList.add('active');
                } else {
                    option.classList.remove('active');
                }
            });

            // Update disabled states
            const freezeBtn = document.getElementById('freeze-button');
            const thresholdKnob = document.getElementById('threshold-knob');

            if (isThresholdMode) {
                freezeBtn.classList.add('disabled');
                thresholdKnob.classList.remove('disabled');
            } else {
                freezeBtn.classList.remove('disabled');
                thresholdKnob.classList.add('disabled');
            }
        }

        // Global drag handlers (set up once)
        function setupGlobalDragHandlers() {
            document.addEventListener('mousemove', (e) => {
                if (!dragState.isDragging || !dragState.target) return;

                const config = knobConfigs[dragState.target];
                if (!config) return;

                const deltaY = dragState.startY - e.clientY;
                const sensitivity = 0.005;
                let newNormalised = dragState.startValue + (deltaY * sensitivity);
                newNormalised = Math.max(0, Math.min(1, newNormalised));

                config.state.setNormalisedValue(newNormalised);
            });

            document.addEventListener('mouseup', () => {
                if (!dragState.isDragging) return;

                const config = knobConfigs[dragState.target];
                if (config) {
                    config.state.sliderDragEnded();
                }

                dragState.isDragging = false;
                dragState.target = null;
            });
        }

        // Knobs
        function setupKnobs() {
            setupKnob('threshold-knob', thresholdState, -60, 0, val => `${val.toFixed(1)} dB`, 'dB');
            setupKnob('drift-knob', driftState, 0, 100, val => `${val.toFixed(0)}%`, '%');
            setupKnob('mix-knob', mixState, 0, 100, val => `${val.toFixed(0)}%`, '%');
        }

        function setupKnob(knobId, state, min, max, formatValue, unit) {
            const knob = document.getElementById(knobId);
            const vine = knob.querySelector('.knob-vine');
            const valueDisplay = knob.querySelector('.knob-value');

            // Store config for global handler
            knobConfigs[knobId] = { state, min, max, formatValue, unit, vine, valueDisplay };

            // Mousedown on knob visual to start drag
            const knobVisual = knob.querySelector('.knob-visual');
            knobVisual.addEventListener('mousedown', (e) => {
                if (knob.classList.contains('disabled')) return;

                e.preventDefault();
                dragState.isDragging = true;
                dragState.target = knobId;
                dragState.startY = e.clientY;
                dragState.startValue = state.getNormalisedValue();
                state.sliderDragStarted();
            });

            // Double-click on value to edit
            valueDisplay.addEventListener('dblclick', (e) => {
                if (knob.classList.contains('disabled')) return;
                e.stopPropagation();
                showValueInput(knobId);
            });

            function updateKnobVisual() {
                // Don't update if we're editing
                if (valueDisplay.style.display === 'none') return;

                const normalised = state.getNormalisedValue();
                const scaledValue = state.getScaledValue();

                // Update vine arc (270 degrees total, starts at -135deg)
                const circumference = 2 * Math.PI * 25; // r=25
                const arcLength = circumference * 0.75; // 270 degrees
                const offset = arcLength - (normalised * arcLength);
                vine.style.strokeDashoffset = offset;

                // Update value display
                valueDisplay.textContent = formatValue(scaledValue);
            }

            // Store update function
            knob.updateVisual = updateKnobVisual;
        }

        function showValueInput(knobId) {
            const config = knobConfigs[knobId];
            const knob = document.getElementById(knobId);
            const valueDisplay = config.valueDisplay;

            // Create input element
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'knob-input';

            // Get current value without unit
            const currentValue = config.state.getScaledValue();
            input.value = config.unit === 'dB' ? currentValue.toFixed(1) : currentValue.toFixed(0);

            // Hide value display, show input
            valueDisplay.style.display = 'none';
            valueDisplay.parentNode.insertBefore(input, valueDisplay.nextSibling);
            input.focus();
            input.select();

            function commitValue() {
                let newValue = parseFloat(input.value);
                if (!isNaN(newValue)) {
                    // Clamp to range
                    newValue = Math.max(config.min, Math.min(config.max, newValue));
                    // Convert to normalised and set
                    const normalised = (newValue - config.min) / (config.max - config.min);
                    config.state.setNormalisedValue(normalised);
                }
                cleanup();
            }

            function cleanup() {
                input.remove();
                valueDisplay.style.display = '';
                knob.updateVisual();
            }

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    commitValue();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    cleanup();
                }
            });

            input.addEventListener('blur', () => {
                commitValue();
            });
        }

        function updateThresholdUI() {
            const knob = document.getElementById('threshold-knob');
            if (knob.updateVisual) knob.updateVisual();
        }

        function updateDriftUI() {
            const knob = document.getElementById('drift-knob');
            if (knob.updateVisual) knob.updateVisual();
        }

        function updateMixUI() {
            const knob = document.getElementById('mix-knob');
            if (knob.updateVisual) knob.updateVisual();
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeJUCE);
        } else {
            initializeJUCE();
        }
    </script>
</body>
</html>

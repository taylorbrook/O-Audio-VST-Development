<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=550, initial-scale=1.0, height=530">
    <title>O-Freeze - Ouaricon Granular Freeze</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 550px;
            height: 530px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #1a1410;
        }

        #app {
            width: 550px;
            height: 530px;
            position: relative;
            background-image: url('assets/paper1.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Anatomical overlay */
        #anatomy-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/muscles.png');
            background-size: cover;
            background-position: center;
            opacity: 0.28;
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        /* Header bar */
        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(42, 35, 28, 0.85);
            border-bottom: 1px solid rgba(139, 115, 85, 0.3);
            z-index: 10;
        }

        #header h1 {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1.5px;
            color: #b0a590;
            text-transform: uppercase;
        }

        /* Central freeze button */
        #freeze-container {
            position: absolute;
            top: calc(50% - 25px);
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        #freeze-button {
            width: 140px;
            height: 140px;
            cursor: pointer;
            position: relative;
        }

        #freeze-button svg {
            width: 100%;
            height: 100%;
        }

        #freeze-shape {
            fill: #3a5a4a;
            stroke: #2a4a3a;
            stroke-width: 2;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }

        #freeze-button:hover #freeze-shape {
            fill: #4a6a5a;
        }

        #freeze-button.active #freeze-shape {
            fill: #5a8a6a;
            stroke: #4a7a5a;
        }

        #freeze-button.active #freeze-shape {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #freeze-button.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #freeze-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #b0a590;
            text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        /* Grain activity visualization */
        #grain-particles {
            position: absolute;
            top: calc(50% - 25px);
            left: 50%;
            width: 160px;
            height: 160px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #grain-particles.active {
            opacity: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #7a9a8a;
            border-radius: 50%;
            opacity: 0;
            animation: particle-float 3s ease-in-out infinite;
        }

        @keyframes particle-float {
            0%, 100% { opacity: 0; transform: translate(0, 0); }
            50% { opacity: 0.6; }
        }

        /* Reverse toggle */
        #reverse-container {
            position: absolute;
            top: calc(50% - 125px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        #reverse-toggle {
            padding: 6px 18px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #6a5540;
            cursor: pointer;
            text-transform: uppercase;
            /* v2.1.0 GEOMETRY PIN — pinned to the ENGLISH box, not above it.
               The French caption renders NARROWER than REVERSE, and this pill
               shrink-wraps inside #reverse-container, which is centred by
               translateX(-50%). A narrower pill therefore moves the CONTAINER,
               and #reverse-container is a non-label element, so
               check-ui-labels assertion 7 reports it. 95.5 px is the measured
               English border-box (57.50 text + 18 + 18 padding + 1 + 1 border)
               rounded to nothing at all: English is already exactly 95.5, so
               the pin costs it zero movement, and French is held at the same
               box. text-align is a no-op in English for the same reason and
               centres the shorter French caption.

               v2.2.1 UPDATE — the caption changed and the pin got MORE load,
               not less. The suite glossary settles "reverse" on Inversion
               (abbreviated Invers.); v2.1.0's INVERSE was 55.33 px and 2.17 px
               under the English, Invers. is 51.11 and 6.39 px under it.
               Inversion itself does not fit at all: 71.05 px of text pushes
               the border-box to 109.05, past this pin, and moves the toggle
               AND the container.
               Negative control, re-measured at v2.2.1 rather than recomputed
               (min-width neutralised in the live CSSOM, this file untouched):
               with the pin PRESENT #reverse-container is [227.25, 95.5] in
               both languages, dx 0 dw 0. With it REMOVED, French becomes
               [230.45, 89.11] — dx +3.20, dw -6.39, and assertion 7 fails. */
            min-width: 95.5px;
            text-align: center;
            border: 1px solid rgba(139, 115, 85, 0.4);
            border-radius: 3px;
            background: rgba(42, 35, 28, 0.5);
            transition: background 0.2s ease, color 0.2s ease;
        }

        #reverse-toggle:hover {
            background: rgba(139, 115, 85, 0.2);
        }

        #reverse-toggle.active {
            background: rgba(90, 122, 106, 0.6);
            color: #b0a590;
        }

        /* Mode toggle */
        #mode-toggle-container {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        #mode-toggle {
            display: flex;
            border: 1px solid rgba(139, 115, 85, 0.4);
            border-radius: 3px;
            overflow: hidden;
            background: rgba(42, 35, 28, 0.5);
        }

        .mode-option {
            padding: 8px 20px;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: #6a5540;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
            text-transform: uppercase;
        }

        .mode-option:hover {
            background: rgba(139, 115, 85, 0.2);
        }

        .mode-option.active {
            background: rgba(90, 122, 106, 0.6);
            color: #b0a590;
        }

        .mode-option:not(:last-child) {
            border-right: 1px solid rgba(139, 115, 85, 0.3);
        }

        /* Knobs container */
        #knobs-container {
            position: absolute;
            top: 320px;
            left: 50%;
            transform: translateX(-50%);
            width: 530px;
            display: flex;
            justify-content: space-around;
            z-index: 5;
        }

        /* LFO group below Drift knob */
        #lfo-group {
            position: absolute;
            top: 430px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            z-index: 5;
            padding: 8px 16px;
            background: rgba(120, 105, 85, 0.45);
            border: 1px solid rgba(160, 140, 110, 0.4);
            border-radius: 4px;
        }

        #lfo-group-label {
            position: absolute;
            top: -9px;
            left: 12px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #111;
            text-transform: uppercase;
            background: #3a3228;
            padding: 0 4px;
        }

        .knob-small {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .knob-small .knob-visual {
            width: 42px;
            height: 42px;
        }

        .knob-small .knob-vine {
            stroke: #7ab08a;
            stroke-width: 3.5;
        }

        .knob-small .knob-label {
            margin-top: 4px;
            font-size: 11px;
            color: #111;
        }

        .knob-small .knob-value {
            margin-top: 1px;
            font-size: 12px;
            color: #111;
        }

        /* LFO shape toggle (reuses mode-toggle style) */
        #lfo-shape-toggle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #lfo-shape-selector {
            display: flex;
            border: 1px solid rgba(139, 115, 85, 0.3);
            border-radius: 3px;
            overflow: hidden;
            background: rgba(42, 35, 28, 0.5);
        }

        .lfo-shape-option {
            padding: 4px 8px;
            font-size: 11px;
            letter-spacing: 0.3px;
            color: #111;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .lfo-shape-option:hover {
            background: rgba(139, 115, 85, 0.2);
        }

        .lfo-shape-option.active {
            background: rgba(90, 122, 106, 0.6);
            color: #b0a590;
        }

        .lfo-shape-option:not(:last-child) {
            border-right: 1px solid rgba(139, 115, 85, 0.2);
        }

        /* v2.1.0 GEOMETRY PIN — the third shape option only.
           Rnd -> Alé is 4.69 px NARROWER. The selector shrink-wraps its three
           options, #lfo-shape-toggle shrink-wraps the selector, #lfo-group
           shrink-wraps its row, and #lfo-group is centred by translateX(-50%),
           so those 4.69 px re-centre the whole group and move fourteen
           non-label boxes. Sin and Tri are sameAsEn and do not move.

           37.5 px, not 37.44 (the measured English border-box) and not 38: at
           37.5 English changes by 0.06 px and French is pinned to the same
           37.5, both inside the gate's 0.5 px tolerance, and the number is one
           a human can read. Pinning ALL THREE options instead would equalise
           them and move the ENGLISH layout, which is the pin the brief warns
           against — this is per-element, and it is the element that needed it.
           Negative control: removing it re-breaks assertion 7 with
           #lfo-shape-selector dw=-4.69 and eleven boxes carried with it. */
        .lfo-shape-option:last-child {
            min-width: 37.5px;
            text-align: center;
        }

        /* ===== SETTINGS POPOVER (v2.1.0) =====
           Styled in THIS page's vocabulary rather than pasted in from another
           plugin: the rgba(42, 35, 28, ...) panel over a rgba(139, 115, 85,
           0.4) border, the rgba(90, 122, 106, 0.6) green active state, the
           #b0a590 / #6a5540 type pair, Georgia, uppercase with letter-spacing —
           the same rules #mode-toggle and #reverse-toggle already use.

           The cluster sits top-right INSIDE the 50 px header bar. The h1 is
           centred and spans x 118.8..431.2; the gear occupies 516..538, clear
           by 85 px. z-index 60 puts it above the header (10) and the control
           layer (5). Absolutely positioned, so it adds no flow and moves
           nothing: the English before/after diff is 0 moved. */
        #settings-cluster {
            position: absolute;
            top: 14px;
            right: 12px;
            z-index: 60;
        }

        #gear-btn {
            width: 22px;
            height: 22px;
            padding: 0;
            background: rgba(42, 35, 28, 0.5);
            border: 1px solid rgba(139, 115, 85, 0.4);
            border-radius: 50%;
            color: #b0a590;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, color 0.2s ease;
        }

        #gear-btn:hover {
            background: rgba(139, 115, 85, 0.2);
        }

        #gear-btn[aria-expanded="true"] {
            background: rgba(90, 122, 106, 0.6);
        }

        #gear-btn:focus-visible {
            outline: 1px solid rgba(139, 115, 85, 0.8);
            outline-offset: 2px;
        }

        /* Opens DOWNWARDS and to the left: the gear is 14 px from the top of a
           530 px frame, so a panel above it would leave the frame entirely.

           WIDTH IS PINNED, not min-width. #settings-popover is not a
           [data-i18n] element, so assertion 7 measures its box in BOTH
           languages and any language-driven resize is a reported failure. A
           hard width makes the panel's rect language-invariant by construction.
           184 px holds the English row (LANGUAGE + English) and the French one
           (LANGUE + Français) with room to spare, measured as rendered rather
           than from a font probe: text-transform and letter-spacing are not in
           getComputedStyle().font. */
        #settings-popover {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 61;
            width: 184px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            background: rgba(42, 35, 28, 0.97);
            border: 1px solid rgba(139, 115, 85, 0.4);
            border-radius: 3px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
        }

        #settings-popover[hidden] {
            display: none;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        /* nowrap because the row is space-between: a caption that wrapped would
           grow the row's height and move the control beside it. */
        .settings-label {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 10px;
            letter-spacing: 1px;
            color: #b0a590;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .settings-select {
            flex: 0 0 auto;
            padding: 2px 4px;
            background: rgba(42, 35, 28, 0.9);
            border: 1px solid rgba(139, 115, 85, 0.4);
            border-radius: 3px;
            color: #b0a590;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 10px;
            line-height: 1.2;
            cursor: pointer;
        }

        .settings-select:focus-visible {
            outline: 1px solid rgba(139, 115, 85, 0.8);
            outline-offset: 1px;
        }

        #lfo-shape-label {
            margin-bottom: 4px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #111;
            text-transform: uppercase;
        }

        .knob {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .knob.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .knob-visual {
            width: 60px;
            height: 60px;
            position: relative;
        }

        .knob-visual svg {
            width: 100%;
            height: 100%;
            transform: rotate(-135deg);
        }

        .knob-track {
            fill: none;
            stroke: rgba(139, 115, 85, 0.3);
            stroke-width: 2;
        }

        .knob-vine {
            fill: none;
            stroke: #5a7a6a;
            stroke-width: 3;
            stroke-linecap: round;
            /* Smooth animation handled by JS interpolation loop */
        }

        .knob-label {
            margin-top: 8px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #6a5540;
            text-transform: uppercase;
        }

        .knob-value {
            margin-top: 2px;
            font-size: 11px;
            color: #7a6850;
            cursor: pointer;
            min-width: 60px;
            text-align: center;
        }

        .knob-value:hover {
            color: #b0a590;
        }

        .knob-input {
            width: 60px;
            margin-top: 2px;
            font-size: 11px;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #b0a590;
            background: rgba(42, 35, 28, 0.9);
            border: 1px solid rgba(139, 115, 85, 0.5);
            border-radius: 3px;
            padding: 2px 4px;
            text-align: center;
            outline: none;
        }

        .knob-input:focus {
            border-color: #5a7a6a;
        }

        /* ===== HOVER-HELP SURFACE (v2.2.0) =====
           Styled in THIS page's vocabulary, not pasted in: the same
           rgba(42, 35, 28, 0.97) panel over a rgba(139, 115, 85, 0.4) border and
           the same shadow as #settings-popover, Georgia, #b0a590 body type, and
           the #7a9a8a green of .particle for the uppercase title.

           Every declaration below is load-bearing:

             position: fixed        the surface is placed against the VIEWPORT by
                                    setupTooltips(), which is what makes the
                                    four-edge clamp arithmetic mean anything.
                                    left/top are seeded at 0 so the box has a
                                    rect to measure before the first placement.
             visibility: hidden     hidden until shown. NOT because
                                    check-ui-labels would catch a visible empty
                                    surface — measured on O-Bass, it does not: a
                                    fixed box at 0,0 has the same rect in both
                                    languages, so it neither moves nor changes
                                    the visible set. What catches it is
                                    check-i18n assertion 10 and boot-all-uis'
                                    text count. It is hidden because a visible
                                    empty box is a visible empty box.
             pointer-events: none   or the surface steals the hover that is
                                    keeping it open, and the tip flickers.
             max-width: 230px       a 550 px frame. French runs 15-20% longer
                                    than English and wraps to more lines against
                                    this cap, so the tip grows TALLER in French,
                                    which is the direction the bottom-edge clamp
                                    exists for.
             z-index: 100           above #settings-popover (61), the settings
                                    cluster (60), the header (10) and the control
                                    layer (5). */
        .tooltip {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            max-width: 230px;
            padding: 7px 10px;
            background: rgba(42, 35, 28, 0.97);
            border: 1px solid rgba(139, 115, 85, 0.4);
            border-radius: 3px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 11px;
            line-height: 1.4;
            color: #b0a590;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.12s ease;
            pointer-events: none;
        }

        .tooltip.show {
            opacity: 1;
            visibility: visible;
        }

        .tooltip .tip-title {
            display: block;
            margin-bottom: 3px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #7a9a8a;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="anatomy-overlay"></div>

        <!-- Header. The h1 is NOT a [data-i18n] element: a product name is
             never translated. It is declared in I18N_EXEMPT with that reason,
             so a genuinely missed label cannot hide here as a deliberate one. -->
        <div id="header">
            <h1>Ouaricon Granular Freeze</h1>
        </div>

        <!-- The settings cluster. STILL ONE ROW at v2.2.0, and that is a
             decision rather than an oversight: this version adds hover-help but
             no switch to turn it off. Two plugins in the suite have such a
             toggle and nineteen do not, so making it uniform is a pass across
             all 41 — plus a persisted preference through C++ and a
             data-tip-always bypass so the toggle's own tip survives being
             switched off — not a side effect of adding the copy. -->
        <div id="settings-cluster">
            <button type="button" id="gear-btn"
                    aria-haspopup="dialog" aria-expanded="false"
                    data-i18n-aria="aria.settings" aria-label="Settings">&#9881;</button>

            <div id="settings-popover" role="dialog"
                 data-i18n-aria="aria.settings" aria-label="Settings" hidden>
                <label class="settings-row" for="lang-select">
                    <!-- data-label so a state updater that writes textContent
                         reads the authored caption back instead of erasing it
                         (pattern_js_state_updater_overwrites_html_labels). -->
                    <span class="settings-label" data-i18n="label.language" data-label="Language">Language</span>
                    <!-- ENDONYMS. Never localized: a French speaker looking for
                         their language looks for "Fran&ccedil;ais". -->
                    <select class="settings-select" id="lang-select"
                            data-i18n-aria="aria.langSelect" aria-label="Interface language">
                        <option value="en">English</option>
                        <option value="fr">Fran&ccedil;ais</option>
                    </select>
                </label>
            </div>
        </div>

        <!-- Grain particles -->
        <div id="grain-particles">
            <div class="particle" style="left: 30%; top: 20%; animation-delay: 0s;"></div>
            <div class="particle" style="left: 70%; top: 30%; animation-delay: 0.5s;"></div>
            <div class="particle" style="left: 50%; top: 70%; animation-delay: 1s;"></div>
            <div class="particle" style="left: 20%; top: 60%; animation-delay: 1.5s;"></div>
            <div class="particle" style="left: 80%; top: 50%; animation-delay: 2s;"></div>
            <div class="particle" style="left: 40%; top: 80%; animation-delay: 2.5s;"></div>
        </div>

        <!-- Central freeze button -->
        <div id="freeze-container">
            <div id="freeze-button">
                <svg viewBox="0 0 140 140">
                    <!-- Organic irregular shape -->
                    <path id="freeze-shape" d="
                        M 70,10
                        C 90,10 100,15 110,25
                        C 120,35 130,50 130,70
                        C 130,90 125,105 115,115
                        C 105,125 90,130 70,130
                        C 50,130 35,125 25,115
                        C 15,105 10,90 10,70
                        C 10,50 15,35 25,25
                        C 35,15 50,10 70,10
                        Z
                    "/>
                </svg>
                <div id="freeze-label" data-i18n="label.freeze" data-label="Freeze">Freeze</div>
            </div>
        </div>

        <!-- Reverse toggle -->
        <div id="reverse-container">
            <div id="reverse-toggle" data-i18n="label.reverse" data-label="Reverse">Reverse</div>
        </div>

        <!-- Mode toggle. BOTH captions are the MODE AudioParameterChoice
             option strings VERBATIM (PluginProcessor.cpp:52-56), so both are
             EXEMPT under D-01 arm 1 and carry no key: the page and the host
             automation lane have to agree about the same setting. -->
        <div id="mode-toggle-container">
            <div id="mode-toggle">
                <div class="mode-option active" data-mode="0">Manual</div>
                <div class="mode-option" data-mode="1">Threshold</div>
            </div>
        </div>

        <!-- Knobs -->
        <div id="knobs-container">
            <!-- Threshold knob -->
            <div class="knob disabled" id="threshold-knob">
                <div class="knob-visual">
                    <svg viewBox="0 0 60 60">
                        <circle class="knob-track" cx="30" cy="30" r="25"/>
                        <circle class="knob-vine" cx="30" cy="30" r="25"
                            stroke-dasharray="157" stroke-dashoffset="39.25"/>
                    </svg>
                </div>
                <!-- EXEMPT, not missed: the same word as the MODE choice
                     option above, naming the same setting. See the block
                     comment on the "Threshold" entry in js/i18n.js. -->
                <div class="knob-label">Threshold</div>
                <!-- A READOUT node. Never a [data-i18n] element (contract 5,

                         "Sine", "Triangle", "Random" (PluginProcessor.cpp:108).

                         three localize. -->
                    <div class="lfo-shape-option active" data-shape="0" data-i18n="label.shape.sin" data-label="Sin">Sin</div>

    <!-- The hover-help surface (v2.2.0). ONE surface for the whole page,
         positioned against the viewport by setupTooltips() in the module below
         and filled with createElement + textContent, never innerHTML. It sits
         OUTSIDE #app deliberately: position:fixed already takes it out of flow,
         and keeping it out of #app means it can never be measured as a child of
         a control it is describing. Empty until the first hover. -->
    <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

    <script type="module">
        import * as Juce from './js/juce/index.js';

        // v2.1.0: the label table. The canonical import line, re-rooted from
        // './i18n.js' to './js/i18n.js' because this plugin's controller is an
        // inline <script type="module"> at the UI root rather than a js/app.js.
        // check-i18n assertion 6 accepts exactly that one substitution and
        // nothing else. I18N and TIP_BINDINGS are both EMPTY here (this page has
        // no hover-help) and are imported anyway so the canon block below stays
        // byte-identical to the other forty-two copies.
        import { LANGUAGES, I18N, LABELS, TIP_BINDINGS, tr } from './js/i18n.js';

        // Parameter states
        let freezeState, reverseState, thresholdState, modeState, driftState, grainSizeState, grainCountState, detuneState, mixState;
        let lfoRateState, lfoDepthState, lfoShapeState;

        // Global drag state (fixes the scope issue with knob dragging)
        const dragState = {
            isDragging: false,
            target: null,
            startY: 0,
            startValue: 0
        };

        // Knob configurations for lookup
        const knobConfigs = {};

        // Animation state for smooth knob movement
        const animationState = {
            targets: {},      // { knobId: { current: 0, target: 0, vine: element, arcLength: number } }
            frameId: null,
            isRunning: false,
            smoothingFactor: 0.15  // Exponential smoothing (0-1, lower = smoother but slower)
        };

        // Animation loop for smooth knob interpolation
        const animationLoop = (timestamp) => {
            let needsUpdate = false;

            Object.entries(animationState.targets).forEach(([id, state]) => {
                const delta = state.target - state.current;

                // Only update if there's meaningful difference
                if (Math.abs(delta) > 0.0001) {
                    // Exponential easing toward target
                    state.current += delta * animationState.smoothingFactor;
                    needsUpdate = true;

                    // Update vine arc visual
                    const offset = state.arcLength - (state.current * state.arcLength);
                    state.vine.style.strokeDashoffset = offset;
                }
            });

            // Continue loop if any knob needs updating
            if (needsUpdate) {
                animationState.frameId = requestAnimationFrame(animationLoop);
            } else {
                animationState.isRunning = false;
                animationState.frameId = null;
            }
        };

        // Start animation loop if not already running
        const startAnimationLoop = () => {
            if (!animationState.isRunning) {
                animationState.isRunning = true;
                animationState.frameId = requestAnimationFrame(animationLoop);
            }
        };

        // Wait for JUCE backend
        function initializeJUCE() {
            if (typeof window.__JUCE__ === 'undefined') {
                console.warn('JUCE backend not available');
                return;
            }

            // Get parameter states
            freezeState = Juce.getToggleState('FREEZE');
            reverseState = Juce.getToggleState('REVERSE');
            thresholdState = Juce.getSliderState('THRESHOLD');
            modeState = Juce.getComboBoxState('MODE');
            driftState = Juce.getSliderState('DRIFT');
            grainSizeState = Juce.getSliderState('GRAIN_SIZE');
            grainCountState = Juce.getSliderState('GRAIN_COUNT');
            detuneState = Juce.getSliderState('DETUNE');
            mixState = Juce.getSliderState('MIX');
            lfoRateState = Juce.getSliderState('LFO_RATE');
            lfoDepthState = Juce.getSliderState('LFO_DEPTH');
            lfoShapeState = Juce.getComboBoxState('LFO_SHAPE');

            // Initialize UI from parameter values
            updateFreezeUI();
            updateReverseUI();
            updateModeUI();
            updateLfoShapeUI();
            updateKnobUI('threshold-knob');
            updateKnobUI('drift-knob');
            updateKnobUI('grain-size-knob');
            updateKnobUI('grain-count-knob');
            updateKnobUI('detune-knob');
            updateKnobUI('mix-knob');
            updateKnobUI('lfo-rate-knob');
            updateKnobUI('lfo-depth-knob');

            // Set up parameter listeners
            freezeState.valueChangedEvent.addListener(() => {
                updateFreezeUI();
            });

            reverseState.valueChangedEvent.addListener(() => {
                updateReverseUI();
            });

            thresholdState.valueChangedEvent.addListener(() => updateKnobUI('threshold-knob'));
            modeState.valueChangedEvent.addListener(() => updateModeUI());
            driftState.valueChangedEvent.addListener(() => updateKnobUI('drift-knob'));
            grainSizeState.valueChangedEvent.addListener(() => updateKnobUI('grain-size-knob'));
            grainCountState.valueChangedEvent.addListener(() => updateKnobUI('grain-count-knob'));
            detuneState.valueChangedEvent.addListener(() => updateKnobUI('detune-knob'));
            mixState.valueChangedEvent.addListener(() => updateKnobUI('mix-knob'));
            lfoRateState.valueChangedEvent.addListener(() => updateKnobUI('lfo-rate-knob'));
            lfoDepthState.valueChangedEvent.addListener(() => updateKnobUI('lfo-depth-knob'));
            lfoShapeState.valueChangedEvent.addListener(() => updateLfoShapeUI());

            // Set up UI event handlers
            setupFreezeButton();
            setupReverseToggle();
            setupModeToggle();
            setupKnobs();
            setupLfoShapeToggle();
            setupGlobalDragHandlers();
        }

        // Freeze button
        function setupFreezeButton() {
            const freezeBtn = document.getElementById('freeze-button');
            freezeBtn.addEventListener('click', () => {
                if (modeState.getChoiceIndex() === 1) return; // Disabled in Threshold mode

                const newValue = !freezeState.getValue();
                freezeState.setValue(newValue);
            });
        }

        function updateFreezeUI() {
            const freezeBtn = document.getElementById('freeze-button');
            const particles = document.getElementById('grain-particles');
            const isActive = freezeState.getValue();
            const isManualMode = modeState.getChoiceIndex() === 0;

            freezeBtn.classList.toggle('active', isActive);
            particles.classList.toggle('active', isActive);
            freezeBtn.classList.toggle('disabled', !isManualMode);
        }

        // Reverse toggle
        function setupReverseToggle() {
            const reverseBtn = document.getElementById('reverse-toggle');
            reverseBtn.addEventListener('click', () => {
                const newValue = !reverseState.getValue();
                reverseState.setValue(newValue);
            });
        }

        function updateReverseUI() {
            const reverseBtn = document.getElementById('reverse-toggle');
            reverseBtn.classList.toggle('active', reverseState.getValue());
        }

        // Mode toggle
        function setupModeToggle() {
            const modeOptions = document.querySelectorAll('.mode-option');
            modeOptions.forEach(option => {
                option.addEventListener('click', () => {
                    const modeIndex = parseInt(option.dataset.mode);
                    modeState.setChoiceIndex(modeIndex);
                });
            });
        }

        function updateModeUI() {
            const modeOptions = document.querySelectorAll('.mode-option');
            const modeIndex = modeState.getChoiceIndex();
            const isThresholdMode = modeIndex === 1;

            modeOptions.forEach((option, index) => {
                option.classList.toggle('active', index === modeIndex);
            });

            const freezeBtn = document.getElementById('freeze-button');
            const thresholdKnob = document.getElementById('threshold-knob');
            freezeBtn.classList.toggle('disabled', isThresholdMode);
            thresholdKnob.classList.toggle('disabled', !isThresholdMode);
        }

        // Global drag handlers (set up once)
        function setupGlobalDragHandlers() {
            document.addEventListener('mousemove', (e) => {
                if (!dragState.isDragging || !dragState.target) return;

                const config = knobConfigs[dragState.target];
                if (!config) return;

                const deltaY = dragState.startY - e.clientY;
                const sensitivity = 0.005;
                let newNormalised = dragState.startValue + (deltaY * sensitivity);
                newNormalised = Math.max(0, Math.min(1, newNormalised));

                config.state.setNormalisedValue(newNormalised);
            });

            document.addEventListener('mouseup', () => {
                if (!dragState.isDragging) return;

                const config = knobConfigs[dragState.target];
                if (config) {
                    config.state.sliderDragEnded();
                }

                dragState.isDragging = false;
                dragState.target = null;
            });
        }

        // Knobs
        function setupKnobs() {
            setupKnob('threshold-knob', thresholdState, -60, 0, val => `${val.toFixed(1)} dB`, 'dB');
            setupKnob('drift-knob', driftState, 0, 100, val => `${val.toFixed(0)}%`, '%');
            setupKnob('grain-size-knob', grainSizeState, 50, 1000, val => `${val.toFixed(0)} ms`, 'ms');
            setupKnob('grain-count-knob', grainCountState, 2, 32, val => `${Math.round(val)}`, '');
            setupKnob('detune-knob', detuneState, 0, 50, val => `${val.toFixed(1)} ct`, 'ct');
            setupKnob('mix-knob', mixState, 0, 100, val => `${val.toFixed(0)}%`, '%');
            setupKnob('lfo-rate-knob', lfoRateState, 0.01, 10, val => `${val.toFixed(2)} Hz`, 'Hz');
            setupKnob('lfo-depth-knob', lfoDepthState, 0, 100, val => `${val.toFixed(0)}%`, '%');
        }

        function setupKnob(knobId, state, min, max, formatValue, unit) {
            const knob = document.getElementById(knobId);
            const vine = knob.querySelector('.knob-vine');
            const valueDisplay = knob.querySelector('.knob-value');

            // Calculate arc length for this knob (r=25, 270 degrees = 0.75 circumference)
            const circumference = 2 * Math.PI * 25;
            const arcLength = circumference * 0.75;

            // Store config for global handler
            knobConfigs[knobId] = { state, min, max, formatValue, unit, vine, valueDisplay, arcLength };

            // Initialize animation state for this knob
            const initialNorm = state.getNormalisedValue();
            animationState.targets[knobId] = {
                current: initialNorm,
                target: initialNorm,
                vine: vine,
                arcLength: arcLength
            };

            // Set initial visual state (no animation needed for initial render)
            const initialOffset = arcLength - (initialNorm * arcLength);
            vine.style.strokeDashoffset = initialOffset;
            valueDisplay.textContent = formatValue(state.getScaledValue());

            // Mousedown on knob visual to start drag
            const knobVisual = knob.querySelector('.knob-visual');
            knobVisual.addEventListener('mousedown', (e) => {
                if (knob.classList.contains('disabled')) return;

                e.preventDefault();
                dragState.isDragging = true;
                dragState.target = knobId;
                dragState.startY = e.clientY;
                dragState.startValue = state.getNormalisedValue();
                state.sliderDragStarted();
            });

            // Double-click on value to edit
            valueDisplay.addEventListener('dblclick', (e) => {
                if (knob.classList.contains('disabled')) return;
                e.stopPropagation();
                showValueInput(knobId);
            });

            function updateKnobVisual() {
                // Don't update if we're editing
                if (valueDisplay.style.display === 'none') return;

                const normalised = state.getNormalisedValue();
                const scaledValue = state.getScaledValue();

                // Update animation target (will be smoothly interpolated)
                animationState.targets[knobId].target = normalised;

                // Update value display immediately (text updates feel better without lag)
                valueDisplay.textContent = formatValue(scaledValue);

                // Start animation loop if not running
                startAnimationLoop();
            }

            // Store update function
            knob.updateVisual = updateKnobVisual;
        }

        function showValueInput(knobId) {
            const config = knobConfigs[knobId];
            const knob = document.getElementById(knobId);
            const valueDisplay = config.valueDisplay;

            // Create input element
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'knob-input';

            // Get current value without unit
            const currentValue = config.state.getScaledValue();
            input.value = config.unit === 'dB' ? currentValue.toFixed(1) : currentValue.toFixed(0);

            // Hide value display, show input
            valueDisplay.style.display = 'none';
            valueDisplay.parentNode.insertBefore(input, valueDisplay.nextSibling);
            input.focus();
            input.select();

            function commitValue() {
                let newValue = parseFloat(input.value);
                if (!isNaN(newValue)) {
                    // Clamp to range
                    newValue = Math.max(config.min, Math.min(config.max, newValue));
                    // Convert to normalised and set
                    const normalised = (newValue - config.min) / (config.max - config.min);
                    config.state.setNormalisedValue(normalised);
                }
                cleanup();
            }

            function cleanup() {
                input.remove();
                valueDisplay.style.display = '';
                knob.updateVisual();
            }

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    commitValue();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    cleanup();
                }
            });

            input.addEventListener('blur', () => {
                commitValue();
            });
        }

        function updateKnobUI(knobId) {
            const knob = document.getElementById(knobId);
            if (knob.updateVisual) knob.updateVisual();
        }

        function setupLfoShapeToggle() {
            const shapeOptions = document.querySelectorAll('.lfo-shape-option');
            shapeOptions.forEach(option => {
                option.addEventListener('click', () => {
                    const shapeIndex = parseInt(option.dataset.shape);
                    lfoShapeState.setChoiceIndex(shapeIndex);
                });
            });
        }

        function updateLfoShapeUI() {
            const shapeOptions = document.querySelectorAll('.lfo-shape-option');
            const shapeIndex = lfoShapeState.getChoiceIndex();
            shapeOptions.forEach((option, index) => {
                option.classList.toggle('active', index === shapeIndex);
            });
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeJUCE);
        } else {
            initializeJUCE();
        }

        // ═══════════════════════════════════════════════════════════════════
        // i18n — the canon v2 block, VERBATIM from scripts/i18n-canon.js
        // ═══════════════════════════════════════════════════════════════════
        //
        // Byte-compared by check-i18n assertion 6 after comment stripping and
        // whitespace normalisation. Do not edit it here; edit the canon and
        // every copy together, which is the whole point of holding it as data.
        //
        // It sits at the END of the module, below every existing initializer,
        // and is REACHED only through the guarded initI18n() call at the very
        // bottom. A top-level statement up here that touched a lower `let`
        // would be a TDZ throw taking every later initializer with it, and on
        // this plugin "every later initializer" is the entire UI — the
        // controller is one inline module, not a file that can fail in
        // isolation (pattern_module_toplevel_init_tdz).

        let uiLanguage = 'en';
        let getUiLanguageNative = null;
        let setUiLanguageNative = null;

        // LABELS first, I18N as the fallback: a control whose tooltip title already IS
        // its label carries one key, not two copies of the same string.
        function trLabel(key, lang, vars) {
            const entry = (typeof LABELS === 'object' && LABELS && LABELS[key]) || I18N[key];
            if (!entry) { console.warn(`i18n: missing label key ${key}`); return key; }
            const s = entry[lang] || entry.en;
            const resolve = (v) => {
                const nested = (typeof LABELS === 'object' && LABELS && LABELS[v]) || I18N[v];
                return nested ? String((nested[lang] || nested.en).t) : String(v);
            };
            return vars
                ? String(s.t).replace(/\{(\w+)\}/g, (m, n) => (n in vars ? resolve(vars[n]) : m))
                : String(s.t);
        }

        function applyLabel(el) {
            const key = el.dataset.i18n;
            if (!key) return;
            let vars = null;
            try { vars = el.dataset.i18nVars ? JSON.parse(el.dataset.i18nVars) : null; }
            catch (e) { console.warn(`i18n: bad vars on ${key}`); }
            const s = trLabel(key, uiLanguage, vars);
            el.dataset.label = s;
            el.textContent   = s;
        }

        function applyI18nAttributes(el) {
            const pairs = [['i18nAria', 'aria-label'], ['i18nPlaceholder', 'placeholder'], ['i18nAlt', 'alt']];
            for (const [prop, attr] of pairs) {
                const key = el.dataset[prop];
                if (key) el.setAttribute(attr, trLabel(key, uiLanguage, null));
            }
        }

        function setLabel(el, key, vars) {
            if (!el) return;
            el.dataset.i18n = key;
            if (vars) el.dataset.i18nVars = JSON.stringify(vars); else delete el.dataset.i18nVars;
            applyLabel(el);
        }

        function applyI18n(lang) {
            uiLanguage = LANGUAGES.includes(lang) ? lang : 'en';
            // <html lang> follows the selector: screen readers pick the French voice,
            // and CSS hyphens:auto / quotes resolve in the page's actual language.
            document.documentElement.lang = uiLanguage;
            for (const [selector, key, wrapper, vars] of TIP_BINDINGS) {
                const el = document.querySelector(selector);
                if (!el) { console.warn(`i18n: tip target not found: ${selector}`); continue; }
                const target = wrapper ? (el.closest(wrapper) || el) : el;
                const s = tr(key, uiLanguage, vars);
                target.setAttribute('data-tip-title', s.t);
                target.setAttribute('data-tip', s.b);
            }
            for (const el of document.querySelectorAll('[data-i18n]')) applyLabel(el);
            for (const el of document.querySelectorAll('[data-i18n-aria],[data-i18n-placeholder],[data-i18n-alt]'))
                applyI18nAttributes(el);
            const sel = document.getElementById('lang-select');
            if (sel && sel.value !== uiLanguage) sel.value = uiLanguage;
        }

        // Exposed so a clamp gate can drive the language without teaching the ui-stub a
        // promise contract: page.evaluate((l) => window.__setLanguage(l), 'fr').
        window.__setLanguage = applyI18n;
        // Exposed for the same reason, and so a sibling module can write a localized
        // label without app.js having to export anything — O-Bitrot's controller is an
        // inline <script type="module">, where an export declaration has nowhere to go.
        window.__setLabel = setLabel;
        window.__reapplyI18n = () => applyI18n(uiLanguage);

        function initI18n() {
            try {
                getUiLanguageNative = Juce.getNativeFunction('getUiLanguage');
                setUiLanguageNative = Juce.getNativeFunction('setUiLanguage');
            } catch (e) {
                console.warn('Language preference not available, session-only:', e);
            }

            // Paint the default SYNCHRONOUSLY first. Never blank, never a flash.
            try { applyI18n('en'); } catch (e) { console.error('i18n init failed:', e); }

            if (getUiLanguageNative) {
                getUiLanguageNative()
                    .then((code) => applyI18n(code === 'fr' ? 'fr' : 'en'))
                    .catch((e) => console.warn('Could not read language preference:', e));
            }

            const sel = document.getElementById('lang-select');
            if (sel) sel.addEventListener('change', (e) => {
                applyI18n(e.target.value);
                if (setUiLanguageNative) setUiLanguageNative(uiLanguage).catch(() => {});
            });
        }

        // ═══════════════════════════════════════════════════════════════════
        // Hover-help (v2.2.0)
        // ═══════════════════════════════════════════════════════════════════
        //
        // THE COPY IS NOT LOOKED UP HERE. applyI18n() has already written it
        // onto each anchor as data-tip-title + data-tip in the current language
        // and rewrites both on every language change, so this function only
        // positions and paints what the anchor is already carrying. That is why
        // it is called AFTER initI18n() and not before: before, every anchor is
        // bare and every hover would open an empty box.
        //
        // Each property below is load-bearing and each has a scar behind it:
        //
        //   1. DELEGATED ON document, not querySelectorAll('[data-tip]') at
        //      setup. No anchor carries data-tip until applyI18n() has run, so a
        //      setup-time query binds NOTHING and fails silently.
        //   2. pointerover / pointerout / focusin / focusout, because those
        //      BUBBLE. pointerenter / pointerleave / focus / blur do not, and a
        //      delegated listener on document never sees them.
        //   3. pointerout IGNORES a move between two descendants of the SAME
        //      anchor. Every .knob holds three children, so without this the tip
        //      would flicker off and on at each internal boundary.
        //   4. createElement + textContent, NEVER innerHTML. Localized copy must
        //      not reach a markup path; check-i18n assertion 9 already forbids an
        //      angle bracket in an i18n.js string literal and this is the other
        //      half of that rule.
        //   5. Clamped on ALL FOUR edges with an 8 px margin, AFTER the flip and
        //      not instead of it. A tip that is wider or taller than the space on
        //      both sides of the cursor still has to land fully on screen, and in
        //      a 550 x 530 frame carrying a 230 px surface that is the normal
        //      path rather than an edge case — the LFO knobs sit at y 430+, so
        //      every tip down there flips upward and then needs clamping again.
        //   6. pointer-events: none on the surface (CSS), or it steals the hover
        //      that is keeping it open.
        //   7. Escape hides it, and so does any pointerdown.
        //
        //   8. THE FOCUS ARM IS LATCHED TO THE KEYBOARD, and this is the one
        //      that is not obvious. A mouse click on a <button> FOCUSES it, so an
        //      unconditional focusin rule leaves a tip parked on screen after
        //      every click — measured on O-Emulator, where clicking #gear-btn
        //      pinned the gear's own tip directly across the settings popover the
        //      click had just opened, and it stayed until focus moved. It also
        //      made the surface a VISIBLE element inside check-ui-labels' state
        //      sweep, because that gate's state driver clicks #gear-btn.
        //
        //      :focus-visible is deliberately NOT the discriminator. Chromium
        //      reports it false for a programmatic .focus() following a click, so
        //      a gate driving focus directly would measure "no tip" and record
        //      that as correct — a false pass built into the fix. An explicit
        //      latch on the last input device is the same rule and is drivable
        //      with real events: any keydown clears it.
        //
        //      A STATIC grep for lastInputWasPointer does not check this. The
        //      declaration, the pointerdown write and the keydown clear all
        //      survive deleting the guard clause below, so only the behavioural
        //      control in tests/ui_tip_render_check.js discriminates (the O-Comp
        //      finding), and that control needs an activeElement.blur() before
        //      its click or it is decoration (the O-Tremolo finding: clicking an
        //      ALREADY-focused element fires no focusin at all).
        function setupTooltips() {
            const tip = document.getElementById('tooltip');
            if (!tip) { console.warn('tooltip surface missing - hover-help unavailable'); return; }

            const MARGIN = 8;
            let active = null;
            let lastInputWasPointer = false;

            const position = (x, y) => {
                const r = tip.getBoundingClientRect();
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                let nx = x + 14;
                let ny = y + 16;
                // Flip to the other side of the cursor when the natural side overflows.
                if (nx + r.width  > vw - MARGIN) nx = x - r.width  - 14;
                if (ny + r.height > vh - MARGIN) ny = y - r.height - 12;
                // Then clamp, unconditionally, on all four edges. Math.max on the
                // upper bound keeps the arithmetic sane if a tip ever exceeds the
                // frame outright.
                nx = Math.min(Math.max(MARGIN, nx), Math.max(MARGIN, vw - r.width  - MARGIN));
                ny = Math.min(Math.max(MARGIN, ny), Math.max(MARGIN, vh - r.height - MARGIN));
                tip.style.left = `${nx}px`;
                tip.style.top  = `${ny}px`;
            };

            const show = (el, x, y) => {
                const title = el.getAttribute('data-tip-title');
                const body  = el.getAttribute('data-tip');
                if (!title && !body) return;
                tip.textContent = '';
                if (title) {
                    const t = document.createElement('span');
                    t.className = 'tip-title';
                    t.textContent = title;
                    tip.appendChild(t);
                }
                if (body) tip.appendChild(document.createTextNode(body));
                tip.classList.add('show');
                tip.setAttribute('aria-hidden', 'false');
                position(x, y);
            };

            const hide = () => {
                tip.classList.remove('show');
                tip.setAttribute('aria-hidden', 'true');
                active = null;
            };

            const anchorOf = (t) => (t && t.closest ? t.closest('[data-tip]') : null);

            document.addEventListener('pointerover', (e) => {
                const el = anchorOf(e.target);
                if (!el || el === active) return;
                active = el;
                show(el, e.clientX, e.clientY);
            });
            document.addEventListener('pointermove', (e) => {
                if (active && anchorOf(e.target) === active) position(e.clientX, e.clientY);
            });
            document.addEventListener('pointerout', (e) => {
                if (!active) return;
                if (anchorOf(e.relatedTarget) === active) return;   // same anchor, child boundary
                hide();
            });
            document.addEventListener('pointerdown', () => { lastInputWasPointer = true; hide(); });

            document.addEventListener('focusin', (e) => {
                if (lastInputWasPointer) return;
                // The double-click value editor is an <input class="knob-input">
                // inserted INSIDE the .knob div, which is the anchor, so a plain
                // focusin rule would open that knob's tip on top of the field the
                // user is typing into. Suppressed there specifically rather than
                // by a general "inputs are exempt" rule: #lang-select is a form
                // control AND an anchor, and its keyboard tip is the
                // accessibility half of this feature.
                if (e.target && e.target.classList
                    && e.target.classList.contains('knob-input')) { hide(); return; }
                const el = anchorOf(e.target);
                if (!el) return;
                active = el;
                const r = el.getBoundingClientRect();
                show(el, r.left + r.width / 2, r.bottom);
            });
            document.addEventListener('focusout', hide);

            // One keydown listener, two jobs: any key at all means the keyboard
            // is driving, which releases the focus latch above; Escape also hides.
            document.addEventListener('keydown', (e) => {
                lastInputWasPointer = false;
                if (e.key === 'Escape') hide();
            });
        }

        // ═══════════════════════════════════════════════════════════════════
        // The settings popover (v2.1.0)
        // ═══════════════════════════════════════════════════════════════════
        //
        // ONE row, still, at v2.2.0. The page now HAS hover-help, and it is
        // always on: there is no switch here to turn it off, by decision (see
        // the comment on #settings-cluster in the markup). So the popover holds
        // the language selector alone. The panel opens DOWNWARDS: the gear is
        // 14 px from the top of a 530 px frame, so a panel above it would leave
        // the frame.

        let settingsPopoverEl = null;
        let gearBtnEl = null;

        function setSettingsPopoverOpen(open) {
            if (!settingsPopoverEl || !gearBtnEl) return;
            settingsPopoverEl.hidden = !open;
            gearBtnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        function initializeSettingsPopover() {
            gearBtnEl = document.getElementById('gear-btn');
            settingsPopoverEl = document.getElementById('settings-popover');

            if (!gearBtnEl || !settingsPopoverEl) {
                console.warn('settings popover missing - language selector unavailable');
                return;
            }

            gearBtnEl.addEventListener('click', (e) => {
                e.stopPropagation();
                setSettingsPopoverOpen(settingsPopoverEl.hidden);
            });

            // Dismiss on a press anywhere else, and on Escape. mousedown rather
            // than click, so the panel is gone before a knob drag underneath it
            // begins — setupKnob() starts its drag on mousedown.
            document.addEventListener('mousedown', (e) => {
                if (settingsPopoverEl.hidden) return;
                if (settingsPopoverEl.contains(e.target) || gearBtnEl.contains(e.target)) return;
                setSettingsPopoverOpen(false);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !settingsPopoverEl.hidden) {
                    setSettingsPopoverOpen(false);
                    gearBtnEl.focus();
                }
            });
        }

        // Guarded, and LAST. initializeJUCE() above has already bound every
        // parameter, so an i18n failure leaves an English plugin that still
        // works rather than a dead page. Both run unconditionally: the language
        // selector must work in a browser harness where window.__JUCE__ is
        // absent and initializeJUCE() returns early.
        // setupTooltips() sits INSIDE the same try/catch and AFTER initI18n(),
        // deliberately on both counts: the anchors carry no data-tip attributes
        // until applyI18n() has run, and a throw out here would take the whole
        // inline module with it (pattern_module_toplevel_init_tdz).
        initializeSettingsPopover();
        try { initI18n(); setupTooltips(); } catch (e) { console.error('i18n init failed:', e); }
    </script>
</body>
</html>

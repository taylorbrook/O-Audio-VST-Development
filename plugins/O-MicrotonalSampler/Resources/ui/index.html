<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O-MicrotonalSampler</title>

  <!-- JUCE WebView native interop check (carried verbatim). Must run before
       sampler-app.js so window.__JUCE__ is populated. -->
  <script type="module" src="js/juce/check_native_interop.js"></script>

  <!-- App stylesheets. tuning-panel.css is loaded statically; the
       readonly overlay rides on top to hide write affordances per
       RESEARCH §RQ3-1. -->
  <link rel="stylesheet" href="css/sampler-shell.css" />
  <link rel="stylesheet" href="css/tuning-panel.css" />
  <link rel="stylesheet" href="css/tuning-panel-readonly.css" />
</head>
<body>
  <div id="app">
    <!-- ============== HEADER ============== -->
    <header id="header">
      <div class="header-left">
        <h1>O-MicrotonalSampler</h1>
        <span id="tuning-readout" class="tuning-readout"></span>
      </div>
      <nav id="tab-strip">
        <button class="tab-btn active" data-tab="samplemap">Sample Map</button>
        <button class="tab-btn" data-tab="tuning">Tuning</button>
        <button class="tab-btn" data-tab="about">About</button>
      </nav>
    </header>

    <!-- ============== TAB BODIES ============== -->
    <main id="tab-bodies">

      <!-- Sample Map (default) -->
      <section id="tab-samplemap" class="tab-body active">
        <div id="folder-drop-zone">
          <span class="drop-zone-text">Drop folder here</span>
          <span class="drop-zone-sep">·</span>
          <span class="drop-zone-or">or</span>
          <span class="drop-zone-sep">·</span>
          <button id="load-folder-btn" type="button">Load Folder…</button>
        </div>
        <div id="sample-map-grid">
          <!-- Populated dynamically by sampler-app.js renderGrid() (Phase 3.2). -->
        </div>
        <!-- CSS-only context menu — surfaced by JS on right-click; positioned
             via inline style and hidden by default. Cleared on document click. -->
        <div id="cell-context-menu" hidden>
          <button data-action="replace">Replace…</button>
          <button data-action="open-loop-editor">Open Loop Editor</button>
          <button data-action="clear" disabled title="Disabled in v1.0">Clear</button>
        </div>
        <details id="issues-disclosure" hidden>
          <summary>Issues</summary>
          <ul id="issues-list"></ul>
        </details>
        <aside id="loop-editor-panel" hidden>
          <!-- Phase 3.4 -->
        </aside>
        <div id="toast-region" aria-live="polite"></div>
      </section>

      <!-- Tuning -->
      <section id="tab-tuning" class="tab-body">
        <div id="tuning-container"></div>
      </section>

      <!-- About -->
      <section id="tab-about" class="tab-body">
        <div id="about-content">
          <!-- Populated in Phase 3.5 (RP3-4). Empty in 3.1. -->
        </div>
      </section>

    </main>

    <!-- ============== BOTTOM CONTROL STRIP ============== -->
    <!-- Always visible across tabs. Sliders bind via WebSliderRelay
         identifiers matching APVTS parameter IDs.  -->
    <footer id="control-strip">
      <div class="ctrl">
        <label for="ctrl-attack">Attack</label>
        <input type="range" id="ctrl-attack" min="0" max="1" step="0.001" />
      </div>
      <div class="ctrl">
        <label for="ctrl-decay">Decay</label>
        <input type="range" id="ctrl-decay" min="0" max="1" step="0.001" />
      </div>
      <div class="ctrl">
        <label for="ctrl-sustain">Sustain</label>
        <input type="range" id="ctrl-sustain" min="0" max="1" step="0.001" />
      </div>
      <div class="ctrl">
        <label for="ctrl-release">Release</label>
        <input type="range" id="ctrl-release" min="0" max="1" step="0.001" />
      </div>
      <div class="ctrl">
        <label for="ctrl-polyphony">Poly</label>
        <input type="range" id="ctrl-polyphony" min="0" max="1" step="0.001" />
      </div>
      <div class="ctrl">
        <label for="ctrl-velocity-crossfade">Vel-XF</label>
        <input type="range" id="ctrl-velocity-crossfade" min="0" max="1" step="0.001" />
      </div>
      <div class="ctrl">
        <label for="ctrl-output-gain">Out Gain</label>
        <input type="range" id="ctrl-output-gain" min="0" max="1" step="0.001" />
      </div>
    </footer>
  </div>

  <!-- App entry point. Must come after #app so it can query DOM. -->
  <script type="module" src="js/sampler-app.js"></script>
</body>
</html>

    alt_click: { action: "reset to default", binding: "CAPTURE phase, so it pre-empts the drag handler" }
    dblclick:  { action: "inline value entry over the readout span" }
  view_3d:
    drag:      { targets: ["osc?OrbCX", "osc?OrbCY"], mapping: "screen point → the y = 0 plane by inverting the 3×3 homography taken from the view-projection matrix (columns x, z, w); the point follows the cursor exactly", pattern: "pointerdown on the canvas, document-level mousemove/mouseup" }
    wheel:     { target: "osc?Pos (Orbit Size)", delta: "−deltaY × 0.0012", listener: "{ passive: false }" }
    alt_drag:  { target: "osc?OrbRot", mapping: "dx × 0.5 °/px, wraps at 360" }
    drop:      { accepts: "PNG", targets: ["the big view", "either Synth-tab canvas"], sets: "osc?Terrain = Imported…", macos: "webkitGetAsEntry (memory critical_webview_drag_drop_macos)" }
    hover:     { effect: "the HUD brightens from 0.7α to 1.0α; nothing moves" }
  view_toggle: { action: "⬡ ⇄ ≋ per oscillator; UI state only, no parameter written" }
  osc_toggle:  { action: "Terrain tab Osc A ⇄ Osc B; repoints both dropdowns, the Quality segment and both panel cards" }
  segmented:   { action: "Quality Bandlimited / 2× / 4× writes osc?Quality; greys Pitch Track and clamps the Freq readout in Bandlimited" }
  import_btn:  { action: "opens a native FileChooser (launchAsync + SafePointer — memory pattern_webview_launchasync_safepointer_no_complete)" }
  mock_only:
    - "window.mock.sourceMissing(true|false) — or press 'm' — shows/hides the amber notice"
    - "window.mock.webglUnavailable(true|false) — or press 'w' — shows/hides the placeholder"
    - "console logs every parameter write as [param] { id, value }"


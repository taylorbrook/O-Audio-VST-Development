                  - { dropdown: Edge Mode, id: select-terEdge, param: "osc?TerEdge", choices: [Mirror, Window], data_i18n: label.edgeMode }
          - id: card-orbitParams
            class: "card terrain-panel-card"
            box: { x: 732, y: 293, width: 440, height: 239 }
            margin_top: 12
            header: { class: section-header, text: Orbit, data_i18n: label.orbit }
            rows:
              - class: terrain-krow
                knobs:
                  - { label: Size,     param: "osc?Pos",       class: "knob-container primary", size: 72, data_i18n: label.orbitSize, readout: "50%", note: "MIRRORS the Synth-tab Orbit Size knob — same parameter, both move together" }
                  - { label: Aspect,   param: "osc?OrbAspect", size: 64, data_i18n: label.orbitAspect, readout: "0.70" }
                  - { label: Rotation, param: "osc?OrbRot",    size: 64, data_i18n: label.orbitRotation, readout: "0°" }
                  - { label: Centre X, param: "osc?OrbCX",     size: 64, data_i18n: label.orbitCentreX, readout: "0.13", view_drag: dx }
                  - { label: Centre Y, param: "osc?OrbCY",     size: 64, data_i18n: label.orbitCentreY, readout: "0.21", view_drag: "-dy" }
              - class: terrain-krow terrain-krow-sub
                divider: "1 px walnut hairline above, 0.25α"
                knobs:
                  - { label: Orbit Mod, param: "osc?OrbMod",      size: 56, data_i18n: label.orbitMod, readout: "0.50", inert_when: "Orbit = Ellipse", tooltip: "orbit-specific: superellipse exponent / limaçon loop / epitrochoid inner ratio / squarcle corner" }
                  - { label: Feedback,  param: "osc?OrbFeedback", size: 56, data_i18n: label.feedback, readout: "0%" }
                  - { label: Fb Damp,   param: "osc?OrbFbDamp",   size: 56, data_i18n: label.feedbackDamp, readout: "50%" }
          - id: terrain-notice
            class: terrain-notice
            box: { x: 732, y: 542, width: 440, height: 22, margin_top: 10 }
            text: "Source missing — using library fallback"
            data_i18n: label.sourceMissing
            colour: amber
            style: "10px italic, 1px amber border at 0.5α, rgba(201,130,43,.10) fill, 3px radius"
            hidden_by_default: true
            mock_trigger: "window.mock.sourceMissing(true) or press 'm'"

      botanical_overlay:
        class: terrain-botanical
        file: img/shell_conchologiaiconi12reev_0090.png
        intrinsic: "586×733"
        technique: >
          A CSS background on a CLIPPED box, not an <img> with negative offsets.
          The plate carries ~22 % of white margin above and below the shell, so
          the drawing has to be pushed up out of its own box to put the striped
          body in the gutter under the Orbit card. A negative `bottom` does that
          visually AND grows #terrain-tab's scrollHeight past its clientHeight —
          which is exactly the number a layout gate reads. The box stays at 0,0;
          the image moves inside it; the box clips.
        box: "position: absolute; right: 0; bottom: 0; width: 520px; height: 215px"
        background: "background-size: 520px auto (→ 520×650); background-position: right -282px, which windows plate y 282…497 — the striped body"
        opacity: 0.3
        blend: multiply
        pointer_events: none
        z_index: 0                     # .terrain-toprow is 2 and .terrain-main is 1
        scope: "Terrain tab only — it lives inside #terrain-tab, so no other tab can see it"
        legibility: "the two panel cards are opaque #EFDFCB, so the shell reads only below the Orbit card and the notice; nothing it sits behind is text"

    height_budget: "30 top row + 12 margin + 544 view wrap (540 canvas + 2×2 border) + 8 gap + 14 hint = 608 ≤ 650 usable → no scroll (measured: #terrain-tab scrollHeight === clientHeight === 666)"
    width_budget:  "704 view wrap + 28 gap + 440 panel = 1172 = usable width exactly (measured: scrollWidth === clientWidth === 1200)"
    panel_budget:  "239 Terrain card + 12 + 239 Orbit card + 10 + 22 notice = 522 ≤ 566 available (tab-local y 42 → 608); the remaining 44 px plus the band under the hint line is where the botanical reads"

# ─────────────────────────────────────────────────────────────────────────────
# CONDITIONAL / INERT STATES  (class .is-inert = opacity .38 + pointer-events none)
# ─────────────────────────────────────────────────────────────────────────────
inert_rules:
  - { control: "osc?TerBlur, osc?TerEdge", inert_when: "osc?Terrain ≠ Imported…", reason: "pre-blur and Mitsuhashi edge handling only exist for a PNG terrain" }
  - { control: "osc?OrbMod",               inert_when: "osc?Orbit = Ellipse",     reason: "an ellipse has no shape parameter" }
  - { control: "osc?TerTrack",             inert_when: "osc?Quality = Bandlimited", reason: "in Bandlimited mode the coefficient truncation IS the mip; pitch tracking has nothing to do" }
readout_clamps:
  - { control: "osc?TerFreq", clamp: "displayed value clamps at 2.00× when Quality = Bandlimited", reason: "ARCHITECTURE D3: degree-16 triangle bounds F ≤ 2" }


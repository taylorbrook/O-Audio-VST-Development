validation:
  run: "headless Chromium (Playwright 1.62 / chromium 1234) at 1200×800, devicePixelRatio 2, file:// load"
  webview_constraints:
    no_viewport_units: true          # vh / vw / dvh / svh absent, including in comments
    html_body_height_100pct: true
    user_select_none: true
    context_menu_disabled: true
    wheel_listeners_passive_false: true
    external_resources: "one — img/shell_conchologiaiconi12reev_0090.png, relative. No fonts, no CDN, no modules."
  layout:
    method: "scrollHeight vs clientHeight per tab, a bounding-box overlap sweep of the Terrain tab's four content regions, and a wrap check on .osc-params measured with the Synth tab VISIBLE (a display:none subtree measures every rect as zero and the check goes vacuous)"
    measured_all_tabs: "scrollHeight 666 === clientHeight 666 and scrollWidth 1200 === clientWidth 1200, on all five tabs, in the default state and after the Bandlimited / Imported… / source-missing state walk"
    overlaps: none
    console_errors: none
  measured_boxes:                    # page coordinates, Terrain tab
    terrain_toprow:     { x: 14,  y: 76,  w: 1172, h: 30 }
    terrain_view_wrap:  { x: 14,  y: 118, w: 704,  h: 544 }
    terrain_hint:       { x: 14,  y: 670, w: 704,  h: 14 }
    card_terrainParams: { x: 746, y: 118, w: 440,  h: 239 }
    card_orbitParams:   { x: 746, y: 369, w: 440,  h: 239 }
    terrain_notice:     { bottom: 638.9 }
    terrain_panel_col:  { x: 746, y: 118, w: 440,  h: 566 }
  measured_osc_params: "980 px available, 900 px used (rightmost child at 1130 against a 1175 right edge), ONE row — the two extra dropdowns do not wrap the knob row in English"
  behaviour_checked:
    view_drag:  "Centre X 0.13 → 0.52 (the point follows the cursor)"
    view_wheel: "Orbit Size 50 % → 64 %"
    bandlimited: "Pitch Track goes inert, Freq readout clamps at 2.00×, readout reads 'Bandlimited · N partials at C4'"
    approx_clause: "'Bandlimited · N partials at C4 · approx.' with Superellipse"
    imported: "'image projected at F = 1 · fit 87 %'; Image Blur + Edge Mode become live"
    osc_switch: "Osc B shows its own Quality and Freq — the panel proxies repoint, they do not copy"
  height_arithmetic:
    synth: "≈640 ≤ 650 (O-Prism v1.26.0's budget, unchanged)"
    terrain: "608 ≤ 650"
  width_arithmetic:
    terrain: "704 + 28 + 440 = 1172"
    osc_params: "900 ≤ 980 (single row, no wrap)"
  fixes_found_by_the_gate:
    - "#terrain-tab scrollHeight ran 6 px over clientHeight: the botanical's negative bottom/right bleed. Replaced with a clipped background box (see botanical_overlay.technique)."
    - ".wt-osc-btn wrapped 'Osc A' onto two lines in the Terrain toolbar: the v1.26.0 column rule is `flex: 1`, which compresses in a shrinking row. `flex: 0 0 auto` + white-space: nowrap in the row context."
    - "The Tuning tab's octave-stretch readout overflowed its 210 px column by 7 px: `input[type=range]` carries a UA intrinsic min-width (~129 px) that `flex: 1` will not shrink below. `min-width: 0` on .octave-stretch-slider. THIS IS AN INHERITED O-PRISM RULE and the same fix applies there."
    - "One camera distance framed the 160×90 canvas and the 700×540 view differently; the distance is now solved per aspect (see view_3d.renderer.camera)."
    - "The ≋ view rendered its own aliasing as vertical hash; it is now decimated from a 4× run and DC-blocked."

open_questions:

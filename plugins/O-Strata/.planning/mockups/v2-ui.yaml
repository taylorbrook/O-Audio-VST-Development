# O-Strata — UI mockup specification v2 (live wave-terrain oscillator)
#
# Fork of O-Prism **v1.26.0** (commit 4f12ef57 / release 018ca3ef): the card-grid
# restructure, the 12-column Synth and Effects grids, the 3-column Tuning grid and
# the custom appearance:none selects. NOT the v1.24.0 fork base still sitting in
# plugins/O-Strata/Source/ui/public/index.html — Stage 3 re-forks from v1.26.0 so
# the card system, the 650 px Synth budget and the select styling come across.
#
# v1 (plugins/O-Strata/.planning/superseded-baked-v1/mockups/) designed a BAKED
# geometry generator and is not a source of truth. What carries over from it: the
# shell, the palette, the ⬡/≋ canvas toggle, the botanical overlay and the
# "3D view + right-hand parameter column" shape of the fifth tab. Everything
# inside that tab is new.

plugin: O-Strata
version: 2
fork_of: O-Prism v1.26.0
supersedes: superseded-baked-v1/mockups/v1-ui.yaml
design_system: ouaricon-naturalist-001
test_html: v2-ui-test.html
created: 2026-09-09

# ─────────────────────────────────────────────────────────────────────────────
# WINDOW / CHROME — inherited from O-Prism v1.26.0, unchanged
# ─────────────────────────────────────────────────────────────────────────────
window:
  width: 1200
  height: 800
  resizable: false            # O-Prism: setSize (1200, 800)
  chrome:
    header_bar:  { x: 0, y: 0,   width: 1200, height: 34,  background: "#3C2F2F", contents: "title · preset browser (‹ · display · › · ★) · subtitle · gear/settings popover" }
    tab_bar:     { x: 0, y: 34,  width: 1200, height: 32,  background: "#D4C4B0", border_bottom: "2px #8B7355" }
    tab_content: { x: 0, y: 66,  width: 1200, height: 666, padding: "10px 14px 6px", usable: "1172×650" }
    footer_bar:  { x: 0, y: 732, width: 1200, height: 68,  background: "#3C2F2F", contents: "Master · Osc Mix (44 px small knobs)" }
  height_arithmetic: "800 − 34 header − 32 tab bar − 68 footer = 666 content area; − 16 px tab padding = 650 usable. Width 1200 − 28 px tab padding = 1172 usable."

# ─────────────────────────────────────────────────────────────────────────────
# STYLING — Ouaricon Naturalist, byte-identical values to O-Prism v1.26.0
# ─────────────────────────────────────────────────────────────────────────────
styling:
  colors:
    paper: "#F5E6D3"          # body / active tab
    card: "#EFDFCB"           # .card fill (v1.26.0)
    paper_deep: "#EBD9C7"     # canvas + select well ground
    select_well: "#F8ECDC"    # select.param-select background (v1.26.0)
    tan: "#D4C4B0"            # tab bar, inactive toggle
    walnut: "#8B7355"         # borders, captions, HUD
    oak: "#5C4033"            # secondary ink
    ink: "#3C2F2F"            # primary ink, header/footer plate
    sage: "#8BA870"           # orbit line
    deep_green: "#6B8E4E"     # scan point, active toggle-btn
    vine: "#5a7a6a"           # knob arc + active .wt-osc-btn
    header_accent: "#C9A27B"
    amber: "#C9822B"          # RESERVED: source-missing notice + feedback trail only
    background: "#F5E6D3"
    foreground: "#3C2F2F"
    accent: "#8BA870"
  fonts:
    primary: "'Garamond', 'Georgia', 'Times New Roman', 'PingFang SC', 'Microsoft YaHei', serif"
    hud: "'SF Mono', 'Menlo', 'Consolas', monospace"
  type_scale:
    tab:               { size: 12, letter_spacing: 1.5, transform: uppercase }
    section_header:    { size: 10, letter_spacing: 2,   transform: uppercase }
    knob_label:        { size: 9,  letter_spacing: 0.8, transform: uppercase }
    knob_value:        { size: 10 }
    dropdown_label:    { size: 8,  letter_spacing: 1,   transform: uppercase }
    status_small_caps: { size: 9,  letter_spacing: 1.2, transform: uppercase }
    hud:               { size: 10, family: hud }
  knob_component:
    name: SVG vine-arc knob (O-Prism .knob-container[data-knob])
    markup: ".knob > .knob-visual > svg(viewBox 52×52; .knob-track r=22 stroke rgba(139,115,85,.3) w2; .knob-vine r=22 stroke #5a7a6a w3 dasharray 103.67) + .knob-label + .knob-value"
    svg_rotation: "-135deg on the <svg>, so a 270° sweep starts bottom-left"
    sizes: { standard: 52, small: 44, primary: 64, terrain_panel: 64, terrain_panel_primary: 72 }
    interactions: [vertical drag, wheel ±0.02, alt-click reset to default, dblclick value entry]
  css_classes_reused_from_oprism:
    - header-bar / preset-browser / preset-display / preset-nav / preset-save / preset-menu / settings-wrap / settings-popover / gear-btn / settings-row / settings-label / settings-select
    - tab-bar / tab / tab-content-area / tab-content
    - card / span-2 / span-3 / span-4 / span-5 / span-6 / span-7 / span-8 / osc-card
    - section-header / param-row
    - knob-container / knob-container.primary / knob / knob-visual / knob-track / knob-vine / knob-label / knob-value
    - dropdown-group / dropdown-label / param-select / toggle-btn / toggle-group
    - osc-section / osc-canvas-wrap / osc-canvas / osc-params / wt-drop-overlay
    - mod-matrix-table / mod-matrix-header / mod-row / mod-col-on / mod-col-slot / mod-col-src / mod-col-dst / mod-col-amt / mod-col-val / mod-amt-slider
    - filters-grid / filter-block / filter-routing / lfo-card
    - effect-section / bypass-toggle
    - tuning-viz-container / interval-list / tonic-selector / viz-mode-toggle / viz-btn / viz-container / pitch-circle / tuning-controls-panel / tuning-ref-section / scale-name-display / octave-stretch-* / tuning-file-*
    - footer-bar / footer-param / footer-label / footer-value
    - wt-osc-toggle / wt-osc-btn  # v1.26.0 column style, reused HORIZONTAL on the Terrain tab
  css_classes_new:                # every new class is prefixed terrain- except the shared canvas toggle
    - osc-view-toggle / osc-view-btn      # ⬡ / ≋ corner toggle, shared by the two Synth canvases and the big view
    - terrain-toprow / terrain-ctl / terrain-ctl-label
    - terrain-seg / terrain-seg-btn
    - terrain-import-btn / terrain-readout / terrain-readout-approx
    - terrain-main / terrain-view-col / terrain-view-wrap / terrain-view / terrain-hud / terrain-webgl-unavailable / terrain-hint
    - terrain-panel-col / terrain-panel-card / terrain-krow / terrain-krow-sub / terrain-notice
    - terrain-botanical
    - is-inert                            # greyed/disabled control state (opacity .34 + pointer-events none); the control keeps its column, so nothing moves when the condition flips

# ─────────────────────────────────────────────────────────────────────────────
# TABS
# ─────────────────────────────────────────────────────────────────────────────
tabs:
  order: [synth, mod, tuning, effects, terrain]
  note: "terrain takes O-Prism's fifth (Wavetable) slot"
  synth:   { data_tab: synth,   data_i18n: tab.synth }
  mod:     { data_tab: mod,     data_i18n: tab.mod }
  tuning:  { data_tab: tuning,  data_i18n: tab.tuning }
  effects: { data_tab: effects, data_i18n: tab.effects }
  terrain: { data_tab: terrain, data_i18n: tab.terrain }

removed_from_oprism:
  - Wavetable tab (id wavetable-tab) and every .wt-* editor element inside it
  - wavetable-editor.js / css/wavetable-editor.css (except the .wt-osc-toggle / .wt-osc-btn rules, which move into index.html for the Terrain tab)
  - frame strip, harmonic editor, ops bar, wavetable save modal, wt-modal manager
  - The Shape dropdown select-oscATable / select-oscBTable and its 36-table optgroup list (oscATable / oscBTable parameters removed)
  - label.dropWav "Drop WAV" overlay text → label.dropPng "Drop PNG"
  - tab.wavetable, label.harmonics, label.normalize*, label.fadeEdges, label.reverse*, label.smooth, label.saveWavetable, label.userWavetables, label.noUserWavetables, label.importWav, label.manage, label.waveform (i18n keys retired with the tab)

# ─────────────────────────────────────────────────────────────────────────────
# LAYOUT
# ─────────────────────────────────────────────────────────────────────────────
layout:

  # ── SYNTH TAB ──────────────────────────────────────────────────────────────
  synth_tab:
    id: synth-tab
    grid: "display:grid; grid-template-columns: repeat(12, minmax(0,1fr)); grid-auto-rows: min-content; gap: 8px"
    height_budget: >
      O-Prism v1.26.0's arithmetic, unchanged: five card rows plus four 8 px gaps
      sum to ~640 px inside the 650 px usable area. The budget is held by .card
      padding (5/10/5), a 4 px title margin and `.card .knob-container { margin: 0 2px }`.
      The two extra oscillator dropdowns add WIDTH, not height — a .dropdown-group
      is 34 px tall (9 caption + 3 + 22 select) against a knob column's ~78 px —
      so the row height is unchanged and the tab still does not scroll.
    rows:
      - { row: 1, cards: [ { id: card-oscA, class: "card osc-card", span: 12 } ] }
      - { row: 2, cards: [ { id: card-oscB, class: "card osc-card", span: 12 } ] }
      - { row: 3, cards: [ { id: card-sub, span: 5 }, { id: card-noise, span: 3 }, { id: card-performance, span: 4 } ] }
      - { row: 4, cards: [ { id: card-filters, span: 8, class: "card span-8 filters-card" }, { id: card-ampenv, span: 4 } ] }
      - { row: 5, cards: [ { id: card-filtenv, span: 4 }, { id: lfo1-section, span: 2 }, { id: lfo2-section, span: 2 }, { id: lfo3-section, span: 2 }, { id: lfo4-section, span: 2 } ] }
    unchanged_cards: [card-sub, card-noise, card-performance, card-filters, card-ampenv, card-filtenv, lfo1-section, lfo2-section, lfo3-section, lfo4-section]

    oscillator_card:            # the ONLY change on this tab; identical for A and B
      structure: ".card.osc-card > .section-header + .osc-section > (.osc-canvas-wrap + .osc-params)"
      width_arithmetic: "card inner 1172 − 20 padding − 2 border = 1150; − 160 canvas − 10 gap = 980 px for .osc-params. Measured content ≈ 900 px, so the knob row does not wrap."
      canvas:
        css_size: "160×90"
        backing: "320×180"
        border: "2px solid #8B7355"
        background: "#EBD9C7"
        classes: [osc-canvas-wrap, osc-canvas]
        ids: [canvasOscA, canvasOscB]
        modes:
          "3d": "terrain wireframe (26×26 in the mini canvas, 64×64 in the big view) + orbit on the surface (sage) + live scan point (deep green)"
          waveform: >
            The last cycle's y(θ) as a single oak polyline. DECIMATED FROM A 4×
            RUN AND DC-BLOCKED, not sampled at display resolution: the raw scan
            of a knot orbit over a ridged terrain renders its own aliasing as
            vertical hash, which is an honest picture of an undersampled read and
            the wrong picture of a 2× voice whose halfband decimator has already
            removed it. The DC blocker is the one on the plugin's own output.
      view_toggle:
        class: [osc-view-toggle, osc-view-btn]
        position: "absolute, canvas top-right, 4px/4px inside the 2 px border"
        glyphs: { "3d": "⬡ U+2B21", waveform: "≋ U+224B" }
        size_px: 10
        colors: { rest: walnut, active: deep_green }
        default: "3d"
        per_oscillator: true
        a11y: "data-i18n-aria on each button (aria.view3d / aria.viewWaveform); the glyph carries no text, so the label gate never measures it"
      drop_overlay: { class: wt-drop-overlay, text: "Drop PNG", data_i18n: label.dropPng }
      controls_in_order:
        - { dropdown: Terrain,  id: "select-osc{A,B}Terrain", param: "osc{A,B}Terrain", data_i18n: label.terrain, width_px: 118, note: "was the Shape dropdown" }
        - { dropdown: Orbit,    id: "select-osc{A,B}Orbit",   param: "osc{A,B}Orbit",   data_i18n: label.orbit,   width_px: 106, note: "NEW — second dropdown" }
        - { knob: Orbit Size, param: "osc{A,B}Pos", class: "knob-container primary", data_i18n: label.orbitSize, readout: "50%", note: "was Position (label.position); same ID, new default 0.5" }
        - { knob: Level,    param: "osc{A,B}Level",    class: "knob-container primary", data_i18n: label.level }
        - { knob: Pan,      param: "osc{A,B}Pan",      data_i18n: label.pan }
        - { knob: Coarse,   param: "osc{A,B}Coarse",   data_i18n: label.coarse }
        - { knob: Fine,     param: "osc{A,B}Fine",     data_i18n: label.fine }
        - { knob: Phase,    param: "osc{A,B}Phase",    data_i18n: label.phase }
        - { knob: Unison,   param: "osc{A,B}Unison",   data_i18n: label.unison, readout: "1", note: "max 4 (was 8) — live-oscillator CPU cap" }
        - { knob: Detune,   param: "osc{A,B}Detune",   data_i18n: label.detune }
        - { knob: Width,    param: "osc{A,B}Width",    data_i18n: label.width }
        - { dropdown: Warp, id: "select-osc{A,B}WarpType", param: "osc{A,B}WarpType", data_i18n: label.warp }
        - { knob: Warp Amt, param: "osc{A,B}WarpAmt",  data_i18n: label.warpAmt }
      wrap_fallback: >
        If a translation pushes .osc-params past 980 px the two dropdowns may stack
        vertically inside ONE .dropdown-group column (flex-direction: column, gap 4).
        Not needed in English: measured 900 px at the shipped frame.

  # ── MOD TAB ────────────────────────────────────────────────────────────────
  mod_tab:
    id: mod-tab
    unchanged_from_oprism: "markup, .mod-matrix-table, 16 rows, source list, amount slider, ±N% readout"
    destinations:
      count: 46
      inherited: 26
      relabelled: ["OscA Pos → OscA Orbit Size", "OscB Pos → OscB Orbit Size"]
      order: "O-Prism's 26 first (indices unchanged), then the 20 new ones append-only: all 10 of Osc A, then all 10 of Osc B"
      list_inherited_26: [None, OscA Orbit Size, OscB Orbit Size, FiltA Cut, FiltB Cut, FiltA Res, FiltB Res, Osc Mix, Sub Level, Noise Level, LFO1 Rate, LFO2 Rate, LFO3 Rate, LFO4 Rate, OscA Detune, OscB Detune, OscA Pan, OscB Pan, Reverb Mix, Delay Mix, Chorus Mix, Dist Mix, Master Vol, Pitch, OscA Warp, OscB Warp]
      list_new_20: [OscA Orbit Aspect, OscA Orbit Rot, OscA Orbit CX, OscA Orbit CY, OscA Orbit Mod, OscA Terrain Freq, OscA Terrain Mod X, OscA Terrain Mod Y, OscA Feedback, OscA Saturation, OscB Orbit Aspect, OscB Orbit Rot, OscB Orbit CX, OscB Orbit CY, OscB Orbit Mod, OscB Terrain Freq, OscB Terrain Mod X, OscB Terrain Mod Y, OscB Feedback, OscB Saturation]
      source: "the authoritative list is getModDestNames() from C++ (WR-20); the JS fallback array in index.html mirrors it"

  # ── TUNING TAB ─────────────────────────────────────────────────────────────
  tuning_tab:
    id: tuning-tab
    unchanged_from_oprism: true
    grid: "130px | minmax(0,1fr) | 210px  ×  auto | minmax(0,1fr)"
    regions: [interval-list (col 1), viz-mode-toggle (col 2 row 1), viz-container (col 2 row 2), tuning-controls-panel (col 3)]
    engine: "scala-tuning-engine v3.0.1"
    mockup_fidelity: "test HTML renders the real 3-column grid with a live 12-TET interval list, a generated pitch-circle SVG, the A4 Ref knob, scale name, octave stretch and the file buttons; the library/generator accordions are collapsed placeholders"

  # ── EFFECTS TAB ────────────────────────────────────────────────────────────
  effects_tab:
    id: effects-tab
    unchanged_from_oprism: true
    grid: "12 columns, gap 10; five cards in processBlock order"
    cards:
      - { id: section-dist,   span: 3, title: Distortion }
      - { id: section-chorus, span: 3, title: Chorus }
      - { id: section-delay,  span: 6, title: Delay }
      - { id: section-reverb, span: 7, title: Reverb }
      - { id: section-eq,     span: 5, title: 3-Band EQ }
    bypass: ".bypass-toggle pill with a lit dot; .effect-section.bypassed dims and goes dashed"
    knob_sizes: { standard: 60, primary_mix: 72 }

  # ── TERRAIN TAB (the showpiece) ────────────────────────────────────────────
  terrain_tab:
    id: terrain-tab
    overflow: hidden           # must NOT scroll
    coordinates: "relative to the tab-content padding-box origin (14, 76) in window space"
    display: "flex column; gap 0 (explicit margins below)"
    regions:

      top_row:
        class: terrain-toprow
        box: { x: 0, y: 0, width: 1172, height: 30 }
        margin_bottom: 12
        note: >
          Captions sit INLINE to the left of their control (.terrain-ctl-label), not
          stacked above it as .dropdown-group does. A stacked caption is 34 px tall
          and would not fit a 30 px toolbar; inline also reads as a toolbar rather
          than as a row of orphaned Synth-tab widgets.
        items_left_to_right:
          - { id: terrain-osc-toggle, class: wt-osc-toggle, modifier: "flex-direction: row (the v1.26.0 rule is a column)", buttons: ["Osc A", "Osc B"], data_i18n: [label.oscAShort, label.oscBShort], box: { x: 0, y: 3, width: 150, height: 24 } }
          - { id: terrain-terrain-ctl, label: Terrain, data_i18n_label: label.terrain, select_id: select-terTerrain, class: [terrain-ctl, param-select], mirrors: "the active oscillator's Synth-tab Terrain dropdown (same param)", box: { x: 166, y: 3, width: 190, height: 24 } }
          - { id: terrain-orbit-ctl,   label: Orbit,   data_i18n_label: label.orbit,   select_id: select-terOrbit,   class: [terrain-ctl, param-select], mirrors: "the active oscillator's Synth-tab Orbit dropdown (same param)", box: { x: 372, y: 3, width: 172, height: 24 } }
          - { id: terrain-quality-seg, label: Quality, data_i18n_label: label.quality, class: [terrain-ctl, terrain-seg], buttons: ["Bandlimited", "2×", "4×"], data_i18n: [label.bandlimited, null, null], param: "osc?Quality", default: "2×", note: "'2×' and '4×' are numerals, never localised", box: { x: 560, y: 3, width: 202, height: 24 } }
          - { id: btn-terImport, class: terrain-import-btn, text: "Import…", data_i18n: label.import, style: "transparent fill, 1px walnut outline, 9px uppercase ls 1px; hover fills rgba(139,115,85,.14)", box: { x: 778, y: 3, width: 84, height: 24 } }
          - { id: terrain-readout, class: terrain-readout, align: right, font: status_small_caps, color: walnut, box: { x: 902, y: 8, width: 270, height: 14 } }
        partial_estimate: "n = round(12 · F · K · (0.52 + 0.96 · size)), clamped 1…160, where K is the orbit's trigonometric-polynomial degree [Ellipse 1, Superellipse 1, Limaçon 2, Epitrochoid 3/5/7 → 4/6/8, Hypocycloid 3/5/7 → 2/4/6, Butterfly 4, Squarcle 1]. Calibrated so the default patch reads the brief's 12."
        readout_states:
          normal:        { example: "2× · 12 partials at C4", keys: [label.readoutPartials] }
          approx:        { example: "Bandlimited · 9 partials at C4 · approx.", when: "Quality = Bandlimited AND the orbit is not a trigonometric polynomial (Superellipse / Limaçon / Butterfly / Squarcle)", keys: [label.readoutPartials, label.approx], note: "the approx. clause renders in amber-free walnut italic (.terrain-readout-approx)" }
          image_project: { example: "image projected at F = 1 · fit 87 %", when: "Quality = Bandlimited AND Terrain = Imported…", keys: [label.imageProjected] }
        i18n_rule: "numbers, ×, %, note names and F values are never localised; only the words around them carry keys"

      view_3d:
        class: [terrain-view-wrap, osc-canvas-wrap]
        canvas_id: terrainView
        canvas_class: terrain-view
        box: { x: 0, y: 42, width: 704, height: 544, note: "border-box; 2 px border each side → 700×540 of canvas" }
        backing: "700×540 × devicePixelRatio"
        border: "2px solid #8B7355"
        border_radius: 3
        background: "#EBD9C7"
        renderer:
          mockup: "Canvas 2D — perspective() + lookAt() + mmul() borrowed from research/wavetable-synthesis-3d-geometry-prototypes/webgl-3d/terrain-proto.html; the wireframe is cached to an offscreen canvas keyed on (terrain, F, Mod X, Mod Y, size, dpr) and only the orbit / trail / scan layer redraws per frame"
          camera: >
            SOLVED, not picked. perspective() scales clip-x by f/aspect, so one
            hand-tuned distance frames the domain differently in the 160×90 Synth
            canvas (aspect 1.78) and the 700×540 Terrain view (1.30) — tuned on
            the first, the surface ran off all four edges of the second. The
            distance is stepped up until the eight corners of
            [-1,1] × [-0.28,0.28] × [-1,1] fit inside 97 % of NDC, which frames
            the same scene identically in both and survives any resize.
            yaw -0.62, pitch 0.52, fov 0.82, height scale 0.45.
          ground: "the [-1,1]² footprint is filled at rgba(139,115,85,0.055) under a dashed edge — without the wash the wireframe reads as a sheet floating in an empty box, and the dashes name the domain Centre X / Y are clamped to"
          production: "hand-rolled WebGL2 (R32F heightmap texture, no GLSL flat) with the SAME Canvas 2D path as the fallback, one file, no library"
        scene:
          terrain:    { grid: "64×64 displaced wireframe, drawn every 2nd row/col, back-to-front with a distance alpha ramp 0.64 → 0.30", width: 1, height_scale: 0.45 }
          orbit:      { colour: sage, width: 2, points: 256, note: "drawn ON the surface — each point's height is sampled from the terrain" }
          scan_point: { colour: deep_green, radius: 5, note: "one lap per 2 s in the mockup; 30 Hz {osc,theta,x,y} push in production" }
          trail:      { colour: amber, width: 1.2, alpha: 0.75, visible_when: "Feedback > 0", content: "the DISPLACED trajectory over the last ~1.5 laps — what feedback actually does to the path" }
        view_toggle: { same_as: synth_tab.oscillator_card.view_toggle, size_px: 13, position: "8px/8px" }
        hud:
          class: terrain-hud
          position: "absolute, bottom-left, 10px/10px"
          font: hud
          size: 10
          colour: walnut
          text: "θ 0.37 · r 0.61 · c (0.13, 0.21)"
          i18n: none            # a readout node is never localised
        webgl_unavailable_placeholder: { class: terrain-webgl-unavailable, data_i18n: label.webglUnavailable, text: "WebGL unavailable — 2D fallback", hidden_by_default: true, mock_trigger: "window.mock.webglUnavailable(true)" }
        drop_overlay: { class: wt-drop-overlay, text: "Drop PNG", data_i18n: label.dropPng }

      hint_line:
        class: terrain-hint
        box: { x: 0, y: 594, width: 704, height: 14, margin_top: 8 }
        text: "Drag: centre · Wheel: size · ⌥ drag: rotation"
        data_i18n: label.hintView
        style: "9px uppercase, letter-spacing 1.2px, walnut at 0.85α"

      panel_column:
        class: terrain-panel-col
        box: { x: 732, y: 42, width: 440, height: 566 }
        gap_from_view: 28
        cards:
          - id: card-terrainParams
            class: "card terrain-panel-card"
            box: { x: 732, y: 42, width: 440, height: 239 }
            header: { class: section-header, text: Terrain, data_i18n: label.terrain }
            rows:
              - class: terrain-krow
                knobs:
                  - { label: Freq,        param: "osc?TerFreq",  class: "knob-container primary", size: 72, data_i18n: label.terrainFreq, readout: "1.00×", note: "log 0.25–8.0; readout clamps at 2.00× in Bandlimited mode" }
                  - { label: Mod X,       param: "osc?TerModX",  size: 64, data_i18n: label.terrainModX, readout: "50%", tooltip: "terrain-specific: ring spacing / saddle skew / well depth" }
                  - { label: Mod Y,       param: "osc?TerModY",  size: 64, data_i18n: label.terrainModY, readout: "50%", tooltip: "second terrain-specific shape input" }
                  - { label: Pitch Track, param: "osc?TerTrack", size: 64, data_i18n: label.pitchTrack, readout: "100%", inert_when: "Quality = Bandlimited" }
                  - { label: Saturation,  param: "osc?TerSat",   size: 64, data_i18n: label.saturation, readout: "0%" }
              - class: terrain-krow terrain-krow-sub
                divider: "1 px walnut hairline above, 0.25α"
                inert_when: "Terrain ≠ Imported…"
                items:

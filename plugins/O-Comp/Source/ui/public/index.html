<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouaricon Compressor</title>

  <style>
    /* CRITICAL: WebView constraints */
    html, body {
      height: 100%;  /* REQUIRED - replaces viewport units */
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* Native application feel */
    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;

      /* Ouaricon Naturalist styling */
      background-image: url('paper-bg.jpg');
      background-size: cover;
      background-position: center;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
    }

    /* Container fills entire window */
    .container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Header row - Title + Preset Bar */
    .header {
      position: absolute;
      top: 0;
      left: 10px;
      right: 80px; /* Leave space for output meter label */
      height: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #3C2F2F;
      white-space: nowrap;
    }

    /* Preset Bar */
    .preset-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(139, 168, 112, 0.25);
      border: 1px solid #8B7355;
      border-radius: 3px;
      padding: 2px 4px;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .preset-nav-btn {
      width: 18px;
      height: 16px;
      background: rgba(139, 115, 85, 0.3);
      border: 1px solid #8B7355;
      border-radius: 2px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 11px;
      font-weight: bold;
      color: #3C2F2F;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }

    .preset-nav-btn:hover {
      background: rgba(139, 115, 85, 0.5);
    }

    .preset-name-container {
      position: relative;
    }

    .preset-name {
      min-width: 70px;
      max-width: 100px;
      text-align: center;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 10px;
      color: #3C2F2F;
      padding: 1px 4px;
      background: rgba(255, 248, 220, 0.5);
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preset-name:hover {
      background: rgba(255, 248, 220, 0.8);
    }

    /* Preset Dropdown Menu */
    .preset-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      min-width: 120px;
      max-height: 200px;
      overflow-y: auto;
      background: #F5E6D3;
      border: 1px solid #8B7355;
      border-radius: 3px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      z-index: 100;
      margin-top: 2px;
    }

    .preset-dropdown.open {
      display: block;
    }

    .preset-dropdown-item {
      padding: 4px 8px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 10px;
      color: #3C2F2F;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 1px solid rgba(139, 115, 85, 0.2);
    }

    .preset-dropdown-item:last-child {
      border-bottom: none;
    }

    .preset-dropdown-item:hover {
      background: rgba(139, 168, 112, 0.3);
    }

    .preset-dropdown-item.active {
      background: rgba(139, 168, 112, 0.5);
      font-weight: bold;
    }

    .preset-dropdown-header {
      padding: 3px 8px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      color: #5C4033;
      font-weight: bold;
      background: rgba(139, 115, 85, 0.15);
      border-bottom: 1px solid rgba(139, 115, 85, 0.3);
    }

    /* PIN A (v1.6.0). padding: 0 is the only geometry change in this commit,
       and it does not move a single rectangle.

       This is a <button>, so with no padding declared it inherited the UA
       default `padding: 1px 6px`. Under the universal `box-sizing: border-box`
       above, that made the CONTENT box 30 - 12 = 18px inside a 32px button —
       and the English caption "Load" renders 18.5px of text. The shipped
       v1.5.0 button was already 0.5px over its own content box in ENGLISH and
       cleared check-ui-labels assertion 4 by exactly the 0.5px tolerance and
       nothing more. Ouvrir (24.0) and Enreg. (23.75) fail it outright.

       Nothing MOVES either way: the button is border-box with a pinned 32px
       width, so padding redistributes inside a rectangle that cannot change,
       and the caption is centred by `justify-content: center` rather than by
       the padding. Nor can the button grow — a flex item with a definite
       preferred size takes min(specified, content) as its automatic minimum,
       so `width: 32px` floors it at 32 even though the widest French caption's
       min-content plus the old padding was 37.

       Content box goes 18 -> 30: Ouvrir clears by 6.0px, Enreg. by 6.25px.
       (Stage N, v1.7.1: the Save caption was SAUVER 25.0 and is now ENREG.
       23.75 — the glossary term is NARROWER than the calque it replaced, so
       this comment's conclusion is unchanged and its margin grew.)
       Negative control: revert this one line and [4][fr] fails again by name
       on both buttons. */
    .preset-action-btn {
      width: 32px;
      height: 16px;
      padding: 0;
      background: rgba(139, 115, 85, 0.3);
      border: 1px solid #8B7355;
      border-radius: 2px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      color: #3C2F2F;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }

    .preset-action-btn:hover {
      background: rgba(139, 115, 85, 0.5);
    }

    /* Control group container - FLEXBOX FOR ALIGNMENT */
    .control-group {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    /* Parameter labels */
    .param-label {
      font-size: 11px;
      color: #3C2F2F;
      text-align: center;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Value displays */
    .value-display {
      font-size: 9px;
      color: #5C4033;
      text-align: center;
      font-weight: normal;
      white-space: nowrap;
    }

    /* SVG Vine-Arc Knobs */
    .knob-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .knob-visual {
      width: 52px;
      height: 52px;
      position: relative;
    }

    .knob-visual svg {
      width: 100%;
      height: 100%;
      transform: rotate(-135deg);
    }

    .knob-track {
      fill: none;
      stroke: rgba(139, 115, 85, 0.3);
      stroke-width: 2;
    }

    .knob-vine {
      fill: none;
      stroke: #5a7a6a;
      stroke-width: 3;
      stroke-linecap: round;
    }

    /* Auto-Gain toggle button */
    .toggle-button {
      width: 70px;
      height: 40px;
      border: 2px solid #8B7355;
      border-radius: 4px;
      background: linear-gradient(to bottom, #E8D5BF, #D4C4B0);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #3C2F2F;
      transition: all 0.15s ease;
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .toggle-button.active {
      background: linear-gradient(to bottom, #8BA870, #6B8E4E);
      border-color: #6B8E4E;
      color: #FFFFFF;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* LED meter */
    .led-meter {
      position: absolute;
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      background: rgba(139, 115, 85, 0.1);
      border: 1px solid #8B7355;
      padding: 4px;
      border-radius: 2px;
    }

    .led-segment {
      width: 100%;
      height: 14px;
      background: #8B7355;
      border-radius: 1px;
      transition: background 0.1s ease;
    }

    .led-segment.active-low {
      background: #8BA870;
      box-shadow: 0 0 4px #8BA870;
    }

    .led-segment.active-mid {
      background: #6B8E4E;
      box-shadow: 0 0 4px #6B8E4E;
    }

    .led-segment.active-high {
      background: #C9A27B;
      box-shadow: 0 0 4px #C9A27B;
    }

    /* Visualization panels */
    .viz-panel {
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid #8B7355;
      border-radius: 4px;
      overflow: hidden;
    }

    .viz-label {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: #3C2F2F;
      background: rgba(245, 230, 211, 0.8);
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.5px;
    }

    /* Transfer curve canvas */
    #transferCurveCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Shell background in transfer curve */
    .shell-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('shell.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.5;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* ── v1.6.0: the settings cluster ─────────────────────────────────────
       Absolutely positioned in .container rather than added to .header. The
       header is `justify-content: space-between` with two children; a third
       flex item would redistribute the row and move the preset bar. Measured,
       the gap between the title's right edge (200.14) and the preset bar's
       left edge (376) is 175.86px, so the gear sits at x=212 in dead space and
       nothing on the header moves. z-index 60 puts it over the header's 10. */
    .settings-cluster {
      position: absolute;
      top: 1px;
      left: 212px;
      z-index: 60;
    }

    .gear-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      background: rgba(139, 115, 85, 0.3);
      border: 1px solid #8B7355;
      border-radius: 2px;
      color: #3C2F2F;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      opacity: 0.6;
    }

    .gear-btn:hover {
      background: rgba(139, 115, 85, 0.5);
      opacity: 1;
    }

    .gear-btn[aria-expanded="true"] {
      background: rgba(139, 168, 112, 0.5);
      border-color: #6B8E4E;
      opacity: 1;
    }

    .gear-btn:focus-visible {
      outline: 2px solid #6B8E4E;
      outline-offset: 2px;
    }

    /* Opens DOWNWARDS: the gear is 1px from the top of a 360px frame, so a
       panel above it would leave the frame entirely.

       WIDTH IS PINNED, not min-width. .settings-popover is not a [data-i18n]
       element, so check-ui-labels assertion 7 measures its box in BOTH
       languages and any language-driven resize is a reported failure. A hard
       width makes the panel's rect language-invariant by construction. 176px
       holds the English row (LANGUAGE + English) and the French one (LANGUE +
       Fran&ccedil;ais) with room to spare, measured as rendered rather than
       from a font probe: text-transform and letter-spacing are not in
       getComputedStyle().font.

       An OPAQUE background and an explicit z-index are load-bearing, not
       decoration: check-ui-labels' overlayOf() recognises a paint layer by
       position + z-index + a background that actually paints, and only then
       stops comparing this panel's captions against the knob row beneath it. */
    .settings-popover {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 61;
      width: 176px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      background: #F5E6D3;
      border: 1px solid #8B7355;
      border-radius: 4px;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
    }

    .settings-popover[hidden] {
      display: none;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* nowrap because the row is space-between: a caption that wrapped would
       grow the row's height and move the control beside it. */
    .settings-label {
      font-size: 9px;
      color: #5C4033;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .settings-select {
      flex: 0 0 auto;
      padding: 2px 4px;
      background: rgba(255, 248, 220, 0.8);
      border: 1px solid #8B7355;
      border-radius: 2px;
      color: #3C2F2F;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 10px;
      line-height: 1.2;
      cursor: pointer;
      outline: none;
    }

    .settings-select:focus-visible {
      outline: 2px solid #6B8E4E;
      outline-offset: 1px;
    }

    /* ── v1.7.0: the hover-help surface ───────────────────────────────────
       ONE floating tip for the whole page, moved and refilled per anchor by
       setupTooltips() from the data-tip-title / data-tip attributes applyI18n()
       writes onto the anchors named in TIP_BINDINGS.

       IT WEARS .settings-popover's PLATE, not another plugin's: the same
       #F5E6D3 paper, the same 1px #8B7355 rule, the same 4px radius and the
       same 2/2/6 drop shadow, with the title line in #5C4033 and letter-spaced
       like .settings-label. Body ink is the page's #3C2F2F Garamond.

       position: fixed AND visibility: hidden are both load-bearing, and not for
       the reason they look like:

         - fixed takes the surface out of .container's flow entirely, so adding
           it moves nothing. .container is position: relative with no transform,
           so it is not a containing block for a fixed child and cannot clip it.

         - visibility: hidden together with opacity: 0 is what keeps the empty
           surface OUT of check-ui-labels' sweep — that gate's visibility
           predicate (check-ui-labels.js:204) rejects display:none,
           visibility:hidden and opacity:0 alike. MEASURED, not assumed: the
           O-Bass executor un-hid its surface and check-ui-labels stayed
           byte-identically GREEN, because a fixed box at 0,0 has the same rect
           in both languages. What actually catches an un-hidden surface is
           check-i18n assertion 10 and boot-all-uis' text count. Hidden anyway,
           because a visible empty box is a visible empty box.

       pointer-events: none, or the surface steals the hover that is keeping it
       open and the tip flickers at every reposition.

       z-index 70 clears .settings-cluster (60) and .settings-popover (61):
       #lang-select is itself an anchor and its tip has to paint OVER the panel
       that contains it. It also clears .header (10), inside whose stacking
       context .preset-dropdown's z-index 100 is confined.

       max-width 250px against a 620px frame. French runs 15-20% longer and
       wraps to more lines inside this cap rather than widening, so the cap is
       what turns extra French into extra HEIGHT — and this frame is only 360px
       tall, which is why tests/ui_tip_render_check.js drives the vertical clamp
       hardest. */
    .tooltip {
      position: fixed;
      z-index: 70;
      max-width: 250px;
      padding: 7px 10px 8px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 11.5px;
      line-height: 1.4;
      color: #3C2F2F;
      background: #F5E6D3;
      border: 1px solid #8B7355;
      border-radius: 4px;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.12s ease;
      pointer-events: none;
    }

    .tooltip.show { opacity: 1; visibility: visible; }

    .tooltip .tip-title {
      display: block;
      font-size: 10.5px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #5C4033;
      margin-bottom: 3px;
    }

    /* Envelope display canvas */
    #envelopeCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header Row - Title + Preset Bar -->
    <div class="header">
      <div class="title">Ouaricon Compressor</div>
      <!-- v1.6.0: every native title attribute on this bar is DELETED (contract
           §4) and
           its text moved to data-i18n-aria. A native title renders a second,
           untranslated OS tooltip; the strings themselves are the ones that
           were already here, translated, never invented. -->
      <div class="preset-bar">
        <button class="preset-nav-btn" id="preset-prev"
                data-i18n-aria="aria.prevPreset" aria-label="Previous preset">&lt;</button>
        <div class="preset-name-container">
          <span class="preset-name" id="preset-name"
                data-i18n-aria="aria.browsePresets" aria-label="Click to browse presets">Default</span>
          <div class="preset-dropdown" id="preset-dropdown"></div>
        </div>
        <button class="preset-nav-btn" id="preset-next"
                data-i18n-aria="aria.nextPreset" aria-label="Next preset">&gt;</button>
        <!-- data-label so a state updater that writes textContent reads the
             authored caption back instead of erasing it
             (pattern_js_state_updater_overwrites_html_labels). -->
        <button class="preset-action-btn" id="preset-load"
                data-i18n="label.load" data-label="Load"
                data-i18n-aria="aria.loadPreset" aria-label="Load preset">Load</button>
        <button class="preset-action-btn" id="preset-save"
                data-i18n="label.save" data-label="Save"
                data-i18n-aria="aria.savePreset" aria-label="Save preset">Save</button>
      </div>
    </div>

    <!-- v1.6.0: the settings cluster. STILL ONE ROW at v1.7.0, and the reason
         has changed: hover-help now exists, but there is no toggle to switch it
         on and off. That is an M1-wide decision rather than an oversight — a
         toggle means a fourth control here, a preference persisted through C++,
         and a data-tip-always bypass so the toggle's own tip still works when
         tips are off. Two of forty-three plugins have one; making the suite
         uniform is a separate pass. The gear's own tip therefore describes the
         language selector and NOTHING else, because a tip that promises a
         control the plugin does not have is worse than no tip.

         POSITIONED ABSOLUTELY IN .container, NOT ADDED TO .header. The header
         is `justify-content: space-between` with exactly two children, and a
         third flex item there would redistribute the row. Measured, the header
         carries 175.86px of slack between the title (ends at x=200.14) and the
         preset bar (starts at x=376), so the gear sits in that gap at x=212
         without touching either. The panel opens DOWNWARDS over the knob row,
         which is what a popover is for: it is an opaque paint layer with its
         own z-index, and check-ui-labels' overlayOf() recognises it as one so
         its captions are never compared against the page beneath it. -->
    <div class="settings-cluster">
      <button type="button" class="gear-btn" id="gear-btn"
              aria-haspopup="dialog" aria-expanded="false"
              data-i18n-aria="aria.settings" aria-label="Settings">&#9881;</button>

      <div class="settings-popover" id="settings-popover"
           role="dialog" data-i18n-aria="aria.settings" aria-label="Settings" hidden>
        <label class="settings-row" for="lang-select">
          <span class="settings-label" data-i18n="label.language" data-label="Language">Language</span>
          <!-- ENDONYMS. Never localized: a French speaker looking for their
               language looks for "Fran&ccedil;ais". -->
          <select class="settings-select" id="lang-select"
                  data-i18n-aria="aria.langSelect" aria-label="Interface language">
            <option value="en">English</option>
            <option value="fr">Fran&ccedil;ais</option>
          </select>
        </label>
      </div>
    </div>

    <!-- Top Row Controls -->
    <!-- Threshold -->
    <div class="control-group" style="left: 10px; top: 28px;">
      <div class="knob-container" id="threshold-knob" data-param="threshold">
        <div class="knob-visual">
          <svg viewBox="0 0 52 52">
            <circle class="knob-track" cx="26" cy="26" r="22"/>
            <circle class="knob-vine" id="threshold-vine" cx="26" cy="26" r="22"
              stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
          </svg>
        </div>
      </div>
      <div class="param-label" data-i18n="label.threshold" data-label="Threshold">Threshold</div>
      <div class="value-display" id="threshold-value">-20.0 dB</div>
    </div>

    <!-- Ratio -->
    <div class="control-group" style="left: 85px; top: 28px;">
      <div class="knob-container" id="ratio-knob" data-param="ratio">
        <div class="knob-visual">
          <svg viewBox="0 0 52 52">
            <circle class="knob-track" cx="26" cy="26" r="22"/>
            <circle class="knob-vine" id="ratio-vine" cx="26" cy="26" r="22"
              stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
          </svg>
        </div>
      </div>
      <div class="param-label" data-i18n="label.ratio" data-label="Ratio">Ratio</div>
      <div class="value-display" id="ratio-value">4.0:1</div>
    </div>

    <!-- Attack -->
    <div class="control-group" style="left: 160px; top: 28px;">
      <div class="knob-container" id="attack-knob" data-param="attack_time">
        <div class="knob-visual">
          <svg viewBox="0 0 52 52">
            <circle class="knob-track" cx="26" cy="26" r="22"/>
            <circle class="knob-vine" id="attack-vine" cx="26" cy="26" r="22"
              stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
          </svg>
        </div>
      </div>
      <div class="param-label" data-i18n="label.attack" data-label="Attack">Attack</div>
      <div class="value-display" id="attack-value">10.0 ms</div>
    </div>

    <!-- Release -->
    <div class="control-group" style="left: 235px; top: 28px;">
      <div class="knob-container" id="release-knob" data-param="release_time">
        <div class="knob-visual">
          <svg viewBox="0 0 52 52">

    <!-- ================= hover-help surface (v1.7.0) =================
         ONE tooltip for the whole page, refilled per anchor by setupTooltips()
         from the data-tip-title / data-tip attributes applyI18n() writes onto
         the anchors named in TIP_BINDINGS.

         BORN EMPTY, and it stays empty until a pointer or a keyboard focus
         reaches an anchor. There is no authored copy in this element and there
         must never be any: a literal here would be a visible string outside the
         i18n table, which check-i18n assertion 10 would demand a key for and
         which would ship English in both languages.

         It is position: fixed, so its place in the markup decides nothing about
         where it paints. -->
    <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>
  </div>

  <!-- JUCE WebView Integration -->
  <script type="module">
    import { getSliderState, getToggleState, getNativeFunction } from './js/juce/index.js';
    // The canon block below calls Juce.getNativeFunction(). It needs the ES
    // MODULE NAMESPACE, not window.__JUCE__ — the latter is the raw transport
    // and does not carry the promise contract
    // (critical_juce_webview_namespace_vs_postmessage). Two import statements
    // from one specifier is legal ES and leaves every call site above untouched.
    import * as Juce from './js/juce/index.js';
    import { PresetManager } from './modules/preset-manager.js';

    // v1.6.0: the label table. The canonical import line, re-rooted from
    // './i18n.js' to './js/i18n.js' because this plugin's controller is an
    // inline <script type="module"> at the UI root rather than a js/app.js.
    // check-i18n assertion 6 accepts exactly that one substitution and nothing
    // else. TIP_BINDINGS is EMPTY here (this page has no hover-help) and is
    // imported anyway so the canon block below stays byte-identical to every
    // other copy; I18N is NOT empty — it houses the three canvas-painted
    // strings, which have no element to hang a key on.
    import { LANGUAGES, I18N, LABELS, TIP_BINDINGS, tr } from './js/i18n.js';

    // Disable context menu (REQUIRED)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // Parameter state and bindings
    const params = {
      threshold: { min: -60.0, max: 0.0, unit: ' dB', format: (v) => v.toFixed(1) },
      ratio: { min: 1.0, max: 20.0, unit: ':1', format: (v) => v.toFixed(1) },
      attack_time: { min: 0.1, max: 100.0, unit: ' ms', format: (v) => v.toFixed(1) },
      release_time: { min: 10.0, max: 1000.0, unit: ' ms', format: (v) => v.toFixed(0) },
      knee: { min: 0.0, max: 20.0, unit: ' dB', format: (v) => v.toFixed(1) },
      output_gain: { min: -12.0, max: 24.0, unit: ' dB', format: (v) => (v >= 0 ? '+' : '') + v.toFixed(1) }
    };

    // Format value for display
    function formatValue(paramId, normalized) {
      const param = params[paramId];
      const value = param.min + normalized * (param.max - param.min);
      return param.format(value) + param.unit;
    }

    // SVG vine-arc knob configs (r=22, circumference=138.23, 270deg arc=103.67)
    const ARC_LENGTH = 103.67;
    const knobConfigs = {
      threshold: { vineId: 'threshold-vine', valueId: 'threshold-value' },
      ratio: { vineId: 'ratio-vine', valueId: 'ratio-value' },
      attack_time: { vineId: 'attack-vine', valueId: 'attack-value' },
      release_time: { vineId: 'release-vine', valueId: 'release-value' },
      knee: { vineId: 'knee-vine', valueId: 'knee-value' },
      output_gain: { vineId: 'output-vine', valueId: 'output-value' }
    };

    // Animation state for smooth knob movement
    const animationState = {
      targets: {},
      frameId: null,
      isRunning: false,
      smoothingFactor: 0.15
    };

    const animationLoop = () => {
      let needsUpdate = false;

      Object.entries(animationState.targets).forEach(([id, state]) => {
        const delta = state.target - state.current;

        if (Math.abs(delta) > 0.0001) {
          state.current += delta * animationState.smoothingFactor;
          needsUpdate = true;

          const offset = ARC_LENGTH - (state.current * ARC_LENGTH);
          state.vine.style.strokeDashoffset = offset;
        }
      });

      if (needsUpdate) {
        animationState.frameId = requestAnimationFrame(animationLoop);
      } else {
        animationState.isRunning = false;
        animationState.frameId = null;
      }
    };

    const startAnimationLoop = () => {
      if (!animationState.isRunning) {
        animationState.isRunning = true;
        animationState.frameId = requestAnimationFrame(animationLoop);
      }
    };

    // Default normalized values for double-click reset (matches processor defaults)
    const paramDefaults = {
      threshold: ((-20.0) - (-60.0)) / (0.0 - (-60.0)),  // -20 dB default
      ratio: (2.0 - 1.0) / (20.0 - 1.0),                  // 2:1 default
      attack_time: (10.0 - 0.1) / (100.0 - 0.1),          // 10 ms default
      release_time: (100.0 - 10.0) / (1000.0 - 10.0),     // 100 ms default
      knee: 6.0 / 20.0,                                    // 6 dB default
      output_gain: (0.0 - (-12.0)) / (24.0 - (-12.0))     // 0 dB default
    };

    // Update SVG vine-arc knob and value display
    function updateKnob(paramId, normalized) {
      const config = knobConfigs[paramId];
      if (!config) return;

      // Animate the vine arc
      if (animationState.targets[paramId]) {
        animationState.targets[paramId].target = normalized;
        startAnimationLoop();
      }

      // Update value display
      const valueDisplay = document.getElementById(config.valueId);
      if (valueDisplay) {
        valueDisplay.textContent = formatValue(paramId, normalized);
      }

      // Update transfer curve when compression params change
      if (['threshold', 'ratio', 'knee'].includes(paramId)) {
        updateTransferCurve();
      }
    }

    // Shared drag state — single mousemove/mouseup pair for all knobs
    let activeKnob = null;  // { sliderState, lastY }

    document.addEventListener('mousemove', (e) => {
      if (!activeKnob) return;
      const deltaY = activeKnob.lastY - e.clientY;
      const current = activeKnob.sliderState.getNormalisedValue();
      activeKnob.sliderState.setNormalisedValue(
        Math.max(0, Math.min(1, current + deltaY / 200))
      );
      activeKnob.lastY = e.clientY;
    });

    document.addEventListener('mouseup', () => { activeKnob = null; });

    // Setup knob interactions
    function setupKnob(knobId, paramId) {
      const knob = document.getElementById(knobId);
      const sliderState = getSliderState(paramId);

      if (!sliderState) {
        console.error(`Failed to get slider state for ${paramId}`);
        return;
      }

      // Initialize animation state for this knob
      const config = knobConfigs[paramId];
      if (config) {
        const vine = document.getElementById(config.vineId);
        const initialNorm = sliderState.getNormalisedValue();

        animationState.targets[paramId] = {
          current: initialNorm,
          target: initialNorm,
          vine: vine,
          config: config
        };

        // Set initial arc position
        const initialOffset = ARC_LENGTH - (initialNorm * ARC_LENGTH);
        vine.style.strokeDashoffset = initialOffset;
      }

      // Listen to parameter changes from C++
      sliderState.valueChangedEvent.addListener(() => {
        updateKnob(paramId, sliderState.getNormalisedValue());
      });

      // Mouse drag — delegates to shared handler
      const knobVisual = knob.querySelector('.knob-visual');
      (knobVisual || knob).addEventListener('mousedown', (e) => {
        activeKnob = { sliderState, lastY: e.clientY };
        e.preventDefault();
      });

      // Double-click to reset to default
      knob.addEventListener('dblclick', () => {
        sliderState.setNormalisedValue(paramDefaults[paramId] || 0.5);
      });

      // Mouse wheel support
      knob.addEventListener('wheel', (e) => {
        e.preventDefault();
        const currentNorm = sliderState.getNormalisedValue();
        const delta = e.deltaY < 0 ? 0.02 : -0.02;
        const newNorm = Math.max(0, Math.min(1, currentNorm + delta));
        sliderState.setNormalisedValue(newNorm);
      }, { passive: false });

      // Initialize visual state
      updateKnob(paramId, sliderState.getNormalisedValue());
    }

    // Setup toggle button
    function setupToggle() {
      const toggle = document.getElementById('auto-gain-toggle');
      const toggleState = getToggleState('auto_gain');

      if (!toggleState) {
        console.error('Failed to get toggle state for auto_gain');
        return;
      }

      // v1.6.0: the toggle's face is a LOCALIZED LABEL, not a literal.
      //
      // An if/else rather than a ternary inside the call: check-i18n assertion
      // 13 rejects a conditional in a setLabel argument, because contract §6
      // authors around an inflection instead of engineering one. setLabel()
      // sets el.dataset.i18n permanently, so the language sweep owns this node
      // from here on — safe precisely because it is an
      // AudioParameterBool-backed node that never holds a number (D-01 arm 3
      // does not bite; contrast O-Marimba's readout-borne timbre words).
      const paintToggle = (value) => {
        toggle.classList.toggle('active', value);
        if (value) setLabel(toggle, 'label.autoGainOn');
        else       setLabel(toggle, 'label.autoGainOff');
      };

      // Listen to parameter changes from C++
      toggleState.valueChangedEvent.addListener(() => {
        paintToggle(toggleState.getValue());
      });

      // Click handler
      toggle.addEventListener('click', () => {
        const currentValue = toggleState.getValue();
        toggleState.setValue(!currentValue);
      });

      // Initialize visual state
      paintToggle(toggleState.getValue());
    }

    // Transfer curve visualization
    function updateTransferCurve() {
      const canvas = document.getElementById('transferCurveCanvas');
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = 'rgba(139, 115, 85, 0.2)';
      ctx.lineWidth = 1;

      for (let i = 0; i <= 4; i++) {
        const x = (canvas.width / 4) * i;
        const y = (canvas.height / 4) * i;

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Get current parameter values
      const thresholdState = getSliderState('threshold');
      const ratioState = getSliderState('ratio');
      const kneeState = getSliderState('knee');

      if (!thresholdState || !ratioState || !kneeState) return;

      const thresholdNorm = thresholdState.getNormalisedValue();
      const ratioNorm = ratioState.getNormalisedValue();
      const kneeNorm = kneeState.getNormalisedValue();

      const threshold = -60.0 + thresholdNorm * 60.0;
      const ratio = 1.0 + ratioNorm * 19.0;
      const knee = kneeNorm * 20.0;

      // Transfer curve with compression
      ctx.strokeStyle = '#6B8E4E';
      ctx.lineWidth = 3.5;
      ctx.beginPath();

      for (let x = 0; x < canvas.width; x++) {
        const inputDb = (x / canvas.width) * 60 - 60; // -60 to 0 dB
        let outputDb;

        if (inputDb < threshold - knee / 2) {
          // Below knee - no compression
          outputDb = inputDb;
        } else if (inputDb > threshold + knee / 2) {
          // Above knee - full compression
          outputDb = threshold + (inputDb - threshold) / ratio;
        } else {
          // Within knee - standard quadratic soft-knee formula
          const kneeInput = inputDb - threshold + knee / 2;
          outputDb = inputDb - (1 - 1 / ratio) * (kneeInput * kneeInput) / (2 * knee);
        }

        const y = canvas.height - ((outputDb + 60) / 60) * canvas.height;

        if (x === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();
    }

    // Metering state with circular buffer
    const HISTORY_SIZE = 300;  // ~10 seconds at 30fps
    let meterState = {
      inputLevel: -60,
      outputLevel: -60,
      gainReduction: 0,
      envelope: -60,
      envelopeHistory: new Float32Array(HISTORY_SIZE).fill(-60),
      grHistory: new Float32Array(HISTORY_SIZE).fill(0),
      historyIndex: 0,
      historyCount: 0
    };

    // Global function called from C++ via evaluateJavascript
    window.updateMeters = function(inputLevel, outputLevel, gainReduction, envelope) {
      meterState.inputLevel = inputLevel;
      meterState.outputLevel = outputLevel;
      meterState.gainReduction = gainReduction;
      meterState.envelope = envelope;

      meterState.envelopeHistory[meterState.historyIndex] = envelope;
      meterState.grHistory[meterState.historyIndex] = gainReduction;
      meterState.historyIndex = (meterState.historyIndex + 1) % HISTORY_SIZE;
      if (meterState.historyCount < HISTORY_SIZE) meterState.historyCount++;
    };

    // Update LED meter with real level data
    function updateMeterDisplay(meterId, levelDB) {
      const meter = document.getElementById(meterId);
      const segments = meter.querySelectorAll('.led-segment');

      const normalized = Math.max(0, Math.min(1, (levelDB + 60) / 60));

      segments.forEach((segment, index) => {
        const segmentThreshold = index / segments.length;
        segment.classList.remove('active-low', 'active-mid', 'active-high');

        if (normalized > segmentThreshold) {
          if (index < segments.length * 0.5) {
            segment.classList.add('active-low');
          } else if (index < segments.length * 0.85) {
            segment.classList.add('active-mid');
          } else {
            segment.classList.add('active-high');
          }
        }
      });
    }

    // Single unified rAF loop for all meter/envelope rendering
    function startRenderLoop() {
      const envCanvas = document.getElementById('envelopeCanvas');
      const envCtx = envCanvas.getContext('2d');

      function frame() {
        // LED meters
        updateMeterDisplay('input-meter', meterState.inputLevel);
        updateMeterDisplay('output-meter', meterState.outputLevel);

        // Envelope/GR canvas
        envCtx.clearRect(0, 0, envCanvas.width, envCanvas.height);

        const count = meterState.historyCount;
        const idx = meterState.historyIndex;

        // Envelope history (top half - green line)
        if (count > 1) {
          envCtx.strokeStyle = '#6B8E4E';
          envCtx.lineWidth = 2;
          envCtx.beginPath();
          for (let i = 0; i < count; i++) {
            const ri = (idx - count + i + HISTORY_SIZE) % HISTORY_SIZE;
            const x = (i / HISTORY_SIZE) * envCanvas.width;
            const normalizedLevel = (meterState.envelopeHistory[ri] + 60) / 60;
            const y = (envCanvas.height / 2) - (normalizedLevel * (envCanvas.height / 2 - 20));
            if (i === 0) envCtx.moveTo(x, y);
            else envCtx.lineTo(x, y);
          }
          envCtx.stroke();
        }

        // Gain reduction histogram (bottom half - amber bars)
        if (count > 0) {
          envCtx.fillStyle = 'rgba(201, 162, 123, 0.6)';
          const barWidth = envCanvas.width / HISTORY_SIZE;
          for (let i = 0; i < count; i++) {
            const ri = (idx - count + i + HISTORY_SIZE) % HISTORY_SIZE;
            const barHeight = (meterState.grHistory[ri] / 30) * (envCanvas.height / 2 - 40);
            envCtx.fillRect(i * barWidth, envCanvas.height / 2 + 20, barWidth, barHeight);
          }
        }

        // GR value text.
        //
        // v1.6.0: LOCALIZED, through trLabel() rather than setLabel(). A canvas
        // string has no element, so it can be neither a [data-i18n] node nor a
        // setLabel() target — and it is invisible to check-i18n, which walks
        // text nodes and textContent writes and reaches fillText through
        // neither. Localizing it is therefore unforced; leaving it English on a
        // French page would simply never have been reported.
        //
        // Read on every frame, so the selector needs no re-render hook here:
        // the next animation frame after a language change already reads the
        // new value of uiLanguage.
        //
        // THE BRANCH IS ON THE VALUE, NOT THE STRING. The shipped code chose
        // between two whole sentences with a ternary; the abbreviation, the
        // colon spacing and the unit are now one entry with a {v} token, so no
        // language can be reached only through one arm of a condition.
        const grValue = meterState.gainReduction > 0
          ? `-${meterState.gainReduction.toFixed(1)}`
          : '0.0';
        envCtx.fillStyle = '#3C2F2F';
        envCtx.font = '11px Garamond, serif';
        envCtx.fillText(
          trLabel('canvas.gr', uiLanguage, { v: grValue }),
          10, envCanvas.height - 25
        );

        // Dividing line
        envCtx.strokeStyle = 'rgba(139, 115, 85, 0.3)';
        envCtx.lineWidth = 1;
        envCtx.beginPath();
        envCtx.moveTo(0, envCanvas.height / 2 + 10);
        envCtx.lineTo(envCanvas.width, envCanvas.height / 2 + 10);
        envCtx.stroke();

        // Labels — v1.6.0: localized, same reasoning as the GR readout above.
        // Both are drawn at x = 10 in a 308px canvas, so length is free:
        // measured 33.99 -> 38.49 and 56.74 -> 65.48 with ctx.measureText.
        envCtx.fillStyle = '#5C4033';
        envCtx.font = '9px Garamond, serif';
        envCtx.fillText(trLabel('canvas.envelope', uiLanguage), 10, 15);
        envCtx.fillText(trLabel('canvas.gainReduction', uiLanguage), 10, envCanvas.height / 2 + 35);

        requestAnimationFrame(frame);
      }
      frame();
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      // Setup parameter controls
      setupKnob('threshold-knob', 'threshold');
      setupKnob('ratio-knob', 'ratio');
      setupKnob('attack-knob', 'attack_time');
      setupKnob('release-knob', 'release_time');
      setupKnob('knee-knob', 'knee');
      setupKnob('output-knob', 'output_gain');
      setupToggle();

      // Initialize Preset Manager
      const presetNameEl = document.getElementById('preset-name');
      const presetDropdown = document.getElementById('preset-dropdown');

      const presetManager = new PresetManager({
        displayElement: presetNameEl,
        prevButton: document.getElementById('preset-prev'),
        nextButton: document.getElementById('preset-next'),
        saveButton: document.getElementById('preset-save'),
        loadButton: document.getElementById('preset-load'),
        getNativeFunction: getNativeFunction,
        onPresetChanged: (name) => {
          console.log('[PresetManager] Loaded:', name);
          updateDropdownActive(name);
        },
        onPresetListUpdated: (list) => {
          buildDropdownMenu(list);
        }
      });
      presetManager.initialize();

      // Build dropdown menu from preset list
      function buildDropdownMenu(presetList) {
        presetDropdown.innerHTML = '';

        if (presetList.length === 0) {
          const emptyItem = document.createElement('div');
          emptyItem.className = 'preset-dropdown-item';
          // v1.6.0: setLabel, so the element declares its own key and the
          // language sweep owns it. "Aucun préréglage" is SINGULAR — French
          // inflects zero as singular where English does not, and contract §6
          // authors around the inflection rather than building a plural engine.
          setLabel(emptyItem, 'label.noPresets');
          emptyItem.style.fontStyle = 'italic';
          emptyItem.style.color = '#888';
          presetDropdown.appendChild(emptyItem);
          return;
        }

        // Add header
        const header = document.createElement('div');
        header.className = 'preset-dropdown-header';
        setLabel(header, 'label.presets');
        presetDropdown.appendChild(header);

        // Add preset items
        presetList.forEach(name => {
          const item = document.createElement('div');
          item.className = 'preset-dropdown-item';
          item.textContent = name;
          item.dataset.preset = name;

          if (name === presetManager.getCurrentPreset()) {
            item.classList.add('active');
          }

          item.addEventListener('click', async (e) => {
            e.stopPropagation();
            await presetManager.loadPreset(name);
            closeDropdown();
          });

          presetDropdown.appendChild(item);
        });
      }

      // Update active state in dropdown
      function updateDropdownActive(currentName) {
        const items = presetDropdown.querySelectorAll('.preset-dropdown-item');
        items.forEach(item => {
          item.classList.toggle('active', item.dataset.preset === currentName);
        });
      }

      // Toggle dropdown
      function toggleDropdown() {
        presetDropdown.classList.toggle('open');
      }

      function closeDropdown() {
        presetDropdown.classList.remove('open');
      }

      // Click on preset name to toggle dropdown
      presetNameEl.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleDropdown();
      });

      // Close dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!presetDropdown.contains(e.target) && e.target !== presetNameEl) {
          closeDropdown();
        }
      });

      // Start visualizations
      updateTransferCurve();
      startRenderLoop();

      // v1.6.0: the settings popover, then the language runtime — both LAST.
      // Every parameter binding and the preset manager above have already run,
      // so an i18n failure leaves an English plugin that still works rather
      // than a dead page.
      // v1.7.0: setupTooltips() is called AFTER initI18n() and INSIDE the same
      // try/catch, deliberately on both counts. The anchors carry no
      // data-tip attributes at all until initI18n() has painted them, so a
      // renderer set up before it would find nothing to bind — and a throw out
      // of either must not escape, because on this page the whole controller is
      // one inline module (pattern_module_toplevel_init_tdz).
      initializeSettingsPopover();
      try { initI18n(); setupTooltips(); } catch (e) { console.error('i18n init failed:', e); }

      console.log('O-Comp v1.7.1 UI loaded - vine-arc knobs, hover-help');
    });

    // ═══════════════════════════════════════════════════════════════════════
    // v1.6.0: the settings popover
    // ═══════════════════════════════════════════════════════════════════════
    //
    // Gear at the top of the frame, so the panel opens DOWNWARDS: the gear is
    // 1px from the top of a 360px window and a panel above it would leave the
    // frame entirely.
    let settingsPopoverEl = null;
    let gearBtnEl = null;

    function setSettingsPopoverOpen(open) {
      if (!settingsPopoverEl || !gearBtnEl) return;
      settingsPopoverEl.hidden = !open;
      gearBtnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function initializeSettingsPopover() {
      gearBtnEl = document.getElementById('gear-btn');
      settingsPopoverEl = document.getElementById('settings-popover');

      if (!gearBtnEl || !settingsPopoverEl) {
        console.warn('settings popover missing - language selector unavailable');
        return;
      }

      gearBtnEl.addEventListener('click', (e) => {
        e.stopPropagation();
        setSettingsPopoverOpen(settingsPopoverEl.hidden);
      });

      // Dismiss on a press anywhere else, and on Escape. mousedown rather than
      // click, so the panel is gone before a knob drag underneath it begins —
      // this page starts a knob drag on mousedown.
      document.addEventListener('mousedown', (e) => {
        if (settingsPopoverEl.hidden) return;
        if (settingsPopoverEl.contains(e.target) || gearBtnEl.contains(e.target)) return;
        setSettingsPopoverOpen(false);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !settingsPopoverEl.hidden) {
          setSettingsPopoverOpen(false);
          gearBtnEl.focus();
        }
      });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // i18n — the canon v2 block, VERBATIM from scripts/i18n-canon.js
    // ═══════════════════════════════════════════════════════════════════════
    //
    // Byte-compared by check-i18n assertion 6 after comment stripping and
    // whitespace normalisation. Do not edit it here; edit the canon and every
    // copy together, which is the whole point of holding it as data.
    //
    // It sits at the END of the module. Nothing on this page READS trLabel()
    // during module evaluation — every call site is inside a function body
    // reached from the DOMContentLoaded handler or from a rAF frame — so the
    // bottom is safe here. That is a fact about this page, not a convention:
    // O-SimpleReverb has an IIFE that calls trLabel() while the module is
    // still evaluating and had to put the block at the TOP or take a TDZ
    // ReferenceError that kills the whole inline controller
    // (pattern_module_toplevel_init_tdz).

    let uiLanguage = 'en';
    let getUiLanguageNative = null;
    let setUiLanguageNative = null;

    // LABELS first, I18N as the fallback: a control whose tooltip title already IS
    // its label carries one key, not two copies of the same string.
    function trLabel(key, lang, vars) {
        const entry = (typeof LABELS === 'object' && LABELS && LABELS[key]) || I18N[key];
        if (!entry) { console.warn(`i18n: missing label key ${key}`); return key; }
        const s = entry[lang] || entry.en;
        const resolve = (v) => {
            const nested = (typeof LABELS === 'object' && LABELS && LABELS[v]) || I18N[v];
            return nested ? String((nested[lang] || nested.en).t) : String(v);
        };
        return vars
            ? String(s.t).replace(/\{(\w+)\}/g, (m, n) => (n in vars ? resolve(vars[n]) : m))
            : String(s.t);
    }

    function applyLabel(el) {
        const key = el.dataset.i18n;
        if (!key) return;
        let vars = null;
        try { vars = el.dataset.i18nVars ? JSON.parse(el.dataset.i18nVars) : null; }
        catch (e) { console.warn(`i18n: bad vars on ${key}`); }
        const s = trLabel(key, uiLanguage, vars);
        el.dataset.label = s;
        el.textContent   = s;
    }

    function applyI18nAttributes(el) {
        const pairs = [['i18nAria', 'aria-label'], ['i18nPlaceholder', 'placeholder'], ['i18nAlt', 'alt']];
        for (const [prop, attr] of pairs) {
            const key = el.dataset[prop];
            if (key) el.setAttribute(attr, trLabel(key, uiLanguage, null));
        }
    }

    function setLabel(el, key, vars) {
        if (!el) return;
        el.dataset.i18n = key;
        if (vars) el.dataset.i18nVars = JSON.stringify(vars); else delete el.dataset.i18nVars;
        applyLabel(el);
    }

    function applyI18n(lang) {
        uiLanguage = LANGUAGES.includes(lang) ? lang : 'en';
        // <html lang> follows the selector: screen readers pick the French voice,
        // and CSS hyphens:auto / quotes resolve in the page's actual language.
        document.documentElement.lang = uiLanguage;
        for (const [selector, key, wrapper, vars] of TIP_BINDINGS) {
            const el = document.querySelector(selector);
            if (!el) { console.warn(`i18n: tip target not found: ${selector}`); continue; }
            const target = wrapper ? (el.closest(wrapper) || el) : el;
            const s = tr(key, uiLanguage, vars);
            target.setAttribute('data-tip-title', s.t);
            target.setAttribute('data-tip', s.b);
        }
        for (const el of document.querySelectorAll('[data-i18n]')) applyLabel(el);
        for (const el of document.querySelectorAll('[data-i18n-aria],[data-i18n-placeholder],[data-i18n-alt]'))
            applyI18nAttributes(el);
        const sel = document.getElementById('lang-select');
        if (sel && sel.value !== uiLanguage) sel.value = uiLanguage;
    }

    // Exposed so a clamp gate can drive the language without teaching the ui-stub a
    // promise contract: page.evaluate((l) => window.__setLanguage(l), 'fr').
    window.__setLanguage = applyI18n;
    // Exposed for the same reason, and so a sibling module can write a localized
    // label without app.js having to export anything — O-Bitrot's controller is an
    // inline <script type="module">, where an export declaration has nowhere to go.
    window.__setLabel = setLabel;
    window.__reapplyI18n = () => applyI18n(uiLanguage);

    function initI18n() {
        try {
            getUiLanguageNative = Juce.getNativeFunction('getUiLanguage');
            setUiLanguageNative = Juce.getNativeFunction('setUiLanguage');
        } catch (e) {
            console.warn('Language preference not available, session-only:', e);
        }

        // Paint the default SYNCHRONOUSLY first. Never blank, never a flash.
        try { applyI18n('en'); } catch (e) { console.error('i18n init failed:', e); }

        if (getUiLanguageNative) {
            getUiLanguageNative()
                .then((code) => applyI18n(code === 'fr' ? 'fr' : 'en'))
                .catch((e) => console.warn('Could not read language preference:', e));
        }

        const sel = document.getElementById('lang-select');
        if (sel) sel.addEventListener('change', (e) => {
            applyI18n(e.target.value);
            if (setUiLanguageNative) setUiLanguageNative(uiLanguage).catch(() => {});
        });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // v1.7.0: the hover-help renderer
    // ═══════════════════════════════════════════════════════════════════════
    //
    // OUTSIDE the canon region above, which ends at initI18n()'s closing brace
    // and is byte-compared by check-i18n assertion 6. Ported from O-simpleFM's
    // js/app.js setupTooltips() — the delegated, cursor-following family — and
    // NOT from O-Tapestop's measure-then-pin engine, which exists to serve a
    // flip-above/below design and three clamp gates this page does not have.
    //
    // THE COPY IS NOT LOOKED UP HERE. applyI18n() has already written it onto
    // each anchor as data-tip-title + data-tip in the current language and
    // rewrites both on every language change, so this function only positions
    // and paints what the anchor is already carrying.
    //
    // Each property below is load-bearing:
    //
    //   1. DELEGATED ON document, never querySelectorAll('[data-tip]') at
    //      setup. No anchor carries data-tip until applyI18n() has run, so a
    //      setup-time query binds NOTHING and fails silently.
    //   2. pointerover / pointerout / focusin / focusout, because those BUBBLE.
    //      pointerenter / pointerleave / focus / blur do not, and a delegated
    //      listener on document never sees them.
    //   3. pointerout ignores a move between two descendants of the SAME
    //      anchor. Every .control-group here holds a knob, a caption and a
    //      readout; without this the tip would flicker off and on at each
    //      internal boundary.
    //   4. createElement + textContent, NEVER innerHTML. Localized copy must
    //      not reach a markup path — check-i18n assertion 9 already forbids an
    //      angle bracket in an i18n.js string literal and this is its other
    //      half.
    //   5. Clamped on ALL FOUR edges at 8px, AFTER the flip rather than instead
    //      of it, so a tip that fits on neither side of the cursor still lands
    //      fully on screen. In a 620 x 360 frame the flip is the normal path,
    //      not an edge case: the knob row sits at y=28 and the auto-gain column
    //      at x=475, so the right-hand tips flip horizontally and the tall
    //      French ones flip vertically.
    //   6. pointer-events: none on the surface (CSS), or it steals its own
    //      hover.
    //   7. Escape hides it, and so does any pointerdown.
    //
    // NO tabindex IS ADDED to .control-group. These knobs are mouse-drag,
    // double-click-reset and wheel only, and have never been keyboard-operable;
    // a tab stop there would add tab-order noise for a control the keyboard
    // still could not turn, and would pop a tip open in the middle of a
    // click-drag. #gear-btn and #lang-select are natively focusable and are the
    // keyboard half of this feature.
    function setupTooltips() {
      const tip = document.getElementById('tooltip');
      if (!tip) { console.warn('tooltip surface missing - hover-help unavailable'); return; }

      const MARGIN = 8;
      let active = null;

      const position = (x, y) => {
        const r = tip.getBoundingClientRect();
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        let nx = x + 14;
        let ny = y + 16;
        // Flip to the other side of the cursor when the natural side overflows.
        if (nx + r.width  > vw - MARGIN) nx = x - r.width  - 14;
        if (ny + r.height > vh - MARGIN) ny = y - r.height - 12;
        // Then clamp, unconditionally, on all four edges. Math.max on the upper
        // bound keeps the arithmetic sane if a tip ever exceeds the frame.
        nx = Math.min(Math.max(MARGIN, nx), Math.max(MARGIN, vw - r.width  - MARGIN));
        ny = Math.min(Math.max(MARGIN, ny), Math.max(MARGIN, vh - r.height - MARGIN));
        tip.style.left = `${nx}px`;
        tip.style.top  = `${ny}px`;
      };

      const show = (el, x, y) => {
        const title = el.getAttribute('data-tip-title');
        const body  = el.getAttribute('data-tip');
        if (!title && !body) return;
        tip.textContent = '';
        if (title) {
          const t = document.createElement('span');
          t.className = 'tip-title';
          t.textContent = title;
          tip.appendChild(t);
        }
        if (body) tip.appendChild(document.createTextNode(body));
        tip.classList.add('show');
        tip.setAttribute('aria-hidden', 'false');
        position(x, y);
      };

      const hide = () => {
        tip.classList.remove('show');
        tip.setAttribute('aria-hidden', 'true');
        active = null;
      };

      const anchorOf = (t) => (t && t.closest ? t.closest('[data-tip]') : null);

      // Focus opens a tip as well — that is the keyboard half of this feature —
      // but ONLY when the focus arrived from the keyboard.
      //
      // A MOUSE CLICK ON A <button> FOCUSES IT, so the reference renderer's
      // unconditional focusin rule re-opens the tip that pointerdown has just
      // hidden, with the pointer still on the anchor and no further pointerover
      // coming — and it sits on top of whatever the click opened. Measured on
      // the pilots: the gear's tip covered the settings popover it had just
      // opened by 146 x 35 px on O-Bass and 161 x 29 px on O-AnalogSaturation,
      // with every gate green throughout (check-ui-labels classes the surface
      // as pointer-events: none decoration and has nothing to say about it).
      //
      // :focus-visible is deliberately NOT the discriminator. Chromium reports
      // it false for a programmatic .focus() following a click, so a gate
      // driving focus directly would measure "no tip" and record that as
      // correct — a false pass built into the fix. An explicit latch on the
      // last input device is the same rule and is drivable with real events.
      //
      // No <input> suppression is needed here: this page has no double-click
      // value editor, and its only form control is #lang-select, which IS an
      // anchor and whose keyboard tip is the accessibility half of this
      // feature.
      let lastInputWasPointer = false;

      document.addEventListener('pointerover', (e) => {
        const el = anchorOf(e.target);
        if (!el || el === active) return;
        active = el;
        show(el, e.clientX, e.clientY);
      });
      document.addEventListener('pointermove', (e) => {
        if (active && anchorOf(e.target) === active) position(e.clientX, e.clientY);
      });
      document.addEventListener('pointerout', (e) => {
        if (!active) return;
        if (anchorOf(e.relatedTarget) === active) return;   // same anchor, child boundary
        hide();
      });
      document.addEventListener('pointerdown', () => { lastInputWasPointer = true; hide(); });

      document.addEventListener('focusin', (e) => {
        if (lastInputWasPointer) return;
        const el = anchorOf(e.target);
        if (!el) return;
        active = el;
        const r = el.getBoundingClientRect();
        show(el, r.left + r.width / 2, r.bottom);
      });
      document.addEventListener('focusout', hide);

      // One keydown listener, two jobs: any key at all means the keyboard is
      // driving again, which releases the latch above; Escape additionally
      // hides. Registered separately from initializeSettingsPopover()'s own
      // Escape handler, which closes the popover — both run, and they are
      // independent.
      document.addEventListener('keydown', (e) => {
        lastInputWasPointer = false;
        if (e.key === 'Escape') hide();
      });
    }
  </script>
</body>
</html>

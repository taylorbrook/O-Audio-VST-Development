<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouaricon Compressor</title>

  <style>
    /* CRITICAL: WebView constraints */
    html, body {
      height: 100%;  /* REQUIRED - replaces viewport units */
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* Native application feel */
    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;

      /* Ouaricon Naturalist styling */
      background-image: url('paper-bg.jpg');
      background-size: cover;
      background-position: center;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
    }

    /* Container fills entire window */
    .container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Header row - Title + Preset Bar */
    .header {
      position: absolute;
      top: 0;
      left: 10px;
      right: 80px; /* Leave space for output meter label */
      height: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #3C2F2F;
      white-space: nowrap;
    }

    /* Preset Bar */
    .preset-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(139, 168, 112, 0.25);
      border: 1px solid #8B7355;
      border-radius: 3px;
      padding: 2px 4px;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .preset-nav-btn {
      width: 18px;
      height: 16px;
      background: rgba(139, 115, 85, 0.3);
      border: 1px solid #8B7355;
      border-radius: 2px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 11px;
      font-weight: bold;
      color: #3C2F2F;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }

    .preset-nav-btn:hover {
      background: rgba(139, 115, 85, 0.5);
    }

    .preset-name-container {
      position: relative;
    }

    .preset-name {
      min-width: 70px;
      max-width: 100px;
      text-align: center;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 10px;
      color: #3C2F2F;
      padding: 1px 4px;
      background: rgba(255, 248, 220, 0.5);
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preset-name:hover {
      background: rgba(255, 248, 220, 0.8);
    }

    /* Preset Dropdown Menu */
    .preset-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      min-width: 120px;
      max-height: 200px;
      overflow-y: auto;
      background: #F5E6D3;
      border: 1px solid #8B7355;
      border-radius: 3px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      z-index: 100;
      margin-top: 2px;
    }

    .preset-dropdown.open {
      display: block;
    }

    .preset-dropdown-item {
      padding: 4px 8px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 10px;
      color: #3C2F2F;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 1px solid rgba(139, 115, 85, 0.2);
    }

    .preset-dropdown-item:last-child {
      border-bottom: none;
    }

    .preset-dropdown-item:hover {
      background: rgba(139, 168, 112, 0.3);
    }

    .preset-dropdown-item.active {
      background: rgba(139, 168, 112, 0.5);
      font-weight: bold;
    }

    .preset-dropdown-header {
      padding: 3px 8px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      color: #5C4033;
      font-weight: bold;
      background: rgba(139, 115, 85, 0.15);
      border-bottom: 1px solid rgba(139, 115, 85, 0.3);
    }

    .preset-action-btn {
      width: 32px;
      height: 16px;
      background: rgba(139, 115, 85, 0.3);
      border: 1px solid #8B7355;
      border-radius: 2px;
      font-family: Garamond, 'Times New Roman', serif;
      font-size: 9px;
      color: #3C2F2F;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }

    .preset-action-btn:hover {
      background: rgba(139, 115, 85, 0.5);
    }

    /* Control group container - FLEXBOX FOR ALIGNMENT */
    .control-group {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    /* Parameter labels */
    .param-label {
      font-size: 11px;
      color: #3C2F2F;
      text-align: center;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Value displays */
    .value-display {
      font-size: 9px;
      color: #5C4033;
      text-align: center;
      font-weight: normal;
      white-space: nowrap;
    }

    /* Seed knob container */
    .knob-container {
      width: 40px;
      height: 40px;
      cursor: pointer;
      position: relative;
    }

    /* Seed knob - botanical aesthetic */
    .seed-knob {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #C9A27B, #8B7355);
      border: 2px solid #6B5847;
      position: relative;
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 0.3),
        inset 0 -2px 4px rgba(0, 0, 0, 0.3),
        0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* Seed center dot */
    .seed-knob::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: #4A3728;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* Seed radial lines */
    .seed-knob::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90%;
      height: 90%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 15deg,
          rgba(107, 88, 71, 0.1) 15deg,
          rgba(107, 88, 71, 0.1) 18deg
        );
    }

    /* Knob indicator line */
    .knob-indicator {
      position: absolute;
      top: 8%;
      left: 50%;
      width: 2px;
      height: 40%;
      background: #3C2F2F;
      transform-origin: bottom center;
      transform: translateX(-50%);
      border-radius: 1px;
    }

    /* Auto-Gain toggle button */
    .toggle-button {
      width: 70px;
      height: 40px;
      border: 2px solid #8B7355;
      border-radius: 4px;
      background: linear-gradient(to bottom, #E8D5BF, #D4C4B0);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #3C2F2F;
      transition: all 0.15s ease;
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .toggle-button.active {
      background: linear-gradient(to bottom, #8BA870, #6B8E4E);
      border-color: #6B8E4E;
      color: #FFFFFF;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* LED meter */
    .led-meter {
      position: absolute;
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      background: rgba(139, 115, 85, 0.1);
      border: 1px solid #8B7355;
      padding: 4px;
      border-radius: 2px;
    }

    .led-segment {
      width: 100%;
      height: 14px;
      background: #8B7355;
      border-radius: 1px;
      transition: background 0.1s ease;
    }

    .led-segment.active-low {
      background: #8BA870;
      box-shadow: 0 0 4px #8BA870;
    }

    .led-segment.active-mid {
      background: #6B8E4E;
      box-shadow: 0 0 4px #6B8E4E;
    }

    .led-segment.active-high {
      background: #C9A27B;
      box-shadow: 0 0 4px #C9A27B;
    }

    /* Visualization panels */
    .viz-panel {
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid #8B7355;
      border-radius: 4px;
      overflow: hidden;
    }

    .viz-label {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: #3C2F2F;
      background: rgba(245, 230, 211, 0.8);
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.5px;
    }

    /* Transfer curve canvas */
    #transferCurveCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Shell background in transfer curve */
    .shell-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('shell.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.5;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* Envelope display canvas */
    #envelopeCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <!-- JUCE WebView Integration -->
  <script type="module" src="./js/juce/index.js"></script>
  <script type="module">
    import { getSliderState, getToggleState, getNativeFunction } from './js/juce/index.js';
    import { PresetManager } from './modules/preset-manager.js';

    // Disable context menu (REQUIRED)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // Parameter state and bindings
    const params = {
      threshold: { min: -60.0, max: 0.0, unit: ' dB', format: (v) => v.toFixed(1) },
      ratio: { min: 1.0, max: 20.0, unit: ':1', format: (v) => v.toFixed(1) },
      attack_time: { min: 0.1, max: 100.0, unit: ' ms', format: (v) => v.toFixed(1) },
      release_time: { min: 10.0, max: 1000.0, unit: ' ms', format: (v) => v.toFixed(0) },
      knee: { min: 0.0, max: 20.0, unit: ' dB', format: (v) => v.toFixed(1) },
      output_gain: { min: -12.0, max: 24.0, unit: ' dB', format: (v) => (v >= 0 ? '+' : '') + v.toFixed(1) }
    };

    // Format value for display
    function formatValue(paramId, normalized) {
      const param = params[paramId];
      const value = param.min + normalized * (param.max - param.min);
      return param.format(value) + param.unit;
    }

    // Map parameter IDs to element base names
    const paramToElementId = {
      threshold: 'threshold',
      ratio: 'ratio',
      attack_time: 'attack',
      release_time: 'release',
      knee: 'knee',
      output_gain: 'output'
    };

    // Default normalized values for double-click reset (matches processor defaults)
    const paramDefaults = {
      threshold: ((-20.0) - (-60.0)) / (0.0 - (-60.0)),  // -20 dB default
      ratio: (2.0 - 1.0) / (20.0 - 1.0),                  // 2:1 default
      attack_time: (10.0 - 0.1) / (100.0 - 0.1),          // 10 ms default
      release_time: (100.0 - 10.0) / (1000.0 - 10.0),     // 100 ms default
      knee: 6.0 / 20.0,                                    // 6 dB default
      output_gain: (0.0 - (-12.0)) / (24.0 - (-12.0))     // 0 dB default
    };

    // Update knob rotation and value display
    function updateKnob(paramId, normalized) {
      const rotation = (normalized * 270) - 135; // -135deg to +135deg range

      const elementBase = paramToElementId[paramId] || paramId;
      const indicator = document.getElementById(`${elementBase}-indicator`);
      if (indicator) {
        indicator.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
      }

      // Update value display
      const valueDisplay = document.getElementById(`${elementBase}-value`);
      if (valueDisplay) {
        valueDisplay.textContent = formatValue(paramId, normalized);
      }

      // Update transfer curve when compression params change
      if (['threshold', 'ratio', 'knee'].includes(paramId)) {
        updateTransferCurve();
      }
    }

    // Setup knob interactions
    function setupKnob(knobId, paramId) {
      const knob = document.getElementById(knobId);
      const sliderState = getSliderState(paramId);

      if (!sliderState) {
        console.error(`Failed to get slider state for ${paramId}`);
        return;
      }

      // Listen to parameter changes from C++
      sliderState.valueChangedEvent.addListener(() => {
        const normalized = sliderState.getNormalisedValue();
        updateKnob(paramId, normalized);
      });

      // Mouse drag handler - RELATIVE DRAG (frame-delta)
      let isDragging = false;
      let lastY = 0;

      knob.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastY = e.clientY;
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const deltaY = lastY - e.clientY;  // Frame-delta, not total distance
        const currentNormalized = sliderState.getNormalisedValue();
        let newNormalized = currentNormalized + (deltaY / 200);  // 200px = full range
        newNormalized = Math.max(0, Math.min(1, newNormalized));

        sliderState.setNormalisedValue(newNormalized);
        lastY = e.clientY;  // Update for next frame
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // Double-click to reset to default
      knob.addEventListener('dblclick', () => {
        const defaultNormalized = paramDefaults[paramId] || 0.5;
        sliderState.setNormalisedValue(defaultNormalized);
      });

      // Initialize visual state
      const initialNormalized = sliderState.getNormalisedValue();
      updateKnob(paramId, initialNormalized);
    }

    // Setup toggle button
    function setupToggle() {
      const toggle = document.getElementById('auto-gain-toggle');
      const toggleState = getToggleState('auto_gain');

      if (!toggleState) {
        console.error('Failed to get toggle state for auto_gain');
        return;
      }

      // Listen to parameter changes from C++
      toggleState.valueChangedEvent.addListener(() => {
        const value = toggleState.getValue();
        toggle.classList.toggle('active', value);
        toggle.textContent = value ? 'ON' : 'OFF';
      });

      // Click handler
      toggle.addEventListener('click', () => {
        const currentValue = toggleState.getValue();
        toggleState.setValue(!currentValue);
      });

      // Initialize visual state
      const initialValue = toggleState.getValue();
      toggle.classList.toggle('active', initialValue);
      toggle.textContent = initialValue ? 'ON' : 'OFF';
    }

    // Transfer curve visualization
    function updateTransferCurve() {
      const canvas = document.getElementById('transferCurveCanvas');
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = 'rgba(139, 115, 85, 0.2)';
      ctx.lineWidth = 1;

      for (let i = 0; i <= 4; i++) {
        const x = (canvas.width / 4) * i;
        const y = (canvas.height / 4) * i;

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Get current parameter values
      const thresholdState = getSliderState('threshold');
      const ratioState = getSliderState('ratio');
      const kneeState = getSliderState('knee');

      if (!thresholdState || !ratioState || !kneeState) return;

      const thresholdNorm = thresholdState.getNormalisedValue();
      const ratioNorm = ratioState.getNormalisedValue();
      const kneeNorm = kneeState.getNormalisedValue();

      const threshold = -60.0 + thresholdNorm * 60.0;
      const ratio = 1.0 + ratioNorm * 19.0;
      const knee = kneeNorm * 20.0;

      // Transfer curve with compression
      ctx.strokeStyle = '#6B8E4E';
      ctx.lineWidth = 3.5;
      ctx.beginPath();

      for (let x = 0; x < canvas.width; x++) {
        const inputDb = (x / canvas.width) * 60 - 60; // -60 to 0 dB
        let outputDb;

        if (inputDb < threshold - knee / 2) {
          // Below knee - no compression
          outputDb = inputDb;
        } else if (inputDb > threshold + knee / 2) {
          // Above knee - full compression
          outputDb = threshold + (inputDb - threshold) / ratio;
        } else {
          // Within knee - soft transition
          const kneeInput = inputDb - (threshold - knee / 2);
          const kneeRange = knee;
          const kneePos = kneeInput / kneeRange;
          outputDb = inputDb + (kneePos * kneePos) * ((inputDb - threshold) / ratio - (inputDb - threshold));
        }

        const y = canvas.height - ((outputDb + 60) / 60) * canvas.height;

        if (x === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();
    }

    // Metering state
    let meterState = {
      inputLevel: -60,
      outputLevel: -60,
      gainReduction: 0,
      envelope: -60,
      envelopeHistory: [],  // Rolling history for envelope display
      grHistory: []         // Rolling history for gain reduction
    };
    const HISTORY_SIZE = 300;  // ~10 seconds at 30fps

    // Global function called from C++ via evaluateJavascript
    window.updateMeters = function(inputLevel, outputLevel, gainReduction, envelope) {
      meterState.inputLevel = inputLevel;
      meterState.outputLevel = outputLevel;
      meterState.gainReduction = gainReduction;
      meterState.envelope = envelope;

      // Add to history (rolling buffer)
      meterState.envelopeHistory.push(envelope);
      meterState.grHistory.push(gainReduction);

      if (meterState.envelopeHistory.length > HISTORY_SIZE) {
        meterState.envelopeHistory.shift();
      }
      if (meterState.grHistory.length > HISTORY_SIZE) {
        meterState.grHistory.shift();
      }
    };

    // Envelope display visualization (real data)
    function drawEnvelopeDisplay() {
      const canvas = document.getElementById('envelopeCanvas');
      const ctx = canvas.getContext('2d');

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const history = meterState.envelopeHistory;
        const grHistory = meterState.grHistory;

        // Draw envelope history (top half - green line)
        if (history.length > 1) {
          ctx.strokeStyle = '#6B8E4E';
          ctx.lineWidth = 2;
          ctx.beginPath();

          for (let i = 0; i < history.length; i++) {
            const x = (i / HISTORY_SIZE) * canvas.width;
            // Map -60dB to 0dB to canvas height (top half)
            const normalizedLevel = (history[i] + 60) / 60;
            const y = (canvas.height / 2) - (normalizedLevel * (canvas.height / 2 - 20));

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }

        // Draw gain reduction histogram (bottom half - amber bars)
        if (grHistory.length > 0) {
          ctx.fillStyle = 'rgba(201, 162, 123, 0.6)';

          const barWidth = canvas.width / HISTORY_SIZE;
          for (let i = 0; i < grHistory.length; i++) {
            const x = i * barWidth;
            // GR is positive in dB, map 0-30dB to bar height
            const barHeight = (grHistory[i] / 30) * (canvas.height / 2 - 40);
            const y = canvas.height / 2 + 20;

            ctx.fillRect(x, y, barWidth, barHeight);
          }
        }

        // Draw current GR value text
        ctx.fillStyle = '#3C2F2F';
        ctx.font = '11px Garamond, serif';
        const grText = meterState.gainReduction > 0
          ? `GR: -${meterState.gainReduction.toFixed(1)} dB`
          : 'GR: 0.0 dB';
        ctx.fillText(grText, 10, canvas.height - 25);

        // Draw dividing line
        ctx.strokeStyle = 'rgba(139, 115, 85, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height / 2 + 10);
        ctx.lineTo(canvas.width, canvas.height / 2 + 10);
        ctx.stroke();

        // Labels
        ctx.fillStyle = '#5C4033';
        ctx.font = '9px Garamond, serif';
        ctx.fillText('Envelope', 10, 15);
        ctx.fillText('Gain Reduction', 10, canvas.height / 2 + 35);

        requestAnimationFrame(draw);
      }

      draw();
    }

    // Update LED meter with real level data
    function updateMeterDisplay(meterId, levelDB) {
      const meter = document.getElementById(meterId);
      const segments = meter.querySelectorAll('.led-segment');

      // Map -60dB to 0dB to 0-1 range
      const normalized = Math.max(0, Math.min(1, (levelDB + 60) / 60));

      segments.forEach((segment, index) => {
        const segmentThreshold = index / segments.length;
        segment.classList.remove('active-low', 'active-mid', 'active-high');

        if (normalized > segmentThreshold) {
          if (index < segments.length * 0.5) {
            segment.classList.add('active-low');
          } else if (index < segments.length * 0.85) {
            segment.classList.add('active-mid');
          } else {
            segment.classList.add('active-high');
          }
        }
      });
    }

    // Animate meters with real data
    function startMeterAnimation() {
      function update() {
        updateMeterDisplay('input-meter', meterState.inputLevel);
        updateMeterDisplay('output-meter', meterState.outputLevel);
        requestAnimationFrame(update);
      }
      update();
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      // Setup parameter controls
      setupKnob('threshold-knob', 'threshold');
      setupKnob('ratio-knob', 'ratio');
      setupKnob('attack-knob', 'attack_time');
      setupKnob('release-knob', 'release_time');
      setupKnob('knee-knob', 'knee');
      setupKnob('output-knob', 'output_gain');
      setupToggle();

      // Initialize Preset Manager
      const presetNameEl = document.getElementById('preset-name');
      const presetDropdown = document.getElementById('preset-dropdown');

      const presetManager = new PresetManager({
        displayElement: presetNameEl,
        prevButton: document.getElementById('preset-prev'),
        nextButton: document.getElementById('preset-next'),
        saveButton: document.getElementById('preset-save'),
        loadButton: document.getElementById('preset-load'),
        getNativeFunction: getNativeFunction,
        onPresetChanged: (name) => {
          console.log('[PresetManager] Loaded:', name);
          updateDropdownActive(name);
        },
        onPresetListUpdated: (list) => {
          buildDropdownMenu(list);
        }
      });
      presetManager.initialize();

      // Build dropdown menu from preset list
      function buildDropdownMenu(presetList) {
        presetDropdown.innerHTML = '';

        if (presetList.length === 0) {
          const emptyItem = document.createElement('div');
          emptyItem.className = 'preset-dropdown-item';
          emptyItem.textContent = 'No presets';
          emptyItem.style.fontStyle = 'italic';
          emptyItem.style.color = '#888';
          presetDropdown.appendChild(emptyItem);
          return;
        }

        // Add header
        const header = document.createElement('div');
        header.className = 'preset-dropdown-header';
        header.textContent = 'Presets';
        presetDropdown.appendChild(header);

        // Add preset items
        presetList.forEach(name => {
          const item = document.createElement('div');
          item.className = 'preset-dropdown-item';
          item.textContent = name;
          item.dataset.preset = name;

          if (name === presetManager.getCurrentPreset()) {
            item.classList.add('active');
          }

          item.addEventListener('click', async (e) => {
            e.stopPropagation();
            await presetManager.loadPreset(name);
            closeDropdown();
          });

          presetDropdown.appendChild(item);
        });
      }

      // Update active state in dropdown
      function updateDropdownActive(currentName) {
        const items = presetDropdown.querySelectorAll('.preset-dropdown-item');
        items.forEach(item => {
          item.classList.toggle('active', item.dataset.preset === currentName);
        });
      }

      // Toggle dropdown
      function toggleDropdown() {
        presetDropdown.classList.toggle('open');
      }

      function closeDropdown() {
        presetDropdown.classList.remove('open');
      }

      // Click on preset name to toggle dropdown
      presetNameEl.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleDropdown();
      });

      // Close dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!presetDropdown.contains(e.target) && e.target !== presetNameEl) {
          closeDropdown();
        }
      });

      // Start visualizations
      updateTransferCurve();
      drawEnvelopeDisplay();
      startMeterAnimation();

      console.log('O-Comp v1.2.0 UI loaded - preset dropdown enabled');
    });
  </script>
</body>
</html>

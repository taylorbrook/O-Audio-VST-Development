<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OuariconComp UI Mockup v2</title>

  <style>
    /* CRITICAL: WebView constraints */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      /* Native application feel */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
      cursor: default;
      overflow: hidden;

      /* Styling */
      background: #000;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;

      /* Center preview frame */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }

    /* Fixed-size preview frame (test HTML only) */
    .plugin-frame {
      width: 620px;
      height: 360px;
      border: 2px solid #444;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
      background: #F5E6D3;
    }

    .container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Title - moved UP by 8px */
    .title {
      position: absolute;
      top: 0px;  /* Was 8px in v1, now 0px (moved up by 8px) */
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #3C2F2F;
      text-align: center;
    }

    /* Top row controls */
    .control-group {
      position: absolute;
    }

    .knob-container {
      position: absolute;
      text-align: center;
    }

    .knob-label {
      font-size: 11px;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
      color: #3C2F2F;
    }

    .knob {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #D4C4A8, #8B7355);
      position: relative;
      cursor: pointer;
      box-shadow:
        inset -2px -2px 4px rgba(0,0,0,0.3),
        inset 2px 2px 4px rgba(255,255,255,0.4),
        0 2px 6px rgba(0,0,0,0.2);
      transform-origin: center center;
      transition: transform 50ms;
    }

    .knob::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 12px;
      background: #3C2F2F;
      border-radius: 1px;
    }

    .knob-value {
      font-size: 9px;
      margin-top: 2px;
      color: #6B8E4E;
    }

    /* Toggle button */
    .toggle-container {
      position: absolute;
      text-align: center;
    }

    .toggle-button {
      width: 70px;
      height: 40px;
      border: 2px solid #8B7355;
      background: #E5D5C3;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #3C2F2F;
      transition: background 100ms;
    }

    .toggle-button.active {
      background: #6B8E4E;
      color: #F5E6D3;
    }

    /* LED Meters */
    .led-meter {
      position: absolute;
      background: rgba(139, 115, 85, 0.2);
      border: 1px solid #8B7355;
      border-radius: 2px;
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      padding: 3px;
    }

    .led-segment {
      width: 100%;
      height: 15px;
      background: rgba(139, 115, 85, 0.3);
      border-radius: 1px;
      transition: background 50ms;
    }

    .led-segment.active-low {
      background: #8BA870;
      box-shadow: 0 0 4px #8BA870;
    }

    .led-segment.active-mid {
      background: #6B8E4E;
      box-shadow: 0 0 4px #6B8E4E;
    }

    .led-segment.active-high {
      background: #C9A27B;
      box-shadow: 0 0 4px #C9A27B;
    }

    /* Visualization panels */
    .viz-panel {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid #8B7355;
      border-radius: 4px;
      overflow: hidden;
    }

    /* Transfer curve panel with shell background */
    #transferCurve {
      background-image: url('shell.png');
      background-size: cover;
      background-position: center;
      background-blend-mode: multiply;
      opacity: 1;
      position: relative;
    }

    #transferCurve::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(245, 230, 211, 0.5);  /* 50% opacity overlay */
      pointer-events: none;
    }

    .viz-title {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: #3C2F2F;
      font-weight: bold;
    }

    .curve-canvas {
      position: absolute;
      top: 30px;
      left: 10px;
      right: 10px;
      bottom: 10px;
    }

    /* Debug monitor (test HTML only) */
    .debug-monitor {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 4px;
      min-width: 150px;
      pointer-events: none;
      z-index: 10000;
    }

    .debug-label {
      color: #666;
      font-size: 9px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .debug-param {
      font-weight: bold;
      color: #0f0;
    }

    .debug-value {
      color: #fff;
      margin-top: 2px;
    }

    .debug-normalized {
      color: #888;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="plugin-frame">
    <div class="container">
      <!-- Title (moved up 8px) -->
      <div class="title">OUARICONCOMP</div>

      <!-- Top Row Controls -->
      <!-- Threshold -->
      <div class="knob-container" style="left: 30px; top: 8px;">
        <div class="knob-label">Threshold</div>
        <div class="knob" id="threshold" data-min="-60" data-max="0" data-default="-20"></div>
        <div class="knob-value" id="threshold-value">-20 dB</div>
      </div>

      <!-- Ratio -->
      <div class="knob-container" style="left: 110px; top: 8px;">
        <div class="knob-label">Ratio</div>
        <div class="knob" id="ratio" data-min="1" data-max="20" data-default="4"></div>
        <div class="knob-value" id="ratio-value">4:1</div>
      </div>

      <!-- Attack -->
      <div class="knob-container" style="left: 190px; top: 8px;">
        <div class="knob-label">Attack</div>
        <div class="knob" id="attack_time" data-min="0.1" data-max="100" data-default="10"></div>
        <div class="knob-value" id="attack_time-value">10 ms</div>
      </div>

      <!-- Release -->
      <div class="knob-container" style="left: 270px; top: 8px;">
        <div class="knob-label">Release</div>
        <div class="knob" id="release_time" data-min="10" data-max="1000" data-default="100"></div>
        <div class="knob-value" id="release_time-value">100 ms</div>
      </div>

      <!-- Knee -->
      <div class="knob-container" style="left: 350px; top: 8px;">
        <div class="knob-label">Knee</div>
        <div class="knob" id="knee" data-min="0" data-max="20" data-default="6"></div>
        <div class="knob-value" id="knee-value">6 dB</div>
      </div>

      <!-- Output -->
      <div class="knob-container" style="left: 430px; top: 8px;">
        <div class="knob-label">Output</div>
        <div class="knob" id="output_gain" data-min="-12" data-max="24" data-default="0"></div>
        <div class="knob-value" id="output_gain-value">0 dB</div>
      </div>

      <!-- Auto-Gain Toggle -->
      <div class="toggle-container" style="left: 520px; top: 8px;">
        <div class="knob-label">Auto-Gain</div>
        <div class="toggle-button" id="auto_gain">OFF</div>
      </div>

      <!-- Bottom Row: Input Meter, Transfer Curve, Envelope Display, Output Meter -->

      <!-- Input Meter (left side) -->
      <div class="led-meter" id="inputMeter" style="left: 18px; top: 105px; width: 18px; height: 240px;">
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
      </div>

      <!-- Transfer Curve Panel (with shell background) -->
      <div class="viz-panel" id="transferCurve" style="left: 46px; top: 105px; width: 210px; height: 240px;">
        <div class="viz-title">TRANSFER CURVE</div>
        <canvas class="curve-canvas" id="curveCanvas" width="190" height="200"></canvas>
      </div>

      <!-- Dual Envelope Display -->
      <div class="viz-panel" style="left: 266px; top: 105px; width: 308px; height: 240px;">
        <div class="viz-title">ENVELOPE DISPLAY</div>
        <canvas class="curve-canvas" id="envelopeCanvas" width="288" height="200"></canvas>
      </div>

      <!-- Output Meter (right side) -->
      <div class="led-meter" id="outputMeter" style="left: 584px; top: 105px; width: 18px; height: 240px;">
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
        <div class="led-segment"></div>
      </div>
    </div>
  </div>

  <!-- Debug Monitor -->
  <div class="debug-monitor">
    <div class="debug-label">PARAMETER MONITOR</div>
    <div class="debug-param" id="debugParam">—</div>
    <div class="debug-value" id="debugValue">—</div>
    <div class="debug-normalized" id="debugNormalized">—</div>
  </div>

  <script>
    // Mock JUCE backend for browser testing
    window.Juce = {
      getSliderState: (id) => ({
        normalisedValue: 0.5,
        getNormalisedValue: () => 0.5,
        setNormalisedValue: (v) => console.log(`${id} set to ${v}`),
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      }),
      getToggleState: (id) => ({
        value: false,
        getValue: () => false,
        setValue: (v) => console.log(`${id} set to ${v}`),
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      })
    };

    // Disable context menu (REQUIRED)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // Disable drag behaviors
    document.addEventListener("dragstart", (e) => {
      e.preventDefault();
    });

    // Debug monitor update
    function updateDebugMonitor(paramId, value, normalizedValue) {
      document.getElementById('debugParam').textContent = paramId;
      document.getElementById('debugValue').textContent = value;
      document.getElementById('debugNormalized').textContent = `${(normalizedValue * 100).toFixed(1)}%`;
    }

    // Knob interaction
    document.addEventListener("DOMContentLoaded", () => {
      const knobs = document.querySelectorAll('.knob');

      knobs.forEach(knob => {
        const id = knob.id;
        const min = parseFloat(knob.dataset.min);
        const max = parseFloat(knob.dataset.max);
        const defaultVal = parseFloat(knob.dataset.default);

        let currentValue = defaultVal;
        let isDragging = false;
        let startY = 0;
        let startValue = 0;

        function updateKnob(value) {
          currentValue = Math.max(min, Math.min(max, value));
          const normalized = (currentValue - min) / (max - min);
          const degrees = -135 + (normalized * 270);
          knob.style.transform = `rotate(${degrees}deg)`;

          // Update value display
          const valueEl = document.getElementById(`${id}-value`);
          let displayValue = currentValue.toFixed(1);

          if (id === 'ratio') {
            displayValue = `${currentValue.toFixed(1)}:1`;
          } else if (id === 'threshold' || id === 'output_gain' || id === 'knee') {
            displayValue = `${currentValue.toFixed(1)} dB`;
          } else {
            displayValue = `${currentValue.toFixed(1)} ms`;
          }

          valueEl.textContent = displayValue;
          updateDebugMonitor(id, displayValue, normalized);
        }

        knob.addEventListener('mousedown', (e) => {
          isDragging = true;
          startY = e.clientY;
          startValue = currentValue;
          e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;

          const deltaY = startY - e.clientY;
          const range = max - min;
          const sensitivity = range / 200;
          const newValue = startValue + (deltaY * sensitivity);

          updateKnob(newValue);
        });

        document.addEventListener('mouseup', () => {
          isDragging = false;
        });

        // Initialize
        updateKnob(currentValue);
      });

      // Toggle button
      const toggleButton = document.getElementById('auto_gain');
      let toggleState = false;

      toggleButton.addEventListener('click', () => {
        toggleState = !toggleState;
        toggleButton.classList.toggle('active', toggleState);
        toggleButton.textContent = toggleState ? 'ON' : 'OFF';
        updateDebugMonitor('auto_gain', toggleState ? 'ON' : 'OFF', toggleState ? 1 : 0);
      });

      // Draw transfer curve
      const curveCanvas = document.getElementById('curveCanvas');
      const curveCtx = curveCanvas.getContext('2d');

      function drawTransferCurve() {
        const w = curveCanvas.width;
        const h = curveCanvas.height;

        curveCtx.clearRect(0, 0, w, h);

        // Grid
        curveCtx.strokeStyle = 'rgba(60, 47, 47, 0.2)';
        curveCtx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const x = (w / 4) * i;
          const y = (h / 4) * i;
          curveCtx.beginPath();
          curveCtx.moveTo(x, 0);
          curveCtx.lineTo(x, h);
          curveCtx.stroke();
          curveCtx.beginPath();
          curveCtx.moveTo(0, y);
          curveCtx.lineTo(w, y);
          curveCtx.stroke();
        }

        // Unity line
        curveCtx.strokeStyle = 'rgba(60, 47, 47, 0.3)';
        curveCtx.setLineDash([4, 4]);
        curveCtx.beginPath();
        curveCtx.moveTo(0, h);
        curveCtx.lineTo(w, 0);
        curveCtx.stroke();
        curveCtx.setLineDash([]);

        // Compression curve
        curveCtx.strokeStyle = '#6B8E4E';
        curveCtx.lineWidth = 2;
        curveCtx.beginPath();

        const threshold = -20;
        const ratio = 4;
        const knee = 6;

        for (let i = 0; i <= w; i++) {
          const inputDb = -60 + (i / w) * 60;
          let outputDb = inputDb;

          if (inputDb > threshold + knee / 2) {
            outputDb = threshold + (inputDb - threshold) / ratio;
          } else if (inputDb > threshold - knee / 2) {
            const kneeInput = inputDb - (threshold - knee / 2);
            const kneeRange = knee;
            const kneeFactor = (kneeInput / kneeRange);
            const slope = 1 - ((1 - 1/ratio) * kneeFactor);
            outputDb = (threshold - knee / 2) + kneeInput * slope;
          }

          const x = i;
          const y = h - ((outputDb + 60) / 60) * h;

          if (i === 0) {
            curveCtx.moveTo(x, y);
          } else {
            curveCtx.lineTo(x, y);
          }
        }

        curveCtx.stroke();
      }

      drawTransferCurve();

      // Draw envelope display
      const envelopeCanvas = document.getElementById('envelopeCanvas');
      const envCtx = envelopeCanvas.getContext('2d');

      function drawEnvelopeDisplay() {
        const w = envelopeCanvas.width;
        const h = envelopeCanvas.height;

        envCtx.clearRect(0, 0, w, h);

        // Top lane (input waveform)
        const topH = h / 2 - 5;
        envCtx.fillStyle = 'rgba(60, 47, 47, 0.1)';
        envCtx.fillRect(0, 0, w, topH);

        envCtx.strokeStyle = '#6B8E4E';
        envCtx.lineWidth = 1.5;
        envCtx.beginPath();
        for (let i = 0; i < w; i++) {
          const y = topH / 2 + Math.sin(i * 0.1) * (topH / 3);
          if (i === 0) envCtx.moveTo(i, y);
          else envCtx.lineTo(i, y);
        }
        envCtx.stroke();

        // Bottom lane (output waveform with GR)
        const bottomY = h / 2 + 5;
        const bottomH = h / 2 - 5;
        envCtx.fillStyle = 'rgba(60, 47, 47, 0.1)';
        envCtx.fillRect(0, bottomY, w, bottomH);

        envCtx.strokeStyle = '#8B7355';
        envCtx.lineWidth = 1.5;
        envCtx.beginPath();
        for (let i = 0; i < w; i++) {
          const compression = Math.max(0, Math.sin(i * 0.05) * 0.7);
          const y = bottomY + bottomH / 2 + Math.sin(i * 0.1) * (bottomH / 3) * (1 - compression);
          if (i === 0) envCtx.moveTo(i, y);
          else envCtx.lineTo(i, y);
        }
        envCtx.stroke();

        // GR indicator
        envCtx.fillStyle = 'rgba(201, 162, 123, 0.3)';
        envCtx.fillRect(w - 60, bottomY + 5, 50, 15);
        envCtx.fillStyle = '#3C2F2F';
        envCtx.font = '9px Garamond';
        envCtx.fillText('GR: -3.2 dB', w - 55, bottomY + 15);
      }

      drawEnvelopeDisplay();

      // LED meter animation
      function animateMeters() {
        const inputSegments = document.querySelectorAll('#inputMeter .led-segment');
        const outputSegments = document.querySelectorAll('#outputMeter .led-segment');

        setInterval(() => {
          const inputLevel = Math.random() * 14;
          const outputLevel = Math.random() * 12;

          inputSegments.forEach((seg, i) => {
            seg.classList.remove('active-low', 'active-mid', 'active-high');
            if (i < inputLevel) {
              if (i < 8) seg.classList.add('active-low');
              else if (i < 11) seg.classList.add('active-mid');
              else seg.classList.add('active-high');
            }
          });

          outputSegments.forEach((seg, i) => {
            seg.classList.remove('active-low', 'active-mid', 'active-high');
            if (i < outputLevel) {
              if (i < 8) seg.classList.add('active-low');
              else if (i < 11) seg.classList.add('active-mid');
              else seg.classList.add('active-high');
            }
          });
        }, 100);
      }

      animateMeters();
    });
  </script>
</body>
</html>

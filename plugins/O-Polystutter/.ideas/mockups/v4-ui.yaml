    data_source: "lane1_playback_position"
    position: { x: 20, y: 100 }
    size: { width: 210, height: 6 }

  # Row 1 (y: 115)
  - id: lane1_subdivision
    type: combo
    label: "SUBDIV"
    parameter: "lane1_subdivision"
    choices: ["1/4", "1/8", "1/16", "1/32", "1/8T", "1/16T"]
    default: 2  # 1/16
    position: { x: 30, y: 115 }
    size: { width: 42, height: 42, diameter: 42 }

  - id: lane1_repeats
    type: knob
    label: "REPS"
    parameter: "lane1_repeats"
    range: [1, 16]
    default: 4
    decimals: 0

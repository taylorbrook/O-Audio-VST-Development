notes:
  - v4 CRITICAL SPACING FIXES
  - Knobs reduced from 50px to 42px diameter
  - Lane grid spacing reduced to 6px between columns
  - Row spacing reduced to 8-10px vertical
  - Pattern sequencer: step buttons 22px height, 3px gap
  - All 4 pattern rows fit within 130px section height
  - Tape section: 15px clear gap above, all 6 knobs visible
  - Footer: 15px gap above, compact 30px tall toggles
  - Total calculated height: 60 + 320 + 130 + 130 + 50 + 60 = 750px
  - ALL sections have explicit heights with overflow: hidden
  - NO overlaps, NO content cut off

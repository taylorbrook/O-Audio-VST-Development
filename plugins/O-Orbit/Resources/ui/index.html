<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O-Orbit</title>
    <link rel="stylesheet" href="css/styles.css">

    <!-- JUCE Bridge: native interop setup (must load first as regular script) -->
    <script src="js/juce/check_native_interop.js"></script>

    <!-- App JS (ES module - imports from JUCE bridge index.js AND js/i18n.js) -->
    <script type="module" src="js/app.js"></script>
</head>
<!--
  v1.2.0 — INTERFACE COPY LIVES IN js/i18n.js, NOT HERE.

  Two attribute families do the work, and they mean different things:

    data-i18n / data-i18n-aria / data-i18n-placeholder
        A KEY into LABELS (falling back to I18N). The English left in the
        markup beside it is the FALLBACK that renders if applyI18n never runs —
        it is not the source of truth, and check-i18n assertion 15 fails any key
        that does not resolve.

    data-tip / data-tip-title
        NOT AUTHORED HERE AT ALL any more. applyI18n() writes both at runtime
        from TIP_BINDINGS, in whichever language is selected. check-i18n
        assertion 3 fails this file if a single one comes back.

  data-tip-always survives: it is a FLAG, not copy. It bypasses the enabled
  gate so the controls that reach and restore the help layer are never the
  controls unable to explain themselves.

  data-param on the eighteen .param-container cells is new in v1.2.0 and is a
  TIP ANCHOR, not a parameter binding — app.js still binds by element id. Its
  value is exactly the string the cell's own <label for> carries.
-->
<body>
    <!-- Header -->
    <header id="header">
        <h1>O-Orbit</h1>

        <!-- Preset band (v1.1.0) — element IDs are exactly the ones
             preset-manager.js binds. #preset-name stays childless
             (_updateDisplay writes textContent); the caret is a SIBLING inside
             the trigger, never a child of the readout
             (pattern_js_state_updater_overwrites_html_labels). Ships disabled;
             un-disabled only after PresetManager.initialize() resolves.

             #preset-name is NOT a [data-i18n] element and must never become
             one: preset-manager.js owns that node, the name it writes IS the
             JSON filename (D-02), and a sweep writing it would fight the
             module over one text node. It is I18N_EXEMPT with that reason. -->
        <div id="preset-band">
            <button type="button" class="preset-nav" id="preset-prev" data-i18n-aria="preset-prev" aria-label="Previous preset" disabled>&#9664;</button>
            <button type="button" class="preset-nav" id="preset-next" data-i18n-aria="preset-next" aria-label="Next preset" disabled>&#9654;</button>
            <div id="preset-select-wrap">
                <button type="button" id="preset-select"
                        aria-haspopup="listbox" aria-expanded="false"
                        data-i18n-aria="aria.browsePresets" aria-label="Browse presets" disabled>
                    <span id="preset-name" aria-live="polite">Default</span>
                    <span id="preset-caret" aria-hidden="true">&#9662;</span>
                </button>
                <div id="preset-menu" role="listbox" data-i18n-aria="aria.presets" aria-label="Presets"></div>
            </div>
            <button type="button" class="preset-btn-hdr" id="preset-save" data-i18n="label.save" disabled>Save</button>
            <button type="button" class="preset-btn-hdr" id="preset-load" data-i18n="label.load" disabled>Load</button>
            <!-- The armed face is `ui.confirm` through setLabel(), not a
                 data-confirm ATTRIBUTE as it was through v1.1.1: an attribute
                 holds ONE string, so a language switch while the button was
                 armed would restore the ENGLISH armed face. data-label is gone
                 for the same reason — label.delete is the disarmed key. -->
            <button type="button" class="preset-btn-hdr" id="preset-delete"
                    data-armed="0" data-i18n="label.delete" disabled>Del</button>
        </div>

        <div id="header-right">
            <!-- v1.2.0 — the settings gear. It replaces the v1.1.0 "?" in the
                 SAME header slot and inherits the 20px sage circle that toggle
                 wore, so the header silhouette is unchanged; only the glyph
                 differs. The "?" toggle MOVED inside the panel beside the
                 language selector — it is not duplicated. One place for the two
                 things that decide what the hover help says and whether it says
                 it.

                 data-tip-always on the gear and on both controls inside: this
                 plugin's help layer ships OFF, so without it the three controls
                 that reach and restore the layer would be the three controls
                 unable to explain themselves. -->
            <div id="settings-cluster">
                <button type="button"
                        class="gear-btn"
                        id="gear-btn"
                        aria-haspopup="dialog"
                        aria-expanded="false"
                        data-i18n-aria="aria.settings"
                        aria-label="Settings"
                        data-tip-always>&#9881;</button>

                <div class="settings-popover" id="settings-popover"
                     role="dialog" data-i18n-aria="aria.settings" aria-label="Settings" hidden>

                    <label class="settings-row" for="lang-select">
                        <span class="settings-label" data-i18n="lang-select">Language</span>
                        <!-- ENDONYMS. Never localized: a French speaker looking
                             for their language looks for "Fran&ccedil;ais". -->
                        <select class="settings-select" id="lang-select"
                                data-i18n-aria="aria.langSelect"
                                aria-label="Interface language" data-tip-always>
                            <option value="en">English</option>
                            <option value="fr">Fran&ccedil;ais</option>
                        </select>
                    </label>

                    <!-- The v1.1.0 toggle, moved. Its caption IS written from
                         script now — through setLabel(), so the element becomes
                         a [data-i18n] element and the language sweep owns it.
                         Two calls behind an if/else, never a ternary in the
                         argument (check-i18n assertion 13).

                         A <div>, not a <label for="help-toggle">: a button is a
                         labelable element, so a label wrapping one re-dispatches
                         the click and toggles twice. -->
                    <div class="settings-row">
                        <span class="settings-label" data-i18n="help-toggle">Hover help</span>
                        <button type="button" class="settings-toggle" id="help-toggle"
                                aria-pressed="false"
                                data-i18n-aria="aria.helpToggle"
                                aria-label="Toggle hover help"
                                data-i18n="ui.off" data-tip-always>Off</button>
                    </div>
                </div>
            </div>

            <!-- Both faces are keys; app.js swaps them with setLabel(). -->
            <div id="view-toggle" data-i18n="label.viewMotion">Motion View</div>
        </div>
    </header>

    <!-- Visualizer / Speaker Editor Area -->
    <section id="visualizer-container">
        <canvas id="visualizer-canvas"></canvas>

        <!-- Speaker Editor Toolbar (hidden by default) -->
        <div id="editor-toolbar">
            <div id="preset-buttons">
                <button class="preset-btn" data-preset="0" data-i18n="label.fmtStereo">Stereo</button>
                <button class="preset-btn" data-preset="1" data-i18n="label.fmtQuad">Quad</button>
                <!-- 5.1 through 7.1.4 carry no key: a channel-count
                     designation is digits and dots and reads identically in
                     both languages. -->
                <button class="preset-btn" data-preset="2">5.1</button>
                <button class="preset-btn" data-preset="3">7.1</button>
                <button class="preset-btn" data-preset="4">5.1.4</button>
                <button class="preset-btn" data-preset="5">7.1.4</button>
                <button class="preset-btn" data-preset="6" data-i18n="label.fmtHex">Hex</button>
                <button class="preset-btn" data-preset="7" data-i18n="label.fmtOct">Oct</button>
            </div>
            <!-- Named layout library (D2, v1.1.0) + file I/O -->
            <div id="layout-library">
                <select id="layout-select">
                    <!-- The HTML-authored placeholder refreshLayoutList()
                         preserves (it removes from index 1). Its key survives
                         every refresh because the element itself does. -->
                    <option value="" data-i18n="label.layoutsPlaceholder">Layouts&#8230;</option>
                </select>
                <input type="text" id="layout-name" maxlength="40"
                       data-i18n-placeholder="placeholder.layoutName" placeholder="name&#8230;" />
                <button id="layout-save-btn" data-i18n="label.save">Save</button>
                <button id="layout-delete-btn" data-armed="0" data-i18n="label.delete">Del</button>
            </div>
            <div id="file-buttons">
                <button id="export-btn" data-i18n="label.export">Export</button>
                <button id="import-btn" data-i18n="label.import">Import</button>
            </div>
        </div>
    </section>

    <!-- Parameter Controls -->
    <section id="controls-container">
        <!-- Motion Group -->
        <div class="param-group" id="motion-group">
            <h2 class="group-label" data-i18n="label.groupMotion">Motion</h2>
            <div class="param-grid">
                <!-- Path (dropdown) -->
                <div class="param-container" data-param="path">
                    <label for="path" data-i18n="label.path">Path</label>
                    <select id="path" class="param-dropdown">
                        <option value="0" data-i18n="label.pathOrbit">Orbit</option>
                        <option value="1" data-i18n="label.pathPendulum">Pendulum</option>
                        <option value="2" data-i18n="label.linear">Linear</option>
                        <option value="3" data-i18n="label.pathDrift">Drift</option>
                        <option value="4" data-i18n="label.pathPingPong">Ping-Pong</option>
                    </select>
                </div>

                <!-- Speed (knob) -->
                <div class="param-container" data-param="speed">
                    <label for="speed" data-i18n="label.speed">Speed</label>
                    <div class="knob-container">
                        <div class="knob" id="speed" data-min="0.01" data-max="20" data-default="1.0" data-unit="Hz"></div>
                    </div>
                    <div class="value-display" id="speed-value">1.0 Hz</div>
                </div>

                <!-- Width (knob) -->
                <div class="param-container" data-param="width">
                    <label for="width" data-i18n="label.width">Width</label>
                    <div class="knob-container">
                        <div class="knob" id="width" data-min="0" data-max="360" data-default="180" data-unit="°"></div>
                    </div>
                    <div class="value-display" id="width-value">180°</div>
                </div>

                <!-- Depth (knob) -->
                <div class="param-container" data-param="depth">
                    <label for="depth" data-i18n="label.depth">Depth</label>
                    <div class="knob-container">
                        <div class="knob" id="depth" data-min="0" data-max="100" data-default="0" data-unit="%"></div>
                    </div>
                    <div class="value-display" id="depth-value">0%</div>
                </div>

                <!-- Tilt (knob) -->
                <div class="param-container" data-param="tilt">
                    <label for="tilt" data-i18n="label.tilt">Tilt</label>
                    <div class="knob-container">
                        <div class="knob" id="tilt" data-min="-90" data-max="90" data-default="0" data-unit="°"></div>
                    </div>
                    <div class="value-display" id="tilt-value">0°</div>
                </div>

                <!-- Phase (knob) -->
                <div class="param-container" data-param="phase">
                    <label for="phase" data-i18n="label.phase">Phase</label>
                    <div class="knob-container">
                        <div class="knob" id="phase" data-min="0" data-max="360" data-default="0" data-unit="°"></div>
                    </div>
                    <div class="value-display" id="phase-value">0°</div>
                </div>

                <!-- Elevation Enable (toggle) -->
                <div class="param-container" data-param="elevation_enable">
                    <label for="elevation_enable" data-i18n="label.elevation">Elevation</label>
                    <div class="toggle-container">
                        <input type="checkbox" id="elevation_enable" class="param-toggle">
                        <!-- Both faces are keys; bindToggle() swaps them with
                             setLabel(). The authored "Off" is the fallback. -->
                        <label for="elevation_enable" class="toggle-label" data-i18n="ui.off">Off</label>
                    </div>
                </div>

                <!-- Elevation Range (knob) -->
                <div class="param-container" data-param="elevation_range">
                    <label for="elevation_range" data-i18n="label.elevRange">Elev Range</label>
                    <div class="knob-container">
                        <div class="knob" id="elevation_range" data-min="0" data-max="90" data-default="45" data-unit="°"></div>
                    </div>
                    <div class="value-display" id="elevation_range-value">45°</div>
                </div>

                <!-- Tempo Sync (dropdown) -->
                <div class="param-container" data-param="tempo_sync">
                    <label for="tempo_sync" data-i18n="label.tempoSync">Tempo Sync</label>
                    <select id="tempo_sync" class="param-dropdown">
                        <option value="0" data-i18n="label.syncOff">Off</option>
                        <!-- The eleven note-value options are digits, slashes
                             and the T/D suffixes that mean triplet and dotted
                             in both languages' notation. No keys. -->
                        <option value="1">1/16T</option>
                        <option value="2">1/16</option>
                        <option value="3">1/16D</option>
                        <option value="4">1/8T</option>
                        <option value="5">1/8</option>
                        <option value="6">1/8D</option>
                        <option value="7">1/4T</option>
                        <option value="8">1/4</option>
                        <option value="9">1/4D</option>
                        <option value="10">1/2</option>
                        <option value="11">1/2D</option>
                        <option value="12" data-i18n="label.bar1">1 Bar</option>
                        <option value="13" data-i18n="label.bars2">2 Bars</option>
                        <option value="14" data-i18n="label.bars4">4 Bars</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Spatial Group -->
        <div class="param-group" id="spatial-group">
            <h2 class="group-label" data-i18n="label.groupSpatial">Spatial</h2>
            <div class="param-grid">
                <!-- Speaker Layout (dropdown) -->
                <div class="param-container" data-param="speaker_layout">
                    <label for="speaker_layout" data-i18n="label.speakerLayout">Speaker Layout</label>
                    <select id="speaker_layout" class="param-dropdown">
                        <option value="0" data-i18n="label.fmtStereo">Stereo</option>
                        <option value="1" data-i18n="label.fmtQuad">Quad</option>
                        <option value="2">5.1</option>
                        <option value="3">7.1</option>
                        <option value="4">5.1.4</option>
                        <option value="5">7.1.4</option>
                        <option value="6" data-i18n="label.hexaphonic">Hexaphonic</option>
                        <option value="7" data-i18n="label.octaphonic">Octaphonic</option>
                    </select>
                    <!-- Written by setLabel(el, 'ui.downmix', {from, to}) — the
                         counts ride the element as data-i18n-vars, so the
                         language sweep re-renders the badge with the SAME
                         counts rather than a stale English face. -->
                    <div id="downmix-badge"></div>
                </div>

                <!-- Distance (knob) -->
                <div class="param-container" data-param="distance">
                    <label for="distance" data-i18n="label.distance">Distance</label>
                    <div class="knob-container">
                        <div class="knob" id="distance" data-min="0.1" data-max="30" data-default="1.0" data-unit="m"></div>
                    </div>
                    <div class="value-display" id="distance-value">1.0 m</div>
                </div>

                <!-- Air Absorption (knob) -->
                <div class="param-container" data-param="air_absorption">
                    <label for="air_absorption" data-i18n="label.airAbsorption">Air Absorption</label>
                    <div class="knob-container">
                        <div class="knob" id="air_absorption" data-min="0" data-max="100" data-default="50" data-unit="%"></div>
                    </div>
                    <div class="value-display" id="air_absorption-value">50%</div>
                </div>

                <!-- Attenuation Curve (dropdown) -->
                <div class="param-container" data-param="attenuation_curve">
                    <label for="attenuation_curve" data-i18n="label.attenCurve">Atten Curve</label>
                    <select id="attenuation_curve" class="param-dropdown">
                        <option value="0" data-i18n="label.linear">Linear</option>
                        <option value="1" data-i18n="label.inverse">Inverse</option>
                        <option value="2" data-i18n="label.inverseSquare">Inverse Square</option>
                    </select>
                </div>

                <!-- Center Diverge (knob) -->
                <div class="param-container" data-param="center_diverge">
                    <label for="center_diverge" data-i18n="label.centerDiverge">Center Diverge</label>
                    <div class="knob-container">
                        <div class="knob" id="center_diverge" data-min="0" data-max="100" data-default="0" data-unit="%"></div>
                    </div>
                    <div class="value-display" id="center_diverge-value">0%</div>
                </div>
            </div>
        </div>

        <!-- Source/Mix Group -->
        <div class="param-group" id="source-group">
            <h2 class="group-label" data-i18n="label.groupSourceMix">Source / Mix</h2>
            <div class="param-grid">
                <!-- Source Mode (dropdown) -->
                <div class="param-container" data-param="source_mode">
                    <label for="source_mode" data-i18n="label.sourceMode">Source Mode</label>
                    <select id="source_mode" class="param-dropdown">
                        <option value="0" data-i18n="label.mono">Mono</option>
                        <option value="1" data-i18n="label.lrSplit">L+R Split</option>
                    </select>
                </div>

                <!-- L/R Offset (knob) -->
                <div class="param-container" data-param="lr_offset">
                    <label for="lr_offset" data-i18n="label.lrOffset">L/R Offset</label>
                    <div class="knob-container">
                        <div class="knob" id="lr_offset" data-min="0" data-max="360" data-default="180" data-unit="°"></div>
                    </div>
                    <div class="value-display" id="lr_offset-value">180°</div>
                </div>

                <!-- Mix (knob) -->
                <div class="param-container" data-param="mix">
                    <label for="mix" data-i18n="label.mix">Mix</label>
                    <div class="knob-container">
                        <div class="knob" id="mix" data-min="0" data-max="100" data-default="100" data-unit="%"></div>
                    </div>
                    <div class="value-display" id="mix-value">100%</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer id="footer">
        <span>Ouaricon Audio</span>
    </footer>

    <!-- Botanical Shell Overlay -->
    <img src="img/shell.png" id="botanical-overlay" alt="">

    <!-- The one shared tooltip surface (v1.1.0) — a sibling of everything,
         position:fixed, so no container's overflow can clip it. -->
    <div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouaricon Saturation Modeling</title>

  <style>
    /* ===== CRITICAL WEBVIEW CONSTRAINTS ===== */
    html, body {
      height: 100%;  /* REQUIRED - replaces viewport units */
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* Native application feel */
    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
      font-family: 'Garamond', 'Times New Roman', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* ===== PLUGIN CONTAINER ===== */
    .container {
      width: 100%;
      height: 100%;
      position: relative;

      /* Paper texture background */
      background-image: url('img/paper1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ===== DECORATIVE BORDERS ===== */
    .border {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid #8B7355;
      pointer-events: none;
      z-index: 100;
    }

    .divider {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 1px;
      background: rgba(139, 115, 85, 0.4);
      pointer-events: none;
      z-index: 10;
    }

    .divider.top { top: 47px; }
    .divider.middle { top: 115px; }
    .divider.bottom { top: 360px; }

    /* ===== TITLE ===== */
    .title {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: normal;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 3px;
      z-index: 20;
    }

    /* ===== MODEL BUTTONS (centered row) ===== */
    .model-buttons {
      position: absolute;
      top: 70px;
      left: 70px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .model-button {
      width: 110px;
      height: 30px;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 5px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .model-button:last-child {
      width: 100px;
    }

    .model-button:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .model-button.active {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
      font-weight: bold;
    }

    /* ===== INTENSITY KNOB (Enhanced 3D texture, positioned LEFT) ===== */
    .knob-container {
      position: absolute;
      left: 175px;
      top: 180px;
      width: 90px;
      height: 90px;
      z-index: 40;
    }

    .knob {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      cursor: ns-resize;

      /* ENHANCED 3D TEXTURE */
      background: radial-gradient(circle at 35% 35%, #F5DEB3, #E8D5B7 50%, #D8C5A7 100%);
      border: 2px solid #8B7355;

      /* Multiple layered inset shadows for depth */
      box-shadow:
        inset 0 -3px 6px rgba(0,0,0,0.3),
        inset 0 3px 6px rgba(255,255,255,0.2),
        inset -2px -2px 4px rgba(0,0,0,0.2),
        inset 2px 2px 4px rgba(255,255,255,0.15),
        /* Pronounced drop shadow for lift */
        0 4px 8px rgba(0,0,0,0.4);

      transform-origin: center center;
      transition: transform 0.05s ease-out;
    }

    /* Cross-hatch texture overlay */
    .knob::before {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background:
        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px),
        repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
      opacity: 0.15;
      pointer-events: none;
    }

    /* Bevel highlight */
    .knob::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      right: 40%;
      bottom: 40%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent 60%);
      pointer-events: none;
    }

    /* Knob segments (10 radial sections) */
    .knob-segments {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        conic-gradient(
          #F5DEB3 0deg 36deg,
          #8B7355 36deg 38deg,
          #E8D5B7 38deg 72deg,
          #8B7355 72deg 74deg,
          #F5DEB3 74deg 108deg,
          #8B7355 108deg 110deg,
          #E8D5B7 110deg 144deg,
          #8B7355 144deg 146deg,
          #F5DEB3 146deg 180deg,
          #8B7355 180deg 182deg,
          #E8D5B7 182deg 216deg,
          #8B7355 216deg 218deg,
          #F5DEB3 218deg 252deg,
          #8B7355 252deg 254deg,
          #E8D5B7 254deg 288deg,
          #8B7355 288deg 290deg,
          #F5DEB3 290deg 324deg,
          #8B7355 324deg 326deg,
          #E8D5B7 326deg 360deg
        );
      pointer-events: none;
    }

    /* V4 REFINEMENT: Indicator dot at EDGE (~92% radius) */
    .knob-indicator {
      position: absolute;
      top: 4px;  /* V4: Moved from 12px to 4px (closer to edge) */
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #3C2F2F;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    /* INTENSITY LABEL CENTERED BENEATH KNOB */
    .knob-label {
      position: absolute;
      left: 175px;
      top: 280px;
      width: 90px;
      font-size: 11px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }

    /* ===== VU METERS (TOP-ORIENTED scales) ===== */
    /* V4 REFINEMENT: GREEN COLOR SCHEME */
    .vu-meter {
      position: absolute;
      width: 90px;
      height: 90px;
      z-index: 30;
    }

    .vu-meter.input { left: 55px; top: 170px; }
    .vu-meter.output { left: 455px; top: 170px; }

    .vu-face {
      width: 100%;
      height: 100%;
      background: rgba(139, 168, 112, 0.3);  /* V4: Light green */
      border: 2px solid #3C5C1A;  /* V4: Dark green border */
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }

    /* Scale labels along TOP arc */
    .vu-scale {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 20px;
      display: flex;
      justify-content: space-between;
      padding: 0 8px;
      font-size: 7px;
      color: #3C2F2F;
      font-family: 'Garamond', serif;
      pointer-events: none;
    }

    .vu-scale span {
      display: inline-block;
      text-align: center;
    }

    /* V4: Needle sweeps upward from bottom (GREEN color) */
    .vu-needle {
      position: absolute;
      bottom: 15px;
      left: 50%;
      width: 2px;
      height: 40px;
      background: linear-gradient(180deg, #d4a574 0%, #c49564 100%);
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-45deg);
      transition: transform 0.1s ease-out;
      pointer-events: none;
      z-index: 5;
    }

    .vu-needle::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      background: #3C5C1A;  /* V4: Dark green pivot */
      border-radius: 50%;
    }

    .vu-label {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      color: #3C2F2F;
      font-weight: bold;
      pointer-events: none;
    }

    /* V4 REFINEMENT: SNAKE MOVED LEFT (x: 285px, center at ~375px) */
    .snake-overlay {
      position: absolute;
      left: 285px;  /* V4: Moved LEFT from 350px to 285px */
      top: 135px;
      width: 180px;  /* V4: Reduced from 235px to 180px */
      height: 180px;
      opacity: 0.3;
      mix-blend-mode: multiply;
      filter: sepia(0.2);
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.3s ease;
      object-fit: contain;
    }

    /* ===== QUALITY SECTION ===== */
    .quality-label {
      position: absolute;
      left: 162px;
      top: 375px;
      font-size: 9px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 20;
    }

    .quality-buttons {
      position: absolute;
      left: 50px;
      top: 395px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .quality-button {
      width: 75px;
      height: 28px;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 4px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quality-button:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .quality-button.active {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
      font-weight: bold;
    }

    /* ===== AUTOGAIN TOGGLE ===== */
    .autogain-toggle {
      position: absolute;
      left: 450px;
      top: 395px;
      width: 100px;
      height: 28px;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 4px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 30;
    }

    .autogain-toggle:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .autogain-toggle.active {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
      font-weight: bold;
    }

    .autogain-toggle::after {
      content: '❦';
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Decorative elements -->
    <div class="border"></div>
    <div class="divider top"></div>
    <div class="divider middle"></div>
    <div class="divider bottom"></div>

    <!-- Title -->
    <div class="title">OUARICON SATURATION</div>

    <!-- Model selection buttons -->
    <div class="model-buttons">
      <button class="model-button active" data-model="0">MAGNETIC</button>
      <button class="model-button" data-model="1">TUBE</button>
      <button class="model-button" data-model="2">TRANSFORMER</button>
      <button class="model-button" data-model="3">DIODE</button>
    </div>

    <!-- Input VU Meter (V4: GREEN color scheme) -->
    <div class="vu-meter input">
      <div class="vu-face">
        <div class="vu-scale">
          <span>-20</span>
          <span>-10</span>
          <span>-7</span>
          <span>-5</span>
          <span>-3</span>
          <span>0</span>
          <span>+3</span>
        </div>
        <div class="vu-needle" id="inputNeedle"></div>
        <div class="vu-label">IN</div>
      </div>
    </div>

    <!-- Intensity knob (V4: Indicator at EDGE) -->
    <div class="knob-container">
      <div class="knob" id="intensityKnob">
        <div class="knob-segments"></div>
        <div class="knob-indicator"></div>
      </div>
    </div>

    <!-- INTENSITY LABEL CENTERED -->
    <div class="knob-label">INTENSITY</div>

    <!-- V4: SNAKE MOVED LEFT (x:285, center at ~375px) -->
    <img
      src="img/snake_mobot31753000317195_0068.png"
      class="snake-overlay"
      id="snakeImage"
      alt="Snake illustration"
    />

    <!-- Output VU Meter (V4: GREEN color scheme) -->
    <div class="vu-meter output">
      <div class="vu-face">
        <div class="vu-scale">
          <span>-20</span>
          <span>-10</span>
          <span>-7</span>
          <span>-5</span>
          <span>-3</span>
          <span>0</span>
          <span>+3</span>
        </div>
        <div class="vu-needle" id="outputNeedle"></div>
        <div class="vu-label">OUT</div>
      </div>
    </div>

    <!-- Quality section -->
    <div class="quality-label">QUALITY</div>
    <div class="quality-buttons">
      <button class="quality-button" data-quality="0">LOW</button>
      <button class="quality-button active" data-quality="1">MID</button>
      <button class="quality-button" data-quality="2">HIGH</button>
    </div>

    <!-- Autogain toggle -->
    <button class="autogain-toggle" id="autogainToggle">AUTOGAIN</button>
  </div>

  <!-- JUCE WebView Bridge (Pattern 21: type="module" required) -->
  <script type="module">
    import { getSliderState, getToggleState } from './js/juce/index.js';

    // Disable context menu (REQUIRED)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // ===== PARAMETER BINDING =====
    // Pattern 12: WebSliderParameterAttachment requires 3 params (parameter, relay, nullptr)
    // Pattern 15: valueChangedEvent callback has NO parameters - call getNormalisedValue() inside

    // INTENSITY parameter (float 0-100%)
    const intensityState = getSliderState("INTENSITY");
    const intensityKnob = document.getElementById('intensityKnob');
    const snakeImage = document.getElementById('snakeImage');

    // MODEL parameter (choice 0-3)
    const modelState = getSliderState("MODEL");
    const modelButtons = document.querySelectorAll('.model-button');

    // QUALITY parameter (choice 0-2)
    const qualityState = getSliderState("QUALITY");
    const qualityButtons = document.querySelectorAll('.quality-button');

    // AUTOGAIN parameter (bool)
    const autogainState = getToggleState("AUTOGAIN");
    const autogainToggle = document.getElementById('autogainToggle');

    // Snake images mapping
    const snakeImages = {
      0: 'img/snake_mobot31753000317195_0068.png', // MAGNETIC
      1: 'img/snake_mobot31753000317195_0070.png', // TUBE
      2: 'img/snake_NA_0145.png', // TRANSFORMER
      3: 'img/snake_snakesaustralia00kref_0145.png' // DIODE
    };

    // ===== INTENSITY KNOB =====
    // Pattern 16: Relative drag (frame-delta, not absolute positioning)
    let isDragging = false;
    let lastY = 0;

    function updateKnobVisual(normalizedValue) {
      const degrees = -135 + (normalizedValue * 270); // -135° to +135°
      intensityKnob.style.transform = `rotate(${degrees}deg)`;

      // Update snake opacity (0.15 to 0.5)
      const opacity = 0.15 + (normalizedValue * 0.35);
      snakeImage.style.opacity = opacity;
    }

    intensityKnob.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastY = e.clientY;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const deltaY = lastY - e.clientY;  // Frame delta, not start delta
      const currentValue = intensityState.getNormalisedValue();
      const sensitivity = 0.005;
      const newValue = Math.max(0, Math.min(1, currentValue + deltaY * sensitivity));

      intensityState.setNormalisedValue(newValue);
      updateKnobVisual(newValue);

      lastY = e.clientY;  // Update for next frame
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Listen for parameter changes from C++ (automation, preset load)
    intensityState.valueChangedEvent.addListener(() => {
      const value = intensityState.getNormalisedValue();
      updateKnobVisual(value);
    });

    // Initialize knob
    updateKnobVisual(intensityState.getNormalisedValue());

    // ===== MODEL BUTTONS =====
    function updateModelVisual(modelIndex) {
      modelButtons.forEach((btn, idx) => {
        btn.classList.toggle('active', idx === modelIndex);
      });
      snakeImage.src = snakeImages[modelIndex];
    }

    modelButtons.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        const normalizedValue = idx / 3; // 0/3, 1/3, 2/3, 3/3
        modelState.setNormalisedValue(normalizedValue);
        updateModelVisual(idx);
      });
    });

    modelState.valueChangedEvent.addListener(() => {
      const value = modelState.getNormalisedValue();
      const modelIndex = Math.round(value * 3);
      updateModelVisual(modelIndex);
    });

    // Initialize model
    updateModelVisual(Math.round(modelState.getNormalisedValue() * 3));

    // ===== QUALITY BUTTONS =====
    function updateQualityVisual(qualityIndex) {
      qualityButtons.forEach((btn, idx) => {
        btn.classList.toggle('active', idx === qualityIndex);
      });
    }

    qualityButtons.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        const normalizedValue = idx / 2; // 0/2, 1/2, 2/2
        qualityState.setNormalisedValue(normalizedValue);
        updateQualityVisual(idx);
      });
    });

    qualityState.valueChangedEvent.addListener(() => {
      const value = qualityState.getNormalisedValue();
      const qualityIndex = Math.round(value * 2);
      updateQualityVisual(qualityIndex);
    });

    // Initialize quality
    updateQualityVisual(Math.round(qualityState.getNormalisedValue() * 2));

    // ===== AUTOGAIN TOGGLE =====
    // Pattern 19: Use getToggleState for boolean parameters
    function updateAutogainVisual(enabled) {
      autogainToggle.classList.toggle('active', enabled);
    }

    autogainToggle.addEventListener('click', () => {
      const currentValue = autogainState.getValue();
      autogainState.setValue(!currentValue);
      updateAutogainVisual(!currentValue);
    });

    autogainState.valueChangedEvent.addListener(() => {
      const value = autogainState.getValue();
      updateAutogainVisual(value);
    });

    // Initialize autogain
    updateAutogainVisual(autogainState.getValue());

    // ===== VU METERS =====
    // Pattern 20: requestAnimationFrame loop for smooth animation
    const inputNeedle = document.getElementById('inputNeedle');
    const outputNeedle = document.getElementById('outputNeedle');

    let currentInputAngle = -45;
    let targetInputAngle = -45;
    let currentOutputAngle = -45;
    let targetOutputAngle = -45;

    const ATTACK_SPEED = 0.4;
    const DECAY_SPEED = 0.15;

    // Map dB to needle angle (like TapeAge)
    // VU meter scale: -20dB to +3dB (matching visual markings)
    const mapDBToAngle = (dbLevel) => {
      const minDB = -20;
      const maxDB = 3;

      // Clamp dB level to scale range
      const clampedDB = Math.max(minDB, Math.min(maxDB, dbLevel));

      // Normalize to 0-1 range
      const normalized = (clampedDB - minDB) / (maxDB - minDB);

      // Map to needle angle: -45° (left/low) to +45° (right/high)
      return -45 + (normalized * 90);
    };

    // Listen for meter levels from C++ via JUCE backend events (like TapeAge)
    if (window.__JUCE__ && window.__JUCE__.backend) {
      window.__JUCE__.backend.addEventListener("inputLevel", (dbLevel) => {
        targetInputAngle = mapDBToAngle(dbLevel);
      });

      window.__JUCE__.backend.addEventListener("outputLevel", (dbLevel) => {
        targetOutputAngle = mapDBToAngle(dbLevel);
      });
    }

    function animateVUMeters() {
      // Ballistic motion: fast attack, slow decay
      const inputSpeed = currentInputAngle < targetInputAngle ? ATTACK_SPEED : DECAY_SPEED;
      const outputSpeed = currentOutputAngle < targetOutputAngle ? ATTACK_SPEED : DECAY_SPEED;

      currentInputAngle += (targetInputAngle - currentInputAngle) * inputSpeed;
      currentOutputAngle += (targetOutputAngle - currentOutputAngle) * outputSpeed;

      inputNeedle.style.transform = `translateX(-50%) rotate(${currentInputAngle}deg)`;
      outputNeedle.style.transform = `translateX(-50%) rotate(${currentOutputAngle}deg)`;

      // Update needle color: dark green (-20dB) to bright red (+3dB)
      const updateNeedleColor = (needle, angle) => {
        // angle ranges from -45 (low) to +45 (high)
        const normalized = (angle + 45) / 90; // 0 to 1

        // Interpolate from dark green to bright red
        // Dark green: rgb(34, 139, 34) = #228B22
        // Bright red: rgb(255, 50, 50) = #FF3232
        const r = Math.round(34 + normalized * (255 - 34));
        const g = Math.round(139 - normalized * (139 - 50));
        const b = Math.round(34 + normalized * (50 - 34));

        const color = `rgb(${r}, ${g}, ${b})`;
        const colorDark = `rgb(${Math.round(r * 0.8)}, ${Math.round(g * 0.8)}, ${Math.round(b * 0.8)})`;

        needle.style.background = `linear-gradient(180deg, ${color} 0%, ${colorDark} 100%)`;
      };

      updateNeedleColor(inputNeedle, currentInputAngle);
      updateNeedleColor(outputNeedle, currentOutputAngle);

      requestAnimationFrame(animateVUMeters);
    }

    // Start animation loop
    animateVUMeters();

    console.log('Ouaricon Saturation Modeling - UI initialized');
  </script>
</body>
</html>

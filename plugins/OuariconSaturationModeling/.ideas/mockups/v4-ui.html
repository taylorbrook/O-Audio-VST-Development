<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouaricon Saturation</title>

  <style>
    /* CRITICAL WEBVIEW CONSTRAINTS */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* Native application feel - REQUIRED */
    body {
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
      font-family: 'Garamond', 'Times New Roman', serif;
      background: #F5E6D3;
    }

    /* Plugin container (600x450 fixed size) */
    .container {
      width: 100%;
      height: 100%;
      position: relative;
      background-image: url('img/paper1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Decorative borders */
    .border {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid #8B7355;
      pointer-events: none;
      z-index: 100;
    }

    .divider {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 1px;
      background: rgba(139, 115, 85, 0.4);
      pointer-events: none;
      z-index: 10;
    }

    .divider.top { top: 47px; }
    .divider.middle { top: 115px; }
    .divider.bottom { top: 360px; }

    /* Title */
    .title {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: normal;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 3px;
      z-index: 20;
    }

    /* Model selection buttons (centered row) */
    .model-buttons {
      position: absolute;
      top: 70px;
      left: 70px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .model-button {
      width: 110px;
      height: 30px;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 5px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .model-button:last-child {
      width: 100px;
    }

    .model-button:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .model-button.active {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
      font-weight: bold;
    }

    /* Intensity knob (enhanced 3D texture, positioned LEFT) */
    .knob-container {
      position: absolute;
      left: 175px;
      top: 180px;
      width: 90px;
      height: 90px;
      z-index: 40;
    }

    .knob {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      cursor: ns-resize;

      /* Enhanced 3D texture */
      background: radial-gradient(circle at 35% 35%, #F5DEB3, #E8D5B7 50%, #D8C5A7 100%);
      border: 2px solid #8B7355;

      /* Multiple layered inset shadows for depth */
      box-shadow:
        inset 0 -3px 6px rgba(0,0,0,0.3),
        inset 0 3px 6px rgba(255,255,255,0.2),
        inset -2px -2px 4px rgba(0,0,0,0.2),
        inset 2px 2px 4px rgba(255,255,255,0.15),
        0 4px 8px rgba(0,0,0,0.4);

      transform-origin: center center;
      transition: transform 0.05s ease-out;
    }

    /* Cross-hatch texture overlay */
    .knob::before {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background:
        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px),
        repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
      opacity: 0.15;
      pointer-events: none;
    }

    /* Bevel highlight */
    .knob::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      right: 40%;
      bottom: 40%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent 60%);
      pointer-events: none;
    }

    /* Knob segments (10 radial sections) */
    .knob-segments {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        conic-gradient(
          #F5DEB3 0deg 36deg,
          #8B7355 36deg 38deg,
          #E8D5B7 38deg 72deg,
          #8B7355 72deg 74deg,
          #F5DEB3 74deg 108deg,
          #8B7355 108deg 110deg,
          #E8D5B7 110deg 144deg,
          #8B7355 144deg 146deg,
          #F5DEB3 146deg 180deg,
          #8B7355 180deg 182deg,
          #E8D5B7 182deg 216deg,
          #8B7355 216deg 218deg,
          #F5DEB3 218deg 252deg,
          #8B7355 252deg 254deg,
          #E8D5B7 254deg 288deg,
          #8B7355 288deg 290deg,
          #F5DEB3 290deg 324deg,
          #8B7355 324deg 326deg,
          #E8D5B7 326deg 360deg
        );
      pointer-events: none;
    }

    /* V4 REFINEMENT: Indicator dot at EDGE (~92% radius) */
    .knob-indicator {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #3C2F2F;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    /* Intensity label centered beneath knob */
    .knob-label {
      position: absolute;
      left: 175px;
      top: 280px;
      width: 90px;
      font-size: 11px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }

    /* VU meters (top-oriented scales) - V4: GREEN color scheme */
    .vu-meter {
      position: absolute;
      width: 90px;
      height: 90px;
      z-index: 30;
    }

    .vu-meter.input { left: 55px; top: 170px; }
    .vu-meter.output { left: 455px; top: 170px; }

    .vu-face {
      width: 100%;
      height: 100%;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }

    /* Scale labels along top arc */
    .vu-scale {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 20px;
      display: flex;
      justify-content: space-between;
      padding: 0 8px;
      font-size: 7px;
      color: #3C2F2F;
      font-family: 'Garamond', serif;
      pointer-events: none;
    }

    .vu-scale span {
      display: inline-block;
      text-align: center;
    }

    /* Needle sweeps upward from bottom (GREEN color) */
    .vu-needle {
      position: absolute;
      bottom: 15px;
      left: 50%;
      width: 2px;
      height: 40px;
      background: #3C5C1A;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-45deg);
      transition: transform 0.1s ease-out;
      pointer-events: none;
      z-index: 5;
    }

    .vu-needle::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      background: #3C5C1A;
      border-radius: 50%;
    }

    .vu-label {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      color: #3C2F2F;
      font-weight: bold;
      pointer-events: none;
    }

    /* V4: Snake overlay (moved LEFT, x:285) */
    .snake-overlay {
      position: absolute;
      left: 285px;
      top: 135px;
      width: 180px;
      height: 180px;
      opacity: 0.3;
      mix-blend-mode: multiply;
      filter: sepia(0.2);
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.3s ease;
      object-fit: contain;
    }

    /* Quality section */
    .quality-label {
      position: absolute;
      left: 162px;
      top: 375px;
      font-size: 9px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 20;
    }

    .quality-buttons {
      position: absolute;
      left: 50px;
      top: 395px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .quality-button {
      width: 75px;
      height: 28px;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 4px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quality-button:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .quality-button.active {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
      font-weight: bold;
    }

    /* Autogain toggle */
    .autogain-toggle {
      position: absolute;
      left: 450px;
      top: 395px;
      width: 100px;
      height: 28px;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      border-radius: 4px;
      color: #3C2F2F;
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 30;
    }

    .autogain-toggle:hover {
      background: rgba(139, 168, 112, 0.5);
    }

    .autogain-toggle.active {
      background: rgba(107, 142, 35, 0.6);
      border-color: #2C3E10;
      font-weight: bold;
    }

    .autogain-toggle::after {
      content: '❦';
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Decorative elements -->
    <div class="border"></div>
    <div class="divider top"></div>
    <div class="divider middle"></div>
    <div class="divider bottom"></div>

    <!-- Title -->
    <div class="title">OUARICON SATURATION</div>

    <!-- Model selection buttons -->
    <div class="model-buttons">
      <button class="model-button active" data-model="0" data-param="MODEL">MAGNETIC</button>
      <button class="model-button" data-model="1" data-param="MODEL">TUBE</button>
      <button class="model-button" data-model="2" data-param="MODEL">TRANSFORMER</button>
      <button class="model-button" data-model="3" data-param="MODEL">DIODE</button>
    </div>

    <!-- Input VU Meter (V4: GREEN color scheme) -->
    <div class="vu-meter input">
      <div class="vu-face">
        <div class="vu-scale">
          <span>-20</span>
          <span>-10</span>
          <span>-7</span>
          <span>-5</span>
          <span>-3</span>
          <span>0</span>
          <span>+3</span>
        </div>
        <div class="vu-needle" id="inputNeedle"></div>
        <div class="vu-label">IN</div>
      </div>
    </div>

    <!-- Intensity knob (V4: Indicator at EDGE) -->
    <div class="knob-container">
      <div class="knob" id="intensityKnob" data-param="INTENSITY">
        <div class="knob-segments"></div>
        <div class="knob-indicator"></div>
      </div>
    </div>

    <!-- Intensity label centered -->
    <div class="knob-label">INTENSITY</div>

    <!-- V4: Snake overlay (moved LEFT, x:285) -->
    <img
      src="img/snake_mobot31753000317195_0068.png"
      class="snake-overlay"
      id="snakeImage"
      alt="Snake illustration"
    />

    <!-- Output VU Meter (V4: GREEN color scheme) -->
    <div class="vu-meter output">
      <div class="vu-face">
        <div class="vu-scale">
          <span>-20</span>
          <span>-10</span>
          <span>-7</span>
          <span>-5</span>
          <span>-3</span>
          <span>0</span>
          <span>+3</span>
        </div>
        <div class="vu-needle" id="outputNeedle"></div>
        <div class="vu-label">OUT</div>
      </div>
    </div>

    <!-- Quality section -->
    <div class="quality-label">QUALITY</div>
    <div class="quality-buttons">
      <button class="quality-button" data-quality="0" data-param="QUALITY">LOW</button>
      <button class="quality-button active" data-quality="1" data-param="QUALITY">MID</button>
      <button class="quality-button" data-quality="2" data-param="QUALITY">HIGH</button>
    </div>

    <!-- Autogain toggle -->
    <button class="autogain-toggle" id="autogainToggle" data-param="AUTOGAIN">AUTOGAIN</button>
  </div>

  <!-- JUCE WebView integration (ES6 modules) -->
  <script type="module" src="js/juce/index.js"></script>
  <script type="module">
    import { getSliderState, getToggleState } from './js/juce/index.js';

    // Disable context menu (REQUIRED for native feel)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // Snake image URLs (relative paths for JUCE resource provider)
    const snakeImages = {
      0: 'img/snake_mobot31753000317195_0068.png', // MAGNETIC
      1: 'img/snake_mobot31753000317195_0070.png', // TUBE
      2: 'img/snake_NA_0145.png', // TRANSFORMER
      3: 'img/snake_snakesaustralia00kref_0145.png' // DIODE
    };

    // Update snake image based on MODEL
    function updateSnakeImage(modelIndex) {
      const snakeImg = document.getElementById('snakeImage');
      snakeImg.src = snakeImages[modelIndex];
    }

    // Update snake opacity based on INTENSITY (0.15 to 0.5)
    function updateSnakeOpacity(intensity) {
      const opacity = 0.15 + (intensity * 0.35);
      document.getElementById('snakeImage').style.opacity = opacity;
    }

    // === INTENSITY KNOB (JUCE parameter binding) ===
    const intensityKnob = document.getElementById('intensityKnob');
    const intensityState = getSliderState('INTENSITY');

    let isDraggingKnob = false;
    let lastY = 0;

    // Initial knob position from JUCE
    function updateKnobRotation() {
      const normalized = intensityState.getNormalisedValue();
      const degrees = -135 + (normalized * 270);
      intensityKnob.style.transform = `rotate(${degrees}deg)`;
      updateSnakeOpacity(normalized);
    }

    // Listen for parameter changes from C++ (automation, preset recall)
    intensityState.valueChangedEvent.addListener(() => {
      updateKnobRotation();
    });

    // Mouse drag interaction (relative drag pattern - JUCE 8 critical pattern #16)
    intensityKnob.addEventListener('mousedown', (e) => {
      isDraggingKnob = true;
      lastY = e.clientY;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDraggingKnob) return;

      const deltaY = lastY - e.clientY;
      const sensitivity = 0.005;
      const currentValue = intensityState.getNormalisedValue();
      const newValue = Math.max(0, Math.min(1, currentValue + deltaY * sensitivity));

      intensityState.setNormalisedValue(newValue);
      updateKnobRotation();
      lastY = e.clientY;
    });

    document.addEventListener('mouseup', () => {
      isDraggingKnob = false;
    });

    // Initialize knob
    updateKnobRotation();

    // === MODEL BUTTONS (JUCE choice parameter binding) ===
    const modelButtons = document.querySelectorAll('.model-button');
    const modelState = getSliderState('MODEL');

    function updateModelButtons() {
      const currentModel = Math.round(modelState.getNormalisedValue() * 3);
      modelButtons.forEach((btn, index) => {
        btn.classList.toggle('active', index === currentModel);
      });
      updateSnakeImage(currentModel);
    }

    // Listen for parameter changes from C++
    modelState.valueChangedEvent.addListener(() => {
      updateModelButtons();
    });

    // Handle button clicks
    modelButtons.forEach((btn, index) => {
      btn.addEventListener('click', () => {
        modelState.setNormalisedValue(index / 3);
        updateModelButtons();
      });
    });

    // Initialize model buttons
    updateModelButtons();

    // === QUALITY BUTTONS (JUCE choice parameter binding) ===
    const qualityButtons = document.querySelectorAll('.quality-button');
    const qualityState = getSliderState('QUALITY');

    function updateQualityButtons() {
      const currentQuality = Math.round(qualityState.getNormalisedValue() * 2);
      qualityButtons.forEach((btn, index) => {
        btn.classList.toggle('active', index === currentQuality);
      });
    }

    // Listen for parameter changes from C++
    qualityState.valueChangedEvent.addListener(() => {
      updateQualityButtons();
    });

    // Handle button clicks
    qualityButtons.forEach((btn, index) => {
      btn.addEventListener('click', () => {
        qualityState.setNormalisedValue(index / 2);
        updateQualityButtons();
      });
    });

    // Initialize quality buttons
    updateQualityButtons();

    // === AUTOGAIN TOGGLE (JUCE boolean parameter binding) ===
    const autogainToggle = document.getElementById('autogainToggle');
    const autogainState = getToggleState('AUTOGAIN');

    function updateAutogainToggle() {
      const isEnabled = autogainState.getValue();
      autogainToggle.classList.toggle('active', isEnabled);
    }

    // Listen for parameter changes from C++
    autogainState.valueChangedEvent.addListener(() => {
      updateAutogainToggle();
    });

    // Handle toggle click
    autogainToggle.addEventListener('click', () => {
      autogainState.setValue(!autogainState.getValue());
      updateAutogainToggle();
    });

    // Initialize autogain toggle
    updateAutogainToggle();

    // === VU METERS (C++ → JS updates via custom callback) ===
    const inputNeedle = document.getElementById('inputNeedle');
    const outputNeedle = document.getElementById('outputNeedle');

    let currentInputAngle = -45;
    let targetInputAngle = -45;
    let currentOutputAngle = -45;
    let targetOutputAngle = -45;

    const ATTACK_SPEED = 0.4;
    const DECAY_SPEED = 0.15;

    // C++ calls this function to update meter levels
    window.receiveMeterLevels = function(inputDB, outputDB) {
      // Map dB to needle angle (-45deg to +45deg for -20dB to +3dB range)
      const mapDBToAngle = (db) => {
        const normalized = (db + 20) / 23;
        return -45 + (normalized * 90);
      };

      targetInputAngle = mapDBToAngle(inputDB);
      targetOutputAngle = mapDBToAngle(outputDB);
    };

    // Animation loop for smooth ballistic motion (JUCE 8 critical pattern #20)
    function animateVUMeters() {
      // Ballistic motion: fast attack, slow decay
      const inputSpeed = currentInputAngle < targetInputAngle ? ATTACK_SPEED : DECAY_SPEED;
      const outputSpeed = currentOutputAngle < targetOutputAngle ? ATTACK_SPEED : DECAY_SPEED;

      currentInputAngle += (targetInputAngle - currentInputAngle) * inputSpeed;
      currentOutputAngle += (targetOutputAngle - currentOutputAngle) * outputSpeed;

      inputNeedle.style.transform = `translateX(-50%) rotate(${currentInputAngle}deg)`;
      outputNeedle.style.transform = `translateX(-50%) rotate(${currentOutputAngle}deg)`;

      requestAnimationFrame(animateVUMeters);
    }

    // Start VU meter animation loop
    animateVUMeters();

    console.log('Ouaricon Saturation v4 - Production UI loaded');
  </script>
</body>
</html>

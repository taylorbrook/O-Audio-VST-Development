# Ouaricon Saturation - UI Design Specification v4
# Generated: 2026-01-09
# Plugin: OuariconSaturationModeling
# Aesthetic: Ouaricon Audio Naturalist (botanical vintage)
# Revision: V4 REFINEMENTS - Snake moved LEFT, GREEN VU meters, dial indicator at edge

window:
  width: 600
  height: 450
  resizable: false

colors:
  # Ouaricon Naturalist palette
  background: "#F5E6D3"  # Aged paper base
  text: "#3C2F2F"  # Dark brown
  border: "#8B7355"  # Walnut brown
  button_default_bg: "rgba(139, 168, 112, 0.3)"
  button_default_border: "#3C5C1A"
  button_active_bg: "rgba(107, 142, 35, 0.6)"
  button_active_border: "#2C3E10"
  knob_segment_light: "#F5DEB3"  # Wheat
  knob_segment_dark: "#E8D5B7"  # Darker wheat
  knob_divider: "#8B7355"  # Walnut brown
  # V4 REFINEMENT: GREEN VU METERS
  meter_face: "rgba(139, 168, 112, 0.3)"  # Light green (was cream #FFF8E7)
  meter_needle: "#3C5C1A"  # Dark green (was dark red #8B0000)

typography:
  primary: "'Garamond', 'Times New Roman', serif"
  title_size: "20px"
  title_spacing: "3px"
  label_size: "10px"
  label_spacing: "1px"

layout:
  type: vertical-sections
  sections:
    - id: header
      y: 0
      height: 50
      description: "Plugin title area (single line)"
    - id: model_selection
      y: 50
      height: 60
      description: "Four centered model selection buttons"
    - id: main_control
      y: 110
      height: 240
      description: "Enhanced knob (LEFT) with top-oriented VU meters and snake (CENTER-LEFT)"
    - id: footer
      y: 350
      height: 100
      description: "Quality buttons with label and autogain toggle"

controls:
  # PRIMARY CONTROL: Intensity knob (LEFT position from v2/v3)
  - id: intensity
    type: knob
    label: "INTENSITY"
    parameter_id: INTENSITY
    parameter_type: float
    range: [0.0, 100.0]
    default: 50.0
    unit: "%"
    decimals: 0
    position: {x: 175, y: 180}
    size: {diameter: 90}
    style:
      type: botanical_seed_enhanced
      segments: 10
      segment_colors: ["#F5DEB3", "#E8D5B7"]
      divider_color: "#8B7355"
      divider_width: 2
      border_color: "#8B7355"
      border_width: 2
      # V4 REFINEMENT: Indicator dot at EDGE (~92% radius)
      indicator_type: dot
      indicator_color: "#3C2F2F"
      indicator_position: edge  # V4: Moved to outer edge
      indicator_radius_percent: 92  # V4: Was ~75%, now 92%
      inset_shadows:
        - "inset 0 -3px 6px rgba(0,0,0,0.3)"
        - "inset 0 3px 6px rgba(255,255,255,0.2)"
        - "inset -2px -2px 4px rgba(0,0,0,0.2)"
        - "inset 2px 2px 4px rgba(255,255,255,0.15)"
      radial_gradient: "radial-gradient(circle at 35% 35%, #F5DEB3, #E8D5B7 50%, #D8C5A7 100%)"
      bevel_highlight: "rgba(255, 255, 255, 0.3)"
      drop_shadow: "0 4px 8px rgba(0,0,0,0.4)"
      cross_hatch: true
      cross_hatch_opacity: 0.15

  # MODEL SELECTION: 4 exclusive buttons (centered)
  - id: model_magnetic
    type: button
    label: "MAGNETIC"
    parameter_id: MODEL
    parameter_type: choice
    parameter_value: 0
    position: {x: 70, y: 70}
    size: {width: 110, height: 30}
    style:
      type: botanical_button
      border_radius: 5
      default_bg: "rgba(139, 168, 112, 0.3)"
      default_border: "#3C5C1A"
      active_bg: "rgba(107, 142, 35, 0.6)"
      active_border: "#2C3E10"
      text_color: "#3C2F2F"
      text_size: "11px"
      text_transform: uppercase
      letter_spacing: "0.8px"

  - id: model_tube
    type: button
    label: "TUBE"
    parameter_id: MODEL
    parameter_type: choice
    parameter_value: 1
    position: {x: 190, y: 70}
    size: {width: 110, height: 30}
    style:
      type: botanical_button
      border_radius: 5
      default_bg: "rgba(139, 168, 112, 0.3)"
      default_border: "#3C5C1A"
      active_bg: "rgba(107, 142, 35, 0.6)"
      active_border: "#2C3E10"
      text_color: "#3C2F2F"
      text_size: "11px"
      text_transform: uppercase
      letter_spacing: "0.8px"

  - id: model_transformer
    type: button
    label: "TRANSFORMER"
    parameter_id: MODEL
    parameter_type: choice
    parameter_value: 2
    position: {x: 310, y: 70}
    size: {width: 110, height: 30}
    style:
      type: botanical_button
      border_radius: 5
      default_bg: "rgba(139, 168, 112, 0.3)"
      default_border: "#3C5C1A"
      active_bg: "rgba(107, 142, 35, 0.6)"
      active_border: "#2C3E10"
      text_color: "#3C2F2F"
      text_size: "11px"
      text_transform: uppercase
      letter_spacing: "0.8px"

  - id: model_diode
    type: button
    label: "DIODE"
    parameter_id: MODEL
    parameter_type: choice
    parameter_value: 3
    position: {x: 430, y: 70}
    size: {width: 100, height: 30}
    style:
      type: botanical_button
      border_radius: 5
      default_bg: "rgba(139, 168, 112, 0.3)"
      default_border: "#3C5C1A"
      active_bg: "rgba(107, 142, 35, 0.6)"
      active_border: "#2C3E10"
      text_color: "#3C2F2F"
      text_size: "11px"
      text_transform: uppercase
      letter_spacing: "0.8px"

  # QUALITY SELECTION: 3 exclusive buttons (bottom left)
  - id: quality_low
    type: button
    label: "LOW"
    parameter_id: QUALITY
    parameter_type: choice
    parameter_value: 0
    position: {x: 50, y: 395}
    size: {width: 75, height: 28}
    style:
      type: botanical_button
      border_radius: 4
      default_bg: "rgba(139, 168, 112, 0.3)"
      default_border: "#3C5C1A"
      active_bg: "rgba(107, 142, 35, 0.6)"
      active_border: "#2C3E10"
      text_color: "#3C2F2F"
      text_size: "10px"
      text_transform: uppercase
      letter_spacing: "0.6px"

  - id: quality_mid
    type: button
    label: "MID"
    parameter_id: QUALITY
    parameter_type: choice
    parameter_value: 1
    position: {x: 135, y: 395}
    size: {width: 75, height: 28}
    style:
      type: botanical_button
      border_radius: 4
      default_bg: "rgba(139, 168, 112, 0.3)"
      default_border: "#3C5C1A"
      active_bg: "rgba(107, 142, 35, 0.6)"
      active_border: "#2C3E10"
      text_color: "#3C2F2F"
      text_size: "10px"
      text_transform: uppercase
      letter_spacing: "0.6px"

  - id: quality_high
    type: button
    label: "HIGH"
    parameter_id: QUALITY
    parameter_type: choice
    parameter_value: 2
    position: {x: 220, y: 395}
    size: {width: 75, height: 28}
    style:
      type: botanical_button
      border_radius: 4
      default_bg: "rgba(139, 168, 112, 0.3)"
      default_border: "#3C5C1A"
      active_bg: "rgba(107, 142, 35, 0.6)"
      active_border: "#2C3E10"
      text_color: "#3C2F2F"
      text_size: "10px"
      text_transform: uppercase
      letter_spacing: "0.6px"

  # AUTOGAIN TOGGLE (bottom right)
  - id: autogain
    type: toggle
    label: "AUTOGAIN"
    parameter_id: AUTOGAIN
    parameter_type: bool
    default: false
    position: {x: 450, y: 395}
    size: {width: 100, height: 28}
    style:
      type: botanical_button
      border_radius: 4
      default_bg: "rgba(139, 168, 112, 0.3)"
      default_border: "#3C5C1A"
      active_bg: "rgba(107, 142, 35, 0.6)"
      active_border: "#2C3E10"
      text_color: "#3C2F2F"
      text_size: "10px"
      text_transform: uppercase
      letter_spacing: "0.6px"
      fleuron: "❦"

special_elements:
  # Paper texture background (paper1.jpg)
  - id: paper_background
    type: background_image
    layer: background
    image_path: "/Users/taylorbrook/Dev/Ouaricon Audio Images/paper/paper1.jpg"
    style:
      background_size: cover
      background_position: center
      background_repeat: no-repeat

  # Title (single line at top)
  - id: title
    type: text
    content: "OUARICON SATURATION"
    position: {x: 300, y: 28}
    anchor: center
    style:
      font_family: "'Garamond', 'Times New Roman', serif"
      font_size: "20px"
      font_weight: normal
      color: "#3C2F2F"
      text_transform: uppercase
      letter_spacing: "3px"

  # Intensity label CENTERED beneath knob
  - id: intensity_label
    type: text
    content: "INTENSITY"
    position: {x: 175, y: 280}
    size: {width: 90, height: 20}
    anchor: top-left
    style:
      font_family: "'Garamond', 'Times New Roman', serif"
      font_size: "11px"
      font_weight: normal
      color: "#3C2F2F"
      text_transform: uppercase
      letter_spacing: "1.2px"
      text_align: center

  # Quality label (above quality buttons)
  - id: quality_label
    type: text
    content: "QUALITY"
    position: {x: 162, y: 375}
    anchor: center
    style:
      font_family: "'Garamond', 'Times New Roman', serif"
      font_size: "9px"
      font_weight: normal
      color: "#3C2F2F"
      text_transform: uppercase
      letter_spacing: "1px"

  # Input VU Meter (left side, TOP-ORIENTED scale)
  # V4 REFINEMENT: GREEN COLOR SCHEME
  - id: input_vu_meter
    type: vu_meter
    position: {x: 55, y: 170}
    size: {width: 90, height: 90}
    data_source: input_level
    style:
      type: vintage_needle_top_scale
      scale_position: top
      face_color: "rgba(139, 168, 112, 0.3)"  # V4: Light green (was #FFF8E7)
      scale_color: "#3C2F2F"
      needle_color: "#3C5C1A"  # V4: Dark green (was #8B0000)
      border_color: "#3C5C1A"  # V4: Green border (was #8B7355)
      border_width: 2
      font_family: "'Garamond', serif"
      font_size: "7px"
      scale_marks: [-20, -10, -7, -5, -3, 0, 3]
      scale_labels: ["-20", "-10", "-7", "-5", "-3", "0", "+3"]
      scale_arc_start: 225
      scale_arc_end: 315
      needle_pivot_y: 70

  # Output VU Meter (right side, TOP-ORIENTED scale)
  # V4 REFINEMENT: GREEN COLOR SCHEME
  - id: output_vu_meter
    type: vu_meter
    position: {x: 455, y: 170}
    size: {width: 90, height: 90}
    data_source: output_level
    style:
      type: vintage_needle_top_scale
      scale_position: top
      face_color: "rgba(139, 168, 112, 0.3)"  # V4: Light green (was #FFF8E7)
      scale_color: "#3C2F2F"
      needle_color: "#3C5C1A"  # V4: Dark green (was #8B0000)
      border_color: "#3C5C1A"  # V4: Green border (was #8B7355)
      border_width: 2
      font_family: "'Garamond', serif"
      font_size: "7px"
      scale_marks: [-20, -10, -7, -5, -3, 0, 3]
      scale_labels: ["-20", "-10", "-7", "-5", "-3", "0", "+3"]
      scale_arc_start: 225
      scale_arc_end: 315
      needle_pivot_y: 70

  # V4 REFINEMENT: SNAKE MOVED LEFT (between 300px-450px midpoint)
  # V4: x=285px (center of snake at ~375px, between 300-450 range)
  - id: snake_overlay
    type: dynamic_image
    position: {x: 285, y: 135}  # V4: LEFT from 350px to 285px
    size: {width: 180, height: 180}  # V4: Reduced width from 235 to 180
    layer: background
    images:
      magnetic: "/Users/taylorbrook/Dev/Ouaricon Audio Images/fauna/snake_mobot31753000317195_0068.png"
      tube: "/Users/taylorbrook/Dev/Ouaricon Audio Images/fauna/snake_mobot31753000317195_0070.png"
      transformer: "/Users/taylorbrook/Dev/Ouaricon Audio Images/fauna/snake_NA_0145.png"
      diode: "/Users/taylorbrook/Dev/Ouaricon Audio Images/fauna/snake_snakesaustralia00kref_0145.png"
    opacity_control:
      parameter_id: INTENSITY
      min_opacity: 0.15
      max_opacity: 0.5
      mapping: linear
    style:
      blend_mode: multiply
      filter: sepia(0.2)
      object_fit: contain
    notes: "V4: Snake moved LEFT (x:285, center at ~375px between 300-450 midpoint)"

  # Decorative border
  - id: border
    type: rectangle
    position: {x: 0, y: 0}
    size: {width: 600, height: 450}
    layer: decorative
    style:
      fill: none
      stroke: "#8B7355"
      stroke_width: 3
      border_radius: 0

  # Section dividers
  - id: divider_top
    type: line
    position: {x: 20, y: 47}
    end_position: {x: 580, y: 47}
    layer: decorative
    style:
      stroke: "#8B7355"
      stroke_width: 1
      opacity: 0.4

  - id: divider_middle
    type: line
    position: {x: 20, y: 115}
    end_position: {x: 580, y: 115}
    layer: decorative
    style:
      stroke: "#8B7355"
      stroke_width: 1
      opacity: 0.4

  - id: divider_bottom
    type: line
    position: {x: 20, y: 360}
    end_position: {x: 580, y: 360}
    layer: decorative
    style:
      stroke: "#8B7355"
      stroke_width: 1
      opacity: 0.4

parameter_mappings:
  - ui_id: intensity
    parameter_id: INTENSITY
    normalized_range: [0.0, 1.0]
    display_range: [0, 100]
    display_unit: "%"
    smoothing_time: 50ms

  - ui_id: model_buttons
    parameter_id: MODEL
    type: choice
    choices:
      - id: 0
        label: "MAGNETIC"
        ui_element: model_magnetic
        snake_image: snake_mobot31753000317195_0068
      - id: 1
        label: "TUBE"
        ui_element: model_tube
        snake_image: snake_mobot31753000317195_0070
      - id: 2
        label: "TRANSFORMER"
        ui_element: model_transformer
        snake_image: snake_NA_0145
      - id: 3
        label: "DIODE"
        ui_element: model_diode
        snake_image: snake_snakesaustralia00kref_0145

  - ui_id: quality_buttons
    parameter_id: QUALITY
    type: choice
    choices:
      - id: 0
        label: "LOW"
        ui_element: quality_low
      - id: 1
        label: "MID"
        ui_element: quality_mid
      - id: 2
        label: "HIGH"
        ui_element: quality_high

  - ui_id: autogain
    parameter_id: AUTOGAIN
    type: bool
    normalized_range: [0.0, 1.0]

notes:
  - "V4 REFINEMENTS (from v3):"
  - "1. Snake position: MOVED LEFT from x:350 to x:285 (center at ~375px, between 300-450 midpoint)"
  - "2. VU meters: GREEN color scheme (face: rgba(139,168,112,0.3), needle: #3C5C1A, border: #3C5C1A)"
  - "3. Dial indicator: MOVED TO EDGE (~92% radius, was ~75%)"
  - "All v3 features preserved: REAL snake PNG images, snake switching per MODEL, opacity controlled by INTENSITY"
  - "All v2 features preserved: VU meters top-oriented, knob LEFT, enhanced 3D texture"
  - "Layout validation: PASSED (600×450px, proper edge padding, clear control separation)"

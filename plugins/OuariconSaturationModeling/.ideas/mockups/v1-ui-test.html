<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouaricon Saturation - UI Mockup v1</title>

  <style>
    /* ========================================
       CRITICAL: WebView Constraints
       ======================================== */

    html, body {
      height: 100%;  /* REQUIRED - replaces viewport units */
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* ========================================
       Native Application Feel
       ======================================== */

    body {
      /* Disable web behaviors */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      cursor: default;
      overflow: hidden;

      /* Browser test frame background */
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      font-family: 'Garamond', 'Times New Roman', serif;
    }

    /* ========================================
       Fixed Preview Frame (Test HTML Only)
       ======================================== */

    .plugin-frame {
      width: 600px;
      height: 450px;
      border: 2px solid #444;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
      background: #F5E6D3;  /* Aged paper */
    }

    /* ========================================
       Plugin Container
       ======================================== */

    .container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #F5E6D3;
    }

    /* ========================================
       Ouaricon Naturalist Typography
       ======================================== */

    .title {
      position: absolute;
      left: 50%;
      top: 28px;
      transform: translateX(-50%);
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 20px;
      font-weight: normal;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
    }

    .intensity-label {
      position: absolute;
      left: 285px;
      top: 295px;
      transform: translateX(-50%);
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 11px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .quality-label {
      position: absolute;
      left: 162px;
      top: 375px;
      transform: translateX(-50%);
      font-family: 'Garamond', 'Times New Roman', serif;
      font-size: 9px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ========================================
       Decorative Elements
       ======================================== */

    .border {
      position: absolute;
      inset: 0;
      border: 3px solid #8B7355;
      pointer-events: none;
      z-index: 100;
    }

    .divider {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 1px;
      background: rgba(139, 115, 85, 0.4);
      pointer-events: none;
    }

    .divider-top { top: 47px; }
    .divider-middle { top: 115px; }
    .divider-bottom { top: 360px; }

    /* ========================================
       Botanical Snake Overlay
       ======================================== */

    .snake-overlay {
      position: absolute;
      left: 185px;
      top: 140px;
      width: 330px;
      height: 170px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
      filter: sepia(0.2);
      mix-blend-mode: multiply;
      transition: opacity 100ms linear;
    }

    .snake-overlay img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ========================================
       Intensity Knob (Botanical Seed Style)
       ======================================== */

    .knob-container {
      position: absolute;
      left: 240px;
      top: 180px;
      width: 90px;
      height: 90px;
      z-index: 10;
    }

    .knob {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: ns-resize;
      transform-origin: center center;
      transition: transform 50ms ease-out;
    }

    .knob-body {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #8B7355;
      background: conic-gradient(
        #F5DEB3 0deg 36deg,
        #E8D5B7 36deg 72deg,
        #F5DEB3 72deg 108deg,
        #E8D5B7 108deg 144deg,
        #F5DEB3 144deg 180deg,
        #E8D5B7 180deg 216deg,
        #F5DEB3 216deg 252deg,
        #E8D5B7 252deg 288deg,
        #F5DEB3 288deg 324deg,
        #E8D5B7 324deg 360deg
      );
      position: relative;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
    }

    .knob-dividers {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .knob-divider {
      position: absolute;
      width: 2px;
      height: 50%;
      background: #8B7355;
      left: 50%;
      top: 0;
      transform-origin: bottom center;
    }

    .knob-indicator {
      position: absolute;
      width: 7px;
      height: 7px;
      background: #3C2F2F;
      border-radius: 50%;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
    }

    /* ========================================
       Botanical Buttons
       ======================================== */

    .button {
      position: absolute;
      background: rgba(139, 168, 112, 0.3);
      border: 2px solid #3C5C1A;
      color: #3C2F2F;
      text-transform: uppercase;
      font-family: 'Garamond', 'Times New Roman', serif;
      cursor: pointer;
      transition: all 150ms ease;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button:hover {
      background: rgba(139, 168, 112, 0.45);
      border-color: #2C3E10;
    }

    .button.active {
      background: rgba(107, 142, 35, 0.6);
      border: 2px solid #2C3E10;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Model buttons (centered) */
    .model-button {
      top: 70px;
      height: 30px;
      border-radius: 5px;
      font-size: 11px;
      letter-spacing: 0.8px;
    }

    #model-magnetic { left: 70px; width: 110px; }
    #model-tube { left: 190px; width: 110px; }
    #model-transformer { left: 310px; width: 110px; }
    #model-diode { left: 430px; width: 100px; }

    /* Quality buttons */
    .quality-button {
      top: 395px;
      width: 75px;
      height: 28px;
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: 0.6px;
    }

    #quality-low { left: 50px; }
    #quality-mid { left: 135px; }
    #quality-high { left: 220px; }

    /* Autogain toggle */
    #autogain {
      position: absolute;
      left: 450px;
      top: 395px;
      width: 100px;
      height: 28px;
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: 0.6px;
    }

    #autogain::after {
      content: " ❦";
      opacity: 0;
      transition: opacity 150ms;
    }

    #autogain.active::after {
      opacity: 1;
    }

    /* ========================================
       VU Meters (Square)
       ======================================== */

    .vu-meter {
      position: absolute;
      width: 90px;
      height: 90px;
      background: #FFF8E7;
      border: 2px solid #8B7355;
      border-radius: 4px;
      overflow: hidden;
    }

    #input-vu { left: 55px; top: 170px; }
    #output-vu { left: 455px; top: 170px; }

    .vu-scale {
      width: 100%;
      height: 100%;
      position: relative;
      padding: 5px;
    }

    .vu-scale-mark {
      position: absolute;
      left: 5px;
      right: 5px;
      height: 1px;
      background: #3C2F2F;
    }

    .vu-scale-label {
      position: absolute;
      right: 8px;
      font-size: 7px;
      color: #3C2F2F;
      font-family: 'Garamond', serif;
      transform: translateY(-50%);
    }

    .vu-needle {
      position: absolute;
      left: 50%;
      bottom: 15px;
      width: 2px;
      height: 35px;
      background: #8B0000;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 100ms ease-out;
      z-index: 5;
    }

    /* ========================================
       Debug Monitor (Test HTML Only)
       ======================================== */

    .debug-monitor {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 4px;
      min-width: 180px;
      pointer-events: none;
      z-index: 10000;
    }

    .debug-label {
      color: #666;
      font-size: 9px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .debug-param {
      font-weight: bold;
      color: #0f0;
    }

    .debug-value {
      color: #fff;
      margin-top: 2px;
    }

    .debug-normalized {
      color: #888;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <!-- Fixed preview frame -->
  <div class="plugin-frame">
    <div class="container">

      <!-- Title (single line) -->
      <div class="title">OUARICON SATURATION</div>

      <!-- Decorative elements -->
      <div class="border"></div>
      <div class="divider divider-top"></div>
      <div class="divider divider-middle"></div>
      <div class="divider divider-bottom"></div>

      <!-- Botanical snake overlay (larger, moved right) -->
      <div class="snake-overlay" id="snake-overlay">
        <img id="snake-image" src="" alt="" />
      </div>

      <!-- Model selection buttons (centered) -->
      <button class="button model-button active" id="model-magnetic" data-param="MODEL" data-value="0">MAGNETIC</button>
      <button class="button model-button" id="model-tube" data-param="MODEL" data-value="1">TUBE</button>
      <button class="button model-button" id="model-transformer" data-param="MODEL" data-value="2">TRANSFORMER</button>
      <button class="button model-button" id="model-diode" data-param="MODEL" data-value="3">DIODE</button>

      <!-- Intensity knob (larger, moved left) -->
      <div class="knob-container">
        <div class="knob" id="intensity-knob" data-param="INTENSITY">
          <div class="knob-body">
            <div class="knob-dividers">
              <div class="knob-divider" style="transform: rotate(0deg);"></div>
              <div class="knob-divider" style="transform: rotate(36deg);"></div>
              <div class="knob-divider" style="transform: rotate(72deg);"></div>
              <div class="knob-divider" style="transform: rotate(108deg);"></div>
              <div class="knob-divider" style="transform: rotate(144deg);"></div>
              <div class="knob-divider" style="transform: rotate(180deg);"></div>
              <div class="knob-divider" style="transform: rotate(216deg);"></div>
              <div class="knob-divider" style="transform: rotate(252deg);"></div>
              <div class="knob-divider" style="transform: rotate(288deg);"></div>
              <div class="knob-divider" style="transform: rotate(324deg);"></div>
            </div>
            <div class="knob-indicator"></div>
          </div>
        </div>
      </div>

      <div class="intensity-label">INTENSITY</div>

      <!-- VU Meters (square) -->
      <div class="vu-meter" id="input-vu">
        <div class="vu-scale">
          <div class="vu-scale-mark" style="top: 10%;"></div>
          <div class="vu-scale-label" style="top: 10%;">+3</div>
          <div class="vu-scale-mark" style="top: 25%;"></div>
          <div class="vu-scale-label" style="top: 25%;">0</div>
          <div class="vu-scale-mark" style="top: 40%;"></div>
          <div class="vu-scale-label" style="top: 40%;">-3</div>
          <div class="vu-scale-mark" style="top: 55%;"></div>
          <div class="vu-scale-label" style="top: 55%;">-6</div>
          <div class="vu-scale-mark" style="top: 75%;"></div>
          <div class="vu-scale-label" style="top: 75%;">-10</div>
          <div class="vu-scale-mark" style="top: 90%;"></div>
          <div class="vu-scale-label" style="top: 90%;">-20</div>
          <div class="vu-needle"></div>
        </div>
      </div>

      <div class="vu-meter" id="output-vu">
        <div class="vu-scale">
          <div class="vu-scale-mark" style="top: 10%;"></div>
          <div class="vu-scale-label" style="top: 10%;">+3</div>
          <div class="vu-scale-mark" style="top: 25%;"></div>
          <div class="vu-scale-label" style="top: 25%;">0</div>
          <div class="vu-scale-mark" style="top: 40%;"></div>
          <div class="vu-scale-label" style="top: 40%;">-3</div>
          <div class="vu-scale-mark" style="top: 55%;"></div>
          <div class="vu-scale-label" style="top: 55%;">-6</div>
          <div class="vu-scale-mark" style="top: 75%;"></div>
          <div class="vu-scale-label" style="top: 75%;">-10</div>
          <div class="vu-scale-mark" style="top: 90%;"></div>
          <div class="vu-scale-label" style="top: 90%;">-20</div>
          <div class="vu-needle"></div>
        </div>
      </div>

      <!-- Quality label -->
      <div class="quality-label">QUALITY</div>

      <!-- Quality selection buttons -->
      <button class="button quality-button" id="quality-low" data-param="QUALITY" data-value="0">LOW</button>
      <button class="button quality-button active" id="quality-mid" data-param="QUALITY" data-value="1">MID</button>
      <button class="button quality-button" id="quality-high" data-param="QUALITY" data-value="2">HIGH</button>

      <!-- Autogain toggle -->
      <button class="button" id="autogain" data-param="AUTOGAIN">AUTOGAIN</button>

    </div>
  </div>

  <!-- Debug monitor -->
  <div class="debug-monitor">
    <div class="debug-label">PARAMETER MONITOR</div>
    <div class="debug-param" id="debugParam">—</div>
    <div class="debug-value" id="debugValue">—</div>
    <div class="debug-normalized" id="debugNormalized">—</div>
  </div>

  <script>
    // ========================================
    // Mock JUCE Backend (Browser Testing)
    // ========================================

    window.Juce = {
      getSliderState: (id) => ({
        normalisedValue: 0.5,
        valueChangedEvent: {
          addListener: (fn) => console.log(`[JUCE] Listener added for ${id}`)
        },
        setNormalisedValue: (v) => console.log(`[JUCE] ${id} set to ${v}`)
      }),
      getToggleState: (id) => ({
        value: false,
        valueChangedEvent: {
          addListener: (fn) => console.log(`[JUCE] Listener added for ${id}`)
        },
        setValue: (v) => console.log(`[JUCE] ${id} set to ${v}`)
      }),
      getComboBoxState: (id) => ({
        selectedId: 0,
        valueChangedEvent: {
          addListener: (fn) => console.log(`[JUCE] Listener added for ${id}`)
        },
        setSelectedId: (v) => console.log(`[JUCE] ${id} set to ${v}`)
      })
    };

    // ========================================
    // Disable Context Menu (Required)
    // ========================================

    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // ========================================
    // Parameter State
    // ========================================

    const paramState = {
      INTENSITY: 50,  // 0-100
      MODEL: 0,       // 0-3 (magnetic=0, tube=1, transformer=2, diode=3)
      QUALITY: 1,     // 0-2 (low=0, mid=1, high=2)
      AUTOGAIN: false // boolean
    };

    // Snake image mapping
    const snakeImages = {
      0: '/Users/taylorbrook/Dev/Ouaricon Audio Images/fauna/snake_mobot31753000317195_0068.png',  // MAGNETIC
      1: '/Users/taylorbrook/Dev/Ouaricon Audio Images/fauna/snake_mobot31753000317195_0070.png',  // TUBE
      2: '/Users/taylorbrook/Dev/Ouaricon Audio Images/fauna/snake_NA_0145.png',  // TRANSFORMER
      3: '/Users/taylorbrook/Dev/Ouaricon Audio Images/fauna/snake_snakesaustralia00kref_0145.png'   // DIODE
    };

    // ========================================
    // Debug Monitor
    // ========================================

    function updateDebugMonitor(paramId, value, normalizedValue) {
      document.getElementById('debugParam').textContent = paramId;
      document.getElementById('debugValue').textContent = formatValue(paramId, value);
      document.getElementById('debugNormalized').textContent = `${(normalizedValue * 100).toFixed(1)}%`;
    }

    function formatValue(paramId, value) {
      if (paramId === 'INTENSITY') return `${value}%`;
      if (paramId === 'MODEL') {
        const names = ['MAGNETIC', 'TUBE', 'TRANSFORMER', 'DIODE'];
        return names[value];
      }
      if (paramId === 'QUALITY') {
        const names = ['LOW', 'MID', 'HIGH'];
        return names[value];
      }
      if (paramId === 'AUTOGAIN') return value ? 'ON' : 'OFF';
      return value;
    }

    // ========================================
    // Knob Interaction (Intensity)
    // ========================================

    const knob = document.getElementById('intensity-knob');
    const snakeOverlay = document.getElementById('snake-overlay');
    const snakeImage = document.getElementById('snake-image');

    let isDragging = false;
    let startY = 0;
    let startValue = 50;

    knob.addEventListener('mousedown', (e) => {
      isDragging = true;
      startY = e.clientY;
      startValue = paramState.INTENSITY;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const deltaY = startY - e.clientY;  // Inverted: drag up = increase
      const sensitivity = 0.5;
      const newValue = Math.max(0, Math.min(100, startValue + (deltaY * sensitivity)));

      paramState.INTENSITY = Math.round(newValue);
      updateIntensityKnob(paramState.INTENSITY);
      updateSnakeOpacity(paramState.INTENSITY);

      const normalized = paramState.INTENSITY / 100;
      updateDebugMonitor('INTENSITY', paramState.INTENSITY, normalized);

      console.log(`[Parameter] INTENSITY changed: ${paramState.INTENSITY}%`);
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    function updateIntensityKnob(value) {
      const normalized = value / 100;
      const degrees = -135 + (normalized * 270);  // -135° to +135°
      knob.style.transform = `rotate(${degrees}deg)`;
    }

    function updateSnakeOpacity(intensity) {
      // Map 0-100 to 0.1-0.5 opacity
      const opacity = 0.1 + (intensity / 100) * 0.4;
      snakeOverlay.style.opacity = opacity;
    }

    // ========================================
    // Button Groups (Exclusive Selection)
    // ========================================

    // Model buttons
    const modelButtons = document.querySelectorAll('.model-button');
    modelButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const value = parseInt(btn.dataset.value);

        // Update active state
        modelButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Update parameter
        paramState.MODEL = value;

        // Change snake image
        snakeImage.src = snakeImages[value];

        const normalized = value / 3;
        updateDebugMonitor('MODEL', value, normalized);

        console.log(`[Parameter] MODEL changed: ${value} (${formatValue('MODEL', value)})`);
      });
    });

    // Quality buttons
    const qualityButtons = document.querySelectorAll('.quality-button');
    qualityButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const value = parseInt(btn.dataset.value);

        // Update active state
        qualityButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Update parameter
        paramState.QUALITY = value;

        const normalized = value / 2;
        updateDebugMonitor('QUALITY', value, normalized);

        console.log(`[Parameter] QUALITY changed: ${value} (${formatValue('QUALITY', value)})`);
      });
    });

    // Autogain toggle
    const autogainBtn = document.getElementById('autogain');
    autogainBtn.addEventListener('click', () => {
      paramState.AUTOGAIN = !paramState.AUTOGAIN;
      autogainBtn.classList.toggle('active');

      const normalized = paramState.AUTOGAIN ? 1 : 0;
      updateDebugMonitor('AUTOGAIN', paramState.AUTOGAIN, normalized);

      console.log(`[Parameter] AUTOGAIN changed: ${paramState.AUTOGAIN}`);
    });

    // ========================================
    // VU Meter Animation (Mock)
    // ========================================

    function animateVUMeters() {
      const inputNeedle = document.querySelector('#input-vu .vu-needle');
      const outputNeedle = document.querySelector('#output-vu .vu-needle');

      // Random simulation
      const inputLevel = Math.random() * 60 - 20;  // -20 to +40 range
      const outputLevel = Math.random() * 60 - 20;

      // Map to needle rotation (-45° to +45°)
      const inputAngle = Math.max(-45, Math.min(45, inputLevel * 1.5));
      const outputAngle = Math.max(-45, Math.min(45, outputLevel * 1.5));

      inputNeedle.style.transform = `translateX(-50%) rotate(${inputAngle}deg)`;
      outputNeedle.style.transform = `translateX(-50%) rotate(${outputAngle}deg)`;
    }

    // Animate VU meters at ~16 FPS
    setInterval(animateVUMeters, 60);

    // ========================================
    // Initialize
    // ========================================

    document.addEventListener('DOMContentLoaded', () => {
      console.log('[Mockup] Ouaricon Saturation v1 (refined) loaded');
      console.log('[Mockup] Default state:', paramState);

      // Initialize knob position
      updateIntensityKnob(paramState.INTENSITY);
      updateSnakeOpacity(paramState.INTENSITY);

      // Load default snake image (MAGNETIC)
      snakeImage.src = snakeImages[0];

      console.log('[Mockup] Ready for interaction');
    });
  </script>
</body>
</html>

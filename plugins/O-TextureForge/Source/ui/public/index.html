<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O-TextureForge</title>
    <link rel="stylesheet" href="/css/ouaricon-naturalist.css" />
    <script type="module" src="./js/juce/index.js"></script>
    <script>
        // Make JUCE bridge functions globally available for bundled app.js
        import('./js/juce/index.js').then(m => {
            window.getSliderState = m.getSliderState;
            window.getComboBoxState = m.getComboBoxState;
            window.getNativeFunction = m.getNativeFunction;
            window.getBackendResourceAddress = m.getBackendResourceAddress;
        });
    </script>
    <!-- v1.1.0: the language runtime. A real ES module, because the canon block
         imports ./i18n.js over the wire and webpack would inline that import at
         BUILD time if it lived in src/app.js — shipping the label table twice
         and leaving js/i18n.js embedded, served and read by nobody. Deferred
         like every module, so it runs after app.bundle.js has registered its
         DOMContentLoaded handler; nothing races. -->
    <script type="module" src="./js/i18n_init.js"></script>
</head>
<body>

<!-- Header -->
<div class="header">
    <!-- v1.1.0: the h1 and the gear share the LEFT slot of the space-between
         header, so .tagline keeps the right edge it already had and nothing on
         the page moves to make room for the settings cluster. -->
    <div class="header-left">
        <!-- NOT a [data-i18n] element: a product name is never translated.
             Declared in I18N_EXEMPT with that reason, so a genuinely missed
             label cannot hide here as a deliberate one. -->
        <h1>O-TextureForge</h1>

        <!-- v1.1.0: the settings cluster. ONE row, because this plugin has no
             hover-help to switch on or off — authoring that copy is Stage M's
             job and this version does not invent it. -->
        <div class="settings-cluster">
            <button type="button" class="gear-btn" id="gear-btn"
                    aria-haspopup="dialog" aria-expanded="false"
                    data-i18n-aria="aria.settings" aria-label="Settings" data-tip-always>&#9881;</button>

            <div class="settings-popover" id="settings-popover"
                 role="dialog" data-i18n-aria="aria.settings" aria-label="Settings" hidden>
                <label class="settings-row" for="lang-select">
                    <!-- data-label so a state updater that writes textContent
                         reads the authored caption back instead of erasing it
                         (pattern_js_state_updater_overwrites_html_labels). -->
                    <span class="settings-label" data-i18n="label.language" data-label="Language">Language</span>
                    <!-- ENDONYMS. Never localized: a French speaker looking for
                         their language looks for "Fran&ccedil;ais". -->
                    <select class="settings-select" id="lang-select"
                            data-i18n-aria="aria.langSelect" aria-label="Interface language">
                        <option value="en">English</option>
                        <option value="fr">Fran&ccedil;ais</option>
                    </select>
                </label>

                <!-- v1.3.0: the hover-help switch. A <div>, NEVER a
                     <label for="tips-toggle">: a button is a labelable element, so a label
                     wrapping one re-dispatches the click and the switch toggles twice. The
                     button names itself with aria-label instead.

                     data-tip-always goes on this button and on #gear-btn and on nothing
                     else. Those two controls are the ones that REACH and RESTORE the help
                     layer, so they keep explaining themselves while it is off. #lang-select
                     deliberately does not carry it: it is only reachable through the gear,
                     which already explained itself on the way in. -->
                <div class="settings-row">
                  <span class="settings-label" data-i18n="label.hoverHelp" data-label="Hover help">Hover help</span>
                  <button type="button" class="settings-toggle" id="tips-toggle"
                          aria-pressed="true" data-i18n-aria="aria.helpToggle"
                          aria-label="Toggle hover help"
                          data-i18n="ui.on" data-tip-always>On</button>
                </div>
            </div>
        </div>
    </div>
    <span class="tagline" data-i18n="label.tagline">Concatenative Texture Engine</span>
</div>

<!-- Main Area: Scatter + Macro Knobs -->
<div class="main-area">

    <!-- Scatter Plot -->
    <div class="scatter-container">
        <canvas id="scatter-canvas"></canvas>
        <canvas id="cursor-overlay"></canvas>
        <!-- v1.1.0: SPLIT per contract section 5 / D-01 arm 3. Through v1.0.2
             this div held the fleuron element AND a bare text node as siblings,
             and src/app.js rewrote both together with innerHTML in three
             places. applyLabel writes textContent, which would have deleted the
             glyph, so the text moved into its own span and only that span is
             keyed. The glyph is now authored once and never rewritten, and the
             three JS writes became setLabel calls carrying no markup. -->
        <div class="scatter-placeholder">
            <span class="fleuron">&#10087;</span><span class="placeholder-text" data-i18n="placeholder.dropToBegin">Drop an audio file to begin</span>
        </div>
    </div>

    <!-- Macro Knobs Panel -->
    <div class="macro-panel">
        <span class="section-label" data-i18n="section.timbralMacros">Timbral Macros</span>

        <div class="knob-row">
            <span class="knob-label" data-i18n="knob.energy">Energy</span>
            <div class="knob" data-param="energy"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="energy">50%</span>
        </div>
        <div class="knob-row">
            <span class="knob-label" data-i18n="knob.brightness">Brightness</span>
            <div class="knob" data-param="brightness"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="brightness">50%</span>
        </div>
        <div class="knob-row">
            <span class="knob-label" data-i18n="knob.texture">Texture</span>
            <div class="knob" data-param="texture"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="texture">50%</span>
        </div>

        <div class="divider">&#10087;</div>

        <span class="section-label" data-i18n="section.scatterPosition">Scatter Position</span>

        <div class="knob-row">
            <span class="knob-label" data-i18n="knob.scatterX">Scatter X</span>
            <div class="knob" data-param="scatterX"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="scatterX">50%</span>
        </div>
        <div class="knob-row">
            <span class="knob-label" data-i18n="knob.scatterY">Scatter Y</span>
            <div class="knob" data-param="scatterY"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="scatterY">50%</span>
        </div>
        <div class="knob-row">
            <span class="knob-label" data-i18n="knob.variation">Variation</span>
            <div class="knob" data-param="variation"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="variation">20%</span>
        </div>

        <!-- UMAP Progress -->
        <div class="umap-progress-container">
            <span class="umap-progress-label">UMAP</span>
            <div class="umap-progress-bar">
                <div class="umap-progress-fill"></div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Strip -->
<div class="bottom-strip">
    <div class="bottom-knobs">
        <div class="bottom-knob-group">
            <div class="knob small" data-param="position"><div class="knob-indicator"></div></div>
            <span class="knob-label" data-i18n="knob.position">Position</span>
            <span class="knob-value" data-value="position">0%</span>
        </div>
        <div class="bottom-knob-group">
            <div class="knob small" data-param="grainSize"><div class="knob-indicator"></div></div>
            <span class="knob-label" data-i18n="knob.grainSize">Grain Size</span>
            <span class="knob-value" data-value="grainSize">50ms</span>
        </div>
        <div class="bottom-knob-group">
            <div class="knob small" data-param="grainDensity"><div class="knob-indicator"></div></div>
            <span class="knob-label" data-i18n="knob.grainDensity">Density</span>
            <span class="knob-value" data-value="grainDensity">8</span>
        </div>
        <div class="bottom-knob-group">
            <div class="knob small" data-param="crossfade"><div class="knob-indicator"></div></div>
            <span class="knob-label" data-i18n="knob.crossfade">Crossfade</span>
            <span class="knob-value" data-value="crossfade">50%</span>
        </div>
        <div class="bottom-knob-group">
            <div class="knob small" data-param="outputGain"><div class="knob-indicator"></div></div>
            <span class="knob-label" data-i18n="knob.gain">Gain</span>
            <span class="knob-value" data-value="outputGain">0 dB</span>
        </div>
    </div>
    <div class="bottom-controls">
        <span class="midi-mode-label" data-i18n="label.midiMode">MIDI Mode</span>
        <select id="midi-mode" class="midi-mode-select">
            <option value="0">Pitch-Mapped</option>
            <option value="1">Trigger + Modulate</option>
            <option value="2" selected>Generative Drone</option>
        </select>
        <div class="drop-zone" id="drop-zone" data-i18n="label.dropZone">Drop audio file here</div>
    </div>
</div>

<!-- v1.2.0: the hover-help surface. ONE element for the whole page — the
     renderer in js/i18n_init.js is delegated on document, so there is no
     per-anchor surface to keep in step. It is EMPTY in the markup and it stays
     empty until a hover: its two text parts are built with createElement and
     textContent, never innerHTML, because localized copy must never reach a
     markup path (check-i18n assertion 9 forbids an angle bracket in an i18n.js
     string literal and this is the other half of that rule).

     position: fixed + visibility: hidden in the stylesheet, so an unshown
     surface is not a visible empty box. NOTE, measured on O-Bass in M1 and
     carried here: check-ui-labels does NOT catch an un-hidden surface — a fixed
     box at 0,0 has the same rect in both languages, so it neither moves nor
     changes the visible set. What catches it is check-i18n assertion 10 and
     boot-all-uis' text count. -->
<div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

<!-- App bundle (non-module, webpack output) -->
<script src="/js/app.bundle.js"></script>

</body>
</html>

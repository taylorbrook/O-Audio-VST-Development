<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O-TextureForge</title>
    <link rel="stylesheet" href="/css/ouaricon-naturalist.css" />
    <script type="module" src="./js/juce/index.js"></script>
    <script>
        // Make JUCE bridge functions globally available for bundled app.js
        import('./js/juce/index.js').then(m => {
            window.getSliderState = m.getSliderState;
            window.getComboBoxState = m.getComboBoxState;
            window.getNativeFunction = m.getNativeFunction;
            window.getBackendResourceAddress = m.getBackendResourceAddress;
        });
    </script>
</head>
<body>

<!-- Header -->
<div class="header">
    <h1>O-TextureForge</h1>
    <span class="tagline">Concatenative Texture Engine</span>
</div>

<!-- Main Area: Scatter + Macro Knobs -->
<div class="main-area">

    <!-- Scatter Plot -->
    <div class="scatter-container">
        <canvas id="scatter-canvas"></canvas>
        <canvas id="cursor-overlay"></canvas>
        <div class="scatter-placeholder">
            <span class="fleuron">&#10087;</span>
            Drop an audio file to begin
        </div>
    </div>

    <!-- Macro Knobs Panel -->
    <div class="macro-panel">
        <span class="section-label">Timbral Macros</span>

        <div class="knob-row">
            <span class="knob-label">Energy</span>
            <div class="knob" data-param="energy"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="energy">50%</span>
        </div>
        <div class="knob-row">
            <span class="knob-label">Brightness</span>
            <div class="knob" data-param="brightness"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="brightness">50%</span>
        </div>
        <div class="knob-row">
            <span class="knob-label">Texture</span>
            <div class="knob" data-param="texture"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="texture">50%</span>
        </div>

        <div class="divider">&#10087;</div>

        <span class="section-label">Scatter Position</span>

        <div class="knob-row">
            <span class="knob-label">Scatter X</span>
            <div class="knob" data-param="scatterX"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="scatterX">50%</span>
        </div>
        <div class="knob-row">
            <span class="knob-label">Scatter Y</span>
            <div class="knob" data-param="scatterY"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="scatterY">50%</span>
        </div>
        <div class="knob-row">
            <span class="knob-label">Variation</span>
            <div class="knob" data-param="variation"><div class="knob-indicator"></div></div>
            <span class="knob-value" data-value="variation">20%</span>
        </div>

        <!-- UMAP Progress -->
        <div class="umap-progress-container">
            <span class="umap-progress-label">UMAP</span>
            <div class="umap-progress-bar">
                <div class="umap-progress-fill"></div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Strip -->
<div class="bottom-strip">
    <div class="bottom-knobs">
        <div class="bottom-knob-group">
            <div class="knob small" data-param="position"><div class="knob-indicator"></div></div>
            <span class="knob-label">Position</span>
            <span class="knob-value" data-value="position">0%</span>
        </div>
        <div class="bottom-knob-group">
            <div class="knob small" data-param="grainSize"><div class="knob-indicator"></div></div>
            <span class="knob-label">Grain Size</span>
            <span class="knob-value" data-value="grainSize">50ms</span>
        </div>
        <div class="bottom-knob-group">
            <div class="knob small" data-param="grainDensity"><div class="knob-indicator"></div></div>
            <span class="knob-label">Density</span>
            <span class="knob-value" data-value="grainDensity">8</span>
        </div>
        <div class="bottom-knob-group">
            <div class="knob small" data-param="crossfade"><div class="knob-indicator"></div></div>
            <span class="knob-label">Crossfade</span>
            <span class="knob-value" data-value="crossfade">50%</span>
        </div>
        <div class="bottom-knob-group">
            <div class="knob small" data-param="outputGain"><div class="knob-indicator"></div></div>
            <span class="knob-label">Gain</span>
            <span class="knob-value" data-value="outputGain">0 dB</span>
        </div>
    </div>
    <div class="bottom-controls">
        <span class="midi-mode-label">MIDI Mode</span>
        <select id="midi-mode" class="midi-mode-select">
            <option value="0">Pitch-Mapped</option>
            <option value="1">Trigger + Modulate</option>
            <option value="2" selected>Generative Drone</option>
        </select>
        <div class="drop-zone" id="drop-zone">Drop audio file here</div>
    </div>
</div>

<!-- App bundle (non-module, webpack output) -->
<script src="/js/app.bundle.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=920, height=220" />
  <title>Ouaricon Analog EQ</title>

  <style>
    /* ====================================================================
       CRITICAL CSS CONSTRAINTS
       ==================================================================== */

    /* Use 100%, NOT 100vh - JUCE WebView requires percentage-based sizing */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* ====================================================================
       NATIVE APPLICATION FEEL
       ==================================================================== */

    body {
      /* Native feel CSS (REQUIRED) */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      cursor: default;
      overflow: hidden;

      /* Center plugin frame */
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: Garamond, serif;
    }

    /* Main container - fills viewport */
    .container {
      width: 920px;
      height: 220px;
      position: relative;
      overflow: hidden;
    }

    /* Paper texture background layer */
    .paper-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/images/paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* Large rotated botanical overlay */
    .botanical-overlay {
      position: absolute;
      top: -150px;
      left: 200px;
      width: 500px;
      height: 500px;
      background-image: url('/images/flower_ferdinandibauer00baue_0021.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.45;
      transform: rotate(90deg);
      transform-origin: center center;
      z-index: 1;
      pointer-events: none;
    }

    /* Content layer (controls) */
    .content-layer {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Header border */
    .header-border {
      position: absolute;
      top: 45px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #8B7355;
    }

    /* Title */
    .title {
      position: absolute;
      top: 12px;
      left: 320px;
      width: 280px;
      height: 24px;
      font-family: Garamond, serif;
      font-size: 18px;
      text-align: center;
      letter-spacing: 0.15em;
      color: #3C2F2F;
      line-height: 24px;
    }

    /* Band labels */
    .band-label {
      font-family: Garamond, serif;
      font-size: 10px;
      text-align: center;
      letter-spacing: 0.12em;
      color: #3C2F2F;
      font-weight: 600;
      position: absolute;
    }

    .sublabel {
      font-family: Garamond, serif;
      font-size: 8px;
      text-align: center;
      letter-spacing: 0.1em;
      color: #5C4033;
      position: absolute;
    }

    /* Dual-layer knob container */
    .dual-knob-container {
      position: absolute;
      width: 65px;
      height: 65px;
      cursor: pointer;
    }

    /* Outer ring - frequency control (visual only, interaction handled by container) */
    .knob-outer {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 70%, #C9A27B 70%, #C9A27B 85%, #8B7355 85%);
      border: 2px solid #8B7355;
      transform-origin: center center;
      transition: transform 50ms;
      pointer-events: none;
    }

    /* Outer ring indicator */
    .knob-outer-indicator {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 8px;
      background: #5C4033;
      border-radius: 2px;
      pointer-events: none;
    }

    /* Inner dial - gain control with 10-segment seed cross-section */
    .knob-inner {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 41px;
      height: 41px;
      border-radius: 50%;
      background:
        radial-gradient(circle, #FFF8DC 0%, #FFF8DC 20%, transparent 20%),
        conic-gradient(from 0deg,
          #F5DEB3 0deg, #F5DEB3 35deg, #8B7355 35deg, #8B7355 36deg,
          #E8D5B7 36deg, #E8D5B7 71deg, #8B7355 71deg, #8B7355 72deg,
          #F5DEB3 72deg, #F5DEB3 107deg, #8B7355 107deg, #8B7355 108deg,
          #E8D5B7 108deg, #E8D5B7 143deg, #8B7355 143deg, #8B7355 144deg,
          #F5DEB3 144deg, #F5DEB3 179deg, #8B7355 179deg, #8B7355 180deg,
          #E8D5B7 180deg, #E8D5B7 215deg, #8B7355 215deg, #8B7355 216deg,
          #F5DEB3 216deg, #F5DEB3 251deg, #8B7355 251deg, #8B7355 252deg,
          #E8D5B7 252deg, #E8D5B7 287deg, #8B7355 287deg, #8B7355 288deg,
          #F5DEB3 288deg, #F5DEB3 323deg, #8B7355 323deg, #8B7355 324deg,
          #E8D5B7 324deg, #E8D5B7 359deg, #8B7355 359deg, #8B7355 360deg
        );
      border: 2px solid #8B7355;
      transform-origin: center center;
      transition: transform 50ms;
      pointer-events: none;
    }

    /* Pointer indicator on inner dial */
    .knob-pointer {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 10px;
      background: #3C2F2F;
      pointer-events: none;
    }

    /* Standard single-layer knob (output gain) */
    .standard-knob {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #D4B896, #C9A27B);
      border: 2px solid #8B7355;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 50ms;
    }

    .standard-knob .knob-pointer {
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 14px;
      background: #3C2F2F;
      pointer-events: none;
      position: absolute;
    }

    /* Toggle switches */
    .toggle {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #8B7355;
      border: 1px solid #5C4033;
      border-radius: 3px;
      font-family: Garamond, serif;
      font-size: 8px;
      letter-spacing: 0.08em;
      color: #FFF;
      cursor: pointer;
      transition: background 100ms;
      text-align: center;
      padding: 2px 4px;
    }

    .toggle.active {
      background: #6B8E4E;
      border-color: #3C5C1A;
    }

    .toggle-large {
      font-size: 9px;
      padding: 4px 8px;
    }

    /* Three-way Q toggle */
    .three-way-toggle {
      position: absolute;
      display: flex;
      gap: 1px;
      background: #8B7355;
      border: 1px solid #5C4033;
      border-radius: 3px;
      overflow: hidden;
    }

    .three-way-option {
      flex: 1;
      padding: 3px 6px;
      font-family: Garamond, serif;
      font-size: 7px;
      letter-spacing: 0.08em;
      color: #FFF;
      cursor: pointer;
      text-align: center;
      background: #8B7355;
      transition: background 100ms;
    }

    .three-way-option.active {
      background: #6B8E4E;
    }

    /* VU Meter - Marimba style */
    .vu-meter {
      position: absolute;
      width: 70px;
      height: 70px;
      background: rgba(139, 168, 112, 0.2);
      border: 2px solid #3C5C1A;
      border-radius: 50%;
      overflow: hidden;
    }

    .vu-meter-scale {
      position: absolute;
      width: 100%;
      height: 50%;
      top: 5%;
    }

    .vu-meter-needle {
      position: absolute;
      width: 2px;
      height: 28px;
      background: #3C5C1A;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-30deg);
      border-radius: 1px;
      transition: transform 0.15s ease-out;
    }

    .vu-meter-pivot {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #3C2F2F;
      border-radius: 50%;
      bottom: calc(50% - 4px);
      left: calc(50% - 4px);
    }

    .vu-meter-label {
      position: absolute;
      bottom: 8px;
      width: 100%;
      text-align: center;
      font-size: 7px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Value tooltip that appears on hover/drag */
    .value-tooltip {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(60, 47, 47, 0.9);
      color: #FFF;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 8px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 150ms;
    }

    .dual-knob-container:hover .value-tooltip,
    .dual-knob-container.dragging .value-tooltip {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Background layers -->
    <div class="paper-background"></div>
    <div class="botanical-overlay"></div>

    <!-- Content layer -->
    <div class="content-layer">
      <!-- Header -->
      <div class="header-border"></div>
      <div class="title">OUARICON ANALOG EQ</div>

      <!-- LF BAND -->
      <div class="band-label" style="top: 55px; left: 45px; width: 65px;">LF</div>
      <div class="dual-knob-container" style="top: 75px; left: 38px;" data-param-outer="lf_freq" data-param-inner="lf_gain">
        <div class="knob-outer" id="lf_freq_knob">
          <div class="knob-outer-indicator"></div>
        </div>
        <div class="knob-inner" id="lf_gain_knob">
          <div class="knob-pointer"></div>
        </div>
        <div class="value-tooltip" id="lf_tooltip">100 Hz / 0 dB</div>
      </div>
      <div class="sublabel" style="top: 150px; left: 45px; width: 65px;">SHELF</div>
      <div class="toggle active" id="lf_on" style="top: 170px; left: 53px; width: 32px; height: 16px;">ON</div>

      <!-- LMF BAND -->
      <div class="band-label" style="top: 55px; left: 188px; width: 65px;">LMF</div>
      <div class="dual-knob-container" style="top: 75px; left: 181px;" data-param-outer="lmf_freq" data-param-inner="lmf_gain">
        <div class="knob-outer" id="lmf_freq_knob">
          <div class="knob-outer-indicator"></div>
        </div>
        <div class="knob-inner" id="lmf_gain_knob">
          <div class="knob-pointer"></div>
        </div>
        <div class="value-tooltip" id="lmf_tooltip">500 Hz / 0 dB</div>
      </div>
      <div class="three-way-toggle" id="lmf_q" style="top: 150px; left: 173px; width: 82px; height: 18px;">
        <div class="three-way-option" data-value="0">WIDE</div>
        <div class="three-way-option active" data-value="1">MED</div>
        <div class="three-way-option" data-value="2">TIGHT</div>
      </div>
      <div class="toggle active" id="lmf_on" style="top: 174px; left: 196px; width: 32px; height: 16px;">ON</div>

      <!-- HMF BAND -->
      <div class="band-label" style="top: 55px; left: 331px; width: 65px;">HMF</div>
      <div class="dual-knob-container" style="top: 75px; left: 324px;" data-param-outer="hmf_freq" data-param-inner="hmf_gain">
        <div class="knob-outer" id="hmf_freq_knob">
          <div class="knob-outer-indicator"></div>
        </div>
        <div class="knob-inner" id="hmf_gain_knob">
          <div class="knob-pointer"></div>
        </div>
        <div class="value-tooltip" id="hmf_tooltip">2000 Hz / 0 dB</div>
      </div>
      <div class="three-way-toggle" id="hmf_q" style="top: 150px; left: 316px; width: 82px; height: 18px;">
        <div class="three-way-option" data-value="0">WIDE</div>
        <div class="three-way-option active" data-value="1">MED</div>
        <div class="three-way-option" data-value="2">TIGHT</div>
      </div>
      <div class="toggle active" id="hmf_on" style="top: 174px; left: 339px; width: 32px; height: 16px;">ON</div>

      <!-- HF BAND -->
      <div class="band-label" style="top: 55px; left: 474px; width: 65px;">HF</div>
      <div class="dual-knob-container" style="top: 75px; left: 467px;" data-param-outer="hf_freq" data-param-inner="hf_gain">
        <div class="knob-outer" id="hf_freq_knob">
          <div class="knob-outer-indicator"></div>
        </div>
        <div class="knob-inner" id="hf_gain_knob">
          <div class="knob-pointer"></div>
        </div>
        <div class="value-tooltip" id="hf_tooltip">8000 Hz / 0 dB</div>
      </div>
      <div class="sublabel" style="top: 150px; left: 474px; width: 65px;">SHELF</div>
      <div class="toggle active" id="hf_on" style="top: 170px; left: 482px; width: 32px; height: 16px;">ON</div>

      <!-- GLOBAL CONTROLS -->
      <div class="band-label" style="top: 55px; left: 602px; width: 55px;">OUT</div>
      <div class="standard-knob" id="output_gain" style="top: 80px; left: 610px;">
        <div class="knob-pointer"></div>
      </div>
      <div class="toggle toggle-large active" id="analog" style="top: 160px; left: 590px; width: 75px; height: 22px;">ANALOG</div>

      <!-- VU METER - Marimba style -->
      <div class="vu-meter" style="top: 75px; left: 825px;">
        <svg class="vu-meter-scale" viewBox="0 0 70 35">
          <!-- Arc from left (-90) to right (+90) -->
          <path d="M 5 30 A 30 30 0 0 1 65 30" fill="none" stroke="#8B7355" stroke-width="1"/>
          <!-- Labels positioned on arc -->
          <text x="8" y="27" font-size="4" fill="#3C2F2F" text-anchor="middle">-60</text>
          <text x="22" y="9" font-size="4" fill="#3C2F2F" text-anchor="middle">-40</text>
          <text x="45" y="7" font-size="4" fill="#3C2F2F" text-anchor="middle">-20</text>
          <text x="58" y="24" font-size="5" fill="#3C2F2F" text-anchor="middle">0</text>
          <text x="62" y="27" font-size="4" fill="#3C2F2F" text-anchor="middle">+3</text>
        </svg>
        <div class="vu-meter-needle" id="vu_needle"></div>
        <div class="vu-meter-pivot"></div>
        <div class="vu-meter-label">Level</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { getSliderState, getToggleState, getComboBoxState } from "./js/juce/index.js";

    // Disable context menu (REQUIRED)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // Verify JUCE backend
    if (!window.__JUCE__) {
      console.error("JUCE backend not available");
    }

    // Parameter ranges for display formatting
    const paramRanges = {
      lf_freq: { min: 30, max: 500, unit: 'Hz', format: v => Math.round(30 + v * 470) + ' Hz' },
      lf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      lmf_freq: { min: 100, max: 2000, unit: 'Hz', format: v => Math.round(100 + v * 1900) + ' Hz' },
      lmf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      hmf_freq: { min: 500, max: 8000, unit: 'Hz', format: v => Math.round(500 + v * 7500) + ' Hz' },
      hmf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      hf_freq: { min: 2000, max: 20000, unit: 'Hz', format: v => (2000 + v * 18000 >= 10000 ? ((2000 + v * 18000)/1000).toFixed(1) + 'k' : Math.round(2000 + v * 18000)) + ' Hz' },
      hf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      output_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' }
    };

    // Update knob rotation
    function updateKnobRotation(element, normalizedValue) {
      const degrees = -135 + (normalizedValue * 270);
      element.style.transform = `rotate(${degrees}deg)`;
    }

    // ========================================================================
    // DUAL-LAYER KNOB - Distance-based detection
    // Outer ring (>60% from center) = frequency
    // Inner dial (<60% from center) = gain
    // ========================================================================
    function setupDualKnob(container, outerState, innerState, tooltipId, freqParamName, gainParamName) {
      const outerKnob = container.querySelector('.knob-outer');
      const innerKnob = container.querySelector('.knob-inner');
      const tooltip = document.getElementById(tooltipId);

      let isDragging = false;
      let currentState = null;
      let isOuterControl = false;
      let lastY = 0;

      const KNOB_RADIUS = 32.5;  // Half of 65px
      const INNER_THRESHOLD = 0.60;  // 60% of radius = inner zone

      function updateTooltip() {
        const freqValue = paramRanges[freqParamName].format(outerState.getNormalisedValue());
        const gainValue = paramRanges[gainParamName].format(innerState.getNormalisedValue());
        tooltip.textContent = freqValue + ' / ' + gainValue;
      }

      function handleMouseDown(e) {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + KNOB_RADIUS;
        const centerY = rect.top + KNOB_RADIUS;

        // Calculate distance from center as fraction of radius
        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const normalizedDistance = distance / KNOB_RADIUS;

        // Determine which control based on distance
        if (normalizedDistance > INNER_THRESHOLD) {
          // Outer ring - frequency control
          currentState = outerState;
          isOuterControl = true;
        } else {
          // Inner dial - gain control
          currentState = innerState;
          isOuterControl = false;
        }

        isDragging = true;
        lastY = e.clientY;
        container.classList.add('dragging');
        currentState.sliderDragStarted();
        e.preventDefault();
      }

      container.addEventListener('mousedown', handleMouseDown);

      document.addEventListener('mousemove', (e) => {
        if (!isDragging || !currentState) return;
        const deltaY = lastY - e.clientY;
        const currentValue = currentState.getNormalisedValue();
        const newValue = Math.max(0, Math.min(1, currentValue + (deltaY * 0.005)));
        currentState.setNormalisedValue(newValue);
        lastY = e.clientY;
      });

      document.addEventListener('mouseup', () => {
        if (isDragging && currentState) {
          currentState.sliderDragEnded();
          isDragging = false;
          currentState = null;
          container.classList.remove('dragging');
        }
      });

      // Listen for changes and update visuals
      outerState.valueChangedEvent.addListener(() => {
        updateKnobRotation(outerKnob, outerState.getNormalisedValue());
        updateTooltip();
      });

      innerState.valueChangedEvent.addListener(() => {
        updateKnobRotation(innerKnob, innerState.getNormalisedValue());
        updateTooltip();
      });

      // Initialize
      updateKnobRotation(outerKnob, outerState.getNormalisedValue());
      updateKnobRotation(innerKnob, innerState.getNormalisedValue());
      updateTooltip();
    }

    // Standard knob interaction
    function setupStandardKnob(element, state) {
      let isDragging = false;
      let lastY = 0;

      element.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastY = e.clientY;
        state.sliderDragStarted();
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaY = lastY - e.clientY;
        const currentValue = state.getNormalisedValue();
        const newValue = Math.max(0, Math.min(1, currentValue + (deltaY * 0.005)));
        state.setNormalisedValue(newValue);
        lastY = e.clientY;
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          state.sliderDragEnded();
          isDragging = false;
        }
      });

      state.valueChangedEvent.addListener(() => {
        updateKnobRotation(element, state.getNormalisedValue());
      });

      updateKnobRotation(element, state.getNormalisedValue());
    }

    // Toggle interaction
    function setupToggle(element, state) {
      element.addEventListener('click', () => {
        const currentValue = state.getValue();
        state.setValue(!currentValue);
      });

      state.valueChangedEvent.addListener(() => {
        element.classList.toggle('active', state.getValue());
      });

      element.classList.toggle('active', state.getValue());
    }

    // Three-way toggle interaction (for ComboBox parameters)
    function setupThreeWayToggle(container, state) {
      const options = container.querySelectorAll('.three-way-option');

      options.forEach((option, index) => {
        option.addEventListener('click', () => {
          state.setChoiceIndex(index);
        });
      });

      state.valueChangedEvent.addListener(() => {
        const index = state.getChoiceIndex();
        options.forEach((opt, i) => {
          opt.classList.toggle('active', i === index);
        });
      });

      // Initialize
      const index = state.getChoiceIndex();
      options.forEach((opt, i) => {
        opt.classList.toggle('active', i === index);
      });
    }

    // ========================================================================
    // VU METER - Marimba-style with C++ event-driven animation
    // ========================================================================
    const vuNeedle = document.getElementById('vu_needle');
    let currentVUAngle = -90;
    let targetVUAngle = -90;

    const VU_ATTACK_SPEED = 0.5;   // Fast attack
    const VU_DECAY_SPEED = 0.08;   // Smooth decay
    const VU_MIN_ANGLE = -90;      // -60dB position (fully left)
    const VU_MAX_ANGLE = 90;       // +3dB position (fully right)
    const VU_SNAP_THRESHOLD = 2.0; // Snap to rest when within 2 degrees

    // Map dB to needle angle
    function mapDBToAngle(dbLevel) {
      const minDB = -60;
      const maxDB = 3;
      const clampedDB = Math.max(minDB, Math.min(maxDB, dbLevel));
      const normalized = (clampedDB - minDB) / (maxDB - minDB);
      return VU_MIN_ANGLE + (normalized * (VU_MAX_ANGLE - VU_MIN_ANGLE));
    }

    // Update needle color: dark green (quiet) to bright red (loud)
    function updateNeedleColor(angle) {
      const normalized = (angle - VU_MIN_ANGLE) / (VU_MAX_ANGLE - VU_MIN_ANGLE);

      // Interpolate from dark green to bright red
      const r = Math.round(34 + normalized * (255 - 34));
      const g = Math.round(139 - normalized * (139 - 50));
      const b = Math.round(34 + normalized * (50 - 34));

      vuNeedle.style.background = `rgb(${r}, ${g}, ${b})`;
    }

    // Listen for output level from C++ via JUCE backend events
    if (window.__JUCE__ && window.__JUCE__.backend) {
      window.__JUCE__.backend.addEventListener("outputLevel", (dbLevel) => {
        targetVUAngle = mapDBToAngle(dbLevel);
      });
    }

    // Animate VU meter with ballistic motion (fast attack, slow decay)
    function animateVUMeter() {
      const vuSpeed = currentVUAngle < targetVUAngle ? VU_ATTACK_SPEED : VU_DECAY_SPEED;
      currentVUAngle += (targetVUAngle - currentVUAngle) * vuSpeed;

      // Snap to rest position when close
      if (targetVUAngle <= VU_MIN_ANGLE && Math.abs(currentVUAngle - VU_MIN_ANGLE) < VU_SNAP_THRESHOLD) {
        currentVUAngle = VU_MIN_ANGLE;
      }

      vuNeedle.style.transform = `translateX(-50%) rotate(${currentVUAngle}deg)`;
      updateNeedleColor(currentVUAngle);

      requestAnimationFrame(animateVUMeter);
    }

    // ========================================================================
    // INITIALIZE ALL CONTROLS
    // ========================================================================

    // Get parameter states
    const lfFreqState = getSliderState("lf_freq");
    const lfGainState = getSliderState("lf_gain");
    const lfOnState = getToggleState("lf_on");

    const lmfFreqState = getSliderState("lmf_freq");
    const lmfGainState = getSliderState("lmf_gain");
    const lmfQState = getComboBoxState("lmf_q");
    const lmfOnState = getToggleState("lmf_on");

    const hmfFreqState = getSliderState("hmf_freq");
    const hmfGainState = getSliderState("hmf_gain");
    const hmfQState = getComboBoxState("hmf_q");
    const hmfOnState = getToggleState("hmf_on");

    const hfFreqState = getSliderState("hf_freq");
    const hfGainState = getSliderState("hf_gain");
    const hfOnState = getToggleState("hf_on");

    const outputGainState = getSliderState("output_gain");
    const analogState = getToggleState("analog");

    // Setup dual-layer knobs with distance-based detection
    setupDualKnob(
      document.querySelector('[data-param-outer="lf_freq"]'),
      lfFreqState, lfGainState, 'lf_tooltip', 'lf_freq', 'lf_gain'
    );
    setupDualKnob(
      document.querySelector('[data-param-outer="lmf_freq"]'),
      lmfFreqState, lmfGainState, 'lmf_tooltip', 'lmf_freq', 'lmf_gain'
    );
    setupDualKnob(
      document.querySelector('[data-param-outer="hmf_freq"]'),
      hmfFreqState, hmfGainState, 'hmf_tooltip', 'hmf_freq', 'hmf_gain'
    );
    setupDualKnob(
      document.querySelector('[data-param-outer="hf_freq"]'),
      hfFreqState, hfGainState, 'hf_tooltip', 'hf_freq', 'hf_gain'
    );

    // Setup standard knob
    setupStandardKnob(document.getElementById('output_gain'), outputGainState);

    // Setup toggles
    setupToggle(document.getElementById('lf_on'), lfOnState);
    setupToggle(document.getElementById('lmf_on'), lmfOnState);
    setupToggle(document.getElementById('hmf_on'), hmfOnState);
    setupToggle(document.getElementById('hf_on'), hfOnState);
    setupToggle(document.getElementById('analog'), analogState);

    // Setup three-way toggles (Q controls)
    setupThreeWayToggle(document.getElementById('lmf_q'), lmfQState);
    setupThreeWayToggle(document.getElementById('hmf_q'), hmfQState);

    // Start VU meter animation
    animateVUMeter();

    console.log('OuariconAnalogEQ v1.0.3 UI initialized - dual-layer knobs + live VU meter');
  </script>
</body>
</html>

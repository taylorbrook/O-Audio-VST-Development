<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouaricon Analog EQ - UI Mockup v1</title>

  <style>
    /* CRITICAL: WebView constraints */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* Browser test frame - shows actual plugin dimensions */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-height: 100%;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    /* Fixed-size plugin frame */
    .plugin-frame {
      width: 720px;
      height: 380px;
      border: 2px solid #444;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      position: relative;
    }

    /* Main container - fills plugin frame */
    .container {
      width: 100%;
      height: 100%;
      background: #EBD9C7;
      position: relative;
      font-family: Garamond, serif;
      overflow: hidden;
    }

    /* Header section */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 720px;
      height: 50px;
      background: #D4C4B0;
      border-bottom: 2px solid #8B7355;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title {
      font-size: 24px;
      letter-spacing: 0.15em;
      color: #3C2F2F;
      font-weight: normal;
    }

    /* Main controls area */
    .main-controls {
      position: absolute;
      top: 50px;
      left: 0;
      width: 580px;
      height: 330px;
      background: #EBD9C7;
    }

    /* Botanical panel */
    .botanical-panel {
      position: absolute;
      top: 50px;
      right: 0;
      width: 140px;
      height: 330px;
      background: #F5E6D3;
      overflow: hidden;
    }

    .botanical-overlay {
      position: absolute;
      top: 30px;
      left: 5px;
      width: 130px;
      height: 250px;
      opacity: 0.35;
      pointer-events: none;
      object-fit: contain;
    }

    /* Dual-layer knob structure */
    .dual-knob-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dual-knob {
      position: relative;
      width: 85px;
      height: 85px;
    }

    /* Outer ring (frequency) */
    .knob-outer-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #F5DEB3 0deg 180deg, #E8D5B7 180deg 360deg);
      border: 2px solid #8B7355;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 50ms ease-out;
    }

    /* Outer ring frequency indicator arc */
    .knob-outer-ring::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 50%;
      width: 3px;
      height: 15px;
      background: #3C2F2F;
      transform: translateX(-50%);
      border-radius: 2px;
    }

    /* Inner dial (gain) */
    .knob-inner-dial {
      position: absolute;
      inset: 15px;
      border-radius: 50%;
      background: #FFF8DC;
      border: 2px solid #8B7355;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 50ms ease-out;
      z-index: 2;
    }

    /* Inner dial pointer */
    .knob-inner-dial::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 50%;
      width: 2px;
      height: 12px;
      background: #3C2F2F;
      transform: translateX(-50%);
      border-radius: 1px;
    }

    /* Knob label */
    .knob-label {
      margin-top: 8px;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #3C2F2F;
      text-align: center;
      text-transform: uppercase;
    }

    .knob-sublabel {
      margin-top: 2px;
      font-size: 9px;
      letter-spacing: 0.1em;
      color: #5C4033;
      text-align: center;
      text-transform: uppercase;
    }

    /* Value readout */
    .knob-value {
      margin-top: 4px;
      font-size: 11px;
      color: #3C2F2F;
      text-align: center;
      font-family: 'Courier New', monospace;
      min-height: 16px;
    }

    /* Standard knob (output gain) */
    .standard-knob {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .knob-standard {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #F5DEB3 0deg 180deg, #E8D5B7 180deg 360deg);
      border: 2px solid #8B7355;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 50ms ease-out;
    }

    .knob-standard::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 50%;
      width: 2px;
      height: 12px;
      background: #3C2F2F;
      transform: translateX(-50%);
      border-radius: 1px;
    }

    /* Three-way toggle switch (Q control) */
    .three-way-toggle {
      position: absolute;
      display: flex;
      align-items: center;
      background: #D4C4B0;
      border: 2px solid #8B7355;
      border-radius: 4px;
      padding: 4px;
      cursor: pointer;
    }

    .toggle-option {
      flex: 1;
      padding: 4px 8px;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-align: center;
      color: #5C4033;
      border-radius: 2px;
      transition: all 150ms;
    }

    .toggle-option.active {
      background: #6B8E4E;
      color: #FFF8DC;
    }

    /* Simple toggle button (ON switches) */
    .simple-toggle {
      position: absolute;
      padding: 4px 10px;
      font-size: 9px;
      letter-spacing: 0.1em;
      background: #8B7355;
      color: #FFF8DC;
      border: 2px solid #5C4033;
      border-radius: 3px;
      cursor: pointer;
      transition: all 200ms;
    }

    .simple-toggle.active {
      background: #6B8E4E;
      border-color: #3C5C1A;
    }

    /* Analog toggle (larger) */
    .analog-toggle {
      position: absolute;
      padding: 6px 16px;
      font-size: 10px;
      letter-spacing: 0.12em;
      background: #8B7355;
      color: #FFF8DC;
      border: 2px solid #5C4033;
      border-radius: 4px;
      cursor: pointer;
      transition: all 200ms;
      text-transform: uppercase;
    }

    .analog-toggle.active {
      background: #6B8E4E;
      border-color: #3C5C1A;
    }

    /* Debug monitor (test HTML only) */
    .debug-monitor {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 4px;
      min-width: 200px;
      pointer-events: none;
      z-index: 10000;
    }

    .debug-label {
      color: #666;
      font-size: 9px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .debug-param {
      font-weight: bold;
      color: #0f0;
    }

    .debug-value {
      color: #fff;
      margin-top: 2px;
    }

    .debug-normalized {
      color: #888;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <!-- Fixed-size plugin frame for testing -->
  <div class="plugin-frame">
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="title">OUARICON ANALOG EQ</div>
      </div>

      <!-- Main controls area -->
      <div class="main-controls">

        <!-- LF Band (Low Frequency Shelf) -->
        <div class="dual-knob-container" style="left: 50px; top: 40px;">
          <div class="dual-knob">
            <div class="knob-outer-ring" id="lf-freq-ring"></div>
            <div class="knob-inner-dial" id="lf-gain-dial"></div>
          </div>
          <div class="knob-label">LOW</div>
          <div class="knob-sublabel">SHELF</div>
          <div class="knob-value" id="lf-value">100 Hz / 0.0 dB</div>
        </div>
        <div class="simple-toggle active" id="lf-on" style="left: 75px; top: 185px;">ON</div>

        <!-- LMF Band (Low-Mid Bell) -->
        <div class="dual-knob-container" style="left: 205px; top: 40px;">
          <div class="dual-knob">
            <div class="knob-outer-ring" id="lmf-freq-ring"></div>
            <div class="knob-inner-dial" id="lmf-gain-dial"></div>
          </div>
          <div class="knob-label">L-MID</div>
          <div class="knob-value" id="lmf-value">500 Hz / 0.0 dB</div>
        </div>
        <div class="three-way-toggle" id="lmf-q" style="left: 195px; top: 155px; width: 105px; height: 28px;">
          <div class="toggle-option" data-value="0">WIDE</div>
          <div class="toggle-option active" data-value="1">MED</div>
          <div class="toggle-option" data-value="2">TIGHT</div>
        </div>
        <div class="simple-toggle active" id="lmf-on" style="left: 230px; top: 190px;">ON</div>

        <!-- HMF Band (High-Mid Bell) -->
        <div class="dual-knob-container" style="left: 360px; top: 40px;">
          <div class="dual-knob">
            <div class="knob-outer-ring" id="hmf-freq-ring"></div>
            <div class="knob-inner-dial" id="hmf-gain-dial"></div>
          </div>
          <div class="knob-label">H-MID</div>
          <div class="knob-value" id="hmf-value">2000 Hz / 0.0 dB</div>
        </div>
        <div class="three-way-toggle" id="hmf-q" style="left: 350px; top: 155px; width: 105px; height: 28px;">
          <div class="toggle-option" data-value="0">WIDE</div>
          <div class="toggle-option active" data-value="1">MED</div>
          <div class="toggle-option" data-value="2">TIGHT</div>
        </div>
        <div class="simple-toggle active" id="hmf-on" style="left: 385px; top: 190px;">ON</div>

        <!-- HF Band (High Frequency Shelf) -->
        <div class="dual-knob-container" style="left: 490px; top: 40px;">
          <div class="dual-knob">
            <div class="knob-outer-ring" id="hf-freq-ring"></div>
            <div class="knob-inner-dial" id="hf-gain-dial"></div>
          </div>
          <div class="knob-label">HIGH</div>
          <div class="knob-sublabel">SHELF</div>
          <div class="knob-value" id="hf-value">8000 Hz / 0.0 dB</div>
        </div>
        <div class="simple-toggle active" id="hf-on" style="left: 515px; top: 185px;">ON</div>

        <!-- Global controls -->
        <div class="standard-knob" style="left: 80px; top: 235px;">
          <div class="knob-standard" id="output-gain"></div>
          <div class="knob-label" style="margin-top: 6px;">OUTPUT</div>
          <div class="knob-value" id="output-value">0.0 dB</div>
        </div>

        <div class="analog-toggle active" id="analog" style="left: 180px; top: 250px;">ANALOG</div>

      </div>

      <!-- Botanical panel -->
      <div class="botanical-panel">
        <img
          class="botanical-overlay"
          src="file:///Users/taylorbrook/Dev/Ouaricon%20Audio%20Images/flora/flower_ferdinandibauer00baue_0021.png"
          alt="Botanical illustration"
        />
      </div>

    </div>
  </div>

  <!-- Debug monitor -->
  <div class="debug-monitor">
    <div class="debug-label">PARAMETER MONITOR</div>
    <div class="debug-param" id="debugParam">—</div>
    <div class="debug-value" id="debugValue">—</div>
    <div class="debug-normalized" id="debugNormalized">—</div>
  </div>

  <script>
    // Mock JUCE backend for browser testing
    window.Juce = {
      getSliderState: (id) => ({
        normalisedValue: 0.5,
        getNormalisedValue: () => 0.5,
        setNormalisedValue: (v) => console.log(`${id} set to ${v}`),
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      }),
      getToggleState: (id) => ({
        value: true,
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      }),
      getComboBoxState: (id) => ({
        selectedId: 1,
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      })
    };

    // Disable context menu (REQUIRED)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // Dual-layer knob interaction state
    const dualKnobs = {
      lf: { freq: 100, gain: 0, freqMin: 30, freqMax: 500, gainMin: -12, gainMax: 12 },
      lmf: { freq: 500, gain: 0, freqMin: 100, freqMax: 2000, gainMin: -12, gainMax: 12 },
      hmf: { freq: 2000, gain: 0, freqMin: 500, freqMax: 8000, gainMin: -12, gainMax: 12 },
      hf: { freq: 8000, gain: 0, freqMin: 2000, freqMax: 20000, gainMin: -12, gainMax: 12 }
    };

    // Standard knob state
    let outputGain = 0;

    // Toggle states
    let lfOn = true, lmfOn = true, hmfOn = true, hfOn = true, analogOn = true;
    let lmfQ = 1, hmfQ = 1; // 0=WIDE, 1=MED, 2=TIGHT

    // Debug monitor update
    function updateDebugMonitor(paramId, value, normalizedValue) {
      document.getElementById('debugParam').textContent = paramId;
      document.getElementById('debugValue').textContent = value;
      document.getElementById('debugNormalized').textContent = `${(normalizedValue * 100).toFixed(1)}%`;
    }

    // Format frequency value
    function formatFreq(hz) {
      if (hz >= 1000) return `${(hz / 1000).toFixed(1)}k Hz`;
      return `${Math.round(hz)} Hz`;
    }

    // Update dual-layer knob visuals and value display
    function updateDualKnob(band) {
      const data = dualKnobs[band];

      // Calculate rotation angles (-135° to +135°)
      const freqNorm = (data.freq - data.freqMin) / (data.freqMax - data.freqMin);
      const gainNorm = (data.gain - data.gainMin) / (data.gainMax - data.gainMin);

      const freqDeg = -135 + (freqNorm * 270);
      const gainDeg = -135 + (gainNorm * 270);

      // Apply rotations
      document.getElementById(`${band}-freq-ring`).style.transform = `rotate(${freqDeg}deg)`;
      document.getElementById(`${band}-gain-dial`).style.transform = `rotate(${gainDeg}deg)`;

      // Update value display
      const valueEl = document.getElementById(`${band}-value`);
      valueEl.textContent = `${formatFreq(data.freq)} / ${data.gain.toFixed(1)} dB`;
    }

    // Update standard knob
    function updateOutputKnob() {
      const norm = (outputGain + 12) / 24; // -12 to +12 mapped to 0-1
      const deg = -135 + (norm * 270);
      document.getElementById('output-gain').style.transform = `rotate(${deg}deg)`;
      document.getElementById('output-value').textContent = `${outputGain.toFixed(1)} dB`;
    }

    // Dual-layer knob drag handlers
    function setupDualKnobDrag(band, isOuter) {
      const element = isOuter
        ? document.getElementById(`${band}-freq-ring`)
        : document.getElementById(`${band}-gain-dial`);

      let isDragging = false;
      let startY = 0;
      let startValue = 0;

      element.addEventListener('mousedown', (e) => {
        isDragging = true;
        startY = e.clientY;
        startValue = isOuter ? dualKnobs[band].freq : dualKnobs[band].gain;
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const delta = (startY - e.clientY) * 0.5; // Sensitivity
        const data = dualKnobs[band];

        if (isOuter) {
          // Frequency control
          const range = data.freqMax - data.freqMin;
          const newFreq = Math.max(data.freqMin, Math.min(data.freqMax, startValue + delta * (range / 100)));
          data.freq = Math.round(newFreq);
          updateDebugMonitor(`${band}_freq`, formatFreq(data.freq), (data.freq - data.freqMin) / range);
        } else {
          // Gain control
          const range = data.gainMax - data.gainMin;
          const newGain = Math.max(data.gainMin, Math.min(data.gainMax, startValue + delta * (range / 100)));
          data.gain = Math.round(newGain * 10) / 10;
          updateDebugMonitor(`${band}_gain`, `${data.gain.toFixed(1)} dB`, (data.gain - data.gainMin) / range);
        }

        updateDualKnob(band);
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    // Standard knob drag handler
    function setupStandardKnobDrag() {
      const element = document.getElementById('output-gain');
      let isDragging = false;
      let startY = 0;
      let startValue = 0;

      element.addEventListener('mousedown', (e) => {
        isDragging = true;
        startY = e.clientY;
        startValue = outputGain;
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const delta = (startY - e.clientY) * 0.5;
        const newGain = Math.max(-12, Math.min(12, startValue + delta * 0.24));
        outputGain = Math.round(newGain * 10) / 10;

        updateDebugMonitor('output_gain', `${outputGain.toFixed(1)} dB`, (outputGain + 12) / 24);
        updateOutputKnob();
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    // Three-way toggle handler
    function setupThreeWayToggle(id, updateFn) {
      const container = document.getElementById(id);
      const options = container.querySelectorAll('.toggle-option');

      options.forEach((option, index) => {
        option.addEventListener('click', () => {
          options.forEach(opt => opt.classList.remove('active'));
          option.classList.add('active');
          updateFn(index);
        });
      });
    }

    // Simple toggle handler
    function setupSimpleToggle(id, updateFn) {
      const element = document.getElementById(id);
      element.addEventListener('click', () => {
        element.classList.toggle('active');
        updateFn(element.classList.contains('active'));
      });
    }

    // Initialize all controls
    document.addEventListener('DOMContentLoaded', () => {
      // Setup dual-layer knobs
      ['lf', 'lmf', 'hmf', 'hf'].forEach(band => {
        setupDualKnobDrag(band, true);  // Outer ring (frequency)
        setupDualKnobDrag(band, false); // Inner dial (gain)
        updateDualKnob(band);
      });

      // Setup standard knob
      setupStandardKnobDrag();
      updateOutputKnob();

      // Setup three-way toggles
      setupThreeWayToggle('lmf-q', (value) => {
        lmfQ = value;
        updateDebugMonitor('lmf_q', ['WIDE', 'MED', 'TIGHT'][value], value / 2);
      });

      setupThreeWayToggle('hmf-q', (value) => {
        hmfQ = value;
        updateDebugMonitor('hmf_q', ['WIDE', 'MED', 'TIGHT'][value], value / 2);
      });

      // Setup simple toggles
      setupSimpleToggle('lf-on', (active) => {
        lfOn = active;
        updateDebugMonitor('lf_on', active ? 'ON' : 'OFF', active ? 1.0 : 0.0);
      });

      setupSimpleToggle('lmf-on', (active) => {
        lmfOn = active;
        updateDebugMonitor('lmf_on', active ? 'ON' : 'OFF', active ? 1.0 : 0.0);
      });

      setupSimpleToggle('hmf-on', (active) => {
        hmfOn = active;
        updateDebugMonitor('hmf_on', active ? 'ON' : 'OFF', active ? 1.0 : 0.0);
      });

      setupSimpleToggle('hf-on', (active) => {
        hfOn = active;
        updateDebugMonitor('hf_on', active ? 'ON' : 'OFF', active ? 1.0 : 0.0);
      });

      setupSimpleToggle('analog', (active) => {
        analogOn = active;
        updateDebugMonitor('analog', active ? 'ON' : 'OFF', active ? 1.0 : 0.0);
      });

      console.log('✅ Ouaricon Analog EQ v1 mockup initialized');
      console.log('Interact with controls to test parameter bindings');
    });
  </script>
</body>
</html>

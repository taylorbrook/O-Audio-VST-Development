<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OuariconAnalogEQ UI Mockup v3</title>

  <style>
    /* CRITICAL: WebView constraints */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      /* Native application feel */
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;

      /* Center plugin frame in viewport */
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: Garamond, serif;
    }

    /* Fixed-size preview frame (test HTML only) */
    .plugin-frame {
      width: 920px;
      height: 220px;
      border: 2px solid #444;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
    }

    /* Main container - fills frame */
    .container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Paper texture background layer */
    .paper-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* Large rotated botanical overlay */
    .botanical-overlay {
      position: absolute;
      top: -150px;
      left: 200px;
      width: 500px;
      height: 500px;
      background-image: url('flower_ferdinandibauer00baue_0021.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.45;
      transform: rotate(90deg);
      transform-origin: center center;
      z-index: 1;
      pointer-events: none;
    }

    /* Content layer (controls) */
    .content-layer {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Header border */
    .header-border {
      position: absolute;
      top: 45px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #8B7355;
    }

    /* Title */
    .title {
      position: absolute;
      top: 12px;
      left: 320px;
      width: 280px;
      height: 24px;
      font-family: Garamond, serif;
      font-size: 18px;
      text-align: center;
      letter-spacing: 0.15em;
      color: #3C2F2F;
      line-height: 24px;
    }

    /* Band labels */
    .band-label {
      font-family: Garamond, serif;
      font-size: 10px;
      text-align: center;
      letter-spacing: 0.12em;
      color: #3C2F2F;
      font-weight: 600;
      position: absolute;
    }

    .sublabel {
      font-family: Garamond, serif;
      font-size: 8px;
      text-align: center;
      letter-spacing: 0.1em;
      color: #5C4033;
      position: absolute;
    }

    /* Dual-layer knob container */
    .dual-knob-container {
      position: absolute;
      width: 65px;
      height: 65px;
    }

    /* Outer ring - frequency control (v1 seed style) */
    .knob-outer {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 75%, #C9A27B 75%, #C9A27B 85%, #8B7355 85%);
      border: 2px solid #8B7355;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 50ms;
      z-index: 1;
    }

    /* Inner dial - gain control with 10-segment seed cross-section */
    .knob-inner {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background:
        radial-gradient(circle, #FFF8DC 0%, #FFF8DC 20%, transparent 20%),
        conic-gradient(from 0deg,
          #F5DEB3 0deg, #F5DEB3 35deg, #8B7355 35deg, #8B7355 36deg,
          #E8D5B7 36deg, #E8D5B7 71deg, #8B7355 71deg, #8B7355 72deg,
          #F5DEB3 72deg, #F5DEB3 107deg, #8B7355 107deg, #8B7355 108deg,
          #E8D5B7 108deg, #E8D5B7 143deg, #8B7355 143deg, #8B7355 144deg,
          #F5DEB3 144deg, #F5DEB3 179deg, #8B7355 179deg, #8B7355 180deg,
          #E8D5B7 180deg, #E8D5B7 215deg, #8B7355 215deg, #8B7355 216deg,
          #F5DEB3 216deg, #F5DEB3 251deg, #8B7355 251deg, #8B7355 252deg,
          #E8D5B7 252deg, #E8D5B7 287deg, #8B7355 287deg, #8B7355 288deg,
          #F5DEB3 288deg, #F5DEB3 323deg, #8B7355 323deg, #8B7355 324deg,
          #E8D5B7 324deg, #E8D5B7 359deg, #8B7355 359deg, #8B7355 360deg
        );
      border: 2px solid #8B7355;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 50ms;
      z-index: 2;
    }

    /* Pointer indicator on inner dial */
    .knob-pointer {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 12px;
      background: #3C2F2F;
      pointer-events: none;
    }

    /* Standard single-layer knob (output gain) */
    .standard-knob {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #D4B896, #C9A27B);
      border: 2px solid #8B7355;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 50ms;
    }

    .standard-knob .knob-pointer {
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 14px;
      background: #3C2F2F;
      pointer-events: none;
      position: absolute;
    }

    /* Toggle switches */
    .toggle {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #8B7355;
      border: 1px solid #5C4033;
      border-radius: 3px;
      font-family: Garamond, serif;
      font-size: 8px;
      letter-spacing: 0.08em;
      color: #FFF;
      cursor: pointer;
      transition: background 100ms;
      text-align: center;
      padding: 2px 4px;
    }

    .toggle.active {
      background: #6B8E4E;
      border-color: #3C5C1A;
    }

    .toggle-large {
      font-size: 9px;
      padding: 4px 8px;
    }

    /* Three-way Q toggle */
    .three-way-toggle {
      position: absolute;
      display: flex;
      gap: 1px;
      background: #8B7355;
      border: 1px solid #5C4033;
      border-radius: 3px;
      overflow: hidden;
    }

    .three-way-option {
      flex: 1;
      padding: 3px 6px;
      font-family: Garamond, serif;
      font-size: 7px;
      letter-spacing: 0.08em;
      color: #FFF;
      cursor: pointer;
      text-align: center;
      background: #8B7355;
      transition: background 100ms;
    }

    .three-way-option.active {
      background: #6B8E4E;
    }

    /* VU Meter */
    .vu-meter {
      position: absolute;
      width: 70px;
      height: 70px;
      background: rgba(139, 168, 112, 0.2);
      border: 2px solid #3C5C1A;
      border-radius: 50%;
    }

    .vu-meter svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .vu-meter-needle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 25px;
      background: #3C5C1A;
      transform-origin: bottom center;
      transform: translate(-50%, -100%) rotate(-45deg);
      transition: transform 100ms;
      pointer-events: none;
    }

    .vu-meter-pivot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #5C4033;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
    }

    /* Value display tooltips */
    .value-display {
      position: absolute;
      background: rgba(60, 47, 47, 0.95);
      color: #F5E6D3;
      font-family: Garamond, serif;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 150ms;
      white-space: nowrap;
      z-index: 100;
    }

    .value-display.visible {
      opacity: 1;
    }

    /* Debug monitor (test HTML only) */
    .debug-monitor {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 4px;
      min-width: 150px;
      pointer-events: none;
      z-index: 10000;
    }

    .debug-label {
      color: #666;
      font-size: 9px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .debug-param {
      font-weight: bold;
      color: #0f0;
    }

    .debug-value {
      color: #fff;
      margin-top: 2px;
    }

    .debug-normalized {
      color: #888;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="plugin-frame">
    <div class="container">
      <!-- Background layers -->
      <div class="paper-background"></div>
      <div class="botanical-overlay"></div>

      <!-- Content layer -->
      <div class="content-layer">
        <!-- Header -->
        <div class="header-border"></div>
        <div class="title">OUARICON ANALOG EQ</div>

        <!-- LF BAND -->
        <div class="band-label" style="top: 55px; left: 45px; width: 65px;">LF</div>
        <div class="dual-knob-container" style="top: 75px; left: 38px;" data-param-outer="lf_freq" data-param-inner="lf_gain">
          <div class="knob-outer" id="lf_freq_knob"></div>
          <div class="knob-inner" id="lf_gain_knob">
            <div class="knob-pointer"></div>
          </div>
        </div>
        <div class="sublabel" style="top: 150px; left: 45px; width: 65px;">SHELF</div>
        <div class="toggle" id="lf_on" style="top: 170px; left: 53px; width: 32px; height: 16px;">[ON]</div>

        <!-- LMF BAND -->
        <div class="band-label" style="top: 55px; left: 188px; width: 65px;">LMF</div>
        <div class="dual-knob-container" style="top: 75px; left: 181px;" data-param-outer="lmf_freq" data-param-inner="lmf_gain">
          <div class="knob-outer" id="lmf_freq_knob"></div>
          <div class="knob-inner" id="lmf_gain_knob">
            <div class="knob-pointer"></div>
          </div>
        </div>
        <div class="three-way-toggle" id="lmf_q" style="top: 150px; left: 173px; width: 82px; height: 18px;">
          <div class="three-way-option" data-value="0">WIDE</div>
          <div class="three-way-option active" data-value="1">MED</div>
          <div class="three-way-option" data-value="2">TIGHT</div>
        </div>
        <div class="toggle" id="lmf_on" style="top: 174px; left: 196px; width: 32px; height: 16px;">[ON]</div>

        <!-- HMF BAND -->
        <div class="band-label" style="top: 55px; left: 331px; width: 65px;">HMF</div>
        <div class="dual-knob-container" style="top: 75px; left: 324px;" data-param-outer="hmf_freq" data-param-inner="hmf_gain">
          <div class="knob-outer" id="hmf_freq_knob"></div>
          <div class="knob-inner" id="hmf_gain_knob">
            <div class="knob-pointer"></div>
          </div>
        </div>
        <div class="three-way-toggle" id="hmf_q" style="top: 150px; left: 316px; width: 82px; height: 18px;">
          <div class="three-way-option" data-value="0">WIDE</div>
          <div class="three-way-option active" data-value="1">MED</div>
          <div class="three-way-option" data-value="2">TIGHT</div>
        </div>
        <div class="toggle" id="hmf_on" style="top: 174px; left: 339px; width: 32px; height: 16px;">[ON]</div>

        <!-- HF BAND -->
        <div class="band-label" style="top: 55px; left: 474px; width: 65px;">HF</div>
        <div class="dual-knob-container" style="top: 75px; left: 467px;" data-param-outer="hf_freq" data-param-inner="hf_gain">
          <div class="knob-outer" id="hf_freq_knob"></div>
          <div class="knob-inner" id="hf_gain_knob">
            <div class="knob-pointer"></div>
          </div>
        </div>
        <div class="sublabel" style="top: 150px; left: 474px; width: 65px;">SHELF</div>
        <div class="toggle" id="hf_on" style="top: 170px; left: 482px; width: 32px; height: 16px;">[ON]</div>

        <!-- GLOBAL CONTROLS -->
        <div class="band-label" style="top: 55px; left: 602px; width: 55px;">OUT</div>
        <div class="standard-knob" id="output_gain" style="top: 80px; left: 610px;">
          <div class="knob-pointer"></div>
        </div>
        <div class="toggle toggle-large active" id="analog" style="top: 160px; left: 590px; width: 75px; height: 22px;">[ANALOG]</div>

        <!-- VU METER -->
        <div class="sublabel" style="top: 160px; left: 815px; width: 70px;">LEVEL</div>
        <div class="vu-meter" style="top: 75px; left: 825px;">
          <svg viewBox="0 0 70 70">
            <path d="M 15 55 A 20 20 0 0 1 55 55" fill="none" stroke="#8B7355" stroke-width="1"/>
            <text x="12" y="52" font-size="6" fill="#3C2F2F">-20</text>
            <text x="20" y="38" font-size="6" fill="#3C2F2F">-10</text>
            <text x="31" y="30" font-size="6" fill="#3C2F2F">0</text>
            <text x="46" y="38" font-size="6" fill="#3C2F2F">+3</text>
          </svg>
          <div class="vu-meter-needle" id="vu_needle"></div>
          <div class="vu-meter-pivot"></div>
        </div>

        <!-- Value display tooltip -->
        <div class="value-display" id="valueDisplay"></div>
      </div>
    </div>
  </div>

  <!-- Debug monitor (test HTML only) -->
  <div class="debug-monitor">
    <div class="debug-label">PARAMETER MONITOR</div>
    <div class="debug-param" id="debugParam">—</div>
    <div class="debug-value" id="debugValue">—</div>
    <div class="debug-normalized" id="debugNormalized">—</div>
  </div>

  <script>
    // Mock JUCE backend for browser testing
    window.Juce = {
      getSliderState: (id) => ({
        normalisedValue: 0.5,
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      }),
      getToggleState: (id) => ({
        value: id === 'analog',  // Analog defaults to on
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      }),
      getComboBoxState: (id) => ({
        selectedId: 1,  // Default to MED
        valueChangedEvent: {
          addListener: (fn) => console.log(`Listener added for ${id}`)
        }
      })
    };

    // Disable context menu (REQUIRED)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // Parameter ranges
    const paramRanges = {
      lf_freq: { min: 30, max: 500, default: 100, unit: 'Hz', decimals: 0 },
      lf_gain: { min: -12, max: 12, default: 0, unit: 'dB', decimals: 1 },
      lmf_freq: { min: 100, max: 2000, default: 500, unit: 'Hz', decimals: 0 },
      lmf_gain: { min: -12, max: 12, default: 0, unit: 'dB', decimals: 1 },
      hmf_freq: { min: 500, max: 8000, default: 2000, unit: 'Hz', decimals: 0 },
      hmf_gain: { min: -12, max: 12, default: 0, unit: 'dB', decimals: 1 },
      hf_freq: { min: 2000, max: 20000, default: 8000, unit: 'Hz', decimals: 0 },
      hf_gain: { min: -12, max: 12, default: 0, unit: 'dB', decimals: 1 },
      output_gain: { min: -12, max: 12, default: 0, unit: 'dB', decimals: 1 }
    };

    // Current parameter values
    const paramValues = {};
    Object.keys(paramRanges).forEach(key => {
      paramValues[key] = paramRanges[key].default;
    });

    // Update debug monitor
    function updateDebugMonitor(paramId, value, normalizedValue) {
      document.getElementById('debugParam').textContent = paramId;
      document.getElementById('debugValue').textContent = formatValue(paramId, value);
      document.getElementById('debugNormalized').textContent = `${(normalizedValue * 100).toFixed(1)}%`;
    }

    // Format value with unit
    function formatValue(paramId, value) {
      const range = paramRanges[paramId];
      if (!range) return value.toFixed(1);
      return value.toFixed(range.decimals) + range.unit;
    }

    // Update knob rotation
    function updateKnobRotation(paramId, value) {
      const range = paramRanges[paramId];
      const normalized = (value - range.min) / (range.max - range.min);
      const degrees = -135 + (normalized * 270);  // -135° to +135°

      const knobElement = document.getElementById(paramId + '_knob');
      if (knobElement) {
        knobElement.style.transform = `rotate(${degrees}deg)`;
      }

      updateDebugMonitor(paramId, value, normalized);
    }

    // Update VU meter needle based on output gain
    function updateVUMeter(gainValue) {
      const needle = document.getElementById('vu_needle');
      // Map -12dB to +12dB → -45° to +45°
      const normalized = (gainValue + 12) / 24;  // 0 to 1
      const degrees = -45 + (normalized * 90);   // -45° to +45°
      needle.style.transform = `translate(-50%, -100%) rotate(${degrees}deg)`;
    }

    // Dual-layer knob interaction
    function setupDualKnob(container) {
      const outerParam = container.dataset.paramOuter;
      const innerParam = container.dataset.paramInner;
      const outerKnob = container.querySelector('.knob-outer');
      const innerKnob = container.querySelector('.knob-inner');

      let isDragging = false;
      let currentParam = null;
      let startY = 0;
      let startValue = 0;

      function handleMouseDown(e, param, isOuter) {
        isDragging = true;
        currentParam = param;
        startY = e.clientY;
        startValue = paramValues[param];
        e.preventDefault();

        // Bring active layer to front
        if (isOuter) {
          outerKnob.style.zIndex = 3;
        } else {
          innerKnob.style.zIndex = 3;
        }
      }

      outerKnob.addEventListener('mousedown', (e) => handleMouseDown(e, outerParam, true));
      innerKnob.addEventListener('mousedown', (e) => handleMouseDown(e, innerParam, false));

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const deltaY = startY - e.clientY;
        const range = paramRanges[currentParam];
        const sensitivity = (range.max - range.min) / 200;
        let newValue = startValue + (deltaY * sensitivity);
        newValue = Math.max(range.min, Math.min(range.max, newValue));

        paramValues[currentParam] = newValue;
        updateKnobRotation(currentParam, newValue);

        // Update VU meter if output gain changed
        if (currentParam === 'output_gain') {
          updateVUMeter(newValue);
        }
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
        currentParam = null;
        outerKnob.style.zIndex = 1;
        innerKnob.style.zIndex = 2;
      });
    }

    // Standard knob interaction
    function setupStandardKnob(knob, paramId) {
      let isDragging = false;
      let startY = 0;
      let startValue = 0;

      knob.addEventListener('mousedown', (e) => {
        isDragging = true;
        startY = e.clientY;
        startValue = paramValues[paramId];
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const deltaY = startY - e.clientY;
        const range = paramRanges[paramId];
        const sensitivity = (range.max - range.min) / 200;
        let newValue = startValue + (deltaY * sensitivity);
        newValue = Math.max(range.min, Math.min(range.max, newValue));

        paramValues[paramId] = newValue;
        updateKnobRotation(paramId, newValue);

        // Update VU meter
        updateVUMeter(newValue);
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    // Toggle interaction
    function setupToggle(toggle, paramId) {
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('active');
        const isActive = toggle.classList.contains('active');
        console.log(`${paramId}: ${isActive}`);
        updateDebugMonitor(paramId, isActive ? 'ON' : 'OFF', isActive ? 1 : 0);
      });
    }

    // Three-way toggle interaction
    function setupThreeWayToggle(container, paramId) {
      const options = container.querySelectorAll('.three-way-option');
      options.forEach(option => {
        option.addEventListener('click', () => {
          options.forEach(opt => opt.classList.remove('active'));
          option.classList.add('active');
          const value = parseInt(option.dataset.value);
          const labels = ['WIDE', 'MED', 'TIGHT'];
          console.log(`${paramId}: ${labels[value]}`);
          updateDebugMonitor(paramId, labels[value], value / 2);
        });
      });
    }

    // Initialize all controls
    document.addEventListener('DOMContentLoaded', () => {
      // Setup dual-layer knobs
      document.querySelectorAll('.dual-knob-container').forEach(container => {
        setupDualKnob(container);
      });

      // Initialize knob rotations
      Object.keys(paramRanges).forEach(paramId => {
        updateKnobRotation(paramId, paramValues[paramId]);
      });

      // Setup standard knob
      setupStandardKnob(document.getElementById('output_gain'), 'output_gain');

      // Setup toggles
      setupToggle(document.getElementById('lf_on'), 'lf_on');
      setupToggle(document.getElementById('lmf_on'), 'lmf_on');
      setupToggle(document.getElementById('hmf_on'), 'hmf_on');
      setupToggle(document.getElementById('hf_on'), 'hf_on');
      setupToggle(document.getElementById('analog'), 'analog');

      // Setup three-way toggles
      setupThreeWayToggle(document.getElementById('lmf_q'), 'lmf_q');
      setupThreeWayToggle(document.getElementById('hmf_q'), 'hmf_q');

      // Initialize VU meter
      updateVUMeter(0);

      console.log('OuariconAnalogEQ v3 UI initialized');
      console.log('Features: Paper texture background, large rotated botanical overlay, v1-style seed knobs, VU meter');
    });
  </script>
</body>
</html>

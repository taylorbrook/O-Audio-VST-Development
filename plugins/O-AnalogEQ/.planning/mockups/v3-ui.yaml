    decimals: 1
    position: { x: 324, y: 75 }
    size: { width: 65, height: 65, diameter: 65 }
    dual_layer: true
    layer_role: "inner"
    linked_control: "hmf_freq"
    style:
      type: "dual_layer_knob_seed_v1"
      core_color: "#FFF8DC"
      core_radius_percent: 20

    style:
      type: "dual_layer_knob_seed_v1"
      core_color: "#FFF8DC"
      core_radius_percent: 20
      pointer_color: "#3C2F2F"

  # Q toggle
  - id: lmf_q
    type: combo
    label: ""
    parameter: "lmf_q"
    choices: ["WIDE", "MED", "TIGHT"]
    default: 1
    position: { x: 173, y: 150 }
    size: { width: 82, height: 18 }
    style:
      type: "three_way_toggle"
      font: "Garamond, serif"
      font_size: "7px"
      color_active: "#6B8E4E"
      color_inactive: "#8B7355"

  # ON toggle
  - id: lmf_on
    type: toggle
    label: "[ON]"
    parameter: "lmf_on"
    default: true
    position: { x: 196, y: 174 }
    size: { width: 32, height: 16 }
    style:
      type: "botanical_toggle"
      color_active: "#6B8E4E"
      color_inactive: "#8B7355"

  # === HMF BAND (BELL) ===
  # Band label
  - id: hmf_band_label
    type: label
    text: "HMF"
    position: { x: 331, y: 55 }
    size: { width: 65, height: 16 }
    style:
      font: "Garamond, serif"
      font_size: "10px"
      text_align: center
      letter_spacing: "0.12em"
      color: "#3C2F2F"
      font_weight: "600"
    layer: decorative

  # Dual-layer knob - outer ring (frequency)
  - id: hmf_freq
    type: slider
    label: ""
    parameter: "hmf_freq"
    range: [500.0, 8000.0]
    default: 2000.0
    unit: "Hz"
    decimals: 0
    position: { x: 324, y: 75 }
    size: { width: 65, height: 65, diameter: 65 }
    dual_layer: true
    layer_role: "outer"
    linked_control: "hmf_gain"
    style:
      type: "dual_layer_knob_seed_v1"
      outer_ring_color: "#C9A27B"
      outer_ring_border: "#8B7355"
      segments: 10
      segment_color_1: "#F5DEB3"
      segment_color_2: "#E8D5B7"
      segment_divider: "#8B7355"
      border_width: "2px"

  # Dual-layer knob - inner dial (gain) - seed cross-section pattern
  - id: hmf_gain
    type: slider
    label: ""

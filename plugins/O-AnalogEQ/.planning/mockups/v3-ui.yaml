  # Dual-layer knob - outer ring (frequency)
  - id: lmf_freq
    type: slider
    label: ""
    parameter: "lmf_freq"
    range: [100.0, 2000.0]
    default: 500.0
    unit: "Hz"
    decimals: 0
    position: { x: 181, y: 75 }

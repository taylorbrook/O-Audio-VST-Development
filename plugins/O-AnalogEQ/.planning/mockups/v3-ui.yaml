# v3 UI Design Specification
# Generated: 2026-01-11
# Plugin: OuariconAnalogEQ
# Layout: Compact rack-unit horizontal (900-950px wide × 200-230px tall)
# Aesthetic: Ouaricon Audio Naturalist with paper texture + large rotated botanical overlay
# Iteration: v3 - Paper background, large rotated flower, v1-style seed knobs, VU meter added

window:
  width: 920
  height: 220
  resizable: false

colors:
  # Aged paper palette
  background_texture: "paper1.jpg"
  walnut_brown: "#8B7355"
  dark_brown: "#5C4033"
  text_primary: "#3C2F2F"
  botanical_green: "#8BA870"
  green_active: "#6B8E4E"
  green_border: "#3C5C1A"
  knob_ring: "#C9A27B"
  knob_segment_1: "#F5DEB3"
  knob_segment_2: "#E8D5B7"
  knob_core: "#FFF8DC"
  vu_green: "#3C5C1A"
  vu_background: "rgba(139, 168, 112, 0.2)"

typography:
  title_font: "Garamond, serif"
  label_font: "Garamond, serif"
  title_size: "18px"
  label_size: "10px"
  sublabel_size: "8px"
  value_size: "9px"
  letter_spacing: "0.15em"

layout:
  type: horizontal_single_row_compact
  description: "Compact rack-unit style - single row with tight vertical dimension"
  spacing_between_bands: 35
  edge_margin: 20

controls:
  # Header title (non-interactive display element)
  - id: title
    type: label
    text: "OUARICON ANALOG EQ"
    position: { x: 320, y: 12 }
    size: { width: 280, height: 24 }
    style:
      font: "Garamond, serif"
      font_size: "18px"
      text_align: center
      letter_spacing: "0.15em"
      color: "#3C2F2F"
    layer: decorative

  # === LF BAND (SHELF) ===
  # Band label
  - id: lf_band_label
    type: label
    text: "LF"
    position: { x: 45, y: 55 }
    size: { width: 65, height: 16 }
    style:
      font: "Garamond, serif"
      font_size: "10px"
      text_align: center
      letter_spacing: "0.12em"
      color: "#3C2F2F"
      font_weight: "600"
    layer: decorative

  # Dual-layer knob - outer ring (frequency)
  - id: lf_freq
    type: slider
    label: ""
    parameter: "lf_freq"
    range: [30.0, 500.0]
    default: 100.0
    unit: "Hz"
    decimals: 0
    position: { x: 38, y: 75 }
    size: { width: 65, height: 65, diameter: 65 }
    dual_layer: true
    layer_role: "outer"
    linked_control: "lf_gain"
    style:
      type: "dual_layer_knob_seed_v1"
      outer_ring_color: "#C9A27B"
      outer_ring_border: "#8B7355"
      segments: 10
      segment_color_1: "#F5DEB3"
      segment_color_2: "#E8D5B7"
      segment_divider: "#8B7355"
      border_width: "2px"

  # Dual-layer knob - inner dial (gain) - seed cross-section pattern
  - id: lf_gain
    type: slider
    label: ""
    parameter: "lf_gain"
    range: [-12.0, 12.0]
    default: 0.0
    unit: "dB"
    decimals: 1
    position: { x: 38, y: 75 }
    size: { width: 65, height: 65, diameter: 65 }
    dual_layer: true
    layer_role: "inner"
    linked_control: "lf_freq"
    style:
      type: "dual_layer_knob_seed_v1"
      core_color: "#FFF8DC"
      core_radius_percent: 20
      pointer_color: "#3C2F2F"

  # Type label
  - id: lf_type_label
    type: label
    text: "SHELF"
    position: { x: 45, y: 150 }
    size: { width: 65, height: 14 }
    style:
      font: "Garamond, serif"
      font_size: "8px"
      text_align: center
      letter_spacing: "0.1em"
      color: "#5C4033"
    layer: decorative

  # ON toggle
  - id: lf_on
    type: toggle
    label: "[ON]"
    parameter: "lf_on"
    default: true
    position: { x: 53, y: 170 }
    size: { width: 32, height: 16 }
    style:
      type: "botanical_toggle"
      color_active: "#6B8E4E"
      color_inactive: "#8B7355"

  # === LMF BAND (BELL) ===
  # Band label
  - id: lmf_band_label
    type: label
    text: "LMF"
    position: { x: 188, y: 55 }
    size: { width: 65, height: 16 }

  # === HF BAND (SHELF) ===
  # Band label
  - id: hf_band_label
    type: label
    text: "HF"
    position: { x: 474, y: 55 }
    size: { width: 65, height: 16 }
    style:
      font: "Garamond, serif"
      font_size: "10px"
      text_align: center
      letter_spacing: "0.12em"
      color: "#3C2F2F"
      font_weight: "600"
    layer: decorative

  # Dual-layer knob - outer ring (frequency)
  - id: hf_freq
    type: slider
    label: ""
    parameter: "hf_freq"
    range: [2000.0, 20000.0]
    default: 8000.0
    unit: "Hz"
    decimals: 0
    position: { x: 467, y: 75 }
    size: { width: 65, height: 65, diameter: 65 }
    dual_layer: true
    layer_role: "outer"
    linked_control: "hf_gain"
    style:
      type: "dual_layer_knob_seed_v1"
      outer_ring_color: "#C9A27B"
      outer_ring_border: "#8B7355"
      segments: 10
      segment_color_1: "#F5DEB3"
      segment_color_2: "#E8D5B7"

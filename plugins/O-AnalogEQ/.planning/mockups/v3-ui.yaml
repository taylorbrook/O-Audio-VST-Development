  # === GLOBAL CONTROLS (CENTER-RIGHT) ===
  # OUTPUT section label
  - id: output_label
    type: label
    text: "OUT"
    position: { x: 602, y: 55 }
    size: { width: 55, height: 16 }
    style:
      font: "Garamond, serif"
      font_size: "10px"
      text_align: center
      letter_spacing: "0.12em"
      color: "#3C2F2F"
      font_weight: "600"
    layer: decorative

  # Output gain knob (standard single-layer)
  - id: output_gain
    type: slider
    label: ""
    parameter: "output_gain"
    range: [-12.0, 12.0]
    default: 0.0
    unit: "dB"
    decimals: 1
    position: { x: 610, y: 80 }
    size: { width: 55, height: 55, diameter: 55 }
    style:
      type: "standard_knob"
      color: "#C9A27B"
      border_color: "#8B7355"
      border_width: "2px"

  # ANALOG toggle
  - id: analog
    type: toggle
    label: "[ANALOG]"
    parameter: "analog"
    default: true
    position: { x: 590, y: 160 }
    size: { width: 75, height: 22 }
    style:
      type: "botanical_toggle_large"
      color_active: "#6B8E4E"
      color_inactive: "#8B7355"

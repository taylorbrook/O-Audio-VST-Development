    style:
      font: "Garamond, serif"
      font_size: "8px"
      text_align: center
      letter_spacing: "0.1em"
      color: "#3C2F2F"
    layer: decorative

  # VU meter display (circular meter - responds to output_gain)
  - id: vu_meter
    type: meter
    parameter: "output_gain"
    position: { x: 825, y: 75 }
    size: { width: 70, height: 70, diameter: 70 }
    style:
      type: "circular_vu_meter"
      background: "rgba(139, 168, 112, 0.2)"
      border: "2px solid #3C5C1A"
      needle_color: "#3C5C1A"
      scale_marks: [-20, -10, 0, +3]
      scale_color: "#8B7355"
      pivot_color: "#5C4033"

special_elements:
  # Paper texture background (full window)
  - id: paper_background
    type: image
    src: "paper1.jpg"
    position: { x: 0, y: 0 }
    size: { width: 920, height: 220 }
    opacity: 1.0
    pointer_events: none
    fit: cover
    layer: background
    z_index: 0

  # Botanical overlay - LARGE, ROTATED 90 degrees clockwise
  - id: botanical_overlay
    type: image
    src: "flower_ferdinandibauer00baue_0021.png"
    position: { x: 200, y: -150 }  # Positioned to cover most of UI when rotated
    size: { width: 500, height: 500 }
    opacity: 0.45
    pointer_events: none
    fit: contain
    transform: "rotate(90deg)"
    transform_origin: "center center"
    layer: background
    z_index: 1

  # Header border
  - id: header_border_bottom
    type: decorative_line
    position: { x: 0, y: 45 }
    size: { width: 920, height: 2 }
    color: "#8B7355"
    layer: decorative

notes:
  - v3 iteration with major visual refinements
  - Paper texture background (paper1.jpg) as full-window background image
  - Large botanical overlay rotated 90 degrees clockwise, higher opacity (0.45)
  - Reverted to v1-style seed cross-section dual-layer knobs
  - Added circular VU meter on far right (Ouaricon Marimba style)
  - Compact rack-unit proportions: 920×220px (wide and short)
  - Tight vertical spacing for professional rack-mount impression
  - VU meter responds to output_gain parameter visually
  - Dual-layer knobs use 10-segment conic-gradient seed pattern
  - Outer ring: aged paper ring (#C9A27B) with walnut border
  - Inner dial: alternating cream segments with center core
  - All controls in single horizontal row with minimal vertical space
  - Edge margins: 20px for compact feel
  - Band spacing: ~143px center-to-center

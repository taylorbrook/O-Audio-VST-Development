<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=920, height=220" />
  <title>Ouaricon Analog Equalizer</title>

  <style>
    /* ====================================================================
       CRITICAL CSS CONSTRAINTS
       ==================================================================== */

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* ====================================================================
       NATIVE APPLICATION FEEL
       ==================================================================== */

    body {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      cursor: default;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: Garamond, serif;
    }

    .container {
      width: 920px;
      height: 220px;
      position: relative;
      overflow: hidden;
    }

    .paper-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/images/paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    .botanical-overlay {
      position: absolute;
      top: -77px;
      left: 545px;
      width: 375px;
      height: 375px;
      background-image: url('/images/flower_ferdinandibauer00baue_0021.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.45;
      transform: rotate(90deg);
      transform-origin: center center;
      z-index: 1;
      pointer-events: none;
    }

    .content-layer {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .header-border {
      position: absolute;
      top: 45px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #8B7355;
    }

    .title {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 24px;
      font-family: Garamond, serif;
      font-size: 18px;
      text-align: center;
      letter-spacing: 0.15em;
      color: #3C2F2F;
      line-height: 24px;
    }

    /* Band labels - now clickable toggles */
    .band-label {
      font-family: Garamond, serif;
      font-size: 11px;
      text-align: center;
      letter-spacing: 0.12em;
      color: #FFF;
      font-weight: 600;
      position: absolute;
      background: #6B8E4E;
      border: 1px solid #3C5C1A;
      border-radius: 3px;
      padding: 3px 8px;
      cursor: pointer;
      transition: background 100ms, color 100ms;
    }

    .band-label.inactive {
      background: #8B7355;
      border-color: #5C4033;
      color: #DDD;
    }

    .sublabel {
      font-family: Garamond, serif;
      font-size: 8px;
      text-align: center;
      letter-spacing: 0.1em;
      color: #5C4033;
      position: absolute;
    }

    /* ====================================================================
       DUAL-LAYER KNOB WITH FREQUENCY NOTCHES
       ==================================================================== */

    .dual-knob-wrapper {
      position: absolute;
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Frequency notches ring (outside the knob) */
    .freq-notches {
      position: absolute;
      width: 85px;
      height: 85px;
      pointer-events: none;
    }

    .dual-knob-container {
      position: absolute;
      width: 65px;
      height: 65px;
      cursor: pointer;
    }

    /* Outer ring - frequency control with green gradient */
    .knob-outer {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle,
        transparent 65%,
        rgba(107, 142, 78, 0.3) 65%,
        rgba(107, 142, 78, 0.5) 75%,
        rgba(139, 115, 85, 0.8) 85%,
        #8B7355 90%
      );
      border: 2px solid #6B8E4E;
      transform-origin: center center;
      transition: transform 50ms;
      pointer-events: none;
    }

    /* Outer ring indicator */
    .knob-outer-indicator {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 10px;
      background: #3C5C1A;
      border-radius: 2px;
      pointer-events: none;
    }

    /* Inner dial - gain control */
    .knob-inner {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 41px;
      height: 41px;
      border-radius: 50%;
      background:
        radial-gradient(circle, #FFF8DC 0%, #FFF8DC 20%, transparent 20%),
        conic-gradient(from 0deg,
          #F5DEB3 0deg, #F5DEB3 35deg, #8B7355 35deg, #8B7355 36deg,
          #E8D5B7 36deg, #E8D5B7 71deg, #8B7355 71deg, #8B7355 72deg,
          #F5DEB3 72deg, #F5DEB3 107deg, #8B7355 107deg, #8B7355 108deg,
          #E8D5B7 108deg, #E8D5B7 143deg, #8B7355 143deg, #8B7355 144deg,
          #F5DEB3 144deg, #F5DEB3 179deg, #8B7355 179deg, #8B7355 180deg,
          #E8D5B7 180deg, #E8D5B7 215deg, #8B7355 215deg, #8B7355 216deg,
          #F5DEB3 216deg, #F5DEB3 251deg, #8B7355 251deg, #8B7355 252deg,
          #E8D5B7 252deg, #E8D5B7 287deg, #8B7355 287deg, #8B7355 288deg,
          #F5DEB3 288deg, #F5DEB3 323deg, #8B7355 323deg, #8B7355 324deg,
          #E8D5B7 324deg, #E8D5B7 359deg, #8B7355 359deg, #8B7355 360deg
        );
      border: 2px solid #8B7355;
      transform-origin: center center;
      transition: transform 50ms;
      pointer-events: none;
    }

    .knob-pointer {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 10px;
      background: #3C2F2F;
      pointer-events: none;
    }

    /* Toggle switches */
    .toggle {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #8B7355;
      border: 1px solid #5C4033;
      border-radius: 3px;
      font-family: Garamond, serif;
      font-size: 8px;
      letter-spacing: 0.08em;
      color: #FFF;
      cursor: pointer;
      transition: background 100ms;
      text-align: center;
      padding: 2px 4px;
    }

    .toggle.active {
      background: #6B8E4E;
      border-color: #3C5C1A;
    }

    .toggle-large {
      font-size: 9px;
      padding: 4px 8px;
    }

    /* Three-way Q toggle */
    .three-way-toggle {
      position: absolute;
      display: flex;
      gap: 1px;
      background: #8B7355;
      border: 1px solid #5C4033;
      border-radius: 3px;
      overflow: hidden;
    }

    .three-way-option {
      flex: 1;
      padding: 3px 8px;
      font-family: Garamond, serif;
      font-size: 7px;
      letter-spacing: 0.06em;
      color: #FFF;
      cursor: pointer;
      text-align: center;
      background: #8B7355;
      transition: background 100ms;
      white-space: nowrap;
    }

    .three-way-option.active {
      background: #6B8E4E;
    }

    /* VU Meter - 80% of 2x size (112px) */
    .vu-meter {
      position: absolute;
      width: 112px;
      height: 112px;
      background: rgba(139, 168, 112, 0.2);
      border: 2px solid #3C5C1A;
      border-radius: 50%;
      overflow: hidden;
    }

    .vu-meter-scale {
      position: absolute;
      width: 100%;
      height: 50%;
      top: 5%;
    }

    .vu-meter-needle {
      position: absolute;
      width: 2px;
      height: 45px;
      background: #3C5C1A;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-30deg);
      border-radius: 1px;
      transition: transform 0.15s ease-out;
    }

    .vu-meter-pivot {
      position: absolute;
      width: 11px;
      height: 11px;
      background: #3C2F2F;
      border-radius: 50%;
      bottom: calc(50% - 5.5px);
      left: calc(50% - 5.5px);
    }

    .vu-meter-label {
      position: absolute;
      bottom: 12px;
      width: 100%;
      text-align: center;
      font-size: 10px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Value tooltip */
    .value-tooltip {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(60, 47, 47, 0.9);
      color: #FFF;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 8px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 150ms;
    }

    .dual-knob-container:hover .value-tooltip,
    .dual-knob-container.dragging .value-tooltip {
      opacity: 1;
    }
  </style>
</head>

  <script type="module">
    import { getSliderState, getToggleState, getComboBoxState } from "./js/juce/index.js";

    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    if (!window.__JUCE__) {
      console.error("JUCE backend not available");
    }

    // Default normalized values for "center" position (vertical knob)
    const DEFAULT_VALUES = {
      lf_freq: 0.5,
      lf_gain: 0.5,
      lmf_freq: 0.5,
      lmf_gain: 0.5,
      hmf_freq: 0.5,
      hmf_gain: 0.5,
      hf_freq: 0.5,
      hf_gain: 0.5
    };

    // Parameter ranges for display formatting
    const paramRanges = {
      lf_freq: { min: 30, max: 500, unit: 'Hz', format: v => Math.round(30 + v * 470) + ' Hz' },
      lf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      lmf_freq: { min: 100, max: 2000, unit: 'Hz', format: v => Math.round(100 + v * 1900) + ' Hz' },
      lmf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      hmf_freq: { min: 500, max: 8000, unit: 'Hz', format: v => Math.round(500 + v * 7500) + ' Hz' },
      hmf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      hf_freq: { min: 2000, max: 20000, unit: 'Hz', format: v => (2000 + v * 18000 >= 10000 ? ((2000 + v * 18000)/1000).toFixed(1) + 'k' : Math.round(2000 + v * 18000)) + ' Hz' },
      hf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' }
    };

    function updateKnobRotation(element, normalizedValue) {
      const degrees = -135 + (normalizedValue * 270);
      element.style.transform = `rotate(${degrees}deg)`;
    }

    // ========================================================================
    // DUAL-LAYER KNOB with double-click reset
    // ========================================================================
    function setupDualKnob(container, outerState, innerState, tooltipId, freqParamName, gainParamName) {
      const outerKnob = container.querySelector('.knob-outer');
      const innerKnob = container.querySelector('.knob-inner');
      const tooltip = document.getElementById(tooltipId);

      let isDragging = false;
      let currentState = null;
      let currentParamName = null;
      let lastY = 0;

      const KNOB_RADIUS = 32.5;
      const INNER_THRESHOLD = 0.60;

      function updateTooltip() {
        const freqValue = paramRanges[freqParamName].format(outerState.getNormalisedValue());
        const gainValue = paramRanges[gainParamName].format(innerState.getNormalisedValue());
        tooltip.textContent = freqValue + ' / ' + gainValue;
      }

      function handleMouseDown(e) {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + KNOB_RADIUS;
        const centerY = rect.top + KNOB_RADIUS;

        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const normalizedDistance = distance / KNOB_RADIUS;

        if (normalizedDistance > INNER_THRESHOLD) {
          currentState = outerState;
          currentParamName = freqParamName;
        } else {
          currentState = innerState;
          currentParamName = gainParamName;
        }

        isDragging = true;
        lastY = e.clientY;
        container.classList.add('dragging');
        currentState.sliderDragStarted();
        e.preventDefault();
      }

      // Double-click to reset to default (vertical position)
      container.addEventListener('dblclick', (e) => {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + KNOB_RADIUS;
        const centerY = rect.top + KNOB_RADIUS;

        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const normalizedDistance = distance / KNOB_RADIUS;

        if (normalizedDistance > INNER_THRESHOLD) {
          outerState.setNormalisedValue(DEFAULT_VALUES[freqParamName]);
        } else {
          innerState.setNormalisedValue(DEFAULT_VALUES[gainParamName]);
        }
        e.preventDefault();
      });

      container.addEventListener('mousedown', handleMouseDown);

      document.addEventListener('mousemove', (e) => {
        if (!isDragging || !currentState) return;
        const deltaY = lastY - e.clientY;
        const currentValue = currentState.getNormalisedValue();
        const newValue = Math.max(0, Math.min(1, currentValue + (deltaY * 0.005)));
        currentState.setNormalisedValue(newValue);
        lastY = e.clientY;
      });

      document.addEventListener('mouseup', () => {
        if (isDragging && currentState) {
          currentState.sliderDragEnded();
          isDragging = false;
          currentState = null;
          currentParamName = null;
          container.classList.remove('dragging');
        }
      });

      outerState.valueChangedEvent.addListener(() => {
        updateKnobRotation(outerKnob, outerState.getNormalisedValue());
        updateTooltip();
      });

      innerState.valueChangedEvent.addListener(() => {
        updateKnobRotation(innerKnob, innerState.getNormalisedValue());
        updateTooltip();
      });

      updateKnobRotation(outerKnob, outerState.getNormalisedValue());
      updateKnobRotation(innerKnob, innerState.getNormalisedValue());
      updateTooltip();
    }

    // Toggle helper: className applied when state matches activeWhen
    function setupToggle(element, state, className = 'active', activeWhen = true) {
      element.addEventListener('click', () => state.setValue(!state.getValue()));

      const update = () => element.classList.toggle(className, state.getValue() === activeWhen);
      state.valueChangedEvent.addListener(update);
      update();
    }

    function setupThreeWayToggle(container, state) {
      const options = container.querySelectorAll('.three-way-option');

      options.forEach((option, index) => {
        option.addEventListener('click', () => {
          state.setChoiceIndex(index);
        });
      });

      state.valueChangedEvent.addListener(() => {
        const index = state.getChoiceIndex();
        options.forEach((opt, i) => {
          opt.classList.toggle('active', i === index);
        });
      });

      const index = state.getChoiceIndex();
      options.forEach((opt, i) => {
        opt.classList.toggle('active', i === index);
      });
    }

    // ========================================================================
    // VU METER
    // ========================================================================
    const vuNeedle = document.getElementById('vu_needle');
    let currentVUAngle = -90;
    let targetVUAngle = -90;

    const VU_ATTACK_SPEED = 0.5;
    const VU_DECAY_SPEED = 0.08;
    const VU_MIN_ANGLE = -90;
    const VU_MAX_ANGLE = 90;
    const VU_SNAP_THRESHOLD = 2.0;

    function mapDBToAngle(dbLevel) {
      const minDB = -60;
      const maxDB = 3;
      const clampedDB = Math.max(minDB, Math.min(maxDB, dbLevel));
      const normalized = (clampedDB - minDB) / (maxDB - minDB);
      return VU_MIN_ANGLE + (normalized * (VU_MAX_ANGLE - VU_MIN_ANGLE));
    }

    function updateNeedleColor(angle) {
      const normalized = (angle - VU_MIN_ANGLE) / (VU_MAX_ANGLE - VU_MIN_ANGLE);
      const r = Math.round(34 + normalized * (255 - 34));
      const g = Math.round(139 - normalized * (139 - 50));
      const b = Math.round(34 + normalized * (50 - 34));
      vuNeedle.style.background = `rgb(${r}, ${g}, ${b})`;
    }

    if (window.__JUCE__ && window.__JUCE__.backend) {
      window.__JUCE__.backend.addEventListener("outputLevel", (dbLevel) => {
        targetVUAngle = mapDBToAngle(dbLevel);
      });
    }

    function animateVUMeter() {
      const vuSpeed = currentVUAngle < targetVUAngle ? VU_ATTACK_SPEED : VU_DECAY_SPEED;
      currentVUAngle += (targetVUAngle - currentVUAngle) * vuSpeed;

      if (targetVUAngle <= VU_MIN_ANGLE && Math.abs(currentVUAngle - VU_MIN_ANGLE) < VU_SNAP_THRESHOLD) {
        currentVUAngle = VU_MIN_ANGLE;
      }

      vuNeedle.style.transform = `translateX(-50%) rotate(${currentVUAngle}deg)`;
      updateNeedleColor(currentVUAngle);

      requestAnimationFrame(animateVUMeter);
    }

    // ========================================================================
    // INITIALIZE
    // ========================================================================

    const lfFreqState = getSliderState("lf_freq");
    const lfGainState = getSliderState("lf_gain");
    const lfOnState = getToggleState("lf_on");

    const lmfFreqState = getSliderState("lmf_freq");
    const lmfGainState = getSliderState("lmf_gain");
    const lmfQState = getComboBoxState("lmf_q");
    const lmfOnState = getToggleState("lmf_on");

    const hmfFreqState = getSliderState("hmf_freq");
    const hmfGainState = getSliderState("hmf_gain");
    const hmfQState = getComboBoxState("hmf_q");
    const hmfOnState = getToggleState("hmf_on");

    const hfFreqState = getSliderState("hf_freq");
    const hfGainState = getSliderState("hf_gain");
    const hfOnState = getToggleState("hf_on");

    const analogState = getToggleState("analog");

    setupDualKnob(
      document.querySelector('[data-param-outer="lf_freq"]'),
      lfFreqState, lfGainState, 'lf_tooltip', 'lf_freq', 'lf_gain'
    );
    setupDualKnob(
      document.querySelector('[data-param-outer="lmf_freq"]'),
      lmfFreqState, lmfGainState, 'lmf_tooltip', 'lmf_freq', 'lmf_gain'
    );
    setupDualKnob(
      document.querySelector('[data-param-outer="hmf_freq"]'),
      hmfFreqState, hmfGainState, 'hmf_tooltip', 'hmf_freq', 'hmf_gain'
    );
    setupDualKnob(
      document.querySelector('[data-param-outer="hf_freq"]'),
      hfFreqState, hfGainState, 'hf_tooltip', 'hf_freq', 'hf_gain'
    );

    // Band labels: show 'inactive' when OFF
    setupToggle(document.getElementById('lf_on'), lfOnState, 'inactive', false);
    setupToggle(document.getElementById('lmf_on'), lmfOnState, 'inactive', false);
    setupToggle(document.getElementById('hmf_on'), hmfOnState, 'inactive', false);
    setupToggle(document.getElementById('hf_on'), hfOnState, 'inactive', false);

    setupToggle(document.getElementById('analog'), analogState);

    setupThreeWayToggle(document.getElementById('lmf_q'), lmfQState);
    setupThreeWayToggle(document.getElementById('hmf_q'), hmfQState);

    animateVUMeter();

    console.log('OuariconAnalogEQ v1.1.1 UI initialized');
  </script>
</body>
</html>

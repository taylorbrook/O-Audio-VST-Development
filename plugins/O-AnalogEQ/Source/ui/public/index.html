<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=920, height=220" />
  <title>Ouaricon Analog Equalizer</title>

  <style>
    /* ====================================================================
       CRITICAL CSS CONSTRAINTS
       ==================================================================== */

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* ====================================================================
       NATIVE APPLICATION FEEL
       ==================================================================== */

    body {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      cursor: default;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: Garamond, serif;
    }

    .container {
      width: 920px;
      height: 220px;
      position: relative;
      overflow: hidden;
    }

    .paper-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/images/paper1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      pointer-events: none;
    }

    .botanical-overlay {
      position: absolute;
      top: -77px;
      left: 545px;
      width: 375px;
      height: 375px;
      background-image: url('/images/flower_ferdinandibauer00baue_0021.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.45;
      transform: rotate(90deg);
      transform-origin: center center;
      z-index: 1;
      pointer-events: none;
    }

    .content-layer {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .header-border {
      position: absolute;
      top: 45px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #8B7355;
    }

    .title {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 400px;
      height: 24px;
      font-family: Garamond, serif;
      font-size: 18px;
      text-align: left;
      letter-spacing: 0.15em;
      color: #3C2F2F;
      line-height: 24px;
    }

    /* Band labels - now clickable toggles */
    /*
       v1.2.0 — `white-space: nowrap` IS NOT A GEOMETRY PIN AND IS NOT CLAIMED
       AS ONE. Its negative control PASSES on the strings this version ships,
       which by the batch rule would make it decoration. It ships anyway,
       relabelled, because it does not move a box — it makes a failure VISIBLE
       that both gates are structurally blind to.

       Each band caption is `position: absolute` with `width: 85px` set inline
       and NO fixed height, so a French caption past the 67.00 px content box
       WRAPS rather than spilling:
         - no line exceeds the box, so check-ui-labels assertion 4's horizontal
           half sees nothing;
         - the box grows 21 -> 34 px to hold its own second line, so assertion
           4's vertical twin sees nothing either;
         - it is itself the [data-i18n] element and it is absolutely positioned,
           so it pushes no sibling and assertion 7 sees nothing.
       The rendered result is a caption reaching y=86 into the knob ring that
       starts at y=75, with every assertion green. PLATEAU BF does exactly that.

       nowrap converts that silent wrap into a SPILL, which assertion 4 catches
       by name. It changes nothing today: all four English captions and both
       French ones are single-line already (63.03 / 28.41 / 29.63 / 64.25 and
       57.44 / 58.66, all under 67.00), and the width is hard-pinned, so zero
       elements move in either language. What it buys is that the NEXT French
       edit on this control cannot fail silently.
    */
    .band-label {
      font-family: Garamond, serif;
      font-size: 11px;
      text-align: center;
      letter-spacing: 0.12em;
      color: #FFF;
      font-weight: 600;
      position: absolute;
      background: #6B8E4E;
      border: 1px solid #3C5C1A;
      border-radius: 3px;
      padding: 3px 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 100ms, color 100ms;
    }

    .band-label.inactive {
      background: #8B7355;
      border-color: #5C4033;
      color: #DDD;
    }

    .sublabel {
      font-family: Garamond, serif;
      font-size: 8px;
      text-align: center;
      letter-spacing: 0.1em;
      color: #5C4033;
      position: absolute;
    }

    /* ====================================================================
       DUAL-LAYER KNOB WITH FREQUENCY NOTCHES
       ==================================================================== */

    .dual-knob-wrapper {
      position: absolute;
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Frequency notches ring (outside the knob) */
    .freq-notches {
      position: absolute;
      width: 85px;
      height: 85px;
      pointer-events: none;
      overflow: visible;
    }

    .dual-knob-container {
      position: absolute;
      width: 65px;
      height: 65px;
      cursor: pointer;
      touch-action: none;
    }

    /* Outer ring - frequency control with green gradient */
    .knob-outer {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle,
        transparent 65%,
        rgba(107, 142, 78, 0.3) 65%,
        rgba(107, 142, 78, 0.5) 75%,
        rgba(139, 115, 85, 0.8) 85%,
        #8B7355 90%
      );
      border: 2px solid #6B8E4E;
      transform-origin: center center;
      transition: transform 50ms;
      pointer-events: none;
    }

    /* Outer ring indicator */
    .knob-outer-indicator {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 10px;
      background: #3C5C1A;
      border-radius: 2px;
      pointer-events: none;
    }

    /* Inner dial - gain control */
    .knob-inner {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 41px;
      height: 41px;
      border-radius: 50%;
      background:
        radial-gradient(circle, #FFF8DC 0%, #FFF8DC 20%, transparent 20%),
        conic-gradient(from 0deg,
          #F5DEB3 0deg, #F5DEB3 35deg, #8B7355 35deg, #8B7355 36deg,
          #E8D5B7 36deg, #E8D5B7 71deg, #8B7355 71deg, #8B7355 72deg,
          #F5DEB3 72deg, #F5DEB3 107deg, #8B7355 107deg, #8B7355 108deg,
          #E8D5B7 108deg, #E8D5B7 143deg, #8B7355 143deg, #8B7355 144deg,
          #F5DEB3 144deg, #F5DEB3 179deg, #8B7355 179deg, #8B7355 180deg,
          #E8D5B7 180deg, #E8D5B7 215deg, #8B7355 215deg, #8B7355 216deg,
          #F5DEB3 216deg, #F5DEB3 251deg, #8B7355 251deg, #8B7355 252deg,
          #E8D5B7 252deg, #E8D5B7 287deg, #8B7355 287deg, #8B7355 288deg,
          #F5DEB3 288deg, #F5DEB3 323deg, #8B7355 323deg, #8B7355 324deg,
          #E8D5B7 324deg, #E8D5B7 359deg, #8B7355 359deg, #8B7355 360deg
        );
      border: 2px solid #8B7355;
      transform-origin: center center;
      transition: transform 50ms;
      pointer-events: none;
    }

    .knob-pointer {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 10px;
      background: #3C2F2F;
      pointer-events: none;
    }

    /* Toggle switches */
    .toggle {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #8B7355;
      border: 1px solid #5C4033;
      border-radius: 3px;
      font-family: Garamond, serif;
      font-size: 8px;
      letter-spacing: 0.08em;
      color: #FFF;
      cursor: pointer;
      transition: background 100ms;
      text-align: center;
      padding: 2px 4px;
    }

    .toggle.active {
      background: #6B8E4E;
      border-color: #3C5C1A;
    }

    .toggle-large {
      font-size: 9px;
      padding: 4px 8px;
    }

    /* Three-way Q toggle */
    .three-way-toggle {
      position: absolute;
      display: flex;
      gap: 1px;
      background: #8B7355;
      border: 1px solid #5C4033;
      border-radius: 3px;
      overflow: hidden;
    }

    .three-way-option {
      flex: 1;
      padding: 3px 8px;
      font-family: Garamond, serif;
      font-size: 7px;
      letter-spacing: 0.06em;
      color: #FFF;
      cursor: pointer;
      text-align: center;
      background: #8B7355;
      transition: background 100ms;
      white-space: nowrap;
    }

    .three-way-option.active {
      background: #6B8E4E;
    }

    /* VU Meter - 80% of 2x size (112px) */
    .vu-meter {
      position: absolute;
      width: 112px;
      height: 112px;
      background: rgba(139, 168, 112, 0.2);
      border: 2px solid #3C5C1A;
      border-radius: 50%;
      overflow: hidden;
    }

    .vu-meter-scale {
      position: absolute;
      width: 100%;
      height: 50%;
      top: 5%;
    }

    .vu-meter-needle {
      position: absolute;
      width: 2px;
      height: 45px;
      background: #3C5C1A;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-30deg);
      border-radius: 1px;
      transition: transform 0.15s ease-out;
    }

    .vu-meter-pivot {
      position: absolute;
      width: 11px;
      height: 11px;
      background: #3C2F2F;
      border-radius: 50%;
      bottom: calc(50% - 5.5px);
      left: calc(50% - 5.5px);
    }

    .vu-meter-label {
      position: absolute;
      bottom: 12px;
      width: 100%;
      text-align: center;
      font-size: 10px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Value tooltip */
    .value-tooltip {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(60, 47, 47, 0.9);
      color: #FFF;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 8px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 150ms;
    }

    .dual-knob-container:hover .value-tooltip,
    .dual-knob-container.dragging .value-tooltip {
      opacity: 1;
    }

    .db-readout {
      position: absolute;
      font-family: Garamond, serif;
      font-size: 9px;
      text-align: center;
      color: #3C2F2F;
      pointer-events: none;
      letter-spacing: 0.08em;
    }

    /* Preset Bar */
    .preset-bar {
      position: absolute;
      top: 10px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 10;
    }

    .preset-bar button {
      background: #8B7355;
      border: 1px solid #5C4033;
      border-radius: 3px;
      color: #FFF;
      font-family: Garamond, serif;
      font-size: 9px;
      letter-spacing: 0.06em;
      cursor: pointer;
      padding: 3px 6px;
      transition: background 100ms;
    }

    .preset-bar button:hover {
      background: #6B8E4E;
      border-color: #3C5C1A;
    }

    .preset-bar button:active {
      background: #3C5C1A;
    }

    /*
       v1.2.0 — THE ONE LOAD-BEARING PIN ON THIS PAGE, and its negative control
       fires. `.preset-bar` is a right-anchored flex row and these two buttons
       shrink to fit their caption, so the French pair widens the row and shoves
       #prevPreset, #presetName, #nextPreset and the bar itself LEFT by that
       amount. None of those four is a [data-i18n] element, so that is a
       check-ui-labels assertion 7 failure, and assertion 4 is blind to it — the
       caption still fits its own grown box.

       RE-MEASURED AT v1.3.1, because the French save caption changed from
       SAUVER to ENREG. (Stage N). Removing the pin — nothing else — and reading
       the four rects in each language: the cluster sits 44.33 px further RIGHT
       in English (SAVE 38.52 / LOAD 41.16 unpinned, both under 62) and 13.71 px
       further right in French (ENREG. 49.50 / CHARGER 60.80), so the
       French-minus-English displacement the pin closes is 30.62 px. It was
       34.37 px at v1.2.0 with SAUVER, and it is not a recomputation from two
       glyph widths — the pin was removed, the rects were read, and the pin was
       restored to a byte-identical layout.

       62 px is O-Chorus's and O-DigiDelay's number, kept so the suite's preset
       bar is one shape across batch K2. Content box 48 px (62 less 2 border and
       12 padding): CHARGER 46.80 leaves 1.20 px, the tightest French margin
       shipped here. The pin's cost is that the ENGLISH cluster sits 44.32 px
       further left than at v1.1.11, in a header whose middle is empty paper.

       The ARROWS are deliberately NOT pinned: they carry glyphs, not copy, and
       widening them would move the cluster for no language reason.
    */
    #savePreset,
    #loadPreset {
      width: 62px;
    }

    .preset-name-display {
      min-width: 100px;
      max-width: 140px;
      text-align: center;
      font-family: Garamond, serif;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #3C2F2F;
      background: rgba(255, 248, 220, 0.6);
      border: 1px solid #8B7355;
      border-radius: 3px;
      padding: 3px 6px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preset-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: auto;
      right: 0;
      margin-top: 2px;
      min-width: 160px;
      max-height: 180px;
      overflow-y: auto;
      background: rgba(255, 248, 220, 0.98);
      border: 2px solid #5C4033;
      border-radius: 4px;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.4);
      z-index: 9999;
    }

    .preset-dropdown.show {
      display: block;
    }

    .preset-bar:has(.preset-dropdown.show) {
      z-index: 9999;
    }

    .preset-dropdown-header {
      padding: 4px 8px 2px;
      font-family: Garamond, serif;
      font-size: 8px;
      letter-spacing: 0.1em;
      color: #8B7355;
      text-transform: uppercase;
      border-bottom: 1px solid #D4C4A0;
    }

    .preset-dropdown-item {
      padding: 4px 10px;
      font-family: Garamond, serif;
      font-size: 10px;
      color: #3C2F2F;
      cursor: pointer;
      transition: background 0.15s;
    }

    .preset-dropdown-item:hover {
      background: rgba(139, 168, 112, 0.3);
    }

    .preset-dropdown-item.active {
      background: rgba(107, 142, 35, 0.3);
      font-weight: bold;
    }

    /* ====================================================================
       SETTINGS CLUSTER (v1.2.0) — the language selector
       ====================================================================

       Placed in the empty bottom-left margin. Everything on this page lives at
       x >= 90 (the LF band column) or x >= 758 (the VU meter), so the strip
       below x=90 is bare paper and NO EXISTING ELEMENT MOVES to make room for
       the gear.
    */
    .settings-cluster {
      position: absolute;
      left: 10px;
      bottom: 8px;
      z-index: 60;
    }

    .gear-btn {
      width: 18px;
      height: 18px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 248, 220, 0.55);
      border: 1px solid #8B7355;
      border-radius: 3px;
      color: #5C4033;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      transition: background 100ms;
    }

    .gear-btn:hover {
      background: rgba(107, 142, 78, 0.35);
      border-color: #3C5C1A;
    }

    .gear-btn:focus-visible {
      outline: 1px solid #3C5C1A;
      outline-offset: 2px;
    }

    /* Opens UPWARDS. The gear sits 8 px from the BOTTOM of a 220 px frame, so a
       panel below it would leave the frame entirely (and .container is
       overflow: hidden, which would make it unreachable rather than merely
       clipped).

       WIDTH IS PINNED, not min-width, and this pin is load-bearing: the panel
       is not a [data-i18n] element, so assertion 7 measures its box in both
       languages, and French SHRINKS the caption inside it (LANGUAGE 55.31 ->
       LANGUE 41.08). An auto-width panel would therefore CONTRACT in French and
       be reported as moved — the shrink half of the problem, which a clip check
       cannot see at all. A hard width makes the rectangle language-invariant by
       construction. */
    .settings-popover {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      z-index: 61;
      width: 170px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255, 248, 220, 0.98);
      border: 2px solid #5C4033;
      border-radius: 4px;
      box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.35);
    }

    .settings-popover[hidden] {
      display: none;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* nowrap because the row is space-between: a caption that wrapped would
       grow the row's height and move the control beside it. */
    .settings-label {
      font-family: Garamond, serif;
      font-size: 9px;
      color: #3C2F2F;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .settings-select {
      flex: 0 0 auto;
      padding: 1px 3px;
      background: rgba(255, 248, 220, 0.6);
      border: 1px solid #3C5C1A;
      border-radius: 2px;
      color: #3C2F2F;
      font-family: Garamond, serif;
      font-size: 9px;
      line-height: 1.2;
      cursor: pointer;
    }

    .settings-select:focus-visible {
      outline: 1px solid #3C5C1A;
      outline-offset: 1px;
    }

    /* ====================================================================
       HOVER-HELP (v1.3.0) — the surface the delegated renderer paints into
       ====================================================================

       Styled in THIS page's vocabulary rather than pasted in from the
       reference implementation: the rgba(255,248,220,0.98) plate, #5C4033
       border, 4 px radius and 2px/4px/12px shadow that .settings-popover and
       .preset-dropdown already use, Garamond throughout, and the #5C4033
       uppercase with letter-spacing of .settings-label for the title line.
       O-simpleFM's tooltip is a dark #2a2118 chip, which is that plugin's
       system and would read as a foreign object over this paper ground.

       ── THE FRAME IS 920 x 220. WIDE, AND ONLY 220 TALL ─────────────────────

       220 px less the renderer's 8 px margin top and bottom leaves 204 px for
       the WHOLE surface, and that is the axis this page is poor on. The
       horizontal axis is the one it is rich on — 920 px wide — so the copy is
       allowed to spend width and not height, which is what the cap below buys:

           padding      4 + 4   =  8.00
           border       1 + 1   =  2.00
           title      9 x 1.35  = 12.15   + 2.00 margin-bottom
           ------------------------------
           chrome               = 22.15 px
           body budget  204 - 22.15 = 181.85 px
           body line   10 x 1.35 = 13.50 px  ->  THIRTEEN lines before it is
                                                 unplaceable at any x or y

       The longest body here is four lines in English and five in French, so
       the vertical well is not the binding constraint on this page — the
       CLAMP is, and it is exercised at every anchor rather than at a few. See
       the renderer's position() and the [4b] section of
       tests/ui_tip_render_check.js for the counts.

       420 px IS BOUGHT MARGIN, NOT A NECESSITY. At 420 the tallest French tip
       runs five lines; at 260 it would run eight and still fit the 204 px
       well. 420 is a little under half the 920 px frame and leaves
       920 - 16 - 420 = 484 px of horizontal travel for the clamp, which is the
       room a native-speaker review needs when it replaces a machine-drafted
       French sentence with a longer human one.

       EVERY DECLARATION BELOW IS LOAD-BEARING:

         position: fixed    — the clamp measures against the VIEWPORT, and it
                              keeps the node out of flow, so adding it moves
                              nothing (check-ui-labels byte-identical before
                              and after).
         visibility+opacity — hidden at rest. What CATCHES an un-hidden surface
                              is check-i18n assertion 10 and boot-all-uis' text
                              count, NOT check-ui-labels — measured on O-Bass,
                              where un-hiding it left that gate byte-identically
                              green because a fixed box at 0,0 has the same rect
                              in both languages. visibility rather than
                              display:none is deliberate: the box keeps layout,
                              so position() can measure getBoundingClientRect()
                              on the frame BEFORE the tip becomes visible.
         pointer-events     — none, or the surface steals the hover that is
                              keeping it open and the tip flickers.
         z-index 200        — above .settings-popover (61) and the preset
                              dropdown (9999 only while open; the tip is hidden
                              during a click, so they never contend).
         max-width          — a hard cap is what forces French to WRAP rather
                              than run off the right edge, and the line count
                              above is counted against it.                   */
    .tooltip {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 200;
      max-width: 420px;
      padding: 4px 8px;
      background: rgba(255, 248, 220, 0.98);
      border: 1px solid #5C4033;
      border-radius: 4px;
      box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.35);
      font-family: Garamond, serif;
      font-size: 10px;
      line-height: 1.35;
      color: #3C2F2F;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.12s ease;
      pointer-events: none;
    }

    .tooltip.show {
      opacity: 1;
      visibility: visible;
    }

    .tooltip .tip-title {
      display: block;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5C4033;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="paper-background"></div>
    <div class="botanical-overlay"></div>

    <div class="content-layer">
      <div class="header-border"></div>
      <!-- NOT a [data-i18n] element: a product name is never translated. It is
           declared in I18N_EXEMPT with that reason, so a genuinely missed label
           cannot hide behind the same silence. -->
      <div class="title">OUARICON ANALOG EQUALIZER</div>

      <!-- PRESET BAR
           v1.2.0: the five native title= attributes are DELETED per contract §4
           and their EXISTING English moved verbatim into data-i18n-aria. No new

  <!-- HOVER-HELP (v1.3.0). EMPTY in the markup, deliberately: any authored text
       here would ship one language of a tooltip that applyI18n never rewrites,
       and it would be an unkeyed text node that check-i18n assertion 10 fails.
       It is a sibling of .container rather than a child, because .container is
       overflow: hidden and the surface is position: fixed against the viewport.
       Its aria-hidden is flipped by the renderer rather than left true. -->
  <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <script type="module">
    import { getSliderState, getToggleState, getComboBoxState, getNativeFunction } from "./js/juce/index.js";
    // The JUCE 8 frontend NAMESPACE, imported alongside the four named bindings
    // this page already used. Juce.getNativeFunction is the only correct way to
    // reach a withNativeFunction registration — window.__JUCE__ is the raw
    // postMessage transport and does not carry the promise contract
    // (critical_juce_webview_namespace_vs_postmessage). Two import statements
    // from one specifier is legal ES and leaves every existing call site below
    // untouched.
    import * as Juce from "./js/juce/index.js";
    import { PresetManager } from "./modules/preset-manager.js";

    // v1.2.0: the label table. The canonical import line, re-rooted from
    // './i18n.js' to './js/i18n.js' because this plugin's controller is an
    // inline <script type="module"> at the UI root rather than a js/app.js.
    // check-i18n assertion 6 accepts exactly that one substitution and nothing
    // else. v1.3.0: I18N now carries thirteen tooltip bodies and TIP_BINDINGS
    // thirteen rows — both were EMPTY at v1.2.0 and imported anyway, which is
    // why adding the copy needed no change to the canon block below.
    import { LANGUAGES, I18N, LABELS, TIP_BINDINGS, tr } from './js/i18n.js';

    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    if (!window.__JUCE__) {
      console.error("JUCE backend not available");
    }

    // Frequency parameters use NormalisableRange<float>(min, max, 0.1, 0.3) in C++, so the
    // normalised value (0..1) is skewed: normalised = pow((hz - min) / (max - min), 0.3).
    // Display formatters invert the skew via toHz — hz = min + (max - min) * pow(v, 1/skew) —
    // instead of mapping linearly (WR-01); reset uses toNorm to turn the C++ Hz defaults back
    // into normalised values (IN-02).
    const FREQ_SKEW = 0.3;
    const toHz   = (v, min, max) => min + (max - min) * Math.pow(v, 1 / FREQ_SKEW);
    const toNorm = (hz, min, max) => Math.pow((hz - min) / (max - min), FREQ_SKEW);

    // Default normalized values for double-click reset. Frequencies mirror the C++ APVTS
    // parameter defaults (100/500/2000/8000 Hz) through the skew, so reset restores the true
    // default rather than the skewed midpoint (IN-02). Gains default to 0 dB = normalised 0.5.
    const DEFAULT_VALUES = {
      lf_freq: toNorm(100, 30, 500),
      lf_gain: 0.5,
      lmf_freq: toNorm(500, 100, 2000),
      lmf_gain: 0.5,
      hmf_freq: toNorm(2000, 500, 8000),
      hmf_gain: 0.5,
      hf_freq: toNorm(8000, 2000, 20000),
      hf_gain: 0.5
    };

    // Parameter ranges for display formatting
    const paramRanges = {
      lf_freq: { min: 30, max: 500, unit: 'Hz', format: v => Math.round(toHz(v, 30, 500)) + ' Hz' },
      lf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      lmf_freq: { min: 100, max: 2000, unit: 'Hz', format: v => Math.round(toHz(v, 100, 2000)) + ' Hz' },
      lmf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      hmf_freq: { min: 500, max: 8000, unit: 'Hz', format: v => Math.round(toHz(v, 500, 8000)) + ' Hz' },
      hmf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' },
      hf_freq: { min: 2000, max: 20000, unit: 'Hz', format: v => { const hz = toHz(v, 2000, 20000); return (hz >= 10000 ? (hz / 1000).toFixed(1) + 'k' : Math.round(hz)) + ' Hz'; } },
      hf_gain: { min: -12, max: 12, unit: 'dB', format: v => ((-12 + v * 24).toFixed(1)) + ' dB' }
    };

    function updateKnobRotation(element, normalizedValue) {
      const degrees = -135 + (normalizedValue * 270);
      element.style.transform = `rotate(${degrees}deg)`;
    }

    // ========================================================================
    // DUAL-LAYER KNOB with double-click reset
    // ========================================================================
    function setupDualKnob(container, outerState, innerState, tooltipId, freqParamName, gainParamName) {
      const outerKnob = container.querySelector('.knob-outer');
      const innerKnob = container.querySelector('.knob-inner');
      const tooltip = document.getElementById(tooltipId);

      let isDragging = false;
      let currentState = null;
      let lastY = 0;

      const KNOB_RADIUS = 32.5;
      const INNER_THRESHOLD = 0.60;

      function updateTooltip() {
        const freqValue = paramRanges[freqParamName].format(outerState.getNormalisedValue());
        const gainValue = paramRanges[gainParamName].format(innerState.getNormalisedValue());
        tooltip.textContent = freqValue + ' / ' + gainValue;
      }

      function handlePointerDown(e) {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + KNOB_RADIUS;
        const centerY = rect.top + KNOB_RADIUS;

        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const normalizedDistance = distance / KNOB_RADIUS;

        if (normalizedDistance > INNER_THRESHOLD) {
          currentState = outerState;
        } else {
          currentState = innerState;
        }

        isDragging = true;
        lastY = e.clientY;
        container.classList.add('dragging');
        container.setPointerCapture(e.pointerId);
        currentState.sliderDragStarted();
        e.preventDefault();
      }

      // Double-click to reset to default (vertical position)
      container.addEventListener('dblclick', (e) => {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + KNOB_RADIUS;
        const centerY = rect.top + KNOB_RADIUS;

        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const normalizedDistance = distance / KNOB_RADIUS;

        if (normalizedDistance > INNER_THRESHOLD) {
          outerState.setNormalisedValue(DEFAULT_VALUES[freqParamName]);
        } else {
          innerState.setNormalisedValue(DEFAULT_VALUES[gainParamName]);
        }
        e.preventDefault();
      });

      container.addEventListener('pointerdown', handlePointerDown);

      document.addEventListener('pointermove', (e) => {
        if (!isDragging || !currentState) return;
        const deltaY = lastY - e.clientY;
        const currentValue = currentState.getNormalisedValue();
        const newValue = Math.max(0, Math.min(1, currentValue + (deltaY * 0.005)));
        currentState.setNormalisedValue(newValue);
        lastY = e.clientY;
      });

      document.addEventListener('pointerup', () => {
        if (isDragging && currentState) {
          currentState.sliderDragEnded();
          isDragging = false;
          currentState = null;
          container.classList.remove('dragging');
        }
      });

      outerState.valueChangedEvent.addListener(() => {
        updateKnobRotation(outerKnob, outerState.getNormalisedValue());
        updateTooltip();
      });

      innerState.valueChangedEvent.addListener(() => {
        updateKnobRotation(innerKnob, innerState.getNormalisedValue());
        updateTooltip();
      });

      updateKnobRotation(outerKnob, outerState.getNormalisedValue());
      updateKnobRotation(innerKnob, innerState.getNormalisedValue());
      updateTooltip();
    }

    // Toggle helper: className applied when state matches activeWhen

      state.valueChangedEvent.addListener(update);
      update();

    function setupThreeWayToggle(container, state) {

      options.forEach((option, index) => {

      state.valueChangedEvent.addListener(() => {
        const index = state.getChoiceIndex();
        options.forEach((opt, i) => {
          opt.classList.toggle('active', i === index);

    const vuNeedle = document.getElementById('vu_needle');
    let currentVUAngle = -90;
    let targetVUAngle = -90;

    const VU_ATTACK_SPEED = 0.5;
    const VU_DECAY_SPEED = 0.08;
    const VU_MIN_ANGLE = -90;
    const VU_MAX_ANGLE = 90;
    const VU_SNAP_THRESHOLD = 2.0;

    function mapDBToAngle(dbLevel) {
      const minDB = -60;
      const maxDB = 3;
      const clampedDB = Math.max(minDB, Math.min(maxDB, dbLevel));
      const normalized = (clampedDB - minDB) / (maxDB - minDB);
      return VU_MIN_ANGLE + (normalized * (VU_MAX_ANGLE - VU_MIN_ANGLE));
    }

    function updateNeedleColor(angle) {
      const normalized = (angle - VU_MIN_ANGLE) / (VU_MAX_ANGLE - VU_MIN_ANGLE);
      const r = Math.round(34 + normalized * (255 - 34));
      const g = Math.round(139 - normalized * (139 - 50));
      const b = Math.round(34 + normalized * (50 - 34));
      vuNeedle.style.background = `rgb(${r}, ${g}, ${b})`;
    }

    if (window.__JUCE__ && window.__JUCE__.backend) {
      window.__JUCE__.backend.addEventListener("outputLevel", (dbLevel) => {
        targetVUAngle = mapDBToAngle(dbLevel);
      });
    }

    function animateVUMeter() {
      const vuSpeed = currentVUAngle < targetVUAngle ? VU_ATTACK_SPEED : VU_DECAY_SPEED;
      currentVUAngle += (targetVUAngle - currentVUAngle) * vuSpeed;

      if (targetVUAngle <= VU_MIN_ANGLE && Math.abs(currentVUAngle - VU_MIN_ANGLE) < VU_SNAP_THRESHOLD) {
        currentVUAngle = VU_MIN_ANGLE;
      }

      vuNeedle.style.transform = `translateX(-50%) rotate(${currentVUAngle}deg)`;
      updateNeedleColor(currentVUAngle);

      requestAnimationFrame(animateVUMeter);
    }

    // ════════════════════════════════════════════════════════════════════════
    // i18n — the canon v2 block, VERBATIM from scripts/i18n-canon.js
    // ════════════════════════════════════════════════════════════════════════
    //
    // Byte-compared by check-i18n assertion 6 after comment stripping and
    // whitespace normalisation. Do not edit it here; edit the canon and every
    // copy together, which is the whole point of holding it as data.
    //
    // It sits at the END of the module, below every existing initializer, and
    // is REACHED only through the guarded initI18n() call further down. A
    // top-level statement up here that touched a lower `let` would be a TDZ
    // throw taking every later initializer with it, and on this plugin "every
    // later initializer" is the ENTIRE UI — the controller is one inline
    // module, not a file that can fail in isolation
    // (pattern_module_toplevel_init_tdz).
    //
    // setLabel() is CALLED from showPresetDropdown() above, which runs only
    // from a click handler. A module script is deferred and its body is fully
    // evaluated before any user event can fire, so nothing above reaches into
    // this block before it exists.

    let uiLanguage = 'en';
    let getUiLanguageNative = null;
    let setUiLanguageNative = null;

    // LABELS first, I18N as the fallback: a control whose tooltip title already IS
    // its label carries one key, not two copies of the same string.
    function trLabel(key, lang, vars) {
        const entry = (typeof LABELS === 'object' && LABELS && LABELS[key]) || I18N[key];
        if (!entry) { console.warn(`i18n: missing label key ${key}`); return key; }
        const s = entry[lang] || entry.en;
        const resolve = (v) => {
            const nested = (typeof LABELS === 'object' && LABELS && LABELS[v]) || I18N[v];
            return nested ? String((nested[lang] || nested.en).t) : String(v);
        };
        return vars
            ? String(s.t).replace(/\{(\w+)\}/g, (m, n) => (n in vars ? resolve(vars[n]) : m))
            : String(s.t);
    }

    function applyLabel(el) {
        const key = el.dataset.i18n;
        if (!key) return;
        let vars = null;
        try { vars = el.dataset.i18nVars ? JSON.parse(el.dataset.i18nVars) : null; }
        catch (e) { console.warn(`i18n: bad vars on ${key}`); }
        const s = trLabel(key, uiLanguage, vars);
        el.dataset.label = s;
        el.textContent   = s;
    }

    function applyI18nAttributes(el) {
        const pairs = [['i18nAria', 'aria-label'], ['i18nPlaceholder', 'placeholder'], ['i18nAlt', 'alt']];
        for (const [prop, attr] of pairs) {
            const key = el.dataset[prop];
            if (key) el.setAttribute(attr, trLabel(key, uiLanguage, null));
        }
    }

    function setLabel(el, key, vars) {
        if (!el) return;
        el.dataset.i18n = key;
        if (vars) el.dataset.i18nVars = JSON.stringify(vars); else delete el.dataset.i18nVars;
        applyLabel(el);
    }

    function applyI18n(lang) {
        uiLanguage = LANGUAGES.includes(lang) ? lang : 'en';
        // <html lang> follows the selector: screen readers pick the French voice,
        // and CSS hyphens:auto / quotes resolve in the page's actual language.
        document.documentElement.lang = uiLanguage;
        for (const [selector, key, wrapper, vars] of TIP_BINDINGS) {
            const el = document.querySelector(selector);
            if (!el) { console.warn(`i18n: tip target not found: ${selector}`); continue; }
            const target = wrapper ? (el.closest(wrapper) || el) : el;
            const s = tr(key, uiLanguage, vars);
            target.setAttribute('data-tip-title', s.t);
            target.setAttribute('data-tip', s.b);
        }
        for (const el of document.querySelectorAll('[data-i18n]')) applyLabel(el);
        for (const el of document.querySelectorAll('[data-i18n-aria],[data-i18n-placeholder],[data-i18n-alt]'))
            applyI18nAttributes(el);
        const sel = document.getElementById('lang-select');
        if (sel && sel.value !== uiLanguage) sel.value = uiLanguage;
    }

    // Exposed so a clamp gate can drive the language without teaching the ui-stub a
    // promise contract: page.evaluate((l) => window.__setLanguage(l), 'fr').
    window.__setLanguage = applyI18n;
    // Exposed for the same reason, and so a sibling module can write a localized
    // label without app.js having to export anything — O-Bitrot's controller is an
    // inline <script type="module">, where an export declaration has nowhere to go.
    window.__setLabel = setLabel;
    window.__reapplyI18n = () => applyI18n(uiLanguage);

    function initI18n() {
        try {
            getUiLanguageNative = Juce.getNativeFunction('getUiLanguage');
            setUiLanguageNative = Juce.getNativeFunction('setUiLanguage');
        } catch (e) {
            console.warn('Language preference not available, session-only:', e);
        }

        // Paint the default SYNCHRONOUSLY first. Never blank, never a flash.
        try { applyI18n('en'); } catch (e) { console.error('i18n init failed:', e); }

        if (getUiLanguageNative) {
            getUiLanguageNative()
                .then((code) => applyI18n(code === 'fr' ? 'fr' : 'en'))
                .catch((e) => console.warn('Could not read language preference:', e));
        }

        const sel = document.getElementById('lang-select');
        if (sel) sel.addEventListener('change', (e) => {
            applyI18n(e.target.value);
            if (setUiLanguageNative) setUiLanguageNative(uiLanguage).catch(() => {});
        });
    }

    // ════════════════════════════════════════════════════════════════════════
    // The settings popover (v1.2.0)
    // ════════════════════════════════════════════════════════════════════════
    //
    // ONE row, at v1.3.0 as at v1.2.0: the language selector alone. The
    // hover-help this version adds is always on and has no toggle here, and
    // tip.settings' body is written to promise exactly this one control and
    // nothing else — a tip that describes a control the panel does not have is
    // worse than no tip. The panel opens UPWARDS: the gear is 8 px from the
    // BOTTOM of a 220 px frame, and .container is overflow: hidden, so a panel
    // below it would be unreachable rather than merely clipped.

    let settingsPopoverEl = null;
    let gearBtnEl = null;

    function setSettingsPopoverOpen(open) {
        if (!settingsPopoverEl || !gearBtnEl) return;
        settingsPopoverEl.hidden = !open;
        gearBtnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function initializeSettingsPopover() {
        gearBtnEl = document.getElementById('gear-btn');
        settingsPopoverEl = document.getElementById('settings-popover');

        if (!gearBtnEl || !settingsPopoverEl) {
            console.warn('settings popover missing - language selector unavailable');
            return;
        }

        gearBtnEl.addEventListener('click', (e) => {
            e.stopPropagation();
            setSettingsPopoverOpen(settingsPopoverEl.hidden);
        });

        // Dismiss on a press anywhere else, and on Escape. pointerdown rather
        // than click, so the panel is gone before a drag on a knob underneath
        // it begins — this page starts a knob drag on pointerdown.
        document.addEventListener('pointerdown', (e) => {
            if (settingsPopoverEl.hidden) return;
            if (settingsPopoverEl.contains(e.target) || gearBtnEl.contains(e.target)) return;
            setSettingsPopoverOpen(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !settingsPopoverEl.hidden) {
                setSettingsPopoverOpen(false);
                gearBtnEl.focus();
            }
        });

    // ════════════════════════════════════════════════════════════════════════
    // HOVER-HELP (v1.3.0)
    // ════════════════════════════════════════════════════════════════════════
    //
    // Ported from O-simpleFM's setupTooltips (js/app.js:384-462), with the
    // focus latch O-Emulator added. It looks up NO copy: applyI18n() has
    // already written data-tip-title and data-tip onto each anchor in the
    // current language, and rewrites both on every language change. This
    // function only positions and shows what the anchor is already carrying,
    // which is why a language switch needs no hook here at all.
    //
    // THE FEATURE DID NOT EXIST BEFORE THIS VERSION. v1.2.0 had no #tooltip
    // node, no .tooltip rule and no hover handler, so authoring thirteen bodies
    // into i18n.js and binding them — which is all T17 asks for — would have
    // shipped thirteen INVISIBLE strings past three green gates. check-i18n
    // reads the table statically; check-ui-labels has no tooltip awareness;
    // boot-all-uis counts aria-label and title and never data-tip.
    // tests/ui_tip_render_check.js is the seat where that failure is loud.
    //
    // Every property below is load-bearing:
    //
    //  1  DELEGATED ON document, never querySelectorAll('[data-tip]') at setup.
    //     No anchor carries data-tip until applyI18n() has run, so a setup-time
    //     query binds NOTHING and fails silently.
    //  2  pointerover / pointerout / focusin / focusout, because they BUBBLE.
    //     pointerenter and focus do not, and delegation needs the bubble phase.
    //  3  pointerout IGNORES a move between two descendants of the SAME anchor.
    //     Every anchor on this page has children — the dual-knob wrapper holds
    //     an SVG scale, two knob layers and a value readout; each
    //     .three-way-toggle holds three options — so without this the tip
    //     flickers off and on at every child boundary.
    //  4  createElement + textContent, NEVER innerHTML. Localized copy must not
    //     reach a markup path (the runtime half of check-i18n assertion 9,
    //     which forbids an angle bracket in an i18n.js string literal).
    //  5  CLAMPED ON ALL FOUR EDGES with an 8 px margin, flipping to the
    //     opposite side of the cursor on overflow AND clamping the flipped
    //     result again. In a 220 px frame the vertical flip is not an edge
    //     case: every knob cell spans y 75..160 and the Q toggles sit at
    //     y 175..193, so the naive y + 16 puts most tips past the frame's own
    //     bottom — and the flip above the cursor then lands over the top rail
    //     on the low anchors. ONE FLIP IS NOT ENOUGH HERE; the second clamp is
    //     the placement that actually ships at most anchors.
    //  6  Escape hides it, and so does pointerdown: this page starts a knob
    //     drag on pointerdown, and a tip left standing over a knob being
    //     dragged covers the value readout the user is watching.
    //
    // NO drag.active FLAG IS NEEDED HERE, and that is a property of this page
    // rather than an omission. O-Chorus added one because a drag crossing into
    // a neighbouring cell opens that neighbour's tip mid-gesture. This page
    // calls container.setPointerCapture(e.pointerId) at index.html:1017, so
    // every pointer event for the rest of the drag is retargeted to the
    // captured container and no boundary event reaches a neighbour at all. The
    // render gate drives a cross-cell drag and asserts it.
    //
    // NO INPUT SUPPRESSION IS NEEDED EITHER. O-Emulator's focusin arm has to
    // skip its double-click value editor because that <input> sits INSIDE an
    // anchor. Double-click on this page RESETS the knob to its default
    // (index.html:1024-1040) and opens no field, so there is no focusable
    // descendant of any anchor except #lang-select — which IS an anchor, and
    // whose keyboard tip is the accessibility half of this feature.
    function setupTooltips() {
        const tip = document.getElementById('tooltip');
        if (!tip) { console.warn('tooltip surface missing - hover-help unavailable'); return; }

        let active = null;

        const show = (el, x, y) => {
            const title = el.getAttribute('data-tip-title');
            const body  = el.getAttribute('data-tip');
            if (!title && !body) return;

            tip.textContent = '';
            if (title) {
                const t = document.createElement('span');
                t.className = 'tip-title';
                t.textContent = title;
                tip.appendChild(t);
            }
            if (body) tip.appendChild(document.createTextNode(body));

            tip.classList.add('show');
            tip.setAttribute('aria-hidden', 'false');
            position(x, y);
        };

        // Measured AFTER the content is in place and AFTER .show, so the rect is
        // the real one. visibility: hidden keeps layout, so the box is
        // measurable even on the frame before it becomes visible.
        const position = (x, y) => {
            const M = 8;
            const r = tip.getBoundingClientRect();
            let nx = x + 14;
            let ny = y + 16;

            // Flip to the other side of the cursor rather than sliding, so the
            // tip never sits UNDER the pointer that opened it.
            if (nx + r.width  > window.innerWidth  - M) nx = x - r.width  - 14;
            if (ny + r.height > window.innerHeight - M) ny = y - r.height - 12;

            // ...AND RE-CLAMP THE FLIPPED RESULT. One flip is not enough in a
            // 220 px frame: a 145.6 px tip on the band caption at y = 62.5 wants
            // y = 78.5 below the cursor (78.5 + 145.6 = 224.1, past 212) and
            // y = -95.1 above it. Both sides of the flip are outside, and
            // without a re-clamp the tip is painted 103 px off the top of the
            // page. Driven by [4c] of tests/ui_tip_render_check.js.
            //
            // TWO LINES DO THE RE-CLAMPING AND ONLY ONE OF THEM CAN EVER FIRE.
            // Measured: the placement above lands at exactly M, which is the
            // Math.max FLOOR, not the two `if`s below it. Those two are
            // unreachable BY CONSTRUCTION rather than by luck on this page —
            // after a flip `nx + r.width` collapses to `x - 14` and
            // `ny + r.height` to `y - 12`, neither of which mentions the tip's
            // size, so neither can exceed innerWidth/innerHeight - M for a
            // cursor that is inside the viewport at all. They are kept because
            // this renderer is a byte-shaped port of a family of ten and
            // diverging one copy is how a family drifts; they are DOCUMENTED
            // because O-Chorus's copy credits them with a placement the floor is
            // actually making, and the next executor to read that comment would
            // inherit the wrong model of which line is load-bearing.
            if (nx + r.width  > window.innerWidth  - M) nx = window.innerWidth  - M - r.width;
            if (ny + r.height > window.innerHeight - M) ny = window.innerHeight - M - r.height;

            // THE FLOOR IS THE RE-CLAMP THAT SHIPS. Both edges, every time.
            tip.style.left = `${Math.max(M, nx)}px`;
            tip.style.top  = `${Math.max(M, ny)}px`;
        };

        const hide = () => {
            tip.classList.remove('show');
            tip.setAttribute('aria-hidden', 'true');
            active = null;
        };

        const anchorOf = (t) => (t && t.closest ? t.closest('[data-tip]') : null);

        document.addEventListener('pointerover', (e) => {
            const el = anchorOf(e.target);
            if (!el || el === active) return;
            active = el;
            show(el, e.clientX, e.clientY);
        });

        document.addEventListener('pointermove', (e) => {
            if (active && anchorOf(e.target) === active) position(e.clientX, e.clientY);
        });

        document.addEventListener('pointerout', (e) => {
            if (!active) return;
            if (anchorOf(e.relatedTarget) === active) return;   // same anchor, child boundary
            hide();
        });

        // THE FOCUS ARM IS LATCHED TO THE KEYBOARD, and the reason is measured.
        //
        // A mouse click on a <button> focuses it, so an unconditional focusin
        // rule re-opens the tip that pointerdown just hid — with the pointer
        // still on the anchor and no further pointerover to come. Measured on
        // the two M1 pilots that shipped without the latch: clicking #gear-btn
        // left a tip covering the settings popover it had just opened by
        // 146 x 35 px (O-Bass) and 161 x 29 px (O-AnalogSaturation). Both gates
        // stayed green throughout; check-ui-labels counts the surface as
        // pointer-events: none DECORATION and never as a label.
        //
        // :focus-visible is deliberately NOT the discriminator. Chromium reports
        // it false for a programmatic .focus() following a click, so a gate
        // driving focus directly would measure "no tip" and record that as
        // correct — a false pass built into the fix. An explicit last-input-
        // device latch is the same rule and is drivable with real events.
        //
        // A STATIC grep FOR THIS VARIABLE CANNOT CHECK IT. Delete the guard
        // clause below and the declaration, the pointerdown write and the
        // keydown clear all still match; only the behaviour changes. O-Comp
        // proved that, so the render gate discriminates BEHAVIOURALLY, with the
        // active element blurred first — clicking an already-focused element
        // fires no focusin at all, and an assertion written without the blur
        // passed 125/125 with the latch deleted.
        let lastInputWasPointer = false;

        document.addEventListener('pointerdown', () => { lastInputWasPointer = true; hide(); });

        document.addEventListener('focusin', (e) => {
            if (lastInputWasPointer) return;
            const el = anchorOf(e.target);
            if (!el) return;
            active = el;
            const r = el.getBoundingClientRect();
            show(el, r.left + r.width / 2, r.bottom);
        });

        document.addEventListener('focusout', hide);

        // One keydown listener, two jobs: any key at all means the keyboard is
        // driving again, which releases the latch above; Escape additionally
        // hides. Registered AFTER initializeSettingsPopover's own keydown, so
        // that handler's Escape -> gearBtnEl.focus() is still seen with the
        // latch as the PREVIOUS input left it: a pointer user who clicked the
        // gear and then pressed Escape gets no tip, a keyboard user does.
        document.addEventListener('keydown', (e) => {
            lastInputWasPointer = false;
            if (e.key === 'Escape') hide();
        });
    }

    // Guarded, and LAST. Every parameter binding above has already been
    // registered, so an i18n failure leaves an English plugin that still works
    // rather than a dead page.
    //
    // setupTooltips() runs AFTER initI18n() and inside the SAME try/catch.
    // After, because the anchors carry no data-tip until applyI18n has run —
    // delegation would survive the other order, but the focusin path reads the
    // attribute at bind time on nothing. Same try/catch, because if initI18n
    // threw there are no tip attributes to render anyway, and a top-level call
    // reaching a lower let/const is the TDZ throw that would take this whole
    // inline module — and therefore the ENTIRE UI — with it
    // (pattern_module_toplevel_init_tdz).
    initializeSettingsPopover();
    try { initI18n(); setupTooltips(); } catch (e) { console.error('i18n init failed:', e); }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O-IntonationPad</title>
    <link rel="stylesheet" href="/css/tuning-panel.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2a2a2a;
            font-family: 'Garamond', 'Times New Roman', serif;
        }

        .plugin-container {
            width: 800px;
            height: 500px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 3px solid #5C4033;
            overflow: hidden;
        }

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .botanical-overlay {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            height: 75%;
            opacity: 0.35;
            pointer-events: none;
        }

        .content {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .title {
            font-size: 22px;
            color: #3C2F2F;
            letter-spacing: 3px;
            font-weight: normal;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 6px;
        }

        .tab-button {
            padding: 6px 14px;
            background: rgba(139, 168, 112, 0.3);
            border: 2px solid #5C4033;
            border-radius: 4px 4px 0 0;
            font-family: 'Garamond', serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #3C2F2F;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .tab-button::before {
            content: '❦';
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 7px;
            color: rgba(60, 92, 26, 0.2);
        }

        .tab-button:hover {
            background: rgba(139, 168, 112, 0.5);
        }

        .tab-button.active {
            background: rgba(107, 142, 35, 0.6);
            color: #1a2a10;
            border-bottom: none;
        }

        .main-section {
            flex: 1;
            display: flex;
            gap: 15px;
            overflow: hidden;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            gap: 15px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Tuning tab: scrollable when content exceeds available height */
        #tuning-tab {
            overflow-y: auto;
        }

        #tuning-tab::-webkit-scrollbar {
            width: 6px;
        }

        #tuning-tab::-webkit-scrollbar-track {
            background: transparent;
        }

        #tuning-tab::-webkit-scrollbar-thumb {
            background: rgba(139, 115, 85, 0.3);
            border-radius: 3px;
        }

        /* Knob Styles */
        .knob-row {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .voice-settings-row {
            gap: 12px;
            align-items: flex-start;
        }

        .active-notes-label {
            text-align: center;
        }

        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        /* SVG Vine-Arc Knobs (O-Detune style) */
        .knob {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .knob-visual {
            width: 52px;
            height: 52px;
            position: relative;
        }

        .knob-visual.small {
            width: 44px;
            height: 44px;
        }

        .knob-visual svg {
            width: 100%;
            height: 100%;
            transform: rotate(-135deg);
        }

        .knob-track {
            fill: none;
            stroke: rgba(139, 115, 85, 0.3);
            stroke-width: 2;
        }

        .knob-vine {
            fill: none;
            stroke: #6B8E23;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .knob-label {
            font-size: 11px;
            color: #3C2F2F;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .knob-value {
            font-size: 10px;
            color: #5C4033;
            font-weight: bold;
        }

        /* Dropdown Styles */
        .dropdown-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .dropdown {
            width: 140px;
            padding: 6px 24px 6px 10px;
            background: rgba(139, 168, 112, 0.3);
            border: 2px solid #5C4033;
            border-radius: 4px;
            font-family: 'Garamond', serif;
            font-size: 11px;
            color: #3C2F2F;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            background-image:
                linear-gradient(135deg, transparent 45%, rgba(92, 64, 51, 0.1) 45%, rgba(92, 64, 51, 0.1) 55%, transparent 55%),
                linear-gradient(225deg, transparent 45%, rgba(92, 64, 51, 0.1) 45%, rgba(92, 64, 51, 0.1) 55%, transparent 55%);
            background-size: 8px 8px;
            background-position: calc(100% - 10px) center, calc(100% - 6px) center;
            background-repeat: no-repeat;
            appearance: none;
            text-align: center;
        }

        .section-divider {
            height: 1px;
            background: repeating-linear-gradient(90deg, #5C4033 0px, #5C4033 4px, transparent 4px, transparent 8px);
            opacity: 0.3;
            margin: 5px 0;
        }

        /* Mini Keyboard */
        .keyboard-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-height: 0;
        }

        .mini-keyboard {
            position: relative;
            height: 50px;
            border: 1px solid #8B7355;
            border-radius: 3px;
            overflow: hidden;
            background: rgba(255, 248, 220, 0.3);
        }

        .key {
            position: absolute;
            top: 0;
            border: 1px solid #8B7355;
            border-radius: 0 0 2px 2px;
            transition: background 0.08s;
        }

        .key.white {
            height: 100%;
            background: rgba(255, 248, 220, 0.8);
            z-index: 1;
        }

        .key.black {
            height: 60%;
            background: #3C2F2F;
            z-index: 2;
            border-color: #2a2020;
        }

        .key.white.active {
            background: rgba(107, 142, 35, var(--key-opacity, 0.7));
            box-shadow: inset 0 0 6px rgba(107, 142, 35, calc(var(--key-opacity, 0.7) * 0.7));
            transition: background 0.15s, box-shadow 0.15s;
        }

        .key.black.active {
            background: rgba(74, 110, 30, var(--key-opacity, 1.0));
            box-shadow: inset 0 0 6px rgba(107, 142, 35, calc(var(--key-opacity, 1.0) * 0.7));
            transition: background 0.15s, box-shadow 0.15s;
        }

        .key-label {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6px;
            color: #5C4033;
            pointer-events: none;
            white-space: nowrap;
        }

        .key.black .key-label {
            color: #C9A27B;
        }

        /* Frequency List */
        .freq-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            overflow-y: auto;
            max-height: 100px;
            width: 100%;
            padding: 2px;
        }

        .freq-placeholder {
            font-size: 10px;
            color: rgba(60, 47, 47, 0.4);
            font-style: italic;
        }

        .freq-item {
            display: flex;
            gap: 4px;
            align-items: baseline;
            background: rgba(255, 248, 220, 0.5);
            padding: 3px 6px;
            border-radius: 3px;
            border: 1px solid rgba(139, 115, 85, 0.4);
            font-size: 9px;
            color: #3C2F2F;
        }

        .freq-note {
            font-weight: bold;
            color: #2C3E10;
            font-size: 10px;
        }

        .freq-hz {
            color: #5C4033;
        }

        .freq-cents {
            font-size: 8px;
        }

        .freq-cents.sharp {
            color: #8B4513;
        }

        .freq-cents.flat {
            color: #4a6e1e;
        }

        .freq-cents.zero {
            color: #888;
        }

        .freq-count {
            font-size: 8px;
            color: #5C4033;
            font-weight: bold;
            opacity: 0.7;
        }

        .freq-item.out-of-range {
            border-color: rgba(139, 69, 19, 0.6);
            background: rgba(139, 69, 19, 0.15);
        }

        .freq-range-badge {
            font-size: 7px;
            color: #8B4513;
            vertical-align: super;
            margin-left: 1px;
        }

        .kb-overflow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8px;
            color: #8B4513;
            background: rgba(255, 248, 220, 0.8);
            padding: 2px 4px;
            border-radius: 2px;
            border: 1px solid rgba(139, 69, 19, 0.4);
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
        }

        .kb-overflow.above {
            right: -2px;
        }

        .kb-overflow.below {
            left: -2px;
        }

        /* v1.5.0: Interval Selector */
        .interval-selector {
            flex: 1;
            min-width: 0;
        }

        .interval-selector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .interval-quick-btns {
            display: flex;
            gap: 4px;
        }

        .interval-quick-btn {
            padding: 2px 8px;
            background: rgba(139, 168, 112, 0.3);
            border: 1px solid #5C4033;
            border-radius: 3px;
            font-family: 'Garamond', serif;
            font-size: 9px;
            color: #3C2F2F;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .interval-quick-btn:hover {
            background: rgba(139, 168, 112, 0.5);
        }

        .interval-toggle-list {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            max-height: 90px;
            overflow-y: auto;
            padding: 4px;
            background: rgba(255, 248, 220, 0.3);
            border: 1px solid rgba(139, 115, 85, 0.4);
            border-radius: 4px;
        }

        .interval-toggle-item {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px 6px;
            background: rgba(255, 248, 220, 0.5);
            border: 1px solid rgba(139, 115, 85, 0.3);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 9px;
            color: #5C4033;
        }

        .interval-toggle-item:hover {
            background: rgba(139, 168, 112, 0.3);
        }

        .interval-toggle-item.enabled {
            background: rgba(107, 142, 35, 0.4);
            border-color: rgba(107, 142, 35, 0.6);
            color: #1a2a10;
        }

        .interval-toggle-item.root {
            background: rgba(107, 142, 35, 0.6);
            border-color: rgba(107, 142, 35, 0.8);
            color: #1a2a10;
            font-weight: bold;
            cursor: default;
        }

        .interval-toggle-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(139, 115, 85, 0.3);
            flex-shrink: 0;
        }

        .interval-toggle-item.enabled .interval-toggle-dot,
        .interval-toggle-item.root .interval-toggle-dot {
            background: #4a6e1e;
        }

        .interval-toggle-cents {
            font-size: 8px;
            color: rgba(92, 64, 51, 0.6);
        }

        .interval-toggle-item.enabled .interval-toggle-cents {
            color: rgba(26, 42, 16, 0.7);
        }

        .interval-loading {
            font-size: 10px;
            color: rgba(60, 47, 47, 0.4);
            font-style: italic;
            padding: 6px;
        }

        /* v1.11.0: Effects Tab */
        #effects-tab {
            overflow-y: auto;
            gap: 6px;
        }

        #effects-tab::-webkit-scrollbar {
            width: 6px;
        }

        #effects-tab::-webkit-scrollbar-track {
            background: transparent;
        }

        #effects-tab::-webkit-scrollbar-thumb {
            background: rgba(139, 115, 85, 0.3);
            border-radius: 3px;
        }

        .fx-section {
            background: rgba(255, 248, 220, 0.25);
            border: 1px solid rgba(139, 115, 85, 0.35);
            border-radius: 5px;
            padding: 6px 10px;
        }

        .fx-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .fx-title {
            font-size: 11px;
            font-weight: bold;
            color: #2C3E10;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fx-bypass-btn {
            padding: 2px 8px;
            background: rgba(107, 142, 35, 0.5);
            border: 1px solid #5C4033;
            border-radius: 3px;
            font-family: 'Garamond', serif;
            font-size: 9px;
            color: #1a2a10;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s;
        }

        .fx-bypass-btn.bypassed {
            background: rgba(139, 115, 85, 0.2);
            color: rgba(60, 47, 47, 0.4);
        }

        .fx-knobs {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .fx-section.bypassed .fx-knobs {
            opacity: 0.35;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="plugin-container">
        <img src="img/paper.jpg" alt="Background" class="background">
        <img src="img/shell.png" alt="Botanical" class="botanical-overlay">

        <div class="content">
            <div class="header">
                <h1 class="title">O-IntonationPad</h1>
                <div class="tab-nav">
                    <button class="tab-button active" data-tab="voice">Voice</button>
                    <button class="tab-button" data-tab="tuning">Tuning</button>
                    <button class="tab-button" data-tab="synth">Synth</button>
                    <button class="tab-button" data-tab="effects">Effects</button>
                </div>
            </div>

            <div class="main-section">
                <!-- Voice Tab -->
                <div class="tab-content active" id="voice-tab">
                    <div class="knob-row" id="voice-knobs"></div>

                    <div class="section-divider"></div>

                    <div class="knob-row voice-settings-row">
                        <div class="dropdown-container">
                            <div class="knob-label">Key Root</div>
                            <select class="dropdown" id="keyRootSelect">
                                <option value="0">C</option>
                                <option value="1">C#</option>
                                <option value="2">D</option>
                                <option value="3">D#</option>
                                <option value="4">E</option>
                                <option value="5">F</option>
                                <option value="6">F#</option>
                                <option value="7">G</option>
                                <option value="8">G#</option>
                                <option value="9">A</option>
                                <option value="10">A#</option>
                                <option value="11">B</option>
                            </select>
                        </div>

                        <!-- v1.5.0: Interval Selector (replaces Scale dropdown) -->
                        <div class="interval-selector">
                            <div class="interval-selector-header">
                                <div class="knob-label">Intervals</div>
                                <div class="interval-quick-btns">
                                    <button class="interval-quick-btn" id="intervalAllBtn">All</button>
                                    <button class="interval-quick-btn" id="intervalNoneBtn">None</button>
                                </div>
                            </div>
                            <div class="interval-toggle-list" id="intervalToggleList">
                                <div class="interval-loading">Loading...</div>
                            </div>
                        </div>
                    </div>

                    <div class="section-divider"></div>

                    <div class="keyboard-section">
                        <div class="knob-label active-notes-label">Active Notes</div>
                        <div class="mini-keyboard" id="miniKeyboard"></div>
                        <div class="freq-list" id="freqList">
                            <span class="freq-placeholder">Play a note to see chord voicing</span>
                        </div>
                    </div>
                </div>

                <!-- Tuning Tab (v1.3.0: Full tuning module) -->
                <div class="tab-content" id="tuning-tab">
                    <div id="tuning-container"></div>
                </div>

                <!-- Synth Tab -->
                <div class="tab-content" id="synth-tab" style="gap: 6px;">
                    <div class="knob-row" id="oscA-row" style="align-items: flex-end; gap: 12px;"></div>
                    <div class="section-divider" style="margin: 2px 0;"></div>
                    <div class="knob-row" id="oscB-row" style="align-items: flex-end; gap: 12px;"></div>
                    <div class="section-divider" style="margin: 2px 0;"></div>
                    <div class="knob-row" id="synth-env-knobs" style="gap: 18px;"></div>
                    <div class="section-divider" style="margin: 2px 0;"></div>
                    <div class="knob-row" id="synth-random-knobs" style="gap: 18px;"></div>
                </div>

                <!-- Effects Tab (v1.11.0) -->
                <div class="tab-content" id="effects-tab">
                    <div class="fx-section" id="chorusSection">
                        <div class="fx-header">
                            <span class="fx-title">Chorus</span>
                            <button class="fx-bypass-btn" id="chorusBypassBtn">On</button>
                        </div>
                        <div class="fx-knobs" id="chorus-knobs"></div>
                    </div>
                    <div class="fx-section" id="delaySection">
                        <div class="fx-header">
                            <span class="fx-title">Delay</span>
                            <button class="fx-bypass-btn" id="delayBypassBtn">On</button>
                        </div>
                        <div class="fx-knobs" id="delay-knobs"></div>
                    </div>
                    <div class="fx-section" id="eqSection">
                        <div class="fx-header">
                            <span class="fx-title">EQ</span>
                            <button class="fx-bypass-btn" id="eqBypassBtn">On</button>
                        </div>
                        <div class="fx-knobs" id="eq-knobs"></div>
                    </div>
                    <div class="fx-section" id="reverbSection">
                        <div class="fx-header">
                            <span class="fx-title">Reverb</span>
                            <button class="fx-bypass-btn" id="reverbBypassBtn">On</button>
                        </div>
                        <div class="fx-knobs" id="reverb-knobs"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JUCE WebView Bridge -->
    <script type="module" src="js/juce/check_native_interop.js"></script>
    <script type="module">
        import * as Juce from './js/juce/index.js';

        // JUCE Parameter States
        let voiceCountState, complexityState, keyRootState, stereoSpreadState, spacingState, inversionState;
        let wavetableBankState, wavetablePosState, lfoRateState, lfoDepthState, timingRandomState, detuneRandomState;
        let wavetableBank2State, wavetablePos2State, lfoRate2State, lfoDepth2State, gainAState, gainBState;
        let attackTimeState, releaseTimeState, filterCutoffState, masterVolumeState;
        // v1.11.0: Effects states
        let chorusRateState, chorusDepthState, chorusMixState;
        let delayTimeState, delayFeedbackState, delayModeState, delayMixState;
        let eqLowGainState, eqMidGainState, eqMidFreqState, eqHighGainState;
        let reverbSizeState, reverbDampState, reverbPredelayState, reverbMixState;
        let chorusBypassState, delayBypassState, eqBypassState, reverbBypassState;

        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // ====================================================================
        // KNOB FACTORY + WAVETABLE BANK DATA
        // ====================================================================

        const WAVETABLE_BANKS = [
            'JI Harmonic', 'Warm Analog', 'Choir', 'Strings', 'Glass', 'Evolving',
            'Organ', 'Ethereal', 'Dark Matter', 'Sine', 'Square', 'Triangle',
            'Spectral Cloud', 'Metallic Res.', 'Formant Vowel', 'Warm Sub'
        ];

        // size: 'small' = 44px (r=18), default = 52px (r=22)
        function makeKnob(id, label, size, labelStyle) {
            const isSmall = size === 'small';
            const vb = isSmall ? 44 : 52;
            const c = isSmall ? 22 : 26;
            const r = isSmall ? 18 : 22;
            const da = (2 * Math.PI * r * 0.75).toFixed(2);

            const container = document.createElement('div');
            container.className = 'knob-container';
            container.innerHTML =
                `<div class="knob" id="${id}Knob">` +
                    `<div class="knob-visual${isSmall ? ' small' : ''}">` +
                        `<svg viewBox="0 0 ${vb} ${vb}">` +
                            `<circle class="knob-track" cx="${c}" cy="${c}" r="${r}"/>` +
                            `<circle class="knob-vine" id="${id}Vine" cx="${c}" cy="${c}" r="${r}" stroke-dasharray="${da}" stroke-dashoffset="${da}"/>` +
                        `</svg>` +
                    `</div>` +
                `</div>` +
                `<div class="knob-label"${labelStyle ? ` style="${labelStyle}"` : ''}>${label}</div>` +
                `<div class="knob-value" id="${id}Value"></div>`;
            return container;
        }

        function makeWavetableDropdown(selectId, oscLabel) {
            const wrapper = document.createElement('div');
            wrapper.className = 'dropdown-container';
            const lbl = document.createElement('div');
            lbl.className = 'knob-label';
            lbl.style.cssText = 'font-weight: bold; color: #2C3E10;';
            lbl.textContent = oscLabel;
            const sel = document.createElement('select');
            sel.className = 'dropdown';
            sel.id = selectId;
            sel.style.width = '120px';
            WAVETABLE_BANKS.forEach((name, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = name;
                sel.appendChild(opt);
            });
            wrapper.appendChild(lbl);
            wrapper.appendChild(sel);
            return wrapper;
        }

        function populateKnobs(containerId, knobs) {
            const el = document.getElementById(containerId);
            if (!el) return;
            for (const k of knobs) {
                el.appendChild(makeKnob(k.id, k.label, k.size, k.labelStyle));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('JUCE backend:', window.__JUCE__?.backend);

            // Build knob DOM from config
            populateKnobs('voice-knobs', [
                { id: 'voiceCount', label: 'Voices' },
                { id: 'complexity', label: 'Complexity' },
                { id: 'stereoSpread', label: 'Spread' },
                { id: 'spacing', label: 'Spacing' },
                { id: 'inversion', label: 'Inversion' },
            ]);

            // OSC A: dropdown + knobs

        // Tab switching logic
        function setupTabs() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetTab = button.dataset.tab;

                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));

                    button.classList.add('active');
                    document.getElementById(`${targetTab}-tab`).classList.add('active');
                });
            });
        }

        // Global knob drag state — one pair of document-level listeners for all knobs
        const knobDrag = { active: false, state: null, lastY: 0, virtualNorm: 0 };

        document.addEventListener('mousemove', (e) => {
            if (!knobDrag.active) return;
            const deltaY = knobDrag.lastY - e.clientY;
            const sensitivity = 0.005;
            knobDrag.virtualNorm = Math.max(0, Math.min(1, knobDrag.virtualNorm + (deltaY * sensitivity)));
            knobDrag.state.setNormalisedValue(knobDrag.virtualNorm);
            knobDrag.lastY = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            if (knobDrag.active) {
                knobDrag.state.sliderDragEnded();
                knobDrag.active = false;
                knobDrag.state = null;
            }
        });

        // Generic knob setup (SVG vine-arc style)
        function setupKnob(paramId, state, min, max, unit, formatter) {
            if (!state) {
                console.error(`Failed to get slider state for ${paramId}`);
                return;
            }

            const knobEl = document.getElementById(`${paramId}Knob`);
            const vine = document.getElementById(`${paramId}Vine`);
            const valueDisplay = document.getElementById(`${paramId}Value`);

            if (!knobEl || !vine || !valueDisplay) return;

            // Calculate arc length from SVG circle radius
            // Arc spans 270 degrees (0.75 of circumference)
            const r = parseFloat(vine.getAttribute('r'));
            const arcLength = 2 * Math.PI * r * 0.75;

            let isEditing = false;

            function updateVisual() {
                const normValue = state.getNormalisedValue();
                const realValue = min + (normValue * (max - min));

                // Update SVG vine arc
                const offset = arcLength - (normValue * arcLength);
                vine.style.strokeDashoffset = offset;

                // Update value display (skip when user is editing)
                if (!isEditing) {
                    const formatted = formatter ? formatter(realValue) : realValue.toFixed(1);
                    valueDisplay.textContent = formatted + unit;
                }
            }

            // JUCE -> UI
            state.valueChangedEvent.addListener(() => updateVisual());

            // UI -> JUCE (drag on knob-visual)
            const knobVisual = knobEl.querySelector('.knob-visual');
            (knobVisual || knobEl).addEventListener('mousedown', (e) => {
                knobDrag.active = true;
                knobDrag.state = state;
                knobDrag.lastY = e.clientY;
                knobDrag.virtualNorm = state.getNormalisedValue();
                state.sliderDragStarted();
                e.preventDefault();
            });

            // Mouse wheel support
            (knobVisual || knobEl).addEventListener('wheel', (e) => {
                e.preventDefault();
                const currentNorm = state.getNormalisedValue();
                const delta = e.deltaY < 0 ? 0.02 : -0.02;
                const newNorm = Math.max(0, Math.min(1, currentNorm + delta));
                state.setNormalisedValue(newNorm);
            }, { passive: false });

            updateVisual();

            // Double-click to edit knob value
            valueDisplay.style.cursor = 'text';
            valueDisplay.title = 'Double-click to edit';
            valueDisplay.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if (isEditing) return;
                isEditing = true;

                const normValue = state.getNormalisedValue();
                const realValue = min + (normValue * (max - min));
                const formatted = formatter ? formatter(realValue) : realValue.toFixed(1);

                const input = document.createElement('input');
                input.type = 'text';
                input.value = formatted;
                input.style.cssText = `
                    width: 50px; text-align: center; font-size: 10px;
                    font-family: 'Garamond', serif; font-weight: bold;
                    color: #5C4033; background: rgba(255,248,220,0.9);
                    border: 1px solid #8B7355; border-radius: 3px;
                    padding: 1px 2px; outline: none; user-select: text;
                    -webkit-user-select: text;
                `;

                valueDisplay.textContent = '';
                valueDisplay.appendChild(input);
                input.focus();
                input.select();

                function commitValue() {
                    if (!isEditing) return;
                    const rawVal = parseFloat(input.value);
                    if (!isNaN(rawVal)) {
                        const clamped = Math.max(min, Math.min(max, rawVal));
                        const norm = (clamped - min) / (max - min);
                        state.sliderDragStarted();
                        state.setNormalisedValue(Math.max(0, Math.min(1, norm)));
                        state.sliderDragEnded();
                    }
                    isEditing = false;
                    updateVisual();
                }

                input.addEventListener('keydown', (ev) => {
                    if (ev.key === 'Enter') { ev.preventDefault(); commitValue(); }
                    else if (ev.key === 'Escape') { isEditing = false; updateVisual(); }
                });

                input.addEventListener('blur', () => {
                    if (isEditing) commitValue();
                });
            });
        }

        // Dropdown setup
        function setupDropdown(paramId, state, maxIndex) {
            if (!state) {
                console.error(`Failed to get slider state for ${paramId}`);

            function updateVisual() {
                const normValue = state.getNormalisedValue();
                const index = Math.round(normValue * (maxIndex - 1));
                select.value = index.toString();

            state.valueChangedEvent.addListener(() => {
                updateVisual();
            });

            select.addEventListener('change', () => {
                const index = parseInt(select.value);
                const normValue = index / (maxIndex - 1);
                state.setNormalisedValue(normValue);
            });

            updateVisual();
        }

        let intervalData = [];      // Array of { cents, enabled }

        async function initIntervalSelector() {
            // Load intervals from tuning engine (don't block on initial load —
            // DAW hosts may delay native function responses during init)
            refreshIntervalSelector();

            // Quick buttons
            document.getElementById('intervalAllBtn')?.addEventListener('click', async () => {
                if (window.__JUCE__?.backend) {
                    await Juce.getNativeFunction('resetEnabledIntervals')();
                    await refreshIntervalSelector();
                }
            });

            document.getElementById('intervalNoneBtn')?.addEventListener('click', async () => {
                // Disable all except root (degree 0)
                for (let i = 0; i < intervalData.length; i++) {
                    if (i > 0) {
                        await Juce.getNativeFunction('setIntervalEnabled')(i, false);
                    }
                }
                await refreshIntervalSelector();
            });
        }

        async function refreshIntervalSelector() {
            if (!window.__JUCE__?.backend) {
                // Fallback for standalone testing
                renderIntervalToggles([0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200],
                                      Array(13).fill(true));
                return;
            }

            try {
                // Get tuning intervals (cents)
                const intervalsJson = await Juce.getNativeFunction('getTuningIntervals')();
                const intervals = JSON.parse(intervalsJson);

                // Get enabled state
                const enabledJson = await Juce.getNativeFunction('getEnabledIntervals')();
                const enabled = JSON.parse(enabledJson);

                renderIntervalToggles(intervals, enabled);
            } catch (e) {
                console.error('[IntervalSelector] Failed to refresh:', e);
            }
        }

        function renderIntervalToggles(intervals, enabled) {
            const container = document.getElementById('intervalToggleList');
            if (!container) return;

            // intervals includes period as last element; exclude it from toggles
            const count = intervals.length - 1;

            intervalData = [];
            let html = '';

            for (let i = 0; i < count; i++) {
                const cents = intervals[i];
                const isEnabled = enabled[i] !== false;
                const isRoot = i === 0;
                intervalData.push({ cents, enabled: isEnabled });

                const label = getIntervalLabel(i, count, cents);
                const centsStr = cents.toFixed(1);

                const classes = ['interval-toggle-item'];
                if (isRoot) classes.push('root');
                else if (isEnabled) classes.push('enabled');

                html += `<div class="${classes.join(' ')}" data-index="${i}" ${isRoot ? '' : 'data-toggleable="true"'}>
                    <span class="interval-toggle-dot"></span>
                    <span>${label}</span>
                    <span class="interval-toggle-cents">${centsStr}c</span>
                </div>`;
            }

            container.innerHTML = html;

            // Attach toggle handlers
            container.querySelectorAll('[data-toggleable]').forEach(item => {
                item.addEventListener('click', async () => {
                    const idx = parseInt(item.dataset.index);
                    const currentlyEnabled = item.classList.contains('enabled');
                    const newState = !currentlyEnabled;

                    // Update C++
                    if (window.__JUCE__?.backend) {
                        await Juce.getNativeFunction('setIntervalEnabled')(idx, newState);
                    }

                    // Update UI immediately
                    item.classList.toggle('enabled', newState);
                    intervalData[idx].enabled = newState;
                });
            });
        }

        function getIntervalLabel(index, scaleSize, cents) {
            if (index === 0) return 'R';  // Root

            if (scaleSize === 12) {
                // For 12-note scales, use semitone names
                const names = ['R', 'm2', 'M2', 'm3', 'M3', 'P4', 'TT', 'P5', 'm6', 'M6', 'm7', 'M7'];
                return names[index] || index.toString();
            }

            // For other scale sizes, use degree number
            return index.toString();
        }

        // Refresh interval selector when any scale change occurs
        // (covers preset changes, .SCL loads, generators, embedded tunings, tonic rotation)
        window.addEventListener('tuningScaleChanged', () => {
            setTimeout(() => refreshIntervalSelector(), 100);
        });

        // Also refresh when temperament preset changes via APVTS (direct parameter change)

        if (tempState) {

            });
        }

        // ====================================================================
        // MINI KEYBOARD + ACTIVE NOTES VISUALIZATION
        // ====================================================================

        // Keyboard range: C2 (36) to B5 (83) = 4 octaves
        const KB_LOW = 36;
        const KB_HIGH = 83;
        const BLACK_KEYS = new Set([1, 3, 6, 8, 10]); // pitch classes that are black keys

        // Map of MIDI note -> key DOM element
        const keyElements = new Map();

        // Previous active MIDI notes (for diffing) — Map<midi, gain>
        let prevActiveMidi = new Map();

        function buildKeyboard() {
            const container = document.getElementById('miniKeyboard');
            if (!container) return;

            // Count white keys in range to calculate widths
            let whiteCount = 0;
            for (let m = KB_LOW; m <= KB_HIGH; m++) {
                if (!BLACK_KEYS.has(m % 12)) whiteCount++;
            }

            // Available width (Voice tab is ~760px)
            const availWidth = 720;
            const whiteW = Math.floor(availWidth / whiteCount);
            const blackW = Math.floor(whiteW * 0.6);
            container.style.width = (whiteCount * whiteW) + 'px';

            let whiteIndex = 0;
            for (let m = KB_LOW; m <= KB_HIGH; m++) {
                const pc = m % 12;
                const isBlack = BLACK_KEYS.has(pc);
                const key = document.createElement('div');
                key.classList.add('key', isBlack ? 'black' : 'white');
                key.dataset.midi = m;

                if (isBlack) {
                    // Position black key overlapping previous white key
                    const leftPos = (whiteIndex * whiteW) - Math.floor(blackW / 2);
                    key.style.left = leftPos + 'px';
                    key.style.width = blackW + 'px';
                } else {
                    key.style.left = (whiteIndex * whiteW) + 'px';
                    key.style.width = whiteW + 'px';
                    whiteIndex++;
                }

                // Add C note labels on white keys
                if (pc === 0) {
                    const oct = Math.floor(m / 12) - 1;
                    const label = document.createElement('span');
                    label.className = 'key-label';
                    label.textContent = 'C' + oct;
                    key.appendChild(label);
                }

                container.appendChild(key);
                keyElements.set(m, key);
            }
        }

        function updateActiveNotes(notes) {
            const activeMidi = new Map(); // midi -> max gain
            const freqList = document.getElementById('freqList');

            // Collect active MIDI notes with their max gain
            for (const n of notes) {
                const gain = n.gain !== undefined ? n.gain : 1.0;
                const existing = activeMidi.get(n.midi) || 0;
                activeMidi.set(n.midi, Math.max(existing, gain));
            }

            // Update keyboard highlighting with gain-based opacity
            for (const midi of prevActiveMidi.keys()) {
                if (!activeMidi.has(midi)) {
                    const el = keyElements.get(midi);
                    if (el) {
                        el.classList.remove('active');
                        el.style.removeProperty('--key-opacity');
                    }
                    // Notify tuning panel of note-off
                    if (window.tuningNoteOff) window.tuningNoteOff(midi);
                }
            }
            for (const [midi, gain] of activeMidi) {
                const el = keyElements.get(midi);
                if (el) {
                    el.classList.add('active');
                    el.style.setProperty('--key-opacity', gain.toFixed(3));
                }
                // Notify tuning panel of note-on (only for newly active)
                if (!prevActiveMidi.has(midi) && window.tuningNoteOn) {
                    window.tuningNoteOn(midi);
                }
            }
            prevActiveMidi = activeMidi;

            // v1.4.0: Feed held notes + frequencies to tuning panel for TrueKeys
            if (window.updateHeldNotes) {
                const uniqueNotes = new Map(); // midi -> freq (deduplicate)
                for (const n of notes) {
                    if (!uniqueNotes.has(n.midi)) {
                        uniqueNotes.set(n.midi, n.hz);
                    }
                }
                const midiArr = [...uniqueNotes.keys()];
                const freqArr = midiArr.map(m => uniqueNotes.get(m));
                window.updateHeldNotes(midiArr, freqArr);
            }

            // Update frequency list
            if (notes.length === 0) {
                freqList.innerHTML = '<span class="freq-placeholder">Play a note to see chord voicing</span>';
                return;
            }

            // Sort by MIDI note for display
            const sorted = [...notes].sort((a, b) => a.midi - b.midi);

            // Group by MIDI note, count voices per note, track max gain
            const groups = new Map();
            for (const n of sorted) {
                const gain = n.gain !== undefined ? n.gain : 1.0;
                if (!groups.has(n.midi)) {
                    groups.set(n.midi, { note: n, count: 1, maxGain: gain });
                } else {
                    const g = groups.get(n.midi);
                    g.count++;
                    g.maxGain = Math.max(g.maxGain, gain);
                }
            }

            let html = '';
            for (const [, { note: n, count, maxGain }] of groups) {
                const noteName = NOTE_NAMES[n.pc] + n.oct;
                const centsAbs = Math.abs(n.cents);
                let centsStr, centsClass;
                const outOfRange = n.midi < KB_LOW || n.midi > KB_HIGH;

                if (centsAbs < 0.5) {
                    centsStr = '0¢';
                    centsClass = 'zero';
                } else if (n.cents > 0) {
                    centsStr = '+' + n.cents.toFixed(1) + '¢';
                    centsClass = 'sharp';
                } else {
                    centsStr = n.cents.toFixed(1) + '¢';
                    centsClass = 'flat';
                }

                const rangeClass = outOfRange ? ' out-of-range' : '';
                const rangeBadge = outOfRange
                    ? `<span class="freq-range-badge">${n.midi > KB_HIGH ? '↑' : '↓'}</span>`
                    : '';
                const countBadge = count > 1 ? `<span class="freq-count">×${count}</span>` : '';
                // Opacity reflects complexity gain (min 0.3 so fading notes are still visible)
                const opacity = (0.3 + maxGain * 0.7).toFixed(3);

                html += `<div class="freq-item${rangeClass}" style="opacity: ${opacity}; transition: opacity 0.15s;">
                    <span class="freq-note">${noteName}${rangeBadge}</span>
                    ${countBadge}
                    <span class="freq-hz">${n.hz.toFixed(1)} Hz</span>
                    <span class="freq-cents ${centsClass}">${centsStr}</span>
                </div>`;
            }
            freqList.innerHTML = html;
        }
    </script>
</body>
</html>

# GitHub Actions Workflow for Cross-Platform Plugin Builds
#
# Triggers on tags matching: *-v* (e.g., OuariconTremolo-v1.4.0)
# Builds: macOS (Universal), Windows
# Creates: GitHub Release with all artifacts

name: Build and Release

on:
  push:
    tags:
      - '*-v*'  # Matches: PluginName-vX.Y.Z

env:
  JUCE_VERSION: '8.0.4'
  BUILD_TYPE: Release

jobs:
  # ============================================
  # Parse tag to extract plugin name and version
  # ============================================
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      plugin_name: ${{ steps.parse.outputs.plugin_name }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract plugin name (everything before -v)
          PLUGIN_NAME="${TAG%-v*}"
          # Extract version (everything after -v)
          VERSION="${TAG##*-v}"
          echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Parsed: Plugin=$PLUGIN_NAME, Version=$VERSION"

  # ============================================
  # macOS Build (Universal Binary: Intel + ARM)
  # ============================================
  build-macos:
    needs: parse-tag
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JUCE
        run: |
          # Download and extract JUCE
          curl -L "https://github.com/juce-framework/JUCE/releases/download/${{ env.JUCE_VERSION }}/juce-${{ env.JUCE_VERSION }}-osx.zip" -o juce.zip
          unzip -q juce.zip
          # JUCE extracts to JUCE/ directory

      - name: Patch CMakeLists for CI
        run: |
          # Replace hardcoded JUCE path with relative path for CI
          sed -i '' 's|add_subdirectory(/Users/taylorbrook/JUCE JUCE)|add_subdirectory(${CMAKE_CURRENT_SOURCE_DIR}/JUCE JUCE)|' CMakeLists.txt

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DOUARICON_LICENSING=ON \
            -DOUARICON_RELEASE=ON \
            -DOUARICON_SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -DOUARICON_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Resolve CMake Target
        id: resolve
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          CMAKE_TARGET=$(grep 'juce_add_plugin(' "plugins/${PLUGIN}/CMakeLists.txt" | head -1 | sed 's/.*juce_add_plugin(\([^ )]*\).*/\1/')
          echo "cmake_target=$CMAKE_TARGET" >> $GITHUB_OUTPUT
          echo "Resolved CMake target: $CMAKE_TARGET (from directory: $PLUGIN)"

      - name: Build Plugin
        run: |
          TARGET="${{ steps.resolve.outputs.cmake_target }}"
          cmake --build build --target "${TARGET}_VST3" "${TARGET}_AU" --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      - name: Import Signing Certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import Developer ID Application certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -P "$MACOS_CERTIFICATE_PWD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm certificate.p12

          # Import Developer ID Installer certificate
          echo "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode > installer-certificate.p12
          security import installer-certificate.p12 \
            -P "$MACOS_INSTALLER_CERTIFICATE_PWD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm installer-certificate.p12

          # Allow codesign/productsign to access the keychain without UI prompt
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Add temporary keychain to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> $GITHUB_ENV

      - name: Codesign Plugins
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          TARGET="${{ steps.resolve.outputs.cmake_target }}"
          ARTEFACTS_BASE="build/plugins/${PLUGIN}/${TARGET}_artefacts/${{ env.BUILD_TYPE }}"
          IDENTITY="Developer ID Application: ${{ secrets.APPLE_IDENTITY_NAME }} ($APPLE_TEAM_ID)"

          echo "Signing with identity: $IDENTITY"

          # Sign VST3 bundle
          if [ -d "${ARTEFACTS_BASE}/VST3" ]; then
            for bundle in "${ARTEFACTS_BASE}/VST3/"*.vst3; do
              echo "Signing VST3: $bundle"
              codesign --deep --force --options runtime \
                --sign "$IDENTITY" \
                --timestamp \
                "$bundle"
              echo "Verifying signature..."
              codesign --verify --verbose=2 "$bundle"
            done
          fi

          # Sign AU bundle
          if [ -d "${ARTEFACTS_BASE}/AU" ]; then
            for bundle in "${ARTEFACTS_BASE}/AU/"*.component; do
              echo "Signing AU: $bundle"
              codesign --deep --force --options runtime \
                --sign "$IDENTITY" \
                --timestamp \
                "$bundle"
              echo "Verifying signature..."
              codesign --verify --verbose=2 "$bundle"
            done
          fi

      - name: Notarize Plugins
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          TARGET="${{ steps.resolve.outputs.cmake_target }}"
          ARTEFACTS_BASE="build/plugins/${PLUGIN}/${TARGET}_artefacts/${{ env.BUILD_TYPE }}"

          # Create a ZIP of all signed bundles for notarization submission
          mkdir -p notarize_payload
          if [ -d "${ARTEFACTS_BASE}/VST3" ]; then
            cp -R "${ARTEFACTS_BASE}/VST3/"*.vst3 notarize_payload/
          fi
          if [ -d "${ARTEFACTS_BASE}/AU" ]; then
            cp -R "${ARTEFACTS_BASE}/AU/"*.component notarize_payload/
          fi

          ditto -c -k --keepParent notarize_payload notarize_payload.zip

          # Submit for notarization and wait for result
          echo "Submitting for notarization..."
          xcrun notarytool submit notarize_payload.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m

          # Staple the notarization ticket to each bundle
          echo "Stapling notarization tickets..."
          if [ -d "${ARTEFACTS_BASE}/VST3" ]; then
            for bundle in "${ARTEFACTS_BASE}/VST3/"*.vst3; do
              echo "Stapling: $bundle"
              xcrun stapler staple "$bundle"
            done
          fi
          if [ -d "${ARTEFACTS_BASE}/AU" ]; then
            for bundle in "${ARTEFACTS_BASE}/AU/"*.component; do
              echo "Stapling: $bundle"
              xcrun stapler staple "$bundle"
            done
          fi

          # Clean up
          rm -rf notarize_payload notarize_payload.zip

      - name: Create PKG Installer
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          VERSION="${{ needs.parse-tag.outputs.version }}"
          TARGET="${{ steps.resolve.outputs.cmake_target }}"
          ARTEFACTS_BASE="build/plugins/${PLUGIN}/${TARGET}_artefacts/${{ env.BUILD_TYPE }}"

          # Get PRODUCT_NAME from CMakeLists.txt
          PRODUCT_NAME=$(grep -E "PRODUCT_NAME" "plugins/${PLUGIN}/CMakeLists.txt" | head -1 | sed 's/.*PRODUCT_NAME "\([^"]*\)".*/\1/')
          # Strip CMake variable references like ${OUARICON_DEV_SUFFIX}
          PRODUCT_NAME=$(echo "$PRODUCT_NAME" | sed 's/\${[^}]*}//g')
          PRODUCT_NAME="${PRODUCT_NAME:-$PLUGIN}"
          BUNDLE_ID="io.oaudio.$(echo "$PLUGIN" | tr '[:upper:]' '[:lower:]')"

          echo "Building PKG for: $PRODUCT_NAME v$VERSION"

          # Setup directories
          PKG_DIR="$RUNNER_TEMP/pkg-build"
          mkdir -p "$PKG_DIR/payload/${PLUGIN}" "$PKG_DIR/scripts" "$PKG_DIR/resources"

          # Copy signed+notarized bundles to payload
          if [ -d "${ARTEFACTS_BASE}/VST3" ]; then
            cp -R "${ARTEFACTS_BASE}/VST3/"*.vst3 "$PKG_DIR/payload/${PLUGIN}/"
          fi
          if [ -d "${ARTEFACTS_BASE}/AU" ]; then
            cp -R "${ARTEFACTS_BASE}/AU/"*.component "$PKG_DIR/payload/${PLUGIN}/"
          fi

          # Create postinstall script
          cat > "$PKG_DIR/scripts/postinstall" << 'POSTINSTALL'
          #!/bin/bash
          ACTUAL_USER=$(stat -f '%Su' /dev/console)
          USER_HOME=$(eval echo ~$ACTUAL_USER)
          mkdir -p "$USER_HOME/Library/Audio/Plug-Ins/VST3"
          mkdir -p "$USER_HOME/Library/Audio/Plug-Ins/Components"
          for vst3 in /tmp/__PLUGIN__/*.vst3; do
            [ -e "$vst3" ] && cp -R "$vst3" "$USER_HOME/Library/Audio/Plug-Ins/VST3/"
          done
          for au in /tmp/__PLUGIN__/*.component; do
            [ -e "$au" ] && cp -R "$au" "$USER_HOME/Library/Audio/Plug-Ins/Components/"
          done
          chown -R "$ACTUAL_USER:staff" "$USER_HOME/Library/Audio/Plug-Ins/VST3/" 2>/dev/null || true
          chown -R "$ACTUAL_USER:staff" "$USER_HOME/Library/Audio/Plug-Ins/Components/" 2>/dev/null || true
          rm -rf "/tmp/__PLUGIN__"
          exit 0
          POSTINSTALL
          sed -i '' "s/__PLUGIN__/${PLUGIN}/g" "$PKG_DIR/scripts/postinstall"
          chmod +x "$PKG_DIR/scripts/postinstall"

          # Create branding files
          cat > "$PKG_DIR/resources/Welcome.txt" << EOF
          ${PRODUCT_NAME} by Ouaricon Audio

          Welcome to the ${PRODUCT_NAME} installer.

          This will install ${PRODUCT_NAME} v${VERSION}.

          What You're Installing:
          • VST3 format (compatible with most DAWs)
          • AU format (Logic Pro, GarageBand, and more)

          Click Continue to begin installation.

          oaudio.io
          EOF

          cat > "$PKG_DIR/resources/Conclusion.txt" << EOF
          Installation Complete!

          ${PRODUCT_NAME} has been successfully installed.

          FIND ${PRODUCT_NAME} IN YOUR DAW:
          VST3: Plugin browser under "Ouaricon Audio"
          AU: Audio Units > Ouaricon Audio > ${PRODUCT_NAME}

          Thank you for using ${PRODUCT_NAME}!
          — Ouaricon Audio | oaudio.io
          EOF

          # Build component package
          pkgbuild \
            --root "$PKG_DIR/payload" \
            --scripts "$PKG_DIR/scripts" \
            --identifier "$BUNDLE_ID" \
            --version "$VERSION" \
            --install-location /tmp \
            "$PKG_DIR/${PLUGIN}-Installer.pkg"

          # Create distribution XML
          cat > "$PKG_DIR/Distribution.xml" << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="1">
              <title>${PRODUCT_NAME} by Ouaricon Audio</title>
              <organization>io.oaudio</organization>
              <domains enable_localSystem="true"/>
              <options customize="never" require-scripts="true" rootVolumeOnly="true" />
              <welcome file="Welcome.txt" mime-type="text/plain" />
              <conclusion file="Conclusion.txt" mime-type="text/plain" />
              <pkg-ref id="${BUNDLE_ID}"><bundle-version/></pkg-ref>
              <choices-outline>
                  <line choice="default">
                      <line choice="${BUNDLE_ID}"/>
                  </line>
              </choices-outline>
              <choice id="default"/>
              <choice id="${BUNDLE_ID}" visible="false">
                  <pkg-ref id="${BUNDLE_ID}"/>
              </choice>
              <pkg-ref id="${BUNDLE_ID}" version="${VERSION}" onConclusion="none">${PLUGIN}-Installer.pkg</pkg-ref>
          </installer-gui-script>
          EOF

          # Build branded product
          productbuild \
            --distribution "$PKG_DIR/Distribution.xml" \
            --resources "$PKG_DIR/resources" \
            --package-path "$PKG_DIR" \
            "$PKG_DIR/${PLUGIN}-unsigned.pkg"

          # Sign the package
          INSTALLER_IDENTITY="Developer ID Installer: ${{ secrets.APPLE_IDENTITY_NAME }} ($APPLE_TEAM_ID)"
          echo "Signing PKG with: $INSTALLER_IDENTITY"
          productsign \
            --sign "$INSTALLER_IDENTITY" \
            "$PKG_DIR/${PLUGIN}-unsigned.pkg" \
            "${PLUGIN}-${VERSION}-macos.pkg"

          # Verify signature
          pkgutil --check-signature "${PLUGIN}-${VERSION}-macos.pkg"
          echo "Created: ${PLUGIN}-${VERSION}-macos.pkg"

      - name: Notarize PKG Installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          VERSION="${{ needs.parse-tag.outputs.version }}"
          PKG_FILE="${PLUGIN}-${VERSION}-macos.pkg"

          echo "Submitting PKG for notarization..."
          xcrun notarytool submit "$PKG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m

          echo "Stapling notarization ticket to PKG..."
          xcrun stapler staple "$PKG_FILE"

          echo "PKG notarized and stapled successfully"

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ needs.parse-tag.outputs.plugin_name }}-${{ needs.parse-tag.outputs.version }}-macos.pkg

  # ============================================
  # Windows Build
  # ============================================
  build-windows:
    needs: parse-tag
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JUCE
        run: |
          # Download and extract JUCE
          Invoke-WebRequest -Uri "https://github.com/juce-framework/JUCE/releases/download/${{ env.JUCE_VERSION }}/juce-${{ env.JUCE_VERSION }}-windows.zip" -OutFile juce.zip
          Expand-Archive -Path juce.zip -DestinationPath .
          # JUCE extracts to JUCE/ directory

      - name: Patch CMakeLists for CI
        run: |
          # Replace hardcoded JUCE path with relative path for CI
          (Get-Content CMakeLists.txt) -replace 'add_subdirectory\(/Users/taylorbrook/JUCE JUCE\)', 'add_subdirectory(${CMAKE_CURRENT_SOURCE_DIR}/JUCE JUCE)' | Set-Content CMakeLists.txt

      - name: Install WebView2 NuGet Package
        run: |
          Register-PackageSource -provider NuGet -name nugetRepository -location https://www.nuget.org/api/v2 -Force
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DOUARICON_LICENSING=ON -DOUARICON_RELEASE=ON -DOUARICON_SUPABASE_URL="${{ secrets.SUPABASE_URL }}" -DOUARICON_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Resolve CMake Target
        id: resolve
        shell: bash
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          CMAKE_TARGET=$(grep 'juce_add_plugin(' "plugins/${PLUGIN}/CMakeLists.txt" | head -1 | sed 's/.*juce_add_plugin(\([^ )]*\).*/\1/')
          echo "cmake_target=$CMAKE_TARGET" >> $GITHUB_OUTPUT
          echo "Resolved CMake target: $CMAKE_TARGET (from directory: $PLUGIN)"

      - name: Build Plugin
        run: |
          $TARGET = "${{ steps.resolve.outputs.cmake_target }}"
          cmake --build build --target "${TARGET}_VST3" --config ${{ env.BUILD_TYPE }}

      - name: Get Product Name
        id: product
        shell: bash
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          PRODUCT_NAME=$(sed -n 's/.*PRODUCT_NAME "\([^"]*\)".*/\1/p' "plugins/${PLUGIN}/CMakeLists.txt" | head -1)
          # Strip CMake variable references like ${OUARICON_DEV_SUFFIX}
          PRODUCT_NAME=$(echo "$PRODUCT_NAME" | sed 's/\${[^}]*}//g')
          echo "name=${PRODUCT_NAME:-$PLUGIN}" >> $GITHUB_OUTPUT

      - name: Create Inno Setup Installer
        run: |
          $PLUGIN = "${{ needs.parse-tag.outputs.plugin_name }}"
          $VERSION = "${{ needs.parse-tag.outputs.version }}"
          $TARGET = "${{ steps.resolve.outputs.cmake_target }}"
          $PRODUCT_NAME = "${{ steps.product.outputs.name }}"
          $ARTEFACTS = "build\plugins\$PLUGIN\${TARGET}_artefacts\${{ env.BUILD_TYPE }}"

          # Stage the VST3 bundle
          New-Item -ItemType Directory -Force -Path staging
          if (Test-Path "$ARTEFACTS\VST3") {
            Copy-Item -Recurse "$ARTEFACTS\VST3\*" staging\
          }

          Write-Host "Staged artifacts:"
          Get-ChildItem -Recurse staging

          # Generate Inno Setup script
          $ISS = @"
          [Setup]
          AppName=$PRODUCT_NAME
          AppVersion=$VERSION
          AppPublisher=Ouaricon Audio
          AppPublisherURL=https://oaudio.io
          DefaultDirName={commonpf}\Common Files\VST3
          DirExistsWarning=no
          DisableProgramGroupPage=yes
          OutputDir=.
          OutputBaseFilename=$PLUGIN-$VERSION-windows
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=$PRODUCT_NAME (VST3)
          WizardStyle=modern

          [Files]
          Source: "staging\*.vst3"; DestDir: "{app}"; Flags: recursesubdirs

          [Messages]
          WelcomeLabel1=$PRODUCT_NAME v$VERSION
          WelcomeLabel2=This will install $PRODUCT_NAME (VST3) by Ouaricon Audio.%n%nThe plugin will be installed to:%n  C:\Program Files\Common Files\VST3%n%nClick Next to continue.
          FinishedLabel=$PRODUCT_NAME has been installed successfully.%n%nOpen your DAW and scan for new plugins to find $PRODUCT_NAME.
          "@

          Set-Content -Path "installer.iss" -Value $ISS
          Write-Host "Generated installer.iss"

          # Compile with Inno Setup
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Write-Host "Created: $PLUGIN-$VERSION-windows.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ needs.parse-tag.outputs.plugin_name }}-${{ needs.parse-tag.outputs.version }}-windows.exe

  # ============================================
  # Create GitHub Release
  # ============================================
  create-release:
    needs: [parse-tag, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract Release Notes
        id: release_notes
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          VERSION="${{ needs.parse-tag.outputs.version }}"
          CHANGELOG="plugins/${PLUGIN}/CHANGELOG.md"

          if [ -f "$CHANGELOG" ]; then
            # Extract section for this version
            # Looks for ## [VERSION] and captures until next ## [
            NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" "$CHANGELOG")

            if [ -z "$NOTES" ]; then
              NOTES="Release ${PLUGIN} v${VERSION}"
            fi
          else
            NOTES="Release ${PLUGIN} v${VERSION}"
          fi

          # Write to file for multiline support
          echo "$NOTES" > release_notes.md

          # Debug output
          echo "Release notes:"
          cat release_notes.md

      - name: Get Product Name
        id: product_name
        run: |
          PLUGIN="${{ needs.parse-tag.outputs.plugin_name }}"
          PRODUCT_NAME=$(grep -E "PRODUCT_NAME" "plugins/${PLUGIN}/CMakeLists.txt" | head -1 | sed 's/.*PRODUCT_NAME "\([^"]*\)".*/\1/' || echo "$PLUGIN")
          # Strip CMake variable references like ${OUARICON_DEV_SUFFIX}
          PRODUCT_NAME=$(echo "$PRODUCT_NAME" | sed 's/\${[^}]*}//g')
          echo "name=$PRODUCT_NAME" >> $GITHUB_OUTPUT
          echo "Product name: $PRODUCT_NAME"

      - name: List Artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.product_name.outputs.name }} v${{ needs.parse-tag.outputs.version }}"
          body_path: release_notes.md
          files: |
            artifacts/macos-build/*
            artifacts/windows-build/*
          draft: false
          prerelease: false

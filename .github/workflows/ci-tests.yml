# C++ probe gate — MANUAL ONLY. One workflow, one `plugin` dispatch input.
#   * O-Octagon (PLAN-4.1 P86, P87, P88, P89) — the original probes.
#   * O-Strata (Stage 4 Round B, COMPAT-02) — the render harness on macOS, the
#     first MSVC compile + pluginval 10 on Windows.
#
# ---------------------------------------------------------------------------
# TRIGGER POLICY (2026-08-27): NO BUILD ON PUSH
# ---------------------------------------------------------------------------
# Standing rule for this repository: GitHub Actions must NOT build anything on
# an ordinary push or pull request. The only CI build path is the release tag
# pushed by the `/publish` slash command (handled by build-and-release.yml).
# This workflow is therefore `workflow_dispatch` only — run it by hand from the
# Actions tab (or `gh workflow run ci-tests.yml`) when you want the probes.
#
# It previously ran on every push/PR (P89: "a gate that can silently not run").
# That per-commit gate was retired deliberately in favour of zero unsolicited
# CI builds; the residual it covered — a JUCE bump shipping without the
# Layer-2 golden being recompiled — is now caught at release time only, or when
# this workflow is dispatched manually before a JUCE bump.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS SEPARATELY FROM build-and-release.yml
# ---------------------------------------------------------------------------
# build-and-release.yml carries eight Apple signing secrets and a standing rule
# forbidding any fork-reachable trigger. That rule is about TRIGGERS next to
# SECRETS, and plugins/O-Octagon/CMakeLists.txt states the matching prohibition
# from the other side: the test targets must not be added to that workflow.
#
# This file is orthogonal to both, not an exception to either:
#   * it consumes NO secrets;
#   * `permissions: contents: read` and nothing more;
#   * it builds and runs test binaries only — no signing, no notarisation, no
#     packaging, no Release (PLAN-4.1 D4).
#
# ---------------------------------------------------------------------------
# THE GATE IS THE BUILD STEP, NOT THE RUN STEP  (O-OCTAGON ONLY)
# ---------------------------------------------------------------------------
# O-Octagon's COMPAT-03 Layer-2 tripwire is a compile-time static_assert against
# a golden header GENERATED from parsed JUCE source (tests/unit/CMakeLists.txt).
# A JUCE bump that reorders AudioChannelSet's enum fails to COMPILE. A job that
# only executes a cached binary discharges nothing — negative control NC5
# (PLAN-4.1 P98) demonstrates exactly this. `cmake --build` must run here.
#
# This paragraph is about O-Octagon's tripwire and nothing else. O-Strata has no
# Layer-2 golden; for O-Strata the RUN step is the gate on macOS (the harness
# asserts its own rows) and the BUILD step is the gate on Windows (first MSVC
# compile), with pluginval as the run.
#
# ---------------------------------------------------------------------------
# THE TWO-PLUGIN CONTRACT (Stage 4 Round B, Decision 33)
# ---------------------------------------------------------------------------
# `plugin` is a required choice input. Each job runs the shared steps (checkout,
# JUCE, overrides, configure, and on Windows the WebView2 NuGet package, target
# resolution, VST3 build and pluginval) for whichever plugin was chosen, and the
# plugin-specific steps behind an `if:`. Dispatching one plugin never builds the
# other — SKIP_PLUGINS is constructed from the input.
#
# O-Strata, macOS — what this job CAN claim: the render harness passes every
# H1–H11 row and the orbit golden on a clean checkout.
#
# O-Strata, Windows — what this job CAN claim: the code compiles under MSVC; the
# VST3 loads; pluginval 10 OPENS THE EDITOR, so a silently-blank WebView surfaces
# as an Editor-Automation failure or a timeout rather than passing green.
#
# What it CANNOT claim: that the UI is CORRECT on Windows. No human sees it
# this milestone. Named deferral, owner none, blocked on hardware.
# ---------------------------------------------------------------------------

name: CI Tests

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin whose probes / Windows VST3 to build
        type: choice
        options:
          - O-Octagon
          - O-Strata
        default: O-Octagon
        required: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  # ============================================
  # macOS — build BOTH C++ test targets and run them, then build the dispatched
  # plugin's AU and validate it with Apple's auval. The AU pair is a full plugin
  # compile appended after the probes; before it was added this job produced no
  # plugin format at all.
  # ============================================
  probes-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          submodules: recursive

      # The JUCE version is DERIVED from one file, never mirrored. A second
      # literal in a second workflow drifts silently, and in the direction that
      # matters most: bump the release workflow and this one keeps proving the
      # OLD JUCE green — a gate reporting green about a JUCE nobody ships
      # (pattern_test_fixture_mirrors_drift_silently).
      - name: Read JUCE version
        id: juce
        run: |
          VERSION="$(tr -d '[:space:]' < .github/juce-version.txt)"
          if [ -z "$VERSION" ]; then
            echo "::error::.github/juce-version.txt is empty"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "JUCE version: $VERSION"

      - name: Setup JUCE
        run: |
          curl -L "https://github.com/juce-framework/JUCE/releases/download/${{ steps.juce.outputs.version }}/juce-${{ steps.juce.outputs.version }}-osx.zip" -o juce.zip
          unzip -q juce.zip
          echo "JUCE_DIR=${{ github.workspace }}/JUCE" >> $GITHUB_ENV

      # Must run HERE — after Setup JUCE, before the copy below. The post-copy
      # `grep -q "JUCE-NE-PATCH"` greps the vendored bytes themselves, so they
      # pass for any JUCE version; that is the hole this step closes. Only here
      # does a pristine JUCE tree still exist to fingerprint, and the copy
      # destroys it.
      - name: Verify JUCE overrides provenance
        shell: bash
        run: bash scripts/check-juce-overrides.sh --juce-root JUCE

      # Retained even though O-Octagon has no note-expression: the two greps are
      # a fail-fast that keeps BOTH workflows' JUCE byte-identical, and an
      # identical JUCE is what makes the Layer-2 golden comparable across them.
      - name: Apply JUCE overrides (note-expression — Dorico microtonal)
        run: |
          cp -R vendored/JUCE-overrides/modules/. JUCE/modules/
          grep -q "JUCE-NE-PATCH" JUCE/modules/juce_audio_processors_headless/utilities/juce_VST3ClientExtensions.h
          grep -q "JUCE-NE-PATCH" JUCE/modules/juce_audio_plugin_client/juce_audio_plugin_client_VST3.cpp
          echo "JUCE overrides applied."

      # OUARICON_BUILD_TESTS is a SHARED option name. A full-tree configure with
      # it ON enables the other plugins' harnesses (37 carry the option; those
      # have never run in CI and are not this job's problem) — SKIP_PLUGINS keeps
      # them out, built from the dispatched plugin.
      - name: Configure CMake
        run: |
          PLUGIN="${{ inputs.plugin }}"
          SKIP="O-Orbit"
          for d in plugins/*/; do
            name="$(basename "$d")"
            if [ -f "${d}CMakeLists.txt" ] && [ "$name" != "$PLUGIN" ]; then
              SKIP="$SKIP;$name"
            fi
          done
          echo "SKIP_PLUGINS=$SKIP"
          # Single-arch DELIBERATELY: no CMAKE_OSX_ARCHITECTURES. A universal
          # build roughly doubles the measured CPU cost for nothing here.
          #
          # OUARICON_RELEASE is NEVER passed: the render harness hard-codes the
          # DEV codes (JucePlugin_ManufacturerCode=0x4f754476 = OuDv), which all
          # probes were authored against. The root CMakeLists force-OFF does not
          # apply in CI ($ENV{CI} is set), so this is a deliberate OMISSION, not
          # a reliance on that guard.
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DOUARICON_BUILD_TESTS=ON \
            -DSKIP_PLUGINS="$SKIP"

      # THIS STEP IS THE GATE. See the header. The Layer-2 golden is regenerated
      # from the JUCE downloaded above and compared by static_assert during this
      # compile; a reordered AudioChannelSet fails here, before any binary runs.
      - name: Build test targets
        if: inputs.plugin == 'O-Octagon'
        run: |
          cmake --build build \
            --target O-Octagon-geometry-test O-Octagon-render-test \
            --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      - name: Run geometry unit probes
        if: inputs.plugin == 'O-Octagon'
        run: |
          ./build/plugins/O-Octagon/tests/unit/O-Octagon-geometry-test_artefacts/${{ env.BUILD_TYPE }}/O-Octagon-geometry-test

      - name: Run render-harness probes
        if: inputs.plugin == 'O-Octagon'
        run: |
          ./build/plugins/O-Octagon/tests/render-harness/O-Octagon-render-test_artefacts/${{ env.BUILD_TYPE }}/O-Octagon-render-test

      # ── O-Strata (Stage 4 Round B) ─────────────────────────────────────────
      # The render harness is the gate here: it asserts its own H1–H11 rows and
      # exits non-zero on any failure. Fixtures resolve through
      # STRATA_FIXTURES_DIR, so `--gate all` is cwd-independent and is run from
      # the repo root. The harness TU is macOS-only (CMake: OUARICON_BUILD_TESTS
      # AND APPLE), which is why the Windows job has no counterpart step.
      - name: Build render harness
        if: inputs.plugin == 'O-Strata'
        run: |
          cmake --build build \
            --target O-Strata-render-test \
            --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      - name: Run render harness (--gate all)
        if: inputs.plugin == 'O-Strata'
        run: |
          ./build/plugins/O-Strata/O-Strata-render-test_artefacts/${{ env.BUILD_TYPE }}/O-Strata-render-test --gate all

      # `!cancelled()` rather than plain `if:` — the orbit golden and `--gate all` are
      # INDEPENDENT checks, and a wall-clock row missing on a shared runner must not
      # skip the golden and leave it unmeasured. The job still fails if either fails.
      - name: Orbit golden
        if: ${{ !cancelled() && inputs.plugin == 'O-Strata' }}
        run: |
          ./build/plugins/O-Strata/O-Strata-render-test_artefacts/${{ env.BUILD_TYPE }}/O-Strata-render-test \
            --gate orbits --out "$RUNNER_TEMP/orbits.json"
          node plugins/O-Strata/tests/orbit-golden.mjs "$RUNNER_TEMP/orbits.json"

      # ── AU format gate (auval) ─────────────────────────────────────────────
      # THE COST, STATED PLAINLY RATHER THAN BURIED. Before these two steps this
      # job built C++ TEST BINARIES only — no plugin format was produced anywhere
      # in this workflow on macOS. `<TARGET>_AU` is therefore a FULL PLUGIN
      # COMPILE (JUCE modules, SharedCode, the AU wrapper), not a few lines
      # bolted onto an existing build, and it is a real addition to job runtime.
      # Weigh that figure before copying this pair into another job.
      #
      # WHAT THIS GATE CAN CLAIM: the AU bundle links, registers with the system
      # AudioComponent registry, and passes Apple's own validation battery. That
      # is the first automated coverage the AU format has ever had here — the
      # Windows job validates VST3, and nothing validated AU.
      #
      # WHAT IT CANNOT CLAIM: anything about the EDITOR. auval never opens the
      # WebView, so a silently-blank UI passes it green. pluginval 10 on the
      # windows-vst3 job is what covers that surface, and only on Windows.
      #
      # CODES ARE DERIVED, NEVER MIRRORED. No AU type, subtype or manufacturer
      # code is written into this file. scripts/verify-au-link.sh parses
      # PLUGIN_CODE and the AU main type from the plugin's own CMakeLists,
      # resolves the manufacturer code from the root CMakeLists, kicks the
      # component registrar, then validates. A literal here would be a second
      # copy of a value that lives elsewhere — exactly the drift the "Read JUCE
      # version" step above documents, and in the same direction that matters:
      # it keeps reporting green about something nobody ships.
      #
      # DEV BRANDING — TWO INDEPENDENT CHOICES THAT HAPPEN TO AGREE. Configure
      # CMake deliberately omits OUARICON_RELEASE, so the bundle built here
      # carries the `-dev` suffix and the dev manufacturer code; verify-au-link.sh
      # resolves the DEV branch of the root CMakeLists by design. Both sides
      # agree — but by coincidence of two separate decisions, not by
      # construction. Move either and auval hunts a component that was never
      # installed. Globbing the built bundle rather than naming it is what keeps
      # this step correct if that branding choice ever changes.
      #
      # `!cancelled()` ON BOTH STEPS, for the reason already written on the Orbit
      # golden step above: auval is an INDEPENDENT check from the render harness
      # and the golden, and a failing harness row must not leave the AU format
      # unmeasured. The asymmetry between the two is deliberate — the validate
      # step additionally requires its OWN build to have succeeded, because
      # validating a bundle that was never produced reports a registry miss
      # rather than a plugin defect, which is a misleading failure rather than a
      # useful one.
      - name: Build AU
        id: au_build
        if: ${{ !cancelled() }}
        run: |
          # A plugin's CMake target is often NOT the folder name (O-Octagon's is
          # OuariconOctagon), so a folder-derived `<plugin>_AU` target would not
          # exist. Resolved the same way the windows-vst3 job resolves it;
          # resolve-target.sh's contract requires the repo root as CWD, which is
          # the runner default.
          CMAKE_TARGET=$(bash scripts/resolve-target.sh cmake-target "${{ inputs.plugin }}")
          echo "cmake_target=$CMAKE_TARGET" >> $GITHUB_OUTPUT
          echo "Resolved CMake target: $CMAKE_TARGET"
          cmake --build build \
            --target "${CMAKE_TARGET}_AU" \
            --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      - name: Install AU and validate (auval)
        if: ${{ !cancelled() && steps.au_build.outcome == 'success' }}
        run: |
          TARGET="${{ steps.au_build.outputs.cmake_target }}"
          COMPONENT=$(ls -d "build/plugins/${{ inputs.plugin }}/${TARGET}_artefacts/${{ env.BUILD_TYPE }}/AU/"*.component | head -1)
          echo "Built AU: $COMPONENT"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          # Remove any same-named bundle BEFORE copying: a warm or re-run runner
          # must not be able to validate a stale bundle left by an earlier run.
          # Same registry-slot pinning hazard CLAUDE.md describes for local
          # installs, where an orphaned variant pins the slot to whichever
          # bundle was installed first.
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/$(basename "$COMPONENT")"
          cp -R "$COMPONENT" "$HOME/Library/Audio/Plug-Ins/Components/"
          bash scripts/verify-au-link.sh "${{ inputs.plugin }}"

  # ============================================
  # Windows — the FIRST MSVC compile of the dispatched plugin (PLAN-4.1 D3, P88
  # for O-Octagon; COMPAT-02 for O-Strata).
  #
  # What this job CAN claim: the code compiles under MSVC; the VST3 loads;
  # pluginval 10 OPENS THE EDITOR, so a silently-blank WebView surfaces as an
  # Editor-Automation failure or a timeout rather than passing green.
  #
  # What it CANNOT claim: that the UI is CORRECT on Windows. No human sees it
  # this milestone. Named deferral, owner none, blocked on hardware.
  #
  # The C++ test targets are macOS-only (D6): MSVC sees the plugin TUs only.
  # ============================================
  windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          submodules: recursive

      - name: Read JUCE version
        id: juce
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < .github/juce-version.txt)"
          if [ -z "$VERSION" ]; then
            echo "::error::.github/juce-version.txt is empty"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "JUCE version: $VERSION"

      - name: Setup JUCE
        run: |
          Invoke-WebRequest -Uri "https://github.com/juce-framework/JUCE/releases/download/${{ steps.juce.outputs.version }}/juce-${{ steps.juce.outputs.version }}-windows.zip" -OutFile juce.zip
          Expand-Archive -Path juce.zip -DestinationPath .
          echo "JUCE_DIR=${{ github.workspace }}/JUCE" >> $env:GITHUB_ENV

      # Must run HERE — after Setup JUCE, before the copy below. The post-copy
      # `grep -q "JUCE-NE-PATCH"` greps the vendored bytes themselves, so they
      # pass for any JUCE version; that is the hole this step closes. Only here
      # does a pristine JUCE tree still exist to fingerprint, and the copy
      # destroys it.
      - name: Verify JUCE overrides provenance
        shell: bash
        run: bash scripts/check-juce-overrides.sh --juce-root JUCE

      - name: Apply JUCE overrides (note-expression — Dorico microtonal)
        shell: bash
        run: |
          cp -R vendored/JUCE-overrides/modules/. JUCE/modules/
          grep -q "JUCE-NE-PATCH" JUCE/modules/juce_audio_processors_headless/utilities/juce_VST3ClientExtensions.h
          grep -q "JUCE-NE-PATCH" JUCE/modules/juce_audio_plugin_client/juce_audio_plugin_client_VST3.cpp
          echo "JUCE overrides applied."

      - name: Install WebView2 NuGet Package
        run: |
          Register-PackageSource -provider NuGet -name nugetRepository -location https://www.nuget.org/api/v2 -Force
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force

      - name: Configure CMake
        shell: bash
        run: |
          PLUGIN="${{ inputs.plugin }}"
          SKIP="O-Orbit"
          for d in plugins/*/; do
            name="$(basename "$d")"
            if [ -f "${d}CMakeLists.txt" ] && [ "$name" != "$PLUGIN" ]; then
              SKIP="$SKIP;$name"
            fi
          done
          echo "SKIP_PLUGINS=$SKIP"
          # No OUARICON_BUILD_TESTS here — the C++ test targets are macOS-only.
          # No OUARICON_RELEASE — same reason as the macOS job.
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DSKIP_PLUGINS="$SKIP"

      - name: Resolve CMake Target
        id: resolve
        shell: bash
        run: |
          # A plugin's CMake target is often NOT the folder name (O-Octagon's is
          # OuariconOctagon — build_script_target_name_vs_folder, 11 of 37 differ).
          CMAKE_TARGET=$(bash scripts/resolve-target.sh cmake-target "${{ inputs.plugin }}")
          echo "cmake_target=$CMAKE_TARGET" >> $GITHUB_OUTPUT
          echo "Resolved CMake target: $CMAKE_TARGET"

      - name: Build VST3
        run: |
          $TARGET = "${{ steps.resolve.outputs.cmake_target }}"
          cmake --build build --target "${TARGET}_VST3" --config ${{ env.BUILD_TYPE }}

      - name: Validate with pluginval (strictness 10)
        shell: bash
        run: |
          TARGET="${{ steps.resolve.outputs.cmake_target }}"
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip
          7z x pluginval.zip -opluginval_bin
          VST3=$(ls -d "build/plugins/${{ inputs.plugin }}/${TARGET}_artefacts/${{ env.BUILD_TYPE }}/VST3/"*.vst3 | head -1)
          echo "Validating: $VST3"
          # 600 s: a fresh Windows runner has a cold WebView2 (no cache), so the
          # first editor open can be slow. The release workflow's Windows job
          # justifies the same figure against the same cold first-open.
          ./pluginval_bin/pluginval.exe --strictness-level 10 --timeout-ms 600000 --validate "$VST3" | tee pluginval-log.txt

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (v4.6.2)
        with:
          name: pluginval-windows-${{ inputs.plugin }}-log
          path: pluginval-log.txt
